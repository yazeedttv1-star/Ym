<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة إكس أو - Tic Tac Toe</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .status {
            font-size: 1.5rem;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 10px;
            background-color: rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .cell {
            width: 100px;
            height: 100px;
            background-color: #ffffff;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
        }

        .cell:hover {
            background-color: #f0f0f0;
            transform: scale(1.03);
        }

        .cell.x {
            color: #ff4b2b;
        }

        .cell.o {
            color: #00d2ff;
        }

        .btn-restart {
            margin-top: 25px;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #1e3c72;
            background-color: #fff;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }

        .btn-restart:hover {
            background-color: #f0f0f0;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .btn-restart:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <h1>لعبة إكس أو (XO)</h1>
    <div class="status" id="status">دور اللاعب: <span style="color: #ff4b2b;">X</span></div>

    <div class="board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
    </div>

    <button class="btn-restart" id="restartBtn">إعادة اللعب 🔄</button>

    <!-- Firebase SDK (ES Modules) -->
    <script type="module">
        // Import Functions from Firebase SDKs
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyB5jFiYrMnH_tvaJAq5QmATI43Pu3F0Yaw",
            authDomain: "my-project-f00cd.firebaseapp.com",
            databaseURL: "https://my-project-f00cd-default-rtdb.firebaseio.com",
            projectId: "my-project-f00cd",
            storageBucket: "my-project-f00cd.firebasestorage.app",
            messagingSenderId: "346249386295",
            appId: "1:346249386295:web:5652b6b2309b795c89a2b2",
            measurementId: "G-0XL21X43PR"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);

        // --- منطق اللعبة (Game Logic) ---
        const cells = document.querySelectorAll('.cell');
        const statusText = document.getElementById('status');
        const restartBtn = document.getElementById('restartBtn');

        let boardState = ["", "", "", "", "", "", "", "", ""];
        let currentPlayer = "X";
        let isGameActive = true;

        const winningConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // الصفوف
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // الأعمدة
            [0, 4, 8], [2, 4, 6]             // الأقطار
        ];

        function handleCellClick(e) {
            const cell = e.target;
            const index = cell.getAttribute('data-index');

            if (boardState[index] !== "" || !isGameActive) {
                return;
            }

            updateCell(cell, index);
            checkResult();
        }

        function updateCell(cell, index) {
            boardState[index] = currentPlayer;
            cell.textContent = currentPlayer;
            cell.classList.add(currentPlayer.toLowerCase());
        }

        function switchPlayer() {
            currentPlayer = currentPlayer === "X" ? "O" : "X";
            const color = currentPlayer === "X" ? "#ff4b2b" : "#00d2ff";
            statusText.innerHTML = `دور اللاعب: <span style="color: ${color};">${currentPlayer}</span>`;
        }

        function checkResult() {
            let roundWon = false;

            for (let i = 0; i < winningConditions.length; i++) {
                const [a, b, c] = winningConditions[i];
                if (boardState[a] === "" || boardState[b] === "" || boardState[c] === "") {
                    continue;
                }
                if (boardState[a] === boardState[b] && boardState[b] === boardState[c]) {
                    roundWon = true;
                    break;
                }
            }

            if (roundWon) {
                const color = currentPlayer === "X" ? "#ff4b2b" : "#00d2ff";
                statusText.innerHTML = `🎉 الفائز هو اللاعب: <span style="color: ${color};">${currentPlayer}</span>!`;
                isGameActive = false;
                return;
            }

            if (!boardState.includes("")) {
                statusText.innerHTML = "تعادل! 🤝";
                isGameActive = false;
                return;
            }

            switchPlayer();
        }

        function restartGame() {
            boardState = ["", "", "", "", "", "", "", "", ""];
            currentPlayer = "X";
            isGameActive = true;
            statusText.innerHTML = `دور اللاعب: <span style="color: #ff4b2b;">X</span>`;
            cells.forEach(cell => {
                cell.textContent = "";
                cell.classList.remove('x', 'o');
            });
        }

        cells.forEach(cell => cell.addEventListener('click', handleCellClick));
        restartBtn.addEventListener('click', restartGame);
    </script>
</body>
</html>

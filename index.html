<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>منصة سيجما التعليمية</title>
<meta name="application-version" content="4.1.0">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" id="mf">
<link rel="apple-touch-icon" id="ai">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f8fc;--surface:#fff;--surface2:#f8fafc;--surface3:#eef2f7;--tx:#0b1220;--tx2:#334155;--mu:#94a3b8;--ac:#2563eb;--ac2:#1d4ed8;--ac-soft:#dbeafe;--ok:#10b981;--er:#ef4444;--warn:#f59e0b;--bd:#e5eaf2;--r:16px;--r-sm:10px;--r-lg:22px;--r-xl:28px;--shadow:0 4px 12px rgba(15,23,42,.06),0 2px 4px rgba(15,23,42,.04);--shadow-lg:0 20px 40px -12px rgba(15,23,42,.18),0 8px 20px -8px rgba(15,23,42,.12);--grad-brand:linear-gradient(135deg,#2563eb 0%,#3b82f6 50%,#8b5cf6 100%);--ease:cubic-bezier(.4,0,.2,1)}
html.dark{--bg:#070b14;--surface:#0f172a;--surface2:#111a2e;--surface3:#1a2440;--tx:#f1f5f9;--tx2:#cbd5e1;--mu:#64748b;--ac:#60a5fa;--ac2:#3b82f6;--ac-soft:#1e3a8a;--bd:#1e293b;--shadow:0 4px 12px rgba(0,0,0,.3);--shadow-lg:0 20px 40px -12px rgba(0,0,0,.6)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{min-height:100%;height:auto;-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:Cairo,system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:radial-gradient(1200px 600px at 100% -10%,rgba(59,130,246,.10),transparent 60%),radial-gradient(800px 500px at -10% 110%,rgba(139,92,246,.08),transparent 60%),var(--bg);color:var(--tx);min-height:100vh;min-height:100dvh;padding-bottom:calc(120px + env(safe-area-inset-bottom));overflow-x:hidden;-webkit-user-select:none;user-select:none;transition:background .3s,color .3s}
html.dark body{background:radial-gradient(1200px 600px at 100% -10%,rgba(59,130,246,.12),transparent 60%),radial-gradient(800px 500px at -10% 110%,rgba(139,92,246,.10),transparent 60%),var(--bg)}
input,select,textarea{-webkit-user-select:text;user-select:text}
h1,h2,h3{font-weight:800;line-height:1.3}
h2{font-size:20px;margin-bottom:16px;color:var(--tx)}
#loading-overlay{position:fixed;top:0;right:0;bottom:0;left:0;z-index:9999;background:rgba(248,250,252,.85);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .3s ease}
html.dark #loading-overlay{background:rgba(11,18,32,.85)}
#loading-overlay.hide{opacity:0;pointer-events:none}
.spinner{width:40px;height:40px;border:4px solid var(--ac-soft);border-top-color:var(--ac);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}
.skeleton{background:linear-gradient(90deg,var(--surface2) 25%,var(--bd) 50%,var(--surface2) 75%);background-size:200% 100%;animation:sk 1.5s infinite;border-radius:8px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.platform-message{position:fixed;top:0;left:0;right:0;z-index:5000;background:var(--grad-brand);color:#fff;padding:18px 50px 18px 20px;box-shadow:0 6px 30px rgba(37,99,235,.4);display:flex;align-items:center;gap:14px;animation:slideDown .4s ease;border-bottom-left-radius:20px;border-bottom-right-radius:20px}
@keyframes slideDown{from{transform:translateY(-100%);opacity:0}to{transform:translateY(0);opacity:1}}
.platform-message .pm-icon{font-size:32px;flex-shrink:0}
.platform-message .pm-content{flex:1}
.platform-message .pm-content b{display:block;font-size:14px;margin-bottom:4px;opacity:.9}
.platform-message .pm-content p{font-size:15px;line-height:1.6;white-space:pre-wrap;font-weight:600}
.platform-message .pm-close{position:absolute;top:10px;left:10px;background:rgba(255,255,255,.2);border:0;color:#fff;width:32px;height:32px;border-radius:50%;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.platform-message .pm-close:hover{background:rgba(255,255,255,.35)}
.topbar{position:sticky;top:0;z-index:50;padding:14px 18px calc(14px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(255,255,255,.82);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border-bottom:1px solid var(--bd)}
html.dark .topbar{background:rgba(15,23,42,.75)}
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{width:44px;height:44px;border-radius:12px;flex:0 0 44px;background:transparent;display:grid;place-items:center;box-shadow:var(--shadow);overflow:hidden}
.brand-logo img{width:100%;height:100%;object-fit:contain}
.brand-name{font-weight:800;font-size:16px;line-height:1.1}
.brand-sub{font-size:11px;color:var(--mu);font-weight:600}
.topbar-actions{display:flex;align-items:center;gap:8px}
.icon-btn{width:42px;height:42px;border-radius:999px;border:1px solid var(--bd);background:var(--surface);color:var(--tx);cursor:pointer;display:grid;place-items:center;position:relative;transition:transform .15s var(--ease),box-shadow .2s,background .2s;box-shadow:var(--shadow)}
.icon-btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-lg);background:var(--surface2)}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn .dot{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;padding:0 5px;background:var(--er);color:#fff;border-radius:999px;border:2px solid var(--surface);font-size:10px;font-weight:800;display:grid;place-items:center}
.avatar-btn{width:42px;height:42px;border-radius:999px;padding:0;overflow:hidden;border:2px solid var(--surface);box-shadow:0 8px 30px -8px rgba(37,99,235,.45);cursor:pointer;background:var(--grad-brand)}
.avatar-btn img{width:100%;height:100%;object-fit:cover;display:block}
main{max-width:1100px;margin:0 auto;padding:20px 18px 40px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 16px}
.section-title{font-size:20px;font-weight:800;letter-spacing:-.3px}
.section-sub{font-size:13px;color:var(--mu);font-weight:600;margin-top:2px}
.section-link{font-size:13px;font-weight:700;color:var(--ac);cursor:pointer;background:none;border:0;padding:6px 10px;border-radius:999px}
.section-link:hover{background:var(--ac-soft)}
.hero{position:relative;overflow:hidden;background:var(--grad-brand);color:#fff;border-radius:var(--r-xl);padding:24px 22px;margin-bottom:22px;box-shadow:0 8px 30px -8px rgba(37,99,235,.45)}
.hero::before{content:"";position:absolute;top:-60px;left:-60px;width:200px;height:200px;background:radial-gradient(circle,rgba(255,255,255,.25),transparent 70%);border-radius:50%}
.hero::after{content:"";position:absolute;bottom:-80px;right:-40px;width:220px;height:220px;background:radial-gradient(circle,rgba(255,255,255,.15),transparent 70%);border-radius:50%}
.hero-content{position:relative;z-index:1}
.hero-eyebrow{font-size:12px;opacity:.85;font-weight:700;margin-bottom:6px}
.hero-title{font-size:24px;font-weight:900;line-height:1.25;margin-bottom:6px;letter-spacing:-.5px}
.hero-desc{font-size:14px;opacity:.9;line-height:1.6;margin-bottom:18px;max-width:420px}
.hero-cta{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.3);padding:10px 18px;border-radius:999px;font-weight:800;font-size:14px;cursor:pointer;transition:.2s var(--ease);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.hero-cta:hover{background:rgba(255,255,255,.28);transform:translateY(-1px)}
.hero-cta svg{width:18px;height:18px;fill:currentColor}
.hero-stats{display:flex;gap:18px;margin-top:18px;position:relative;z-index:1}
.hero-stat{display:flex;flex-direction:column}
.hero-stat b{font-size:20px;font-weight:900}
.hero-stat span{font-size:11px;opacity:.85;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.teacher-card{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-lg);overflow:hidden;cursor:pointer;text-align:center;transition:transform .25s var(--ease),box-shadow .25s,border-color .2s;box-shadow:var(--shadow)}
.teacher-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:var(--ac-soft)}
.teacher-photo{aspect-ratio:1;background:var(--grad-brand);position:relative;overflow:hidden}
.teacher-photo img{width:100%;height:100%;object-fit:cover;display:block}
.teacher-body{padding:12px 10px 14px}
.teacher-name{font-weight:800;font-size:14px;color:var(--tx);line-height:1.3}
.teacher-meta{font-size:11px;color:var(--mu);font-weight:600;margin-top:3px}
.list{display:flex;flex-direction:column;gap:10px}
.row{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r);padding:16px 18px;margin-bottom:12px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:.25s var(--ease);flex-wrap:wrap}
.row:hover{border-color:var(--ac);box-shadow:var(--shadow-lg)}
.row:active{transform:scale(.995)}
.row>div{flex:1;min-width:0}
.row b{font-size:15px;display:block;color:var(--tx)}
.row small{color:var(--mu);font-size:13px;display:block;margin-top:2px}
.video-row{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:.2s var(--ease);box-shadow:var(--shadow)}
.video-row:hover{border-color:var(--ac-soft);box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.video-thumb{width:56px;height:56px;border-radius:12px;flex:0 0 56px;background:var(--grad-brand);display:grid;place-items:center;color:#fff;font-size:22px;overflow:hidden}
.video-thumb img{width:100%;height:100%;object-fit:cover}
.video-body{flex:1;min-width:0}
.video-title{font-weight:800;font-size:14px;line-height:1.3;color:var(--tx);margin-bottom:3px}
.video-meta{font-size:12px;color:var(--mu);font-weight:600;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.video-progress{height:5px;background:var(--surface3);border-radius:999px;overflow:hidden;margin-top:8px}
.video-progress span{display:block;height:100%;background:var(--grad-brand);border-radius:inherit}
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap;background:var(--surface3);color:var(--tx2)}
.badge.ok{background:#d1fae5;color:#065f46}
.badge.warn{background:#fef3c7;color:#92400e}
.badge.er{background:#fee2e2;color:#991b1b}
.badge.brand{background:var(--ac-soft);color:var(--ac2)}
html.dark .badge.ok{background:rgba(16,185,129,.2);color:#6ee7b7}
html.dark .badge.warn{background:rgba(245,158,11,.2);color:#fcd34d}
html.dark .badge.er{background:rgba(239,68,68,.2);color:#fca5a5}
html.dark .badge.brand{background:rgba(37,99,235,.2);color:#93c5fd}
.b{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--tx2);display:inline-block}
.b.g{background:#d1fae5;color:#065f46}
.b.r{background:#fee2e2;color:#991b1b}
.b.y{background:#fef3c7;color:#92400e}
html.dark .b.g{background:#064e3b;color:#6ee7b7}
html.dark .b.r{background:#7f1d1d;color:#fca5a5}
html.dark .b.y{background:#78350f;color:#fcd34d}
.g{color:var(--ok)}.r{color:var(--er)}.y{color:var(--warn)}
.code{font-family:'Courier New',monospace;font-size:15px;letter-spacing:2px;direction:ltr;display:inline-block;background:var(--surface2);padding:3px 10px;border-radius:6px;color:var(--ac2);font-weight:700}
.mut{color:var(--mu);text-align:center;padding:40px 20px}
.view-counter{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--mu);background:var(--surface2);padding:3px 8px;border-radius:99px}
.view-counter svg{width:12px;height:12px;fill:currentColor}
button,.btn{font-family:inherit;font-weight:800;border:0;border-radius:var(--r-sm);padding:12px 20px;background:var(--grad-brand);color:#fff;cursor:pointer;transition:.2s var(--ease);font-size:14px;touch-action:manipulation;box-shadow:0 8px 30px -8px rgba(37,99,235,.45);display:inline-flex;align-items:center;justify-content:center;gap:8px}
button:hover{transform:translateY(-1px);filter:brightness(1.05)}
button:active{transform:scale(.97)}
button:disabled{opacity:.6;cursor:not-allowed;transform:none;box-shadow:none}
button.s{background:var(--surface2);color:var(--tx);box-shadow:var(--shadow);border:1px solid var(--bd)}
button.s:hover{background:var(--surface3)}
button.d{background:linear-gradient(135deg,#ef4444,#dc2626);box-shadow:0 8px 30px -8px rgba(239,68,68,.45)}
button.g{background:linear-gradient(135deg,#10b981,#059669);box-shadow:0 8px 30px -8px rgba(16,185,129,.45)}
label{font-size:13px;color:var(--tx2);font-weight:700;display:block;margin-bottom:6px}
input,select,textarea{font-family:inherit;font-size:16px;width:100%;padding:12px 14px;border-radius:var(--r-sm);border:1px solid var(--bd);background:var(--surface);color:var(--tx);margin-bottom:14px;transition:.15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 4px rgba(59,130,246,.15)}
.box{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-lg);padding:22px;margin-bottom:20px;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px;text-align:right;border-bottom:1px solid var(--bd)}
th{background:var(--surface2);font-weight:700;color:var(--tx2);font-size:12px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r)}
.player-wrap{width:100%;margin-bottom:16px;background:transparent}
.pl{position:relative;background:#000;border-radius:var(--r-lg);overflow:hidden;width:100%;height:0;padding-bottom:56.25%;margin:0 auto;box-shadow:var(--shadow-lg)}
@supports (aspect-ratio:16/9){.pl{height:auto;padding-bottom:0;aspect-ratio:16/9}}
.pl iframe,.pl video{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;border:0;display:block;background:#000;pointer-events:none;object-fit:contain}
.pl.is-embed iframe{pointer-events:auto}
.pl.is-yt iframe{pointer-events:none!important;transform:scale(1.01)!important}
.pl .video-blocker{position:absolute;top:0;right:0;bottom:0;left:0;z-index:99;background:transparent;cursor:pointer;display:block;touch-action:none}
.pl .end-cover{position:absolute;top:0;right:0;bottom:0;left:0;z-index:100;background:#000;display:none;align-items:center;justify-content:center}
.pl .end-cover button{background:var(--ac);color:#fff;padding:12px 22px;font-size:15px}
.pl .big-play-overlay{position:absolute;top:0;right:0;bottom:0;left:0;z-index:101;display:none;align-items:center;justify-content:center;background:transparent;pointer-events:none;transition:opacity .1s}
.pl .big-play-btn{width:80px;height:80px;border-radius:50%;background:rgba(15,15,15,.7);border:2px solid #fff;display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:auto;transition:transform .2s;padding:0}
.pl .big-play-btn:hover{transform:scale(1.1);background:rgba(15,15,15,.9)}
.pl .big-play-btn svg{width:40px;height:40px;fill:#fff;margin-left:4px}
.wm{position:absolute;pointer-events:none;z-index:22;display:flex;align-items:center;gap:6px;font-size:12px;opacity:.45;background:rgba(0,0,0,.6);padding:4px 10px;border-radius:99px;animation:mv 24s linear infinite alternate;direction:ltr;color:#fff;white-space:nowrap}
.wm img{width:22px;height:22px;border-radius:50%;object-fit:cover}
@keyframes mv{0%{top:20%;left:4%}25%{top:70%;left:55%}50%{top:35%;left:70%}75%{top:80%;left:8%}100%{top:20%;left:60%}}
.custom-player-ctrl{direction:ltr;background:#1e1e2f;padding:10px 14px;border-radius:var(--r-sm);margin-top:8px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px}
.custom-player-ctrl .ctrl-left{display:flex;align-items:center;flex-shrink:0}
.custom-player-ctrl .ctrl-right{display:flex;align-items:center;flex-shrink:0}
.custom-player-ctrl .icon-btn{background:transparent;color:#fff;border:0;border-radius:0;padding:6px;margin:0 2px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:0;min-width:36px;min-height:36px;transition:transform .15s;touch-action:manipulation}
.custom-player-ctrl .icon-btn:hover{transform:scale(1.1);background:transparent;box-shadow:none}
.custom-player-ctrl .icon-btn svg{width:22px;height:22px;fill:#fff}
.custom-player-ctrl .time{font-family:Cairo,sans-serif;font-size:12px;font-weight:600;color:#fff;direction:ltr;margin:0 4px;white-space:nowrap;min-width:36px;text-align:center}
.custom-player-ctrl .time-sep{color:#fff;margin:0 2px}
.custom-player-ctrl .slider-wrap{position:relative;flex:1;height:4px;background:rgba(255,255,255,.3);border-radius:99px;margin:0 10px;min-width:80px;order:0}
.custom-player-ctrl .slider-fill{position:absolute;top:0;left:0;height:100%;width:0;background:#ff0000;border-radius:99px;pointer-events:none}
.custom-player-ctrl .slider-wrap input[type=range]{position:absolute;left:0;top:-9px;width:100%;height:22px;margin:0;padding:0;border:0;border-radius:0;background:transparent;box-shadow:none;outline:none;-webkit-appearance:none;appearance:none;cursor:pointer;z-index:2;touch-action:none}
.custom-player-ctrl .slider-wrap input[type=range]:focus{box-shadow:none;outline:none}
.custom-player-ctrl .slider-wrap input[type=range]::-webkit-slider-runnable-track{height:22px;background:transparent;border:0}
.custom-player-ctrl .slider-wrap input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;background:#ff0000;border:0;margin-top:4px;cursor:pointer}
.custom-player-ctrl .slider-wrap input[type=range]::-moz-range-track{height:22px;background:transparent;border:0}
.custom-player-ctrl .slider-wrap input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#ff0000;border:0;cursor:pointer}
.player-wrap:fullscreen{background:#000;display:flex;flex-direction:column;justify-content:center;width:100%;height:100%;margin:0;padding:0}
.player-wrap:-webkit-full-screen{background:#000;display:flex;flex-direction:column;justify-content:center;width:100%;height:100%;margin:0;padding:0}
.player-wrap:fullscreen .pl,.player-wrap:-webkit-full-screen .pl{flex:1;min-height:0;height:auto;padding-bottom:0;aspect-ratio:auto;border-radius:0;box-shadow:none}
.player-wrap:fullscreen .custom-player-ctrl,.player-wrap:-webkit-full-screen .custom-player-ctrl{border-radius:0;margin-top:0}
@media (orientation:landscape) and (pointer:coarse){
body.is-watching .bottombar{display:none!important}
body.is-watching main{padding:0!important}
body.is-watching .player-wrap{position:fixed!important;top:0!important;right:0!important;bottom:0!important;left:0!important;width:100vw!important;height:100vh!important;z-index:99999!important;margin:0!important;padding:0!important;background:#000!important;display:flex!important;flex-direction:column!important}
body.is-watching .pl{flex:1!important;min-height:0!important;height:auto!important;width:100%!important;padding-bottom:0!important;aspect-ratio:auto!important;border-radius:0!important;box-shadow:none!important;margin:0!important}
body.is-watching .custom-player-ctrl{width:100%!important;border-radius:0!important;margin-top:0!important;padding-bottom:env(safe-area-inset-bottom)!important}
}
.bottombar{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:60;width:calc(100% - 28px);max-width:520px;background:rgba(255,255,255,.85);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border:1px solid var(--bd);border-radius:var(--r-xl);padding:8px;display:flex;justify-content:space-between;gap:2px;box-shadow:0 20px 50px -12px rgba(15,23,42,.25),0 4px 12px rgba(15,23,42,.06)}
html.dark .bottombar{background:rgba(15,23,42,.85);box-shadow:0 20px 50px -12px rgba(0,0,0,.6)}
.nav-item{flex:1;background:transparent;border:0;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mu);cursor:pointer;border-radius:var(--r);font-size:10px;font-weight:800;font-family:inherit;transition:.2s var(--ease);box-shadow:none}
.nav-item svg{width:22px;height:22px;fill:currentColor;transition:transform .2s var(--ease)}
.nav-item:hover{color:var(--tx2);background:transparent;box-shadow:none;transform:none}
.nav-item.on{color:var(--ac);background:var(--ac-soft)}
html.dark .nav-item.on{background:rgba(37,99,235,.18);color:#93c5fd}
.nav-item.on svg{transform:translateY(-1px) scale(1.08)}

}
}

async function buildStudentStats(){
const myVids=mineVideos||{};
const mine={};
for(const vid of Object.keys(myVids)){const rec=await G('logs/'+vid+'/'+U.uid);if(rec)mine[vid]=rec}
const totalVideos=Object.keys(videos).length;
const watchedCount=Object.keys(mine).length;
const openedCount=Object.keys(myVids).length;
const lockedCount=Math.max(0,totalVideos-openedCount);
const rows=[];
for(const [vid,v] of Object.entries(videos)){
const teacher=teachers[v.teacherId];
const log=mine[vid];
const isOpen=A||IS_SUPERVISOR||v.free||!!myVids[vid];
let status='';
if(v.disabled&&!A&&!IS_SUPERVISOR)status='<span class="b r">موقوف</span>';
else if(!isOpen)status='<span class="b y">يحتاج كود</span>';
else if(log&&log.completed)status='<span class="b g">حضره كاملاً</span>';
else if(log)status='<span class="b y">شاهد جزءاً</span>';
else status='<span class="b g">مفتوح</span>';
rows.push({vid,title:v.title||'-',teacher:teacher?.name||'-',grade:v.grade||'-',desc:v.desc||'',isOpen,status,log,watched:!!log,seconds:log?(log.seconds||0):0,disabled:!!v.disabled});
}
let filtered=rows;
if(studentStatsFilter==='watched')filtered=rows.filter(r=>r.watched);
else if(studentStatsFilter==='available')filtered=rows.filter(r=>r.isOpen&&!r.disabled);
else if(studentStatsFilter==='locked')filtered=rows.filter(r=>!r.isOpen);
const score=r=>r.watched?3:(r.isOpen?2:1);
filtered.sort((a,b)=>{const d=score(b)-score(a);if(d)return d;return (b.log?.lastAt||0)-(a.log?.lastAt||0)});
const summary=`<div class="stats-summary"><div class="stat-box"><div class="stat-num">${totalVideos}</div><div class="stat-label">إجمالي المحاضرات</div></div><div class="stat-box ok"><div class="stat-num">${openedCount}</div><div class="stat-label">مفتوحة لك</div></div><div class="stat-box warn"><div class="stat-num">${lockedCount}</div><div class="stat-label">تحتاج كود</div></div><div class="stat-box"><div class="stat-num">${watchedCount}</div><div class="stat-label">حضرتها</div></div></div>`;
const filterBar=`<div class="stats-filter"><button class="${studentStatsFilter==='all'?'on':''}" onclick="setStatsFilter('all')">الكل</button><button class="${studentStatsFilter==='watched'?'on':''}" onclick="setStatsFilter('watched')">حضرتها (${watchedCount})</button><button class="${studentStatsFilter==='available'?'on':''}" onclick="setStatsFilter('available')">مفتوحة (${openedCount})</button><button class="${studentStatsFilter==='locked'?'on':''}" onclick="setStatsFilter('locked')">مقفلة (${lockedCount})</button></div>`;
if(!filtered.length)return `<div class="box"><h2 style="color:var(--ac2);margin-bottom:14px">📊 إحصائياتي</h2>${summary}${filterBar}<div class="mut" style="padding:30px">لا توجد محاضرات مطابقة.</div></div>`;
const tableRows=filtered.map(r=>{
const watchBtn=r.isOpen&&!r.disabled?`<button class="s" style="padding:5px 10px;font-size:11px;border-radius:8px" onclick="go('watch','${esc(r.vid)}')">مشاهدة</button>`:(!r.disabled?`<button style="padding:5px 10px;font-size:11px;border-radius:8px" onclick="go('code','${esc(r.vid)}')">فتح بكود</button>`:'-');
const mins=Math.round(r.seconds/60);
return `<tr><td><b>${esc(r.title)}</b>${r.desc?`<small style="display:block;color:var(--mu);font-size:11px;margin-top:2px">${esc(r.desc)}</small>`:''}</td><td>${esc(r.teacher)}</td><td><span class="grade-chip">${esc(r.grade)}</span></td><td>${r.status}</td><td>${r.watched?`<span style="font-size:12px;color:var(--tx2)">${mins} دقيقة</span>`:'-'}</td><td>${watchBtn}</td></tr>`;
}).join('');
return `<div class="box"><h2 style="color:var(--ac2);margin-bottom:14px">📊 إحصائياتي</h2>${summary}<h3 style="margin:20px 0 10px;font-size:16px;color:var(--tx)">سجل المحاضرات</h3>${filterBar}<div class="stats-table-wrap"><table class="stats-table"><thead><tr><th>المحاضرة</th><th>المدرس</th><th>الصف</th><th>الحالة</th><th>المشاهدة</th><th>إجراء</th></tr></thead><tbody>${tableRows}</tbody></table></div></div>`;
}

async function updateProfilePhoto(){

if(f.size>8*1024*1024){toast('حجم الصورة يجب ألا يتجاوز 8 ميجابايت');input.value='';return}
try{
toast('جارٍ رفع الصورة...');
const data=await img(f,200);
await update(R('users/'+U.uid),{photo:data});
myPhoto=data;
await updateProfile(auth.currentUser,{photoURL:data}).catch(()=>{});
if(input)input.value='';
toast('✅ تم تحديث الصورة');render();
}catch(e){toast('تعذر تحديث الصورة: '+e.message)}
}
async function changePassword(){
const newPass=$('#new-pass')?.value||'';
const confirmPass=$('#confirm-pass')?.value||'';
if(newPass.length<6)return toast('كلمة المرور يجب أن تكون 6 أحرف على الأقل');
if(newPass!==confirmPass)return toast('كلمتا المرور غير متطابقتين');
const currentPass=$('#current-pass')?.value||'';
if(!currentPass)return toast('اكتب كلمة المرور الحالية');
try{
const credential=EmailAuthProvider.credential(auth.currentUser.email,currentPass);
await reauthenticateWithCredential(auth.currentUser,credential);
await updatePassword(auth.currentUser,newPass);
toast('✅ تم تغيير كلمة المرور');
['#new-pass','#confirm-pass','#current-pass'].forEach(id=>{const el=$(id);if(el)el.value=''});
go('settings');
}catch(e){if(e.code==='auth/requires-recent-login')toast('سجّل الخروج ثم الدخول مرة أخرى');else toast('تعذر تغيير كلمة المرور: '+(e.message||''))}
}

}
};
const subscribe=(path,key,loadedKey)=>{
const unsub=onValue(R(path),snap=>{studentsState[key]=snap.val()||{};studentsState[loadedKey]=true;if(key==='users'){studentsCache=studentsState.users;adminUsersList=studentsCache}studentsState.error=null;paint()},err=>{studentsState.error=err?.message||err?.code||'تعذر قراءة '+path;console.error('Firebase students listener error:',path,err);paint()});
studentsLiveUnsubs.push(unsub);
};
subscribe('users','users','usersLoaded');subscribe('bans','bans','bansLoaded');subscribe('bansByPhone','bansByPhone','phonesLoaded');
studentsLiveUnsub=()=>{studentsLiveUnsubs.forEach(fn=>{try{fn()}catch(e){}});studentsLiveUnsubs=[];studentsLiveUnsub=null};
}
if(!studentsState.usersLoaded){
const first=await GTry('users');
if(!first.ok){studentsState.error=first.error;return studentsLoadError(first.error)}
studentsState.users=first.val||{};studentsState.usersLoaded=true;studentsCache=studentsState.users;adminUsersList=studentsCache;studentsCacheAt=Date.now();
}

if(t==='lab')return labActiveLab?vLabScreen():vLabHub();
if(t==='free')return vFreeLab();
if(t==='quiz')return quizActiveLevel?vQuizScreen():vQuizHome();
if(t==='memory'){if(!memState)memStart();return vMemory()}
if(t==='hunt'){if(!huntState)huntStart();return vHunt()}
if(t==='order'){if(!orderState)orderStart();return vOrder()}
if(t==='balance'){if(!balState)balStart();return vBalance()}
if(t==='who'){if(!whoState)whoStart();return vWho()}
if(t==='tf'){if(!tfState)tfStart();return vTF()}
if(t==='speed'){if(!speedState)speedStart();return vSpeed()}
return vGamesHub();
}
function resetGames(){
if(quizTimer){clearTimeout(quizTimer);quizTimer=null}
quizActiveLevel=null;quizCurrentIndex=0;quizAnswered=false;window._quizOrder=null;
labActiveLab=null;labCurrentExpIdx=0;labSelectedEls=[];labSelectedTool=null;labShowingResult=false;labLastResult=null;
freeLab={els:[],tool:null,result:null};
memState=null;huntState=null;orderState=null;balState=null;
whoState=null;tfState=null;speedState=null;
}
function openGame(key){
if(!isLabOn(key))return toast('هذه اللعبة موقوفة حالياً');
resetGames();
if(key==='memory')memStart();
else if(key==='hunt')huntStart();
else if(key==='order')orderStart();
else if(key==='balance')balStart();
else if(key==='who')whoStart();
else if(key==='tf')tfStart();
else if(key==='speed')speedStart();
go('games','',key);
}
function gameBack(){resetGames();go('games','','hub')}
function openLabHub(){if(!isLabOn('lab'))return toast('المختبر موقوف حالياً');resetGames();go('games','','lab')}
function openLab(lab){
if(!LAB_EXPERIMENTS[lab])return;
if(!isLabOn('lab'))return toast('المختبر موقوف حالياً');
resetGames();
const d=labDone(lab);
labActiveLab=lab;labCurrentExpIdx=d>=LAB_EXPERIMENTS[lab].length?0:d;
go('games','','lab');
}
function openFree(){if(!isLabOn('free'))return toast('هذه اللعبة موقوفة حالياً');resetGames();go('games','','free')}
function gameTop(action,label,badges=''){return `<div class="game-top"><button class="section-link" onclick="${action}">← ${label}</button><div class="game-badges">${badges}</div></div>`}
function gameHeader(title,sub){const pts=U?arcadePoints(U.uid):0;return `<div class="hero" style="background:linear-gradient(135deg,#06b6d4,#8b5cf6)"><div class="hero-content"><div class="hero-eyebrow">🧪 مختبر سيجما</div><div class="hero-title">${esc(title)}</div><div class="hero-desc">${esc(sub)}</div><div class="hero-stats"><div class="hero-stat"><b>${pts}</b><span>نقاطك</span></div></div></div></div>`}
function resultCard(title,score,again){return `<div class="result-card"><div style="font-size:56px;margin-bottom:10px">🎉</div><h2 style="font-size:22px;margin-bottom:10px">${esc(title)}</h2><div style="font-size:28px;font-weight:900;color:var(--ac);margin:10px 0">النتيجة: ${score}</div><div style="display:flex;gap:8px;justify-content:center;margin-top:20px"><button class="btn" onclick="openGame('${again}')">العب مرة أخرى</button><button class="btn ghost" onclick="gameBack()">الألعاب</button></div></div>`}
function arcadeBoard(){const ids=new Set([...Object.keys(arcadeData),...Object.keys(quizLeaderData||{})]);const rows=[...ids].map(uid=>({name:arcadeData[uid]?.name||quizLeaderData?.[uid]?.name||'طالب',points:arcadePoints(uid)})).filter(r=>r.points>0).sort((a,b)=>b.points-a.points).slice(0,10);if(!rows.length)return '';return `<div class="question-card" style="margin-top:20px"><h3 style="font-size:16px;margin-bottom:14px">🏆 لوحة المتصدرين</h3><div class="list">${rows.map((r,i)=>`<div class="row-between" style="padding:10px 12px;border-bottom:1px solid var(--bd)"><span>${i+1}. ${esc(r.name)}</span><b style="color:var(--ac2)">${r.points}</b></div>`).join('')}</div></div>`}
async function saveArcade(game,score){if(!U||!canPlayNow())return;const cur=arcadeData[U.uid]||{};const best={...(cur.best||{})};best[game]=Math.max(best[game]||0,score);const next={name:U.displayName||'طالب',best,points:Object.values(best).reduce((s,v)=>s+v,0),lastPlayed:Date.now()};arcadeData={...arcadeData,[U.uid]:next};try{await set(R('arcade/'+U.uid),next)}catch(e){}}
async function saveLabData(){if(!U||!canPlayNow())return;try{await set(R('labGame/'+U.uid),{name:U.displayName||'طالب',labs:labUserData.labs||{},discoveries:labUserData.discoveries||0,lastPlayed:Date.now()})}catch(e){}}
async function saveQuizProgress(d){if(!U||!canPlayNow())return;const cur={...(quizLeaderData[U.uid]||{})};cur.points=(cur.points||0)+(d.points||0);cur.correct=(cur.correct||0)+(d.correct||0);cur.wrong=(cur.wrong||0)+(d.wrong||0);cur.levels={...(cur.levels||{})};if(d.level&&!cur.levels[d.level]){cur.levels[d.level]=true;cur.points+=50}cur.name=U.displayName||'طالب';cur.lastPlayed=Date.now();quizLeaderData={...quizLeaderData,[U.uid]:cur};try{await set(R('quizGame/'+U.uid),cur)}catch(e){}}
function labPick(el){if(labShowingResult)return;if(labSelectedEls.length>=4)return toast('الحد الأقصى 4 عناصر');labSelectedEls.push(el);labLastResult=null;render()}
function labUndo(){if(labShowingResult)return;labSelectedEls.pop();labLastResult=null;render()}
function labClear(){if(labShowingResult)return;labSelectedEls=[];labSelectedTool=null;labLastResult=null;render()}
function labTool(t){if(labShowingResult)return;labSelectedTool=labSelectedTool===t?null:t;labLastResult=null;render()}
function labRun(){const exp=LAB_EXPERIMENTS[labActiveLab]?.[labCurrentExpIdx];if(!exp||labShowingResult)return;if(!labSelectedEls.length||!labSelectedTool)return toast('اختر العناصر والأداة أولاً');const ok=sameItems(exp.elements,labSelectedEls)&&labSelectedTool===exp.tool;if(ok){labShowingResult=true;labLastResult={correct:true,formula:exp.formula,result:exp.result,desc:exp.desc};if(canPlayNow()){labUserData.discoveries=(labUserData.discoveries||0)+1;labUserData.labs={...(labUserData.labs||{}),[labActiveLab]:Math.max(labDone(labActiveLab),labCurrentExpIdx+1)};saveLabData()}}else{labLastResult={correct:false,formula:'لا يحدث تفاعل متوقع',result:'العناصر أو الأداة غير مناسبة لهذه التجربة',desc:''}}render()}
function labNext(){labCurrentExpIdx++;labSelectedEls=[];labSelectedTool=null;labShowingResult=false;labLastResult=null;render()}
function labBack(){labActiveLab=null;labCurrentExpIdx=0;labSelectedEls=[];labSelectedTool=null;labShowingResult=false;labLastResult=null;render()}
function freePick(el){const idx=freeLab.els.indexOf(el);if(idx>=0)freeLab.els.splice(idx,1);else if(freeLab.els.length<2)freeLab.els.push(el);freeLab.result=null;render()}
function freeTool(t){freeLab.tool=freeLab.tool===t?null:t;freeLab.result=null;render()}
function freeRun(){if(freeLab.els.length!==2)return toast('اختر عنصرين');const [a,b]=freeLab.els;const pairs=FREE_LAB_REACTIONS.filter(r=>(r.el1===a&&r.el2===b)||(r.el1===b&&r.el2===a));if(!pairs.length){freeLab.result={none:true,text:'هذان العنصران لا يتفاعلان معاً في الظروف العادية.'};render();return}const withTool=freeLab.tool?pairs.find(r=>r.tool===freeLab.tool):null;if(freeLab.tool&&!withTool){freeLab.result={none:true,text:'هذه الأداة لا تنتج تفاعلاً مع هذين العنصرين.'};render();return}const r=withTool||pairs[0];freeLab.result={formula:r.formula,explain:r.explain};render()}
function freeReset(){freeLab={els:[],tool:null,result:null};render()}
function quizStart(level){if(!isLabOn('quiz'))return toast('اللعبة موقوفة حالياً');if(!QUIZ_QUESTIONS[level])return;window._quizOrder=userShuffle(QUIZ_QUESTIONS[level].map((_,i)=>i),level.length*10);quizActiveLevel=level;quizCurrentIndex=0;quizAnswered=false;render()}
function quizExit(){if(quizTimer){clearTimeout(quizTimer);quizTimer=null}quizActiveLevel=null;quizCurrentIndex=0;quizAnswered=false;window._quizOrder=null;render()}
function quizAnswer(choice){if(quizAnswered||!quizActiveLevel)return;quizAnswered=true;const level=quizActiveLevel;const order=window._quizOrder||QUIZ_QUESTIONS[level].map((_,i)=>i);const origIdx=order[quizCurrentIndex];const q=QUIZ_QUESTIONS[level][origIdx];const optOrder=userShuffle(q.opts.map((_,i)=>i),origIdx+33);const displayCorrect=optOrder.indexOf(q.correct);const isCorrect=choice===displayCorrect;document.querySelectorAll('.quiz-opt').forEach((btn,i)=>{btn.disabled=true;if(i===displayCorrect)btn.classList.add('correct');else if(i===choice)btn.classList.add('wrong')});saveQuizProgress({points:isCorrect?10:0,correct:isCorrect?1:0,wrong:isCorrect?0:1});quizTimer=setTimeout(()=>{quizTimer=null;quizCurrentIndex++;if(quizCurrentIndex>=(window._quizOrder||[]).length){saveQuizProgress({level});quizActiveLevel=null;quizCurrentIndex=0}quizAnswered=false;render()},1500)}
function memStart(){if(!isLabOn('memory'))return;const cards=userShuffle(MEM_PAIRS.flatMap((p,i)=>[{pid:i,t:p.s},{pid:i,t:p.n}]),1);memState={cards,open:[],matched:[],moves:0,busy:false,done:false,score:0}}
function memFlip(i){const st=memState;if(!st||st.busy||st.done||st.open.includes(i)||st.matched.includes(i))return;st.open.push(i);if(st.open.length<2){render();return}st.moves++;st.busy=true;render();const [a,b]=st.open;setTimeout(()=>{if(memState!==st)return;if(st.cards[a].pid===st.cards[b].pid)st.matched.push(a,b);st.open=[];st.busy=false;if(st.matched.length===st.cards.length){st.done=true;st.score=Math.max(20,160-st.moves*4);saveArcade('memory',st.score)}render()},800)}
function huntStart(){if(!isLabOn('hunt'))return;const picks=userShuffle(ELEMENTS_DATA,1).slice(0,8);huntState={rounds:picks.map((t,idx)=>({target:t,opts:userShuffle([t,...userShuffle(ELEMENTS_DATA.filter(e=>e.s!==t.s),idx+10).slice(0,3)],idx+20)})),i:0,score:0,picked:null,done:false}}
function huntAnswer(sym){const st=huntState;if(!st||st.done||st.picked!==null)return;const r=st.rounds[st.i];st.picked=sym;if(sym===r.target.s)st.score+=10;render();setTimeout(()=>{if(huntState!==st)return;st.i++;st.picked=null;if(st.i>=st.rounds.length){st.done=true;saveArcade('hunt',st.score)}render()},900)}
function orderStart(){if(!isLabOn('order'))return;const rounds=[0,1,2].map(r=>userShuffle(ELEMENTS_DATA,r+100).slice(0,5));orderState={rounds,r:0,picked:[],mistakes:0,wrong:null,roundDone:false,score:0,done:false}}
function orderPick(sym){const st=orderState;if(!st||st.done||st.wrong||st.roundDone||st.picked.includes(sym))return;const items=st.rounds[st.r];const sorted=[...items].sort((a,b)=>a.z-b.z);const el=items.find(e=>e.s===sym);if(el.z===sorted[st.picked.length].z){st.picked.push(sym);if(st.picked.length===items.length){st.roundDone=true;st.score+=Math.max(5,30-st.mistakes*5)}}else{st.mistakes++;st.wrong=sym;setTimeout(()=>{if(orderState===st){st.wrong=null;render()}},600)}render()}
function orderNext(){const st=orderState;if(!st||!st.roundDone)return;st.r++;st.picked=[];st.mistakes=0;st.roundDone=false;if(st.r>=st.rounds.length){st.done=true;saveArcade('order',st.score)}render()}
function balCoefsFor(idx){const eq=BAL_EQUATIONS[idx];return Array(eq.left.length+eq.right.length).fill(1)}
function balStart(){if(!isLabOn('balance'))return;balState={idx:0,coefs:balCoefsFor(0),wrong:0,score:0,msg:'',done:false}}
function balStep(k,d){const st=balState;if(!st||st.done)return;st.coefs[k]=clamp(st.coefs[k]+d,1,6);st.msg='';render()}
function atomTotals(items,coefs,offset){const t={};items.forEach((it,k)=>Object.entries(it.a).forEach(([el,n])=>{t[el]=(t[el]||0)+coefs[offset+k]*n}));return t}
function isBalanced(eq,coefs){const L=atomTotals(eq.left,coefs,0),R=atomTotals(eq.right,coefs,eq.left.length);const keys=new Set([...Object.keys(L),...Object.keys(R)]);return [...keys].every(k=>(L[k]||0)===(R[k]||0))}
function balCheck(){const st=balState;if(!st||st.done)return;const eq=BAL_EQUATIONS[st.idx];if(isBalanced(eq,st.coefs)){st.score+=Math.max(2,10-st.wrong*2);st.idx++;st.wrong=0;st.msg='ok';if(st.idx>=BAL_EQUATIONS.length){st.done=true;saveArcade('balance',st.score)}else st.coefs=balCoefsFor(st.idx)}else{st.wrong++;st.msg='bad'}render()}
function whoStart(){if(!isLabOn('who'))return;whoState={rounds:userShuffle(WHO_AM_I,200).slice(0,5),i:0,score:0,picked:null,done:false}}
function whoAnswer(ans){const st=whoState;if(!st||st.done||st.picked!==null)return;st.picked=ans;if(ans===st.rounds[st.i].answer)st.score+=15;render();setTimeout(()=>{if(whoState!==st)return;st.i++;st.picked=null;if(st.i>=st.rounds.length){st.done=true;saveArcade('who',st.score)}render()},1000)}
function tfStart(){if(!isLabOn('tf'))return;tfState={rounds:userShuffle(TRUE_FALSE,300).slice(0,8),i:0,score:0,picked:null,done:false}}
function tfAnswer(val){const st=tfState;if(!st||st.done||st.picked!==null)return;st.picked=val;if(val===st.rounds[st.i].a)st.score+=10;render();setTimeout(()=>{if(tfState!==st)return;st.i++;st.picked=null;if(st.i>=st.rounds.length){st.done=true;saveArcade('tf',st.score)}render()},800)}
function speedStart(){if(!isLabOn('speed'))return;speedState={rounds:userShuffle(SPEED_QUIZ,400).slice(0,10),i:0,score:0,timeLeft:30,picked:null,done:false,timer:null};speedTick()}
function speedTick(){const st=speedState;if(!st||st.done)return;if(st.timer){clearInterval(st.timer);st.timer=null}st.timer=setInterval(()=>{if(speedState!==st||st.done){clearInterval(st.timer);st.timer=null;return}st.timeLeft--;if(st.timeLeft<=0){clearInterval(st.timer);st.timer=null;st.done=true;saveArcade('speed',st.score);render();return}if(S.v==='games'&&S.tab==='speed')render()},1000)}
function speedAnswer(ans){const st=speedState;if(!st||st.done||st.picked!==null)return;st.picked=ans;if(ans===st.rounds[st.i].a)st.score+=12;render();setTimeout(()=>{if(speedState!==st)return;st.i++;st.picked=null;if(st.i>=st.rounds.length){if(st.timer){clearInterval(st.timer);st.timer=null}st.done=true;saveArcade('speed',st.score)}render()},700)}

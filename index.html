<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>منصة سيجما التعليمية</title>
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" id="mf">
<link rel="apple-touch-icon" id="ai">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
<style>
/* =========================================================
   1) ROOT & THEME
   ========================================================= */
:root{
  --bg:#f8fafc; --surface:#ffffff; --surface2:#f1f5f9;
  --tx:#0f172a; --tx2:#475569; --mu:#94a3b8;
  --ac:#2563eb; --ac2:#1d4ed8; --ac-soft:#dbeafe;
  --ok:#10b981; --er:#ef4444; --warn:#f59e0b;
  --bd:#e2e8f0; --r:16px; --r-sm:10px; --r-lg:22px;
  --shadow:0 1px 3px rgba(15,23,42,.06),0 4px 12px rgba(15,23,42,.04);
  --shadow-lg:0 10px 40px rgba(15,23,42,.12);
}
html.dark{
  --bg:#0b1220; --surface:#111a2e; --surface2:#1a2440;
  --tx:#f1f5f9; --tx2:#cbd5e1; --mu:#64748b;
  --ac:#60a5fa; --ac2:#3b82f6; --ac-soft:#1e3a8a;
  --bd:#1e293b;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 4px 12px rgba(0,0,0,.3);
  --shadow-lg:0 10px 40px rgba(0,0,0,.5);
}

/* =========================================================
   2) BASE
   ========================================================= */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{min-height:100%;height:auto}
body{font-family:Cairo,system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;
  padding-bottom:calc(120px + env(safe-area-inset-bottom));overflow-x:hidden;
  -webkit-user-select:none;user-select:none;transition:background .25s,color .25s}
input,select,textarea{-webkit-user-select:text;user-select:text}
h1,h2,h3{font-weight:800;line-height:1.3}
h2{font-size:20px;margin-bottom:16px;color:var(--tx)}

/* =========================================================
   3) LOADING
   ========================================================= */
#loading-overlay{position:fixed;inset:0;z-index:9999;background:rgba(248,250,252,.85);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .3s ease}
html.dark #loading-overlay{background:rgba(11,18,32,.85)}
#loading-overlay.hide{opacity:0;pointer-events:none}
.spinner{width:40px;height:40px;border:4px solid var(--ac-soft);border-top-color:var(--ac);
  border-radius:50%;animation:spin 1s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}

/* =========================================================
   4) TOP BAR
   ========================================================= */
.top-bar{background:linear-gradient(135deg,var(--ac) 0%,var(--ac2) 100%);color:#fff;
  padding:24px 20px;border-bottom-left-radius:24px;border-bottom-right-radius:24px;
  margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-start;
  position:relative;box-shadow:var(--shadow)}
.top-bar .welcome h1{font-size:22px;margin-bottom:4px;font-weight:800}
.top-bar .welcome p{font-size:14px;opacity:.9;margin-bottom:12px}
.top-bar .user-area{display:flex;align-items:center;gap:8px}
.top-bar .avatar-lg{width:56px;height:56px;border-radius:50%;border:3px solid rgba(255,255,255,.4);
  object-fit:cover;cursor:pointer;background:#fff}
.top-bar .actions{display:flex;gap:8px;align-items:center}
.top-bar .action-btn{background:rgba(255,255,255,.2);color:#fff;border:0;padding:6px 12px;
  border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:.15s}
.top-bar .action-btn:hover{background:rgba(255,255,255,.3)}
.top-bar .action-btn.icon-only{width:42px;height:42px;padding:0;border-radius:50%;position:relative;
  flex:0 0 42px;background:#fff;color:#0f172a;box-shadow:0 2px 5px rgba(0,0,0,.1)}
.top-bar .action-btn.icon-only svg{width:22px;height:22px;fill:none;stroke:currentColor;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.top-bar .action-btn.icon-only .badge-dot{position:absolute!important;top:-2px!important;right:-2px!important;
  min-width:18px;height:18px;padding:0 4px;border-radius:99px;background:#ef4444!important;
  color:#fff!important;border:2px solid #fff!important;align-items:center;justify-content:center;
  font-size:10px;font-weight:800;display:flex}

main{max-width:1000px;margin:0 auto;padding:0 20px 40px}

/* =========================================================
   5) CARDS & ROWS
   ========================================================= */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-lg);padding:0;
  cursor:pointer;text-align:center;transition:.2s;overflow:hidden;position:relative;
  display:flex;flex-direction:column}
.card:hover{border-color:var(--ac);box-shadow:var(--shadow-lg);transform:translateY(-3px)}
.card:active{transform:scale(.98)}
.card .card-img-wrap{width:100%;height:160px;background:linear-gradient(135deg,#e0e7ff 0%,#f1f5f9 100%);position:relative}
.card .card-img-wrap img{width:100%;height:100%;object-fit:cover}
.card .card-body{padding:12px 10px;background:var(--surface);flex:1;
  display:flex;flex-direction:column;justify-content:center}
.card b{font-size:16px;display:block;color:var(--tx);font-weight:800}

.row{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r);
  padding:16px 18px;margin-bottom:12px;display:flex;align-items:center;gap:12px;
  cursor:pointer;transition:.15s;flex-wrap:wrap}
.row:hover{border-color:var(--ac);box-shadow:var(--shadow-lg)}
.row:active{transform:scale(.995)}
.row>div{flex:1;min-width:0}
.row b{font-size:15px;display:block;color:var(--tx)}
.row small{color:var(--mu);font-size:13px;display:block;margin-top:2px}

/* =========================================================
   6) BUTTONS / INPUTS
   ========================================================= */
button,.btn{font-family:inherit;font-weight:700;border:0;border-radius:var(--r-sm);
  padding:10px 18px;background:var(--ac);color:#fff;cursor:pointer;transition:.15s;font-size:14px}
button:hover{background:var(--ac2);transform:translateY(-1px);box-shadow:0 4px 12px rgba(37,99,235,.3)}
button:active{transform:translateY(0) scale(.97)}
button:disabled{opacity:.6;cursor:not-allowed;transform:none;box-shadow:none}
button.s{background:var(--surface2);color:var(--tx)}
button.s:hover{background:var(--bd);box-shadow:none;transform:none}
button.d{background:var(--er)}button.d:hover{background:#dc2626}
button.g{background:var(--ok)}button.g:hover{background:#059669}

label{font-size:13px;color:var(--tx2);font-weight:700;display:block;margin-bottom:6px}
input,select,textarea{font-family:inherit;font-size:14px;width:100%;padding:12px 14px;
  border-radius:var(--r-sm);border:1px solid var(--bd);background:var(--surface);color:var(--tx);
  margin-bottom:14px;transition:.15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);
  box-shadow:0 0 0 3px var(--ac-soft)}

/* =========================================================
   7) BOXES / TABLES
   ========================================================= */
.box{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-lg);
  padding:22px;margin-bottom:20px;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px;text-align:right;border-bottom:1px solid var(--bd)}
th{background:var(--surface2);font-weight:700;color:var(--tx2);font-size:12px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r)}

/* =========================================================
   8) BADGES
   ========================================================= */
.b{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;
  background:var(--surface2);color:var(--tx2);display:inline-block}
.b.g{background:#d1fae5;color:#065f46}
.b.r{background:#fee2e2;color:#991b1b}
.b.y{background:#fef3c7;color:#92400e}
html.dark .b.g{background:#064e3b;color:#6ee7b7}
html.dark .b.r{background:#7f1d1d;color:#fca5a5}
html.dark .b.y{background:#78350f;color:#fcd34d}
.g{color:var(--ok)}.r{color:var(--er)}.y{color:var(--warn)}
.code{font-family:'Courier New',monospace;font-size:15px;letter-spacing:2px;direction:ltr;
  display:inline-block;background:var(--surface2);padding:3px 10px;border-radius:6px;
  color:var(--ac2);font-weight:700}
.mut{color:var(--mu);text-align:center;padding:40px 20px}

/* =========================================================
   9) PLAYER (Updated for full crop & no black borders)
   ========================================================= */
.player-wrap{width:100%;margin-bottom:16px}
.pl{position:relative;background:#000;border-radius:var(--r);overflow:hidden;width:100%;
  aspect-ratio:16/9;max-height:80vh;margin:0 auto;box-shadow:var(--shadow-lg)}
.pl iframe,.pl video{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#000}

/* تعديل قص يوتيوب لإخفاء الحواف السوداء واسم القناة بالكامل */
.pl.crop-yt iframe{
  width: 106%!important;
  height: 135%!important;
  top: -17.5%!important;
  left: -3%!important;
}

.yt-top-mask{position:absolute;top:0;left:0;right:0;height:65px;z-index:11;
  background:#000;pointer-events:none}
.yt-bottom-mask{position:absolute;bottom:0;left:0;right:0;height:65px;z-index:11;
  background:#000;pointer-events:none}

.yt-shield{position:absolute;inset:0;z-index:10;background:transparent;cursor:pointer}
.wm{position:absolute;pointer-events:none;z-index:20;display:flex;align-items:center;gap:6px;
  font-size:12px;opacity:.45;background:rgba(0,0,0,.6);padding:4px 10px;border-radius:99px;
  animation:mv 24s linear infinite alternate;direction:ltr;color:#fff}
.wm img{width:22px;height:22px;border-radius:50%;object-fit:cover}
@keyframes mv{0%{top:20%;left:4%}25%{top:70%;left:55%}50%{top:35%;left:70%}75%{top:80%;left:8%}100%{top:20%;left:60%}}

/* =========================================================
   10) PLAYER CONTROLS (universal)
   ========================================================= */
.custom-player-ctrl{
  background:linear-gradient(180deg,var(--surface) 0%,var(--surface2) 100%);
  border:1px solid var(--bd);padding:16px 18px;border-radius:var(--r-lg);
  margin-top:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;
}
.custom-player-ctrl .progress-row{display:flex;align-items:center;gap:14px}
.custom-player-ctrl .play-btn{
  background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;border-radius:50%;
  width:56px;height:56px;font-size:22px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:.2s;flex-shrink:0;padding:0;margin:0;
  box-shadow:0 4px 14px rgba(37,99,235,.4);position:relative;
}
.custom-player-ctrl .play-btn:hover{transform:scale(1.08);box-shadow:0 6px 20px rgba(37,99,235,.55)}
.custom-player-ctrl .play-btn:active{transform:scale(.96)}
.custom-player-ctrl .play-btn svg{width:24px;height:24px;fill:#fff;margin-right:2px}
.custom-player-ctrl .progress-container{flex:1;display:flex;flex-direction:column;gap:6px}
.custom-player-ctrl .slider-wrap{position:relative;width:100%;height:6px;background:var(--bd);
  border-radius:99px;overflow:hidden}
.custom-player-ctrl .slider-fill{position:absolute;top:0;right:0;height:100%;
  background:linear-gradient(90deg,var(--ac2),var(--ac));border-radius:99px;
  transition:width .1s linear;pointer-events:none}
.custom-player-ctrl input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;padding:0;margin:0;height:6px;
  background:transparent;cursor:pointer;border:0;position:relative;z-index:2;
}
.custom-player-ctrl input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;
  background:#fff;border:3px solid var(--ac);cursor:pointer;
  box-shadow:0 2px 6px rgba(0,0,0,.25);transition:.15s;
}
.custom-player-ctrl input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.15)}
.custom-player-ctrl input[type=range]::-moz-range-thumb{
  width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--ac);cursor:pointer;
}
.custom-player-ctrl .time-row{display:flex;justify-content:space-between;font-size:12px;
  font-weight:700;color:var(--tx2)}
.custom-player-ctrl .time{font-family:'Courier New',monospace;direction:ltr}
.custom-player-ctrl .tools-row{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;
  border-top:1px solid var(--bd);padding-top:14px;
}
.custom-player-ctrl .tool-btn{
  padding:8px 14px;font-size:13px;border-radius:10px;background:var(--surface);color:var(--tx);
  border:1px solid var(--bd);display:inline-flex;align-items:center;gap:6px;font-weight:700;
}
.custom-player-ctrl .tool-btn:hover{background:var(--ac);color:#fff;border-color:var(--ac);transform:translateY(-1px)}
.custom-player-ctrl .speed-box{display:inline-flex;align-items:center;gap:6px;
  background:var(--surface);border:1px solid var(--bd);border-radius:10px;padding:4px 10px}
.custom-player-ctrl .speed-box label{margin:0;font-size:12px;color:var(--tx2)}
.custom-player-ctrl .speed-box select{width:auto;padding:4px 8px;margin:0;font-size:12px;
  border-radius:6px;border:1px solid var(--bd);background:var(--surface2);color:var(--tx)}

/* =========================================================
   11) BOTTOM NAV
   ========================================================= */
.bottombar{position:fixed;bottom:0;left:0;z-index:40;background:var(--surface);
  border:1px solid var(--bd);border-bottom:0;border-radius:22px 22px 0 0;
  display:flex;justify-content:space-around;gap:4px;
  padding:8px 16px calc(8px + env(safe-area-inset-bottom));
  box-shadow:0 -5px 24px rgba(0,0,0,.10);width:100%}
.bottombar button{background:transparent;color:var(--tx2);border:0;padding:10px 4px;
  border-radius:25px;font-size:11px;font-weight:700;cursor:pointer;transition:.15s;
  display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
.bottombar button:hover{background:var(--surface2);color:var(--tx);box-shadow:none;transform:none}
.bottombar button.on{color:var(--ac);background:var(--ac-soft)}
.bottombar button.on svg{fill:var(--ac)}
.bottombar button svg{width:22px;height:22px;fill:var(--tx2);transition:.15s}

/* =========================================================
   12) TOAST
   ========================================================= */
#t{position:fixed;bottom:calc(100px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  background:var(--tx);color:var(--bg);padding:12px 22px;border-radius:var(--r);
  font-weight:700;display:none;z-index:300;box-shadow:var(--shadow-lg);
  max-width:90vw;text-align:center;font-size:14px}
#t.show{display:block;animation:pop .25s}
@keyframes pop{0%{transform:translateX(-50%) scale(.8);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:1}}

/* =========================================================
   13) PROFILE / MODALS
   ========================================================= */
.profile-card{text-align:center;padding:30px 20px}
.profile-card img{width:100px;height:100px;border-radius:50%;border:4px solid var(--ac-soft);
  margin-bottom:16px;object-fit:cover}
.profile-card h2{margin-bottom:8px}
.profile-card p{color:var(--mu);font-size:15px;margin-bottom:24px}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;
  align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex;animation:pop .2s}
.modal-content{background:var(--surface);border-radius:var(--r-lg);width:100%;max-width:400px;
  max-height:80vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow-lg)}
.modal-header{padding:16px;border-bottom:1px solid var(--bd);display:flex;
  justify-content:space-between;align-items:center}
.modal-header h3{font-size:16px;margin:0}
.modal-body{padding:16px;overflow-y:auto;flex:1}

/* =========================================================
   14) NOTIFICATIONS
   ========================================================= */
.noti-item{
  display:flex;align-items:flex-start;gap:12px;padding:14px;margin-bottom:10px;
  background:var(--surface2);border:1px solid var(--bd);border-radius:14px;
  transition:.2s;position:relative;
}
.noti-item:hover{border-color:var(--ac);box-shadow:var(--shadow)}
.noti-item.unread{background:var(--ac-soft);border-color:var(--ac)}
html.dark .noti-item.unread{background:rgba(30,58,138,.35)}
.noti-icon{width:42px;height:42px;border-radius:50%;
  background:linear-gradient(135deg,var(--ac),var(--ac2));
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:0 3px 10px rgba(37,99,235,.35)}
.noti-icon svg{width:22px;height:22px;fill:#fff}
.noti-content{flex:1;min-width:0}
.noti-text{font-size:14px;line-height:1.6;color:var(--tx);font-weight:600;margin-bottom:4px;
  word-break:break-word}
.noti-date{font-size:11px;color:var(--mu);font-weight:700;display:flex;align-items:center;gap:4px}
.noti-unread-dot{width:8px;height:8px;border-radius:50%;background:var(--er);
  display:inline-block;margin-right:4px}
.noti-actions{display:flex;gap:6px;flex-shrink:0}
.noti-actions button{padding:6px 10px;font-size:11px;border-radius:8px;
  background:var(--surface);border:1px solid var(--bd);color:var(--tx2);font-weight:700}
.noti-actions button:hover{background:var(--er);color:#fff;border-color:var(--er)}
.noti-empty{text-align:center;padding:50px 20px;color:var(--mu)}
.noti-empty svg{width:60px;height:60px;fill:var(--bd);margin-bottom:14px}

/* =========================================================
   15) STUDENT STATS
   ========================================================= */
.stats-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:12px;margin-bottom:20px}
.stat-box{background:linear-gradient(135deg,var(--surface),var(--surface2));
  border:1px solid var(--bd);border-radius:var(--r);padding:16px;text-align:center;transition:.2s}
.stat-box:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.stat-box .stat-num{font-size:26px;font-weight:800;color:var(--ac);margin-bottom:4px}
.stat-box .stat-label{font-size:12px;color:var(--mu);font-weight:700}
.stat-box.ok .stat-num{color:var(--ok)}
.stat-box.warn .stat-num{color:var(--warn)}

.stats-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;
  border-radius:var(--r);border:1px solid var(--bd)}
.stats-table{width:100%;border-collapse:collapse;font-size:13px;background:var(--surface)}
.stats-table th{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;
  padding:12px 10px;font-size:12px;font-weight:800;text-align:right;white-space:nowrap}
.stats-table td{padding:12px 10px;border-bottom:1px solid var(--bd);vertical-align:middle}
.stats-table tr:last-child td{border-bottom:0}
.stats-table tr:hover td{background:var(--surface2)}
.stats-table .grade-chip{display:inline-block;padding:3px 8px;border-radius:8px;
  background:var(--ac-soft);color:var(--ac2);font-size:11px;font-weight:700;white-space:nowrap}
html.dark .stats-table .grade-chip{background:rgba(30,58,138,.5);color:#93c5fd}

.stats-filter{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.stats-filter button{padding:8px 16px;font-size:12px;border-radius:99px;
  background:var(--surface2);color:var(--tx2);border:1px solid var(--bd)}
.stats-filter button.on{background:var(--ac);color:#fff;border-color:var(--ac)}

/* =========================================================
   16) AUTH
   ========================================================= */
.auth-container{max-width:400px;margin:0 auto;padding:40px 20px;text-align:center}
.auth-container h1{font-size:32px;color:var(--ac);margin-bottom:8px;font-weight:800;letter-spacing:-1px}
.auth-container p{color:var(--mu);margin-bottom:24px;font-size:15px}
.auth-btn{width:100%;padding:14px;font-size:16px;border-radius:12px;margin-bottom:12px;
  display:flex;align-items:center;justify-content:center;gap:10px}
.auth-btn.phone{background:var(--ac);color:#fff}
.auth-btn.phone:hover{background:var(--ac2)}
.auth-form{text-align:right}
.auth-form label{display:block;margin-bottom:6px;font-weight:700;font-size:13px;color:var(--tx2)}
.auth-form input{margin-bottom:12px}
.auth-form .error{color:var(--er);font-size:13px;margin-bottom:10px;display:none;line-height:1.6}
.link-btn{color:var(--ac);font-weight:700;text-decoration:none;cursor:pointer}

/* =========================================================
   17) ADMIN
   ========================================================= */
.admin-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;
  background:var(--surface2);padding:6px;border-radius:12px}
.admin-tabs button{flex:1 1 calc(50% - 6px);padding:10px;font-size:13px;border-radius:8px;
  background:var(--surface);color:var(--tx2);border:1px solid var(--bd)}
.admin-tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac);
  box-shadow:0 2px 8px rgba(37,99,235,.3)}
@media(max-width:768px){.admin-tabs button{flex:1 1 100%}}

.code-input{font-size:26px;text-align:center;letter-spacing:8px;font-family:monospace}

/* =========================================================
   IMAGE CROP
   ========================================================= */
function img(f,s){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error('تعذر قراءة الصورة'));
    const squareFrom=(src,crop)=>{
      const im=new Image();
      im.onload=()=>{
        const c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');
        if(crop){x.drawImage(im,crop.x,crop.y,crop.w,crop.h,0,0,s,s)}
        else{const side=Math.min(im.width,im.height);x.drawImage(im,(im.width-side)/2,(im.height-side)/2,side,side,0,0,s,s)}
        resolve(c.toDataURL('image/jpeg',0.8));
      };
      im.onerror=()=>reject(new Error('صيغة الصورة غير مدعومة'));
      im.src=src;
    };
    reader.onload=e=>{
      if(typeof Cropper==='undefined'){squareFrom(e.target.result,null);return}
      const cropImage=$('#cropImage');
      cropImage.src=e.target.result;
      $('#cropModal').classList.add('show');
      if(cropper){cropper.destroy();cropper=null}
      cropper=new Cropper(cropImage,{aspectRatio:1,viewMode:1,background:false,autoCropArea:1});
      cropResolve=(dataUrl)=>{
        $('#cropModal').classList.remove('show');
        if(cropper){cropper.destroy();cropper=null}
        cropResolve=null;
        if(!dataUrl)return resolve(null);
        squareFrom(dataUrl,null);
      };
    };
    reader.readAsDataURL(f);
  });
}
function confirmCrop(){
  if(!cropper||!cropResolve)return;
  const c=cropper.getCroppedCanvas({width:400,height:400});
  cropResolve(c.toDataURL('image/jpeg'));
}
function cancelCrop(){if(cropResolve)cropResolve(null)}

/* =========================================================
   VIDEO EMBED PARSER
   ========================================================= */
function embed(u){
  u=String(u||'').trim();let m;
  if(m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/))([\w-]{11})/))
    return{
      t:'yt',
      id:m[1],
      s:`https://www.youtube.com/embed/${m[1]}?rel=0&modestbranding=1&playsinline=1&enablejsapi=1&controls=0&showinfo=0&iv_load_policy=3&fs=0&disablekb=1&origin=${encodeURIComponent(location.origin)}`
    };
  if(m=u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?.*?id=)([\w-]+)/))
    return{t:'drive',s:`https://drive.google.com/file/d/${m[1]}/preview`,id:m[1]};
  if(!/^https?:\/\//i.test(u))return{t:'f',s:''};
  if(/\.(mp4|webm|ogg)(\?|$)/i.test(u))return{t:'v',s:u};
  return{t:'f',s:u};
}

async function enforceSingleDevice(){
  if(A||IS_SUPERVISOR)return true;
  try{
    const devId=getDeviceId();const sessionsRef=R('sessions/'+U.uid);
    const cur=(await get(sessionsRef)).val()||{};const now=Date.now();
    const existingDevice=cur.deviceId;const existingTs=cur.updatedAt||0;
    if(existingDevice&&existingDevice!==devId&&now-existingTs<10*60*1000){
      await set(R('bans/'+U.uid),{
        uid:U.uid,name:U.displayName||'',email:U.email||'',photo:'',
        oldDevice:existingDevice,oldDeviceLabel:cur.deviceLabel||'',
        newDevice:devId,newDeviceLabel:deviceLabel(),bannedAt:now,
        reason:'تسجيل دخول من جهاز آخر'
      });
      return false;
    }
    await set(sessionsRef,{
      deviceId:devId,deviceLabel:deviceLabel(),updatedAt:now,
      name:U.displayName||'',email:U.email||''
    });
    const ban=await G('bans/'+U.uid);
    if(ban&&ban.newDevice===devId)await remove(R('bans/'+U.uid));
    return true;
  }catch(e){console.warn('enforceSingleDevice',e);return true}
}

        <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
      </div>
      <div class="noti-content" style="cursor:${n.userId?'pointer':'default'}" ${n.userId?`onclick="closeNoti();go('studentProfile','${n.userId}')"`:''}>
        <div class="noti-text">${isUnread?'<span class="noti-unread-dot"></span>':''}${esc(n.text||'إشعار جديد')}</div>
        <div class="noti-date">📅 ${fd(n.created)}</div>
      </div>
      <div class="noti-actions">
        <button onclick="delNoti('${esc(n._key)}')" title="مسح">✕</button>
      </div>
    </div>`;
  }).join('')+`<div style="text-align:center;padding-top:12px">
    <button class="s" style="font-size:12px;padding:8px 20px" onclick="clearAllMyNotis()">مسح الكل</button>
  </div>`;
  if(U){
    const updates={};
    list.forEach(n=>{if(!n.read)updates[n._key]={text:n.text||'',created:n.created||Date.now(),read:true}});
    if(Object.keys(updates).length){
      if(A) update(R('adminNotifications'),updates).catch(()=>{});
      else update(R('notifications/'+U.uid),updates).catch(()=>{});
    }
  }
}
async function delNoti(key){
  if(!confirm('مسح هذا الإشعار؟'))return;

    if(A){
      await remove(R('adminNotifications/'+key));
    } else {
      await set(R('notifications/'+U.uid+'/'+key),{text:n.text||'',created:n.created||Date.now(),read:true,dismissed:true});
    }
    toast('تم المسح');renderNoti();
  }catch(e){toast('تعذر المسح')}
}
async function clearAllMyNotis(){
  if(!confirm('مسح كل الإشعارات؟'))return;
  try{
    if(A){
      await remove(R('adminNotifications'));
    } else {
      const ups={};
      Object.values(notifications).forEach(n=>{ups[n._key]={text:n.text||'',created:n.created||Date.now(),read:true,dismissed:true}});
      if(Object.keys(ups).length)await update(R('notifications/'+U.uid),ups);
    }
    toast('تم مسح الإشعارات');renderNoti();
  }catch(e){toast('تعذر المسح')}
}

function switchPhoneMode(mode,e){
  if(e)e.preventDefault();
  $('#phone-register').style.display=mode==='login'?'none':'block';
  $('#phone-login').style.display=mode==='login'?'block':'none';
}
function showErr(id,msg){const el=$('#'+id);el.textContent=msg;el.style.display='block'}
function authMsg(e){
  const c=e?.code||'';
  if(c==='auth/network-request-failed')return 'تعذر الاتصال بالإنترنت، تحقق من الشبكة وحاول مرة أخرى';
  if(c==='auth/too-many-requests')return 'محاولات كثيرة جداً، انتظر قليلاً ثم حاول مرة أخرى';
  if(c==='auth/weak-password')return 'كلمة المرور ضعيفة، استخدم 6 أحرف على الأقل';
  if(c==='auth/email-already-in-use')return 'رقم الهاتف مسجل بالفعل، يمكنك تسجيل الدخول.';
  if(c==='auth/invalid-credential'||c==='auth/wrong-password'||c==='auth/user-not-found'||c==='auth/invalid-login-credentials')return null;
  return 'حدث خطأ: '+(e?.message||c||'غير معروف');
}

function registerPhone(){return once('register',doRegister)}
async function doRegister(){
  const name=$('#reg-name').value.trim().replace(/\s+/g,' ');
  const phone=normPhone($('#reg-phone').value);
  const pass=$('#reg-pass').value;
  const pass2=$('#reg-pass2').value;
  $('#reg-error').style.display='none';
  if(name.split(' ').filter(Boolean).length<4)return showErr('reg-error','يجب كتابة الاسم الرباعي كاملاً (4 مقاطع)');
  if(!/^01[0-9]{9}$/.test(phone))return showErr('reg-error','رقم الهاتف يجب أن يكون 11 رقم ويبدأ بـ 01');
  if(pass.length<6)return showErr('reg-error','كلمة المرور يجب أن تكون 6 أحرف على الأقل');
  if(pass!==pass2)return showErr('reg-error','كلمتا المرور غير متطابقتين');
  try{
    const fakeEmail=`${phone}@sigma.user`;
    const cred=await createUserWithEmailAndPassword(auth,fakeEmail,pass);
    const user=cred.user;
    await updateProfile(user,{displayName:name});
    await set(R('users/'+user.uid),{name,phone,email:fakeEmail,photo:'',createdAt:Date.now(),isSupervisor:false});
    toast('تم إنشاء الحساب بنجاح');
    setTimeout(()=>location.reload(),800);
  }catch(e){
    const m=authMsg(e);
    showErr('reg-error',m||'حدث خطأ غير متوقع');
  }
}

function loginPhone(){return once('login',doLogin)}
async function doLogin(){
  const phone=normPhone($('#login-phone').value);
  const pass=$('#login-pass').value;
  $('#login-error').style.display='none';
  if(!/^01[0-9]{9}$/.test(phone))return showErr('login-error','رقم الهاتف غير صحيح');
  if(!pass)return showErr('login-error','اكتب كلمة المرور');
  const failKey=`login_fails_${phone}`,lockKey=`login_lock_${phone}`;
  const lockTime=parseInt(localStorage.getItem(lockKey)||'0',10);
  if(lockTime){
    const remaining=Math.ceil((lockTime-Date.now())/60000);
    if(remaining>0)return showErr('login-error',`تم قفل الحساب مؤقتاً. يرجى المحاولة بعد ${remaining} دقيقة.`);
    localStorage.removeItem(lockKey);localStorage.removeItem(failKey);
  }
  try{
    await signInWithEmailAndPassword(auth,`${phone}@sigma.user`,pass);
    localStorage.removeItem(failKey);
    toast('تم تسجيل الدخول بنجاح');
  }catch(e){
    const m=authMsg(e);
    if(m!==null)return showErr('login-error',m);
    const fails=parseInt(localStorage.getItem(failKey)||'0',10)+1;
    if(fails>=3){
      localStorage.setItem(lockKey,String(Date.now()+15*60*1000));
      localStorage.removeItem(failKey);
      showErr('login-error','تم إدخال كلمة مرور خاطئة 3 مرات. الحساب مقفل لمدة 15 دقيقة.');
    }else{
      localStorage.setItem(failKey,String(fails));
      showErr('login-error',`رقم الهاتف أو كلمة المرور غير صحيحة (المحاولة ${fails} من 3)`);
    }
  }
}

function render(){

  const seq=++renderSeq;

  const views={
    home:vHome,teacher:vTeacher,code:vCode,watch:vWatch,
    admin:vAdmin,vid:vVid,edit:vEdit,settings:vSettings,
    library:vLibrary,editLib:vEditLib,students:vAdminStudents,
    news:vNews,studentProfile:vStudentProfile
  };
  const fn=views[S.v]||vHome;
  let res;
  try{res=fn()}
  catch(e){console.error(e);a.innerHTML=shell(`<div class="mut">حدث خطأ: ${esc(e.message)}</div>`);return}
  if(res&&typeof res.then==='function'){
    a.innerHTML=shell('<div class="mut">جارٍ التحميل…</div>');
    res.then(html=>{
      if(seq!==renderSeq)return;
      a.innerHTML=shell(html??'');afterRender();
    }).catch(e=>{
      if(seq!==renderSeq)return;
      console.error(e);a.innerHTML=shell(`<div class="mut">خطأ: ${esc(e.message)}</div>`);
    });
    return;
  }
  a.innerHTML=shell(res??'');afterRender();
}

async function buildStudentStats(){
  const myVideos=window.__mineVideos||{};
  const allLogs=(await G('logs'))||{};
  const mine={};
  for(const vid in allLogs){
    const rec=allLogs[vid] && allLogs[vid][U.uid];
    if(rec) mine[vid]=rec;
  }

  const totalVideos=Object.keys(videos).length;
  const watchedCount=Object.keys(mine).length;
  const openedCount=Object.keys(myVideos).length;
  const lockedCount=totalVideos-openedCount;

  const rows=[];
  for(const [vid,v] of Object.entries(videos)){
    const teacher=teachers[v.teacherId];
    const log=mine[vid];
    const isOpen=A||IS_SUPERVISOR||!!myVideos[vid];
    let status='';
    if(v.disabled&&!A&&!IS_SUPERVISOR) status='<span class="b r">موقوف</span>';
    else if(!isOpen) status='<span class="b y">يحتاج كود</span>';
    else if(log&&log.completed) status='<span class="b g">حضره كاملاً</span>';
    else if(log) status='<span class="b y">شاهد جزءاً</span>';
    else status='<span class="b g">مفتوح</span>';

    rows.push({
      vid,title:v.title||'-',teacher:teacher?.name||'-',grade:v.grade||'-',
      desc:v.desc||'',isOpen,status,log,watched:!!log,
      completed:!!(log&&log.completed),seconds:log?(log.seconds||0):0,
      disabled:!!v.disabled
    });
  }

  let filtered=rows;
  if(studentStatsFilter==='watched') filtered=rows.filter(r=>r.watched);
  else if(studentStatsFilter==='available') filtered=rows.filter(r=>r.isOpen&&!r.disabled);
  else if(studentStatsFilter==='locked') filtered=rows.filter(r=>!r.isOpen);

  filtered.sort((a,b)=>{
    const score=r=>r.watched?3:(r.isOpen?2:1);
    const d=score(b)-score(a);
    if(d) return d;
    return (b.log?.lastAt||0)-(a.log?.lastAt||0);
  });

  const summary=`
    <div class="stats-summary">
      <div class="stat-box"><div class="stat-num">${totalVideos}</div><div class="stat-label">إجمالي المحاضرات</div></div>
      <div class="stat-box ok"><div class="stat-num">${openedCount}</div><div class="stat-label">مفتوحة لك</div></div>
      <div class="stat-box warn"><div class="stat-num">${lockedCount}</div><div class="stat-label">تحتاج كود</div></div>
      <div class="stat-box"><div class="stat-num">${watchedCount}</div><div class="stat-label">حضرتها</div></div>
    </div>`;

  const filterBar=`
    <div class="stats-filter">
      <button class="${studentStatsFilter==='all'?'on':''}" onclick="setStatsFilter('all')">الكل</button>
      <button class="${studentStatsFilter==='watched'?'on':''}" onclick="setStatsFilter('watched')">حضرتها (${watchedCount})</button>
      <button class="${studentStatsFilter==='available'?'on':''}" onclick="setStatsFilter('available')">مفتوحة (${openedCount})</button>
      <button class="${studentStatsFilter==='locked'?'on':''}" onclick="setStatsFilter('locked')">مقفلة (${lockedCount})</button>
    </div>`;

  if(!filtered.length){
    return `<div class="box">
      <h2 style="color:var(--ac2);margin-bottom:14px">📊 إحصائياتي</h2>
      ${summary}
      ${filterBar}
      <div class="mut" style="padding:30px">لا توجد محاضرات مطابقة.</div>
    </div>`;
  }

  const tableRows=filtered.map(r=>{
    const watchBtn=r.isOpen&&!r.disabled
      ? `<button class="s" style="padding:5px 10px;font-size:11px;border-radius:8px" onclick="go('watch','${r.vid}')">مشاهدة</button>`
      : (!r.disabled ? `<button style="padding:5px 10px;font-size:11px;border-radius:8px" onclick="go('code','${r.vid}')">فتح بكود</button>` : '-');
    const mins=Math.round(r.seconds/60);
    return `<tr>
      <td><b>${esc(r.title)}</b>${r.desc?`<small style="display:block;color:var(--mu);font-size:11px;margin-top:2px">${esc(r.desc)}</small>`:''}</td>
      <td>${esc(r.teacher)}</td>
      <td><span class="grade-chip">${esc(r.grade)}</span></td>
      <td>${r.status}</td>

function vCode(){
  const v=videos[S.id];
  if(!v||v.disabled)return`<div class="mut">هذا الفيديو موقوف حالياً.</div>`;
  return`<button class="s" onclick="go('teacher','${esc(v.teacherId)}')" style="margin-bottom:16px">← رجوع</button>
  <div class="box"><h2>${esc(v.title)}</h2>
    <label for="cd">أدخل الكود المكوّن من 6 أرقام (يُستخدم مرة واحدة)</label>
    <input id="cd" class="code-input" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" onkeydown="if(event.key==='Enter')redeem('${S.id}')">
    <button onclick="redeem('${S.id}')" style="width:100%">فتح الفيديو</button>
  </div>`;
}
function redeem(vid){return once('redeem',()=>doRedeem(vid))}
async function doRedeem(vid){
  const v=videos[vid];if(!v||v.disabled)return toast('الفيديو موقوف');
  const c=normDigits($('#cd').value).replace(/\D/g,'');
  if(!/^\d{6}$/.test(c))return toast('الكود يجب أن يكون 6 أرقام');
  try{
    const r=await runTransaction(R('codes/'+c),cur=>{
      if(cur===null)return cur;
      if(cur.videoId!==vid)return;
      if(cur.used&&cur.usedBy!==U.uid)return;
      if(!cur.used)Object.assign(cur,{
        used:true,usedBy:U.uid,usedByName:U.displayName||'',
        usedByEmail:U.email||'',usedAt:Date.now()
      });
      return cur;
    });
    const vv=r.snapshot.val();
    if(!vv||vv.usedBy!==U.uid||vv.videoId!==vid)return toast('الكود غير صحيح أو مستخدم من قبل');
    await set(R(`users/${U.uid}/videos/${vid}`),c);
    window.__mineVideos={...(window.__mineVideos||{}),[vid]:c};
    go('watch',vid);
  }catch(e){console.error(e);toast('حدث خطأ أثناء التحقق من الكود')}
}

/* =========================================================
   WATCH — controls for ALL types
   ========================================================= */
async function vWatch(){
  const v=videos[S.id];if(!v)return vHome();
  const isStaff=A||IS_SUPERVISOR;
  if(v.disabled&&!isStaff)return`<div class="mut">هذا الفيديو موقوف حالياً.</div>`;
  let c,rec;
  try{
    if(isStaff){c='admin';rec={url:v.url}}
    else{
      c=window.__mineVideos?.[S.id]||(await G(`users/${U.uid}/videos/${S.id}`));
      if(!c)return vCode();
      rec=await G('codes/'+c);
      if(!rec||rec.usedBy!==U.uid||rec.videoId!==S.id){
        if(window.__mineVideos)delete window.__mineVideos[S.id];
        return vCode();
      }
    }
  }catch(e){return`<div class="mut">ليس لديك صلاحية لمشاهدة هذا الفيديو.</div>`}

  const e=embed(rec.url);
  if(!e.s)return`<div class="mut">رابط الفيديو غير صالح، تواصل مع الإدارة.</div>`;

  const lp=`logs/${S.id}/${U.uid}`;
  const old=isStaff?{}:((await G(lp))||{});
  let sec=old.seconds||0;
  const dur=(+v.duration||0)*60;

  stopHB();
  if(!isStaff){
    try{
      await update(R(lp),{
        name:U.displayName||'',email:U.email||'',code:c,
        openedAt:old.openedAt||Date.now(),lastAt:Date.now(),
        seconds:sec,completed:!!old.completed
      });
    }catch(err){console.warn('log init failed',err)}
    hb=setInterval(async()=>{
      if(document.hidden)return;
      sec+=10;
      const done=dur&&sec>=dur*.9;
      await update(R(lp),{seconds:sec,lastAt:Date.now(),completed:!!(done||old.completed)}).catch(()=>{});
    },10000);
  }

  const wm=isStaff?'':`<div class="wm">${badge?`<img src="${esc(badge)}" alt="">`:''}${esc(U.displayName||'')} · ${esc(myPhone||U.email||'')}</div>`;
  const isYT=e.t==='yt';

  let playerHTML='';
  if(e.t==='v')playerHTML=`<video id="vplayer" src="${esc(e.s)}" playsinline controlsList="nodownload"></video>`;
  else if(isYT)playerHTML=`<iframe id="vplayer" src="${esc(e.s)}" allow="autoplay;encrypted-media" referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
  else if(e.t==='drive')playerHTML=`<iframe id="vplayer" src="${esc(e.s)}" allow="autoplay;encrypted-media;fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
  else playerHTML=`<iframe id="vplayer" src="${esc(e.s)}" allow="autoplay;encrypted-media;fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" sandbox="allow-scripts allow-same-origin allow-presentation allow-popups"></iframe>`;

  const controlsHTML = `<div class="custom-player-ctrl">
    <div class="progress-row">
      <button id="playPauseBtn" class="play-btn" onclick="togglePlay()" aria-label="تشغيل/إيقاف">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <div class="progress-container">
        <div class="slider-wrap">
          <div class="slider-fill" id="seekFill" style="width:0%"></div>
          <input type="range" id="cSeek" min="0" max="100" value="0" step="0.1" oninput="onSeek(this.value)" aria-label="شريط التقدم">
        </div>
        <div class="time-row">
          <span class="time" id="cTime">0:00</span>
          <span class="time" id="dTime">0:00</span>
        </div>
      </div>
    </div>
    <div class="tools-row">
      <button class="tool-btn" onclick="seekRel(-5)">⏪ -5ث</button>
      <button class="tool-btn" onclick="seekRel(5)">+5ث ⏩</button>
      <div class="speed-box">
        <label>السرعة</label>
        <select id="speedSelector" onchange="setRate(this.value)" aria-label="سرعة التشغيل">
          <option value="0.5">0.5x</option>
          <option value="0.75">0.75x</option>
          <option value="1" selected>1x</option>
          <option value="1.25">1.25x</option>
          <option value="1.5">1.5x</option>
          <option value="2">2x</option>
        </select>
      </div>
      <button class="tool-btn" onclick="toggleFullscreen()">⛶ ملء الشاشة</button>
    </div>
  </div>`;

  setTimeout(()=>{
    window.__pendingEmbed={
      type:e.t,id:e.id||'',src:e.s,duration:+(v.duration||0)
    };
  },0);

  return`<button class="s" onclick="go('teacher','${esc(v.teacherId)}')">← رجوع</button>
  <h2 style="margin-top:14px">${esc(v.title)} ${isStaff?'<span class="b g">إدارة</span>':''}</h2>
  <div class="player-wrap">
    <div class="pl ${isYT?'crop-yt':''}" id="plbox">
      ${playerHTML}
      ${isYT?'<div class="yt-bottom-mask"></div><div class="yt-top-mask"></div>':''}
      ${wm}
    </div>

async function doAddNews(){

/* =========================================================
   CODES
   ========================================================= */
async function gen(vid,n,video){
  const v=video||videos[vid];
  if(!v)throw new Error('الفيديو غير موجود لتوليد الأكواد');
  let ok=0,attempts=0;
  while(ok<n&&attempts<n*10){
    const c=String(crypto.getRandomValues(new Uint32Array(1))[0]%900000+100000);
    try{
      const r=await runTransaction(R('codes/'+c),cur=>cur===null
        ?{videoId:vid,url:v.url,title:v.title||'',used:false,createdAt:Date.now()}
        :undefined);
      if(r.committed)ok++;
    }catch(e){}
    attempts++;
  }
  return ok;
}
function moreCodes(vid,one){return once('moreCodes',()=>doMoreCodes(vid,one))}
async function doMoreCodes(vid,one){
  const n=one?1:Math.min(+$('#gn').value||0,500);
  if(!n)return toast('اكتب العدد');
  toast('جارٍ التوليد...');
  try{const ok=await gen(vid,n);toast(`تم توليد ${ok} كود`);render()}
  catch(e){toast('تعذر التوليد')}
}

const cp=async t=>{
  try{
    if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(t)}
    else{
      const el=document.createElement('textarea');el.value=t;el.style.position='fixed';el.style.opacity='0';
      document.body.appendChild(el);el.select();const ok=document.execCommand('copy');el.remove();
      if(!ok)throw new Error('تعذر النسخ');
    }
    toast('تم النسخ');
  }catch(e){toast('تعذر النسخ تلقائياً؛ حاول تحديد النص ونسخه')}
};

    if(!a.length)return toast('لا توجد أكواد متاحة');
    cp(a.join('\n'));
  }catch(e){toast('تعذر جلب الأكواد')}
}

/* =========================================================
   UNIVERSAL PLAYER INIT
   ========================================================= */
function initPlayer(){
  destroyPlayer();
  const pending = window.__pendingEmbed || null;
  if(!pending) return;

  if(pending.type === 'v'){
    initNativePlayer();
  } else if(pending.type === 'yt'){
    initYTPlayer(pending.id);
  } else {
    initIframeFallback(pending.duration);
  }
}

function initNativePlayer(){
  const video=document.querySelector('.pl video');
  if(!video)return;
  currentPlayerType='native';

  const playIcon=$('#playIcon');
  const seekFill=$('#seekFill');

  const updatePlayIcon=()=>{
    if(!playIcon)return;
    playIcon.innerHTML=video.paused
      ? '<path d="M8 5v14l11-7z"/>'
      : '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
  };

  video.addEventListener('play',updatePlayIcon);
  video.addEventListener('pause',updatePlayIcon);
  video.addEventListener('ended',updatePlayIcon);

  video.addEventListener('timeupdate',()=>{
    const cur=$('#cTime'),dur=$('#dTime'),seek=$('#cSeek');
    if(cur)cur.textContent=fmtTime(video.currentTime);
    if(dur)dur.textContent=fmtTime(video.duration);
    if(seek&&Number.isFinite(video.duration)&&video.duration>0){
      const pct=video.currentTime/video.duration*100;
      seek.value=String(pct);
      if(seekFill)seekFill.style.width=pct+'%';
    }
  });

  video.addEventListener('loadedmetadata',()=>{
    const dur=$('#dTime');
    if(dur)dur.textContent=fmtTime(video.duration);
  });

  updatePlayIcon();
}

function initYTPlayer(videoId){
  currentPlayerType='yt';
  onYTReady(()=>{
    const iframe=document.getElementById('vplayer');
    if(!iframe) return;
    try{
      currentYTPlayer=new YT.Player('vplayer',{
        events:{
          'onReady':(ev)=>{ attachYTControls(ev.target); },
          'onStateChange':(ev)=>{ updateYTPlayIcon(ev.data); }
        }
      });
    }catch(err){
      console.warn('YT init failed, using iframe fallback',err);
      initIframeFallback(0);
    }
  });
}

function attachYTControls(yt){
  currentYTPlayer=yt;
  const playIcon=$('#playIcon');
  const seekFill=$('#seekFill');
  const cTime=$('#cTime');
  const dTime=$('#dTime');
  const seek=$('#cSeek');

  const updateUI=()=>{
    if(!currentYTPlayer||!currentYTPlayer.getCurrentTime) return;
    try{
      const cur=currentYTPlayer.getCurrentTime()||0;
      const total=currentYTPlayer.getDuration()||0;
      if(cTime)cTime.textContent=fmtTime(cur);
      if(dTime)dTime.textContent=fmtTime(total);
      if(seek&&total>0){
        const pct=cur/total*100;
        seek.value=String(pct);
        if(seekFill)seekFill.style.width=pct+'%';
      }
    }catch(e){}
  };

  if(currentYTUiTimer){clearInterval(currentYTUiTimer)}
  currentYTUiTimer=setInterval(()=>{
    if(!currentYTPlayer||typeof currentYTPlayer.getPlayerState!=='function'){
      clearInterval(currentYTUiTimer);currentYTUiTimer=null;return;
    }
    const st=currentYTPlayer.getPlayerState();
    if(st===1) updateUI();
  },250);
}

function updateYTPlayIcon(state){
  const icon=$('#playIcon');
  if(!icon) return;
  if(state===1){
    icon.innerHTML='<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
  } else {
    icon.innerHTML='<path d="M8 5v14l11-7z"/>';
  }
}

function initIframeFallback(durationMinutes){
  currentPlayerType='iframe';
  iframePlaying=false;
  iframeTime=0;
  iframeDuration=(durationMinutes||0)*60;

  const dTime=$('#dTime');
  if(dTime&&iframeDuration>0) dTime.textContent=fmtTime(iframeDuration);

  if(iframeTimer)clearInterval(iframeTimer);
  iframeTimer=setInterval(()=>{
    if(document.hidden)return;
    if(iframePlaying&&iframeDuration>0){
      iframeTime=Math.min(iframeDuration,iframeTime+1);
      const cTime=$('#cTime');
      const seek=$('#cSeek');
      const seekFill=$('#seekFill');
      if(cTime)cTime.textContent=fmtTime(iframeTime);
      if(seek&&iframeDuration>0){
        const pct=iframeTime/iframeDuration*100;
        seek.value=String(pct);
        if(seekFill)seekFill.style.width=pct+'%';
      }
    }
  },1000);
}

function fmtTime(value){
  if(!Number.isFinite(value)||value<0)return '0:00';
  const n=Math.floor(value);
  return Math.floor(n/60)+':'+String(n%60).padStart(2,'0');
}

/* =========================================================
   UNIVERSAL PLAYER CONTROLS
   ========================================================= */
function togglePlay(){
  if(currentPlayerType==='native'){
    const v=document.querySelector('.pl video');
    if(!v)return;
    if(v.paused)v.play().catch(()=>{});
    else v.pause();
    return;
  }
  if(currentPlayerType==='yt'&&currentYTPlayer&&currentYTPlayer.playVideo){
    try{
      const st=currentYTPlayer.getPlayerState();
      if(st===1) currentYTPlayer.pauseVideo();
      else currentYTPlayer.playVideo();
    }catch(e){toast('تعذر التحكم بالفيديو')}
    return;
  }
  if(currentPlayerType==='iframe'){
    iframePlaying=!iframePlaying;
    const icon=$('#playIcon');
    if(icon){
      icon.innerHTML=iframePlaying
        ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>'
        : '<path d="M8 5v14l11-7z"/>';
    }
    if(iframePlaying){
      toast('الفيديو الخارجي — اضغط تشغيل داخل المشغل إن لم يبدأ تلقائياً');
    }
    return;
  }
}

function onSeek(value){
  const pct=Number(value)||0;
  if(currentPlayerType==='native'){
    const v=document.querySelector('.pl video');
    if(v&&Number.isFinite(v.duration)&&v.duration>0){
      v.currentTime=pct/100*v.duration;
    }
  } else if(currentPlayerType==='yt'&&currentYTPlayer&&currentYTPlayer.getDuration){
    try{
      const total=currentYTPlayer.getDuration();
      if(total>0) currentYTPlayer.seekTo(pct/100*total,true);
    }catch(e){}
  } else if(currentPlayerType==='iframe'&&iframeDuration>0){
    iframeTime=pct/100*iframeDuration;
    const cTime=$('#cTime');
    if(cTime)cTime.textContent=fmtTime(iframeTime);
    const seekFill=$('#seekFill');
    if(seekFill)seekFill.style.width=pct+'%';
  }
}

function seekRel(seconds){
  const delta=Number(seconds)||0;
  if(currentPlayerType==='native'){
    const v=document.querySelector('.pl video');
    if(v&&Number.isFinite(v.duration)){
      v.currentTime=Math.max(0,Math.min(v.duration,v.currentTime+delta));
    }
  } else if(currentPlayerType==='yt'&&currentYTPlayer&&currentYTPlayer.getCurrentTime){
    try{
      const cur=currentYTPlayer.getCurrentTime()||0;
      const total=currentYTPlayer.getDuration()||0;
      currentYTPlayer.seekTo(Math.max(0,Math.min(total,cur+delta)),true);
    }catch(e){}
  } else if(currentPlayerType==='iframe'&&iframeDuration>0){
    iframeTime=Math.max(0,Math.min(iframeDuration,iframeTime+delta));
    const cTime=$('#cTime');
    if(cTime)cTime.textContent=fmtTime(iframeTime);
    const pct=iframeTime/iframeDuration*100;
    const seekFill=$('#seekFill');
    if(seekFill)seekFill.style.width=pct+'%';
    const seek=$('#cSeek');
    if(seek)seek.value=String(pct);
  }
}

function setRate(value){
  const rate=Number(value);
  if(!Number.isFinite(rate)||rate<=0)return;
  if(currentPlayerType==='native'){
    const v=document.querySelector('.pl video');
    if(v)v.playbackRate=rate;
  } else if(currentPlayerType==='yt'&&currentYTPlayer&&currentYTPlayer.setPlaybackRate){
    try{currentYTPlayer.setPlaybackRate(rate)}catch(e){}
  }
}

function toggleFullscreen(){
  const el=document.querySelector('.pl');
  if(!el)return;
  if(document.fullscreenElement){
    document.exitFullscreen?.().catch(()=>{});
  } else if(el.requestFullscreen){
    el.requestFullscreen().catch(()=>{});
  } else {
    toast('ملء الشاشة غير مدعوم في هذا المتصفح');
  }
}

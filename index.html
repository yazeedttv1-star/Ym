<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>واتساب ويب بسيط</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #d1dbe4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    /* الحاوية الرئيسية للتطبيق */
    .app-container {
      width: 900px;
      height: 90vh;
      background-color: #fff;
      display: flex;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      border-radius: 8px;
      overflow: hidden;
    }

    /* القائمة الجانبية (الشات الجانبي) */
    .sidebar {
      width: 35%;
      border-left: 1px solid #e0e0e0;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 15px;
      background-color: #f0f2f5;
      font-weight: bold;
      color: #008069;
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
    }

    .chat-item {
      display: flex;
      align-items: center;
      padding: 12px 15px;
      border-bottom: 1px solid #f0f2f5;
      cursor: pointer;
      transition: 0.2s;
    }

    .chat-item:hover, .chat-item.active {
      background-color: #f0f2f5;
    }

    .avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background-color: #128c7e;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      margin-left: 12px;
    }

    .chat-info h4 {
      font-size: 15px;
      color: #111b21;
    }

    .chat-info p {
      font-size: 13px;
      color: #667781;
      margin-top: 3px;
    }

    /* منطقة المحادثة Main Chat Area */
    .main-chat {
      width: 65%;
      display: flex;
      flex-direction: column;
      background-color: #efeae2;
    }

    .chat-header {
      padding: 10px 15px;
      background-color: #f0f2f5;
      display: flex;
      align-items: center;
      border-bottom: 1px solid #e0e0e0;
    }

    .messages-container {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* الفقاعات (الرسائل) */
    .message {
      max-width: 65%;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.4;
      position: relative;
      word-wrap: break-word;
    }

    .message.incoming {
      background-color: #ffffff;
      align-self: flex-start;
      border-top-right-radius: 0;
    }

    .message.outgoing {
      background-color: #d9fdd3;
      align-self: flex-end;
      border-top-left-radius: 0;
    }

    /* منطقة إدخال النص */
    .chat-input-area {
      padding: 10px 15px;
      background-color: #f0f2f5;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chat-input-area input {
      flex: 1;
      padding: 10px 15px;
      border: none;
      border-radius: 20px;
      outline: none;
      font-size: 14px;
    }

    .send-btn {
      background-color: #008069;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
    }

    .send-btn:hover {
      background-color: #006e5a;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="sidebar">
      <div class="sidebar-header">
        واتساب ويب
      </div>
      <div class="chat-list">
        <div class="chat-item active">
          <div class="avatar">أ</div>
          <div class="chat-info">
            <h4>أحمد علي</h4>
            <p>أهلاً، كيف حالك؟</p>
          </div>
        </div>
      </div>
    </div>

    <div class="main-chat">
      <div class="chat-header">
        <div class="avatar">أ</div>
        <div class="chat-info" style="margin-right: 10px;">
          <h4>أحمد علي</h4>
          <p style="font-size: 11px; color: #667781;">متصل الآن</p>
        </div>
      </div>

      <div class="messages-container" id="messagesContainer">
        <div class="message incoming">
          أهلاً بك! كيف يمكنني مساعدتك اليوم؟
        </div>
      </div>

      <form class="chat-input-area" id="chatForm">
        <input type="text" id="messageInput" placeholder="اكتب رسالة..." autocomplete="off">
        <button type="submit" class="send-btn">إرسال</button>
      </form>
    </div>
  </div>

  <script>
    const chatForm = document.getElementById('chatForm');
    const messageInput = document.getElementById('messageInput');
    const messagesContainer = document.getElementById('messagesContainer');

    // دالة إضافة رسالة جديدة للشاشة
    function addMessage(text, type) {
      const messageDiv = document.createElement('div');
      messageDiv.classList.add('message', type);
      messageDiv.textContent = text;
      
      messagesContainer.appendChild(messageDiv);
      // التمرير لأسفل تلقائياً عند إضافة رسالة
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // التعامل مع إرسال النموذج
    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      
      const text = messageInput.value.trim();
      if (text !== '') {
        // 1. إضافة رسالتك (الصادرة)
        addMessage(text, 'outgoing');
        messageInput.value = '';

        // 2. محاكاة رد تلقائي بسيط بعد ثانية واحدة (الواردة)
        setTimeout(() => {
          addMessage('تم استلام رسالتك بنجاح! 👍', 'incoming');
        }, 1000);
      }
    });
  </script>

</body>
</html>

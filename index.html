<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY Chat App</title>
    <!-- CSS & FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme">

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <!-- Sidebar Header -->
            <header class="sidebar-header">
                <div class="user-profile">
                    <img src="https://via.placeholder.com/40" id="user-avatar" alt="Profile">
                    <span id="user-name">اسم المستخدم</span>
                </div>
                <div class="header-actions">
                    <button id="theme-toggle-btn" title="تبديل المظهر (داكن/فاتح)">
                        <i class="fa-solid fa-moon"></i>
                    </button>
                    <button id="status-btn" title="الحالات"><i class="fa-solid fa-circle-notch"></i></button>
                    <button id="channels-btn" title="القنوات والمجموعات"><i class="fa-solid fa-users"></i></button>
                    <button id="settings-btn" title="الإعدادات"><i class="fa-solid fa-gear"></i></button>
                </div>
            </header>

            <!-- Search Bar & Filters -->
            <div class="search-container">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="search-input" placeholder="بحث أو بدء محادثة جديدة...">
                </div>
                <div class="filter-chips">
                    <button class="chip active" data-filter="all">الكل</button>
                    <button class="chip" data-filter="unread">غير مقروءة</button>
                    <button class="chip" data-filter="groups">المجموعات</button>
                    <button class="chip" data-filter="channels">القنوات</button>
                </div>
            </div>

            <!-- Chat List -->
            <div class="chat-list" id="chat-list">
                <!-- قائمة المحادثات سيتم إنشاؤها عبر JavaScript -->
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-area">
            <!-- Chat Header -->
            <header class="chat-header" id="chat-header">
                <div class="active-chat-info">
                    <img src="https://via.placeholder.com/40" id="active-chat-avatar" alt="Avatar">
                    <div class="chat-details">
                        <h3 id="active-chat-name">اختر محادثة لبدء الدردشة</h3>
                        <p id="active-chat-status">متصل الان | جاري الكتابة...</p>
                    </div>
                </div>
                <div class="chat-actions">
                    <button id="voice-call-btn" title="مكالمة صوتية"><i class="fa-solid fa-phone"></i></button>
                    <button id="video-call-btn" title="مكالمة فيديو"><i class="fa-solid fa-video"></i></button>
                    <button id="search-chat-btn" title="بحث في المحادثة"><i class="fa-solid fa-magnifying-glass"></i></button>
                    <button id="chat-menu-btn" title="خيارات إضافية"><i class="fa-solid fa-ellipsis-vertical"></i></button>
                </div>
            </header>

            <!-- Message Area -->
            <div class="messages-container" id="messages-container">
                <div class="welcome-screen">
                    <i class="fa-brands fa-whatsapp"></i>
                    <h2>MY Chat Web</h2>
                    <p>أرسل واستقبل الرسائل والمستندات بخصوصية وأمان تام.</p>
                </div>
            </div>

            <!-- Input Area -->
            <footer class="input-area" id="input-area">
                <div class="attachment-wrapper">
                    <button id="emoji-btn" title="إيموجي"><i class="fa-regular fa-face-smile"></i></button>
                    <button id="attach-btn" title="إرفاق ملف"><i class="fa-solid fa-paperclip"></i></button>
                    <input type="file" id="file-input" hidden multiple>
                </div>

                <div class="text-input-wrapper">
                    <textarea id="message-input" placeholder="اكتب رسالة..." rows="1"></textarea>
                </div>

                <div class="action-btn-wrapper">
                    <button id="voice-note-btn" title="تسجيل صوتي"><i class="fa-solid fa-microphone"></i></button>
                    <button id="send-btn" title="إرسال" class="hidden"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </footer>
        </main>
    </div>

    <!-- Modals & Overlays -->
    <!-- Status / Stories Modal -->
    <div class="modal hidden" id="status-modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>الحالات والاستوري</h2>
            <div class="status-list" id="status-list"></div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>

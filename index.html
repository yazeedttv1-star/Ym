<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#075e54">
<title>Chat App Pro</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  --green-dark:#075e54;--green:#128c7e;--green-light:#25d366;
  --green-pale:#d9fdd3;--bg-chat:#efeae2;--bg-panel:#f0f2f5;
  --text:#111b21;--text-muted:#667781;--border:#e0e0e0;
  --red:#ff4444;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:#0b141a}
body{display:flex;justify-content:center;align-items:center}

/* شاشة المصادقة */
.auth-screen{position:fixed;inset:0;background:linear-gradient(135deg,#075e54,#128c7e,#25d366);display:flex;justify-content:center;align-items:center;z-index:1000;padding:20px;overflow-y:auto}
.auth-screen.hidden{opacity:0;pointer-events:none}
.auth-box{background:#fff;padding:30px 25px;border-radius:15px;width:100%;max-width:400px;box-shadow:0 20px 50px rgba(0,0,0,.3);margin:auto}
.auth-box .logo{width:70px;height:70px;background:var(--green-light);border-radius:50%;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff}
.auth-box h1{color:var(--green-dark);margin-bottom:6px;font-size:22px;text-align:center}
.auth-box p.subtitle{color:var(--text-muted);margin-bottom:22px;font-size:13px;text-align:center}
.auth-box input{width:100%;padding:13px 15px;margin-bottom:10px;border:2px solid #e9edef;border-radius:10px;font-size:14px;outline:none;text-align:right;font-family:inherit}
.auth-box input:focus{border-color:var(--green-light)}
.btn-primary{width:100%;padding:13px;background:var(--green-light);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:bold;cursor:pointer;font-family:inherit}
.btn-primary:hover{background:#1ebe5b}
.btn-primary:disabled{background:#b1b3b5;cursor:not-allowed}
.btn-google{width:100%;padding:13px;background:#fff;color:#444;border:2px solid #dadce0;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px;font-family:inherit}
.btn-google:hover{background:#f8f9fa}
.toggle-link{text-align:center;margin-top:15px;font-size:13px;color:var(--text-muted)}
.toggle-link a{color:var(--green-light);font-weight:bold;cursor:pointer}
.error-msg{background:#ffe5e5;color:#c00;padding:10px;border-radius:8px;font-size:13px;margin-bottom:12px;display:none;text-align:right}
.error-msg.show{display:block}
.divider{display:flex;align-items:center;gap:10px;margin:15px 0;color:#999;font-size:12px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}

/* التطبيق */
.app{width:100%;max-width:480px;height:100vh;height:100dvh;background:#fff;display:none;flex-direction:column;overflow:hidden;position:relative}
.app.active{display:flex}
@media(min-width:900px){.app{max-width:1100px;height:90vh;max-height:850px;border-radius:15px;box-shadow:0 20px 60px rgba(0,0,0,.6);flex-direction:row}}

.app-header{background:var(--green-dark);color:#fff;padding:12px 15px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.app-header .user-avatar{width:42px;height:42px;background:var(--green-light);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:17px;color:#fff;flex-shrink:0;overflow:hidden}
.app-header .user-avatar img{width:100%;height:100%;object-fit:cover}
.app-header .user-info{flex:1;min-width:0}
.app-header .user-info h2{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-header .user-info .sub{font-size:11.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-header .icon-btn{background:transparent;border:none;color:#fff;font-size:18px;cursor:pointer;padding:8px;border-radius:50%}
.app-header .icon-btn:hover{background:rgba(255,255,255,.15)}

.app-content{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column;background:#fff}
.tabs{display:flex;background:var(--green-dark);flex-shrink:0}
.tab{flex:1;padding:12px 8px;background:transparent;border:none;color:rgba(255,255,255,.6);font-size:13px;font-weight:600;cursor:pointer;position:relative;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px}
.tab.active{color:#fff}
.tab.active::after{content:'';position:absolute;bottom:0;left:15%;right:15%;height:3px;background:#fff;border-radius:3px 3px 0 0}
.tab .icon{font-size:17px}
.sections{flex:1;position:relative;overflow:hidden}
.section{position:absolute;inset:0;overflow-y:auto;display:none;flex-direction:column;animation:fadeIn .2s ease}
.section.active{display:flex}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.search-box{padding:10px 15px;background:#fff;border-bottom:1px solid var(--border);flex-shrink:0}
.search-box input{width:100%;padding:9px 14px;border:none;background:var(--bg-panel);border-radius:20px;font-size:14px;outline:none;text-align:right;font-family:inherit}
.chat-list{flex:1;overflow-y:auto}
.chat-item{display:flex;align-items:center;gap:12px;padding:12px 15px;cursor:pointer;border-bottom:1px solid #f5f5f5}
.chat-item:hover{background:#f5f5f5}
.chat-item .avatar{width:50px;height:50px;background:var(--green-light);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;font-size:20px;flex-shrink:0;overflow:hidden;position:relative}
.chat-item .avatar img{width:100%;height:100%;object-fit:cover}
.chat-item .details{flex:1;min-width:0}
.chat-item .details .name{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-item .details .last-msg{font-size:13px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px;display:flex;align-items:center;gap:5px}
.chat-item .meta{display:flex;flex-direction:column;align-items:flex-start;gap:4px;flex-shrink:0}
.chat-item .meta .time{font-size:11.5px;color:var(--text-muted)}
.chat-item .meta .badge{background:var(--green-light);color:#fff;font-size:11px;padding:2px 7px;border-radius:10px;font-weight:bold}
.empty-state{padding:50px 20px;text-align:center;color:var(--text-muted);font-size:14px}
.empty-state .big-icon{font-size:50px;opacity:.3;margin-bottom:15px}

.fab{position:absolute;bottom:20px;left:20px;width:56px;height:56px;background:var(--green-light);border-radius:50%;border:none;color:#fff;font-size:22px;cursor:pointer;box-shadow:0 4px 12px rgba(37,211,102,.4);display:flex;align-items:center;justify-content:center;z-index:5}
.fab:hover{transform:scale(1.08)}

/* الاستوري */
.stories-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(95px,1fr));gap:12px;padding:15px}
.story-card{aspect-ratio:9/14;border-radius:12px;overflow:hidden;position:relative;cursor:pointer;background:linear-gradient(135deg,#075e54,#25d366);color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-shadow:0 2px 8px rgba(0,0,0,.15);background-size:cover;background-position:center}
.story-card.add{background:linear-gradient(135deg,#e0e0e0,#b1b3b5);color:#555;justify-content:center;align-items:center;font-size:40px}
.story-card .story-avatar{width:34px;height:34px;border-radius:50%;border:2px solid #fff;background:rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:14px;overflow:hidden;margin-bottom:6px}
.story-card .story-avatar img{width:100%;height:100%;object-fit:cover}
.story-card .story-name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* المكالمات */
.call-item{display:flex;align-items:center;gap:12px;padding:14px 15px;border-bottom:1px solid #f5f5f5}
.call-item .avatar{width:48px;height:48px;border-radius:50%;background:var(--green-light);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:18px;flex-shrink:0;overflow:hidden}
.call-item .avatar img{width:100%;height:100%;object-fit:cover}
.call-item .info{flex:1;min-width:0}
.call-item .info .name{font-weight:600;font-size:14.5px}
.call-item .info .meta{font-size:12px;color:var(--text-muted);margin-top:3px;display:flex;align-items:center;gap:5px}
.call-item .info .meta .in{color:#25d366}
.call-item .info .meta .out{color:#ff4444}

/* المحادثة */
.chat-view{position:absolute;inset:0;background:var(--bg-chat);display:none;flex-direction:column;z-index:20;animation:slideIn .25s ease}
.chat-view.active{display:flex}
@keyframes slideIn{from{transform:translateX(-100%)}to{transform:translateX(0)}}
.chat-view .header{background:var(--green-dark);color:#fff;padding:10px 12px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.chat-view .header .back-btn{background:transparent;border:none;color:#fff;font-size:20px;cursor:pointer;padding:5px}
.chat-view .header .avatar{width:40px;height:40px;border-radius:50%;background:var(--green-light);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;font-size:16px;overflow:hidden;flex-shrink:0}
.chat-view .header .avatar img{width:100%;height:100%;object-fit:cover}
.chat-view .header .info{flex:1;min-width:0}
.chat-view .header .info .name{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-view .header .info .status{font-size:11.5px;opacity:.85;display:flex;align-items:center;gap:5px}
.chat-view .header .info .status.online::before{content:'';width:7px;height:7px;background:var(--green-light);border-radius:50%}
.chat-view .header .icon-btn{background:transparent;border:none;color:#fff;font-size:16px;cursor:pointer;padding:8px;border-radius:50%}
.chat-view .messages-area{flex:1;padding:15px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.message-row{display:flex;width:100%;animation:fadeIn .2s ease}
.message-row.mine{justify-content:flex-start}
.message-row.other{justify-content:flex-end}
.message{max-width:78%;padding:7px 11px 5px;border-radius:10px;font-size:14.5px;word-wrap:break-word;box-shadow:0 1px 1px rgba(0,0,0,.08);line-height:1.4;position:relative}
.message.mine{background:var(--green-pale);border-top-right-radius:3px}
.message.other{background:#fff;border-top-left-radius:3px}
.message .msg-meta{font-size:10.5px;color:var(--text-muted);margin-top:3px;display:flex;justify-content:flex-start;align-items:center;gap:4px}
.message .check{font-size:11.5px;color:#53bdeb}
.message .check.read{color:#34b7f1}
.message .encrypted-badge{font-size:9.5px;color:var(--green);margin-left:5px}
.date-separator{align-self:center;background:#fff;color:var(--text-muted);font-size:11.5px;padding:5px 12px;border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.08);margin:8px 0;font-weight:500}

/* مشغل الصوت */
.audio-message{display:flex;align-items:center;gap:10px;min-width:200px}
.audio-message button{width:38px;height:38px;border-radius:50%;background:var(--green-light);color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px}
.audio-message .audio-progress{flex:1;height:3px;background:rgba(0,0,0,.15);border-radius:3px;position:relative;overflow:hidden}
.audio-message .audio-progress .fill{position:absolute;top:0;right:0;height:100%;width:0%;background:var(--green-light);transition:width .1s}
.audio-message .duration{font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums}

/* منطقة الإدخال */
.chat-view .input-area{display:flex;padding:8px 10px;background:var(--bg-panel);gap:6px;align-items:center;flex-shrink:0}
.chat-view .input-area input{flex:1;padding:11px 15px;border:none;border-radius:25px;outline:none;font-size:15px;background:#fff;text-align:right;font-family:inherit}
.chat-view .input-area button{width:44px;height:44px;border-radius:50%;background:var(--green-light);color:#fff;border:none;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chat-view .input-area .mic-btn{background:#fff;color:var(--green-dark)}
.chat-view .input-area .mic-btn.recording{background:var(--red);color:#fff;animation:pulse-rec .8s infinite}
@keyframes pulse-rec{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* مؤشر التسجيل */
.recording-indicator{position:absolute;bottom:70px;right:15px;background:var(--red);color:#fff;padding:10px 15px;border-radius:20px;font-size:13px;display:none;align-items:center;gap:8px;z-index:5}
.recording-indicator.show{display:flex}
.recording-indicator .dot{width:8px;height:8px;background:#fff;border-radius:50%;animation:pulse-rec .8s infinite}

/* نوافذ */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;justify-content:center;align-items:center;z-index:500;padding:20px}
.modal-overlay.active{display:flex}
.modal{background:#fff;border-radius:15px;padding:22px;width:100%;max-width:400px;max-height:85vh;overflow-y:auto;animation:popIn .25s ease}
@keyframes popIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.modal h3{color:var(--green-dark);font-size:18px;margin-bottom:15px;text-align:center}
.modal .user-search-item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:10px;cursor:pointer}
.modal .user-search-item:hover{background:#f0f2f5}
.modal .user-search-item .avatar{width:45px;height:45px;background:var(--green-light);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;font-size:18px;overflow:hidden;flex-shrink:0}
.modal .user-search-item .avatar img{width:100%;height:100%;object-fit:cover}
.modal .user-search-item .details{flex:1;min-width:0}
.modal .user-search-item .details .name{font-weight:600;font-size:14.5px}
.modal .user-search-item .details .email{font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modal .btn-secondary{width:100%;padding:12px;background:#f0f2f5;color:var(--text);border:none;border-radius:10px;font-size:14px;cursor:pointer;font-family:inherit;margin-top:15px}

/* عارض الاستوري */
.story-viewer{position:fixed;inset:0;background:#000;z-index:800;display:none;flex-direction:column}
.story-viewer.active{display:flex}
.story-viewer .progress-bar{position:absolute;top:12px;left:12px;right:12px;height:3px;background:rgba(255,255,255,.3);border-radius:3px;overflow:hidden;z-index:5}
.story-viewer .progress-bar .fill{height:100%;background:#fff;width:0%;animation:progress 5s linear forwards}
@keyframes progress{from{width:0%}to{width:100%}}
.story-viewer .story-header{position:absolute;top:25px;left:15px;right:15px;display:flex;align-items:center;gap:12px;color:#fff;z-index:5}
.story-viewer .story-header .avatar{width:38px;height:38px;border-radius:50%;background:var(--green-light);display:flex;align-items:center;justify-content:center;font-weight:bold;overflow:hidden}
.story-viewer .story-header .avatar img{width:100%;height:100%;object-fit:cover}
.story-viewer .story-header .name{font-weight:600;font-size:14px}
.story-viewer .story-header .time{font-size:12px;opacity:.8}
.story-viewer .close-btn{position:absolute;top:25px;left:15px;background:transparent;border:none;color:#fff;font-size:26px;cursor:pointer;z-index:10;padding:5px}
.story-viewer .story-content{flex:1;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;padding:30px;text-align:center;word-break:break-word;background:linear-gradient(135deg,#075e54,#128c7e,#25d366)}

/* شاشة المكالمة */
.call-screen{position:fixed;inset:0;background:linear-gradient(135deg,#075e54,#0b141a);z-index:900;display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;padding:20px}
.call-screen.active{display:flex}
.call-screen .call-avatar{width:130px;height:130px;border-radius:50%;background:var(--green-light);display:flex;align-items:center;justify-content:center;font-size:55px;font-weight:bold;margin-bottom:25px;box-shadow:0 0 0 0 rgba(37,211,102,.7);animation:pulse 2s infinite;overflow:hidden}
.call-screen .call-avatar img{width:100%;height:100%;object-fit:cover}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(37,211,102,.7)}70%{box-shadow:0 0 0 30px rgba(37,211,102,0)}100%{box-shadow:0 0 0 0 rgba(37,211,102,0)}}
.call-screen .call-name{font-size:24px;font-weight:600;margin-bottom:8px}
.call-screen .call-status{font-size:15px;opacity:.85;margin-bottom:30px}
.call-screen .call-timer{font-size:14px;opacity:.7;margin-bottom:30px;font-variant-numeric:tabular-nums}
.call-screen .call-actions{display:flex;gap:30px}
.call-screen .call-actions button{width:65px;height:65px;border-radius:50%;border:none;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.call-screen .end-call{background:var(--red);color:#fff}
.call-screen .mute-call{background:rgba(255,255,255,.2);color:#fff}
.call-screen .mute-call.active{background:#fff;color:var(--green-dark)}

/* فيديو المكالمة */
.call-screen .video-container{position:absolute;inset:0;display:none}
.call-screen.video-call .video-container{display:block}
.call-screen.video-call .call-avatar,
.call-screen.video-call .call-name,
.call-screen.video-call .call-status{display:none}
.call-screen .remote-video{width:100%;height:100%;object-fit:cover;background:#000}
.call-screen .local-video{position:absolute;top:20px;left:20px;width:100px;height:140px;object-fit:cover;border-radius:10px;border:2px solid #fff;background:#000;z-index:2}
.call-screen .video-overlay{position:absolute;bottom:100px;left:0;right:0;text-align:center;z-index:3}
.call-screen .video-overlay .call-name{display:block;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.8)}
.call-screen .video-overlay .call-timer{display:block;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.8)}

/* شريط سفلي */
.bottom-nav{display:flex;background:var(--green-dark);flex-shrink:0;height:60px;border-top:1px solid rgba(255,255,255,.1)}
@media(min-width:900px){.bottom-nav{display:none}}
.bottom-nav .nav-btn{flex:1;background:transparent;border:none;color:rgba(255,255,255,.6);font-size:11.5px;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative}
.bottom-nav .nav-btn.active{color:#fff}
.bottom-nav .nav-btn .icon{font-size:20px}
.bottom-nav .nav-btn .badge{position:absolute;top:8px;right:calc(50% - 22px);background:var(--green-light);color:#fff;font-size:10px;padding:2px 6px;border-radius:10px;font-weight:bold;min-width:18px}

@media(min-width:900px){.sidebar{display:flex;width:380px;flex-shrink:0;border-left:1px solid var(--border);background:#fff;flex-direction:column}}
@media(max-width:899px){.sidebar{display:none}}
</style>
</head>
<body>
<!-- ... سيتم إضافة HTML في الجزء الثاني ... -->

  <!-- شاشة المصادقة -->
<div class="auth-screen" id="authScreen">
  <div class="auth-box">
    <div class="logo"><i class="fas fa-comments"></i></div>
    <h1>Chat App Pro</h1>
    <p class="subtitle" id="formSubtitle">سجّل دخولك للمتابعة</p>
    <div class="error-msg" id="errorMsg"></div>
    <input type="email" id="emailInput" placeholder="البريد الإلكتروني" autocomplete="email">
    <input type="password" id="passwordInput" placeholder="كلمة المرور" autocomplete="current-password">
    <input type="text" id="displayNameInput" placeholder="الاسم الظاهر" style="display:none;" maxlength="30">
    <input type="tel" id="phoneInput" placeholder="رقم الهاتف (اختياري، للبحث)" style="display:none;" maxlength="20">
    <button class="btn-primary" id="authBtn">تسجيل الدخول</button>

// توليد مفتاح التشفير من chatId
async function deriveKey(chatId) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey(
    'raw', enc.encode(chatId), {name:'PBKDF2'}, false, ['deriveKey']
  );
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt: enc.encode('chat-salt-v1'), iterations: 100000, hash:'SHA-256'},
    keyMaterial,
    {name:'AES-GCM', length:256},
    false, ['encrypt','decrypt']
  );
}

async function encryptText(text, chatId) {
  try {
    const key = await deriveKey(chatId);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const enc = new TextEncoder();
    const ciphertext = await crypto.subtle.encrypt(
      {name:'AES-GCM', iv}, key, enc.encode(text)
    );
    const combined = new Uint8Array(iv.length + ciphertext.byteLength);
    combined.set(iv);
    combined.set(new Uint8Array(ciphertext), iv.length);
    return btoa(String.fromCharCode(...combined));
  } catch(e) {
    console.error('Encrypt error:', e);
    return text; // fallback
  }
}

async function decryptText(encrypted, chatId) {
  try {
    const key = await deriveKey(chatId);
    const combined = Uint8Array.from(atob(encrypted), c => c.charCodeAt(0));
    const iv = combined.slice(0, 12);
    const ciphertext = combined.slice(12);
    const decrypted = await crypto.subtle.decrypt(
      {name:'AES-GCM', iv}, key, ciphertext
    );
    return new TextDecoder().decode(decrypted);
  } catch(e) {
    console.error('Decrypt error:', e);
    return '[رسالة مشفرة - تعذّر فكها]';
  }
}

// تشفير بيانات ثنائية (للرسائل الصوتية)
async function encryptBuffer(buffer, chatId) {
  const key = await deriveKey(chatId);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ciphertext = await crypto.subtle.encrypt(
    {name:'AES-GCM', iv}, key, buffer
  );
  const combined = new Uint8Array(iv.length + ciphertext.byteLength);
  combined.set(iv);
  combined.set(new Uint8Array(ciphertext), iv.length);
  // تحويل إلى base64 بطريقة آمنة للبيانات الكبيرة
  let binary = '';
  const chunk = 8192;
  for (let i = 0; i < combined.length; i += chunk) {
    binary += String.fromCharCode.apply(null, combined.subarray(i, i + chunk));
  }
  return btoa(binary);
}

async function decryptBuffer(b64, chatId) {
  const key = await deriveKey(chatId);
  const binary = atob(b64);
  const combined = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) combined[i] = binary.charCodeAt(i);
  const iv = combined.slice(0, 12);
  const ciphertext = combined.slice(12);
  return crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ciphertext);
}

async function renderChats(chats){
  const lists = document.querySelectorAll('#chatsList');
  if(!lists.length) return;
  const ids = Object.keys(chats);
  if(!ids.length){
    lists.forEach(l=>l.innerHTML=`<div class="empty-state"><div class="big-icon"><i class="fas fa-comments"></i></div><div>لا توجد محادثات</div><div style="font-size:12px;margin-top:8px;">اضغط ✏️ لبدء محادثة</div></div>`);
    return;
  }
  const results = await Promise.all(ids.map(async otherId=>{
    const chatId = getChatId(currentUser.uid,otherId);
    const msgSnap = await get(query(ref(db,'chats/'+chatId+'/messages'),limitToLast(1)));
    let lastMsg = msgSnap.exists() ? Object.values(msgSnap.val())[0] : null;
    const otherUser = allUsers[otherId]||{name:'مستخدم',uid:otherId};
    const unreadSnap = await get(ref(db,'chats/'+chatId+'/unread/'+currentUser.uid));
    const unread = unreadSnap.exists()?unreadSnap.val():0;
    return {otherUser,lastMsg,unread,chatId};
  }));
  results.sort((a,b)=>(b.lastMsg?.timestamp||0)-(a.lastMsg?.timestamp||0));

  const html = await Promise.all(results.map(async ({otherUser,lastMsg,unread,chatId})=>{
    const name = otherUser.name||'مستخدم';
    const initial = name.charAt(0).toUpperCase();
    const avatarHtml = otherUser.photoURL ? `<img src="${otherUser.photoURL}">` : initial;
    let lastText = 'لا توجد رسائل';
    if(lastMsg){
      if(lastMsg.type === 'audio') lastText = '🎤 رسالة صوتية';
      else if(lastMsg.text) {
        try { lastText = await decryptText(lastMsg.text, chatId); }
        catch { lastText = '[رسالة]'; }
      }
    }
    const time = lastMsg?formatTimeShort(new Date(lastMsg.timestamp)):'';
    const badge = unread>0?`<span class="badge">${unread}</span>`:'';
    return `<div class="chat-item" data-uid="${otherUser.uid}" data-name="${escapeHtml(name)}" data-photo="${otherUser.photoURL||''}">
      <div class="avatar">${avatarHtml}</div>
      <div class="details"><div class="name">${escapeHtml(name)}</div><div class="last-msg">${escapeHtml(lastText).substring(0,50)}</div></div>
      <div class="meta"><div class="time">${time}</div>${badge}</div>
    </div>`;
  }));
  lists.forEach(l=>l.innerHTML=html.join(''));
  document.querySelectorAll('.chat-item').forEach(item=>{
    item.onclick = ()=>openChat(item.dataset.uid,item.dataset.name,item.dataset.photo);
  });
}

function getChatId(a,b){return [a,b].sort().join('_')}

function openChat(uid,name,photo){
  currentChatUser = {uid,name,photoURL:photo};
  $('chatName').textContent = name;
  const initial = name.charAt(0).toUpperCase();
  $('chatAvatar').innerHTML = photo ? `<img src="${photo}">` : initial;
  $('chatStatus').textContent = 'غير متصل';
  $('chatView').classList.add('active');
  onValue(ref(db,'onlineUsers/'+uid), s=>{
    if(s.exists()){ $('chatStatus').textContent='متصل الآن'; $('chatStatus').classList.add('online'); }
    else { $('chatStatus').textContent='غير متصل'; $('chatStatus').classList.remove('online'); }
  });
  loadChatMessages(uid);
  set(ref(db,'chats/'+getChatId(currentUser.uid,uid)+'/unread/'+currentUser.uid),0);
  set(ref(db,'userChats/'+currentUser.uid+'/'+uid),true);
  set(ref(db,'userChats/'+uid+'/'+currentUser.uid),true);
  setTimeout(()=>$('messageInput').focus(),300);
}

async function loadChatMessages(otherUid){
  if(unsubMessages) unsubMessages();
  const chatId = getChatId(currentUser.uid,otherUid);
  const area = $('messagesArea');
  area.innerHTML = '';
  let lastDate = '';
  
  // جلب كل الرسائل السابقة ثم الاستماع للجديدة
  unsubMessages = onChildAdded(ref(db,'chats/'+chatId+'/messages'), async snap=>{
    const data = snap.val(); if(!data) return;
    await renderMessage(snap.key, data, area, chatId);
    area.scrollTop = area.scrollHeight;
  });
}

async function renderMessage(key, data, area, chatId){
  const isMine = data.senderId===currentUser.uid;
  const msgDate = new Date(data.timestamp);
  const dateStr = formatDate(msgDate);

  // فاصل التاريخ
  const lastChild = area.lastElementChild;
  if(!lastChild || lastChild.className !== 'date-separator' || lastChild.textContent !== dateStr){
    if(!lastChild || lastChild.textContent !== dateStr){
      const sep = document.createElement('div');
      sep.className='date-separator';
      sep.textContent=dateStr;
      area.appendChild(sep);
    }
  }

  const isRead = data.readBy && Object.keys(data.readBy).some(k=>k!==currentUser.uid);
  const check = isMine ? `<span class="check ${isRead?'read':''}"><i class="fas fa-check${isRead?'-double':''}"></i></span>` : '';
  const encBadge = data.encrypted ? '<span class="encrypted-badge"><i class="fas fa-lock"></i></span>' : '';

  const row = document.createElement('div');
  row.className = 'message-row '+(isMine?'mine':'other');
  const msg = document.createElement('div');
  msg.className = 'message '+(isMine?'mine':'other');

  if(data.type === 'audio' && data.audio){
    // رسالة صوتية
    msg.innerHTML = `
      <div class="audio-message">
        <button class="audio-play-btn" data-audio="${data.audio}" data-key="${key}">
          <i class="fas fa-play"></i>
        </button>
        <div class="audio-progress"><div class="fill"></div></div>
        <div class="duration">${formatDuration(data.duration||0)}</div>
      </div>
      <div class="msg-meta"><span>${formatTime(msgDate)}</span>${encBadge}${check}</div>
    `;
  } else {
    // رسالة نصية
    let text = data.text || '';
    if(data.encrypted && text) {
      text = await decryptText(text, chatId);
    }
    msg.innerHTML = `<span>${escapeHtml(text)}</span>
      <div class="msg-meta"><span>${formatTime(msgDate)}</span>${encBadge}${check}</div>`;
  }

  row.appendChild(msg);
  area.appendChild(row);

  // تحديث readBy للرسائل الواردة
  if(!isMine && currentChatUser){
    update(ref(db,'chats/'+chatId+'/messages/'+key+'/readBy'),{[currentUser.uid]:true});
  }
}

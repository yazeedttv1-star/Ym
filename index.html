<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دردشة 2010921</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* ===== RESET & BASE ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: #0a0a0a; color: #fff; height: 100vh; display: flex; justify-content: center; align-items: center; }
        button { cursor: pointer; border: none; outline: none; background: none; color: #fff; }

        /* ===== SCREENS ===== */
        .screen { display: none; width: 100%; height: 100vh; max-width: 500px; margin: 0 auto; position: relative; background: #1a1a2e; overflow: hidden; }
        .screen.active { display: flex; flex-direction: column; }

        /* ===== LOGIN SCREEN ===== */
        #loginScreen { justify-content: center; align-items: center; background: linear-gradient(145deg, #0f0f1f, #1a1a2e); }
        .login-container { text-align: center; padding: 30px; width: 100%; max-width: 400px; }
        .logo i { font-size: 60px; color: #25D366; }
        .logo h1 { font-size: 28px; margin: 10px 0; background: linear-gradient(45deg, #25D366, #128C7E); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo .version { font-size: 12px; color: #888; background: #222; padding: 2px 12px; border-radius: 12px; -webkit-text-fill-color: #888; }
        .code-display { background: #252540; padding: 12px; border-radius: 10px; margin: 20px 0; border: 1px solid #25D36633; }
        .code-display strong { color: #25D366; font-size: 18px; letter-spacing: 2px; }
        .login-box input { width: 100%; padding: 14px; margin: 8px 0; border-radius: 10px; border: 1px solid #333; background: #252540; color: #fff; font-size: 15px; }
        .login-box input:focus { border-color: #25D366; outline: none; }
        .btn-primary, .btn-secondary { width: 100%; padding: 14px; border-radius: 10px; font-size: 16px; margin-top: 8px; transition: all 0.3s; }
        .btn-primary { background: linear-gradient(45deg, #25D366, #128C7E); color: #fff; }
        .btn-primary:hover { transform: scale(1.02); opacity: 0.9; }
        .btn-secondary { background: #252540; color: #fff; border: 1px solid #444; }
        .btn-secondary:hover { background: #333355; }
        .footer-text { margin-top: 20px; font-size: 11px; color: #666; }

        /* ===== CHAT SCREEN ===== */
        #chatScreen { background: #0d0d1a; }
        .chat-container { display: flex; flex-direction: column; height: 100vh; max-width: 500px; margin: 0 auto; }
        
        /* Header */
        .chat-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #1a1a2e; border-bottom: 1px solid #2a2a4a; flex-shrink: 0; }
        .header-info { display: flex; align-items: center; gap: 10px; }
        .header-info i { color: #25D366; font-size: 22px; }
        .chat-name { font-weight: bold; font-size: 16px; }
        .online-status { font-size: 11px; color: #25D366; display: flex; align-items: center; gap: 4px; }
        .online-status i { font-size: 8px; color: #25D366; }
        .icon-btn { padding: 8px; border-radius: 50%; transition: background 0.3s; font-size: 18px; }
        .icon-btn:hover { background: #2a2a4a; }

        /* Messages */
        .messages-area { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px; scroll-behavior: smooth; }
        .messages-area::-webkit-scrollbar { width: 4px; }
        .messages-area::-webkit-scrollbar-track { background: transparent; }
        .messages-area::-webkit-scrollbar-thumb { background: #25D36644; border-radius: 10px; }

        .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; word-wrap: break-word; animation: fadeIn 0.3s; position: relative; }
        .msg.sent { align-self: flex-end; background: linear-gradient(135deg, #25D366, #128C7E); border-bottom-right-radius: 4px; }
        .msg.received { align-self: flex-start; background: #252540; border-bottom-left-radius: 4px; }
        .msg .sender { font-size: 11px; color: #88ffaa; margin-bottom: 2px; display: block; }
        .msg .time { font-size: 10px; opacity: 0.6; margin-top: 4px; display: block; text-align: left; }
        .msg img, .msg video { max-width: 100%; max-height: 300px; border-radius: 8px; margin: 4px 0; cursor: pointer; }
        .msg .audio-player { width: 100%; max-width: 200px; height: 40px; margin: 4px 0; }
        .msg .file-attach { display: flex; align-items: center; gap: 8px; background: #ffffff15; padding: 8px 12px; border-radius: 8px; text-decoration: none; color: #88ddff; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Input Area */
        .input-area { display: flex; align-items: center; gap: 6px; padding: 10px 12px; background: #1a1a2e; border-top: 1px solid #2a2a4a; flex-shrink: 0; }
        .input-tools { display: flex; gap: 4px; }
        .tool-btn { width: 38px; height: 38px; border-radius: 50%; font-size: 18px; transition: background 0.3s; color: #888; }
        .tool-btn:hover { background: #2a2a4a; color: #fff; }
        #messageInput { flex: 1; padding: 10px 14px; border-radius: 25px; border: 1px solid #333; background: #252540; color: #fff; font-size: 14px; }
        #messageInput:focus { border-color: #25D366; outline: none; }
        .send-btn { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(45deg, #25D366, #128C7E); font-size: 18px; transition: transform 0.2s; }
        .send-btn:hover { transform: scale(1.05); }
        .send-btn:active { transform: scale(0.95); }

        /* Attach Menu */
        .attach-menu { display: none; position: absolute; bottom: 75px; left: 10px; background: #1a1a2e; border-radius: 14px; padding: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.8); border: 1px solid #2a2a4a; z-index: 10; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .attach-menu.show { display: grid; }
        .attach-option { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 14px; border-radius: 10px; transition: background 0.3s; font-size: 12px; color: #ccc; }
        .attach-option:hover { background: #2a2a4a; }
        .attach-option i { font-size: 24px; color: #25D366; }

        /* Emoji Picker */
        .emoji-picker { display: none; position: absolute; bottom: 75px; right: 10px; background: #1a1a2e; border-radius: 14px; padding: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.8); border: 1px solid #2a2a4a; z-index: 10; }
        .emoji-picker.show { display: block; }
        .emoji-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
        .emoji-grid span { font-size: 28px; cursor: pointer; transition: transform 0.2s; padding: 4px; text-align: center; }
        .emoji-grid span:hover { transform: scale(1.3); background: #2a2a4a; border-radius: 8px; }

        /* Recorder Panel */
        .recorder-panel { display: none; align-items: center; gap: 12px; padding: 8px 14px; background: #1a1a2e; border-top: 1px solid #2a2a4a; flex-shrink: 0; }
        .recorder-panel.show { display: flex; }
        .record-btn { background: #ff4444; padding: 8px 18px; border-radius: 25px; font-size: 14px; }
        .record-btn i { margin-left: 6px; }
        .stop-btn { background: #ff8800; padding: 8px 18px; border-radius: 25px; font-size: 14px; }
        .cancel-btn { color: #888; font-size: 20px; padding: 4px 10px; }
        .recorder-timer { font-size: 18px; font-weight: bold; color: #ff4444; min-width: 50px; }

        /* Viewer */
        #viewerScreen { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.95); z-index: 999; justify-content: center; align-items: center; }
        #viewerScreen.active { display: flex; }
        .viewer-close { position: absolute; top: 20px; right: 20px; font-size: 30px; color: #fff; padding: 10px; z-index: 10; }
        .viewer-content { max-width: 95%; max-height: 95%; }
        .viewer-content img, .viewer-content video { max-width: 100%; max-height: 90vh; border-radius: 8px; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 500px) { .screen { max-width: 100%; } .msg { max-width: 92%; } }
        @media (max-width: 400px) { .emoji-grid { grid-template-columns: repeat(6, 1fr); } .attach-menu { grid-template-columns: repeat(2, 1fr); } }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #25D36644; border-radius: 10px; }
    </style>
</head>
<body>

<!-- ==================== LOGIN SCREEN ==================== -->
<div id="loginScreen" class="screen active">
    <div class="login-container">
        <div class="logo">
            <i class="fas fa-comment-dots"></i>
            <h1>دردشة 2010921</h1>
            <span class="version">v2.0</span>
        </div>
        <div class="login-box">

            <input type="password" id="passwordInput" placeholder="🔒 كلمة المرور (اختياري)">

        <!-- Header -->

                <span>🔥</span><span>💯</span><span>⭐</span><span>⚡</span><span>🌈</span><span>☀️</span>
                <span>🌙</span><span>🌊</span><span>🎉</span><span>🎊</span><span>🎁</span><span>🎈</span>
                <span>🍕</span><span>🍔</span><span>🌮</span><span>🍣</span><span>🏠</span><span>✈️</span>
            </div>

        <!-- Recorder -->
        <div class="recorder-panel" id="recorderPanel">
            <button class="record-btn" id="startRecordBtn"><i class="fas fa-circle"></i> تسجيل</button>
            <button class="stop-btn" id="stopRecordBtn" style="display:none;"><i class="fas fa-stop"></i> إيقاف</button>

</div>

<!-- ==================== VIEWER SCREEN ==================== -->
<div id="viewerScreen" class="screen">
    <button class="viewer-close" id="closeViewer"><i class="fas fa-times"></i></button>
    <div class="viewer-content" id="viewerContent"></div>
</div>

<!-- ==================== HIDDEN FILE INPUTS ==================== -->
<input type="file" id="fileInput" accept="image/*,video/*,audio/*,.*" style="display:none" multiple>

<script>
// ================================================================
//  APPLICATION CODE
// ================================================================

// ---------- STATE ----------
const state = {
    username: 'زائر',
    messages: [],
    isRecording: false,
    mediaRecorder: null,
    audioChunks: [],
    recorderTimer: null,
    seconds: 0,
    currentUser: null
};

// ---------- DOM REFS ----------
const $ = id => document.getElementById(id);
const loginScreen = $('loginScreen');
const chatScreen = $('chatScreen');
const viewerScreen = $('viewerScreen');
const usernameInput = $('usernameInput');
const passwordInput = $('passwordInput');
const loginBtn = $('loginBtn');
const guestBtn = $('guestBtn');
const logoutBtn = $('logoutBtn');
const messagesArea = $('messagesArea');
const messageInput = $('messageInput');
const sendBtn = $('sendBtn');
const emojiBtn = $('emojiBtn');
const attachBtn = $('attachBtn');
const micBtn = $('micBtn');
const attachMenu = $('attachMenu');
const emojiPicker = $('emojiPicker');
const recorderPanel = $('recorderPanel');
const startRecordBtn = $('startRecordBtn');
const stopRecordBtn = $('stopRecordBtn');
const cancelRecordBtn = $('cancelRecordBtn');
const recorderTimer = $('recorderTimer');
const fileInput = $('fileInput');
const viewerContent = $('viewerContent');
const closeViewer = $('closeViewer');

// ---------- UTILITY ----------
function getTime() {
    const d = new Date();
    return d.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
}

function getFullTime() {
    const d = new Date();
    return d.toLocaleString('ar-EG', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

function formatTime(sec) {
    const m = String(Math.floor(sec / 60)).padStart(2, '0');
    const s = String(sec % 60).padStart(2, '0');
    return `${m}:${s}`;
}

function generateId() {
    return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
}

// ---------- RENDER MESSAGES ----------
function renderMessages() {
    messagesArea.innerHTML = state.messages.map(msg => {
        let content = '';
        if (msg.type === 'text') {
            content = `<span>${escapeHtml(msg.text)}</span>`;
        } else if (msg.type === 'image') {
            content = `<img src="${msg.data}" alt="صورة" onclick="viewMedia('${msg.data}', 'image')">`;
        } else if (msg.type === 'video') {
            content = `<video controls onclick="viewMedia('${msg.data}', 'video')"><source src="${msg.data}"></video>`;
        } else if (msg.type === 'audio') {
            content = `<audio controls class="audio-player"><source src="${msg.data}"></audio>`;
        } else if (msg.type === 'file') {
            content = `<a href="${msg.data}" target="_blank" class="file-attach"><i class="fas fa-file"></i> ${msg.filename || 'ملف'}</a>`;
        }
        const sender = msg.sender === state.currentUser ? 'sent' : 'received';
        const nameDisplay = msg.sender !== state.currentUser ? `<span class="sender">${escapeHtml(msg.sender)}</span>` : '';
        return `<div class="msg ${sender}">${nameDisplay}${content}<span class="time">${msg.time}</span></div>`;
    }).join('');
    messagesArea.scrollTop = messagesArea.scrollHeight;
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// ---------- ADD MESSAGE ----------
function addMessage(type, data, sender = null, extra = {}) {
    const msg = {
        id: generateId(),
        type: type,
        data: data,
        sender: sender || state.currentUser || 'زائر',
        time: getTime(),
        fullTime: getFullTime(),
        ...extra
    };
    state.messages.push(msg);
    renderMessages();
    // Save to localStorage
    try {
        localStorage.setItem('chat_messages', JSON.stringify(state.messages));
    } catch(e) {}
    return msg;
}

// ---------- VIEW MEDIA ----------
window.viewMedia = function(src, type) {
    viewerContent.innerHTML = type === 'video' 
        ? `<video controls autoplay><source src="${src}"></video>`
        : `<img src="${src}" alt="مرفق">`;
    viewerScreen.classList.add('active');
};

// ---------- SEND TEXT ----------
function sendText() {
    const text = messageInput.value.trim();
    if (!text) return;
    addMessage('text', text);
    messageInput.value = '';
    // Simulate reply
    simulateReply(text);
}

// ---------- SIMULATE REPLY ----------
function simulateReply(userText) {
    const replies = [
        'مرحباً! كيف حالك؟ 😊', 'شكراً لك!', 'جميل جداً!', 'أنا بخير، وأنت؟',
        'نعم، فهمت ✅', 'بالطبع!', 'أنا معك 👍', 'حسناً، سأفعل ذلك',
        'شكراً على مشاركتك ❤️', 'رائع! استمر 🎉', 'هذا مفيد جداً', 'أوافقك الرأي 💯',
        'هل يمكنك التوضيح أكثر؟', 'سأفكر في ذلك', 'جيد، شكراً لك 🌟'
    ];
    const random = replies[Math.floor(Math.random() * replies.length)];
    setTimeout(() => {
        addMessage('text', random, 'المساعد');
    }, 800 + Math.random() * 1500);
}

// ---------- FILE UPLOAD ----------
function handleFileUpload(files) {
    Array.from(files).forEach(file => {
        const type = file.type.split('/')[0];
        const reader = new FileReader();
        reader.onload = (e) => {
            let msgType = 'file';
            let extra = { filename: file.name };
            if (type === 'image') msgType = 'image';
            else if (type === 'video') msgType = 'video';
            else if (type === 'audio') msgType = 'audio';
            addMessage(msgType, e.target.result, null, extra);
        };
        reader.readAsDataURL(file);
    });
    attachMenu.classList.remove('show');
}

// ---------- RECORDER ----------
let recorderTimerInterval = null;

function startRecording() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        alert('التسجيل غير مدعوم في هذا المتصفح');
        return;
    }
    navigator.mediaDevices.getUserMedia({ audio: true })
        .then(stream => {
            state.mediaRecorder = new MediaRecorder(stream);
            state.audioChunks = [];
            state.mediaRecorder.ondataavailable = e => state.audioChunks.push(e.data);
            state.mediaRecorder.onstop = () => {
                const blob = new Blob(state.audioChunks, { type: 'audio/webm' });
                const reader = new FileReader();
                reader.onload = (e) => {
                    addMessage('audio', e.target.result);
                };
                reader.readAsDataURL(blob);
                stream.getTracks().forEach(t => t.stop());
                resetRecorder();
            };
            state.mediaRecorder.start();
            state.isRecording = true;
            startRecordBtn.style.display = 'none';
            stopRecordBtn.style.display = 'inline-flex';
            startRecorderTimer();
        })
        .catch(() => alert('الرجاء السماح بالوصول إلى الميكروفون'));
}

function stopRecording() {
    if (state.mediaRecorder && state.isRecording) {
        state.mediaRecorder.stop();
        state.isRecording = false;
    }
}

function cancelRecording() {
    if (state.mediaRecorder && state.isRecording) {
        state.mediaRecorder.stop();
        state.isRecording = false;
        state.audioChunks = [];
    }
    resetRecorder();
}

function resetRecorder() {
    state.isRecording = false;
    startRecordBtn.style.display = 'inline-flex';
    stopRecordBtn.style.display = 'none';
    state.seconds = 0;
    recorderTimer.textContent = '00:00';
    if (recorderTimerInterval) {
        clearInterval(recorderTimerInterval);
        recorderTimerInterval = null;
    }
    recorderPanel.classList.remove('show');
}

function startRecorderTimer() {
    state.seconds = 0;
    if (recorderTimerInterval) clearInterval(recorderTimerInterval);
    recorderTimerInterval = setInterval(() => {
        state.seconds++;
        recorderTimer.textContent = formatTime(state.seconds);
        if (state.seconds >= 300) stopRecording(); // 5 min max
    }, 1000);
}

// ---------- LOGIN / LOGOUT ----------
function login(username, isGuest = false) {
    username = username.trim() || 'زائر';
    state.currentUser = username;
    state.username = username;
    // Load messages
    try {
        const saved = localStorage.getItem('chat_messages');
        if (saved) state.messages = JSON.parse(saved);
    } catch(e) {}
    renderMessages();
    loginScreen.classList.remove('active');
    chatScreen.classList.add('active');
    // Welcome message
    if (state.messages.length === 0) {
        addMessage('text', `👋 مرحباً ${username}! أهلاً بك في دردشة 2010921`, 'النظام');
        setTimeout(() => {
            addMessage('text', '💬 يمكنك إرسال رسائل نصية، صور، فيديوهات، ورسائل صوتية', 'النظام');
        }, 500);
    }
}

function logout() {
    state.currentUser = null;
    chatScreen.classList.remove('active');
    loginScreen.classList.add('active');
    usernameInput.value = '';
    passwordInput.value = '';
    attachMenu.classList.remove('show');
    emojiPicker.classList.remove('show');
    recorderPanel.classList.remove('show');
    resetRecorder();
}

// ---------- EVENT LISTENERS ----------
// Login
loginBtn.addEventListener('click', () => {
    const username = usernameInput.value.trim() || 'زائر';
    const password = passwordInput.value;
    if (password && password !== '2010921') {
        alert('❌ كلمة المرور غير صحيحة');
        return;
    }
    login(username);
});

guestBtn.addEventListener('click', () => {
    login('زائر_' + Math.floor(Math.random() * 1000), true);
});

usernameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') loginBtn.click(); });
passwordInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') loginBtn.click(); });

logoutBtn.addEventListener('click', logout);

// Send
sendBtn.addEventListener('click', sendText);
messageInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendText();
    }
});

// Emoji
emojiBtn.addEventListener('click', () => {
    emojiPicker.classList.toggle('show');
    attachMenu.classList.remove('show');
});
document.querySelectorAll('.emoji-grid span').forEach(el => {
    el.addEventListener('click', () => {
        messageInput.value += el.textContent;
        messageInput.focus();
        emojiPicker.classList.remove('show');
    });
});

// Attach
attachBtn.addEventListener('click', () => {
    attachMenu.classList.toggle('show');
    emojiPicker.classList.remove('show');
});
document.querySelectorAll('.attach-option').forEach(btn => {
    btn.addEventListener('click', () => {
        const type = btn.dataset.type;
        if (type === 'audio') {
            attachMenu.classList.remove('show');
            recorderPanel.classList.add('show');
            return;
        }
        fileInput.accept = type === 'image' ? 'image/*' : type === 'video' ? 'video/*' : type === 'file' ? '.*' : '*/*';
        fileInput.click();
    });
});
fileInput.addEventListener('change', (e) => {
    if (e.target.files.length) {
        handleFileUpload(e.target.files);
        fileInput.value = '';
    }
});

// Recorder
micBtn.addEventListener('click', () => {
    recorderPanel.classList.toggle('show');
    if (!recorderPanel.classList.contains('show')) resetRecorder();
});
startRecordBtn.addEventListener('click', startRecording);
stopRecordBtn.addEventListener('click', stopRecording);
cancelRecordBtn.addEventListener('click', cancelRecording);

// Viewer
closeViewer.addEventListener('click', () => {
    viewerScreen.classList.remove('active');
    viewerContent.innerHTML = '';
});

// Close menus on outside click
document.addEventListener('click', (e) => {
    if (!e.target.closest('#emojiPicker') && !e.target.closest('#emojiBtn')) {
        emojiPicker.classList.remove('show');
    }
    if (!e.target.closest('#attachMenu') && !e.target.closest('#attachBtn')) {
        attachMenu.classList.remove('show');
    }
});

// Keyboard shortcut
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
        emojiPicker.classList.remove('show');
        attachMenu.classList.remove('show');
        viewerScreen.classList.remove('active');
        recorderPanel.classList.remove('show');
        resetRecorder();
    }
});

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">
<meta name="theme-color" content="#e91e63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="متجر يزيد">
<meta name="description" content="متجر يزيد - تسوّق بأفضل الأسعار">
<title>متجر يزيد</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script>try{var t=JSON.parse(localStorage.getItem('yz_theme')||'null')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{--p:#e91e63;--p2:#f06292;--ac:#f59e0b;--bg:#fff5f8;--card:#fff;--tx:#2a1620;--mt:#8a6b78;--bd:#f6d9e3;--sh:0 6px 22px rgba(233,30,99,.10);--ok:#16a34a;--er:#dc2626;--r:18px;--hh:64px;--nh:68px}
[data-theme=dark]{--bg:#150c11;--card:#22141c;--tx:#fbeaf1;--mt:#b793a3;--bd:#3b2331;--sh:0 6px 22px rgba(0,0,0,.45)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:Cairo,Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;line-height:1.6;transition:background .3s,color .3s;overflow-x:hidden}
body.lock{overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:15px;color:inherit}
button{cursor:pointer;border:0;background:none}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none;cursor:pointer}
.hide{display:none!important}
:focus-visible{outline:2px solid var(--p);outline-offset:2px}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes badgePulse{0%{transform:scale(1)}40%{transform:scale(1.55)}100%{transform:scale(1)}}
@keyframes sh{to{background-position:-200% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes heartBeat{0%,100%{transform:scale(1)}15%{transform:scale(1.4)}30%{transform:scale(1)}45%{transform:scale(1.3)}}
@keyframes emptyFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes salePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes bellShake{0%,100%{transform:rotate(0)}20%,60%{transform:rotate(-12deg)}40%,80%{transform:rotate(12deg)}}
@keyframes removeCart{to{opacity:0;transform:translateX(40px);height:0;padding:0;margin:0;overflow:hidden}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes shimmer{0%{background-position:-1000px 0}100%{background-position:1000px 0}}

.hd{position:sticky;top:0;z-index:50;padding-top:env(safe-area-inset-top);background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--bd);transition:background .3s}
.hdi{max-width:1280px;margin:auto;display:flex;align-items:center;gap:10px;padding:10px 12px;min-height:var(--hh)}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--p);min-width:0;transition:.2s}
.brand:active{transform:scale(.97)}
.brand img{width:36px;height:36px;border-radius:10px;object-fit:cover;flex:none;box-shadow:0 2px 8px rgba(233,30,99,.2)}
.brand span{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:96px}
.hs{display:none;flex:1;max-width:480px;margin-inline:auto;position:relative}
.hs i,.sm i{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:var(--mt);pointer-events:none;z-index:1}
.hs input,.sm input{width:100%;padding:10px 14px;padding-inline-start:40px;border-radius:99px;border:1.5px solid var(--bd);background:var(--card);outline:0;transition:.2s}
.hs input:focus,.sm input:focus{border-color:var(--p);box-shadow:0 0 0 3px color-mix(in srgb,var(--p) 15%,transparent)}
.hact{display:flex;gap:5px;align-items:center;margin-inline-start:auto}
#uArea{display:flex;gap:5px;align-items:center}
.ib{position:relative;width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;background:var(--card);border:1px solid var(--bd);color:var(--tx);transition:.2s;flex:none}
.ib:hover{color:var(--p);border-color:var(--p);transform:translateY(-1px)}
.ib:active{transform:scale(.93)}
.ib.av{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-weight:800;border:0}
.ib.bell-shake i{animation:bellShake .5s}
.bg{position:absolute;top:-4px;inset-inline-end:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--p);color:#fff;font:700 11px/18px Cairo,sans-serif;text-align:center;font-style:normal;box-shadow:0 2px 6px rgba(233,30,99,.5)}
.bg.pulse{animation:badgePulse .6s}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:14px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-weight:700;box-shadow:0 6px 16px color-mix(in srgb,var(--p) 32%,transparent);transition:.2s;text-align:center;border:0;cursor:pointer}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px color-mix(in srgb,var(--p) 45%,transparent)}
.btn:active{transform:scale(.97)}
.btn.sm{padding:7px 14px;font-size:13px;border-radius:11px}
.btn.gh{background:var(--card);color:var(--p);border:1px solid var(--bd);box-shadow:none}
.btn.gh:hover{border-color:var(--p)}
.btn.dg{background:var(--er);box-shadow:0 6px 16px rgba(220,38,38,.3)}
.btn.ok{background:var(--ok);box-shadow:0 6px 16px rgba(22,163,74,.3)}
.btn[disabled]{opacity:.5;pointer-events:none;filter:grayscale(.6)}

#main{max-width:1280px;margin:auto;padding:14px 12px calc(var(--nh) + 34px + env(safe-area-inset-bottom))}
.ph2{font-size:20px;font-weight:800;margin:6px 0 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ph2 .count-badge{background:var(--p);color:#fff;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:700}

.hero{display:grid;gap:16px;align-items:center;background:linear-gradient(135deg,var(--p),var(--p2) 62%,var(--ac));border-radius:26px;padding:24px;color:#fff;overflow:hidden;animation:fadeUp .6s both;margin-bottom:16px;position:relative}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 20% 20%,rgba(255,255,255,.15),transparent 60%);pointer-events:none}
.hero h1{font-size:clamp(22px,4vw,38px);font-weight:800;line-height:1.4;margin-bottom:8px;position:relative}
.hero p{opacity:.92;margin-bottom:16px;position:relative}
.hero img,.hph{width:100%;aspect-ratio:16/10;max-height:280px;object-fit:cover;border-radius:20px;position:relative}
.hph{display:grid;place-items:center;font-size:64px;background:rgba(255,255,255,.18)}
.hero .btn{background:#fff;color:var(--p);box-shadow:0 6px 16px rgba(0,0,0,.18);position:relative}

.sm{position:relative;margin-bottom:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:8px 16px;border-radius:99px;background:var(--card);border:1px solid var(--bd);white-space:nowrap;font-weight:600;transition:.2s;font-size:14px}
.chip:hover{border-color:var(--p);color:var(--p)}
.chip.on{background:var(--p);color:#fff;border-color:var(--p);box-shadow:0 4px 12px rgba(233,30,99,.3)}

.sort-w{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.sort-w label{font-size:13px;color:var(--mt);font-weight:600;flex:none}
.sort-w select{flex:1;min-width:140px;padding:9px 12px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card);font-size:13px;font-weight:600;cursor:pointer;outline:0;transition:.2s}
.sort-w select:focus{border-color:var(--p)}

.prd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px;background:var(--card);border:1px solid var(--bd);border-radius:14px;margin-bottom:12px}
.prd label{font-size:12px;font-weight:700;color:var(--mt)}
.prd input[type=number]{width:90px;padding:8px 10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);font-size:13px;text-align:center;outline:0}
.prd input[type=number]:focus{border-color:var(--p)}
.prd button{padding:8px 14px;border-radius:10px;background:var(--p);color:#fff;font-size:12px;font-weight:700}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:var(--card);border-radius:var(--r);overflow:hidden;border:1px solid var(--bd);box-shadow:var(--sh);cursor:pointer;display:flex;flex-direction:column;animation:popIn .4s both;transition:transform .2s,box-shadow .2s,border-color .2s}
.card:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--p) 40%,var(--bd));box-shadow:0 12px 32px rgba(233,30,99,.15)}
.card:active{transform:scale(.98)}
.im{position:relative;aspect-ratio:1;background:linear-gradient(135deg,color-mix(in srgb,var(--p) 14%,var(--card)),var(--card));display:grid;place-items:center;font-size:40px;color:var(--p2);overflow:hidden}
.im>img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.card:hover .im>img{transform:scale(1.06)}
.bds{position:absolute;top:8px;inset-inline-start:8px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;font-size:14px;z-index:2}
.bd{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;color:#fff;background:var(--ok);box-shadow:0 2px 8px rgba(0,0,0,.15)}
.bd.out{background:var(--er)}
.bd.ds{background:linear-gradient(135deg,#ef4444,#f59e0b);animation:salePulse 2s infinite}
.bd.new{background:var(--er);position:relative;overflow:hidden}
.bd.new::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);animation:shimmer 2s infinite}
.hrt{position:absolute;top:8px;inset-inline-end:8px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.95);color:#aaa;display:grid;place-items:center;box-shadow:0 3px 10px rgba(0,0,0,.15);transition:.2s;font-size:15px;z-index:2;backdrop-filter:blur(8px)}
.hrt:hover{transform:scale(1.1);background:#fff}
.hrt.on{color:var(--p)}
.hrt.on i{animation:heartBeat .5s}
.hrt:active{transform:scale(1.2)}
.inf{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.inf h3{font-size:14px;font-weight:700;line-height:1.4;min-height:39px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pr b{color:var(--p);font-size:16px;font-weight:800}
.pr s{color:var(--mt);font-size:12px}
.inf .btn{margin-top:auto;width:100%}

.sk{background:linear-gradient(90deg,var(--card),var(--bd),var(--card));background-size:200% 100%;animation:sh 1.2s infinite;border-radius:var(--r);aspect-ratio:3/4}
.skl{background:linear-gradient(90deg,var(--card) 25%,var(--bd) 50%,var(--card) 75%);background-size:200% 100%;animation:sh 1.5s infinite;border-radius:12px}
.skl-txt{height:14px;margin-bottom:8px;border-radius:8px}
.skl-txt.w60{width:60%}
.skl-txt.w80{width:80%}
.skl-txt.w40{width:40%}
.skl-list{display:flex;gap:10px;padding:12px;background:var(--card);border-radius:14px;border:1px solid var(--bd);margin-bottom:10px}
.skl-av{width:42px;height:42px;border-radius:50%;flex:none}
.skl-info{flex:1;display:flex;flex-direction:column;gap:6px}

.empty{grid-column:1/-1;text-align:center;padding:48px 16px;color:var(--mt);background:var(--card);border-radius:var(--r);border:1px dashed var(--bd);animation:fadeUp .4s both}
.empty i{font-size:48px;color:var(--p2);margin-bottom:10px;display:block;animation:emptyFloat 3s ease-in-out infinite}
.empty .btn{margin-top:14px}
.empty h3{color:var(--tx);margin-bottom:6px;font-size:16px}

.bnav{position:fixed;inset-inline:0;bottom:0;z-index:60;display:flex;justify-content:center;padding:0 10px calc(10px + env(safe-area-inset-bottom));pointer-events:none}
.bnav::before{content:'';position:absolute;inset-inline:0;top:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--p),transparent);opacity:.3}
.bni{pointer-events:auto;display:flex;width:100%;max-width:520px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding:6px;gap:2px}
.nb{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px;border-radius:18px;color:var(--mt);font-size:11px;font-weight:600;transition:.2s;position:relative}
.nb span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb i{font-size:18px;transition:transform .2s}
.nb:active{transform:scale(.95)}
.nb.on{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;box-shadow:0 6px 16px rgba(233,30,99,.35)}
.nb.on i{transform:translateY(-2px)}
.nb .nbd{position:absolute;top:2px;inset-inline-end:calc(50% - 22px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--er);color:#fff;font:700 10px/16px Cairo;text-align:center;box-shadow:0 2px 6px rgba(220,38,38,.5)}

#toasts{position:fixed;top:calc(12px + env(safe-area-inset-top));inset-inline:0;z-index:400;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:var(--tx);color:var(--bg);padding:10px 16px 10px 18px;border-radius:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:fadeUp .3s both;max-width:90vw;pointer-events:auto;display:flex;align-items:center;gap:8px}
.toast button{margin-inline-start:4px;opacity:.7;font-size:14px;padding:4px;color:inherit}
.toast button:hover{opacity:1}
.toast.ok{background:var(--ok);color:#fff}
.toast.err{background:var(--er);color:#fff}
.toast.warn{background:var(--ac);color:#fff}

.npop{pointer-events:auto;width:min(420px,92vw);background:var(--card);border:1.5px solid var(--p);border-radius:16px;padding:12px 14px;box-shadow:var(--sh);display:flex;gap:10px;cursor:pointer;animation:popIn .35s both;transition:.2s}
.npop:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(233,30,99,.2)}
.npop p{color:var(--mt);font-size:13px;margin:2px 0}
.npop b{font-size:14px}

.ov{position:fixed;inset:0;z-index:200;background:rgba(20,5,12,.55);backdrop-filter:blur(4px);opacity:0;transition:opacity .25s;display:flex;align-items:center;justify-content:center;padding:14px}
.ov.on{opacity:1}
.ovd{justify-content:flex-start;padding:0}
.dr{width:min(440px,100vw);height:100%;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);padding-top:env(safe-area-inset-top);box-shadow:-8px 0 40px rgba(0,0,0,.2)}
.on .dr{transform:none}
.md{width:min(560px,100%);max-height:92vh;overflow:auto;background:var(--card);border-radius:24px;padding:22px;transform:scale(.94);transition:.25s;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.md.w{width:min(820px,100%)}
.on .md{transform:none}
.md .mt{margin-bottom:14px;font-size:19px;font-weight:800}
.dh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--bd);font-weight:800;font-size:17px;flex-shrink:0}
.db{flex:1;overflow:auto;padding:14px 16px;-webkit-overflow-scrolling:touch}
.df{padding:14px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--bd);background:var(--card);flex-shrink:0}
.x{position:absolute;top:12px;inset-inline-start:12px;width:36px;height:36px;border-radius:50%;background:var(--bg);display:grid;place-items:center;z-index:2;transition:.2s}
.x:hover{background:var(--er);color:#fff;transform:rotate(90deg)}

.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}
.fld>label{font-size:13px;font-weight:700;color:var(--mt)}
.fld input,.fld select,.fld textarea,.in{width:100%;padding:11px 14px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card);outline:0;transition:.2s}
.fld input:focus,.fld select:focus,.fld textarea:focus,.in:focus{border-color:var(--p);box-shadow:0 0 0 3px color-mix(in srgb,var(--p) 15%,transparent)}
.fld textarea{min-height:90px;resize:vertical}
.fld input[type=color]{padding:3px;height:44px;cursor:pointer}
.fld input:disabled{opacity:.6}
.fld .hint{font-size:11px;color:var(--mt)}
.fld .err{font-size:11px;color:var(--er);font-weight:600}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.chk{display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer;padding:8px 0}
.chk input{width:18px;height:18px;accent-color:var(--p);cursor:pointer}

.ci{display:flex;gap:10px;padding:10px;background:var(--card);border-radius:14px;border:1px solid var(--bd);margin-bottom:10px;align-items:center;position:relative;transition:.2s}
.ci:hover{border-color:var(--p)}
.ci.removing{animation:removeCart .3s forwards}
.ci .ph{width:64px;height:64px;border-radius:12px;overflow:hidden;flex:none;background:var(--bg);display:grid;place-items:center;color:var(--p2)}
.ci .ph img{width:100%;height:100%;object-fit:cover}
.qty{display:inline-flex;align-items:center;gap:10px;background:var(--bg);border-radius:99px;padding:2px;margin-top:4px}
.qty button{width:28px;height:28px;border-radius:50%;background:var(--card);border:1px solid var(--bd);font-weight:800;transition:.2s}
.qty button:hover{background:var(--p);color:#fff;border-color:var(--p)}
.qty span{min-width:18px;text-align:center;font-weight:700;font-size:14px}
.cpn{display:flex;gap:8px;margin:12px 0}
.cpn .in{flex:1}
.ctag{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-radius:12px;background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok);font-weight:700;margin:12px 0;gap:8px}
.sum div{display:flex;justify-content:space-between;padding:3px 0;font-size:14px}
.sum .t{font-weight:800;font-size:18px;color:var(--p);border-top:1px dashed var(--bd);margin-top:6px;padding-top:8px}

.oc{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--sh);transition:.2s}
.oc:hover{border-color:color-mix(in srgb,var(--p) 40%,var(--bd))}
.oh,.of{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.oh b{font-family:ui-monospace,monospace;letter-spacing:.5px}
.ob{padding:8px 0;color:var(--mt);font-size:14px}
.ob p{margin:2px 0}
.ob i{color:var(--p2);width:16px}
.of{border-top:1px dashed var(--bd);padding-top:10px}
.of select{padding:8px 10px;border-radius:10px;border:1.5px solid var(--bd);background:var(--card);cursor:pointer;outline:0}
.of select:focus{border-color:var(--p)}
.tot{color:var(--p);font-size:17px}
.st{display:inline-flex;gap:6px;align-items:center;padding:3px 12px;border-radius:99px;font-size:12px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}

.timeline{display:flex;flex-direction:column;gap:0;margin:14px 0}
.tl-it{display:flex;gap:12px;position:relative;padding-bottom:22px}
.tl-it:last-child{padding-bottom:0}
.tl-it::before{content:'';position:absolute;inset-inline-start:13px;top:28px;bottom:0;width:2px;background:var(--bd)}
.tl-it:last-child::before{display:none}
.tl-it.done::before{background:var(--p)}
.tl-dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--bg);border:2px solid var(--bd);color:var(--mt);font-size:12px;position:relative;z-index:1;transition:.3s}
.tl-it.done .tl-dot{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-color:var(--p)}
.tl-it.current .tl-dot{background:var(--p);color:#fff;border-color:var(--p);animation:badgePulse 1.5s infinite}

const close=v=>{

};

},{once:false});
});
}

}catch{return false}
});
}

function compress(file,max=800,q=.72,type='image/jpeg'){
return new Promise((res,rej)=>{
const r=new FileReader();
r.onload=()=>{
const im=new Image();
im.onload=()=>{
const k=Math.min(1,max/Math.max(im.width,im.height));
const w=Math.round(im.width*k),h=Math.round(im.height*k);
const c=document.createElement('canvas');
c.width=w;
c.height=h;
const x=c.getContext('2d');
if(type==='image/jpeg'){
x.fillStyle='#fff';
x.fillRect(0,0,w,h);
}
x.drawImage(im,0,0,w,h);
res(c.toDataURL(type,q));
};
im.onerror=rej;
im.src=r.result;
};
r.onerror=rej;
r.readAsDataURL(file);
});
}

return`<article class="card" data-a="open" data-id="${p.id}"><div class="im">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy">`:'<i class="fa-solid fa-image"></i>'}<div class="bds">${!a?'<span class="bd out">نفذ</span>':(d?`<span class="bd ds">خصم ${Number(p.discount)}%</span>`:(isNew?'<span class="bd new">جديد</span>':'<span class="bd">متوفر</span>'))}</div><button class="hrt ${w?'on':''}" data-a="wish" data-id="${p.id}" aria-label="المفضلة"><i class="fa-${w?'solid':'regular'} fa-heart"></i></button></div><div class="inf"><h3>${hi(p.name,S.q)}</h3><div class="pr"><b>${money(f)}</b>${d?`<s>${money(p.price)}</s>`:''}</div><button class="btn sm" data-a="add" data-id="${p.id}" ${a?'':'disabled'}><i class="fa-solid fa-cart-plus"></i> ${a?'أضف للسلة':'غير متوفر'}</button></div></article>`;
}

function drawGrid(){
const chips=$('#chips'),grid=$('#grid');
if(!chips||!grid)return;
if(!S.ld.products){
grid.innerHTML=Array(8).fill('<div class="sk"></div>').join('');
return;
}
const all=arr(S.products).filter(p=>p.visible!==false);
const cats=[...new Set(all.map(p=>p.category).filter(Boolean))];
if(S.cat!=='all'&&!cats.includes(S.cat))S.cat='all';
chips.innerHTML=['all',...cats].map(c=>`<button class="chip ${S.cat===c?'on':''}" data-a="cat" data-c="${esc(c)}">${c==='all'?'الكل':esc(c)}</button>`).join('');
const q=S.q.trim().toLowerCase();
let l=all.filter(p=>(S.cat==='all'||p.category===S.cat)&&(!q||(p.name+' '+(p.description||'')+' '+(p.category||'')).toLowerCase().includes(q)));
if(S.minPrice>0)l=l.filter(p=>fin(p)>=S.minPrice);
if(S.maxPrice>0)l=l.filter(p=>fin(p)<=S.maxPrice);
switch(S.sort){
case 'price-asc':l.sort((a,b)=>fin(a)-fin(b));break;
case 'price-desc':l.sort((a,b)=>fin(b)-fin(a));break;
case 'discount':l.sort((a,b)=>(b.discount||0)-(a.discount||0));break;
case 'name':l.sort((a,b)=>(a.name||'').localeCompare(b.name||'','ar'));break;
default:l.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
}
grid.innerHTML=l.length?l.map(card).join(''):EMPTY('لا توجد منتجات مطابقة','fa-face-frown-open','جرّب تغيير الفلاتر أو كلمة البحث');
}

function setQ(v){
S.q=v;
['hq','qm'].forEach(i=>{const e=$('#'+i);if(e&&e.value!==v)e.value=v});
if(S.page!=='home'){go('home');return}
drawGrid();
}

function userOrder(o){
const its=Object.values(o.items||{});
const st=o.status||'pending';
const stIdx=['pending','confirmed','shipped','delivered'].indexOf(st);

const timeline=st!=='cancelled'?`<div class="timeline" style="margin-top:12px">${steps.map((s,i)=>`<div class="tl-it ${i<=stIdx?'done':''} ${i===stIdx?'current':''}"><div class="tl-dot"><i class="fa-solid ${s[2]}"></i></div><div class="tl-body"><b>${s[1]}</b><small>${i===stIdx?'الحالة الحالية':''}</small></div></div>`).join('')}</div>`:'';

}

function cartItems(){
return Object.entries(cart).map(([id,q])=>{const p=S.products[id];return p?{...p,id,q}:null}).filter(Boolean);
}

function totals(){
const it=cartItems().filter(avail);
const sub=it.reduce((a,p)=>a+fin(p)*Math.min(p.q,p.qty),0);
const c=S.coupon;
let d=0;
if(c&&sub>=(c.min||0))d=c.type==='percent'?sub*c.value/100:Math.min(c.value,sub);
d=Math.round(d*100)/100;
return{it,sub:Math.round(sub*100)/100,d,total:Math.max(0,Math.round((sub-d)*100)/100)};
}

function playTone(type,pri){
try{
AC=AC||new(window.AudioContext||window.webkitAudioContext)();
if(AC.state==='suspended')AC.resume();
let t=AC.currentTime;
(TONES[type]||TONES.system).forEach(([f,d])=>{
const o=AC.createOscillator(),g=AC.createGain();
o.type='sine';
o.frequency.value=f;
g.gain.setValueAtTime(.0001,t);
g.gain.exponentialRampToValueAtTime(pri==='high'?.4:.22,t+.02);
g.gain.exponentialRampToValueAtTime(.0001,t+d);
o.connect(g);
g.connect(AC.destination);
o.start(t);
o.stop(t+d+.03);
t+=d;
});
}catch{}
}

function exportCSV(rows,filename){
if(!rows.length){toast('لا توجد بيانات للتصدير','err');return}
const headers=Object.keys(rows[0]);
const csv=[headers.join(','),...rows.map(r=>headers.map(h=>`"${String(r[h]??'').replace(/"/g,'""')}"`).join(','))].join('\n');
const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
const url=URL.createObjectURL(blob);
const a=document.createElement('a');
a.href=url;
a.download=filename;
a.click();
URL.revokeObjectURL(url);
toast('تم التصدير بنجاح','ok');
}

function showQR(text){
openOv('qr',`<button class="x" data-a="close" data-id="qr"><i class="fa-solid fa-xmark"></i></button><h2 class="mt"><i class="fa-solid fa-qrcode"></i> رمز QR</h2><div class="qr-wrap"><div id="qrCanvas"></div><div class="qr-url">${esc(text)}</div><div class="ph" style="justify-content:center"><button class="btn" data-a="copyQR" data-url="${esc(text)}"><i class="fa-solid fa-copy"></i> نسخ الرابط</button></div></div>`,'md');
setTimeout(async()=>{
const el=$('#qrCanvas');
if(!el)return;
try{
const mod=await import('https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js');
const canvas=document.createElement('canvas');
await window.QRCode.toCanvas(canvas,text,{width:240,margin:2,color:{dark:'#e91e63',light:'#ffffff'}});
el.appendChild(canvas);
}catch{
el.innerHTML=`<img src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(text)}&color=e91e63" alt="QR">`;
}
},100);
}

doBulkImport:async()=>{
const txt=$('#bulkJson')?.value?.trim();
if(!txt)return toast('الصق البيانات أولاً','err');
try{
const data=JSON.parse(txt);
if(!Array.isArray(data))throw new Error('يجب أن تكون مصفوفة');
let n=0;
for(const p of data){
if(!p.name||!p.price)continue;
await push(ref(db,'products'),{name:p.name,price:Number(p.price),discount:Number(p.discount||0),qty:Number(p.qty||0),category:p.category||'',description:p.description||'',image:p.image||'',stock:p.stock!==false,visible:p.visible!==false,createdAt:Date.now()});
n++;
}
closeOv('bulk');
toast(`تم استيراد ${n} منتج`,'ok');
logActivity('استيراد منتجات',`${n} منتج`);
}catch(e){toast('خطأ: '+e.message,'err')}
},

async function setStatus(id,st){
const o=S.orders[id];
if(!o||o.status===st)return;
const was=['confirmed','shipped','delivered'].includes(o.status);
const now=['confirmed','shipped','delivered'].includes(st);
await update(ref(db,'orders/'+id),{status:st});
const adj=dir=>Promise.all(Object.values(o.items||{}).map(i=>runTransaction(ref(db,'products/'+i.id+'/qty'),v=>v==null?v:Math.max(0,Number(v)+dir*Number(i.qty))).catch(()=>{})));
if(!was&&now)await adj(-1);
if(was&&!now)await adj(1);
set(push(ref(db,'notifications')),{
title:'تحديث حالة الطلب',
body:'أصبحت حالة طلبك: '+ST[st][0],
type:'order',
priority:'high',
target:'specific',
targetUid:o.uid,
by:S.user.uid,
createdAt:Date.now()
}).catch(()=>{});
toast('تم تحديث حالة الطلب','ok');
logActivity('تحديث حالة طلب',shortId(id)+' → '+ST[st][0]);
}

function hideSuggest(){
const el=$('#suggestBox');
if(el)el.classList.add('hide');
}

function showSuggest(q){
const el=$('#suggestBox');
if(!el)return;
if(!q||q.length<2){el.classList.add('hide');return}
const l=arr(S.products).filter(p=>p.visible!==false&&p.name.toLowerCase().includes(q.toLowerCase())).slice(0,6);
if(!l.length){el.innerHTML='<div class="no-res">لا توجد نتائج</div>';el.classList.remove('hide');return}
el.innerHTML=l.map(p=>`<button class="sg-it" data-a="open" data-id="${p.id}">${p.image?`<img src="${esc(p.image)}" alt="">`:`<div class="ph"><i class="fa-solid fa-image"></i></div>`}<div class="info"><b>${hi(p.name,q)}</b><small>${money(fin(p))}</small></div></button>`).join('');
el.classList.remove('hide');
}

const hq=$('#hq');
if(hq){
hq.addEventListener('input',()=>showSuggest(hq.value));
hq.addEventListener('focus',()=>showSuggest(hq.value));
}

    let processedFile = file;
    if(file.type.startsWith('image')){
      try { processedFile = await compressImage(file, 900, 0.7); } catch(e){}
    }
    if(processedFile.size > 3 * 1024 * 1024) return alert('الملف كبير جداً (3MB max)');
    media = await fileToBase64(processedFile);
    if(media.length > 600000) return alert('الملف كبير جداً بعد الترميز');
    mediaType = processedFile.type.startsWith('video') ? 'video' : 'image';
  }
  await push(ref(db,'stories'), {
    text: text || '', media, mediaType,
    uid: currentUser.uid, name: currentUserData.name,
    photoURL: currentUserData.photoURL || null, timestamp: Date.now()
  });
  $('storyTextInput').value = '';
  $('storyMediaInput').value = '';
  $('addStoryModal').classList.remove('active');
}
let currentStoryUid = null;
function viewStory(id, stories){
  const s = stories[id];
  if(!s) return;
  currentStoryUid = s.uid;
  if(s.mediaType === 'video' && s.media){
    $('storyContent').innerHTML = `<video src="${s.media}" autoplay playsinline></video>`;
    $('storyContent').style.background = '#000';
  } else if(s.mediaType === 'image' && s.media){
    $('storyContent').innerHTML = `<img src="${s.media}">`;
    $('storyContent').style.background = '#000';
  } else {
    $('storyContent').textContent = s.text || '';
    $('storyContent').style.background = 'linear-gradient(135deg,#00a884,#005c4b)';
  }
  $('storyName').textContent = s.name;
  $('storyAvatar').innerHTML = s.photoURL ? `<img src="${s.photoURL}">` : (s.name||'U').charAt(0).toUpperCase();
  $('storyTime').textContent = formatTimeShort(new Date(s.timestamp));
  $('storyViewer').classList.add('active');
  const bar = $('storyProgress');
  bar.style.animation = 'none';
  void bar.offsetWidth;
  bar.style.animation = 'progress 5s linear forwards';
  clearTimeout(viewStory._t);
  viewStory._t = setTimeout(() => $('storyViewer').classList.remove('active'), 5000);
}
function openStoryUserChat(){
  if(!currentStoryUid || currentStoryUid === currentUser.uid) return;
  $('storyViewer').classList.remove('active');
  const u = allUsers[currentStoryUid];
  if(!u) return;
  set(ref(db,'userChats/'+currentUser.uid+'/'+currentStoryUid), true);
  set(ref(db,'userChats/'+currentStoryUid+'/'+currentUser.uid), true);
  setTimeout(() => openChat(currentStoryUid, u.name, u.photoURL || ''), 200);
}

/* ============ المكالمات ============ */
function loadCallHistory(){
  if(unsubCalls) unsubCalls();
  unsubCalls = onValue(ref(db,'calls/'+currentUser.uid), snap => {
    const container = $('callsContainer');
    if(!container) return;
    const calls = snap.val() || {};
    const list = Object.entries(calls).map(([id, c]) => ({id, ...c}))
      .sort((a,b) => b.timestamp - a.timestamp).slice(0, 100);
    if(!list.length){
      container.innerHTML = `<div class="empty-state"><div class="big-icon"><i class="fas fa-phone"></i></div><div>سجل المكالمات فارغ</div></div>`;
      return;
    }
    const missed = list.filter(c => c.direction === 'in' && c.missed);
    const incoming = list.filter(c => c.direction === 'in' && !c.missed);
    const outgoing = list.filter(c => c.direction === 'out');
    let html = '';
    if(missed.length) html += `<div class="call-section-title">📵 فائتة</div>` + missed.map(renderCallItem).join('');
    if(incoming.length) html += `<div class="call-section-title">📥 واردة</div>` + incoming.map(renderCallItem).join('');
    if(outgoing.length) html += `<div class="call-section-title">📤 صادرة</div>` + outgoing.map(renderCallItem).join('');
    container.innerHTML = html;
  });
}
function renderCallItem(c){
  const name = c.toName || 'مستخدم';
  const initial = name.charAt(0).toUpperCase();
  const icon = c.type === 'video' ? 'fa-video' : 'fa-phone';
  const dirIcon = c.direction === 'out' ? 'fa-arrow-up out' : (c.missed ? 'fa-arrow-down missed' : 'fa-arrow-down in');
  const dur = c.duration ? ` • ${formatDuration(c.duration)}` : '';
  return `<div class="call-item"><div class="avatar">${initial}</div><div class="info"><div class="name">${escapeHtml(name)}</div><div class="meta"><i class="fas ${dirIcon}"></i><i class="fas ${icon}"></i><span>${formatTimeShort(new Date(c.timestamp))}${dur}</span></div></div><button class="call-back-btn"><i class="fas fa-phone"></i></button></div>`;
}

/* ============ WebRTC ============ */
const rtcConfig = { iceServers: [
  {urls: 'stun:stun.l.google.com:19302'},
  {urls: 'stun:stun1.l.google.com:19302'},
  {urls: 'stun:stun2.l.google.com:19302'}
]};
let pc = null, localStream = null, currentCallId = null, callType = null;
let callTimerInterval = null, callStartTime = 0, isCaller = false, remoteAudio = null, unsubIncomingCalls = null;

async function startCall(type){
  if(!currentChatUser) return;
  isCaller = true; callType = type;
  try {
    localStream = await navigator.mediaDevices.getUserMedia({
      audio: {echoCancellation: true, noiseSuppression: true},
      video: type === 'video' ? {width: {ideal: 1280}, height: {ideal: 720}} : false
    });
  } catch(e){ alert('لا يمكن الوصول للكاميرا/الميكروفون: ' + e.message); return; }
  currentCallId = currentUser.uid + '_' + currentChatUser.uid + '_' + Date.now();
  showCallScreen();
  $('callStatus').textContent = 'جاري الاتصال...';
  if(type === 'video'){
    $('callScreen').classList.add('video-call');
    $('localVideo').srcObject = localStream;
    $('videoCallName').textContent = currentChatUser.name;
  }
  createPeerConnection();
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await set(ref(db, `calls_signaling/${currentChatUser.uid}/incoming/${currentCallId}`), {
    from: currentUser.uid,
    fromName: currentUserData.name,
    fromPhoto: currentUserData.photoURL || null,
    type: callType,
    offer: {type: offer.type, sdp: offer.sdp},
    timestamp: Date.now()
  });
  onValue(ref(db, `calls_signaling/${currentUser.uid}/active/${currentCallId}`), async snap => {
    const data = snap.val();
    if(!data) return;
    if(data.answer && pc && pc.signalingState !== 'stable'){
      try {
        await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
        onCallConnected();
      } catch(e){ console.log(e); }
    }
    if(data.ended) endCallCleanup();
  });
  pc.onicecandidate = async e => {
    if(e.candidate) await push(ref(db, `calls_signaling/${currentChatUser.uid}/active/${currentCallId}/callerCandidates`), e.candidate.toJSON());
  };
  onChildAdded(ref(db, `calls_signaling/${currentUser.uid}/active/${currentCallId}/receiverCandidates`), async snap => {
    const c = snap.val();
    if(c && pc){ try { await pc.addIceCandidate(new RTCIceCandidate(c)); } catch(e){} }
  });
  pc.ontrack = e => {
    if(type === 'video') $('remoteVideo').srcObject = e.streams[0];
    else {
      if(!remoteAudio){ remoteAudio = new Audio(); remoteAudio.autoplay = true; }
      remoteAudio.srcObject = e.streams[0];
    }
    onCallConnected();
  };
}
function listenIncomingCalls(){
  if(unsubIncomingCalls) unsubIncomingCalls();
  unsubIncomingCalls = onChildAdded(ref(db, `calls_signaling/${currentUser.uid}/incoming`), snap => {
    const data = snap.val();
    if(!data) return;
    if(Date.now() - data.timestamp > 30000){ remove(ref(db, `calls_signaling/${currentUser.uid}/incoming/${snap.key}`)); return; }
    if(window.currentIncomingCallId) return;
    window.currentIncomingCallId = snap.key;
    window.currentIncomingData = data;
    $('incomingCallerName').textContent = data.fromName;
    $('incomingCallType').textContent = data.type === 'video' ? 'مكالمة فيديو واردة' : 'مكالمة صوتية واردة';
    $('incomingCallModal').classList.add('active');
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = 800;
      gain.gain.value = 0.15;
      osc.start();
      setTimeout(() => { try{ osc.stop(); }catch(e){} }, 700);
    } catch(e){}
  });
}
async function acceptCall(){
  $('incomingCallModal').classList.remove('active');
  const callId = window.currentIncomingCallId;
  const data = window.currentIncomingData;
  if(!callId || !data) return;
  isCaller = false; callType = data.type; currentCallId = callId;
  currentChatUser = {uid: data.from, name: data.fromName, photoURL: data.fromPhoto};
  try {
    localStream = await navigator.mediaDevices.getUserMedia({
      audio: {echoCancellation: true, noiseSuppression: true},
      video: callType === 'video' ? {width: {ideal: 1280}, height: {ideal: 720}} : false
    });
  } catch(e){ alert('لا يمكن الوصول للكاميرا'); return; }
  showCallScreen();
  $('callName').textContent = data.fromName;
  $('callStatus').textContent = 'جاري الاتصال...';
  if(callType === 'video'){
    $('callScreen').classList.add('video-call');
    $('localVideo').srcObject = localStream;
    $('videoCallName').textContent = data.fromName;
  }
  createPeerConnection();
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
  pc.ontrack = e => {
    if(callType === 'video') $('remoteVideo').srcObject = e.streams[0];
    else {
      if(!remoteAudio){ remoteAudio = new Audio(); remoteAudio.autoplay = true; }
      remoteAudio.srcObject = e.streams[0];
    }
    onCallConnected();
  };
  pc.onicecandidate = async e => {
    if(e.candidate) await push(ref(db, `calls_signaling/${data.from}/active/${callId}/receiverCandidates`), e.candidate.toJSON());
  };
  onChildAdded(ref(db, `calls_signaling/${currentUser.uid}/active/${callId}/callerCandidates`), async snap => {
    const c = snap.val();
    if(c && pc){ try { await pc.addIceCandidate(new RTCIceCandidate(c)); } catch(e){} }
  });
  await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  await update(ref(db, `calls_signaling/${data.from}/active/${callId}`), {
    answer: {type: answer.type, sdp: answer.sdp},
    receiverId: currentUser.uid
  });
  await remove(ref(db, `calls_signaling/${currentUser.uid}/incoming/${callId}`));
  onValue(ref(db, `calls_signaling/${data.from}/active/${callId}/ended`), snap => { if(snap.exists()) endCallCleanup(); });
  window.currentIncomingCallId = null;
  window.currentIncomingData = null;
}
async function rejectCall(){
  const callId = window.currentIncomingCallId;
  const data = window.currentIncomingData;
  if(callId && data){
    await update(ref(db, `calls_signaling/${data.from}/active/${callId}`), {ended: true});
    await remove(ref(db, `calls_signaling/${currentUser.uid}/incoming/${callId}`));
    push(ref(db, 'calls/'+currentUser.uid), {
      toUid: data.from, toName: data.fromName, type: data.type,
      direction: 'in', missed: true, timestamp: Date.now()
    });
  }
  $('incomingCallModal').classList.remove('active');
  window.currentIncomingCallId = null;
  window.currentIncomingData = null;
}
function createPeerConnection(){
  pc = new RTCPeerConnection(rtcConfig);
  pc.onconnectionstatechange = () => {
    if(pc.connectionState === 'disconnected' || pc.connectionState === 'failed') endCallCleanup();
  };
}
function onCallConnected(){
  if(callTimerInterval) return;
  $('callStatus').textContent = 'متصل';
  callStartTime = Date.now();
  callTimerInterval = setInterval(() => {
    const secs = Math.floor((Date.now() - callStartTime) / 1000);
    const t = formatDuration(secs);
    $('callTimer').textContent = t;
    $('videoCallTimer').textContent = t;
  }, 1000);
}
function showCallScreen(){
  const initial = (currentChatUser.name || 'U').charAt(0).toUpperCase();
  $('callAvatar').innerHTML = currentChatUser.photoURL ? `<img src="${currentChatUser.photoURL}">` : initial;
  $('callName').textContent = currentChatUser.name;
  $('callTimer').textContent = '';
  $('videoCallTimer').textContent = '';
  $('callScreen').classList.add('active');
}
function endCallHandler(){
  if(currentCallId && currentChatUser){
    update(ref(db, `calls_signaling/${currentChatUser.uid}/active/${currentCallId}`), {ended: true});
  }
  endCallCleanup();
}
function endCallCleanup(){
  if(callTimerInterval){ clearInterval(callTimerInterval); callTimerInterval = null; }
  if(pc){ pc.close(); pc = null; }
  if(localStream){ localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  if(remoteAudio){ remoteAudio.pause(); remoteAudio = null; }
  if(currentCallId) remove(ref(db, `calls_signaling/${currentUser.uid}/active/${currentCallId}`));
  $('callScreen').classList.remove('active');
  $('callScreen').classList.remove('video-call');
  $('localVideo').srcObject = null;
  $('remoteVideo').srcObject = null;
  if(currentChatUser && callStartTime && callType){
    const duration = Math.round((Date.now() - callStartTime) / 1000);
    push(ref(db,'calls/'+currentUser.uid), {
      toUid: currentChatUser.uid, toName: currentChatUser.name,
      type: callType, direction: 'out', duration, timestamp: Date.now()
    });
  }
  currentCallId = null; callType = null; isCaller = false; callStartTime = 0;
  window.currentIncomingCallId = null;
  window.currentIncomingData = null;
}
function toggleMuteCallHandler(e){
  if(!localStream) return;
  const t = localStream.getAudioTracks()[0];
  if(t){
    t.enabled = !t.enabled;
    e.currentTarget.classList.toggle('active', !t.enabled);
    e.currentTarget.innerHTML = t.enabled ? '<i class="fas fa-microphone"></i>' : '<i class="fas fa-microphone-slash"></i>';
  }
}

/* ============ أدوات ============ */
async function markAllAsRead(){
  if(!currentUser) return;
  const snap = await get(ref(db, 'userChats/'+currentUser.uid));
  const chats = snap.val() || {};
  for(const otherId of Object.keys(chats)){
    const chatId = getChatId(currentUser.uid, otherId);
    await set(ref(db, 'chats/'+chatId+'/unread/'+currentUser.uid), 0);
  }
}
async function logout(){
  if(!confirm('تسجيل الخروج؟')) return;
  await remove(ref(db, 'onlineUsers/'+currentUser.uid));
  await signOut(auth);
  location.reload();
}
function formatTime(d){
  let h = d.getHours();
  const m = String(d.getMinutes()).padStart(2,'0');
  const p = h >= 12 ? 'م' : 'ص';
  h = h % 12 || 12;
  return `${h}:${m} ${p}`;
}
function formatTimeShort(d){
  const now = new Date();
  if(now.toDateString() === d.toDateString()) return formatTime(d);
  const diff = (now - d) / 86400000;
  if(diff < 7) return ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'][d.getDay()];
  return `${d.getDate()}/${d.getMonth()+1}`;
}
function formatDate(d){
  const t = new Date(), y = new Date(); y.setDate(t.getDate()-1);
  if(d.toDateString() === t.toDateString()) return 'اليوم';
  if(d.toDateString() === y.toDateString()) return 'أمس';
  return `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
}
function formatDuration(secs){
  const m = Math.floor(secs/60);
  const s = secs % 60;
  return `${m}:${String(s).padStart(2,'0')}`;
}
function escapeHtml(t){
  const d = document.createElement('div');
  d.textContent = t;
  return d.innerHTML;
}

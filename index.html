<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Clone - Firebase Auth</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
    body {
      background: #0b141a;
      display: flex; justify-content: center; align-items: center;
      height: 100vh; overflow: hidden;
    }

    /* شاشة تسجيل الدخول */
    .auth-screen {
      position: fixed; inset: 0;
      background: linear-gradient(135deg, #075e54 0%, #128c7e 50%, #25d366 100%);
      display: flex; justify-content: center; align-items: center;
      z-index: 1000; transition: opacity 0.4s;
    }
    .auth-screen.hidden { opacity: 0; pointer-events: none; }
    .auth-box {
      background: #fff; padding: 30px 25px; border-radius: 15px;
      width: 90%; max-width: 380px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }
    .auth-box .logo {
      width: 70px; height: 70px; background: #25d366;
      border-radius: 50%; margin: 0 auto 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 34px; color: white;
    }
    .auth-box h1 {
      color: #075e54; margin-bottom: 6px; font-size: 22px; text-align: center;
    }
    .auth-box p.subtitle {
      color: #667781; margin-bottom: 22px; font-size: 13px; text-align: center;
    }
    .auth-box input {
      width: 100%; padding: 13px 15px; margin-bottom: 10px;
      border: 2px solid #e9edef; border-radius: 10px;
      font-size: 14px; outline: none; transition: border 0.2s;
      text-align: right;
    }
    .auth-box input:focus { border-color: #25d366; }
    .btn-primary {
      width: 100%; padding: 13px; background: #25d366;
      color: white; border: none; border-radius: 10px;
      font-size: 15px; font-weight: bold; cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary:hover { background: #1ebe5b; }
    .btn-primary:disabled { background: #b1b3b5; cursor: not-allowed; }
    .btn-google {
      width: 100%; padding: 13px; background: #fff;
      color: #444; border: 2px solid #dadce0; border-radius: 10px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      margin-top: 12px; transition: background 0.2s;
    }
    .btn-google:hover { background: #f8f9fa; }
    .btn-google img { width: 20px; height: 20px; }
    .toggle-link {
      text-align: center; margin-top: 15px; font-size: 13px;
      color: #667781;
    }
    .toggle-link a {
      color: #25d366; font-weight: bold; cursor: pointer; text-decoration: none;
    }
    .error-msg {
      background: #ffe5e5; color: #c00; padding: 10px;
      border-radius: 8px; font-size: 13px; margin-bottom: 12px;
      display: none; text-align: right;
    }
    .error-msg.show { display: block; }
    .divider {
      display: flex; align-items: center; gap: 10px;
      margin: 15px 0; color: #999; font-size: 12px;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: #e0e0e0;
    }

    /* واجهة الدردشة */
    .chat-container {
      width: 100%; max-width: 450px; height: 100vh; max-height: 800px;
      background: #efeae2; display: flex; flex-direction: column;
      overflow: hidden; position: relative;
      box-shadow: 0 0 40px rgba(0,0,0,0.5);
    }
    @media (min-width: 500px) { .chat-container { border-radius: 12px; } }
    .chat-header {
      background: #075e54; color: white; padding: 10px 15px;
      display: flex; align-items: center; gap: 12px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15); z-index: 10;
    }
    .chat-header .avatar {
      width: 42px; height: 42px;
      background: #25d366; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: bold; font-size: 16px; color: white;
      flex-shrink: 0; overflow: hidden;
    }
    .chat-header .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .chat-header .info { flex: 1; min-width: 0; }
    .chat-header .info h2 {
      font-size: 15px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .chat-header .info .status {
      font-size: 11.5px; opacity: 0.85;
      display: flex; align-items: center; gap: 5px;
    }
    .chat-header .info .status::before {
      content: ''; width: 7px; height: 7px;
      background: #25d366; border-radius: 50%;
      box-shadow: 0 0 5px #25d366;
    }
    .chat-header .logout-btn {
      background: transparent; border: none; color: white;
      font-size: 20px; cursor: pointer; padding: 5px;
      border-radius: 50%; transition: background 0.2s;
    }
    .chat-header .logout-btn:hover { background: rgba(255,255,255,0.15); }
    .chat-messages {
      flex: 1; padding: 15px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 6px;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(255,255,255,0.4) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(255,255,255,0.3) 0%, transparent 40%);
    }
    .chat-messages::-webkit-scrollbar { width: 6px; }
    .chat-messages::-webkit-scrollbar-thumb { background: #b1b3b5; border-radius: 3px; }
    .message-row { display: flex; width: 100%; animation: fadeIn 0.25s ease; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .message-row.mine { justify-content: flex-start; }
    .message-row.other { justify-content: flex-end; }
    .message {
      max-width: 75%; padding: 8px 12px 6px;
      border-radius: 10px; font-size: 14.5px;
      word-wrap: break-word; position: relative;
      box-shadow: 0 1px 1px rgba(0,0,0,0.1); line-height: 1.4;
    }
    .message.mine { background: #d9fdd3; color: #111b21; border-top-right-radius: 3px; }
    .message.other { background: #fff; color: #111b21; border-top-left-radius: 3px; }
    .message .sender-name {
      font-size: 12.5px; font-weight: bold;
      color: #25d366; margin-bottom: 3px; display: block;
    }
    .message.mine .sender-name { color: #075e54; }
    .message .msg-meta {
      font-size: 11px; color: #667781; margin-top: 3px;
      display: flex; justify-content: flex-start; align-items: center; gap: 4px;
    }
    .message .check { font-size: 12px; color: #53bdeb; }
    .chat-input {
      display: flex; padding: 8px 10px; background: #f0f2f5;
      gap: 8px; align-items: center; border-top: 1px solid #e0e0e0;
    }
    .chat-input input {
      flex: 1; padding: 11px 15px; border: none;
      border-radius: 25px; outline: none; font-size: 15px;
      background: #fff; text-align: right;
    }
    .chat-input button {
      width: 45px; height: 45px; border-radius: 50%;
      background: #25d366; color: white; border: none;
      font-size: 20px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.15s, background 0.2s; flex-shrink: 0;
    }
    .chat-input button:hover { background: #1ebe5b; transform: scale(1.05); }
    .chat-input button:active { transform: scale(0.95); }
    .date-separator {
      align-self: center; background: #fff; color: #667781;
      font-size: 11.5px; padding: 5px 12px; border-radius: 8px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1); margin: 5px 0; font-weight: 500;
    }
    .loading-spinner {
      text-align: center; padding: 40px 20px; color: #667781; font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- شاشة تسجيل الدخول -->
  <div class="auth-screen" id="authScreen">
    <div class="auth-box">
      <div class="logo">💬</div>
      <h1>واتساب ويب</h1>
      <p class="subtitle" id="formSubtitle">سجّل دخولك للمتابعة</p>

      <div class="error-msg" id="errorMsg"></div>

      <input type="email" id="emailInput" placeholder="البريد الإلكتروني" autocomplete="email">
      <input type="password" id="passwordInput" placeholder="كلمة المرور" autocomplete="current-password">
      <input type="text" id="displayNameInput" placeholder="الاسم الظاهر" style="display:none;" maxlength="30">

      <button class="btn-primary" id="authBtn">تسجيل الدخول</button>

      <div class="divider">أو</div>

      <button class="btn-google" id="googleBtn">
        <svg width="20" height="20" viewBox="0 0 48 48">
          <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
          <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
          <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
          <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
        </svg>
        المتابعة باستخدام Google
      </button>

      <div class="toggle-link">
        <span id="toggleText">ليس لديك حساب؟</span>
        <a id="toggleBtn">إنشاء حساب جديد</a>
      </div>
    </div>
  </div>

  <!-- واجهة الدردشة (مخفية حتى تسجيل الدخول) -->
  <div class="chat-container" id="chatContainer" style="display:none;">
    <div class="chat-header">
      <div class="avatar" id="userAvatar">؟</div>
      <div class="info">
        <h2 id="userName">غرفة الدردشة العامة</h2>
        <div class="status" id="userEmail">متصل</div>
      </div>
      <button class="logout-btn" id="logoutBtn" title="خروج">🚪</button>
    </div>
    <div class="chat-messages" id="messages">
      <div class="loading-spinner">جاري تحميل الرسائل...</div>
    </div>
    <div class="chat-input">
      <input type="text" id="messageInput" placeholder="اكتب رسالة..." autocomplete="off">
      <button id="sendBtn" title="إرسال">➤</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
      GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged,
      updateProfile
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getDatabase, ref, push, onChildAdded, set, remove 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // إعدادات Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyAN11agW-TWwAk3TvF7mRZRt6PHLcnl_aQ",
      authDomain: "ym-pro-max.firebaseapp.com",
      databaseURL: "https://ym-pro-max-default-rtdb.firebaseio.com",
      projectId: "ym-pro-max",
      storageBucket: "ym-pro-max.firebasestorage.app",
      messagingSenderId: "174657071953",
      appId: "1:174657071953:web:5e831fc337df46dbd18170"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const googleProvider = new GoogleAuthProvider();

    // العناصر
    const authScreen = document.getElementById('authScreen');
    const chatContainer = document.getElementById('chatContainer');
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const displayNameInput = document.getElementById('displayNameInput');
    const authBtn = document.getElementById('authBtn');
    const googleBtn = document.getElementById('googleBtn');
    const toggleBtn = document.getElementById('toggleBtn');
    const toggleText = document.getElementById('toggleText');
    const formSubtitle = document.getElementById('formSubtitle');
    const errorMsg = document.getElementById('errorMsg');
    const messagesContainer = document.getElementById('messages');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const userAvatar = document.getElementById('userAvatar');
    const userName = document.getElementById('userName');
    const userEmail = document.getElementById('userEmail');

    let isSignUp = false;
    let currentUser = null;
    let lastMessageDate = '';
    let messagesLoaded = false;

    // ====== تبديل بين تسجيل الدخول / إنشاء حساب ======
    toggleBtn.addEventListener('click', () => {
      isSignUp = !isSignUp;
      if (isSignUp) {
        formSubtitle.textContent = 'أنشئ حسابك الجديد';
        authBtn.textContent = 'إنشاء حساب';
        displayNameInput.style.display = 'block';
        toggleText.textContent = 'لديك حساب بالفعل؟';
        toggleBtn.textContent = 'تسجيل الدخول';
        passwordInput.autocomplete = 'new-password';
      } else {
        formSubtitle.textContent = 'سجّل دخولك للمتابعة';
        authBtn.textContent = 'تسجيل الدخول';
        displayNameInput.style.display = 'none';
        toggleText.textContent = 'ليس لديك حساب؟';
        toggleBtn.textContent = 'إنشاء حساب جديد';
        passwordInput.autocomplete = 'current-password';
      }
      hideError();
    });

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.add('show');
    }
    function hideError() {
      errorMsg.classList.remove('show');
    }
    function setLoading(loading) {
      authBtn.disabled = loading;
      googleBtn.disabled = loading;
      authBtn.textContent = loading ? '...' : (isSignUp ? 'إنشاء حساب' : 'تسجيل الدخول');
    }

    // ترجمة أخطاء Firebase للعربية
    function translateAuthError(code) {
      const errors = {
        'auth/email-already-in-use': 'هذا البريد مسجّل مسبقاً',
        'auth/invalid-email': 'البريد الإلكتروني غير صحيح',
        'auth/weak-password': 'كلمة المرور ضعيفة (6 أحرف على الأقل)',
        'auth/user-not-found': 'لا يوجد حساب بهذا البريد',
        'auth/wrong-password': 'كلمة المرور غير صحيحة',
        'auth/invalid-credential': 'البريد أو كلمة المرور غير صحيحة',
        'auth/too-many-requests': 'محاولات كثيرة، حاول لاحقاً',
        'auth/popup-closed-by-user': 'تم إغلاق النافذة قبل إكمال الدخول',
        'auth/network-request-failed': 'تعذّر الاتصال بالإنترنت'
      };
      return errors[code] || 'حدث خطأ، حاول مرة أخرى';
    }

    // ====== تسجيل بالبريد الإلكتروني ======
    authBtn.addEventListener('click', async () => {
      hideError();
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const displayName = displayNameInput.value.trim();

      if (!email || !password) {
        return showError('يرجى إدخال البريد وكلمة المرور');
      }
      if (password.length < 6) {
        return showError('كلمة المرور يجب أن تكون 6 أحرف على الأقل');
      }
      if (isSignUp && displayName.length < 2) {
        return showError('يرجى إدخال اسم صحيح (حرفان على الأقل)');
      }

      setLoading(true);
      try {
        if (isSignUp) {
          const result = await createUserWithEmailAndPassword(auth, email, password);
          await updateProfile(result.user, { displayName });
        } else {
          await signInWithEmailAndPassword(auth, email, password);
        }
      } catch (err) {
        showError(translateAuthError(err.code));
      } finally {
        setLoading(false);
      }
    });

    // ====== تسجيل بحساب Google ======
    googleBtn.addEventListener('click', async () => {
      hideError();
      setLoading(true);
      try {
        await signInWithPopup(auth, googleProvider);
      } catch (err) {
        showError(translateAuthError(err.code));
      } finally {
        setLoading(false);
      }
    });

    // ====== مراقبة حالة تسجيل الدخول ======
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        // إخفاء شاشة الدخول، إظهار الدردشة
        authScreen.classList.add('hidden');
        chatContainer.style.display = 'flex';
        
        // تحديث معلومات المستخدم
        const name = user.displayName || user.email.split('@')[0];
        userName.textContent = name;
        userEmail.textContent = user.email;
        
        // الصورة الرمزية
        if (user.photoURL) {
          userAvatar.innerHTML = `<img src="${user.photoURL}" alt="${name}">`;
        } else {
          userAvatar.textContent = name.charAt(0).toUpperCase();
        }

        // تسجيل المتصل في قاعدة البيانات
        set(ref(db, `onlineUsers/${user.uid}`), {
          name: name,
          email: user.email,
          joinedAt: Date.now()
        });

        // تحميل الرسائل (مرة واحدة فقط)
        if (!messagesLoaded) {
          messagesLoaded = true;
          loadMessages();
        }
      } else {
        currentUser = null;
        messagesLoaded = false;
        chatContainer.style.display = 'none';
        authScreen.classList.remove('hidden');
        messagesContainer.innerHTML = '<div class="loading-spinner">جاري تحميل الرسائل...</div>';
        emailInput.value = '';
        passwordInput.value = '';
      }
    });

    // ====== تسجيل الخروج ======
    logoutBtn.addEventListener('click', async () => {
      if (!confirm('هل تريد الخروج؟')) return;
      if (currentUser) {
        await remove(ref(db, `onlineUsers/${currentUser.uid}`));
      }
      await signOut(auth);
      location.reload();
    });

    // ====== إرسال الرسائل ======
    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    function sendMessage() {
      if (!currentUser) return;
      const text = messageInput.value.trim();
      if (text === '') return;
      if (text.length > 500) return showError('الرسالة طويلة جداً');

      push(ref(db, 'messages'), {
        text: text,
        sender: currentUser.displayName || currentUser.email.split('@')[0],
        senderId: currentUser.uid,
        senderPhoto: currentUser.photoURL || null,
        timestamp: Date.now()
      });

      messageInput.value = '';
      messageInput.focus();
    }

    // ====== تحميل الرسائل ======
    function loadMessages() {
      messagesContainer.innerHTML = '';
      lastMessageDate = '';
      
      onChildAdded(ref(db, 'messages'), (snapshot) => {
        const data = snapshot.val();
        if (!data) return;
        renderMessage(data);
      });
    }

    function renderMessage(data) {
      const isMine = data.senderId === currentUser.uid;
      const msgDate = new Date(data.timestamp);
      const dateStr = formatDate(msgDate);

      if (dateStr !== lastMessageDate) {
        lastMessageDate = dateStr;
        const separator = document.createElement('div');
        separator.className = 'date-separator';
        separator.textContent = dateStr;
        messagesContainer.appendChild(separator);
      }

      const row = document.createElement('div');
      row.className = 'message-row ' + (isMine ? 'mine' : 'other');

      const msg = document.createElement('div');
      msg.className = 'message ' + (isMine ? 'mine' : 'other');

      let html = '';
      if (!isMine) {
        html += `<span class="sender-name">${escapeHtml(data.sender)}</span>`;
      }
      html += `<span>${escapeHtml(data.text)}</span>`;
      html += `<div class="msg-meta">
        <span>${formatTime(msgDate)}</span>
        ${isMine ? '<span class="check">✓✓</span>' : ''}
      </div>`;

      msg.innerHTML = html;
      row.appendChild(msg);
      messagesContainer.appendChild(row);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // ====== أدوات مساعدة ======
    function formatTime(date) {
      let h = date.getHours();
      const m = String(date.getMinutes()).padStart(2, '0');
      const period = h >= 12 ? 'م' : 'ص';
      h = h % 12 || 12;
      return `${h}:${m} ${period}`;
    }

    function formatDate(date) {
      const today = new Date();
      const yesterday = new Date();
      yesterday.setDate(today.getDate() - 1);
      const isSameDay = (d1, d2) =>
        d1.getDate() === d2.getDate() &&
        d1.getMonth() === d2.getMonth() &&
        d1.getFullYear() === d2.getFullYear();
      if (isSameDay(date, today)) return 'اليوم';
      if (isSameDay(date, yesterday)) return 'أمس';
      const months = ['يناير','فبراير','مارس','أبريل','مايو','يونيو',
                      'يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
      return `${date.getDate()} ${months[date.getMonth()]} ${date.getFullYear()}`;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>

</body>
</html>

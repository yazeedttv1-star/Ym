on($('chatMediaInput'), 'change', function(e){
  var file = e.target.files[0];
  if(!file) return;
  sendMediaToChat(file);
  e.target.value = '';
});
function sendMediaToChat(file){
  if(!currentChatUser && currentChatMode !== 'room') return alert('افتح محادثة أولاً');
  var isVideo = file.type.indexOf('video') === 0;
  var isImage = file.type.indexOf('image') === 0;
  if(!isVideo && !isImage) return alert('نوع الملف غير مدعوم');
  function sendFile(processedFile){
    var maxSize = isVideo ? 3 * 1024 * 1024 : 1.5 * 1024 * 1024;
    if(processedFile.size > maxSize) return alert('الملف كبير جداً');
    var reader = new FileReader();
    reader.onload = function(ev){
      var dataUrl = ev.target.result;
      var base64 = dataUrl.split(',')[1];
      var chatId = currentChatMode === 'room' ? ROOM_ID : getChatId(currentUser.uid, currentChatUser.uid);
      if(currentChatMode === 'room'){
        db.ref('rooms/' + ROOM_ID + '/messages').push({
          type: isVideo ? 'video' : 'image',
          media: base64, mime: processedFile.type, encrypted: true,
          senderId: currentUser.uid, senderName: currentUserData.name,
          senderPhoto: currentUserData.photoURL || null, timestamp: Date.now()
        });
      } else {
        db.ref('chats/' + chatId + '/messages').push({
          type: isVideo ? 'video' : 'image',
          media: base64, mime: processedFile.type, encrypted: true,
          senderId: currentUser.uid, timestamp: Date.now(), readBy: {}
        });
        db.ref('userChats/' + currentUser.uid + '/' + currentChatUser.uid).set(true);
        db.ref('userChats/' + currentChatUser.uid + '/' + currentUser.uid).set(true);
        db.ref('chats/' + chatId + '/unread/' + currentChatUser.uid).once('value').then(function(snap){
          var cur = snap.exists() ? snap.val() : 0;
          db.ref('chats/' + chatId + '/unread/' + currentChatUser.uid).set(cur + 1);
        });
      }
    };
    reader.readAsDataURL(processedFile);
  }
  if(isImage){
    compressImage(file, 800, 0.7, function(err, dataUrl){
      if(err){ sendFile(file); return; }
      // تحويل DataURL إلى File
      var arr = dataUrl.split(',');
      var mime = arr[0].match(/:(.*?);/)[1];
      var bstr = atob(arr[1]);
      var n = bstr.length;
      var u8 = new Uint8Array(n);
      while(n--){ u8[n] = bstr.charCodeAt(n); }
      var blob = new Blob([u8], {type: mime});
      sendFile(blob);
    });
  } else {
    sendFile(file);
  }
}

/* ============ الصوت ============ */
function startRecording(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    alert('جهازك لا يدعم التسجيل');
    return;
  }
  navigator.mediaDevices.getUserMedia({audio: true}).then(function(stream){
    try {
      mediaRecorder = new MediaRecorder(stream);
    } catch(e){ alert('جهازك لا يدعم التسجيل'); return; }
    audioChunks = [];
    recordingStartTime = Date.now();
    isRecording = true;
    mediaRecorder.ondataavailable = function(e){ if(e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.onstop = function(){
      var tracks = stream.getTracks();
      for(var i = 0; i < tracks.length; i++) tracks[i].stop();
      var blob = new Blob(audioChunks, {type: 'audio/webm'});
      sendAudioMessage(blob);
    };
    mediaRecorder.start();
    addClass($('micBtn'), 'recording');
    $('micBtn').innerHTML = '<i class="fas fa-stop"></i>';
    addClass($('recordingIndicator'), 'show');
    recordingTimer = setInterval(function(){
      var secs = Math.floor((Date.now() - recordingStartTime) / 1000);
      $('recordingTime').textContent = formatDuration(secs);
      if(secs >= 60) stopRecording();
    }, 200);
  }).catch(function(e){ alert('لا يمكن الوصول للميكروفون'); });
}
function stopRecording(){
  if(mediaRecorder && isRecording){
    mediaRecorder.stop();
    isRecording = false;
    clearInterval(recordingTimer);
    removeClass($('micBtn'), 'recording');
    $('micBtn').innerHTML = '<i class="fas fa-microphone"></i>';
    removeClass($('recordingIndicator'), 'show');
  }
}
function toggleMic(){ isRecording ? stopRecording() : startRecording(); }
function sendAudioMessage(blob){
  if(!currentChatUser && currentChatMode !== 'room') return;
  var reader = new FileReader();
  reader.onload = function(ev){
    var dataUrl = ev.target.result;
    var base64 = dataUrl.split(',')[1];
    var duration = Math.round((Date.now() - recordingStartTime) / 1000);
    var chatId = currentChatMode === 'room' ? ROOM_ID : getChatId(currentUser.uid, currentChatUser.uid);
    if(currentChatMode === 'room'){
      db.ref('rooms/' + ROOM_ID + '/messages').push({
        type: 'audio', audio: base64, duration: duration, encrypted: true,
        senderId: currentUser.uid, senderName: currentUserData.name,
        senderPhoto: currentUserData.photoURL || null, timestamp: Date.now()
      });
    } else {
      db.ref('chats/' + chatId + '/messages').push({
        type: 'audio', audio: base64, duration: duration, encrypted: true,
        senderId: currentUser.uid, timestamp: Date.now(), readBy: {}
      });
      db.ref('userChats/' + currentUser.uid + '/' + currentChatUser.uid).set(true);
      db.ref('userChats/' + currentChatUser.uid + '/' + currentUser.uid).set(true);
    }
  };
  reader.readAsDataURL(blob);
}

/* ============ WebRTC (مبسط) ============ */
var pc = null, localStream = null, currentCallId = null, callType = null;
var callTimerInterval = null, callStartTime = 0, unsubIncomingCalls = null;
var rtcConfig = { iceServers: [{urls: 'stun:stun.l.google.com:19302'}] };

function startCall(type){
  if(!currentChatUser) return;
  if(!navigator.mediaDevices){
    alert('جهازك لا يدعم المكالمات');
    return;
  }
  navigator.mediaDevices.getUserMedia({audio: true, video: type === 'video'}).then(function(stream){
    localStream = stream;
    currentCallId = currentUser.uid + '_' + currentChatUser.uid + '_' + Date.now();
    callType = type;
    showCallScreen();
    $('callStatus').textContent = 'جاري الاتصال...';
    if(type === 'video'){
      addClass($('callScreen'), 'video-call');
      $('localVideo').srcObject = stream;
    }
    try {
      pc = new RTCPeerConnection(rtcConfig);
    } catch(e){ alert('جهازك لا يدعم WebRTC'); return; }
    var tracks = stream.getTracks();
    for(var i = 0; i < tracks.length; i++) pc.addTrack(tracks[i], stream);
    pc.onicecandidate = function(e){
      if(e.candidate) db.ref('calls_signaling/' + currentChatUser.uid + '/active/' + currentCallId + '/callerCandidates').push(e.candidate.toJSON());
    };
    pc.ontrack = function(e){
      if(type === 'video') $('remoteVideo').srcObject = e.streams[0];
      else { window.remoteAudio = new Audio(); window.remoteAudio.srcObject = e.streams[0]; window.remoteAudio.play(); }
      onCallConnected();
    };
    pc.createOffer().then(function(offer){
      return pc.setLocalDescription(offer);
    }).then(function(){
      db.ref('calls_signaling/' + currentChatUser.uid + '/incoming/' + currentCallId).set({
        from: currentUser.uid, fromName: currentUserData.name, type: callType,
        offer: {type: 'offer', sdp: pc.localDescription.sdp}, timestamp: Date.now()
      });
      db.ref('calls_signaling/' + currentUser.uid + '/active/' + currentCallId).on('value', function(snap){
        var data = snap.val();
        if(!data) return;
        if(data.answer && pc && pc.signalingState !== 'stable'){
          pc.setRemoteDescription(new RTCSessionDescription(data.answer)).then(function(){ onCallConnected(); });
        }
        if(data.ended) endCallCleanup();
      });
      db.ref('calls_signaling/' + currentUser.uid + '/active/' + currentCallId + '/receiverCandidates').on('child_added', function(snap){
        var c = snap.val();
        if(c && pc) pc.addIceCandidate(new RTCIceCandidate(c));
      });
    });
  }).catch(function(){ alert('لا يمكن الوصول للكاميرا/الميكروفون'); });
}
function listenIncomingCalls(){
  if(unsubIncomingCalls) unsubIncomingCalls();
  unsubIncomingCalls = db.ref('calls_signaling/' + currentUser.uid + '/incoming').on('child_added', function(snap){
    var data = snap.val();
    if(!data) return;
    if(Date.now() - data.timestamp > 30000){ db.ref('calls_signaling/' + currentUser.uid + '/incoming/' + snap.key).remove(); return; }
    if(window.currentIncomingCallId) return;
    window.currentIncomingCallId = snap.key;
    window.currentIncomingData = data;
    $('incomingCallerName').textContent = data.fromName;
    $('incomingCallType').textContent = data.type === 'video' ? 'مكالمة فيديو واردة' : 'مكالمة صوتية واردة';
    addClass($('incomingCallModal'), 'active');
  });
}
function acceptCall(){
  removeClass($('incomingCallModal'), 'active');
  var callId = window.currentIncomingCallId;
  var data = window.currentIncomingData;
  if(!callId || !data) return;
  callType = data.type;
  currentCallId = callId;
  currentChatUser = {uid: data.from, name: data.fromName};
  navigator.mediaDevices.getUserMedia({audio: true, video: callType === 'video'}).then(function(stream){
    localStream = stream;
    showCallScreen();
    $('callName').textContent = data.fromName;
    pc = new RTCPeerConnection(rtcConfig);
    var tracks = stream.getTracks();
    for(var i = 0; i < tracks.length; i++) pc.addTrack(tracks[i], stream);
    pc.onicecandidate = function(e){
      if(e.candidate) db.ref('calls_signaling/' + data.from + '/active/' + callId + '/receiverCandidates').push(e.candidate.toJSON());
    };
    pc.ontrack = function(e){
      if(callType === 'video') $('remoteVideo').srcObject = e.streams[0];
      else { window.remoteAudio = new Audio(); window.remoteAudio.srcObject = e.streams[0]; window.remoteAudio.play(); }
      onCallConnected();
    };
    pc.setRemoteDescription(new RTCSessionDescription(data.offer)).then(function(){
      return pc.createAnswer();
    }).then(function(answer){
      return pc.setLocalDescription(answer);
    }).then(function(){
      db.ref('calls_signaling/' + data.from + '/active/' + callId).update({ answer: {type: 'answer', sdp: pc.localDescription.sdp} });
      db.ref('calls_signaling/' + currentUser.uid + '/incoming/' + callId).remove();
    });
  }).catch(function(){ alert('لا يمكن الوصول للكاميرا'); });
}
function rejectCall(){
  var callId = window.currentIncomingCallId;
  var data = window.currentIncomingData;
  if(callId && data){
    db.ref('calls_signaling/' + data.from + '/active/' + callId).update({ended: true});
    db.ref('calls_signaling/' + currentUser.uid + '/incoming/' + callId).remove();
  }
  removeClass($('incomingCallModal'), 'active');
  window.currentIncomingCallId = null;
  window.currentIncomingData = null;
}
function onCallConnected(){
  if(callTimerInterval) return;
  $('callStatus').textContent = 'متصل';
  callStartTime = Date.now();
  callTimerInterval = setInterval(function(){
    var secs = Math.floor((Date.now() - callStartTime) / 1000);
    $('callTimer').textContent = formatDuration(secs);
  }, 1000);
}
function showCallScreen(){
  var initial = (currentChatUser.name || 'U').charAt(0).toUpperCase();
  $('callAvatar').innerHTML = currentChatUser.photoURL ? '<img src="' + currentChatUser.photoURL + '">' : initial;
  $('callName').textContent = currentChatUser.name;
  $('callTimer').textContent = '';
  addClass($('callScreen'), 'active');
}
function endCallHandler(){
  if(currentCallId && currentChatUser) db.ref('calls_signaling/' + currentChatUser.uid + '/active/' + currentCallId).update({ended: true});
  endCallCleanup();
}
function endCallCleanup(){
  if(callTimerInterval){ clearInterval(callTimerInterval); callTimerInterval = null; }
  if(pc){ try { pc.close(); } catch(e){} pc = null; }
  if(localStream){
    var tracks = localStream.getTracks();
    for(var i = 0; i < tracks.length; i++) tracks[i].stop();
    localStream = null;
  }
  removeClass($('callScreen'), 'active');
  removeClass($('callScreen'), 'video-call');
  currentCallId = null; callType = null; callStartTime = 0;
  window.currentIncomingCallId = null;
  window.currentIncomingData = null;
}
function toggleMuteCallHandler(e){
  if(!localStream) return;
  var t = localStream.getAudioTracks()[0];
  if(t){ t.enabled = !t.enabled; toggleClass(e.currentTarget, 'active', !t.enabled); }
}

/* ============ الإشعارات ============ */
function requestNotificationPermission(){
  if(!('Notification' in window)){
    alert('متصفحك لا يدعم الإشعارات');
    return;
  }
  if(Notification.permission === 'granted'){
    alert('✅ الإشعارات مفعّلة بالفعل');
    return;
  }
  Notification.requestPermission().then(function(perm){
    if(perm === 'granted'){
      alert('✅ تم تفعيل الإشعارات');
      try { new Notification('Chat Pro', { body: 'الإشعارات مفعّلة ✅' }); } catch(e){}
    } else {
      alert('❌ تم رفض الإشعارات');
    }
  });
}
function showNotification(title, body){
  if(!('Notification' in window)) return;
  if(Notification.permission !== 'granted') return;
  if(document.visibilityState === 'visible') return;
  try {
    new Notification(title, { body: body, icon: currentUserData ? currentUserData.photoURL : undefined });
  } catch(e){}
}
function playNotifSound(){
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 600;
    gain.gain.value = 0.1;
    osc.start();
    osc.frequency.setValueAtTime(800, ctx.currentTime + 0.1);
    setTimeout(function(){ try { osc.stop(); } catch(e){} }, 300);
  } catch(e){}
}
function updateHeaderBadge(){
  $('headerBadge').textContent = headerNotifCount;
  $('headerBadge').style.display = headerNotifCount > 0 ? 'block' : 'none';
}

/* ============ أدوات ============ */
function markAllAsRead(){
  if(!currentUser) return;
  db.ref('userChats/' + currentUser.uid).once('value').then(function(snap){
    var chats = snap.val() || {};
    var keys = Object.keys(chats);
    for(var i = 0; i < keys.length; i++){
      var chatId = getChatId(currentUser.uid, keys[i]);
      db.ref('chats/' + chatId + '/unread/' + currentUser.uid).set(0);
    }
  });
}
function logout(){
  if(!confirm('تسجيل الخروج؟')) return;
  db.ref('onlineUsers/' + currentUser.uid).remove();
  auth.signOut().then(function(){ location.reload(); });
}
function formatTime(d){
  var h = d.getHours(), m = d.getMinutes();
  var p = h >= 12 ? 'م' : 'ص';
  h = h % 12 || 12;
  var mm = m < 10 ? '0' + m : m;
  return h + ':' + mm + ' ' + p;
}
function formatTimeShort(d){
  var now = new Date();
  if(now.toDateString() === d.toDateString()) return formatTime(d);
  return d.getDate() + '/' + (d.getMonth()+1);
}
function formatDate(d){
  var t = new Date(), y = new Date(); y.setDate(t.getDate()-1);
  if(d.toDateString() === t.toDateString()) return 'اليوم';
  if(d.toDateString() === y.toDateString()) return 'أمس';
  return d.getDate() + '/' + (d.getMonth()+1) + '/' + d.getFullYear();
}
function formatDuration(secs){
  var m = Math.floor(secs / 60);
  var s = secs % 60;
  return m + ':' + (s < 10 ? '0' + s : s);
}

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e91e63">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta http-equiv="Content-Security-Policy" content="default-src 'self';script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com https://cdnjs.cloudflare.com;style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com;font-src https://fonts.gstatic.com https://cdnjs.cloudflare.com;img-src 'self' data: blob: https:;connect-src https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebasedatabase.app wss://*.firebasedatabase.app https://*.firebaseapp.com;frame-src https://*.firebaseapp.com https://*.google.com;manifest-src 'self' blob: data:;object-src 'none';base-uri 'none';form-action 'self'">
<title>متجر يزيد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script>if(window.top!==window.self){try{window.top.location.href=location.href}catch(e){document.documentElement.innerHTML=''}}try{var t=JSON.parse(localStorage.getItem('yz_theme')||'null')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme='light'}</script>
<style>
:root{--p:#e91e63;--p2:#f06292;--ac:#f59e0b;--bg:#fff5f8;--card:#fff;--tx:#2a1620;--mt:#8a6b78;--bd:#f6d9e3;--sh:0 6px 22px rgba(233,30,99,.1);--ok:#16a34a;--er:#dc2626;--r:18px;--sbw:76px}
[data-theme=dark]{--bg:#150c11;--card:#22141c;--tx:#fbeaf1;--mt:#b793a3;--bd:#3b2331;--sh:0 6px 22px rgba(0,0,0,.45)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:Cairo,Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;min-height:100dvh;line-height:1.6;overflow-x:hidden;transition:background .3s,color .3s}
body.lock{overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:15px;color:inherit}
button{cursor:pointer;border:0;background:none}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none;cursor:pointer}
.hide{display:none!important}
:focus-visible{outline:2px solid var(--p);outline-offset:2px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes slide{from{transform:translateX(100%)}to{transform:none}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes shim{to{background-position:-200% 0}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.4)}30%{transform:scale(1)}45%{transform:scale(1.3)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.55)}100%{transform:scale(1)}}
.hd{position:sticky;top:0;z-index:50;padding-top:env(safe-area-inset-top);background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--bd)}
.hdi{max-width:1280px;margin:auto;display:flex;align-items:center;gap:8px;padding:10px 12px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--p);min-width:0}
.brand img{width:36px;height:36px;border-radius:10px;object-fit:cover;flex:none}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100px}
.hs{display:none;flex:1;max-width:480px;margin-inline:auto;position:relative}
.hs i,.sm i{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:var(--mt)}
.hs input,.sm input{width:100%;padding:10px 14px;padding-inline-start:40px;border-radius:99px;border:1.5px solid var(--bd);background:var(--card);outline:0}
.hs input:focus,.sm input:focus{border-color:var(--p)}
.hact{display:flex;gap:6px;align-items:center;margin-inline-start:auto}
.ib{position:relative;width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;background:var(--card);border:1px solid var(--bd);flex:none;transition:.2s}
.ib:hover{color:var(--p);border-color:var(--p)}
.ib:active{transform:scale(.93)}
.bg{position:absolute;top:-4px;inset-inline-end:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--p);color:#fff;font:700 11px/18px Cairo,sans-serif;text-align:center;font-style:normal}
.bg.pulse{animation:pulse .6s}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:14px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-weight:700;box-shadow:0 6px 16px color-mix(in srgb,var(--p) 30%,transparent);transition:.2s;text-align:center}
.btn:active{transform:scale(.97)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.btn.gh{background:var(--card);color:var(--p);border:1px solid var(--bd);box-shadow:none}
.btn.dg{background:var(--er);box-shadow:none}
.btn.ok{background:var(--ok);box-shadow:none}
.btn[disabled]{opacity:.5;pointer-events:none}
#main{max-width:1280px;margin:auto;padding:14px 12px 10px;min-height:60vh}
#foot{max-width:1280px;margin:0 auto;padding:0 12px calc(96px + env(safe-area-inset-bottom))}
.fi{border-top:1px solid var(--bd);padding-top:16px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.fl{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;font-weight:600;color:var(--mt)}
.fl a:hover{color:var(--p)}
.fs{display:flex;gap:10px}
.fs a{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--bd);color:var(--p)}
.fi small{color:var(--mt)}
.ph2{font-size:20px;font-weight:800;margin:6px 0 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cnt{background:var(--p);color:#fff;padding:2px 10px;border-radius:99px;font-size:13px}
.hero{display:grid;gap:16px;align-items:center;background:linear-gradient(135deg,var(--p),var(--p2) 62%,var(--ac));border-radius:26px;padding:24px;color:#fff;margin-bottom:16px;animation:up .5s both}
.hero h1{font-size:clamp(22px,4vw,38px);font-weight:800;line-height:1.4;margin-bottom:8px}
.hero p{opacity:.92;margin-bottom:14px}
.hero .btn{background:#fff;color:var(--p);box-shadow:0 6px 16px rgba(0,0,0,.18)}
.heroim,.hph{width:100%;aspect-ratio:16/10;max-height:280px;border-radius:20px;overflow:hidden;background:rgba(255,255,255,.18)}
.heroim img{width:100%;height:100%;object-fit:cover}
.hph{display:grid;place-items:center;font-size:64px}
.sm{position:relative;margin-bottom:12px}
.sw2{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.sw2 label{font-size:13px;color:var(--mt);font-weight:600}
.sw2 select,.sw2 input{padding:9px 12px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card);outline:0;font-size:13px;font-weight:600}
.sw2 input[type=number]{width:90px;text-align:center}
.sw2 select{flex:1;min-width:130px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:8px 16px;border-radius:99px;background:var(--card);border:1px solid var(--bd);white-space:nowrap;font-weight:600;transition:.2s}
.chip.on{background:var(--p);color:#fff;border-color:var(--p)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.rs{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none}
.rs::-webkit-scrollbar{display:none}
.rs .card{min-width:160px;max-width:160px;flex:none}
.card{background:var(--card);border-radius:var(--r);overflow:hidden;border:1px solid var(--bd);box-shadow:var(--sh);cursor:pointer;display:flex;flex-direction:column;animation:pop .4s both;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--p) 40%,var(--bd))}
.im{position:relative;aspect-ratio:1;background:linear-gradient(135deg,color-mix(in srgb,var(--p) 14%,var(--card)),var(--card));display:grid;place-items:center;font-size:38px;color:var(--p2);overflow:hidden}
.im img{width:100%;height:100%;object-fit:cover;transition:filter .7s ease,transform .7s ease}
.im img.loading,.heroim img.loading,.sg-it img.loading{filter:blur(22px);transform:scale(1.12)}
.card:hover .im img:not(.loading){transform:scale(1.05)}
.bds{position:absolute;top:8px;inset-inline-start:8px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.bd{display:inline-block;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:700;color:#fff;background:var(--ok)}
.bd.out{background:var(--er)}
.bd.ds{background:linear-gradient(135deg,#ef4444,#f59e0b)}
.bd.lw{background:#f59e0b}
.hrt{position:absolute;top:8px;inset-inline-end:8px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.95);color:#999;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.hrt.on{color:var(--p)}
.hrt.on i{animation:beat .5s}
.inf{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.inf h3{font-size:14px;line-height:1.4;min-height:39px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.pr b{color:var(--p);font-size:16px;font-weight:800}
.pr s{color:var(--mt);font-size:12px}
.pr.big b{font-size:24px}
.inf .btn{margin-top:auto;width:100%}
.sk{background:linear-gradient(90deg,var(--card),var(--bd),var(--card));background-size:200% 100%;animation:shim 1.2s infinite;border-radius:var(--r);aspect-ratio:3/4}
.empty{grid-column:1/-1;text-align:center;padding:44px 16px;color:var(--mt);background:var(--card);border-radius:var(--r);border:1px dashed var(--bd)}
.empty i{font-size:44px;color:var(--p2);display:block;margin-bottom:8px}
.empty h3{color:var(--tx);margin-bottom:6px;font-size:16px}
.empty .btn{margin-top:12px}
.bnav{position:fixed;inset-inline:0;bottom:0;z-index:60;display:flex;justify-content:center;padding:0 10px calc(10px + env(safe-area-inset-bottom));pointer-events:none}
.bni{pointer-events:auto;display:flex;width:100%;max-width:520px;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding:6px;gap:2px}
.nb{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px;border-radius:18px;color:var(--mt);font-size:11px;font-weight:600;transition:.2s}
.nb span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb i{font-size:18px}
.nb.on{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}
#toasts{position:fixed;top:calc(12px + env(safe-area-inset-top));inset-inline:0;z-index:900;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 10px}
.toast{background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:up .3s both;max-width:92vw;pointer-events:auto;display:flex;align-items:center;gap:8px}
.toast button{opacity:.7;padding:2px 4px;color:inherit}
.toast.ok{background:var(--ok);color:#fff}
.toast.err{background:var(--er);color:#fff}
.npop{pointer-events:auto;width:min(420px,92vw);background:var(--card);border:1.5px solid var(--p);border-radius:16px;padding:12px 14px;box-shadow:var(--sh);display:flex;gap:10px;cursor:pointer;animation:pop .35s both}
.npop p{color:var(--mt);font-size:13px;margin:2px 0}
.ov{position:fixed;inset:0;z-index:300;background:rgba(20,5,12,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:14px;animation:fade .2s both}
.ov.d{justify-content:flex-start;padding:0}
.dr{width:min(440px,100vw);height:100%;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);box-shadow:-8px 0 40px rgba(0,0,0,.2);animation:slide .3s both}
.md{width:min(560px,100%);max-height:92vh;overflow:auto;background:var(--card);border-radius:24px;padding:22px;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.3);animation:pop .25s both;-webkit-overflow-scrolling:touch}
.md.w{width:min(820px,100%)}
.dh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--bd);font-weight:800;font-size:17px;flex-shrink:0}
.db{flex:1;overflow:auto;padding:14px 16px;-webkit-overflow-scrolling:touch}
.df{padding:14px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--bd);background:var(--card);flex-shrink:0}
.x{position:absolute;top:12px;inset-inline-start:12px;width:36px;height:36px;border-radius:50%;background:var(--bg);display:grid;place-items:center;z-index:2}
.x:hover{background:var(--er);color:#fff}
.mt{margin:26px 0 14px;font-size:19px;font-weight:800}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}
.fld>label{font-size:13px;font-weight:700;color:var(--mt)}
.in,.fld input,.fld select,.fld textarea{width:100%;padding:10px 14px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card);outline:0;transition:.2s}
.in:focus,.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px color-mix(in srgb,var(--p) 15%,transparent)}
.fld textarea{min-height:90px;resize:vertical}
.fld input[type=color]{padding:3px;height:44px;cursor:pointer}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.chk{display:flex;align-items:center;gap:8px;font-weight:600;padding:8px 0;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--p)}
.ci{display:flex;gap:10px;padding:10px;background:var(--card);border:1px solid var(--bd);border-radius:14px;margin-bottom:10px;align-items:center}
.ci .ph{width:64px;height:64px;border-radius:12px;overflow:hidden;flex:none;background:var(--bg);display:grid;place-items:center;color:var(--p2)}
.ci .ph img{width:100%;height:100%;object-fit:cover}
.qty{display:inline-flex;align-items:center;gap:10px;background:var(--bg);border-radius:99px;padding:2px;margin-top:4px}
.qty button{width:28px;height:28px;border-radius:50%;background:var(--card);border:1px solid var(--bd);font-weight:800}
.qty span{min-width:18px;text-align:center;font-weight:700}
.cpn{display:flex;gap:8px;margin:12px 0}
.cpn .in{flex:1}
.ctag{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-radius:12px;background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok);font-weight:700;margin:12px 0}
.sum div{display:flex;justify-content:space-between;padding:3px 0;font-size:14px}
.sum .t{font-weight:800;font-size:18px;color:var(--p);border-top:1px dashed var(--bd);margin-top:6px;padding-top:8px}
.pn{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.pn h3{margin-bottom:12px;font-size:16px}
.pl{display:flex;flex-direction:column;gap:10px}
.pav{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;display:grid;place-items:center;font-size:30px;font-weight:800;margin:0 auto 14px}
.oc{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.oh,.of{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.oh b{font-family:ui-monospace,monospace}
.ob{padding:8px 0;color:var(--mt);font-size:14px}
.ob p{margin:2px 0}
.ob i{color:var(--p2);width:16px}
.of{border-top:1px dashed var(--bd);padding-top:10px}
.tot{color:var(--p);font-size:17px}
.st{display:inline-flex;gap:6px;align-items:center;padding:3px 12px;border-radius:99px;font-size:12px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.timeline{margin:10px 0}
.tl-it{display:flex;gap:12px;position:relative;padding-bottom:18px}
.tl-it:last-child{padding-bottom:0}
.tl-it::before{content:'';position:absolute;inset-inline-start:13px;top:28px;bottom:0;width:2px;background:var(--bd)}
.tl-it:last-child::before{display:none}
.tl-it.done::before{background:var(--p)}
.tl-dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--bg);border:2px solid var(--bd);color:var(--mt);font-size:12px;position:relative;z-index:1}
.tl-it.done .tl-dot{background:var(--p);color:#fff;border-color:var(--p)}
.tl-it.current .tl-dot{animation:pulse 1.5s infinite}
.tl-body{padding-top:3px;font-size:14px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 8px;text-align:start;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mt);font-size:12px}
tr:last-child td{border-bottom:0}
.pm{display:grid;gap:16px;margin-top:28px}
.pi h2{font-size:20px;margin:4px 0 8px}
.cat{color:var(--p);font-weight:700;font-size:13px;display:inline-block;padding:3px 10px;background:color-mix(in srgb,var(--p) 12%,transparent);border-radius:99px;margin-bottom:8px}
.dsc{color:var(--mt);white-space:pre-line;margin:10px 0;line-height:1.8}
.pa{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.pa .btn{flex:1;min-width:140px}
.pa .ib{width:46px;height:46px}
.pa .ib.on{color:var(--p);border-color:var(--p)}
.stars{display:inline-flex;gap:2px;color:#f59e0b;font-size:14px}
.stars i.far,.stars i.fa-regular{color:var(--bd)}
.stars.int i{cursor:pointer;font-size:26px}
.rb{background:var(--bg);border-radius:var(--r);padding:16px;margin-top:16px}
.rb h3{font-size:15px;margin-bottom:12px}
.rsum{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.ravg{font-size:34px;font-weight:800;color:var(--p);line-height:1}
.review{padding:10px 0;border-bottom:1px solid var(--bd)}
.review:last-child{border:0}
.rh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.rh small{color:var(--mt)}
.review p{color:var(--mt);font-size:13px}
.ni{display:flex;gap:10px;padding:12px;background:var(--card);border:1px solid var(--bd);border-radius:14px;margin-bottom:10px;cursor:pointer;align-items:flex-start;position:relative}
.ni.un{border-inline-start:4px solid var(--p);background:color-mix(in srgb,var(--p) 6%,var(--card))}
.ni p{color:var(--mt);font-size:13px;margin:2px 0;word-break:break-word}
.ni small{color:var(--mt);font-size:11px}
.nt{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;color:#fff;background:var(--mt)}
.nt.promo{background:var(--ac)}
.nt.order{background:var(--p)}
.nt.system{background:#2563eb}
.tabs{display:flex;background:var(--bg);border-radius:14px;padding:4px;margin:12px 0}
.tabs button{flex:1;padding:9px;border-radius:11px;font-weight:700;color:var(--mt)}
.tabs .on{background:var(--card);color:var(--p);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.ah{text-align:center;padding-top:20px}
.ah img{width:60px;height:60px;border-radius:16px;margin:0 auto 8px;object-fit:cover}
.or{display:flex;align-items:center;gap:10px;color:var(--mt);margin:14px 0;font-size:13px}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--bd)}
.sw{text-align:center;margin-top:14px;color:var(--mt);font-size:14px}
.sw a{color:var(--p);font-weight:700}
details.pn summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:8px}

pe="checkbox" name="visible" ${p?.visible===false?'':'checked'}> ظاهر في المتجر</label></div><button class="btn" type="submit" style="width:100%;margin-top:12px"><i class="fa-solid fa-floppy-disk"></i> حفظ المنتج</button></form>`)},

cEdit:d=>{const c=d.id?S.coupons[d.id]:null;openOv('cm',`<button class="x" data-a="close" data-id="cm" aria-label="إغلاق"><i class="fa-solid fa-xmark"></i></button><h2 class="mt">${c?'تعديل كوبون':'إضافة كوبون'}</h2><form data-f="coupon"><div class="fld"><label>الكود</label><input name="code" required ${c?'readonly':''} value="${esc(d.id||'')}" style="text-transform:uppercase" maxlength="30"></div><div class="row"><div class="fld"><label>النوع</label><select name="type"><option value="percent" ${c?.type==='percent'?'selected':''}>نسبة مئوية %</option><option value="fixed" ${c?.type==='fixed'?'selected':''}>مبلغ ثابت</option></select></div><div class="fld"><label>القيمة</label><input name="value" type="number" min="1" step="any" required value="${c?.value??''}"></div></div><div class="row"><div class="fld"><label>الحد الأدنى للطلب</label><input name="min" type="number" min="0" step="any" value="${c?.min??0}"></div><div class="fld"><label>تاريخ الانتهاء (اختياري)</label><input name="expires" type="date" value="${c?.expires?new Date(c.expires).toISOString().slice(0,10):''}"></div></div><label class="chk"><input type="checkbox" name="active" ${c?.active===false?'':'checked'}> الكوبون نشط</label><button class="btn" type="submit" style="width:100%;margin-top:12px"><i class="fa-solid fa-floppy-disk"></i> حفظ</button></form>`)},

nvEdit:d=>{const n=d.id?navAll().find(x=>x.id===d.id):null,icons=['fa-house','fa-heart','fa-bag-shopping','fa-envelope','fa-user','fa-store','fa-tag','fa-fire','fa-star','fa-gift','fa-phone','fa-circle-info','fa-list','fa-percent','fa-bell','fa-gear'];S.mid=d.id||'';openOv('nm',`<button class="x" data-a="close" data-id="nm" aria-label="إغلاق"><i class="fa-solid fa-xmark"></i></button><h2 class="mt">${n?'تعديل زر':'إضافة زر'}</h2><form data-f="nav"><div class="fld"><label>الاسم</label><input name="label" required maxlength="14" value="${esc(n?.label||'')}"></div><div class="row"><div class="fld"><label>الأيقونة</label><input name="icon" list="icl" required value="${esc(n?.icon||'fa-star')}"><datalist id="icl">${icons.map(i=>`<option value="${i}">`).join('')}</datalist></div><div class="fld"><label>الترتيب</label><input name="order" type="number" value="${n?.order??navAll().length+1}"></div></div><div class="fld"><label>الرابط (صفحة أو رابط https خارجي)</label><input name="path" list="pgl" required maxlength="300" value="${esc(n?.path||'')}"><datalist id="pgl">${BUILTIN.map(i=>`<option value="${i}">`).join('')}</datalist></div><label class="chk"><input type="checkbox" name="enabled" ${n?.enabled===false?'':'checked'}> مفعّل</label><button class="btn" type="submit" style="width:100%;margin-top:12px"><i class="fa-solid fa-floppy-disk"></i> حفظ</button></form>`)},

reset:async d=>{const names={users:'جميع العملاء',products:'جميع المنتجات',orders:'جميع الطلبات',notifs:'جميع الإشعارات',all:'كل بيانات المتجر'};if(!await confirmBox('تأكيد الحذف','سيتم حذف '+names[d.k]+' نهائياً. هل تريد المتابعة؟','حذف نهائي'))return;if(!await confirmBox('تأكيد أخير','هذا الإجراء لا يمكن التراجع عنه!','نعم، احذف'))return;const delUsers=async()=>{await Promise.all(Object.keys(S.users).filter(id=>id!==S.user.uid).map(id=>remove(ref(db,'users/'+id))));await set(ref(db,'counters/users'),0)};try{if(d.k==='users')await delUsers();if(d.k==='products'||d.k==='all')await remove(ref(db,'products'));if(d.k==='orders'||d.k==='all')await remove(ref(db,'orders'));if(d.k==='notifs'||d.k==='all')await remove(ref(db,'notifications'));if(d.k==='all')await Promise.all([remove(ref(db,'messages')),remove(ref(db,'coupons')),remove(ref(db,'reviews')),remove(ref(db,'activity')),delUsers(),set(ref(db,'settings'),DEF),set(ref(db,'nav'),DEF_NAV)]);toast('تمت العملية بنجاح','ok');logActivity('إعادة ضبط',names[d.k])}catch{toast('تعذر تنفيذ العملية','err')}},

const F={
login:async f=>{if(!canTry())return toast('محاولات كثيرة، انتظر 15 دقيقة','err');const fd=new FormData(f),b=$('[type=submit]',f);b.disabled=true;try{await signInWithEmailAndPassword(auth,clean(fd.get('email'),100),String(fd.get('password')));ls.set('yz_att',{n:0,t:0})}catch(e){failTry();toast(authErr(e.code),'err')}b.disabled=false},
register:async f=>{const fd=new FormData(f),b=$('[type=submit]',f),email=clean(fd.get('email'),100).toLowerCase(),pw=String(fd.get('password'));if(email===ADMIN_EMAIL)return toast('هذا البريد غير متاح','err');if(pw.length<8)return toast('كلمة المرور 8 أحرف على الأقل','err');b.disabled=true;S.pending={name:clean(fd.get('name'),60),phone:clean(fd.get('phone'),20)};try{await createUserWithEmailAndPassword(auth,email,pw)}catch(e){S.pending=null;toast(authErr(e.code),'err')}b.disabled=false},
admin:async f=>{if(!canTry())return toast('محاولات كثيرة، انتظر 15 دقيقة','err');const fd=new FormData(f),b=$('[type=submit]',f);if(clean(fd.get('username'),30)!==ADMIN_USER){failTry();return toast('بيانات الأدمن غير صحيحة','err')}b.disabled=true;try{await signInWithEmailAndPassword(auth,ADMIN_EMAIL,String(fd.get('password')));ls.set('yz_att',{n:0,t:0})}catch(e){failTry();toast(e.code==='auth/network-request-failed'?authErr(e.code):'بيانات الأدمن غير صحيحة','err')}b.disabled=false},
contact:async f=>{const fd=new FormData(f),b=$('[type=submit]',f);if(Date.now()-ls.get('yz_msg',0)<3e4)return toast('انتظر قليلاً قبل إرسال رسالة أخرى','err');b.disabled=true;try{const name=clean(fd.get('name'),60);await set(push(ref(db,'messages')),{name,email:clean(fd.get('email'),100),phone:clean(fd.get('phone'),20),message:clean(fd.get('message'),1000),read:false,uid:S.user?.uid||'',createdAt:Date.now()});ls.set('yz_msg',Date.now());notifyAdmin('رسالة جديدة','رسالة جديدة من '+name,'system');f.reset();toast('تم إرسال رسالتك بنجاح','ok')}catch{toast('تعذر إرسال الرسالة','err')}b.disabled=false},
profile:async f=>{const fd=new FormData(f),d={name:clean(fd.get('name'),60),phone:clean(fd.get('phone'),20),address:clean(fd.get('address'),300)};if(!d.name)return toast('الاسم مطلوب','err');try{await update(ref(db,'users/'+S.user.uid),d);S.profile={...S.profile,...d};drawHeader();toast('تم حفظ البيانات','ok')}catch{toast('تعذر الحفظ، حاول مرة أخرى','err')}},
product:async f=>{const fd=new FormData(f),price=num(fd.get('price')),qty=Math.floor(num(fd.get('qty'))),name=clean(fd.get('name'),100);if(!name)return toast('تحقق من البيانات المدخلة','err');const old=S.eid?S.products[S.eid]:null,image=S.up.pimg!==undefined?S.up.pimg:(old?.image||'');const data={name,price,discount:num(fd.get('discount'),0,100),qty,category:clean(fd.get('category'),40),description:clean(fd.get('description'),3000),image:img(image)?image:'',stock:fd.has('stock'),visible:fd.has('visible'),updatedAt:Date.now(),createdAt:old?.createdAt||Date.now()};await set(S.eid?ref(db,'products/'+S.eid):push(ref(db,'products')),data);closeOv('pm');toast('تم حفظ المنتج','ok');logActivity(S.eid?'تعديل منتج':'إضافة منتج',name)},
coupon:async f=>{const fd=new FormData(f),code=clean(fd.get('code'),30).toUpperCase().replace(/[.#$\[\]\/\s]/g,''),value=num(fd.get('value')),type=fd.get('type')==='percent'?'percent':'fixed';if(!code||!(value>0))return toast('تحقق من البيانات','err');if(type==='percent'&&value>100)return toast('النسبة لا تتجاوز 100','err');const ex=fd.get('expires'),d={type,value,min:num(fd.get('min')),active:fd.has('active')};if(ex){const t=new Date(ex+'T23:59:59').getTime();if(Number.isFinite(t))d.expires=t}await set(ref(db,'coupons/'+code),d);closeOv('cm');toast('تم حفظ الكوبون','ok');logActivity('حفظ كوبون',code)},

settings:async f=>{const fd=new FormData(f),ok=c=>/^#[0-9a-f]{6}$/i.test(c),d={storeName:clean(fd.get('storeName'),40),heroTitle:clean(fd.get('heroTitle'),100),heroSubtitle:clean(fd.get('heroSubtitle'),150),primary:ok(fd.get('primary'))?fd.get('primary'):DEF.primary,primary2:ok(fd.get('primary2'))?fd.get('primary2'):DEF.primary2,accent:ok(fd.get('accent'))?fd.get('accent'):DEF.accent,phone:clean(fd.get('phone'),20),email:clean(fd.get('email'),100),address:clean(fd.get('address'),200),facebook:safeUrl(clean(fd.get('facebook'),200)),instagram:safeUrl(clean(fd.get('instagram'),200)),whatsapp:clean(fd.get('whatsapp'),20),currency:clean(fd.get('currency'),10)||'ج.م',shipFee:num(fd.get('shipFee')),freeFrom:num(fd.get('freeFrom')),maxUsers:Math.floor(num(fd.get('maxUsers'))),footerText:clean(fd.get('footerText'),150)};if(!d.storeName)return toast('اسم المتجر مطلوب','err');if(S.up.logo!==undefined)d.logo=S.up.logo;if(S.up.storeImage!==undefined)d.storeImage=S.up.storeImage;await update(ref(db,'settings'),d);S.up={};toast('تم حفظ الإعدادات','ok');logActivity('تحديث الإعدادات')},

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">
<meta name="theme-color" content="#e91e63">
<meta name="description" content="متجر يزيد - متجرك الإلكتروني الأول">
<title>متجر يزيد</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--primary:#e91e63;
--primary2:#f06292;
--accent:#f59e0b;
--bg:#f8f9fb;
--card:#ffffff;
--text:#1a1a2e;
--text2:#6b7280;
--border:#e5e7eb;
--shadow:0 4px 20px rgba(0,0,0,0.06);
--shadow2:0 8px 30px rgba(233,30,99,0.15);
--radius:16px;
--safe-top:env(safe-area-inset-top,0px);
--safe-bottom:env(safe-area-inset-bottom,0px);
}
[data-theme="dark"]{
--bg:#0f0f1a;
--card:#1a1a2e;
--text:#f1f5f9;
--text2:#94a3b8;
--border:#2a2a3e;
--shadow:0 4px 20px rgba(0,0,0,0.4);
}
html,body{height:100%}
body{
font-family:'Cairo',sans-serif;
background:var(--bg);
color:var(--text);
overflow-x:hidden;
transition:background .3s,color .3s;
padding-bottom:calc(70px + var(--safe-bottom));
-webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none;background:none}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
img{max-width:100%;display:block}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--primary);border-radius:10px}
::-webkit-scrollbar-track{background:transparent}

@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{0%{transform:scale(0.8);opacity:0}60%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
@keyframes badgePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

.fadeUp{animation:fadeUp .5s ease both}
.popIn{animation:popIn .4s cubic-bezier(.34,1.56,.64,1) both}

.header{
position:sticky;top:0;z-index:100;
background:rgba(255,255,255,0.85);
backdrop-filter:blur(20px);
-webkit-backdrop-filter:blur(20px);
border-bottom:1px solid var(--border);
padding:calc(12px + var(--safe-top)) 16px 12px;
transition:background .3s;
}
[data-theme="dark"] .header{background:rgba(15,15,26,0.85)}
.header-inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.15rem;color:var(--primary);flex-shrink:0}
.logo img{width:36px;height:36px;border-radius:10px}
.search-box{
flex:1;max-width:400px;margin:0 auto;position:relative;display:none;
}
@media(min-width:900px){.search-box{display:block}}
.search-box input{
width:100%;padding:10px 40px 10px 16px;
background:var(--bg);border:1px solid var(--border);
border-radius:12px;font-size:.9rem;transition:.2s;
}
.search-box input:focus{border-color:var(--primary);background:var(--card)}
.search-box i{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--text2)}
.header-actions{display:flex;align-items:center;gap:6px;margin-right:auto}
.icon-btn{
width:42px;height:42px;border-radius:12px;
display:flex;align-items:center;justify-content:center;
background:var(--bg);color:var(--text);
position:relative;transition:.2s;font-size:1.05rem;
}
.icon-btn:active{transform:scale(0.92)}
.icon-btn:hover{background:var(--primary);color:#fff}
.badge{
position:absolute;top:-4px;left:-4px;
min-width:20px;height:20px;padding:0 5px;
background:var(--accent);color:#fff;
border-radius:10px;font-size:.7rem;font-weight:700;
display:flex;align-items:center;justify-content:center;
animation:badgePulse 1s infinite;
}
.badge.pink{background:var(--primary)}

.hero{
max-width:1400px;margin:16px auto;padding:0 16px;
}
.hero-inner{
position:relative;
border-radius:24px;overflow:hidden;
background:linear-gradient(135deg,var(--primary) 0%,var(--primary2) 100%);
padding:40px 24px;color:#fff;
min-height:200px;
display:flex;flex-direction:column;justify-content:center;
box-shadow:var(--shadow2);
}
.hero-inner::before{
content:'';position:absolute;top:-50%;left:-20%;
width:300px;height:300px;border-radius:50%;
background:rgba(255,255,255,0.1);
}
.hero-inner::after{
content:'';position:absolute;bottom:-50%;right:-10%;
width:250px;height:250px;border-radius:50%;
background:rgba(255,255,255,0.08);
}
.hero h1{font-size:1.8rem;font-weight:800;margin-bottom:8px;position:relative;z-index:2;animation:fadeUp .6s both}
.hero p{font-size:1rem;opacity:.95;position:relative;z-index:2;animation:fadeUp .8s both}
.hero img{position:absolute;left:20px;bottom:0;height:80%;object-fit:contain;z-index:1;opacity:.95}
@media(max-width:600px){.hero img{display:none}.hero h1{font-size:1.4rem}}

.categories{
max-width:1400px;margin:20px auto;padding:0 16px;
display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
}
.categories::-webkit-scrollbar{display:none}
.cat-chip{
padding:8px 18px;border-radius:999px;
background:var(--card);border:1.5px solid var(--border);
font-size:.85rem;font-weight:600;white-space:nowrap;
transition:.2s;flex-shrink:0;
}
.cat-chip.active{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:var(--shadow2)}
.cat-chip:active{transform:scale(0.95)}

.products-grid{
max-width:1400px;margin:0 auto;padding:0 16px 100px;
display:grid;gap:14px;
grid-template-columns:repeat(2,1fr);
}
@media(min-width:600px){.products-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.products-grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1200px){.products-grid{grid-template-columns:repeat(5,1fr)}}
@media(min-width:1500px){.products-grid{grid-template-columns:repeat(6,1fr)}}

.product-card{
background:var(--card);border-radius:var(--radius);
overflow:hidden;box-shadow:var(--shadow);
position:relative;transition:.3s;animation:fadeUp .4s both;
display:flex;flex-direction:column;
}
.product-card:active{transform:scale(0.98)}
.product-img{
width:100%;aspect-ratio:1;object-fit:cover;
background:var(--bg);position:relative;
}
.product-img img{width:100%;height:100%;object-fit:cover}
.product-img .placeholder{
width:100%;height:100%;display:flex;align-items:center;justify-content:center;
background:linear-gradient(135deg,#fce4ec,#f8bbd0);color:#fff;font-size:2rem;
}
.product-badge{
position:absolute;top:8px;right:8px;
padding:4px 10px;border-radius:8px;
font-size:.7rem;font-weight:700;color:#fff;
background:var(--accent);
}
.product-badge.out{background:#ef4444}
.product-badge.discount{background:var(--primary)}
.fav-btn{
position:absolute;top:8px;left:8px;
width:34px;height:34px;border-radius:50%;
background:rgba(255,255,255,0.95);
color:#9ca3af;display:flex;align-items:center;justify-content:center;
transition:.2s;font-size:.9rem;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}
.fav-btn.active{color:var(--primary);background:#fff}
.fav-btn:active{transform:scale(0.85)}
.product-info{padding:10px;flex:1;display:flex;flex-direction:column;gap:6px}
.product-name{font-size:.85rem;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.2em}
.product-price{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:auto}
.price-now{font-size:1rem;font-weight:800;color:var(--primary)}
.price-old{font-size:.75rem;color:var(--text2);text-decoration:line-through}
.add-btn{
width:100%;padding:8px;border-radius:10px;
background:var(--primary);color:#fff;
font-weight:700;font-size:.8rem;
display:flex;align-items:center;justify-content:center;gap:5px;
transition:.2s;
}
.add-btn:active{transform:scale(0.96)}
.add-btn:disabled{background:var(--text2);opacity:.5}

.bottom-nav{
position:fixed;bottom:0;left:0;right:0;z-index:100;
background:rgba(255,255,255,0.95);
backdrop-filter:blur(20px);
-webkit-backdrop-filter:blur(20px);
border-top:1px solid var(--border);
padding:8px 8px calc(8px + var(--safe-bottom));
display:flex;align-items:center;justify-content:space-around;
box-shadow:0 -4px 20px rgba(0,0,0,0.05);
}
[data-theme="dark"] .bottom-nav{background:rgba(15,15,26,0.95)}
.nav-item{
display:flex;flex-direction:column;align-items:center;gap:3px;
padding:6px 12px;border-radius:12px;
color:var(--text2);font-size:.7rem;font-weight:600;
transition:.2s;flex:1;max-width:90px;
}
.nav-item i{font-size:1.15rem}
.nav-item.active{color:var(--primary);background:rgba(233,30,99,0.08)}
.nav-item:active{transform:scale(0.92)}

.drawer{
position:fixed;top:0;bottom:0;right:0;
width:100%;max-width:420px;
background:var(--card);z-index:200;
transform:translateX(100%);
transition:transform .3s cubic-bezier(.4,0,.2,1);
display:flex;flex-direction:column;
box-shadow:-10px 0 40px rgba(0,0,0,0.2);
}
.drawer.open{transform:translateX(0)}
.drawer-header{
padding:calc(16px + var(--safe-top)) 16px 16px;
border-bottom:1px solid var(--border);
display:flex;align-items:center;justify-content:space-between;
}
.drawer-header h3{font-size:1.1rem;font-weight:800}
.drawer-body{flex:1;overflow-y:auto;padding:12px}
.drawer-footer{padding:16px;border-top:1px solid var(--border);padding-bottom:calc(16px + var(--safe-bottom))}
.overlay{
position:fixed;inset:0;background:rgba(0,0,0,0.5);
z-index:150;opacity:0;visibility:hidden;
transition:.3s;backdrop-filter:blur(4px);
}
.overlay.open{opacity:1;visibility:visible}

.cart-item{
display:flex;gap:10px;padding:10px;
background:var(--bg);border-radius:12px;margin-bottom:8px;
animation:fadeUp .3s both;
}
.cart-item img{width:70px;height:70px;border-radius:10px;object-fit:cover;background:var(--card)}
.cart-item-info{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.cart-item-info h4{font-size:.85rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cart-item-info .price{font-size:.9rem;font-weight:800;color:var(--primary)}
.qty-ctrl{display:flex;align-items:center;gap:6px;margin-top:4px}
.qty-btn{
width:26px;height:26px;border-radius:8px;
background:var(--card);border:1px solid var(--border);
display:flex;align-items:center;justify-content:center;
font-size:.75rem;transition:.2s;
}
.qty-btn:active{transform:scale(0.9);background:var(--primary);color:#fff}
.qty-num{min-width:26px;text-align:center;font-weight:700;font-size:.85rem}
.remove-btn{color:#ef4444;font-size:1rem;padding:4px;align-self:flex-start}

.empty-state{
padding:60px 20px;text-align:center;color:var(--text2);
}
.empty-state i{font-size:3rem;margin-bottom:16px;opacity:.4;display:block}
.empty-state p{font-size:.95rem}

.coupon-box{display:flex;gap:8px;margin-bottom:12px}
.coupon-box input{
flex:1;padding:10px 14px;border-radius:10px;
background:var(--bg);border:1.5px solid var(--border);
font-size:.85rem;
}
.coupon-box button{
padding:10px 18px;border-radius:10px;
background:var(--accent);color:#fff;font-weight:700;font-size:.85rem;
}
.cart-summary{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.summary-row{display:flex;justify-content:space-between;font-size:.9rem;color:var(--text2)}
.summary-row.total{font-size:1.1rem;font-weight:800;color:var(--text);padding-top:8px;border-top:1px dashed var(--border)}
.btn-primary{
width:100%;padding:14px;border-radius:14px;
background:linear-gradient(135deg,var(--primary),var(--primary2));
color:#fff;font-weight:800;font-size:.95rem;
box-shadow:0 6px 20px rgba(233,30,99,0.3);
transition:.2s;
}
.btn-primary:active{transform:scale(0.97)}
.btn-primary:disabled{opacity:.5}

.page{padding:20px 16px 100px;max-width:800px;margin:0 auto;animation:fadeUp .4s both}
.page-title{font-size:1.4rem;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.page-title i{color:var(--primary)}

.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:.85rem;font-weight:600;margin-bottom:6px;color:var(--text2)}
.form-group input,.form-group textarea,.form-group select{
width:100%;padding:12px 14px;border-radius:12px;
background:var(--card);border:1.5px solid var(--border);
font-size:.9rem;transition:.2s;
}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:var(--primary)}
.form-group textarea{min-height:100px;resize:vertical}

.order-card{
background:var(--card);border-radius:14px;padding:14px;
margin-bottom:10px;box-shadow:var(--shadow);
animation:fadeUp .3s both;
}
.order-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px}
.order-id{font-size:.8rem;color:var(--text2);font-weight:600}
.order-status{padding:4px 12px;border-radius:999px;font-size:.75rem;font-weight:700}
.status-pending{background:#fef3c7;color:#92400e}
.status-confirmed{background:#dbeafe;color:#1e40af}
.status-delivered{background:#d1fae5;color:#065f46}
.status-cancelled{background:#fee2e2;color:#991b1b}

.modal{
position:fixed;inset:0;z-index:300;
display:none;align-items:center;justify-content:center;
padding:16px;
}
.modal.open{display:flex}
.modal-content{
background:var(--card);border-radius:20px;
width:100%;max-width:500px;max-height:90vh;
overflow-y:auto;animation:popIn .3s both;
position:relative;
}
.modal-close{
position:absolute;top:12px;left:12px;z-index:2;
width:36px;height:36px;border-radius:50%;
background:rgba(0,0,0,0.5);color:#fff;
display:flex;align-items:center;justify-content:center;
}
.modal-img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:20px 20px 0 0}
.modal-body{padding:20px}

.auth-screen{
position:fixed;inset:0;z-index:500;
background:linear-gradient(135deg,var(--primary),var(--primary2));
display:flex;align-items:center;justify-content:center;
padding:20px;
}
.auth-box{
background:var(--card);border-radius:24px;
width:100%;max-width:420px;padding:30px;
box-shadow:0 20px 60px rgba(0,0,0,0.3);
animation:popIn .5s both;
max-height:90vh;overflow-y:auto;
}
.auth-logo{text-align:center;margin-bottom:24px}
.auth-logo img{width:80px;height:80px;margin:0 auto 12px;border-radius:20px}
.auth-logo h2{font-size:1.4rem;font-weight:800;color:var(--primary)}
.auth-tabs{display:flex;gap:8px;margin-bottom:20px;background:var(--bg);padding:4px;border-radius:12px}
.auth-tab{
flex:1;padding:10px;border-radius:10px;
font-weight:700;font-size:.85rem;color:var(--text2);
transition:.2s;
}
.auth-tab.active{background:var(--primary);color:#fff;box-shadow:var(--shadow2)}
.auth-form{display:flex;flex-direction:column;gap:12px}
.google-btn{
display:flex;align-items:center;justify-content:center;gap:10px;
padding:12px;border-radius:12px;
background:var(--bg);border:1.5px solid var(--border);
font-weight:700;font-size:.9rem;transition:.2s;
}
.google-btn:active{transform:scale(0.97)}
.divider{display:flex;align-items:center;gap:10px;color:var(--text2);font-size:.8rem;margin:4px 0}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}

.admin-layout{display:flex;min-height:100vh;padding-bottom:0}
.admin-sidebar{
width:260px;background:var(--card);
border-left:1px solid var(--border);
padding:16px;overflow-y:auto;
position:sticky;top:0;height:100vh;
display:none;
}
@media(min-width:900px){.admin-sidebar{display:block}}
.admin-sidebar .logo{margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.admin-menu{display:flex;flex-direction:column;gap:4px}
.admin-menu-item{
display:flex;align-items:center;gap:10px;
padding:11px 14px;border-radius:12px;
font-size:.88rem;font-weight:600;color:var(--text2);
transition:.2s;text-align:right;width:100%;
}
.admin-menu-item i{width:20px;text-align:center;font-size:1rem}
.admin-menu-item:hover{background:var(--bg);color:var(--text)}
.admin-menu-item.active{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;box-shadow:var(--shadow2)}
.admin-main{flex:1;padding:20px;max-width:100%;overflow-x:hidden}
.admin-header{
display:flex;align-items:center;justify-content:space-between;
margin-bottom:20px;flex-wrap:wrap;gap:12px;
}
.admin-header h1{font-size:1.4rem;font-weight:800}
.admin-mobile-nav{
display:flex;gap:6px;overflow-x:auto;padding:10px 0;
scrollbar-width:none;margin-bottom:12px;
}
.admin-mobile-nav::-webkit-scrollbar{display:none}
.admin-mobile-nav .admin-menu-item{width:auto;flex-shrink:0;padding:8px 14px;font-size:.8rem}
@media(min-width:900px){.admin-mobile-nav{display:none}}

.stats-grid{
display:grid;gap:12px;
grid-template-columns:repeat(2,1fr);
margin-bottom:20px;
}
@media(min-width:600px){.stats-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1000px){.stats-grid{grid-template-columns:repeat(5,1fr)}}
.stat-card{
background:var(--card);border-radius:16px;padding:16px;
box-shadow:var(--shadow);animation:fadeUp .4s both;
position:relative;overflow:hidden;
}
.stat-card::before{
content:'';position:absolute;top:0;right:0;
width:60px;height:60px;border-radius:50%;
background:linear-gradient(135deg,var(--primary),var(--primary2));
opacity:.1;transform:translate(20px,-20px);
}
.stat-card .icon{
width:40px;height:40px;border-radius:12px;
background:linear-gradient(135deg,var(--primary),var(--primary2));
color:#fff;display:flex;align-items:center;justify-content:center;
margin-bottom:10px;font-size:1rem;
}
.stat-card .value{font-size:1.5rem;font-weight:800;color:var(--text)}
.stat-card .label{font-size:.78rem;color:var(--text2);font-weight:600}

.table-wrap{
background:var(--card);border-radius:16px;
overflow:hidden;box-shadow:var(--shadow);margin-bottom:20px;
}
.table-wrap h3{padding:16px;font-size:1rem;font-weight:800;border-bottom:1px solid var(--border)}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{text-align:right;padding:12px;font-weight:700;color:var(--text2);background:var(--bg);font-size:.8rem;white-space:nowrap}
td{padding:12px;border-top:1px solid var(--border);white-space:nowrap}
tr:hover td{background:var(--bg)}

.admin-product-card{
background:var(--card);border-radius:14px;overflow:hidden;
box-shadow:var(--shadow);animation:fadeUp .3s both;
}
.admin-product-card img{width:100%;aspect-ratio:1;object-fit:cover;background:var(--bg)}
.admin-product-card .info{padding:10px}
.admin-product-card h4{font-size:.85rem;font-weight:700;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.admin-product-card .price{font-size:.9rem;font-weight:800;color:var(--primary);margin-bottom:8px}
.admin-product-card .actions{display:flex;gap:4px;flex-wrap:wrap}
.mini-btn{
flex:1;min-width:50px;padding:6px;border-radius:8px;
font-size:.7rem;font-weight:700;transition:.2s;
display:flex;align-items:center;justify-content:center;gap:3px;
}
.mini-btn:active{transform:scale(0.93)}
.mini-btn.edit{background:#dbeafe;color:#1e40af}
.mini-btn.del{background:#fee2e2;color:#991b1b}
.mini-btn.toggle{background:#fef3c7;color:#92400e}
.mini-btn.view{background:#d1fae5;color:#065f46}
[data-theme="dark"] .mini-btn.edit{background:#1e3a8a;color:#93c5fd}
[data-theme="dark"] .mini-btn.del{background:#7f1d1d;color:#fca5a5}
[data-theme="dark"] .mini-btn.toggle{background:#78350f;color:#fcd34d}

function toast(msg, type = "info") {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast " + type;
  t.classList.add("show");
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.classList.remove("show"), 3000);
}

function escapeHtml(s) {
  if (!s) return "";
  return String(s).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[m]);
}

function formatPrice(n) {
  return Number(n || 0).toLocaleString("ar-EG") + " ج.م";
}

function formatDate(ts) {
  if (!ts) return "";
  const d = new Date(ts);
  return d.toLocaleDateString("ar-EG", { year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
}

function saveLocal() {
  localStorage.setItem("yz_cart", JSON.stringify(state.cart));
  localStorage.setItem("yz_wishlist", JSON.stringify(state.wishlist));
  localStorage.setItem("yz_read_notifs", JSON.stringify(state.readNotifs));
}

function playNotifSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = "sine";
    o.frequency.setValueAtTime(880, ctx.currentTime);
    o.frequency.setValueAtTime(1100, ctx.currentTime + 0.1);
    o.frequency.setValueAtTime(1320, ctx.currentTime + 0.2);
    g.gain.setValueAtTime(0.15, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
    o.start(); o.stop(ctx.currentTime + 0.4);
  } catch(e) {}
}

function vibrate() {
  if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
}

function showPush(title, body, onClick) {
  const el = document.getElementById("pushNotif");
  document.getElementById("pushTitle").textContent = title;
  document.getElementById("pushBody").textContent = body;
  el.classList.add("show");
  playNotifSound();
  vibrate();
  el.onclick = () => {
    el.classList.remove("show");
    if (onClick) onClick();
  };
  clearTimeout(el._tid);
  el._tid = setTimeout(() => el.classList.remove("show"), 5000);
}

function showSystemNotif(title, body) {
  if (!("Notification" in window)) return;
  if (Notification.permission === "granted") {
    try {
      new Notification(title, { body, icon: "icon.svg", badge: "icon.svg", dir: "rtl", lang: "ar" });
    } catch(e) {}
  }
}

async function requestNotifPermission() {
  if (!("Notification" in window)) return false;
  if (Notification.permission === "granted") return true;
  if (Notification.permission === "denied") return false;
  const p = await Notification.requestPermission();
  return p === "granted";
}

async function setupFCM() {
  if (!messaging || !state.user) return;
  try {
    const granted = await requestNotifPermission();
    if (!granted) return;
    const token = await getToken(messaging, { vapidKey: "" }).catch(() => null);
    if (token) {
      await update(ref(db, `users/${state.user.uid}`), { fcmToken: token });
    }
    onMessage(messaging, payload => {
      const title = payload.notification?.title || "إشعار جديد";
      const body = payload.notification?.body || "";
      showPush(title, body);
      showSystemNotif(title, body);
      loadNotifications();
    });
  } catch(e) { console.warn("FCM setup error", e); }
}

function handleGoogleAuth() {
  const provider = new GoogleAuthProvider();
  signInWithPopup(auth, provider).catch(e => toast("فشل تسجيل الدخول: " + e.message, "error"));
}

async function handleEmailLogin(email, pass) {
  if (email === ADMIN_USER && pass === ADMIN_PASS) {
    try {
      await signInWithEmailAndPassword(auth, `admin@yz.local`, pass).catch(async (err) => {
        if (err.code === "auth/user-not-found" || err.code === "auth/invalid-credential") {
          await createUserWithEmailAndPassword(auth, `admin@yz.local`, pass);
        } else throw err;
      });
      return;
    } catch(e) { throw e; }
  }
  await signInWithEmailAndPassword(auth, email, pass);
}

async function handleRegister(data) {
  const maxU = state.settings.maxUsers || 1000;
  const usersSnap = await get(ref(db, "users"));
  const count = usersSnap.exists() ? Object.keys(usersSnap.val()).length : 0;
  if (count >= maxU) throw new Error("تم الوصول للحد الأقصى من المستخدمين");
  const cred = await createUserWithEmailAndPassword(auth, data.email, data.password);
  await updateProfile(cred.user, { displayName: data.name });
  await set(ref(db, `users/${cred.user.uid}`), {
    name: data.name, email: data.email, phone: data.phone,
    role: "customer", createdAt: Date.now()
  });
}

                    ${hasDiscount ? `<span class="price-old">${formatPrice(p.price)}</span>` : ""}
                  </div>
                  <button class="add-btn" data-add="${p.id}" ${outOfStock ? "disabled" : ""}>
                    <i class="fas fa-cart-plus"></i> ${outOfStock ? "غير متوفر" : "أضف للسلة"}
                  </button>
                </div>
              </div>`;
          }).join("")}
      </div>`;
  } else if (state.currentPage === "wishlist") {
    pageContent = `
      <div class="page">
        <h1 class="page-title"><i class="fas fa-heart"></i> المفضلة</h1>
        <div class="products-grid" style="padding:0">
          ${state.wishlist.length === 0 ? `<div class="empty-state" style="grid-column:1/-1"><i class="fas fa-heart"></i><p>لا توجد منتجات في المفضلة</p></div>` :
            state.wishlist.map(id => {
              const p = state.products.find(x => x.id === id);
              if (!p) return "";
              const hasDiscount = p.discount > 0;
              const finalPrice = hasDiscount ? p.price - (p.price * p.discount / 100) : p.price;
              const outOfStock = p.stock === false || (p.qty !== undefined && p.qty <= 0);
              return `
                <div class="product-card" data-id="${p.id}">
                  <div class="product-img">
                    ${p.image ? `<img src="${escapeHtml(p.image)}" loading="lazy" onerror="this.style.display='none'">` : `<div class="placeholder"><i class="fas fa-image"></i></div>`}

            ${escapeHtml((state.user.displayName || "U").charAt(0).toUpperCase())}

        </div>
        <button class="btn-primary" style="background:linear-gradient(135deg,#ef4444,#dc2626);margin-top:16px" id="logoutBtn">

          <span>${escapeHtml(state.settings.storeName)}</span>
        </div>
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input type="text" id="searchInput" placeholder="ابحث عن منتج..." value="${escapeHtml(state.searchQuery)}">

        <div class="header-actions">
          <button class="icon-btn" id="notifToggle" title="الإشعارات">

          <button class="icon-btn" id="wishlistBtn" title="المفضلة">
            <i class="fas fa-heart"></i>
            ${wishlistCount > 0 ? `<span class="badge pink">${wishlistCount}</span>` : ""}
          </button>
          <button class="icon-btn" id="cartToggle" title="السلة">
            <i class="fas fa-shopping-cart"></i>
            ${cartCount > 0 ? `<span class="badge pink">${cartCount}</span>` : ""}
          </button>
          <button class="icon-btn" id="themeToggle" title="الوضع">
            <i class="fas fa-moon"></i>
          </button>
        </div>
      </div>

    <main>${pageContent}</main>

    <nav class="bottom-nav">
      ${navItems.map(n => `
        <button class="nav-item ${state.currentPage === n.path ? "active" : ""}" data-nav="${n.path}">

function bindStoreEvents() {
  document.querySelectorAll("[data-cat]").forEach(b => {
    b.onclick = () => { state.currentCategory = b.dataset.cat; render(); };
  });
  document.querySelectorAll("[data-add]").forEach(b => {
    b.onclick = (e) => { e.stopPropagation(); addToCart(b.dataset.add); };
  });
  document.querySelectorAll("[data-fav]").forEach(b => {
    b.onclick = (e) => { e.stopPropagation(); toggleWishlist(b.dataset.fav); };
  });
  document.querySelectorAll(".product-card").forEach(c => {
    c.onclick = (e) => {
      if (e.target.closest("[data-add]") || e.target.closest("[data-fav]")) return;
      openProductModal(c.dataset.id);
    };
  });
  document.querySelectorAll("[data-nav]").forEach(b => {
    b.onclick = () => { state.currentPage = b.dataset.nav; render(); window.scrollTo(0,0); };
  });
  const si = document.getElementById("searchInput");
  if (si) {
    si.oninput = (e) => { state.searchQuery = e.target.value; render(); document.getElementById("searchInput").focus(); };
  }
  const ct = document.getElementById("cartToggle");
  if (ct) ct.onclick = () => openDrawer("cartDrawer");
  const nt = document.getElementById("notifToggle");
  if (nt) nt.onclick = () => openDrawer("notifDrawer");
  const wb = document.getElementById("wishlistBtn");
  if (wb) wb.onclick = () => { state.currentPage = "wishlist"; render(); };
  const tt = document.getElementById("themeToggle");
  if (tt) tt.onclick = () => toggleTheme();
  const cc = document.getElementById("closeCart");
  if (cc) cc.onclick = () => closeDrawers();
  const cn = document.getElementById("closeNotif");
  if (cn) cn.onclick = () => closeDrawers();
  const ov = document.getElementById("overlay");
  if (ov) ov.onclick = () => closeDrawers();
  const ac = document.getElementById("applyCoupon");
  if (ac) ac.onclick = applyCoupon;
  const ck = document.getElementById("checkoutBtn");
  if (ck) ck.onclick = checkout;
  const pm = document.getElementById("productModal");
  if (pm) pm.onclick = (e) => { if (e.target === pm) pm.classList.remove("open"); };
}

function openDrawer(id) {
  document.querySelectorAll(".drawer").forEach(d => d.classList.remove("open"));
  document.getElementById(id).classList.add("open");
  document.getElementById("overlay").classList.add("open");
}
function closeDrawers() {
  document.querySelectorAll(".drawer").forEach(d => d.classList.remove("open"));
  document.getElementById("overlay").classList.remove("open");
  document.getElementById("productModal").classList.remove("open");
}

function toggleTheme() {
  const cur = document.body.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : "dark";
  document.body.setAttribute("data-theme", next);
  localStorage.setItem("yz_theme", next);
  document.querySelectorAll("#themeToggle i").forEach(i => {
    i.className = next === "dark" ? "fas fa-sun" : "fas fa-moon";
  });
}

function addToCart(id) {
  const p = state.products.find(x => x.id === id);
  if (!p) return;
  const outOfStock = p.stock === false || (p.qty !== undefined && p.qty <= 0);
  if (outOfStock) { toast("المنتج غير متوفر", "error"); return; }
  const ex = state.cart.find(i => i.id === id);
  const finalPrice = p.discount > 0 ? p.price - (p.price * p.discount / 100) : p.price;
  if (ex) {
    ex.qty++;
  } else {
    state.cart.push({ id, name: p.name, price: finalPrice, originalPrice: p.price, image: p.image, qty: 1 });
  }
  saveLocal();
  toast("تمت الإضافة للسلة", "success");
  render();
}

function toggleWishlist(id) {
  const idx = state.wishlist.indexOf(id);
  if (idx > -1) state.wishlist.splice(idx, 1);
  else state.wishlist.push(id);
  saveLocal();
  toast(idx > -1 ? "تم الحذف من المفضلة" : "تمت الإضافة للمفضلة", "success");
  render();
}

function updateCartUI() {
  const body = document.getElementById("cartBody");
  const summary = document.getElementById("cartSummary");
  if (!body || !summary) return;
  if (state.cart.length === 0) {
    body.innerHTML = `<div class="empty-state"><i class="fas fa-shopping-cart"></i><p>السلة فارغة</p></div>`;
    summary.innerHTML = "";
    return;
  }
  body.innerHTML = state.cart.map(i => `
    <div class="cart-item">
      ${i.image ? `<img src="${escapeHtml(i.image)}" onerror="this.style.display='none'">` : `<div style="width:70px;height:70px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center"><i class="fas fa-image"></i></div>`}
      <div class="cart-item-info">
        <h4>${escapeHtml(i.name)}</h4>
        <div class="price">${formatPrice(i.price)}</div>
        <div class="qty-ctrl">
          <button class="qty-btn" data-minus="${i.id}"><i class="fas fa-minus"></i></button>
          <span class="qty-num">${i.qty}</span>
          <button class="qty-btn" data-plus="${i.id}"><i class="fas fa-plus"></i></button>
        </div>
      </div>
      <button class="remove-btn" data-remove="${i.id}"><i class="fas fa-trash"></i></button>
    </div>
  `).join("");

  const subtotal = state.cart.reduce((s, i) => s + i.price * i.qty, 0);
  let discount = 0;
  if (state.coupon) {
    if (state.coupon.type === "percent") discount = subtotal * state.coupon.value / 100;
    else discount = Math.min(state.coupon.value, subtotal);
  }
  const total = Math.max(0, subtotal - discount);

  summary.innerHTML = `
    <div class="summary-row"><span>المجموع الفرعي</span><span>${formatPrice(subtotal)}</span></div>
    ${discount > 0 ? `<div class="summary-row" style="color:var(--accent)"><span>الخصم ${state.coupon ? `(${state.coupon.code})` : ""}</span><span>- ${formatPrice(discount)}</span></div>` : ""}
    <div class="summary-row total"><span>الإجمالي</span><span>${formatPrice(total)}</span></div>
  `;

  body.querySelectorAll("[data-plus]").forEach(b => {
    b.onclick = () => {
      const it = state.cart.find(i => i.id === b.dataset.plus);
      if (it) { it.qty++; saveLocal(); updateCartUI(); render(); }
    };
  });
  body.querySelectorAll("[data-minus]").forEach(b => {
    b.onclick = () => {
      const it = state.cart.find(i => i.id === b.dataset.minus);
      if (it && it.qty > 1) { it.qty--; saveLocal(); updateCartUI(); render(); }
    };
  });
  body.querySelectorAll("[data-remove]").forEach(b => {
    b.onclick = () => {
      state.cart = state.cart.filter(i => i.id !== b.dataset.remove);
      saveLocal(); updateCartUI(); render();
    };
  });
}

async function applyCoupon() {
  const code = document.getElementById("couponInput").value.trim().toUpperCase();
  if (!code) return;
  const snap = await get(ref(db, `coupons/${code}`));
  if (!snap.exists() || !snap.val().active) { toast("كود غير صالح", "error"); return; }
  const c = snap.val();
  const subtotal = state.cart.reduce((s, i) => s + i.price * i.qty, 0);
  if (c.min && subtotal < c.min) { toast(`الحد الأدنى ${formatPrice(c.min)}`, "error"); return; }
  state.coupon = { code, ...c };
  toast("تم تطبيق الكوبون", "success");
  updateCartUI();
}

async function checkout() {
  if (state.cart.length === 0) { toast("السلة فارغة", "error"); return; }
  const subtotal = state.cart.reduce((s, i) => s + i.price * i.qty, 0);
  let discount = 0;
  if (state.coupon) {
    if (state.coupon.type === "percent") discount = subtotal * state.coupon.value / 100;
    else discount = Math.min(state.coupon.value, subtotal);
  }
  const total = Math.max(0, subtotal - discount);
  try {
    const oid = push(ref(db, "orders")).key;
    await set(ref(db, `orders/${oid}`), {
      uid: state.user.uid,
      userName: state.user.displayName || "",
      userEmail: state.user.email || "",
      phone: state.userData?.phone || "",
      address: "",
      notes: "",
      items: state.cart,
      subtotal, discount, total,
      coupon: state.coupon?.code || null,
      status: "pending",
      createdAt: Date.now()
    });
    await createNotification("طلب جديد", `تم استلام طلبك بقيمة ${formatPrice(total)}`, "order", "high", "all", null);
    state.cart = [];
    state.coupon = null;
    saveLocal();
    closeDrawers();
    toast("تم إرسال الطلب بنجاح", "success");
    state.currentPage = "orders";
    render();
  } catch(e) { toast("فشل إنشاء الطلب", "error"); }
}

function updateNotifUI() {
  const body = document.getElementById("notifBody");
  if (!body) return;
  const list = [...state.notifications].sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
  if (list.length === 0) {
    body.innerHTML = `<div class="empty-state"><i class="fas fa-bell-slash"></i><p>لا توجد إشعارات</p></div>`;
    return;
  }
  body.innerHTML = list.map(n => {
    const unread = !state.readNotifs.includes(n.id);
    return `
      <div class="notif-item ${unread ? "unread" : ""}" data-nid="${n.id}">
        <div class="icon"><i class="fas fa-${n.type === "promo" ? "tag" : n.type === "order" ? "shopping-bag" : "bell"}"></i></div>
        <div class="content">
          <h4>${escapeHtml(n.title)}</h4>
          <p>${escapeHtml(n.body)}</p>
          <span class="time">${formatDate(n.createdAt)}</span>
        </div>
        <button class="remove-btn" data-nremove="${n.id}"><i class="fas fa-times"></i></button>
      </div>`;
  }).join("");
  body.querySelectorAll("[data-nid]").forEach(el => {
    el.onclick = (e) => {
      if (e.target.closest("[data-nremove]")) return;
      const id = el.dataset.nid;
      if (!state.readNotifs.includes(id)) {
        state.readNotifs.push(id);
        saveLocal();
        updateNotifUI();
        render();
      }
    };
  });
  body.querySelectorAll("[data-nremove]").forEach(b => {
    b.onclick = (e) => {
      e.stopPropagation();
      state.readNotifs.push(b.dataset.nremove);
      saveLocal();
      updateNotifUI();
      render();
    };
  });
}

function openProductModal(id) {
  const p = state.products.find(x => x.id === id);
  if (!p) return;
  const hasDiscount = p.discount > 0;
  const finalPrice = hasDiscount ? p.price - (p.price * p.discount / 100) : p.price;
  const inWishlist = state.wishlist.includes(p.id);
  const outOfStock = p.stock === false || (p.qty !== undefined && p.qty <= 0);
  const c = document.getElementById("productModalContent");
  c.innerHTML = `
    <button class="modal-close" id="modalClose"><i class="fas fa-times"></i></button>
    ${p.image ? `<img src="${escapeHtml(p.image)}" class="modal-img" onerror="this.style.display='none'">` : `<div style="aspect-ratio:1;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:3rem;color:var(--text2);border-radius:20px 20px 0 0"><i class="fas fa-image"></i></div>`}
    <div class="modal-body">
      <h2 style="font-size:1.2rem;font-weight:800;margin-bottom:8px">${escapeHtml(p.name)}</h2>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap">
        <span style="font-size:1.4rem;font-weight:800;color:var(--primary)">${formatPrice(finalPrice)}</span>
        ${hasDiscount ? `<span style="font-size:.9rem;color:var(--text2);text-decoration:line-through">${formatPrice(p.price)}</span><span style="background:var(--accent);color:#fff;padding:3px 10px;border-radius:8px;font-size:.75rem;font-weight:700">خصم ${p.discount}%</span>` : ""}
      </div>
      ${p.description ? `<p style="color:var(--text2);font-size:.9rem;line-height:1.6;margin-bottom:16px">${escapeHtml(p.description)}</p>` : ""}
      <div style="display:flex;gap:8px">
        <button class="btn-primary" id="modalAdd" ${outOfStock ? "disabled" : ""} style="flex:1">
          <i class="fas fa-cart-plus"></i> ${outOfStock ? "غير متوفر" : "أضف للسلة"}
        </button>
        <button class="btn-primary" id="modalFav" style="width:60px;background:${inWishlist ? "var(--primary)" : "var(--bg)"};color:${inWishlist ? "#fff" : "var(--text)"};box-shadow:none">
          <i class="${inWishlist ? "fas" : "far"} fa-heart"></i>
        </button>
      </div>
    </div>
  `;
  document.getElementById("productModal").classList.add("open");
  document.getElementById("modalClose").onclick = () => document.getElementById("productModal").classList.remove("open");
  const ma = document.getElementById("modalAdd");
  if (ma) ma.onclick = () => { addToCart(p.id); document.getElementById("productModal").classList.remove("open"); };
  const mf = document.getElementById("modalFav");
  if (mf) mf.onclick = () => { toggleWishlist(p.id); openProductModal(p.id); };
}

async function createNotification(title, body, type, priority, target, targetUid) {
  try {
    const id = push(ref(db, "notifications")).key;
    await set(ref(db, `notifications/${id}`), {
      title, body, type, priority, target, targetUid: targetUid || null, createdAt: Date.now()
    });
  } catch(e) { console.warn("notif create error", e); }
}

      <div class="stats-grid">

function openProductEditor(id) {
  const p = id ? state.products.find(x => x.id === id) : { name: "", price: 0, discount: 0, qty: 0, category: "", image: "", description: "", stock: true, visible: true };
  const modal = document.createElement("div");
  modal.className = "modal open";
  modal.innerHTML = `
    <div class="modal-content" style="max-width:600px">
      <div style="padding:20px">
        <h2 style="font-size:1.2rem;font-weight:800;margin-bottom:16px">${id ? "تعديل منتج" : "منتج جديد"}</h2>
        <div class="form-group"><label>اسم المنتج *</label><input type="text" id="peName" value="${escapeHtml(p.name)}"></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div class="form-group"><label>السعر *</label><input type="number" id="pePrice" value="${p.price}" min="0" step="0.01"></div>
          <div class="form-group"><label>الخصم %</label><input type="number" id="peDiscount" value="${p.discount || 0}" min="0" max="100"></div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div class="form-group"><label>الكمية</label><input type="number" id="peQty" value="${p.qty || 0}" min="0"></div>
          <div class="form-group"><label>التصنيف</label><input type="text" id="peCategory" value="${escapeHtml(p.category || "")}"></div>
        </div>
        <div class="form-group"><label>رابط الصورة</label><input type="text" id="peImage" value="${escapeHtml(p.image || "")}" placeholder="https://..."></div>
        <div class="form-group"><label>رفع صورة من الجهاز</label><input type="file" id="peFile" accept="image/*"></div>
        <div class="form-group"><label>الوصف</label><textarea id="peDescription">${escapeHtml(p.description || "")}</textarea></div>
        <div style="display:flex;gap:12px;margin-bottom:12px">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:.85rem;font-weight:600">
            <input type="checkbox" id="peStock" ${p.stock !== false ? "checked" : ""}> متوفر
          </label>
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:.85rem;font-weight:600">
            <input type="checkbox" id="peVisible" ${p.visible !== false ? "checked" : ""}> ظاهر
          </label>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn-primary" id="peSave"><i class="fas fa-save"></i> حفظ</button>
          <button class="btn-primary" id="peCancel" style="background:var(--bg);color:var(--text);box-shadow:none"><i class="fas fa-times"></i> إلغاء</button>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
  modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
  document.getElementById("peCancel").onclick = () => modal.remove();
  document.getElementById("peFile").onchange = (e) => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement("canvas");
        const max = 600;
        let w = img.width, h = img.height;
        if (w > h && w > max) { h = h * max / w; w = max; }
        else if (h > max) { w = w * max / h; h = max; }
        c.width = w; c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        document.getElementById("peImage").value = c.toDataURL("image/jpeg", 0.8);
        toast("تم رفع الصورة", "success");
      };
      img.src = ev.target.result;
    };
    r.readAsDataURL(f);
  };
  document.getElementById("peSave").onclick = async () => {
    const data = {
      name: document.getElementById("peName").value.trim(),
      price: Number(document.getElementById("pePrice").value),
      discount: Number(document.getElementById("peDiscount").value) || 0,
      qty: Number(document.getElementById("peQty").value) || 0,
      category: document.getElementById("peCategory").value.trim(),
      image: document.getElementById("peImage").value.trim(),
      description: document.getElementById("peDescription").value.trim(),
      stock: document.getElementById("peStock").checked,
      visible: document.getElementById("peVisible").checked,
      updatedAt: Date.now()
    };
    if (!data.name || data.price <= 0) { toast("املأ الحقول الإلزامية", "error"); return; }
    try {
      if (id) {
        await update(ref(db, `products/${id}`), data);
      } else {
        const pid = push(ref(db, "products")).key;
        await set(ref(db, `products/${pid}`), { ...data, createdAt: Date.now() });
      }
      toast("تم الحفظ", "success");
      modal.remove();
    } catch(e) { toast("فشل", "error"); }
  };
}

      <div style="padding:20px">
        <h2 style="font-size:1.2rem;font-weight:800;margin-bottom:16px">كوبون جديد</h2>
        <div class="form-group"><label>الكود *</label><input type="text" id="ceCode" placeholder="SUMMER2024" style="text-transform:uppercase"></div>
        <div class="form-group"><label>النوع</label><select id="ceType"><option value="percent">نسبة مئوية %</option><option value="fixed">قيمة ثابتة</option></select></div>
        <div class="form-group"><label>القيمة *</label><input type="number" id="ceValue" value="10" min="0"></div>
        <div class="form-group"><label>الحد الأدنى للطلب</label><input type="number" id="ceMin" value="0" min="0"></div>
        <div class="form-group"><label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="ceActive" checked> نشط</label></div>
        <div style="display:flex;gap:8px">
          <button class="btn-primary" id="ceSave"><i class="fas fa-save"></i> حفظ</button>
          <button class="btn-primary" id="ceCancel" style="background:var(--bg);color:var(--text);box-shadow:none"><i class="fas fa-times"></i> إلغاء</button>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
  modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
  document.getElementById("ceCancel").onclick = () => modal.remove();
  document.getElementById("ceSave").onclick = async () => {
    const code = document.getElementById("ceCode").value.trim().toUpperCase();
    const value = Number(document.getElementById("ceValue").value);
    if (!code || value <= 0) { toast("املأ الحقول", "error"); return; }
    try {
      await set(ref(db, `coupons/${code}`), {
        code,
        type: document.getElementById("ceType").value,
        value,
        min: Number(document.getElementById("ceMin").value) || 0,
        active: document.getElementById("ceActive").checked,
        createdAt: Date.now()
      });
      toast("تم الحفظ", "success");
      modal.remove();
    } catch(e) { toast("فشل", "error"); }
  };
}

function openNavEditor(id) {
  const n = id ? state.nav.find(x => x.id === id) : { label: "", icon: "fas fa-home", path: "home", enabled: true, order: 0 };
  const modal = document.createElement("div");
  modal.className = "modal open";
  modal.innerHTML = `
    <div class="modal-content" style="max-width:500px">
      <div style="padding:20px">
        <h2 style="font-size:1.2rem;font-weight:800;margin-bottom:16px">${id ? "تعديل زر" : "زر جديد"}</h2>
        <div class="form-group"><label>الاسم *</label><input type="text" id="neLabel" value="${escapeHtml(n.label)}"></div>
        <div class="form-group"><label>الأيقونة (Font Awesome) *</label><input type="text" id="neIcon" value="${escapeHtml(n.icon)}" placeholder="fas fa-home"></div>
        <div class="form-group"><label>المسار *</label><select id="nePath">
          <option value="home" ${n.path === "home" ? "selected" : ""}>الرئيسية</option>
          <option value="wishlist" ${n.path === "wishlist" ? "selected" : ""}>المفضلة</option>
          <option value="orders" ${n.path === "orders" ? "selected" : ""}>طلباتي</option>
          <option value="contact" ${n.path === "contact" ? "selected" : ""}>تواصل معنا</option>
          <option value="profile" ${n.path === "profile" ? "selected" : ""}>الملف الشخصي</option>
        </select></div>
        <div class="form-group"><label>الترتيب</label><input type="number" id="neOrder" value="${n.order || 0}"></div>
        <div class="form-group"><label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="neEnabled" ${n.enabled !== false ? "checked" : ""}> مفعل</label></div>
        <div style="display:flex;gap:8px">
          <button class="btn-primary" id="neSave"><i class="fas fa-save"></i> حفظ</button>
          <button class="btn-primary" id="neCancel" style="background:var(--bg);color:var(--text);box-shadow:none"><i class="fas fa-times"></i> إلغاء</button>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
  modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
  document.getElementById("neCancel").onclick = () => modal.remove();
  document.getElementById("neSave").onclick = async () => {
    const data = {
      label: document.getElementById("neLabel").value.trim(),
      icon: document.getElementById("neIcon").value.trim(),
      path: document.getElementById("nePath").value,
      order: Number(document.getElementById("neOrder").value) || 0,
      enabled: document.getElementById("neEnabled").checked
    };
    if (!data.label || !data.icon) { toast("املأ الحقول", "error"); return; }
    try {
      if (id) await update(ref(db, `nav/${id}`), data);
      else {
        const nid = push(ref(db, "nav")).key;
        await set(ref(db, `nav/${nid}`), data);
      }
      toast("تم الحفظ", "success");
      modal.remove();
    } catch(e) { toast("فشل", "error"); }
  };
}

let unsubscribers = [];

function unsubAll() {
  unsubscribers.forEach(u => { try { u(); } catch(e) {} });
  unsubscribers = [];
}

function subscribeData() {
  unsubAll();
  unsubscribers.push(onValue(ref(db, "settings"), s => {
    if (s.exists()) {
      state.settings = { ...state.settings, ...s.val() };
      applyThemeColors();
    }
    render();
  }));
  unsubscribers.push(onValue(ref(db, "maintenance"), s => {
    state.maintenance = s.exists() ? s.val() : { enabled: false };
    render();
  }));
  unsubscribers.push(onValue(ref(db, "nav"), s => {
    const v = s.val() || {};
    state.nav = Object.entries(v).map(([id, n]) => ({ id, ...n }));
    if (state.nav.length === 0 && !state._navInitialized) {
      state._navInitialized = true;
      const defaults = [
        { label: "الرئيسية", icon: "fas fa-home", path: "home", enabled: true, order: 1 },
        { label: "المفضلة", icon: "fas fa-heart", path: "wishlist", enabled: true, order: 2 },
        { label: "طلباتي", icon: "fas fa-shopping-bag", path: "orders", enabled: true, order: 3 },
        { label: "تواصل", icon: "fas fa-envelope", path: "contact", enabled: true, order: 4 },
        { label: "حسابي", icon: "fas fa-user", path: "profile", enabled: true, order: 5 }
      ];
      defaults.forEach(d => {
        const nid = push(ref(db, "nav")).key;
        set(ref(db, `nav/${nid}`), d);
      });
    }
    render();
  }));
  unsubscribers.push(onValue(ref(db, "products"), s => {
    const v = s.val() || {};
    state.products = Object.entries(v).map(([id, p]) => ({ id, ...p }));
    render();
  }));
  unsubscribers.push(onValue(ref(db, "orders"), s => {
    const v = s.val() || {};
    state.orders = Object.entries(v).map(([id, o]) => ({ id, ...o }));
    render();
  }));
  unsubscribers.push(onValue(ref(db, "notifications"), s => {
    const v = s.val() || {};
    const old = state.notifications.length;
    state.notifications = Object.entries(v).map(([id, n]) => ({ id, ...n }));
    if (state.notifications.length > old && old > 0) {
      const latest = state.notifications.sort((a,b) => (b.createdAt||0) - (a.createdAt||0))[0];
      if (latest && !state.readNotifs.includes(latest.id)) {
        showPush(latest.title, latest.body);
        showSystemNotif(latest.title, latest.body);
      }
    }
    render();
  }));
  unsubscribers.push(onValue(ref(db, "messages"), s => {
    const v = s.val() || {};
    state.messages = Object.entries(v).map(([id, m]) => ({ id, ...m }));
    render();
  }));
  unsubscribers.push(onValue(ref(db, "coupons"), s => {
    const v = s.val() || {};
    state.coupons = Object.entries(v).map(([code, c]) => ({ code, ...c }));
    if (state.isAdmin) render();
  }));
  unsubscribers.push(onValue(ref(db, "users"), s => {
    const v = s.val() || {};
    state.users = Object.entries(v).map(([id, u]) => ({ id, ...u }));
    if (state.isAdmin) render();
  }));
  unsubscribers.push(onValue(ref(db, "pages"), s => {
    state._pageElements = {};
    const v = s.val() || {};
    Object.entries(v).forEach(([pk, p]) => {
      state._pageElements[pk] = p.elements ? Object.entries(p.elements).map(([id, el]) => ({ id, ...el })) : [];
    });
    if (state.isAdmin && state.adminSection === "editor") renderAdmin();
  }));
}

function applyThemeColors() {
  document.documentElement.style.setProperty("--primary", state.settings.primary);
  document.documentElement.style.setProperty("--primary2", state.settings.primary2);
  document.documentElement.style.setProperty("--accent", state.settings.accent);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", state.settings.primary);
}

onAuthStateChanged(auth, async (user) => {
  if (user) {
    state.user = user;
    const snap = await get(ref(db, `users/${user.uid}`));
    let data = snap.exists() ? snap.val() : null;
    if (!data) {
      const isAdminUser = user.email === "admin@yz.local" || user.email === ADMIN_USER;
      data = {
        name: isAdminUser ? "الأدمن" : (user.displayName || "مستخدم"),
        email: user.email,
        phone: "",
        role: isAdminUser ? "admin" : "customer",
        createdAt: Date.now()
      };
      await set(ref(db, `users/${user.uid}`), data);
    }
    state.userData = data;
    state.isAdmin = data.role === "admin" || user.email === "admin@yz.local" || user.email === ADMIN_USER;
    subscribeData();
    if (state.isAdmin) state.adminSection = "dashboard";
    else state.currentPage = "home";
    if (!state.isAdmin) await setupFCM();
  } else {
    state.user = null;
    state.userData = null;
    state.isAdmin = false;
    unsubAll();
  }
  render();
});

const theme = localStorage.getItem("yz_theme") || "light";
document.body.setAttribute("data-theme", theme);
setTimeout(() => {
  document.querySelectorAll("#themeToggle i").forEach(i => {
    i.className = theme === "dark" ? "fas fa-sun" : "fas fa-moon";
  });
}, 100);

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  state.installPrompt = e;
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

</script>
</body>
</html>

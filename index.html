<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>منصة سيجما التعليمية</title>
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" id="mf">
<link rel="apple-touch-icon" id="ai">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
:root{
  --bg:#f8fafc; --surface:#ffffff; --surface2:#f1f5f9;
  --tx:#0f172a; --tx2:#475569; --mu:#94a3b8;
  --ac:#2563eb; --ac2:#1d4ed8; --ac-soft:#dbeafe;
  --ok:#10b981; --er:#ef4444; --warn:#f59e0b;
  --bd:#e2e8f0; --r:16px; --r-sm:10px; --r-lg:22px;
  --shadow:0 1px 3px rgba(15,23,42,.06),0 4px 12px rgba(15,23,42,.04);
  --shadow-lg:0 10px 40px rgba(15,23,42,.12);
}
html.dark{
  --bg:#0b1220; --surface:#111a2e; --surface2:#1a2440;
  --tx:#f1f5f9; --tx2:#cbd5e1; --mu:#64748b;
  --ac:#60a5fa; --ac2:#3b82f6; --ac-soft:#1e3a8a;
  --bd:#1e293b;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 4px 12px rgba(0,0,0,.3);
  --shadow-lg:0 10px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{min-height:100%;height:auto;-webkit-text-size-adjust:100%}
body{font-family:Cairo,system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--tx);
  min-height:100vh;min-height:100dvh;
  padding-bottom:calc(120px + env(safe-area-inset-bottom));overflow-x:hidden;
  -webkit-user-select:none;user-select:none;transition:background .25s,color .25s}
input,select,textarea{-webkit-user-select:text;user-select:text}
h1,h2,h3{font-weight:800;line-height:1.3}
h2{font-size:20px;margin-bottom:16px;color:var(--tx)}
#loading-overlay{position:fixed;top:0;right:0;bottom:0;left:0;z-index:9999;background:rgba(248,250,252,.85);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .3s ease}
html.dark #loading-overlay{background:rgba(11,18,32,.85)}
#loading-overlay.hide{opacity:0;pointer-events:none}
.spinner{width:40px;height:40px;border:4px solid var(--ac-soft);border-top-color:var(--ac);
  border-radius:50%;animation:spin 1s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}
.top-bar{background:linear-gradient(135deg,var(--ac) 0%,var(--ac2) 100%);color:#fff;
  padding:24px 20px;border-bottom-left-radius:24px;border-bottom-right-radius:24px;
  margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-start;
  position:relative;box-shadow:var(--shadow)}
.top-bar .welcome h1{font-size:22px;margin-bottom:4px;font-weight:800}
.top-bar .welcome p{font-size:14px;opacity:.9;margin-bottom:12px}
.top-bar .user-area{display:flex;align-items:center;gap:8px}
.top-bar .avatar-lg{width:56px;height:56px;border-radius:50%;border:3px solid rgba(255,255,255,.4);
  object-fit:cover;cursor:pointer;background:#fff}
.top-bar .actions{display:flex;gap:8px;align-items:center}
.top-bar .action-btn{background:rgba(255,255,255,.2);color:#fff;border:0;padding:6px 12px;
  border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:.15s}
.top-bar .action-btn.icon-only{width:42px;height:42px;padding:0;border-radius:50%;position:relative;
  flex:0 0 42px;background:#fff;color:#0f172a;box-shadow:0 2px 5px rgba(0,0,0,.1)}
.top-bar .action-btn.icon-only svg{width:22px;height:22px;fill:none;stroke:currentColor;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.top-bar .action-btn.icon-only .badge-dot{position:absolute;top:-2px;right:-2px;
  min-width:18px;height:18px;padding:0 4px;border-radius:99px;background:#ef4444;
  color:#fff;border:2px solid #fff;align-items:center;justify-content:center;
  font-size:10px;font-weight:800;display:flex}
main{max-width:1000px;margin:0 auto;padding:0 20px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-lg);padding:0;
  cursor:pointer;text-align:center;transition:.2s;overflow:hidden;position:relative;
  display:flex;flex-direction:column}
.card:hover{border-color:var(--ac);box-shadow:var(--shadow-lg);transform:translateY(-3px)}
.card:active{transform:scale(.98)}
.card .card-img-wrap{width:100%;height:160px;background:linear-gradient(135deg,#e0e7ff 0%,#f1f5f9 100%);position:relative}
.card .card-img-wrap img{width:100%;height:100%;object-fit:cover;background:var(--surface2)}
.card .card-body{padding:12px 10px;background:var(--surface);flex:1;
  display:flex;flex-direction:column;justify-content:center}
.card b{font-size:16px;display:block;color:var(--tx);font-weight:800}
.row{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r);
  padding:16px 18px;margin-bottom:12px;display:flex;align-items:center;gap:12px;
  cursor:pointer;transition:.15s;flex-wrap:wrap}
.row:hover{border-color:var(--ac);box-shadow:var(--shadow-lg)}
.row>div{flex:1;min-width:0}
.row b{font-size:15px;display:block;color:var(--tx)}
.row small{color:var(--mu);font-size:13px;display:block;margin-top:2px}
button,.btn{font-family:inherit;font-weight:700;border:0;border-radius:var(--r-sm);
  padding:10px 18px;background:var(--ac);color:#fff;cursor:pointer;transition:.15s;font-size:14px;
  touch-action:manipulation}
button:hover{background:var(--ac2);transform:translateY(-1px);box-shadow:0 4px 12px rgba(37,99,235,.3)}
button:active{transform:translateY(0) scale(.97)}
button:disabled{opacity:.6;cursor:not-allowed;transform:none;box-shadow:none}
button.s{background:var(--surface2);color:var(--tx)}
button.s:hover{background:var(--bd);box-shadow:none;transform:none}
button.d{background:var(--er)}button.d:hover{background:#dc2626}
button.g{background:var(--ok)}button.g:hover{background:#059669}
label{font-size:13px;color:var(--tx2);font-weight:700;display:block;margin-bottom:6px}
input,select,textarea{font-family:inherit;font-size:16px;width:100%;padding:12px 14px;
  border-radius:var(--r-sm);border:1px solid var(--bd);background:var(--surface);color:var(--tx);
  margin-bottom:14px;transition:.15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-soft)}
.box{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-lg);
  padding:22px;margin-bottom:20px;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px;text-align:right;border-bottom:1px solid var(--bd)}
th{background:var(--surface2);font-weight:700;color:var(--tx2);font-size:12px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r)}
.b{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--tx2);display:inline-block}
.b.g{background:#d1fae5;color:#065f46}
.b.r{background:#fee2e2;color:#991b1b}
.b.y{background:#fef3c7;color:#92400e}
html.dark .b.g{background:#064e3b;color:#6ee7b7}
html.dark .b.r{background:#7f1d1d;color:#fca5a5}
html.dark .b.y{background:#78350f;color:#fcd34d}
.g{color:var(--ok)}.r{color:var(--er)}.y{color:var(--warn)}
.code{font-family:'Courier New',monospace;font-size:15px;letter-spacing:2px;direction:ltr;
  display:inline-block;background:var(--surface2);padding:3px 10px;border-radius:6px;
  color:var(--ac2);font-weight:700}
.mut{color:var(--mu);text-align:center;padding:40px 20px}

.player-wrap{width:100%;margin-bottom:16px}
.pl{position:relative;background:#000;border-radius:var(--r);overflow:hidden;width:100%;
  aspect-ratio:16/9}
.pl iframe,.pl video{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;
  border:0;display:block;background:#000;object-fit:contain}
.pl iframe{pointer-events:auto}
.pl .end-cover{position:absolute;top:0;right:0;bottom:0;left:0;z-index:100;background:#000;display:none;align-items:center;justify-content:center}
.pl .end-cover button{background:var(--ac);color:#fff;padding:12px 22px;font-size:15px}
.wm{position:absolute;pointer-events:none;z-index:22;display:flex;align-items:center;gap:6px;
  font-size:12px;opacity:.45;background:rgba(0,0,0,.6);padding:4px 10px;border-radius:99px;
  animation:mv 24s linear infinite alternate;direction:ltr;color:#fff;white-space:nowrap}
.wm img{width:22px;height:22px;border-radius:50%;object-fit:cover}
@keyframes mv{0%{top:20%;left:4%}25%{top:70%;left:55%}50%{top:35%;left:70%}75%{top:80%;left:8%}100%{top:20%;left:60%}}

.bottombar{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--surface);
  border:1px solid var(--bd);border-bottom:0;border-radius:22px 22px 0 0;
  display:flex;justify-content:space-around;gap:4px;
  padding:8px 16px calc(8px + env(safe-area-inset-bottom));
  box-shadow:0 -5px 24px rgba(0,0,0,.10)}
.bottombar button{background:transparent;color:var(--tx2);border:0;padding:10px 4px;
  border-radius:25px;font-size:11px;font-weight:700;cursor:pointer;transition:.15s;
  display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
.bottombar button:hover{background:var(--surface2);color:var(--tx);box-shadow:none;transform:none}
.bottombar button.on{color:var(--ac);background:var(--ac-soft)}
.bottombar button.on svg{fill:var(--ac)}
.bottombar button svg{width:22px;height:22px;fill:var(--tx2);transition:.15s}
#t{position:fixed;bottom:calc(100px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  background:var(--tx);color:var(--bg);padding:12px 22px;border-radius:var(--r);
  font-weight:700;display:none;z-index:300;box-shadow:var(--shadow-lg);
  max-width:90vw;text-align:center;font-size:14px}
#t.show{display:block;animation:pop .25s}
@keyframes pop{0%{transform:translateX(-50%) scale(.8);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:1}}
.profile-card{text-align:center;padding:30px 20px}
.profile-card img{width:100px;height:100px;border-radius:50%;border:4px solid var(--ac-soft);
  margin-bottom:16px;object-fit:cover;background:var(--surface2)}
.profile-card h2{margin-bottom:8px}
.profile-card p{color:var(--mu);font-size:15px;margin-bottom:24px}
.settings-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:20px}
.settings-btn{background:var(--surface2);border:1px solid var(--bd);border-radius:var(--r);
  padding:16px 12px;text-align:center;cursor:pointer;transition:.2s;display:flex;
  flex-direction:column;align-items:center;gap:8px}
.settings-btn:hover{border-color:var(--ac);background:var(--ac-soft);transform:translateY(-2px)}
.settings-btn svg{width:28px;height:28px;fill:var(--ac)}
.settings-btn span{font-size:13px;font-weight:700;color:var(--tx)}
.modal{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.5);z-index:200;display:none;
  align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex;animation:pop .2s}
.modal-content{background:var(--surface);border-radius:var(--r-lg);width:100%;max-width:400px;
  max-height:80vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow-lg)}
.modal-header{padding:16px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.modal-header h3{font-size:16px;margin:0}
.modal-body{padding:16px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.noti-item{display:flex;align-items:flex-start;gap:12px;padding:14px;margin-bottom:10px;
  background:var(--surface2);border:1px solid var(--bd);border-radius:14px;transition:.2s;position:relative}
.noti-item.unread{background:var(--ac-soft);border-color:var(--ac)}
html.dark .noti-item.unread{background:rgba(30,58,138,.35)}
.noti-icon{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.noti-icon svg{width:22px;height:22px;fill:#fff}
.noti-content{flex:1;min-width:0}
.noti-text{font-size:14px;line-height:1.6;color:var(--tx);font-weight:600;margin-bottom:4px;word-break:break-word}
.noti-date{font-size:11px;color:var(--mu);font-weight:700}
.noti-unread-dot{width:8px;height:8px;border-radius:50%;background:var(--er);display:inline-block;margin-right:4px}
.noti-actions{display:flex;gap:6px;flex-shrink:0}
.noti-actions button{padding:6px 10px;font-size:11px;border-radius:8px;background:var(--surface);border:1px solid var(--bd);color:var(--tx2);font-weight:700}
.noti-actions button:hover{background:var(--er);color:#fff;border-color:var(--er)}
.noti-empty{text-align:center;padding:50px 20px;color:var(--mu)}
.noti-empty svg{width:60px;height:60px;fill:var(--bd);margin-bottom:14px}
.stats-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:20px}
.stat-box{background:linear-gradient(135deg,var(--surface),var(--surface2));border:1px solid var(--bd);border-radius:var(--r);padding:16px;text-align:center}
.stat-box .stat-num{font-size:26px;font-weight:800;color:var(--ac);margin-bottom:4px}
.stat-box .stat-label{font-size:12px;color:var(--mu);font-weight:700}
.stat-box.ok .stat-num{color:var(--ok)}
.stat-box.warn .stat-num{color:var(--warn)}
.stats-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r);border:1px solid var(--bd)}
.stats-table{width:100%;border-collapse:collapse;font-size:13px;background:var(--surface)}
.stats-table th{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;padding:12px 10px;font-size:12px;font-weight:800;text-align:right;white-space:nowrap}
.stats-table td{padding:12px 10px;border-bottom:1px solid var(--bd);vertical-align:middle}
.stats-table .grade-chip{display:inline-block;padding:3px 8px;border-radius:8px;background:var(--ac-soft);color:var(--ac2);font-size:11px;font-weight:700;white-space:nowrap}
.stats-filter{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.stats-filter button{padding:8px 16px;font-size:12px;border-radius:99px;background:var(--surface2);color:var(--tx2);border:1px solid var(--bd)}
.stats-filter button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.auth-container{max-width:400px;margin:0 auto;padding:40px 20px;text-align:center}
.auth-container h1{font-size:32px;color:var(--ac);margin-bottom:8px;font-weight:800;letter-spacing:-1px}
.auth-container p{color:var(--mu);margin-bottom:24px;font-size:15px}
.auth-btn{width:100%;padding:14px;font-size:16px;border-radius:12px;margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:10px}
.auth-btn.phone{background:var(--ac);color:#fff}
.auth-form{text-align:right}
.auth-form label{display:block;margin-bottom:6px;font-weight:700;font-size:13px;color:var(--tx2)}
.auth-form .error{color:var(--er);font-size:13px;margin-bottom:10px;display:none;line-height:1.6}
.link-btn{color:var(--ac);font-weight:700;text-decoration:none;cursor:pointer}
.admin-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;background:var(--surface2);padding:6px;border-radius:12px}
.admin-tabs button{flex:1 1 calc(50% - 6px);padding:10px;font-size:13px;border-radius:8px;background:var(--surface);color:var(--tx2);border:1px solid var(--bd)}
.admin-tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
@media(max-width:768px){.admin-tabs button{flex:1 1 100%}}
.code-input{font-size:26px;text-align:center;letter-spacing:8px;font-family:monospace}
.notice{background:var(--ac-soft);border:1px solid var(--ac);border-radius:var(--r);padding:14px 16px;margin-bottom:16px;color:var(--tx);line-height:1.7}
.ban-screen{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;text-align:center}
.ban-screen h1{font-size:28px;color:var(--er);margin-bottom:14px}
.ban-screen p{color:var(--tx2);margin-bottom:24px;line-height:1.7}
.news-card{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-lg);padding:16px;margin-bottom:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.news-card img{width:100%;max-height:400px;object-fit:contain;border-radius:var(--r-sm);border:1px solid var(--bd);background:var(--surface2)}
.embed-box{position:relative;width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000;margin-bottom:10px}
.embed-box iframe,.embed-box video{position:absolute;inset:0;width:100%;height:100%;border:0}
.news-text{font-size:15px;line-height:1.7;color:var(--tx);white-space:pre-wrap}
.news-date{font-size:12px;color:var(--mu);font-weight:700;margin-top:4px}

/* الامتحانات */
.exam-card{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-lg);padding:18px;margin-bottom:14px;transition:.2s;box-shadow:var(--shadow)}
.exam-card:hover{border-color:var(--ac);transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.exam-card h3{font-size:17px;margin-bottom:8px;color:var(--tx)}
.exam-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;font-size:12px}
.exam-meta .b{font-size:11px}
.exam-q{background:var(--surface2);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin-bottom:14px}
.exam-q .q-text{font-size:15px;font-weight:700;margin-bottom:12px;line-height:1.7;color:var(--tx)}
.exam-q .q-num{display:inline-block;background:var(--ac);color:#fff;width:26px;height:26px;border-radius:50%;text-align:center;line-height:26px;font-size:12px;font-weight:800;margin-left:8px}
.exam-opt{display:flex;align-items:center;gap:10px;padding:10px 14px;margin-bottom:8px;background:var(--surface);border:1.5px solid var(--bd);border-radius:10px;cursor:pointer;transition:.15s}
.exam-opt:hover{border-color:var(--ac)}
.exam-opt.selected{border-color:var(--ac);background:var(--ac-soft)}
.exam-opt input{margin:0;width:18px;height:18px;cursor:pointer}
.exam-opt span{font-size:14px;color:var(--tx);flex:1}
.exam-timer{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;padding:12px 18px;border-radius:12px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;font-weight:800;box-shadow:var(--shadow-lg)}
.exam-timer.warn{background:linear-gradient(135deg,var(--warn),#d97706)}
.exam-timer.danger{background:linear-gradient(135deg,var(--er),#dc2626);animation:pulse .6s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
.exam-timer .time-big{font-size:22px;font-family:'Courier New',monospace;letter-spacing:2px}
.exam-result{text-align:center;padding:30px 20px}
.exam-result .score{font-size:60px;font-weight:900;margin:14px 0;background:linear-gradient(135deg,var(--ac),var(--ok));-webkit-background-clip:text;background-clip:text;color:transparent}
.exam-result .label{font-size:16px;color:var(--tx2);margin-bottom:8px}
.exam-result .detail{font-size:14px;color:var(--mu);margin-top:10px}
.exam-vio{background:#fef3c7;color:#92400e;border:1px solid #fbbf24;padding:10px 14px;border-radius:10px;margin-bottom:12px;font-size:13px;font-weight:700}

@media(max-width:720px){
  main{padding:0 14px 40px}
  h2{font-size:18px}
  .top-bar{padding:16px}
  .top-bar .welcome h1{font-size:18px}
  .bottombar button{font-size:10px;padding:8px 2px}
  .bottombar button svg{width:20px;height:20px}
  .exam-timer .time-big{font-size:18px}
  .exam-result .score{font-size:44px}
}
@media(max-width:520px){
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .card .card-img-wrap{height:130px}
  .card b{font-size:14px}
  .stats-table{font-size:11px}
  .stats-table th,.stats-table td{padding:8px 6px}
}
</style>
</head>
<body>
<div id="loading-overlay">
  <div class="spinner"></div>
  <p style="font-family:Cairo,sans-serif;font-weight:700;color:var(--ac)">جارٍ التحميل...</p>

function img(f,maxSize=800){
  return new Promise((resolve,reject)=>{
    if(!f)return resolve(null);
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error('تعذر قراءة الصورة'));
    reader.onload=e=>{
      const im=new Image();
      im.onload=()=>{
        let w=im.width,h=im.height;
        if(w>maxSize||h>maxSize){
          const ratio=Math.min(maxSize/w,maxSize/h);
          w=Math.max(1,Math.round(w*ratio));
          h=Math.max(1,Math.round(h*ratio));
        }
        const c=document.createElement('canvas');
        c.width=w;c.height=h;
        c.getContext('2d').drawImage(im,0,0,w,h);
        let data;
        try{data=c.toDataURL('image/jpeg',0.8)}catch(err){data=c.toDataURL('image/png')}
        if(!data||data==='data:,')return reject(new Error('تعذر معالجة الصورة'));
        resolve(data);
      };
      im.onerror=()=>reject(new Error('صيغة الصورة غير مدعومة'));
      im.src=e.target.result;
    };
    reader.readAsDataURL(f);
  });
}

function ytId(u){
  try{
    const url=new URL(u);
    const host=url.hostname.replace(/^(www\.|m\.)/,'');
    let id='';
    if(host==='youtu.be')id=url.pathname.slice(1).split('/')[0];
    else if(host==='youtube.com'||host==='youtube-nocookie.com'||host==='music.youtube.com'){
      if(url.pathname==='/watch')id=url.searchParams.get('v')||'';
      else{const m=url.pathname.match(/^\/(embed|shorts|live|v)\/([\w-]+)/);if(m)id=m[2]}
    }
    return /^[\w-]{11}$/.test(id)?id:'';
  }catch(e){return ''}
}
function embed(u,full){
  u=String(u||'').trim();
  if(!/^https?:\/\//i.test(u))return{t:'f',s:''};
  const yt=ytId(u);
  if(yt){
    const origin=location.origin&&location.origin.startsWith('http')?'&origin='+encodeURIComponent(location.origin):'';
    const base=full?'rel=0&playsinline=1&modestbranding=1&cc_load_policy=0':'rel=0&playsinline=1&modestbranding=1&controls=0&showinfo=0&iv_load_policy=3&fs=0&disablekb=1&cc_load_policy=0';
    return{t:'yt',id:yt,s:`https://www.youtube-nocookie.com/embed/${yt}?${base}${origin}`};
  }
  const dm=u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:.*&)?id=)([\w-]+)/);
  if(dm)return{t:'drive',s:`https://drive.google.com/file/d/${dm[1]}/preview`,id:dm[1]};
  if(/\.(mp4|webm|ogg|m4v)(\?|#|$)/i.test(u))return{t:'v',s:u};
  return{t:'f',s:u};
}

      }

      if(cached){

        videos=cached.videos||{};
        library=cached.library||{};
        news=cached.news||{};
        loadedTeachers=true;
        toast('وضع عدم الاتصال — بيانات محفوظة');
      }

    unsubs.push(onValue(R('teachers'),s=>{

      cache.save({teachers,videos,library,news});
      if(!['watch','exam','takeExam','liveRoom'].includes(S.v))render();
    },()=>{loadedTeachers=true}));

    unsubs.push(onValue(R('library'),s=>{library=s.val()||{};if(!['watch','liveRoom'].includes(S.v))render()},()=>{}));
    unsubs.push(onValue(R('news'),s=>{news=s.val()||{};if(S.v==='news')render()},()=>{}));
    unsubs.push(onValue(R('exams'),s=>{exams=s.val()||{};if(['exams','exam','takeExam','admin'].includes(S.v))render()},()=>{}));
    unsubs.push(onValue(R('examAttempts/'+u.uid),s=>{examAttempts=s.val()||{};if(['exams','exam'].includes(S.v))render()},()=>{}));

    unsubs.push(onValue(R('live'),s=>{

    },()=>{}));
    unsubs.push(onValue(R('liveCodes'),s=>{
      const all=s.val()||{};

      for(const [c,v] of Object.entries(all)){
        if(v && v.usedBy===u.uid) mine[v.liveId]=c;
      }
      myLiveCodes=mine;
      if(['live','liveRoom'].includes(S.v))render();
    },()=>{}));

    if(!A&&!IS_SUPERVISOR){
      unsubs.push(onValue(R('logs'),snap=>{
        const all=snap.val()||{};
        const next={};
        for(const vid in all){

        }
        myLogs=next;
        if(S.v==='teacher')render();
      },()=>{}));
    }

function switchPhoneMode(mode,e){
  if(e)e.preventDefault();
  $('#phone-register').style.display=mode==='login'?'none':'block';
  $('#phone-login').style.display=mode==='login'?'block':'none';
}
function showErr(id,msg){const el=$('#'+id);if(!el)return;el.textContent=msg;el.style.display='block'}
function authMsg(e){
  const c=e?.code||'';
  if(c==='auth/network-request-failed')return 'تعذر الاتصال بالإنترنت';
  if(c==='auth/too-many-requests')return 'محاولات كثيرة، انتظر قليلاً';
  if(c==='auth/weak-password')return 'كلمة المرور ضعيفة (6 أحرف على الأقل)';
  if(c==='auth/email-already-in-use')return 'رقم الهاتف مسجل بالفعل';
  if(['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-login-credentials'].includes(c))return null;
  return 'حدث خطأ: '+(e?.message||c||'غير معروف');
}
function registerPhone(){return once('register',doRegister)}
async function doRegister(){
  const name=$('#reg-name').value.trim().replace(/\s+/g,' ');
  const phone=normPhone($('#reg-phone').value);
  const pass=$('#reg-pass').value;
  const pass2=$('#reg-pass2').value;
  $('#reg-error').style.display='none';
  if(name.split(' ').filter(Boolean).length<4)return showErr('reg-error','يجب كتابة الاسم الرباعي');
  if(!/^01[0-9]{9}$/.test(phone))return showErr('reg-error','رقم الهاتف غير صحيح');
  if(pass.length<6)return showErr('reg-error','كلمة المرور 6 أحرف على الأقل');
  if(pass!==pass2)return showErr('reg-error','كلمتا المرور غير متطابقتين');
  try{
    const email=`${phone}@sigma.user`;
    const cred=await createUserWithEmailAndPassword(auth,email,pass);
    await updateProfile(cred.user,{displayName:name});
    await set(R('users/'+cred.user.uid),{name,phone,email,photo:'',createdAt:Date.now(),isSupervisor:false});
    toast('تم إنشاء الحساب');
    setTimeout(()=>location.reload(),800);
  }catch(e){showErr('reg-error',authMsg(e)||'حدث خطأ')}
}
function loginPhone(){return once('login',doLogin)}
async function doLogin(){
  const phone=normPhone($('#login-phone').value);
  const pass=$('#login-pass').value;
  $('#login-error').style.display='none';
  if(!/^01[0-9]{9}$/.test(phone))return showErr('login-error','رقم الهاتف غير صحيح');
  if(!pass)return showErr('login-error','اكتب كلمة المرور');
  const failKey=`login_fails_${phone}`,lockKey=`login_lock_${phone}`;
  const lock=parseInt(store.get(lockKey)||'0',10);
  if(lock){
    const rem=Math.ceil((lock-Date.now())/60000);
    if(rem>0)return showErr('login-error',`مقفل مؤقتاً. بعد ${rem} دقيقة`);
    store.del(lockKey);store.del(failKey);
  }
  try{
    await signInWithEmailAndPassword(auth,`${phone}@sigma.user`,pass);
    store.del(failKey);
    toast('تم تسجيل الدخول');
  }catch(e){
    const m=authMsg(e);
    if(m!==null)return showErr('login-error',m);
    const fails=parseInt(store.get(failKey)||'0',10)+1;
    if(fails>=3){
      store.set(lockKey,String(Date.now()+15*60*1000));
      store.del(failKey);
      showErr('login-error','3 محاولات خاطئة. مقفل 15 دقيقة');
    }else{
      store.set(failKey,String(fails));
      showErr('login-error',`رقم أو كلمة مرور خاطئة (${fails}/3)`);
    }
  }
}

  let res;
  try{res=fn()}
  catch(e){a.innerHTML=shell(`<div class="mut">حدث خطأ: ${esc(e.message)}</div>`);afterRender();return}
  if(res&&typeof res.then==='function'){

async function buildStudentStats(){
  const allLogs=(await G('logs'))||{};
  const mine={};
  for(const vid in allLogs){
    if(allLogs[vid]&&allLogs[vid][U.uid])mine[vid]=allLogs[vid][U.uid];
  }
  const totalVideos=Object.keys(videos).length;
  const watchedCount=Object.keys(mine).length;
  const openedCount=Object.keys(mineVideos).length;
  const lockedCount=Math.max(0,totalVideos-openedCount);
  const summary=`<div class="stats-summary">
    <div class="stat-box"><div class="stat-num">${totalVideos}</div><div class="stat-label">إجمالي المحاضرات</div></div>
    <div class="stat-box ok"><div class="stat-num">${openedCount}</div><div class="stat-label">مفتوحة لك</div></div>
    <div class="stat-box warn"><div class="stat-num">${lockedCount}</div><div class="stat-label">تحتاج كود</div></div>
    <div class="stat-box"><div class="stat-num">${watchedCount}</div><div class="stat-label">حضرتها</div></div>
  </div>`;
  return `<div class="box"><h2>📊 إحصائياتي</h2>${summary}</div>`;
}

async function updateProfilePhoto(){
  const input=$('#profile-photo-input');

  try{
    toast('جارٍ رفع الصورة...');
    const data=await img(f,200);
    await update(R('users/'+U.uid),{photo:data});

async function changePassword(){
  const np=$('#new-pass').value,cp=$('#confirm-pass').value;
  if(np.length<6)return toast('كلمة المرور 6 أحرف على الأقل');
  if(np!==cp)return toast('كلمتا المرور غير متطابقتين');
  try{
    await updatePassword(auth.currentUser,np);
    toast('تم تغيير كلمة المرور');
    $('#new-pass').value='';$('#confirm-pass').value='';
  }catch(e){
    if(e.code==='auth/requires-recent-login')toast('سجّل الخروج ثم الدخول مرة أخرى');

  }

      if(open&&!isStaff&&v.duration>0&&myLogs[id]&&myLogs[id].seconds>0){

      }
      const isFav=favs.has(id);
      const favBtn=`<button class="s" style="padding:6px 8px;font-size:14px;background:transparent;color:${isFav?'var(--er)':'var(--mu)'}" onclick="event.stopPropagation();toggleFav('${esc(id)}')">${isFav?'❤️':'🤍'}</button>`;

        ${favBtn}
        <span class="b ${open?'g':''}">${label}</span>

    }).join('');
  });

function filterTeacherVideos(q){
  const query=String(q||'').toLowerCase().trim();
  document.querySelectorAll('.teacher-video-row').forEach(row=>{
    const txt=(row.getAttribute('data-search')||'').toLowerCase();
    row.style.display=(!query||txt.includes(query))?'':'none';
  });
  document.querySelectorAll('.grade-section').forEach(h=>{
    let next=h.nextElementSibling,hasVisible=false;
    while(next&&!next.classList.contains('grade-section')){
      if(next.classList.contains('teacher-video-row')&&next.style.display!=='none'){hasVisible=true;break}
      next=next.nextElementSibling;
    }
    h.style.display=hasVisible?'':'none';
  });
}

  </div>`;

function redeem(vid){return once('redeem',()=>doRedeem(vid))}
async function doRedeem(vid){
  const v=videos[vid];if(!v||v.disabled)return toast('الفيديو موقوف');
  const c=normDigits($('#cd').value).replace(/\D/g,'');
  if(!/^\d{6}$/.test(c))return toast('الكود 6 أرقام');
  try{
    const r=await runTransaction(R('codes/'+c),cur=>{
      if(cur===null)return cur;
      if(cur.videoId!==vid)return;
      if(cur.used&&cur.usedBy!==U.uid)return;
      if(!cur.used)Object.assign(cur,{used:true,usedBy:U.uid,usedByName:U.displayName||'',usedByEmail:U.email||'',usedAt:Date.now()});
      return cur;
    });
    const vv=r.snapshot.val();
    if(!vv||vv.usedBy!==U.uid||vv.videoId!==vid)return toast('الكود غير صحيح');
    await set(R(`users/${U.uid}/videos/${vid}`),c);
    mineVideos={...mineVideos,[vid]:c};
    go('watch',vid);
  }catch(e){toast('خطأ في التحقق')}
}

// ═══ المشاهدة ═══
async function vWatch(){
  const v=videos[S.id];if(!v)return vHome();
  const isStaff=A||IS_SUPERVISOR;
  if(v.disabled&&!isStaff)return`<div class="mut">الفيديو موقوف.</div>`;
  let c,rec;
  try{
    if(isStaff){c='admin';rec={url:v.url}}
    else{
      c=mineVideos[S.id]||(await G(`users/${U.uid}/videos/${S.id}`));
      if(!c)return vCode();
      rec=await G('codes/'+c);
      if(!rec||rec.usedBy!==U.uid||rec.videoId!==S.id){delete mineVideos[S.id];return vCode()}
    }
  }catch(e){return`<div class="mut">لا صلاحية.</div>`}
  const e=embed(rec.url);
  if(!e.s)return`<div class="mut">رابط غير صالح.</div>`;

  const lp=`logs/${S.id}/${U.uid}`;
  const old=isStaff?{}:((await G(lp))||{});
  let sec=old.seconds||0;
  const dur=(+v.duration||0)*60;
  stopHB();
  if(!isStaff){
    try{
      await update(R(lp),{name:U.displayName||'',email:U.email||'',code:c,openedAt:old.openedAt||Date.now(),lastAt:Date.now(),seconds:sec,completed:!!old.completed});
    }catch(err){}
    hb=setInterval(()=>{
      if(document.hidden||!isPlayingForTracking())return;
      sec+=10;
      const done=dur&&sec>=dur*.9;
      update(R(lp),{seconds:sec,lastAt:Date.now(),completed:!!(done||old.completed)}).catch(()=>{});
    },10000);
  }

  pendingEmbed={type:e.t,id:e.id||''};
  const wm=isStaff?'':`<div class="wm">${badge?`<img src="${esc(badge)}" alt="">`:''}${esc(U.displayName||'')} · ${esc(myPhone||'')}</div>`;
  const isYT=e.t==='yt';
  const isNative=e.t==='v';
  const hasCtrl=isYT||isNative;
  let playerHTML='';
  if(isNative)playerHTML=`<video id="vplayer" src="${esc(e.s)}" playsinline webkit-playsinline preload="metadata" disablepictureinpicture></video>`;
  else if(isYT)playerHTML=`<iframe id="vplayer" src="${esc(e.s)}" allow="autoplay; encrypted-media; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
  else playerHTML=`<iframe src="${esc(e.s)}" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;

  return `<button class="s" onclick="go('teacher','${esc(v.teacherId)}')">← رجوع</button>
  <h2 style="margin-top:14px">${esc(v.title)} ${isStaff?'<span class="b g">إدارة</span>':''}</h2>
  <div class="player-wrap" id="playerWrap">
    <div class="pl ${isYT?'is-yt':''} ${e.t==='drive'||e.t==='f'?'is-embed':''}">
      ${playerHTML}
      ${isYT?`<div class="end-cover" id="endCover"><button onclick="replayYT()">إعادة</button></div>`:''}
      ${wm}
    </div>
  </div>
  <p style="color:var(--tx2);margin-top:14px;line-height:1.7">${esc(v.desc||'')}</p>`;
}

function redeemLive(id){return once('redeemLive',()=>doRedeemLive(id))}
async function doRedeemLive(liveId){
  const l=liveStreams[liveId];if(!l||l.endedAt)return toast('البث غير متاح');
  const c=normDigits($('#lcd').value).replace(/\D/g,'');
  if(!/^\d{6}$/.test(c))return toast('الكود 6 أرقام');
  try{
    const r=await runTransaction(R('liveCodes/'+c),cur=>{
      if(cur===null)return cur;
      if(cur.liveId!==liveId)return;
      if(cur.used&&cur.usedBy!==U.uid)return;
      if(!cur.used)Object.assign(cur,{used:true,usedBy:U.uid,usedByName:U.displayName||'',usedAt:Date.now()});
      return cur;
    });
    const vv=r.snapshot.val();
    if(!vv||vv.usedBy!==U.uid||vv.liveId!==liveId)return toast('الكود غير صحيح');
    await set(R(`liveLogs/${liveId}/${U.uid}`),{name:U.displayName||'',joinedAt:Date.now()});
    go('liveRoom',liveId);
  }catch(e){toast('خطأ في التحقق')}
}

function joinWebRTC(l){
  setTimeout(()=>{
    try{
      if(typeof Peer==='undefined')return toast('PeerJS غير محمل');
      const peer=new Peer(null,{debug:0});
      peer.on('open',()=>{
        const call=peer.call('sigma-live-'+l.id,new MediaStream());
        const video=document.getElementById('liveVideo');
        call.on('stream',stream=>{if(video){video.srcObject=stream;video.play().catch(()=>{})}});
      });
      peer.on('error',()=>toast('تعذر الاتصال بالبث'));
      window._livePeer=peer;
    }catch(e){toast('WebRTC غير مدعوم')}
  },100);
  return '';
}

  const id='lv'+Date.now();

      id,title,grade,type,url,desc,scheduledAt,duration:120,
      active:scheduledAt<=Date.now(),startedAt:scheduledAt<=Date.now()?Date.now():null,
      endedAt:null,created:Date.now(),createdBy:U.displayName||'',createdByUid:U.uid
    });
    const n=Math.min((+$('#lvCodes').value)||0,500);
    if(n>0){toast('جارٍ التوليد...');await genLiveCodes(id,n)}
    if(notify){
      await set(R('notifications/all/'+Date.now()),{text:`🔴 بث مباشر: ${title}\n📅 ${fd(scheduledAt)}\n📚 ${grade}`,created:Date.now()});
    }
    toast('تم إنشاء البث ✅');
    go('admin','','live');
  }catch(e){toast('تعذر الحفظ: '+(e.code||e.message))}
}

async function genLiveCodes(liveId,n){
  let ok=0,attempts=0;
  while(ok<n&&attempts<n*10){
    const c=String(crypto.getRandomValues(new Uint32Array(1))[0]%900000+100000);
    try{
      const r=await runTransaction(R('liveCodes/'+c),cur=>cur===null?{liveId,used:false,createdAt:Date.now()}:undefined);
      if(r.committed)ok++;
    }catch(e){}
    attempts++;
  }
  return ok;
}

async function doCreateExam(){
  if(!A&&!IS_SUPERVISOR)return toast('غير مصرح');
  const title=document.getElementById('exTitle')?.value.trim()||'';
  const grade=document.getElementById('exGrade')?.value||'';
  const duration=Math.min(180,Math.max(1,(+document.getElementById('exDuration')?.value)||30));
  if(!title)return toast('اكتب عنوان');
  const questions=[];
  const items=document.querySelectorAll('.q-builder-item');
  if(!items.length)return toast('أضف سؤالاً');
  for(const item of items){
    const type=item.querySelector('.q-type').value;
    const text=item.querySelector('.q-text').value.trim();
    if(!text)return toast('كل سؤال يحتاج نصاً');
    if(type==='mcq'){
      const opts=[...item.querySelectorAll('.q-opt')].map(i=>i.value.trim());
      if(opts.some(o=>!o))return toast('كل خيارات MCQ مطلوبة');
      const c=item.querySelector('input[type=radio]:checked');
      if(!c)return toast('حدد الإجابة الصحيحة');
      questions.push({type:'mcq',text,options:opts,correct:parseInt(c.value,10)});
    }else if(type==='tf'){
      const ans=item.querySelector('.q-tf-answer').value==='true';
      questions.push({type:'tf',text,correct:ans});
    }else{
      const ans=item.querySelector('.q-short-answer').value.trim();
      questions.push({type:'short',text,correct:ans});
    }
  }
  try{
    const id='ex'+Date.now();
    await set(R('exams/'+id),{title,grade,duration,questions,created:Date.now(),createdBy:U.displayName||'',createdByUid:U.uid,disabled:false});

    go('admin','','exams');

}

let activeExamTimer=null,activeExamState=null;
function vTakeExam(){
  const e=exams[S.id];if(!e)return vExams();
  const att=examAttempts[S.id];
  if(att)return vExamResult();
  activeExamState={id:S.id,startedAt:Date.now(),violations:0,answers:{},submitted:false};
  const questions=e.questions||[];
  const prevent=ev=>{ev.preventDefault();return false};
  document.addEventListener('copy',prevent);
  document.addEventListener('paste',prevent);
  document.addEventListener('contextmenu',prevent);
  const onVis=()=>{if(document.hidden&&activeExamState&&!activeExamState.submitted){activeExamState.violations++;toast('⚠️ مخالفة: '+activeExamState.violations)}};
  document.addEventListener('visibilitychange',onVis);
  activeExamState._cleanup=()=>{
    document.removeEventListener('copy',prevent);
    document.removeEventListener('paste',prevent);
    document.removeEventListener('contextmenu',prevent);
    document.removeEventListener('visibilitychange',onVis);
  };
  const startMs=Date.now(),totalMs=e.duration*60*1000;
  if(activeExamTimer)clearInterval(activeExamTimer);
  activeExamTimer=setInterval(()=>{
    if(!activeExamState||activeExamState.submitted){clearInterval(activeExamTimer);return}
    const left=totalMs-(Date.now()-startMs);
    const t=document.getElementById('examTimer');
    if(t){
      t.querySelector('.time-big').textContent=fmtClock(Math.max(0,left/1000));
      t.classList.remove('warn','danger');
      if(left<=30000)t.classList.add('danger');
      else if(left<=120000)t.classList.add('warn');
    }
    if(left<=0){clearInterval(activeExamTimer);toast('⏰ انتهى الوقت');submitExam(true)}
  },250);

  const qHTML=questions.map((q,i)=>{
    if(q.type==='mcq')return `<div class="exam-q"><div class="q-text"><span class="q-num">${i+1}</span>${esc(q.text)}</div>${q.options.map((opt,idx)=>`<label class="exam-opt"><input type="radio" name="q_${i}" value="${idx}" onchange="recordAnswer(${i},${idx})"><span>${esc(opt)}</span></label>`).join('')}</div>`;
    if(q.type==='tf')return `<div class="exam-q"><div class="q-text"><span class="q-num">${i+1}</span>${esc(q.text)}</div><label class="exam-opt"><input type="radio" name="q_${i}" value="true" onchange="recordAnswer(${i},true)"><span>✔️ صح</span></label><label class="exam-opt"><input type="radio" name="q_${i}" value="false" onchange="recordAnswer(${i},false)"><span>❌ خطأ</span></label></div>`;
    return `<div class="exam-q"><div class="q-text"><span class="q-num">${i+1}</span>${esc(q.text)}</div><textarea placeholder="إجابتك..." oninput="recordAnswer(${i},this.value)" rows="3"></textarea></div>`;
  }).join('');

  return `<button class="s" onclick="confirmExitExam()" style="margin-bottom:16px">← خروج</button>
    <h2>${esc(e.title)}</h2>
    <div class="exam-timer" id="examTimer"><span>⏱ متبقي</span><span class="time-big">${fmtClock(e.duration*60)}</span></div>
    <div class="exam-vio" style="display:none" id="examVioBox">⚠️ المخالفات: <span id="examVioCount">0</span></div>
    ${qHTML}
    <button onclick="submitExam(false)" style="width:100%;padding:16px;font-size:16px;margin-top:16px">📤 تسليم</button>`;
}
function recordAnswer(i,val){
  if(!activeExamState)return;
  activeExamState.answers[i]=val;
  const box=document.getElementById('examVioBox');
  const cnt=document.getElementById('examVioCount');
  if(activeExamState.violations>0&&box){box.style.display='block';cnt.textContent=activeExamState.violations}
  document.querySelectorAll(`input[name="q_${i}"]`).forEach(inp=>{inp.closest('.exam-opt').classList.toggle('selected',inp.checked)});
}
function confirmExitExam(){
  if(!activeExamState)return go('exams');
  if(!confirm('الخروج؟ ستُلغى المحاولة.'))return;
  cleanupExam();go('exams');
}
function cleanupExam(){
  if(activeExamTimer){clearInterval(activeExamTimer);activeExamTimer=null}
  if(activeExamState&&activeExamState._cleanup){try{activeExamState._cleanup()}catch(e){}}
  activeExamState=null;
}
function submitExam(force){
  if(!activeExamState||activeExamState.submitted)return;
  if(!force&&!confirm('تسليم الامتحان؟'))return;
  activeExamState.submitted=true;
  const e=exams[activeExamState.id];if(!e)return cleanupExam();
  const questions=e.questions||[];
  let correct=0;
  const answers=[];
  questions.forEach((q,i)=>{
    const ans=activeExamState.answers[i];
    let ok=false;
    if(q.type==='mcq')ok=(ans===q.correct);
    else if(q.type==='tf')ok=(ans===q.correct);
    else ok=(String(ans||'').trim().toLowerCase()===String(q.correct||'').trim().toLowerCase()&&!!q.correct);
    if(ok)correct++;
    answers.push({q:i,ans:ans??null,correct:ok});
  });
  const score=questions.length?Math.round(correct/questions.length*100):0;
  const timeTaken=Math.round((Date.now()-activeExamState.startedAt)/1000);
  const attempt={studentUid:U.uid,studentName:U.displayName||'',score,answers,timeTaken,violations:activeExamState.violations,submittedAt:Date.now(),autoSubmit:!!force};
  try{
    update(R('exams/'+activeExamState.id+'/attempts/'+U.uid),attempt).catch(()=>{});
    set(R('examAttempts/'+U.uid+'/'+activeExamState.id),attempt).catch(()=>{});
  }catch(err){}
  cleanupExam();
  go('examResult',S.id);
}
function vExamResult(){
  const e=exams[S.id];if(!e)return vExams();
  const att=examAttempts[S.id]||{};
  const correct=att.answers?att.answers.filter(a=>a.correct).length:0;
  const total=(e.questions||[]).length;
  return `<button class="s" onclick="go('exams')" style="margin-bottom:16px">← رجوع</button>
    <div class="exam-result box"><h2>${esc(e.title)}</h2><div class="label">درجتك</div><div class="score">${att.score||0}%</div><div class="detail">${correct}/${total} صحيحة</div><div class="detail">⏱ ${fmtClock(att.timeTaken||0)}</div>${att.violations?`<div class="detail" style="color:var(--warn)">⚠️ ${att.violations} مخالفة</div>`:''}</div>`;
}

async function gen(vid,n,video){
  const v=video||videos[vid];if(!v)throw new Error('لا فيديو');
  let ok=0,attempts=0;
  while(ok<n&&attempts<n*10){
    const c=String(crypto.getRandomValues(new Uint32Array(1))[0]%900000+100000);
    try{
      const r=await runTransaction(R('codes/'+c),cur=>cur===null?{videoId:vid,url:v.url,title:v.title||'',used:false,createdAt:Date.now()}:undefined);
      if(r.committed)ok++;
    }catch(e){}
    attempts++;
  }
  return ok;
}

const cp=async t=>{
  try{
    if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(t)}
    else{const el=document.createElement('textarea');el.value=t;el.style.position='fixed';el.style.opacity='0';document.body.appendChild(el);el.select();document.execCommand('copy');el.remove()}
    toast('تم النسخ');
  }catch(e){toast('تعذر النسخ')}
};

async function vVid(){

  return `<button class="s" onclick="go('admin','','videos')">← رجوع</button><h2>${esc(v.title)}</h2>
  <div class="box">

}

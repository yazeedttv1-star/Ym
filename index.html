<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a1014">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Chat Pro</title>
<style>
/* ===== التوافق مع المتصفحات القديمة ===== */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:rgba(0,0,0,0);-webkit-touch-callout:none;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none}
html,body{height:100%;overflow:hidden;font-family:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;background:#0a1014;color:#e9edef;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;overscroll-behavior:none}
body{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-box-pack:center;-webkit-justify-content:center;-ms-flex-pack:center;justify-content:center;-webkit-box-align:center;-webkit-align-items:center;-ms-flex-align:center;align-items:center;height:100vh;height:100vh;height:100dvh}

/* أزرار قابلة للنقر */
button,a,[role="button"],.chat-item,.story-card,.user-search-item,.nav-btn,.dropdown-menu button,.context-menu button,.message,.call-item{cursor:pointer;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-ms-touch-action:manipulation;touch-action:manipulation}
button:active,.chat-item:active,.nav-btn:active,.story-card:active{opacity:.75}
input,textarea{-webkit-user-select:text;-moz-user-select:text;-ms-user-select:text;user-select:text}

/* الألوان */
.dark-bg{background:#111b21}
.green-header{background:#008069}
.green-light{background:#25d366}
.green-pale{background:#005c4b}
.border-color{border-color:#222d34}
.text-muted{color:#8696a0}

/* المصادقة */
.auth-screen{position:fixed;top:0;left:0;right:0;bottom:0;background:#008069;background:-webkit-linear-gradient(top left,#00a884,#008069,#005c4b);background:linear-gradient(to bottom right,#00a884,#008069,#005c4b);display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-box-pack:center;-webkit-justify-content:center;-ms-flex-pack:center;justify-content:center;-webkit-box-align:center;-webkit-align-items:center;-ms-flex-align:center;align-items:center;z-index:1000;padding:12px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.auth-screen.hidden{display:none}
.auth-box{background:#111b21;padding:20px 18px;border-radius:16px;width:100%;max-width:360px;box-shadow:0 20px 50px rgba(0,0,0,.35);margin:auto}
.auth-box .logo{width:56px;height:56px;background:#25d366;border-radius:16px;margin:0 auto 12px;line-height:56px;text-align:center;font-size:24px;color:#fff;font-weight:bold}
.auth-box h1{color:#e9edef;margin-bottom:3px;font-size:18px;text-align:center;font-weight:700}
.auth-box p.subtitle{color:#8696a0;margin-bottom:14px;font-size:11.5px;text-align:center}
.auth-tabs{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;background:#202c33;border-radius:10px;padding:3px;margin-bottom:14px}
.auth-tab{-webkit-box-flex:1;-webkit-flex:1;-ms-flex:1;flex:1;padding:8px;background:transparent;border:none;border-radius:7px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;color:#8696a0}
.auth-tab.active{background:#111b21;color:#00a884}
.auth-box .input-group{position:relative;margin-bottom:8px}
.auth-box .input-group i{position:absolute;top:50%;right:12px;margin-top:-6px;color:#8696a0;font-size:12px;pointer-events:none}
.auth-box input{width:100%;padding:10px 34px 10px 12px;border:2px solid #222d34;background:#111b21;color:#e9edef;border-radius:9px;font-size:13px;outline:none;text-align:right;font-family:inherit;line-height:1.4}
.auth-box input:focus{border-color:#00a884}

.required-avatar{width:80px;height:80px;border-radius:50%;background:#0a1014;border:2px dashed #222d34;margin:0 auto 12px;cursor:pointer;overflow:hidden;position:relative;text-align:center}
.required-avatar.filled{border-style:solid;border-color:#00a884}
.required-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.required-avatar i.fa-user{font-size:28px;color:#667781;line-height:76px}
.required-avatar input{display:none}
.required-avatar .overlay-hint{position:absolute;bottom:0;left:0;right:0;background:rgba(0,168,132,.8);color:#fff;font-size:9px;padding:2px 0;text-align:center}
.avatar-hint{font-size:10.5px;color:#8696a0;text-align:center;margin-bottom:12px}

.btn-primary{width:100%;padding:11px;background:#00a884;color:#fff;border:none;border-radius:9px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-primary:active{background:#008069}
.btn-primary:disabled{background:#b1b3b5;cursor:not-allowed}
.error-msg{background:rgba(234,0,56,.1);color:#ea0038;padding:8px 10px;border-radius:8px;font-size:11.5px;margin-bottom:10px;display:none;text-align:right;border-right:3px solid #ea0038;font-weight:500}
.error-msg.show{display:block}

/* التطبيق */
.app{width:100%;max-width:400px;height:100vh;background:#111b21;display:none;-webkit-box-orient:vertical;-webkit-box-direction:normal;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;overflow:hidden;position:relative;color:#e9edef}
.app.active{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex}
@media(min-width:900px){.app{max-width:1100px;height:92vh;border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.5)}}

.app-header{background:#202c33;color:#fff;padding:8px 10px;display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-box-align:center;-webkit-align-items:center;-ms-flex-align:center;align-items:center;height:46px;position:relative;z-index:30;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.app-header .menu-btn,.app-header .camera-btn{background:transparent;border:none;color:#fff;font-size:15px;cursor:pointer;padding:6px 8px;border-radius:50%;position:relative}
.app-header .menu-btn .notif-badge{position:absolute;top:2px;right:2px;background:#ea0038;color:#fff;font-size:9px;min-width:16px;height:16px;line-height:16px;text-align:center;border-radius:8px;font-weight:700;padding:0 4px;border:1.5px solid #202c33}
.app-header .logo-title{-webkit-box-flex:1;-webkit-flex:1;-ms-flex:1;flex:1;font-size:14px;font-weight:700;color:#fff;text-align:right;padding-right:6px}
.app-header .logo-title .logo-icon{display:inline-block;width:24px;height:24px;background:#25d366;border-radius:6px;line-height:24px;text-align:center;font-size:12px;margin-left:4px;vertical-align:middle}

.dropdown-menu{position:absolute;top:44px;left:10px;background:#111b21;border-radius:11px;box-shadow:0 8px 28px rgba(0,0,0,.5);padding:5px 0;min-width:190px;display:none;z-index:100;color:#e9edef;border:1px solid #222d34}
.dropdown-menu.show{display:block}
.dropdown-menu button{display:block;width:100%;padding:10px 14px;background:transparent;border:none;text-align:right;font-size:12.5px;cursor:pointer;font-family:inherit;color:#e9edef}
.dropdown-menu button:active{background:#182229}
.dropdown-menu button i{width:16px;text-align:center;color:#00a884;font-size:12px;margin-left:6px}
.dropdown-menu hr{border:none;border-top:1px solid #222d34;margin:4px 0}

.search-box{padding:6px 10px;background:#111b21;border-bottom:1px solid #222d34}
.search-box input{width:100%;padding:8px 30px 8px 10px;border:none;background:#202c33;color:#e9edef;border-radius:9px;font-size:12.5px;outline:none;text-align:right;font-family:inherit}
.search-box .search-icon{position:absolute;right:20px;top:50%;color:#8696a0;font-size:12px;margin-top:-6px;pointer-events:none}
.search-box .wrap{position:relative}

.sections{-webkit-box-flex:1;-webkit-flex:1;-ms-flex:1;flex:1;position:relative;overflow:hidden;background:#111b21}
.section{position:absolute;top:0;left:0;right:0;bottom:0;overflow-y:auto;display:none;-webkit-box-orient:vertical;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;-webkit-overflow-scrolling:touch}
.section.active{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex}

.chat-list{-webkit-box-flex:1;-webkit-flex:1;-ms-flex:1;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.chat-item{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-box-align:center;-webkit-align-items:center;-ms-flex-align:center;align-items:center;padding:9px 11px;cursor:pointer}
.chat-item:active{background:#182229}
.chat-item .avatar{width:42px;height:42px;background:#25d366;border-radius:50%;line-height:42px;text-align:center;color:#fff;font-weight:700;font-size:15px;overflow:hidden;position:relative;-webkit-box-flex:0;-webkit-flex:0 0 42px;-ms-flex:0 0 42px;flex:0 0 42px}
.chat-item .avatar img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
.chat-item .avatar .online-dot{position:absolute;bottom:1px;left:1px;width:10px;height:10px;background:#25d366;border-radius:50%;border:2px solid #111b21}
.chat-item .avatar.group-avatar{background:#128c7e;font-size:18px}
.chat-item .details{-webkit-box-flex:1;-webkit-flex:1;-ms-flex:1;flex:1;min-width:0;padding:0 9px;text-align:right}
.chat-item .details .name{font-weight:600;font-size:13px;color:#e9edef;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-item .details .last-msg{font-size:11.5px;color:#8696a0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.chat-item .meta{-webkit-box-flex:0;-webkit-flex:0 0 auto;-ms-flex:0 0 auto;flex:0 0 auto;text-align:left}
.chat-item .meta .time{font-size:10px;color:#8696a0;display:block}
.chat-item .meta .badge{background:#25d366;color:#fff;font-size:10px;min-width:17px;height:17px;line-height:17px;padding:0 5px;border-radius:9px;font-weight:700;display:inline-block;text-align:center;margin-top:2px}
.chat-item.group-chat{background:rgba(0,168,132,.06)}

.empty-state{padding:30px 16px;text-align:center;color:#8696a0;font-size:12px}
.empty-state .big-icon{font-size:38px;opacity:.3;margin-bottom:10px;display:block}

.fab{position:absolute;bottom:70px;left:14px;width:46px;height:46px;background:#00a884;border-radius:14px;border:none;color:#fff;font-size:17px;cursor:pointer;display:block;text-align:center;line-height:46px;padding:0;z-index:25;-webkit-transform:rotate(-5deg);transform:rotate(-5deg)}
.fab:active{background:#008069}

.stories-grid{padding:10px}
.story-card{width:calc(33.333% - 6px);display:inline-block;margin:3px;vertical-align:top;padding-bottom:133%;position:relative;border-radius:12px;overflow:hidden;cursor:pointer;background:#005c4b;background-size:cover;background-position:center;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.story-card:active{opacity:.85}
.story-card.add{background:rgba(0,168,132,.15);border:2px dashed rgba(0,168,132,.4);text-align:center;color:#00a884}
.story-card.add .plus{font-size:26px;margin-top:40px;display:block}
.story-card.add .add-label{font-size:10.5px;margin-top:3px;display:block}
.story-card .story-avatar{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.3);overflow:hidden;text-align:center;line-height:22px;font-weight:700;font-size:11px;color:#fff}
.story-card .story-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.story-card .story-name{position:absolute;bottom:6px;right:6px;left:6px;font-size:10.5px;font-weight:600;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.story-card .delete-story{position:absolute;top:5px;left:5px;width:22px;height:22px;background:rgba(0,0,0,.55);color:#fff;border-radius:50%;line-height:22px;text-align:center;font-size:9px;z-index:3;cursor:pointer}
.story-card .my-story-badge{position:absolute;top:5px;left:30px;background:#25d366;color:#fff;font-size:8.5px;padding:2px 6px;border-radius:7px;font-weight:700;z-index:3}

.call-section-title{padding:10px 12px 5px;font-size:10.5px;font-weight:700;color:#8696a0}
.call-item{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-box-align:center;-webkit-align-items:center;-ms-flex-align:center;align-items:center;padding:9px 11px;border-bottom:1px solid #222d34;cursor:pointer}
.call-item .avatar{width:40px;height:40px;border-radius:50%;background:#25d366;color:#fff;line-height:40px;text-align:center;font-weight:700;font-size:14px;overflow:hidden;-webkit-box-flex:0;-webkit-flex:0 0 40px;-ms-flex:0 0 40px;flex:0 0 40px}
.call-item .avatar img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
.call-item .info{-webkit-box-flex:1;-webkit-flex:1;-ms-flex:1;flex:1;padding:0 9px;text-align:right;min-width:0}
.call-item .info .name{font-weight:600;font-size:12.5px;color:#e9edef}
.call-item .info .meta{font-size:10.5px;color:#8696a0;margin-top:2px}

.chat-view{position:absolute;top:0;left:0;right:0;bottom:0;background:#0b141a;display:none;-webkit-box-orient:vertical;-webkit-box-direction:normal;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;z-index:40}
.chat-view.active{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex}
.chat-view .header{background:#202c33;color:#fff;padding:7px 9px;display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-box-align:center;-webkit-align-items:center;-ms-flex-align:center;align-items:center;height:42px}
.chat-view .header .back-btn{background:transparent;border:none;color:#fff;font-size:16px;cursor:pointer;padding:5px 8px}
.chat-view .header .avatar{width:32px;height:32px;border-radius:50%;background:#25d366;line-height:32px;text-align:center;color:#fff;font-weight:700;font-size:12px;overflow:hidden;cursor:pointer;-webkit-box-flex:0;-webkit-flex:0 0 32px;-ms-flex:0 0 32px;flex:0 0 32px}
.chat-view .header .avatar img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
.chat-view .header .info{-webkit-box-flex:1;-webkit-flex:1;-ms-flex:1;flex:1;padding:0 7px;min-width:0;cursor:pointer;text-align:right}
.chat-view .header .info .name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-view .header .info .status{font-size:9.5px;color:rgba(255,255,255,.75);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-view .header .icon-btn{background:transparent;border:none;color:#fff;font-size:14px;cursor:pointer;padding:6px 8px}

.selection-bar{position:absolute;top:0;left:0;right:0;background:#008069;color:#fff;padding:8px 10px;display:none;-webkit-box-align:center;-webkit-align-items:center;-ms-flex-align:center;align-items:center;z-index:60}
.selection-bar.show{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex}
.selection-bar .close-sel{background:transparent;border:none;color:#fff;font-size:16px;cursor:pointer;padding:4px 8px}
.selection-bar .count{-webkit-box-flex:1;-webkit-flex:1;-ms-flex:1;flex:1;font-weight:600;font-size:13px;padding:0 10px}
.selection-bar .action{background:transparent;border:none;color:#fff;font-size:14px;cursor:pointer;padding:6px 8px}

.messages-area{-webkit-box-flex:1;-webkit-flex:1;-ms-flex:1;flex:1;padding:12px 10px;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#0b141a}
.message-row{margin-bottom:5px;text-align:right}
.message-row.mine{text-align:right}
.message-row.other{text-align:left}
.message{display:inline-block;max-width:82%;padding:6px 9px 4px;border-radius:11px;font-size:12.5px;word-wrap:break-word;line-height:1.4;position:relative;cursor:pointer;text-align:right;vertical-align:top}
.message.mine{background:#005c4b;color:#e9edef}
.message.other{background:#202c33;color:#e9edef}
.message.selected{outline:2px solid #00a884;outline-offset:-2px}
.message .sender-name{font-size:11px;font-weight:700;color:#25d366;margin-bottom:2px;display:block}
.message .msg-meta{font-size:9.5px;color:#8696a0;margin-top:2px}
.message .check{font-size:10px;color:#53bdeb;margin-right:4px}
.message .check.read{color:#34b7f1}
.message .edited-tag{font-size:9px;color:#8696a0;font-style:italic;margin-right:3px}
.message .msg-text{display:block;word-wrap:break-word;overflow-wrap:break-word}
.message img.msg-image,.message video.msg-video{max-width:220px;width:100%;border-radius:7px;margin-bottom:3px;display:block}
.message .reply-preview{background:rgba(0,0,0,.2);border-right:3px solid #00a884;padding:4px 7px;border-radius:6px;margin-bottom:4px;font-size:10.5px;color:#8696a0}
.message .reply-preview .reply-name{font-weight:600;color:#00a884;font-size:10px;margin-bottom:1px}
.message .reaction-display{display:inline-block;background:#111b21;border-radius:11px;padding:1px 6px;font-size:14px;margin-top:3px;border:1px solid #222d34}

.date-separator{text-align:center;margin:5px 0}
.date-separator span{display:inline-block;background:#202c33;color:#8696a0;font-size:10px;padding:4px 10px;border-radius:8px;font-weight:500}

.audio-message{min-width:170px}
.audio-message .play-btn{width:30px;height:30px;border-radius:50%;background:#00a884;color:#fff;border:none;cursor:pointer;font-size:12px;padding:0;text-align:center;vertical-align:middle;margin-left:6px}
.audio-message .duration{font-size:10px;color:#8696a0;vertical-align:middle;margin-right:6px}
.audio-message .audio-progress{display:inline-block;width:100px;height:3px;background:rgba(255,255,255,.15);border-radius:3px;position:relative;vertical-align:middle;overflow:hidden}
.audio-message .audio-progress .fill{position:absolute;top:0;right:0;height:100%;width:0%;background:#00a884}

.input-area{background:#202c33;padding:6px 8px;border-top:1px solid #222d34;position:relative}
.input-area .input-row{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-box-align:center;-webkit-align-items:center;-ms-flex-align:center;align-items:center}
.input-area .icon-btn-sm{width:34px;height:34px;border-radius:50%;background:transparent;color:#8696a0;border:none;font-size:15px;cursor:pointer;padding:0;-webkit-box-flex:0;-webkit-flex:0 0 34px;-ms-flex:0 0 34px;flex:0 0 34px}
.input-area .icon-btn-sm:active{background:#182229;color:#00a884}
.input-area .icon-btn-sm.send-btn{background:#00a884;color:#fff;display:none}
.input-area .icon-btn-sm.send-btn.show{display:block}
.input-area .icon-btn-sm.mic-btn{background:#00a884;color:#fff}
.input-area .icon-btn-sm.mic-btn.recording{background:#ea0038}
.input-area .icon-btn-sm.mic-btn.hide{display:none}
.input-area input[type=text]{-webkit-box-flex:1;-webkit-flex:1;-ms-flex:1;flex:1;padding:8px 12px;border:none;border-radius:20px;outline:none;font-size:16px;background:#2a3942;color:#e9edef;text-align:right;font-family:inherit;margin:0 4px;min-width:0}

.recording-indicator{position:absolute;bottom:60px;right:12px;background:#ea0038;color:#fff;padding:7px 12px;border-radius:18px;font-size:11.5px;display:none;z-index:5}
.recording-indicator.show{display:block}
.recording-indicator .dot{display:inline-block;width:7px;height:7px;background:#fff;border-radius:50%;margin-left:5px;vertical-align:middle}

.reply-bar{display:none;background:#202c33;border-top:1px solid #222d34;padding:6px 10px}
.reply-bar.show{display:block}
.reply-bar .reply-content{border-right:3px solid #00a884;padding:3px 7px}
.reply-bar .reply-content .reply-name{font-size:10.5px;font-weight:600;color:#00a884;margin-bottom:1px}
.reply-bar .reply-content .reply-text{font-size:11.5px;color:#8696a0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reply-bar .close-reply{float:left;background:transparent;border:none;color:#8696a0;font-size:16px;cursor:pointer;padding:5px}

/* لوحة الإيموجي - تعمل كـ keyboard إضافي مع بقاء زر الإرسال */
.emoji-panel{background:#202c33;border-top:1px solid #222d34;display:none;height:200px;overflow:hidden;position:relative}
.emoji-panel.show{display:block}
.emoji-panel .emoji-cats{background:#111b21;border-bottom:1px solid #222d34;overflow-x:auto;white-space:nowrap;height:36px;padding:0 4px}
.emoji-panel .emoji-cats::-webkit-scrollbar{height:0;display:none}
.emoji-panel .cat-btn{background:transparent;border:none;font-size:18px;cursor:pointer;padding:6px 8px;opacity:.5;display:inline-block}
.emoji-panel .cat-btn.active{opacity:1;border-bottom:2px solid #00a884}
.emoji-panel .emoji-list{height:160px;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px}
.emoji-panel .emoji{display:inline-block;font-size:24px;cursor:pointer;padding:4px 6px;text-align:center;vertical-align:middle;line-height:1}

/* قائمة التفاعل */
.reaction-picker{position:fixed;background:#111b21;border-radius:24px;box-shadow:0 8px 28px rgba(0,0,0,.5);padding:6px 10px;display:none;z-index:200;border:1px solid #222d34;white-space:nowrap}
.reaction-picker.show{display:block}
.reaction-picker .r-emoji{font-size:22px;cursor:pointer;padding:4px;display:inline-block}
.reaction-picker .r-more{background:#202c33;border:none;color:#8696a0;font-size:14px;cursor:pointer;padding:6px 10px;border-radius:50%;margin-right:4px}

.context-menu{position:fixed;background:#111b21;border-radius:11px;box-shadow:0 8px 28px rgba(0,0,0,.5);padding:5px 0;min-width:180px;display:none;z-index:700;color:#e9edef;border:1px solid #222d34}
.context-menu.show{display:block}
.context-menu button{display:block;width:100%;padding:10px 14px;background:transparent;border:none;text-align:right;font-size:12.5px;cursor:pointer;font-family:inherit;color:#e9edef}
.context-menu button:active{background:#182229}
.context-menu button i{width:18px;text-align:center;font-size:13px;color:#8696a0;margin-left:8px}
.context-menu button.danger{color:#ea0038}
.context-menu button.danger i{color:#ea0038}

.bottom-nav{background:#202c33;height:54px;display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;border-top:1px solid #222d34}
.bottom-nav .nav-btn{-webkit-box-flex:1;-webkit-flex:1;-ms-flex:1;flex:1;background:transparent;border:none;color:#8696a0;font-size:10px;font-family:inherit;cursor:pointer;padding:6px 0;position:relative;text-align:center}
.bottom-nav .nav-btn.active{color:#00a884}
.bottom-nav .nav-btn .icon{display:block;font-size:16px;margin-bottom:2px}

.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);display:none;z-index:500;padding:14px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal-overlay.active{display:block}
.modal{background:#111b21;color:#e9edef;border-radius:15px;padding:18px;width:100%;max-width:380px;margin:60px auto;border:1px solid #222d34}
.modal h3{color:#e9edef;font-size:15px;margin-bottom:14px;text-align:center;font-weight:700}
.modal .profile-avatar{width:88px;height:88px;border-radius:50%;background:#00a884;line-height:88px;text-align:center;font-size:32px;color:#fff;font-weight:700;margin:0 auto 14px;overflow:hidden;position:relative;cursor:pointer}
.modal .profile-avatar img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
.modal .profile-avatar .edit-badge{position:absolute;bottom:0;left:0;width:26px;height:26px;background:#00a884;border-radius:50%;line-height:26px;text-align:center;border:2.5px solid #111b21;font-size:10px;color:#fff}
.modal .profile-avatar input{display:none}
.modal label{display:block;font-size:11.5px;color:#8696a0;margin-bottom:4px;margin-top:10px;font-weight:600}
.modal input[type=text],.modal input[type=tel],.modal input[type=email],.modal textarea{width:100%;padding:9px 12px;border:2px solid #222d34;background:#111b21;color:#e9edef;border-radius:9px;font-size:12.5px;outline:none;text-align:right;font-family:inherit}
.modal input:focus,.modal textarea:focus{border-color:#00a884}
.modal input:disabled{opacity:.6}
.modal .lang-options,.modal .theme-options{margin-top:5px}
.modal .lang-option,.modal .theme-option{display:inline-block;padding:9px 12px;background:#202c33;border:2px solid transparent;border-radius:9px;font-size:12px;cursor:pointer;text-align:center;font-family:inherit;color:#e9edef;font-weight:600;margin:2px}
.modal .lang-option.active,.modal .theme-option.active{border-color:#00a884;background:rgba(0,168,132,.1);color:#00a884}
.modal .btn-secondary{width:100%;padding:9px;background:#202c33;color:#e9edef;border:none;border-radius:9px;font-size:12.5px;cursor:pointer;font-family:inherit;margin-top:12px;font-weight:600}
.modal .user-search-item{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-box-align:center;-webkit-align-items:center;-ms-flex-align:center;align-items:center;padding:9px;border-radius:10px;cursor:pointer}
.modal .user-search-item .avatar{width:40px;height:40px;background:#00a884;border-radius:50%;line-height:40px;text-align:center;color:#fff;font-weight:700;font-size:14px;overflow:hidden;-webkit-box-flex:0;-webkit-flex:0 0 40px;-ms-flex:0 0 40px;flex:0 0 40px}
.modal .user-search-item .avatar img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
.modal .user-search-item .details{-webkit-box-flex:1;-webkit-flex:1;-ms-flex:1;flex:1;padding:0 9px;min-width:0;text-align:right}
.modal .user-search-item .details .name{font-weight:600;font-size:12.5px}
.modal .user-search-item .details .phone{font-size:11px;color:#8696a0;margin-top:1px}

.story-viewer{position:fixed;top:0;left:0;right:0;bottom:0;background:#000;z-index:800;display:none}
.story-viewer.active{display:block}
.story-viewer .progress-bar{position:absolute;top:10px;left:10px;right:10px;height:3px;background:rgba(255,255,255,.3);border-radius:3px;overflow:hidden;z-index:5}
.story-viewer .progress-bar .fill{height:100%;background:#fff;width:0%}
.story-viewer .story-header{position:absolute;top:20px;left:12px;right:12px;color:#fff;z-index:5;cursor:pointer}
.story-viewer .story-header .avatar{width:34px;height:34px;border-radius:50%;background:#25d366;line-height:30px;text-align:center;font-weight:700;overflow:hidden;border:2px solid #fff;display:inline-block;vertical-align:middle}
.story-viewer .story-header .avatar img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
.story-viewer .story-header .info{display:inline-block;vertical-align:middle;padding-right:9px}
.story-viewer .story-header .name{font-weight:600;font-size:13px}
.story-viewer .story-header .time{font-size:10.5px;opacity:.8}
.story-viewer .close-btn{position:absolute;top:20px;left:12px;background:rgba(0,0,0,.4);border:none;color:#fff;font-size:20px;cursor:pointer;z-index:10;padding:5px;border-radius:50%;width:32px;height:32px;line-height:22px;text-align:center}
.story-viewer .story-content{position:absolute;top:0;left:0;right:0;bottom:0;display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-box-pack:center;-webkit-justify-content:center;-ms-flex-pack:center;justify-content:center;-webkit-box-align:center;-webkit-align-items:center;-ms-flex-align:center;align-items:center;color:#fff;font-size:20px;padding:60px 24px;text-align:center;background:#00a884;word-wrap:break-word}
.story-viewer img,.story-viewer video{max-width:100%;max-height:100%;object-fit:contain}

.call-screen{position:fixed;top:0;left:0;right:0;bottom:0;background:#005c4b;z-index:900;display:none;color:#fff;padding:18px;text-align:center}
.call-screen.active{display:block}
.call-screen .call-avatar{width:110px;height:110px;border-radius:50%;background:#00a884;margin:80px auto 18px;line-height:110px;text-align:center;font-size:44px;font-weight:700;overflow:hidden;border:3px solid rgba(255,255,255,.15)}
.call-screen .call-avatar img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
.call-screen .call-name{font-size:20px;font-weight:700;margin-bottom:6px}
.call-screen .call-status{font-size:13px;opacity:.85;margin-bottom:8px}
.call-screen .call-timer{font-size:13px;opacity:.7;margin-bottom:30px}
.call-screen .call-actions{text-align:center}
.call-screen .call-actions button{width:56px;height:56px;border-radius:50%;border:none;font-size:20px;cursor:pointer;margin:0 11px;padding:0}
.call-screen .end-call{background:#ea0038;color:#fff}
.call-screen .mute-call{background:rgba(255,255,255,.18);color:#fff;border:2px solid rgba(255,255,255,.2)}
.call-screen .video-container{position:absolute;top:0;left:0;right:0;bottom:0;display:none}
.call-screen.video-call .video-container{display:block}
.call-screen.video-call .call-avatar,.call-screen.video-call .call-name,.call-screen.video-call .call-status,.call-screen.video-call .call-timer{display:none}
.call-screen .remote-video{width:100%;height:100%;object-fit:cover;background:#000}
.call-screen .local-video{position:absolute;top:16px;left:16px;width:80px;height:108px;object-fit:cover;border-radius:10px;border:2px solid rgba(255,255,255,.3);background:#000;z-index:2}

.notif-toast{position:fixed;top:12px;left:50%;margin-left:-170px;width:340px;max-width:calc(100% - 20px);background:#111b21;padding:10px 16px;border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.5);display:none;z-index:2000;border:1px solid #222d34}
.notif-toast.show{display:block}
.notif-toast .toast-avatar{width:38px;height:38px;border-radius:50%;background:#00a884;line-height:38px;text-align:center;color:#fff;font-weight:700;font-size:15px;overflow:hidden;float:right;margin-left:10px}
.notif-toast .toast-avatar img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
.notif-toast .toast-body{padding-right:48px}
.notif-toast .toast-body .toast-title{font-weight:700;font-size:12.5px}
.notif-toast .toast-body .toast-text{font-size:11.5px;color:#8696a0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}

/* إخفاء عناصر افتراضية */
.hidden{display:none !important}
</style>
</head>
<body>

<!-- توست الإشعار -->
<div class="notif-toast" id="notifToast">
  <div class="toast-avatar" id="toastAvatar">؟</div>
  <div class="toast-body">
    <div class="toast-title" id="toastTitle">رسالة جديدة</div>
    <div class="toast-text" id="toastText"></div>
  </div>
</div>

<!-- المصادقة -->
<div class="auth-screen" id="authScreen">
  <div class="auth-box">
    <div class="logo"><i class="fas fa-comments"></i></div>
    <h1>Chat Pro</h1>
    <p class="subtitle" id="formSubtitle">سجّل دخولك للانضمام</p>
    <div class="error-msg" id="errorMsg"></div>
    <div class="auth-tabs">
      <button class="auth-tab active" id="tabLogin" type="button">دخول</button>
      <button class="auth-tab" id="tabSignup" type="button">حساب جديد</button>
    </div>

    <div id="signupAvatarGroup" style="display:none;">
      <div class="required-avatar" id="requiredAvatar" onclick="document.getElementById('signupAvatarInput').click()">
        <i class="fas fa-user"></i>
        <div class="overlay-hint">اضغط للصورة</div>
        <input type="file" id="signupAvatarInput" accept="image/*">
      </div>
      <div class="avatar-hint">صورة البروفايل إجبارية <span style="color:#ea0038;">*</span></div>
    </div>

    <div class="input-group"><input type="email" id="emailInput" placeholder="البريد الإلكتروني"><i class="fas fa-envelope"></i></div>
    <div class="input-group"><input type="password" id="passwordInput" placeholder="كلمة المرور" minlength="6"><i class="fas fa-lock"></i></div>
    <div class="input-group" id="nameGroup" style="display:none;"><input type="text" id="displayNameInput" placeholder="الاسم الظاهر" maxlength="30"><i class="fas fa-user"></i></div>
    <div class="input-group" id="phoneGroup" style="display:none;"><input type="tel" id="phoneInput" placeholder="رقم الهاتف (إجباري)" maxlength="20"><i class="fas fa-phone"></i></div>

    <button class="btn-primary" id="authBtn" type="button">تسجيل الدخول</button>
  </div>
</div>

<!-- التطبيق -->
<div class="app" id="app">
  <div class="app-header" id="appHeader">
    <button class="menu-btn" id="menuBtn" type="button">
      <i class="fas fa-ellipsis-vertical"></i>
      <span class="notif-badge" id="headerBadge" style="display:none;">0</span>
    </button>
    <div class="logo-title"><span class="logo-icon">💬</span> Chat Pro</div>
    <button class="camera-btn" id="cameraBtn" type="button"><i class="fas fa-camera"></i></button>
    <div class="dropdown-menu" id="mainMenu">
      <button data-action="profile" type="button"><i class="fas fa-user-circle"></i> الملف الشخصي</button>
      <button data-action="readall" type="button"><i class="fas fa-check-double"></i> قراءة الكل</button>
      <button data-action="settings" type="button"><i class="fas fa-cog"></i> الإعدادات</button>
      <button data-action="enablenotif" type="button"><i class="fas fa-bell"></i> تفعيل الإشعارات</button>
      <hr>
      <button data-action="theme" type="button"><i class="fas fa-moon"></i> <span id="themeBtnText">الوضع الفاتح</span></button>
      <button data-action="logout" type="button"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</button>
    </div>
  </div>

  <div class="search-box" id="searchBox">
    <div class="wrap">
      <input type="text" id="searchInput" placeholder="ابحث في الدردشات...">
      <i class="fas fa-search search-icon"></i>
    </div>
  </div>

  <div class="sections" id="sections"></div>

  <div class="bottom-nav" id="bottomNav">
    <button class="nav-btn active" data-tab="chats" type="button"><span class="icon"><i class="fas fa-comment-dots"></i></span><span>الدردشات</span></button>
    <button class="nav-btn" data-tab="stories" type="button"><span class="icon"><i class="fas fa-circle-notch"></i></span><span>الاستوري</span></button>
    <button class="nav-btn" data-tab="calls" type="button"><span class="icon"><i class="fas fa-phone"></i></span><span>المكالمات</span></button>
  </div>

  <button class="fab" id="newChatFab" type="button"><i class="fas fa-pen"></i></button>

  <div class="chat-view" id="chatView">
    <div class="selection-bar" id="selectionBar">
      <button class="close-sel" id="closeSel" type="button"><i class="fas fa-times"></i></button>
      <span class="count" id="selCount">0 محدد</span>
      <button class="action" id="copySel" type="button"><i class="fas fa-copy"></i></button>
      <button class="action" id="deleteSel" type="button"><i class="fas fa-trash"></i></button>
    </div>

    <div class="header">
      <button class="back-btn" id="chatBack" type="button"><i class="fas fa-arrow-right"></i></button>
      <div class="avatar" id="chatAvatar"><i class="fas fa-user"></i></div>
      <div class="info" id="chatInfo">
        <div class="name" id="chatName">...</div>
        <div class="status" id="chatStatus">غير متصل</div>
      </div>
      <button class="icon-btn" id="startVoiceCall" type="button"><i class="fas fa-phone"></i></button>
      <button class="icon-btn" id="startVideoCall" type="button"><i class="fas fa-video"></i></button>
      <button class="icon-btn" id="chatMenuBtn" type="button"><i class="fas fa-ellipsis-vertical"></i></button>
      <div class="dropdown-menu" id="chatMenu">
        <button data-action="mute" type="button"><i class="fas fa-bell-slash"></i> <span id="muteChatText">كتم الإشعارات</span></button>
        <button data-action="clear" type="button"><i class="fas fa-trash"></i> مسح المحادثة</button>
      </div>
    </div>

    <div class="messages-area" id="messagesArea"></div>

    <div class="recording-indicator" id="recordingIndicator">
      <span class="dot"></span><span id="recordingTime">0:00</span>
    </div>

    <div class="reply-bar" id="replyBar">
      <div class="reply-content">
        <div class="reply-name" id="replyName"></div>
        <div class="reply-text" id="replyText"></div>
      </div>
      <button class="close-reply" id="closeReply" type="button"><i class="fas fa-times"></i></button>
    </div>

    <div class="emoji-panel" id="emojiPanel">
      <div class="emoji-cats" id="emojiCats"></div>
      <div class="emoji-list" id="emojiList"></div>
    </div>

    <div class="input-area">
      <div class="input-row">
        <button class="icon-btn-sm" id="emojiBtn" type="button"><i class="fas fa-face-smile"></i></button>
        <button class="icon-btn-sm" id="cameraChatBtn" type="button"><i class="fas fa-camera"></i></button>
        <input type="text" id="messageInput" placeholder="اكتب رسالة..." autocomplete="off">
        <button class="icon-btn-sm mic-btn" id="micBtn" type="button"><i class="fas fa-microphone"></i></button>
        <button class="icon-btn-sm send-btn" id="sendBtn" type="button"><i class="fas fa-paper-plane"></i></button>
        <input type="file" id="chatMediaInput" accept="image/*,video/*" style="display:none;">
      </div>
    </div>
  </div>
</div>

<div class="reaction-picker" id="reactionPicker">
  <span class="r-emoji" data-emoji="❤️">❤️</span>
  <span class="r-emoji" data-emoji="😂">😂</span>
  <span class="r-emoji" data-emoji="😮">😮</span>
  <span class="r-emoji" data-emoji="😢">😢</span>
  <span class="r-emoji" data-emoji="👍">👍</span>
  <span class="r-emoji" data-emoji="🙏">🙏</span>
</div>

<div class="context-menu" id="contextMenu"></div>

<div class="modal-overlay" id="profileModal">
  <div class="modal">
    <h3>الملف الشخصي</h3>
    <div class="profile-avatar" id="profileAvatar" onclick="document.getElementById('avatarInput').click()">
      <i class="fas fa-user"></i>
      <div class="edit-badge"><i class="fas fa-camera"></i></div>
      <input type="file" id="avatarInput" accept="image/*">
    </div>
    <label>الاسم</label>
    <input type="text" id="profileName" maxlength="30">
    <label>رقم الهاتف</label>
    <input type="tel" id="profilePhone" maxlength="20">
    <label>البريد الإلكتروني</label>
    <input type="email" id="profileEmail" disabled>
    <button class="btn-primary" id="saveProfileBtn" type="button" style="margin-top:14px;">حفظ التعديلات</button>
    <button class="btn-secondary" id="closeProfileBtn" type="button">إلغاء</button>
  </div>
</div>

<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h3>الإعدادات</h3>
    <label>لغة التطبيق</label>
    <div class="lang-options">
      <button class="lang-option active" data-lang="ar" type="button">🇸🇦 العربية</button>
      <button class="lang-option" data-lang="en" type="button">🇬🇧 English</button>
    </div>
    <label>المظهر</label>
    <div class="theme-options">
      <button class="theme-option" data-theme="light" type="button"><i class="fas fa-sun"></i> فاتح</button>
      <button class="theme-option active" data-theme="dark" type="button"><i class="fas fa-moon"></i> داكن</button>
    </div>
    <button class="btn-secondary" id="closeSettingsBtn" type="button" style="margin-top:14px;">إغلاق</button>
  </div>
</div>

<div class="modal-overlay" id="newChatModal">
  <div class="modal">
    <h3>ابحث عن مستخدم</h3>
    <p style="text-align:center;font-size:11.5px;color:#8696a0;margin-bottom:10px;">ابحث برقم الهاتف كاملاً</p>
    <input type="tel" id="userSearchInput" placeholder="01123456789" style="width:100%;padding:9px 12px;border:2px solid #222d34;background:#111b21;color:#e9edef;border-radius:9px;font-size:13px;outline:none;text-align:center;font-family:inherit;direction:ltr;">
    <div id="usersList" style="margin-top:10px;max-height:320px;overflow-y:auto;"></div>
    <button class="btn-secondary" id="closeNewChatBtn" type="button">إلغاء</button>
  </div>
</div>

<div class="modal-overlay" id="addStoryModal">
  <div class="modal">
    <h3>إضافة استوري</h3>
    <textarea id="storyTextInput" placeholder="اكتب نص الاستوري..." style="min-height:70px;resize:vertical;"></textarea>
    <label style="display:block;margin-top:10px;font-size:11.5px;color:#8696a0;font-weight:600;">أو اختر صورة/فيديو:</label>
    <input type="file" id="storyMediaInput" accept="image/*,video/*" style="margin-top:5px;font-size:11.5px;width:100%;color:#e9edef;">
    <div id="storyPreviewContainer" style="margin-top:8px;"></div>
    <button class="btn-primary" id="publishStoryBtn" type="button" style="margin-top:12px;">نشر</button>
    <button class="btn-secondary" id="closeStoryBtn" type="button">إلغاء</button>
  </div>
</div>

<div class="modal-overlay" id="editMsgModal">
  <div class="modal">
    <h3>تعديل الرسالة</h3>
    <textarea id="editMsgInput" style="min-height:80px;resize:vertical;"></textarea>
    <button class="btn-primary" id="saveEditBtn" type="button" style="margin-top:12px;">حفظ</button>
    <button class="btn-secondary" id="closeEditBtn" type="button">إلغاء</button>
  </div>
</div>

<div class="story-viewer" id="storyViewer">
  <div class="progress-bar"><div class="fill" id="storyProgress"></div></div>
  <button class="close-btn" id="closeStoryViewer" type="button"><i class="fas fa-times"></i></button>
  <div class="story-header" id="storyHeaderClick">
    <span class="avatar" id="storyAvatar">؟</span>
    <span class="info">
      <span class="name" id="storyName">...</span><br>
      <span class="time" id="storyTime">الآن</span>
    </span>
  </div>
  <div class="story-content" id="storyContent"></div>
</div>

<div class="call-screen" id="callScreen">
  <div class="video-container">
    <video class="remote-video" id="remoteVideo" autoplay playsinline></video>
    <video class="local-video" id="localVideo" autoplay playsinline muted></video>
  </div>
  <div class="call-avatar" id="callAvatar"><i class="fas fa-user"></i></div>
  <div class="call-name" id="callName">...</div>
  <div class="call-status" id="callStatus">جاري الاتصال...</div>
  <div class="call-timer" id="callTimer"></div>
  <div class="call-actions">
    <button class="mute-call" id="muteCall" type="button"><i class="fas fa-microphone"></i></button>
    <button class="end-call" id="endCall" type="button"><i class="fas fa-phone-slash"></i></button>
  </div>
</div>

<div class="modal-overlay" id="incomingCallModal">
  <div class="modal" style="text-align:center;">
    <div style="font-size:48px;color:#25d366;margin-bottom:12px;"><i class="fas fa-phone-volume"></i></div>
    <h3 id="incomingCallerName">...</h3>

function $(id){ return document.getElementById(id); }
function on(el, ev, fn){
  if(!el) return;
  if(el.addEventListener){ el.addEventListener(ev, fn, false); }
  else if(el.attachEvent){ el.attachEvent('on' + ev, fn); }
}
function addClass(el, c){ if(el && el.className.indexOf(c) === -1) el.className += ' ' + c; }
function removeClass(el, c){ if(el) el.className = el.className.replace(new RegExp('(^|\\s)' + c + '(\\s|$)','g'), ' ').replace(/^\s+|\s+$/g,''); }
function hasClass(el, c){ return el && new RegExp('(^|\\s)' + c + '(\\s|$)').test(el.className); }
function toggleClass(el, c, force){
  if(!el) return;
  if(typeof force === 'boolean'){
    if(force) addClass(el, c); else removeClass(el, c);
  } else {
    if(hasClass(el, c)) removeClass(el, c); else addClass(el, c);
  }
}
function escapeHtml(t){
  if(t === null || t === undefined) return '';
  return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* ============ bindTap متوافق ============ */
function bindTap(el, fn){
  if(!el || el.__tapBound) return;
  el.__tapBound = true;
  var lastTouch = 0;
  var touchHandler = function(e){
    lastTouch = new Date().getTime();
    if(e.preventDefault) e.preventDefault();
    fn(e);
  };
  var clickHandler = function(e){
    if(new Date().getTime() - lastTouch < 500) return;
    fn(e);
  };
  if('ontouchstart' in window){
    on(el, 'touchend', touchHandler);
  }
  on(el, 'click', clickHandler);
}

/* ============ التشفير المبسط (XOR + Base64) للأجهزة القديمة ============ */
function simpleEncrypt(text, key){
  try {
    var k = key || '';
    if(!k) return text;
    var result = '';
    for(var i = 0; i < text.length; i++){
      var c = text.charCodeAt(i);
      var kc = k.charCodeAt(i % k.length);
      result += String.fromCharCode(c ^ kc);
    }
    return b64EncodeUnicode(result);
  } catch(e){ return text; }
}
function simpleDecrypt(enc, key){
  try {
    if(!enc) return '';
    var k = key || '';
    if(!k) return enc;
    var text = b64DecodeUnicode(enc);
    var result = '';
    for(var i = 0; i < text.length; i++){
      var c = text.charCodeAt(i);
      var kc = k.charCodeAt(i % k.length);
      result += String.fromCharCode(c ^ kc);
    }
    return result;
  } catch(e){ return enc; }
}
function b64EncodeUnicode(str){
  try {
    return btoa(unescape(encodeURIComponent(str)));
  } catch(e){
    // fallback للأجهزة القديمة جداً
    var out = '';
    for(var i = 0; i < str.length; i++){
      out += String.fromCharCode(str.charCodeAt(i) & 0xFF);
    }
    return btoa(out);
  }
}
function b64DecodeUnicode(str){
  try {
    return decodeURIComponent(escape(atob(str)));
  } catch(e){
    return atob(str);
  }
}

/* ============ ضغط الصور (بدون Canvas.toBlob للأجهزة القديمة) ============ */
function compressImage(file, maxSize, quality, callback){
  maxSize = maxSize || 800;
  quality = quality || 0.7;
  var reader = new FileReader();
  reader.onload = function(e){
    var img = new Image();
    img.onload = function(){
      try {
        var canvas = document.createElement('canvas');
        var w = img.width, h = img.height;
        if(w > maxSize || h > maxSize){
          if(w > h){ h = Math.round((h / w) * maxSize); w = maxSize; }
          else { w = Math.round((w / h) * maxSize); h = maxSize; }
        }
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        var dataUrl = canvas.toDataURL('image/jpeg', quality);
        callback(null, dataUrl);
      } catch(err){
        // fallback: استخدام الصورة الأصلية
        callback(null, e.target.result);
      }
    };
    img.onerror = function(){ callback('فشل تحميل الصورة', null); };
    img.src = e.target.result;
  };
  reader.onerror = function(){ callback('فشل قراءة الملف', null); };
  reader.readAsDataURL(file);
}
function compressAvatar(file, callback){
  compressImage(file, 150, 0.7, callback);
}

var currentEmojiCat = 0;

function buildEmojiCats(){
  var cats = $('emojiCats');
  var html = '';
  for(var i = 0; i < EMOJI_CATEGORIES.length; i++){
    html += '<button type="button" class="cat-btn' + (i === currentEmojiCat ? ' active' : '') + '" data-cat="' + i + '">' + EMOJI_CATEGORIES[i].icon + '</button>';
  }
  cats.innerHTML = html;
  var btns = cats.querySelectorAll('.cat-btn');
  for(var j = 0; j < btns.length; j++){
    bindTap(btns[j], (function(btn){
      return function(){
        currentEmojiCat = parseInt(btn.getAttribute('data-cat'), 10);
        var all = cats.querySelectorAll('.cat-btn');
        for(var k = 0; k < all.length; k++) toggleClass(all[k], 'active', parseInt(all[k].getAttribute('data-cat'),10) === currentEmojiCat);
        renderEmojiList();
      };
    })(btns[j]));
  }
}
function renderEmojiList(){
  var list = $('emojiList');
  var cat = EMOJI_CATEGORIES[currentEmojiCat];
  if(!cat) return;
  var html = '';
  for(var i = 0; i < cat.emojis.length; i++){
    html += '<span class="emoji" data-emoji="' + cat.emojis[i] + '">' + cat.emojis[i] + '</span>';
  }
  list.innerHTML = html;
  var els = list.querySelectorAll('.emoji');
  for(var j = 0; j < els.length; j++){
    bindTap(els[j], (function(el){
      return function(){
        var inp = $('messageInput');
        inp.value += el.getAttribute('data-emoji');
        inp.focus();
        inp.dispatchEvent(new Event('input'));
      };
    })(els[j]));
  }
}
function toggleEmojiPanel(){
  var p = $('emojiPanel');
  if(hasClass(p, 'show')){
    removeClass(p, 'show');
    $('messageInput').focus();
  } else {
    buildEmojiCats();
    renderEmojiList();
    addClass(p, 'show');
    // عدم مسح حقل الرسالة - يبقى ظاهراً
  }
}

/* ============ الملف الشخصي ============ */
function openProfileModal(){
  if(!currentUserData) return;
  $('profileName').value = currentUserData.name || '';
  $('profilePhone').value = currentUserData.phone || '';
  $('profileEmail').value = currentUserData.email || '';
  var el = $('profileAvatar');
  var inputHtml = '<input type="file" id="avatarInput" accept="image/*">';
  if(currentUserData.photoURL){
    el.innerHTML = '<img src="' + currentUserData.photoURL + '"><div class="edit-badge"><i class="fas fa-camera"></i></div>' + inputHtml;
  } else {
    el.innerHTML = '<i class="fas fa-user"></i><div class="edit-badge"><i class="fas fa-camera"></i></div>' + inputHtml;
  }
  on($('avatarInput'), 'change', handleAvatarChange);
  addClass($('profileModal'), 'active');
}
function handleAvatarChange(e){
  var file = e.target.files[0];
  if(!file) return;
  compressAvatar(file, function(err, b64){
    if(err){ alert('فشل معالجة الصورة'); return; }
    pendingAvatarBase64 = b64;
    var el = $('profileAvatar');
    el.innerHTML = '<img src="' + b64 + '"><div class="edit-badge"><i class="fas fa-camera"></i></div><input type="file" id="avatarInput" accept="image/*">';
    on($('avatarInput'), 'change', handleAvatarChange);
  });
}
function saveProfile(){
  var name = trim($('profileName').value);
  var phone = trim($('profilePhone').value);
  if(name.length < 2) return alert('أدخل اسماً صحيحاً');
  if(!phone || phone.length < 6) return alert('رقم الهاتف إجباري');
  var updates = { name: name, phone: phone };
  if(pendingAvatarBase64){ updates.photoURL = pendingAvatarBase64; updates.customPhoto = true; }
  db.ref('users/' + currentUser.uid).update(updates).then(function(){
    if(currentUser) currentUser.updateProfile({displayName: name});
    loadCurrentUserData(function(){
      loadAllUsers(function(){
        pendingAvatarBase64 = null;
        alert('✅ تم حفظ التعديلات');
        removeClass($('profileModal'), 'active');
      });
    });
  }).catch(function(){ alert('فشل الحفظ'); });
}

/* ============ الكاميرا ============ */
function openCameraForChat(){
  var input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*,video/*';
  try { input.capture = 'environment'; } catch(e){}
  input.onchange = function(e){
    var file = e.target.files[0];
    if(!file) return;
    if(currentChatUser || currentChatMode === 'room') sendMediaToChat(file);
    else alert('افتح محادثة أولاً');
  };
  input.click();
}

function filterChats(q){
  q = trim(q).toLowerCase();
  var items = document.querySelectorAll('.chat-item');
  for(var i = 0; i < items.length; i++){
    var el = items[i];
    var name = (el.getAttribute('data-name') || '').toLowerCase();
    var phone = (el.getAttribute('data-phone') || '');
    var isRoom = el.id === 'yezidRoomItem' && 'يزيد'.indexOf(q) !== -1;
    var match = name.indexOf(q) !== -1 || phone.indexOf(q) !== -1 || isRoom || q === '';
    el.style.display = match ? '' : 'none';
  }
}

/* ============ غرفة يزيد ============ */
function loadRoomData(){
  if(unsubRoomMessages) unsubRoomMessages();
  unsubRoomMessages = db.ref('rooms/' + ROOM_ID + '/messages').limitToLast(1).on('value', function(snap){
    var val = snap.val() || {};
    var keys = Object.keys(val);
    if(!keys.length){
      $('roomLastMsg').textContent = 'اضغط للدخول إلى الغرفة';
      $('roomTime').textContent = '';
      return;
    }
    var lastMsg = val[keys[keys.length - 1]];
    if(lastMsg){
      var text = '📎 مرفق';
      if(lastMsg.type === 'audio') text = '🎤 رسالة صوتية';
      else if(lastMsg.type === 'image') text = '📷 صورة';
      else if(lastMsg.type === 'video') text = '🎥 فيديو';
      else if(lastMsg.text){
        var decrypted = simpleDecrypt(lastMsg.text, ROOM_ID);
        text = (lastMsg.senderName || '') + ': ' + decrypted;
      }
      $('roomLastMsg').textContent = text.substring(0, 50);
      $('roomTime').textContent = formatTimeShort(new Date(lastMsg.timestamp));
    }
  });
}

function openRoomChat(){
  currentChatMode = 'room';
  currentChatUser = null;
  $('chatName').textContent = ROOM_NAME;
  $('chatAvatar').innerHTML = '👥';
  addClass($('chatAvatar'), 'group-avatar');
  $('chatStatus').textContent = '...';
  addClass($('chatView'), 'active');
  $('startVoiceCall').style.display = 'none';
  $('startVideoCall').style.display = 'none';
  if(unsubRoomOnline) unsubRoomOnline();
  unsubRoomOnline = db.ref('onlineUsers').on('value', function(snap){
    var v = snap.val() || {};
    var count = Object.keys(v).length;
    $('chatStatus').textContent = count + ' متصل الآن';
  });
  loadRoomMessages();
}
function loadRoomMessages(){
  if(unsubMessages) unsubMessages();
  var area = $('messagesArea');
  area.innerHTML = '';
  roomMessages = {};
  renderedMsgIds = {};
  roomSelectedMessages = {};
  exitSelectionMode();
  unsubMessages = db.ref('rooms/' + ROOM_ID + '/messages').limitToLast(200).on('value', function(snap){
    var val = snap.val() || {};
    var keys = Object.keys(val);
    if(!keys.length){
      area.innerHTML = '<div class="empty-state"><div class="big-icon"><i class="fas fa-comments"></i></div>لا توجد رسائل بعد</div>';
      return;
    }
    var placeholder = area.querySelector('.empty-state');
    if(placeholder && placeholder.parentNode) placeholder.parentNode.removeChild(placeholder);
    roomMessages = val;
    var lastDate = '';
    var lastSep = area.querySelector('.date-separator:last-of-type span');
    if(lastSep) lastDate = lastSep.textContent;
    var hasNew = false;
    for(var i = 0; i < keys.length; i++){
      var key = keys[i];
      var data = val[key];
      if(!data) continue;
      if(data.deletedFor && data.deletedFor[currentUser.uid]) continue;
      if(renderedMsgIds[key]){
        updateExistingMessage(key, data);
      } else {
        renderedMsgIds[key] = true;
        var d = new Date(data.timestamp);
        var dateStr = formatDate(d);
        if(dateStr !== lastDate){
          var sep = document.createElement('div');
          sep.className = 'date-separator';
          sep.innerHTML = '<span>' + dateStr + '</span>';
          area.appendChild(sep);
          lastDate = dateStr;
        }
        var el = createMessageEl(key, data, ROOM_ID, 'room', true);
        area.appendChild(el);
        hasNew = true;
      }
    }
    if(hasNew){
      area.scrollTop = area.scrollHeight;
      if(initialLoadDone){
        var lastKey = keys[keys.length - 1];
        var lastMsg = val[lastKey];
        if(lastMsg && lastMsg.senderId !== currentUser.uid){
          playNotifSound();
          showNotification(lastMsg.senderName || 'مستخدم', 'رسالة جديدة في غرفة ' + ROOM_NAME);
        }
      }
    }
    if(!initialLoadDone) setTimeout(function(){ initialLoadDone = true; }, 2000);
  });
}

/* ============ عنصر الرسالة ============ */
function createMessageEl(key, data, chatId, mode, group){
  var isMine = data.senderId === currentUser.uid;
  var msgDate = new Date(data.timestamp);
  var row = document.createElement('div');
  row.className = 'message-row ' + (isMine ? 'mine' : 'other');
  row.setAttribute('data-msg-id', key);
  var msg = document.createElement('div');
  msg.className = 'message ' + (isMine ? 'mine' : 'other');
  msg.setAttribute('data-msg-id', key);
  var html = '';
  if(data.deletedForAll){
    html = '<div style="font-style:italic;opacity:.6;"><i class="fas fa-ban"></i> تم حذف هذه الرسالة</div><div class="msg-meta"><span>' + formatTime(msgDate) + '</span></div>';
    msg.innerHTML = html;
  } else {
    if(group && !isMine) html += '<span class="sender-name">' + escapeHtml(data.senderName || 'مستخدم') + '</span>';
    if(data.replyTo){
      var rn = data.replyTo.senderId === currentUser.uid ? 'أنت' : (mode === 'room' ? (data.replyTo.senderName || 'مستخدم') : (currentChatUser ? currentChatUser.name : 'مستخدم'));
      var rt = '📎 مرفق';
      if(data.replyTo.type === 'audio') rt = '🎤 رسالة صوتية';
      else if(data.replyTo.type === 'image') rt = '📷 صورة';
      else if(data.replyTo.type === 'video') rt = '🎥 فيديو';
      else if(data.replyTo.text){
        try { rt = simpleDecrypt(data.replyTo.text, chatId); } catch(e){}
      }
      html += '<div class="reply-preview"><div class="reply-name">' + escapeHtml(rn) + '</div><div>' + escapeHtml(rt).substring(0,80) + '</div></div>';
    }
    if(data.type === 'audio' && data.audio){
      html += '<div class="audio-message"><button type="button" class="play-btn audio-play-btn" data-audio="' + escapeHtml(data.audio) + '"><i class="fas fa-play"></i></button><span class="duration">' + formatDuration(data.duration || 0) + '</span><span class="audio-progress"><span class="fill"></span></span></div>';
    } else if(data.type === 'image' && data.media){
      html += '<div class="media-loading" style="padding:15px;color:#8696a0;font-size:11px;">⏳ صورة...</div>';
    } else if(data.type === 'video' && data.media){
      html += '<div class="media-loading" style="padding:15px;color:#8696a0;font-size:11px;">⏳ فيديو...</div>';
    } else if(data.text){
      var text = simpleDecrypt(data.text, chatId);
      html += '<span class="msg-text">' + escapeHtml(text) + '</span>';
    }
    var isRead = data.readBy && Object.keys(data.readBy).some(function(k){ return k !== currentUser.uid; });
    var check = isMine ? '<span class="check ' + (isRead?'read':'') + '"><i class="fas fa-check' + (isRead?'-double':'') + '"></i></span>' : '';
    var editedTag = data.edited ? '<span class="edited-tag">(تم التعديل)</span>' : '';
    var timeStr = '<span>' + formatTime(msgDate) + '</span>';
    html += '<div class="msg-meta">' + timeStr + editedTag + check + '</div>';
    // التفاعلات
    if(data.reactions){
      var counts = {};
      var rkeys = Object.keys(data.reactions);
      for(var ri = 0; ri < rkeys.length; ri++){
        var e = data.reactions[rkeys[ri]];
        counts[e] = (counts[e] || 0) + 1;
      }
      var ckeys = Object.keys(counts);
      if(ckeys.length){
        var reactStr = '';
        for(var ci = 0; ci < ckeys.length; ci++){
          reactStr += ckeys[ci] + (counts[ckeys[ci]] > 1 ? counts[ckeys[ci]] : '');
        }
        html += '<div class="reaction-display">' + reactStr + '</div>';
      }
    }
    msg.innerHTML = html;
    // فك تشفير المرفقات
    if((data.type === 'image' || data.type === 'video') && data.media){
      (function(msgEl){
        try {
          var buf = b64DecodeUnicode(data.media);
          var url = 'data:' + (data.mime || 'image/jpeg') + ';base64,' + data.media;
          var loading = msgEl.querySelector('.media-loading');
          if(loading){
            if(data.type === 'image'){
              loading.outerHTML = '<img class="msg-image" src="' + url + '">';
            } else {
              loading.outerHTML = '<video class="msg-video" src="' + url + '" controls></video>';
            }
          }
        } catch(e){
          var loading2 = msgEl.querySelector('.media-loading');
          if(loading2) loading2.textContent = '[فشل تحميل]';
        }
      })(msg);
    }
  }
  row.appendChild(msg);
  attachLongPress(msg, key, mode);
  return row;
}

function updateExistingMessage(key, data){
  var el = document.querySelector('.message[data-msg-id="' + key + '"]');
  if(!el) return;
  if(data.deletedForAll && el.innerHTML.indexOf('fa-ban') === -1){
    el.innerHTML = '<div style="font-style:italic;opacity:.6;"><i class="fas fa-ban"></i> تم حذف هذه الرسالة</div><div class="msg-meta"><span>' + formatTime(new Date(data.timestamp)) + '</span></div>';
  }
  // التفاعلات
  var reactStr = '';
  if(data.reactions){
    var counts = {};
    var keys = Object.keys(data.reactions);
    for(var i = 0; i < keys.length; i++){
      var e = data.reactions[keys[i]];
      counts[e] = (counts[e] || 0) + 1;
    }
    var ckeys = Object.keys(counts);
    for(var j = 0; j < ckeys.length; j++){
      reactStr += ckeys[j] + (counts[ckeys[j]] > 1 ? counts[ckeys[j]] : '');
    }
  }
  var existing = el.querySelector('.reaction-display');
  if(reactStr){
    if(existing) existing.innerHTML = reactStr;
    else el.insertAdjacentHTML('beforeend', '<div class="reaction-display">' + reactStr + '</div>');
  } else if(existing){
    existing.parentNode.removeChild(existing);
  }
}

/* ============ المحادثات الخاصة ============ */
function loadMyChats(){
  if(unsubChats) unsubChats();
  loadRoomData();
  unsubChats = db.ref('userChats/' + currentUser.uid).on('value', function(snap){
    renderChats(snap.val() || {});
  });
}
function renderChats(chats){
  var container = $('privateChatsContainer');
  if(!container) return;
  var ids = Object.keys(chats);
  if(!ids.length){ container.innerHTML = ''; return; }
  db.ref('onlineUsers').once('value').then(function(onlineSnap){
    var online = onlineSnap.val() || {};
    var results = [];
    var pending = ids.length;
    ids.forEach(function(otherId){
      var otherUser = allUsers[otherId] || {name:'مستخدم', uid: otherId};
      var chatId = getChatId(currentUser.uid, otherId);
      db.ref('chats/' + chatId + '/messages').limitToLast(1).once('value').then(function(msgSnap){
        var lastMsg = null;
        if(msgSnap.exists()){
          var vals = msgSnap.val();
          var vkeys = Object.keys(vals);
          lastMsg = vals[vkeys[vkeys.length - 1]];
        }
        db.ref('chats/' + chatId + '/unread/' + currentUser.uid).once('value').then(function(unreadSnap){
          var unread = unreadSnap.exists() ? unreadSnap.val() : 0;
          results.push({otherUser: otherUser, lastMsg: lastMsg, unread: unread, chatId: chatId, isOnline: !!online[otherId]});
          pending--;
          if(pending === 0) finishRenderChats(results);
        });
      });
    });
  });
}
function finishRenderChats(results){
  var container = $('privateChatsContainer');
  results.sort(function(a,b){ return (b.lastMsg ? b.lastMsg.timestamp : 0) - (a.lastMsg ? a.lastMsg.timestamp : 0); });
  var html = '';
  for(var i = 0; i < results.length; i++){
    var r = results[i];
    var name = r.otherUser.name || 'مستخدم';
    var initial = name.charAt(0).toUpperCase();
    var avatarHtml = r.otherUser.photoURL ? '<img src="' + r.otherUser.photoURL + '">' : initial;
    var dot = r.isOnline ? '<span class="online-dot"></span>' : '';
    var lastText = 'اضغط للمحادثة';
    if(r.lastMsg){
      if(r.lastMsg.deletedForAll) lastText = '🚫 رسالة محذوفة';
      else if(r.lastMsg.type === 'audio') lastText = '🎤 رسالة صوتية';
      else if(r.lastMsg.type === 'image') lastText = '📷 صورة';
      else if(r.lastMsg.type === 'video') lastText = '🎥 فيديو';
      else if(r.lastMsg.text) lastText = simpleDecrypt(r.lastMsg.text, r.chatId);
    }
    var time = r.lastMsg ? formatTimeShort(new Date(r.lastMsg.timestamp)) : '';
    var badge = r.unread > 0 ? '<span class="badge">' + r.unread + '</span>' : '';
    html += '<div class="chat-item" data-uid="' + r.otherUser.uid + '" data-name="' + escapeHtml(name) + '" data-photo="' + (r.otherUser.photoURL || '') + '" data-phone="' + (r.otherUser.phone || '') + '">' +
      '<div class="avatar">' + avatarHtml + dot + '</div>' +
      '<div class="details"><div class="name">' + escapeHtml(name) + '</div>' +
      '<div class="last-msg">' + escapeHtml(lastText).substring(0, 50) + '</div></div>' +
      '<div class="meta"><span class="time">' + time + '</span>' + badge + '</div>' +
      '</div>';
  }
  container.innerHTML = html;
  var items = container.querySelectorAll('.chat-item');
  for(var j = 0; j < items.length; j++){
    bindTap(items[j], (function(el){
      return function(){ openChat(el.getAttribute('data-uid'), el.getAttribute('data-name'), el.getAttribute('data-photo')); };
    })(items[j]));
  }
}

/* ============ الرسائل الخاصة ============ */
function loadChatMessages(otherUid){
  if(unsubMessages) unsubMessages();
  var chatId = getChatId(currentUser.uid, otherUid);
  var area = $('messagesArea');
  area.innerHTML = '';
  currentMessages = {};
  renderedMsgIds = {};
  selectedMessages = {};
  exitSelectionMode();
  unsubMessages = db.ref('chats/' + chatId + '/messages').limitToLast(200).on('value', function(snap){
    var val = snap.val() || {};
    var keys = Object.keys(val);
    if(!keys.length){
      area.innerHTML = '<div class="empty-state"><div class="big-icon"><i class="fas fa-comments"></i></div>ابدأ المحادثة بإرسال رسالة</div>';
      return;
    }
    var placeholder = area.querySelector('.empty-state');
    if(placeholder && placeholder.parentNode) placeholder.parentNode.removeChild(placeholder);
    currentMessages = val;
    var lastDate = '';
    var lastSep = area.querySelector('.date-separator:last-of-type span');
    if(lastSep) lastDate = lastSep.textContent;
    var hasNew = false;
    for(var i = 0; i < keys.length; i++){
      var key = keys[i];
      var data = val[key];
      if(!data) continue;
      if(data.deletedFor && data.deletedFor[currentUser.uid]) continue;
      if(renderedMsgIds[key]){
        updateExistingMessage(key, data);
      } else {
        renderedMsgIds[key] = true;
        var d = new Date(data.timestamp);
        var dateStr = formatDate(d);
        if(dateStr !== lastDate){
          var sep = document.createElement('div');
          sep.className = 'date-separator';
          sep.innerHTML = '<span>' + dateStr + '</span>';
          area.appendChild(sep);
          lastDate = dateStr;
        }
        var el = createMessageEl(key, data, chatId, 'private', false);
        area.appendChild(el);
        hasNew = true;
      }
    }
    if(hasNew){
      area.scrollTop = area.scrollHeight;
      if(initialLoadDone){
        var lastKey = keys[keys.length - 1];
        var lastMsg = val[lastKey];
        if(lastMsg && lastMsg.senderId !== currentUser.uid){
          playNotifSound();
          showNotification(lastMsg.senderName || currentChatUser.name, 'رسالة جديدة');
        }
      }
    }
    if(!initialLoadDone) setTimeout(function(){ initialLoadDone = true; }, 2000);
    // قراءة
    for(var k = 0; k < keys.length; k++){
      var dd = val[keys[k]];
      if(dd && dd.senderId !== currentUser.uid && currentChatUser){
        db.ref('chats/' + chatId + '/messages/' + keys[k] + '/readBy').update({[currentUser.uid]: true});
      }
    }
  });
}

/* ============ الضغط الطويل ============ */
function attachLongPress(el, msgId, mode){
  if(!el || el.__lpBound) return;
  el.__lpBound = true;
  var startX = 0, startY = 0, moved = false, fired = false, timer = null;
  function cancel(){ if(timer){ clearTimeout(timer); timer = null; } }
  function start(x, y){
    startX = x; startY = y; moved = false; fired = false;
    cancel();
    timer = setTimeout(function(){
      fired = true; timer = null;
      currentContextMsgId = msgId;
      currentContextMsgData = mode === 'room' ? roomMessages[msgId] : currentMessages[msgId];
      if(currentContextMsgData) currentContextMsgData._mode = mode;
      if(isSelectionMode) toggleMessageSelection(msgId, mode);
      else showReactionPicker(msgId, x, y, mode);
      if(navigator.vibrate) try { navigator.vibrate(30); } catch(e){}
    }, 500);
  }
  function move(x, y){ if(Math.abs(x - startX) > 12 || Math.abs(y - startY) > 12){ moved = true; cancel(); } }
  function end(){ cancel(); if(fired || moved) return; if(isSelectionMode) toggleMessageSelection(msgId, mode); }
  on(el, 'touchstart', function(e){ var t = e.touches[0]; start(t.clientX, t.clientY); });
  on(el, 'touchmove', function(e){ var t = e.touches[0]; move(t.clientX, t.clientY); });
  on(el, 'touchend', end);
  on(el, 'touchcancel', cancel);
  on(el, 'mousedown', function(e){ start(e.clientX, e.clientY); });
  on(el, 'mousemove', function(e){ if(timer) move(e.clientX, e.clientY); });
  on(el, 'mouseup', end);
  on(el, 'mouseleave', cancel);
  on(el, 'contextmenu', function(e){ e.preventDefault(); });
}

function showReactionPicker(msgId, x, y, mode){
  var rp = $('reactionPicker');
  rp.style.left = Math.min(Math.max(x - 100, 10), window.innerWidth - 220) + 'px';
  rp.style.top = Math.min(Math.max(y - 50, 50), window.innerHeight - 60) + 'px';
  addClass(rp, 'show');
  var emojis = rp.querySelectorAll('.r-emoji');
  for(var i = 0; i < emojis.length; i++){
    bindTap(emojis[i], (function(el){
      return function(){
        if(currentContextMsgId && currentContextMsgData){
          addReaction(currentContextMsgId, currentContextMsgData._mode, el.getAttribute('data-emoji'));
        }
        removeClass(rp, 'show');
      };
    })(emojis[i]));
  }
}
function addReaction(msgId, mode, emoji){
  if(!currentUser) return;
  var chatId = mode === 'room' ? ROOM_ID : getChatId(currentUser.uid, currentChatUser.uid);
  var path = mode === 'room' ? 'rooms/' + ROOM_ID + '/messages/' + msgId : 'chats/' + chatId + '/messages/' + msgId;
  var reactRef = db.ref(path + '/reactions/' + currentUser.uid);
  reactRef.once('value').then(function(snap){
    if(snap.exists() && snap.val() === emoji) reactRef.remove();
    else reactRef.set(emoji);
  });
}

/* ============ قائمة السياق ============ */
function showContextMenu(msgId, x, y, mode){
  currentContextMsgId = msgId;
  var data = mode === 'room' ? roomMessages[msgId] : currentMessages[msgId];
  if(!data) return;
  currentContextMsgData = data;
  currentContextMsgData._mode = mode;
  var isMine = data.senderId === currentUser.uid;
  var canEdit = isMine && data.text && !data.deletedForAll && (Date.now() - data.timestamp < 15 * 60 * 1000);
  var canDeleteAll = isMine && !data.deletedForAll;
  var html = '';
  html += '<button type="button" data-ctx="reply"><i class="fas fa-reply"></i> رد</button>';
  if(data.text && !data.deletedForAll) html += '<button type="button" data-ctx="copy"><i class="fas fa-copy"></i> نسخ</button>';
  if(canEdit) html += '<button type="button" data-ctx="edit"><i class="fas fa-edit"></i> تعديل</button>';
  html += '<button type="button" data-ctx="select"><i class="fas fa-check-square"></i> تحديد</button>';
  html += '<button type="button" data-ctx="deleteMe" class="danger"><i class="fas fa-trash"></i> حذف لدي</button>';
  if(canDeleteAll) html += '<button type="button" data-ctx="deleteAll" class="danger"><i class="fas fa-trash-alt"></i> حذف للجميع</button>';
  var cm = $('contextMenu');
  cm.innerHTML = html;
  addClass(cm, 'show');
  var rect = cm.getBoundingClientRect();
  var vw = window.innerWidth, vh = window.innerHeight;
  var left = x, top = y;
  if(left + rect.width > vw - 10) left = vw - rect.width - 10;
  if(top + rect.height > vh - 10) top = vh - rect.height - 10;
  if(left < 10) left = 10;
  if(top < 10) top = 10;
  cm.style.left = left + 'px';
  cm.style.top = top + 'px';
  var btns = cm.querySelectorAll('button');
  for(var i = 0; i < btns.length; i++){
    bindTap(btns[i], (function(btn){
      return function(){
        removeClass(cm, 'show');
        handleContextAction(btn.getAttribute('data-ctx'));
      };
    })(btns[i]));
  }
}
function handleContextAction(action){
  if(!currentContextMsgId || !currentContextMsgData) return;
  var msgId = currentContextMsgId;
  var data = currentContextMsgData;
  var mode = data._mode || 'private';
  var chatId = mode === 'room' ? ROOM_ID : getChatId(currentUser.uid, currentChatUser.uid);
  var messagesPath = mode === 'room' ? 'rooms/' + ROOM_ID + '/messages' : 'chats/' + chatId + '/messages';
  if(action === 'reply'){
    replyingTo = { id: msgId, senderId: data.senderId, text: data.text || '', encrypted: data.encrypted, type: data.type, mode: mode };
    addClass($('replyBar'), 'show');
    $('replyName').textContent = data.senderId === currentUser.uid ? 'أنت' : (mode === 'room' ? (data.senderName || 'مستخدم') : currentChatUser.name);
    var preview = '📎 مرفق';
    if(data.type === 'audio') preview = '🎤 رسالة صوتية';
    else if(data.type === 'image') preview = '📷 صورة';
    else if(data.type === 'video') preview = '🎥 فيديو';
    else if(data.text) preview = simpleDecrypt(data.text, chatId);
    $('replyText').textContent = preview.substring(0, 80);
    $('messageInput').focus();
  } else if(action === 'copy'){
    if(data.text){
      var text = simpleDecrypt(data.text, chatId);
      try {
        if(navigator.clipboard) navigator.clipboard.writeText(text);
        else {
          var ta = document.createElement('textarea');
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
        }
        alert('✅ تم نسخ الرسالة');
      } catch(e){ alert('تعذّر النسخ'); }
    }
  } else if(action === 'edit'){
    $('editMsgInput').value = data.text ? simpleDecrypt(data.text, chatId) : '';
    addClass($('editMsgModal'), 'active');
    bindTap($('saveEditBtn'), function(){
      var newText = trim($('editMsgInput').value);
      if(!newText) return;
      var enc = simpleEncrypt(newText, chatId);
      db.ref(messagesPath + '/' + msgId).update({ text: enc, edited: true, editedAt: Date.now() });
      removeClass($('editMsgModal'), 'active');
    });
  } else if(action === 'select'){
    enterSelectionMode();
    toggleMessageSelection(msgId, mode);
  } else if(action === 'deleteMe'){
    db.ref(messagesPath + '/' + msgId + '/deletedFor').update({[currentUser.uid]: true});
  } else if(action === 'deleteAll'){
    db.ref(messagesPath + '/' + msgId).update({ deletedForAll: true, text: null, media: null, audio: null });
  }
  currentContextMsgId = null;
  currentContextMsgData = null;
}

/* ============ التحديد ============ */
function enterSelectionMode(){
  isSelectionMode = true;
  selectedMessages = {};
  roomSelectedMessages = {};
  addClass($('selectionBar'), 'show');
  updateSelectionUI();
}
function exitSelectionMode(){
  isSelectionMode = false;
  selectedMessages = {};
  roomSelectedMessages = {};
  removeClass($('selectionBar'), 'show');
  var sels = document.querySelectorAll('.message.selected');
  for(var i = 0; i < sels.length; i++) removeClass(sels[i], 'selected');
}
function toggleMessageSelection(msgId, mode){
  var set = mode === 'room' ? roomSelectedMessages : selectedMessages;
  if(set[msgId]) delete set[msgId]; else set[msgId] = true;
  var el = document.querySelector('.message[data-msg-id="' + msgId + '"]');
  if(el) toggleClass(el, 'selected', !!set[msgId]);
  updateSelectionUI();
}
function updateSelectionUI(){
  var total = Object.keys(selectedMessages).length + Object.keys(roomSelectedMessages).length;
  $('selCount').textContent = total + ' محدد';
  if(total === 0) exitSelectionMode();
}
function deleteSelected(){
  var total = Object.keys(selectedMessages).length + Object.keys(roomSelectedMessages).length;
  if(total === 0) return;
  if(!confirm('حذف ' + total + ' رسالة للجميع؟')) return;
  var updates = {};
  var sk = Object.keys(selectedMessages);
  if(sk.length && currentChatUser){
    var chatId = getChatId(currentUser.uid, currentChatUser.uid);
    for(var i = 0; i < sk.length; i++){
      var id = sk[i];
      var data = currentMessages[id];
      if(!data) continue;
      if(data.senderId === currentUser.uid){
        updates['chats/' + chatId + '/messages/' + id + '/deletedForAll'] = true;
        updates['chats/' + chatId + '/messages/' + id + '/text'] = null;
        updates['chats/' + chatId + '/messages/' + id + '/media'] = null;
        updates['chats/' + chatId + '/messages/' + id + '/audio'] = null;
      } else {
        updates['chats/' + chatId + '/messages/' + id + '/deletedFor/' + currentUser.uid] = true;
      }
    }
  }
  var rk = Object.keys(roomSelectedMessages);
  for(var j = 0; j < rk.length; j++){
    var rid = rk[j];
    var rdata = roomMessages[rid];
    if(!rdata) continue;
    if(rdata.senderId === currentUser.uid){
      updates['rooms/' + ROOM_ID + '/messages/' + rid + '/deletedForAll'] = true;
      updates['rooms/' + ROOM_ID + '/messages/' + rid + '/text'] = null;
      updates['rooms/' + ROOM_ID + '/messages/' + rid + '/media'] = null;
      updates['rooms/' + ROOM_ID + '/messages/' + rid + '/audio'] = null;
    } else {
      updates['rooms/' + ROOM_ID + '/messages/' + rid + '/deletedFor/' + currentUser.uid] = true;
    }
  }
  db.ref().update(updates);
  exitSelectionMode();
}
function copySelected(){
  var texts = [];
  var sk = Object.keys(selectedMessages);
  for(var i = 0; i < sk.length; i++){
    var data = currentMessages[sk[i]];
    if(data && data.text){
      var chatId = getChatId(currentUser.uid, currentChatUser.uid);
      texts.push(simpleDecrypt(data.text, chatId));
    }
  }
  var rk = Object.keys(roomSelectedMessages);
  for(var j = 0; j < rk.length; j++){
    var rdata = roomMessages[rk[j]];
    if(rdata && rdata.text){
      texts.push((rdata.senderName || '') + ': ' + simpleDecrypt(rdata.text, ROOM_ID));
    }
  }
  if(texts.length){
    try {
      if(navigator.clipboard) navigator.clipboard.writeText(texts.join('\n'));
      else {
        var ta = document.createElement('textarea');
        ta.value = texts.join('\n');
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      alert('✅ تم نسخ ' + texts.length + ' رسالة');
    } catch(e){ alert('تعذّر النسخ'); }
  }
  exitSelectionMode();
}

/* ============ الإرسال ============ */
on($('messageInput'), 'keypress', function(e){ if(e.keyCode === 13 || e.which === 13) sendMessage(); });
on($('messageInput'), 'input', function(e){
  var hasText = trim(e.target.value).length > 0;
  toggleClass($('sendBtn'), 'show', hasText);
  toggleClass($('micBtn'), 'hide', hasText);
});

function sendMessage(){
  if(!currentUser || !currentUserData) return;
  var input = $('messageInput');
  var text = trim(input.value);
  if(!text || text.length > 1000) return;
  input.value = '';
  removeClass($('sendBtn'), 'show');
  removeClass($('micBtn'), 'hide');
  if(currentChatMode === 'room'){
    var encrypted = simpleEncrypt(text, ROOM_ID);
    db.ref('rooms/' + ROOM_ID + '/messages').push({
      text: encrypted, encrypted: true,
      senderId: currentUser.uid,
      senderName: currentUserData.name,
      senderPhoto: currentUserData.photoURL || null,
      timestamp: Date.now()
    });
  } else {
    if(!currentChatUser) return;
    var chatId = getChatId(currentUser.uid, currentChatUser.uid);
    var enc2 = simpleEncrypt(text, chatId);
    var payload = { text: enc2, encrypted: true, senderId: currentUser.uid, timestamp: Date.now(), readBy: {} };
    if(replyingTo){
      payload.replyTo = { id: replyingTo.id, senderId: replyingTo.senderId, text: replyingTo.text, encrypted: replyingTo.encrypted, type: replyingTo.type };
    }
    db.ref('chats/' + chatId + '/messages').push(payload);
    db.ref('userChats/' + currentUser.uid + '/' + currentChatUser.uid).set(true);
    db.ref('userChats/' + currentChatUser.uid + '/' + currentUser.uid).set(true);
    db.ref('chats/' + chatId + '/unread/' + currentChatUser.uid).once('value').then(function(snap){
      var cur = snap.exists() ? snap.val() : 0;
      db.ref('chats/' + chatId + '/unread/' + currentChatUser.uid).set(cur + 1);
    });
  }
  cancelReply();
}
function cancelReply(){ replyingTo = null; removeClass($('replyBar'), 'show'); }
function closeChat(){
  if(isSelectionMode){ exitSelectionMode(); return; }
  removeClass($('emojiPanel'), 'show');
  removeClass($('chatView'), 'active');
  if(unsubMessages) unsubMessages();

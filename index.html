<style>

html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:Cairo,Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;line-height:1.6;overflow-x:hidden}

.sc>i{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--p) 14%,transparent);color:var(--p);flex:none}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function compress(file,max=800,q=.72){return new Promise((res,rej)=>{if(!/^image\/(png|jpe?g|webp|gif)$/i.test(file.type)||file.size>12e6)return rej();const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

T.orders=()=>{const f=S.of,l=arr(S.orders).sort((a,b)=>b.createdAt-a.createdAt).filter(o=>f==='all'||o.status===f);return`<div class="chips">${['all',...Object.keys(ST)].map(s=>`<button class="chip ${f===s?'on':''}" data-a="oFilter" data-s="${s}">${s==='all'?'الكل':ST[s][0]}</button>`).join('')}</div>${l.length?l.map(o=>`<div class="oc"><div class="oh"><b>${sid(o.id)}</b><small>${dt(o.createdAt)}</small>${stb(o.status)}</div><div class="ob"><p><i class="fa-solid fa-user"></i> ${esc(o.userName)} · <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a></p><p><i class="fa-solid fa-location-dot"></i> ${esc(o.address)}</p><p>${Object.values(o.items||{}).map(i=>esc(i.name)+' × '+num(i.qty)).join('، ')}</p>${o.notes?`<p><i class="fa-solid fa-note-sticky"></i> ${esc(o.notes)}</p>`:''}</div><div class="of"><b class="tot">${money(o.total)}</b><div style="display:flex;gap:6px"><select class="in" style="width:auto" data-os="${esc(o.id)}">${Object.keys(ST).map(s=>`<option value="${s}" ${o.status===s?'selected':''}>${ST[s][0]}</option>`).join('')}</select><button class="ib" data-a="oDel" data-id="${esc(o.id)}" aria-label="حذف"><i class="fa-solid fa-trash"></i></button></div></div></div>`).join(''):EMPTY('لا توجد طلبات','fa-cart-shopping')}`};
T.users=()=>{const l=arr(S.users).sort((a,b)=>b.createdAt-a.createdAt);return`<div class="pn tw"><table><thead><tr><th>الاسم</th><th>البريد</th><th>الهاتف</th><th>الدور</th></tr></thead><tbody>${l.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.phone||'-')}</td><td>${u.role==='admin'?'أدمن':'عميل'}</td></tr>`).join('')}</tbody></table></div>`};
T.messages=()=>{const l=arr(S.messages).sort((a,b)=>b.createdAt-a.createdAt);return l.length?l.map(m=>`<div class="oc"><div class="oh"><b>${esc(m.name)}</b><small>${dt(m.createdAt)}</small></div><div class="ob"><p>${esc(m.email||'')} ${esc(m.phone||'')}</p><p style="white-space:pre-wrap;color:var(--tx)">${esc(m.message)}</p></div><button class="btn sm dg" data-a="mDel" data-id="${esc(m.id)}">حذف</button></div>`).join(''):EMPTY('لا توجد رسائل','fa-comments')};
T.settings=()=>{const s={...DEF,...S.settings},l=img(s.logo);return`<form class="pn" data-f="settings"><div class="fld"><label>اسم المتجر</label><input name="storeName" required maxlength="40" value="${esc(s.storeName)}"></div><div class="fld"><label>العنوان الرئيسي</label><input name="heroTitle" maxlength="100" value="${esc(s.heroTitle)}"></div><div class="fld"><label>الوصف الفرعي</label><input name="heroSubtitle" maxlength="150" value="${esc(s.heroSubtitle||'')}"></div><div class="fld"><label>الشعار</label><div class="upl"><div class="im upv" id="pv_logo">${l?`<img src="${l}" alt="">`:'<i class="fa-solid fa-image"></i>'}</div><label class="btn sm gh"><i class="fa-solid fa-upload"></i> رفع<input type="file" accept="image/png,image/jpeg,image/webp" hidden data-up="logo"></label></div></div><div class="row"><div class="fld"><label>اللون الأساسي</label><input type="color" name="primary" value="${esc(s.primary)}"></div><div class="fld"><label>اللون الثانوي</label><input type="color" name="primary2" value="${esc(s.primary2)}"></div></div><div class="row"><div class="fld"><label>الهاتف</label><input name="phone" type="tel" maxlength="20" value="${esc(s.phone||'')}"></div><div class="fld"><label>العملة</label><input name="currency" maxlength="10" value="${esc(s.currency||'ج.م')}"></div></div><button class="btn" type="submit">حفظ الإعدادات</button></form>`};
T.maint=()=>{const on=S.maint?.enabled===true;return`<div class="pn" style="text-align:center"><i class="fa-solid ${on?'fa-lock':'fa-lock-open'}" style="font-size:44px;color:var(--p)"></i><h3 style="margin:10px 0">المتجر ${on?'مغلق للتحديث':'مفتوح'}</h3><button class="btn ${on?'':'dg'}" data-a="maintTog">${on?'فتح المتجر':'إغلاق المتجر'}</button></div>`};
function drawAdmin(){const s=S.settings,l=img(s.logo),bd={orders:arr(S.orders).filter(o=>o.status==='pending').length,messages:arr(S.messages).length};$('#admin').innerHTML=`<div class="adm"><aside class="as"><div class="ab">${l?`<img src="${l}" alt="">`:''}<span>${esc(s.storeName||DEF.storeName)}</span></div>${ADM.map(([k,t,i])=>`<button class="${S.tab===k?'on':''}" data-a="tab" data-t="${k}" aria-label="${t}"><i class="fa-solid ${i}"></i><span>${t}</span>${bd[k]?`<em class="nbd">${bd[k]}</em>`:''}</button>`).join('')}<button class="sp" data-a="theme" aria-label="الوضع"><i class="fa-solid fa-moon thI"></i><span>الوضع</span></button><button data-a="toStore"><i class="fa-solid fa-store"></i><span>المتجر</span></button><button data-a="logout"><i class="fa-solid fa-right-from-bracket"></i><span>خروج</span></button></aside><section class="am"><div class="at"><h2>${ADM.find(a=>a[0]===S.tab)[1]}</h2></div><div id="aMain">${(T[S.tab]||T.stats)()}</div></section></div>`;setTheme(document.documentElement.dataset.theme||'light')}
function busy(){const a=document.activeElement;return a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.closest('#aMain,.ov')}
function onData(k){if(k==='maint'||(k==='settings'&&!(S.isAdmin&&S.adminMode))){render();return}if(S.isAdmin&&S.adminMode){if(k==='settings')applyTheme();if(!busy()&&!$('#layer .ov'))drawAdmin();return}if(k==='products'){if(S.page==='home')drawGrid();else if(S.page==='wishlist')drawWish();badges();if($('#ov_cart'))fillCart()}else if(k==='orders'&&S.page==='orders')drawOrders()}
const H={go:d=>go(d.p),shop:()=>$('#chips')?.scrollIntoView({behavior:'smooth'}),cat:d=>{S.cat=d.c;drawGrid()},open:d=>productModal(d.id),close:d=>closeOv(d.id),theme:()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'),
wish:d=>{const i=wish.indexOf(d.id);i<0?wish.push(d.id):wish.splice(i,1);ls.set('yz_wish',wish);badges();if(S.page==='wishlist')drawWish();else if(S.page==='home')drawGrid()},
add:d=>{const p=S.products[d.id];if(!p||!avail(p))return toast('المنتج غير متوفر','err');const q=(Number(cart[d.id])||0)+1;if(q>num(p.qty))return toast('الكمية المتاحة '+num(p.qty),'err');cart[d.id]=q;ls.set('yz_cart',cart);badges();toast('تمت الإضافة للسلة','ok');if($('#ov_cart'))fillCart()},
cart:()=>openOv('cart',cartHTML(),'d'),
qty:d=>{const p=S.products[d.id];if(!p)return;const q=(Number(cart[d.id])||0)+Number(d.n);if(q<=0)delete cart[d.id];else{if(q>num(p.qty))return toast('الكمية المتاحة '+num(p.qty),'err');cart[d.id]=q}ls.set('yz_cart',cart);badges();fillCart()},
rm:d=>{delete cart[d.id];ls.set('yz_cart',cart);badges();fillCart()},
checkout:async()=>{if(!S.user){toast('سجّل الدخول لإتمام الطلب','err');return H.auth({})}const t=totals();if(!t.it.length)return toast('السلة فارغة','err');const c=S.co,p=S.profile||{},name=clean(c.name??p.name,60),phone=clean(c.phone??p.phone,20),address=clean(c.address??p.address,300);if(!name||!/^[0-9+\s-]{8,20}$/.test(phone)||address.length<5)return toast('أكمل الاسم والهاتف والعنوان بشكل صحيح','err');const b=$('[data-a=checkout]');if(b)b.disabled=true;const o={uid:S.user.uid,userName:name,userEmail:S.user.email||'',phone,address,notes:clean(c.notes,200),items:t.it.map(i=>({id:i.id,name:clean(i.name,100),price:fin(i),qty:Math.min(i.q,num(i.qty))})),subtotal:t.sub,discount:0,total:t.total,status:'pending',createdAt:Date.now()};try{await set(push(ref(db,'orders')),o);cart={};ls.set('yz_cart',cart);S.co={};closeOv('cart');badges();toast('تم إرسال طلبك بنجاح','ok');go('orders')}catch{toast('تعذر إرسال الطلب','err');if(b)b.disabled=false}},
auth:(d={})=>{S.auth={tab:d.tab||'user',mode:'login'};openOv('auth',authHTML())},atab:d=>{S.auth.tab=d.t;setOv('auth',authHTML())},amode:d=>{S.auth.mode=d.m;setOv('auth',authHTML())},
google:async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){toast(authErr(e.code),'err')}},
forgot:async()=>{const email=clean(prompt('أدخل بريدك الإلكتروني:')||'',100);if(!email)return;try{await sendPasswordResetEmail(auth,email)}catch{}toast('إذا كان البريد مسجلاً سيصلك رابط الاستعادة','ok')},
resetPwd:async()=>{const e=S.user?.email;if(!e)return;try{await sendPasswordResetEmail(auth,e);toast('تم إرسال الرابط إلى بريدك','ok')}catch{toast('تعذر الإرسال','err')}},
logout:async()=>{if(!await confirmBox('تسجيل الخروج','هل تريد تسجيل الخروج؟'))return;await signOut(auth);go('home')},
toAdmin:()=>{S.adminMode=true;closeAll();render()},toStore:()=>{S.adminMode=false;closeAll();render()},tab:d=>{S.tab=d.t;drawAdmin()},
pEdit:d=>{const p=d.id?S.products[d.id]:null,cats=[...new Set(arr(S.products).map(x=>x.category).filter(Boolean))],im=img(p?.image);S.up={};S.eid=d.id||'';openOv('pm',`<button class="x" data-a="close" data-id="pm" aria-label="إغلاق"><i class="fa-solid fa-xmark"></i></button><h2 style="margin:24px 0 12px">${p?'تعديل منتج':'إضافة منتج'}</h2><form data-f="product"><div class="fld"><label>الاسم</label><input name="name" required maxlength="100" value="${esc(p?.name||'')}"></div><div class="row"><div class="fld"><label>السعر</label><input name="price" type="number" min="0" step="any" required value="${p?.price??''}"></div><div class="fld"><label>الخصم %</label><input name="discount" type="number" min="0" max="100" value="${p?.discount??0}"></div></div><div class="row"><div class="fld"><label>الكمية</label><input name="qty" type="number" min="0" required value="${p?.qty??''}"></div><div class="fld"><label>التصنيف</label><input name="category" list="catl" maxlength="40" value="${esc(p?.category||'')}"><datalist id="catl">${cats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div></div><div class="fld"><label>الوصف</label><textarea name="description" maxlength="3000">${esc(p?.description||'')}</textarea></div><div class="fld"><label>الصورة</label><div class="upl"><div class="im upv" id="pv_pimg">${im?`<img src="${im}" alt="">`:'<i class="fa-solid fa-image"></i>'}</div><label class="btn sm gh"><i class="fa-solid fa-images"></i> رفع<input type="file" accept="image/png,image/jpeg,image/webp" hidden data-up="pimg"></label><button type="button" class="btn sm gh" data-a="upClr">إزالة</button></div></div><div class="row"><label class="chk"><input type="checkbox" name="stock" ${p?.stock===false?'':'checked'}> متاح للبيع</label><label class="chk"><input type="checkbox" name="visible" ${p?.visible===false?'':'checked'}> ظاهر</label></div><button class="btn" type="submit" style="width:100%;margin-top:12px">حفظ المنتج</button></form>`)},
upClr:()=>{S.up.pimg='';const pv=$('#pv_pimg');if(pv)pv.innerHTML='<i class="fa-solid fa-image"></i>'},
pVis:async d=>{await update(ref(db,'products/'+d.id),{visible:S.products[d.id].visible===false})},
pDel:async d=>{if(!await confirmBox('حذف المنتج','سيتم حذف المنتج نهائياً'))return;await remove(ref(db,'products/'+d.id));toast('تم الحذف','ok')},
oFilter:d=>{S.of=d.s;drawAdmin()},
oDel:async d=>{if(!await confirmBox('حذف الطلب','سيتم حذف الطلب نهائياً'))return;await remove(ref(db,'orders/'+d.id));toast('تم الحذف','ok')},
mDel:async d=>{if(!await confirmBox('حذف الرسالة','سيتم حذف الرسالة نهائياً'))return;await remove(ref(db,'messages/'+d.id));toast('تم الحذف','ok')},
maintTog:async()=>{await set(ref(db,'maintenance'),{enabled:S.maint?.enabled!==true,updatedAt:Date.now()})}};
const F={login:async f=>{if(!canTry())return toast('محاولات كثيرة، انتظر 15 دقيقة','err');const fd=new FormData(f),b=$('[type=submit]',f);b.disabled=true;try{await signInWithEmailAndPassword(auth,clean(fd.get('email'),100),String(fd.get('password')));ls.set('yz_att',{n:0,t:0})}catch(e){failTry();toast(authErr(e.code),'err')}b.disabled=false},
register:async f=>{const fd=new FormData(f),b=$('[type=submit]',f),email=clean(fd.get('email'),100).toLowerCase(),pw=String(fd.get('password'));if(email===ADMIN_EMAIL)return toast('هذا البريد غير متاح','err');if(pw.length<8)return toast('كلمة المرور 8 أحرف على الأقل','err');b.disabled=true;S.pending={name:clean(fd.get('name'),60),phone:clean(fd.get('phone'),20)};try{await createUserWithEmailAndPassword(auth,email,pw)}catch(e){S.pending=null;toast(authErr(e.code),'err')}b.disabled=false},
admin:async f=>{if(!canTry())return toast('محاولات كثيرة، انتظر 15 دقيقة','err');const fd=new FormData(f),b=$('[type=submit]',f);if(clean(fd.get('username'),30)!==ADMIN_USER){failTry();return toast('بيانات الأدمن غير صحيحة','err')}b.disabled=true;try{await signInWithEmailAndPassword(auth,ADMIN_EMAIL,String(fd.get('password')));ls.set('yz_att',{n:0,t:0})}catch(e){failTry();toast('بيانات الأدمن غير صحيحة','err')}b.disabled=false},
contact:async f=>{const fd=new FormData(f),b=$('[type=submit]',f),last=ls.get('yz_msg',0);if(Date.now()-last<3e4)return toast('انتظر قليلاً قبل إرسال رسالة أخرى','err');b.disabled=true;try{await set(push(ref(db,'messages')),{name:clean(fd.get('name'),60),email:clean(fd.get('email'),100),phone:clean(fd.get('phone'),20),message:clean(fd.get('message'),1000),uid:S.user?.uid||'',createdAt:Date.now()});ls.set('yz_msg',Date.now());f.reset();toast('تم إرسال رسالتك','ok')}catch{toast('تعذر الإرسال','err')}b.disabled=false},
profile:async f=>{const fd=new FormData(f),d={name:clean(fd.get('name'),60),phone:clean(fd.get('phone'),20),address:clean(fd.get('address'),300)};if(!d.name)return toast('الاسم مطلوب','err');try{await update(ref(db,'users/'+S.user.uid),d);S.profile={...S.profile,...d};drawHeader();toast('تم الحفظ','ok')}catch{toast('تعذر الحفظ','err')}},
product:async f=>{const fd=new FormData(f),name=clean(fd.get('name'),100),price=num(fd.get('price')),qty=Math.floor(num(fd.get('qty')));if(!name)return toast('تحقق من البيانات','err');const old=S.eid?S.products[S.eid]:null,image=S.up.pimg!==undefined?S.up.pimg:(old?.image||'');const data={name,price,discount:num(fd.get('discount'),0,100),qty,category:clean(fd.get('category'),40),description:clean(fd.get('description'),3000),image:img(image)?image:'',stock:fd.has('stock'),visible:fd.has('visible'),updatedAt:Date.now(),createdAt:old?.createdAt||Date.now()};await set(S.eid?ref(db,'products/'+S.eid):push(ref(db,'products')),data);closeOv('pm');toast('تم حفظ المنتج','ok')},
settings:async f=>{const fd=new FormData(f),ok=c=>/^#[0-9a-f]{6}$/i.test(c),d={storeName:clean(fd.get('storeName'),40),heroTitle:clean(fd.get('heroTitle'),100),heroSubtitle:clean(fd.get('heroSubtitle'),150),primary:ok(fd.get('primary'))?fd.get('primary'):DEF.primary,primary2:ok(fd.get('primary2'))?fd.get('primary2'):DEF.primary2,phone:clean(fd.get('phone'),20),currency:clean(fd.get('currency'),10)||'ج.م'};if(S.up.logo!==undefined)d.logo=S.up.logo;await update(ref(db,'settings'),d);S.up={};toast('تم حفظ الإعدادات','ok')}};
async function setStatus(id,st){const o=S.orders[id];if(!o||o.status===st||!ST[st])return;const was=['confirmed','shipped','delivered'].includes(o.status),now=['confirmed','shipped','delivered'].includes(st);await update(ref(db,'orders/'+id),{status:st});const adj=dir=>Promise.all(Object.values(o.items||{}).map(i=>runTransaction(ref(db,'products/'+i.id+'/qty'),v=>v==null?v:Math.max(0,Number(v)+dir*Number(i.qty))).catch(()=>{})));if(!was&&now)await adj(-1);if(was&&!now)await adj(1);toast('تم تحديث الحالة','ok')}
const run=r=>{if(r&&r.catch)r.catch(e=>{console.error(e);toast('حدث خطأ، حاول مرة أخرى','err')})};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;if(t.classList.contains('hrt')||t.closest('.hrt')){e.stopPropagation()}const f=H[t.dataset.a];if(f){if(t.dataset.a==='open'&&e.target.closest('[data-a=wish],[data-a=add]'))return;run(f(t.dataset,t,e))}});
document.addEventListener('submit',e=>{const n=e.target.dataset.f;if(n&&F[n]){e.preventDefault();run(F[n](e.target))}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.co!==undefined)S.co[t.dataset.co]=t.value;if(t.id==='qm'){S.q=t.value.slice(0,60);drawGrid()}});
document.addEventListener('change',async e=>{const t=e.target;if(t.dataset.os)return run(setStatus(t.dataset.os,t.value));if(t.dataset.up&&t.files&&t.files[0]){const k=t.dataset.up;try{S.up[k]=await compress(t.files[0],k==='logo'?256:760);const pv=$('#pv_'+k);if(pv)pv.innerHTML=`<img src="${S.up[k]}" alt="">`}catch{toast('صورة غير صالحة','err')}t.value='';return}if(t.dataset.sort){S.sort=t.value;drawGrid()}});
addEventListener('online',()=>toast('تمت استعادة الاتصال','ok'));
addEventListener('offline',()=>toast('لا يوجد اتصال بالإنترنت','err'));
onAuthStateChanged(auth,async u=>{usubs.splice(0).forEach(f=>f());S.orders={};S.users={};S.messages={};delete S.ld.orders;if(!u){S.user=null;S.profile=null;S.isAdmin=false;S.adminMode=false;closeAll();render();return}S.user=u;S.isAdmin=u.email===ADMIN_EMAIL;if(!await ensureProfile(u))return;subscribeUser();S.adminMode=S.isAdmin;closeAll();render();bump()});
sub(ref(db,'settings'),'settings');
sub(ref(db,'products'),'products');
sub(ref(db,'maintenance'),'maint');
const pid=new URLSearchParams(location.search).get('product');
render();
if(pid)setTimeout(()=>productModal(pid),1500);
</script>
</body>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#075e54">
<title>Chat App Pro</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--green-dark:#075e54;--green:#128c7e;--green-light:#25d366;--green-pale:#d9fdd3;--bg-chat:#efeae2;--bg-panel:#f0f2f5;--text:#111b21;--text-muted:#667781;--border:#e0e0e0;--red:#ff4444}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:#0b141a}
body{display:flex;justify-content:center;align-items:center}
.auth-screen{position:fixed;inset:0;background:linear-gradient(135deg,#075e54,#128c7e,#25d366);display:flex;justify-content:center;align-items:center;z-index:1000;padding:20px;overflow-y:auto;transition:opacity .3s}
.auth-screen.hidden{opacity:0;pointer-events:none}
.auth-box{background:#fff;padding:30px 25px;border-radius:15px;width:100%;max-width:400px;box-shadow:0 20px 50px rgba(0,0,0,.3);margin:auto}
.auth-box .logo{width:70px;height:70px;background:var(--green-light);border-radius:50%;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff}
.auth-box h1{color:var(--green-dark);margin-bottom:6px;font-size:22px;text-align:center}
.auth-box p.subtitle{color:var(--text-muted);margin-bottom:22px;font-size:13px;text-align:center}
.auth-box input{width:100%;padding:13px 15px;margin-bottom:10px;border:2px solid #e9edef;border-radius:10px;font-size:14px;outline:none;text-align:right;font-family:inherit}
.auth-box input:focus{border-color:var(--green-light)}
.btn-primary{width:100%;padding:13px;background:var(--green-light);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:bold;cursor:pointer;font-family:inherit}
.btn-primary:hover{background:#1ebe5b}
.btn-primary:disabled{background:#b1b3b5;cursor:not-allowed}
.btn-google{width:100%;padding:13px;background:#fff;color:#444;border:2px solid #dadce0;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px;font-family:inherit}
.btn-google:hover{background:#f8f9fa}
.toggle-link{text-align:center;margin-top:15px;font-size:13px;color:var(--text-muted)}
.toggle-link a{color:var(--green-light);font-weight:bold;cursor:pointer}
.error-msg{background:#ffe5e5;color:#c00;padding:10px;border-radius:8px;font-size:13px;margin-bottom:12px;display:none;text-align:right}
.error-msg.show{display:block}
.divider{display:flex;align-items:center;gap:10px;margin:15px 0;color:#999;font-size:12px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.app{width:100%;max-width:480px;height:100vh;height:100dvh;background:#fff;display:none;flex-direction:column;overflow:hidden;position:relative}
.app.active{display:flex}
@media(min-width:900px){.app{max-width:1100px;height:90vh;max-height:850px;border-radius:15px;box-shadow:0 20px 60px rgba(0,0,0,.6);flex-direction:row}}
.app-header{background:var(--green-dark);color:#fff;padding:12px 15px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.app-header .user-avatar{width:42px;height:42px;background:var(--green-light);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:17px;color:#fff;flex-shrink:0;overflow:hidden;cursor:pointer}
.app-header .user-avatar img{width:100%;height:100%;object-fit:cover}
.app-header .user-info{flex:1;min-width:0}
.app-header .user-info h2{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-header .user-info .sub{font-size:11.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-header .icon-btn{background:transparent;border:none;color:#fff;font-size:18px;cursor:pointer;padding:8px;border-radius:50%}
.app-header .icon-btn:hover{background:rgba(255,255,255,.15)}
.app-content{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column;background:#fff}
.tabs{display:flex;background:var(--green-dark);flex-shrink:0}
.tab{flex:1;padding:12px 8px;background:transparent;border:none;color:rgba(255,255,255,.6);font-size:12px;font-weight:600;cursor:pointer;position:relative;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px}
.tab.active{color:#fff}
.tab.active::after{content:'';position:absolute;bottom:0;left:15%;right:15%;height:3px;background:#fff;border-radius:3px 3px 0 0}
.tab .icon{font-size:17px}
.sections{flex:1;position:relative;overflow:hidden}
.section{position:absolute;inset:0;overflow-y:auto;display:none;flex-direction:column;animation:fadeIn .2s ease}
.section.active{display:flex}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.search-box{padding:10px 15px;background:#fff;border-bottom:1px solid var(--border);flex-shrink:0}
.search-box input{width:100%;padding:9px 14px;border:none;background:var(--bg-panel);border-radius:20px;font-size:14px;outline:none;text-align:right;font-family:inherit}
.chat-list{flex:1;overflow-y:auto}
.chat-item{display:flex;align-items:center;gap:12px;padding:12px 15px;cursor:pointer;border-bottom:1px solid #f5f5f5}
.chat-item:hover{background:#f5f5f5}
.chat-item .avatar{width:50px;height:50px;background:var(--green-light);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;font-size:20px;flex-shrink:0;overflow:hidden;position:relative}
.chat-item .avatar img{width:100%;height:100%;object-fit:cover}
.chat-item .avatar .online-dot{position:absolute;bottom:2px;left:2px;width:12px;height:12px;background:var(--green-light);border-radius:50%;border:2px solid #fff}
.chat-item .details{flex:1;min-width:0}
.chat-item .details .name{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-item .details .last-msg{font-size:13px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.chat-item .meta{display:flex;flex-direction:column;align-items:flex-start;gap:4px;flex-shrink:0}
.chat-item .meta .time{font-size:11.5px;color:var(--text-muted)}
.chat-item .meta .badge{background:var(--green-light);color:#fff;font-size:11px;padding:2px 7px;border-radius:10px;font-weight:bold}
.empty-state{padding:50px 20px;text-align:center;color:var(--text-muted);font-size:14px}
.empty-state .big-icon{font-size:50px;opacity:.3;margin-bottom:15px}
.fab{position:absolute;bottom:20px;left:20px;width:56px;height:56px;background:var(--green-light);border-radius:50%;border:none;color:#fff;font-size:22px;cursor:pointer;box-shadow:0 4px 12px rgba(37,211,102,.4);display:flex;align-items:center;justify-content:center;z-index:5}
.fab:hover{transform:scale(1.08)}

/* الاستوري */
.stories-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(95px,1fr));gap:12px;padding:15px}
.story-card{aspect-ratio:9/14;border-radius:12px;overflow:hidden;position:relative;cursor:pointer;background:linear-gradient(135deg,#075e54,#25d366);color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-shadow:0 2px 8px rgba(0,0,0,.15);background-size:cover;background-position:center}
.story-card.add{background:linear-gradient(135deg,#e0e0e0,#b1b3b5);color:#555;justify-content:center;align-items:center;font-size:40px}
.story-card .story-avatar{width:34px;height:34px;border-radius:50%;border:2px solid #fff;background:rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:14px;overflow:hidden;margin-bottom:6px}
.story-card .story-avatar img{width:100%;height:100%;object-fit:cover}
.story-card .story-name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.story-card .delete-story{position:absolute;top:5px;left:5px;width:26px;height:26px;background:rgba(0,0,0,.5);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;z-index:3;cursor:pointer}
.story-card .delete-story:hover{background:var(--red)}
.story-card .my-story-badge{position:absolute;top:5px;right:5px;background:var(--green-light);color:#fff;font-size:9px;padding:2px 6px;border-radius:8px;font-weight:bold;z-index:3}

/* الأخبار */
.news-container{padding:12px;display:flex;flex-direction:column;gap:12px}
.news-compose{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.news-compose textarea{width:100%;border:2px solid #e9edef;border-radius:10px;padding:10px;font-family:inherit;font-size:14px;resize:vertical;min-height:70px;outline:none;text-align:right}
.news-compose textarea:focus{border-color:var(--green-light)}
.news-compose .actions{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.news-compose .actions label{cursor:pointer;color:var(--text-muted);font-size:13px;display:flex;align-items:center;gap:5px}
.news-compose .actions label:hover{color:var(--green-light)}
.news-compose .actions input[type=file]{display:none}
.news-post{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.news-post .header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.news-post .header .avatar{width:42px;height:42px;border-radius:50%;background:var(--green-light);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;overflow:hidden;flex-shrink:0}
.news-post .header .avatar img{width:100%;height:100%;object-fit:cover}
.news-post .header .info{flex:1;min-width:0}
.news-post .header .info .name{font-weight:600;font-size:14px}
.news-post .header .info .time{font-size:11.5px;color:var(--text-muted)}
.news-post .header .delete-btn{background:transparent;border:none;color:var(--text-muted);cursor:pointer;font-size:14px;padding:6px}
.news-post .header .delete-btn:hover{color:var(--red)}
.news-post .text{font-size:14.5px;line-height:1.5;margin-bottom:10px;word-wrap:break-word}
.news-post .image{width:100%;border-radius:10px;margin-bottom:10px;max-height:400px;object-fit:cover}
.news-post .actions{display:flex;gap:15px;padding-top:8px;border-top:1px solid #f0f0f0}
.news-post .actions button{background:transparent;border:none;color:var(--text-muted);cursor:pointer;font-size:13.5px;display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:8px}
.news-post .actions button:hover{background:#f0f2f5}
.news-post .actions button.liked{color:var(--green-light);font-weight:600}
.news-post .comments{margin-top:10px;border-top:1px solid #f0f0f0;padding-top:10px;display:none}
.news-post .comments.show{display:block}
.news-post .comment{display:flex;gap:8px;margin-bottom:8px;font-size:13.5px}
.news-post .comment .avatar{width:32px;height:32px;border-radius:50%;background:var(--green-light);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:13px;overflow:hidden;flex-shrink:0}
.news-post .comment .avatar img{width:100%;height:100%;object-fit:cover}
.news-post .comment .body{flex:1;background:#f0f2f5;padding:8px 12px;border-radius:12px}
.news-post .comment .body .name{font-weight:600;font-size:12.5px;margin-bottom:3px}
.news-post .comment .body .text{font-size:13px;word-wrap:break-word}
.news-post .comment-input{display:flex;gap:8px;margin-top:8px}
.news-post .comment-input input{flex:1;padding:9px 12px;border:2px solid #e9edef;border-radius:20px;font-size:13px;outline:none;text-align:right;font-family:inherit}
.news-post .comment-input input:focus{border-color:var(--green-light)}
.news-post .comment-input button{background:var(--green-light);border:none;color:#fff;width:38px;height:38px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* المحادثة */
.chat-view{position:absolute;inset:0;background:var(--bg-chat);display:none;flex-direction:column;z-index:20;animation:slideIn .25s ease}
.chat-view.active{display:flex}
@keyframes slideIn{from{transform:translateX(-100%)}to{transform:translateX(0)}}
.chat-view .header{background:var(--green-dark);color:#fff;padding:10px 12px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.chat-view .header .back-btn{background:transparent;border:none;color:#fff;font-size:20px;cursor:pointer;padding:5px}
.chat-view .header .avatar{width:40px;height:40px;border-radius:50%;background:var(--green-light);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;font-size:16px;overflow:hidden;flex-shrink:0}
.chat-view .header .avatar img{width:100%;height:100%;object-fit:cover}
.chat-view .header .info{flex:1;min-width:0}
.chat-view .header .info .name{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-view .header .info .status{font-size:11.5px;opacity:.85;display:flex;align-items:center;gap:5px}
.chat-view .header .info .status.online::before{content:'';width:7px;height:7px;background:var(--green-light);border-radius:50%}
.chat-view .header .icon-btn{background:transparent;border:none;color:#fff;font-size:16px;cursor:pointer;padding:8px;border-radius:50%}
.chat-view .messages-area{flex:1;padding:15px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.message-row{display:flex;width:100%;animation:fadeIn .2s ease}
.message-row.mine{justify-content:flex-start}
.message-row.other{justify-content:flex-end}
.message{max-width:78%;padding:7px 11px 5px;border-radius:10px;font-size:14.5px;word-wrap:break-word;box-shadow:0 1px 1px rgba(0,0,0,.08);line-height:1.4;position:relative}
.message.mine{background:var(--green-pale);border-top-right-radius:3px}
.message.other{background:#fff;border-top-left-radius:3px}
.message .msg-meta{font-size:10.5px;color:var(--text-muted);margin-top:3px;display:flex;justify-content:flex-start;align-items:center;gap:4px}
.message .check{font-size:11.5px;color:#53bdeb}
.message .check.read{color:#34b7f1}
.message .encrypted-badge{font-size:9.5px;color:var(--green);margin-left:5px}
.date-separator{align-self:center;background:#fff;color:var(--text-muted);font-size:11.5px;padding:5px 12px;border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.08);margin:8px 0;font-weight:500}
.audio-message{display:flex;align-items:center;gap:10px;min-width:200px}
.audio-message button{width:38px;height:38px;border-radius:50%;background:var(--green-light);color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px}
.audio-message .audio-progress{flex:1;height:3px;background:rgba(0,0,0,.15);border-radius:3px;position:relative;overflow:hidden}
.audio-message .audio-progress .fill{position:absolute;top:0;right:0;height:100%;width:0%;background:var(--green-light);transition:width .1s}
.audio-message .duration{font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums}

/* منطقة الإدخال - الإرسال على اليمين والميكروفون على اليسار */
.chat-view .input-area{display:flex;padding:8px 10px;background:var(--bg-panel);gap:6px;align-items:center;flex-shrink:0;flex-direction:row-reverse}
.chat-view .input-area input{flex:1;padding:11px 15px;border:none;border-radius:25px;outline:none;font-size:15px;background:#fff;text-align:right;font-family:inherit}
.chat-view .input-area button{width:44px;height:44px;border-radius:50%;background:var(--green-light);color:#fff;border:none;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chat-view .input-area .mic-btn{background:#fff;color:var(--green-dark)}
.chat-view .input-area .mic-btn.recording{background:var(--red);color:#fff;animation:pulse-rec .8s infinite}
@keyframes pulse-rec{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.recording-indicator{position:absolute;bottom:70px;right:15px;background:var(--red);color:#fff;padding:10px 15px;border-radius:20px;font-size:13px;display:none;align-items:center;gap:8px;z-index:5}
.recording-indicator.show{display:flex}
.recording-indicator .dot{width:8px;height:8px;background:#fff;border-radius:50%;animation:pulse-rec .8s infinite}

/* نوافذ */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;justify-content:center;align-items:center;z-index:500;padding:20px}
.modal-overlay.active{display:flex}
.modal{background:#fff;border-radius:15px;padding:22px;width:100%;max-width:420px;max-height:85vh;overflow-y:auto;animation:popIn .25s ease}
@keyframes popIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.modal h3{color:var(--green-dark);font-size:18px;margin-bottom:15px;text-align:center}
.modal .user-search-item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:10px;cursor:pointer}
.modal .user-search-item:hover{background:#f0f2f5}
.modal .user-search-item .avatar{width:45px;height:45px;background:var(--green-light);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;font-size:18px;overflow:hidden;flex-shrink:0}
.modal .user-search-item .avatar img{width:100%;height:100%;object-fit:cover}
.modal .user-search-item .details{flex:1;min-width:0}
.modal .user-search-item .details .name{font-weight:600;font-size:14.5px}
.modal .user-search-item .details .email{font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modal .btn-secondary{width:100%;padding:12px;background:#f0f2f5;color:var(--text);border:none;border-radius:10px;font-size:14px;cursor:pointer;font-family:inherit;margin-top:15px}
.modal .profile-avatar{width:110px;height:110px;border-radius:50%;background:var(--green-light);display:flex;align-items:center;justify-content:center;font-size:42px;color:#fff;font-weight:bold;margin:0 auto 15px;overflow:hidden;position:relative;cursor:pointer}
.modal .profile-avatar img{width:100%;height:100%;object-fit:cover}
.modal .profile-avatar .edit-badge{position:absolute;bottom:0;right:0;width:32px;height:32px;background:var(--green-light);border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid #fff;font-size:13px}
.modal .profile-avatar input{display:none}
.modal label{display:block;font-size:13px;color:var(--text-muted);margin-bottom:5px;margin-top:12px}
.modal input[type=text],.modal input[type=tel],.modal input[type=email]{width:100%;padding:11px 14px;border:2px solid #e9edef;border-radius:10px;font-size:14px;outline:none;text-align:right;font-family:inherit}
.modal input:focus{border-color:var(--green-light)}

/* عارض الاستوري */
.story-viewer{position:fixed;inset:0;background:#000;z-index:800;display:none;flex-direction:column}
.story-viewer.active{display:flex}
.story-viewer .progress-bar{position:absolute;top:12px;left:12px;right:12px;height:3px;background:rgba(255,255,255,.3);border-radius:3px;overflow:hidden;z-index:5}
.story-viewer .progress-bar .fill{height:100%;background:#fff;width:0%;animation:progress 5s linear forwards}
@keyframes progress{from{width:0%}to{width:100%}}
.story-viewer .story-header{position:absolute;top:25px;left:15px;right:15px;display:flex;align-items:center;gap:12px;color:#fff;z-index:5}
.story-viewer .story-header .avatar{width:38px;height:38px;border-radius:50%;background:var(--green-light);display:flex;align-items:center;justify-content:center;font-weight:bold;overflow:hidden}
.story-viewer .story-header .avatar img{width:100%;height:100%;object-fit:cover}
.story-viewer .story-header .name{font-weight:600;font-size:14px}
.story-viewer .story-header .time{font-size:12px;opacity:.8}
.story-viewer .close-btn{position:absolute;top:25px;left:15px;background:transparent;border:none;color:#fff;font-size:26px;cursor:pointer;z-index:10;padding:5px}
.story-viewer .story-content{flex:1;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;padding:30px;text-align:center;word-break:break-word;background:linear-gradient(135deg,#075e54,#128c7e,#25d366)}

/* شاشة المكالمة */
.call-screen{position:fixed;inset:0;background:linear-gradient(135deg,#075e54,#0b141a);z-index:900;display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;padding:20px}
.call-screen.active{display:flex}
.call-screen .call-avatar{width:130px;height:130px;border-radius:50%;background:var(--green-light);display:flex;align-items:center;justify-content:center;font-size:55px;font-weight:bold;margin-bottom:25px;box-shadow:0 0 0 0 rgba(37,211,102,.7);animation:pulse 2s infinite;overflow:hidden}
.call-screen .call-avatar img{width:100%;height:100%;object-fit:cover}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(37,211,102,.7)}70%{box-shadow:0 0 0 30px rgba(37,211,102,0)}100%{box-shadow:0 0 0 0 rgba(37,211,102,0)}}
.call-screen .call-name{font-size:24px;font-weight:600;margin-bottom:8px}
.call-screen .call-status{font-size:15px;opacity:.85;margin-bottom:30px}
.call-screen .call-timer{font-size:14px;opacity:.7;margin-bottom:30px;font-variant-numeric:tabular-nums}
.call-screen .call-actions{display:flex;gap:30px}

.call-screen .video-overlay .call-name{display:block;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.8)}

@media(max-width:899px){.sidebar{display:none}}
</style>

<body>

<div class="auth-screen" id="authScreen">

      المتابعة باستخدام Google

<!-- نافذة الملف الشخصي -->

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getDatabase, ref, push, onChildAdded, onValue, set, remove, query, get, limitToLast, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAN11agW-TWwAk3TvF7mRZRt6PHLcnl_aQ",
  authDomain: "ym-pro-max.firebaseapp.com",
  databaseURL: "https://ym-pro-max-default-rtdb.firebaseio.com",
  projectId: "ym-pro-max",
  storageBucket: "ym-pro-max.firebasestorage.app",
  messagingSenderId: "174657071953",
  appId: "1:174657071953:web:5e831fc337df46dbd18170"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const googleProvider = new GoogleAuthProvider();
const $ = id => document.getElementById(id);

let isSignUp = false, currentUser = null, currentUserData = null, currentChatUser = null, allUsers = {};
let unsubMessages = null, unsubChats = null, unsubStories = null, unsubCalls = null, unsubNews = null, unsubOnline = null;

/* ============ 1. المصادقة ============ */
$('toggleBtn').onclick = () => {
  isSignUp = !isSignUp;
  $('formSubtitle').textContent = isSignUp ? 'أنشئ حسابك' : 'سجّل دخولك';
  $('authBtn').textContent = isSignUp ? 'إنشاء حساب' : 'تسجيل الدخول';
  $('displayNameInput').style.display = isSignUp ? 'block' : 'none';
  $('phoneInput').style.display = isSignUp ? 'block' : 'none';
  $('toggleText').textContent = isSignUp ? 'لديك حساب؟' : 'ليس لديك حساب؟';
  $('toggleBtn').textContent = isSignUp ? 'تسجيل الدخول' : 'إنشاء حساب';
  $('errorMsg').classList.remove('show');
};
function showError(m){$('errorMsg').textContent=m;$('errorMsg').classList.add('show')}
function hideError(){$('errorMsg').classList.remove('show')}
function translateAuthError(code){
  const e={'auth/email-already-in-use':'البريد مسجّل مسبقاً','auth/invalid-email':'البريد غير صحيح','auth/weak-password':'كلمة المرور ضعيفة (6+)','auth/user-not-found':'لا يوجد حساب','auth/wrong-password':'كلمة المرور خاطئة','auth/invalid-credential':'البيانات خاطئة','auth/too-many-requests':'محاولات كثيرة','auth/operation-not-allowed':'الطريقة غير مفعّلة','auth/unauthorized-domain':'النطاق غير مصرّح'};
  return e[code]||('خطأ: '+code);
}

$('authBtn').onclick = async () => {
  hideError();
  const email=$('emailInput').value.trim(), password=$('passwordInput').value,
        name=$('displayNameInput').value.trim(), phone=$('phoneInput').value.trim();
  if(!email||!password) return showError('أدخل البريد وكلمة المرور');
  if(password.length<6) return showError('كلمة المرور 6+ أحرف');
  if(isSignUp && name.length<2) return showError('أدخل اسماً صحيحاً');
  $('authBtn').disabled = true;
  try {
    if(isSignUp){
      const r = await createUserWithEmailAndPassword(auth, email, password);
      await updateProfile(r.user, {displayName:name});
      await set(ref(db,'users/'+r.user.uid),{uid:r.user.uid, name, email, phone:phone||null, photoURL:null, createdAt:Date.now()});
    } else {
      await signInWithEmailAndPassword(auth, email, password);
      const snap = await get(ref(db,'users/'+auth.currentUser.uid));
      if(!snap.exists()){
        await set(ref(db,'users/'+auth.currentUser.uid),{uid:auth.currentUser.uid,name:auth.currentUser.displayName||email.split('@')[0],email,phone:null,photoURL:null,createdAt:Date.now()});
      }
    }
  } catch(e){ showError(translateAuthError(e.code)); }
  finally { $('authBtn').disabled = false; }
};

$('googleBtn').onclick = async () => {
  hideError();
  $('googleBtn').disabled = true;
  try {
    const r = await signInWithPopup(auth, googleProvider);
    const snap = await get(ref(db,'users/'+r.user.uid));
    if(!snap.exists()){
      await set(ref(db,'users/'+r.user.uid),{uid:r.user.uid,name:r.user.displayName||r.user.email.split('@')[0],email:r.user.email,phone:null,photoURL:r.user.photoURL||null,createdAt:Date.now()});
    } else {
      // تحديث الصورة من Google إن تغيّرت
      const data = snap.val();
      if(r.user.photoURL && data.photoURL !== r.user.photoURL && !data.customPhoto){
        await update(ref(db,'users/'+r.user.uid), {photoURL: r.user.photoURL});
      }
    }
  } catch(e){ showError(translateAuthError(e.code)); }
  finally { $('googleBtn').disabled = false; }
};

onAuthStateChanged(auth, async user => {
  if(user){
    currentUser = user;
    $('authScreen').classList.add('hidden');
    $('app').classList.add('active');
    await loadCurrentUser();
    await loadAllUsers();
    buildSections();
    loadAllUsersList(); // عرض كل المستخدمين في الدردشة
    loadStories();
    loadCallHistory();
    loadNews();
    updateUI();
    set(ref(db,'onlineUsers/'+user.uid), {name:currentUserData?.name||user.email, at:Date.now()});
    window.addEventListener('beforeunload',()=>remove(ref(db,'onlineUsers/'+user.uid)));
    listenIncomingCalls();
  } else {
    currentUser = null; currentUserData = null;
    $('app').classList.remove('active');
    $('authScreen').classList.remove('hidden');
    [unsubChats,unsubStories,unsubCalls,unsubNews,unsubOnline].forEach(u=>u&&u());
  }
});

async function loadCurrentUser(){
  const snap = await get(ref(db,'users/'+currentUser.uid));
  currentUserData = snap.val() || {
    uid: currentUser.uid, name: currentUser.displayName||currentUser.email.split('@')[0],
    email: currentUser.email, phone: null, photoURL: currentUser.photoURL||null
  };
}

function updateUI(){
  if(!currentUserData) return;
  const name = currentUserData.name;
  const photo = currentUserData.photoURL;
  ['sideAvatar','mobileAvatar'].forEach(id=>{
    const el=$(id);
    if(photo) el.innerHTML=`<img src="${photo}">`;
    else el.innerHTML = `<i class="fas fa-user"></i>`;
  });
  $('sideName').textContent = name;
  $('sideEmail').textContent = currentUser.email;
  $('mobileEmail').textContent = currentUser.email;
}

/* ============ 2. الملف الشخصي ============ */
window.openProfileModal = () => {
  if(!currentUserData) return;
  $('profileName').value = currentUserData.name || '';
  $('profilePhone').value = currentUserData.phone || '';
  $('profileEmail').value = currentUserData.email || '';
  const el = $('profileAvatar');
  if(currentUserData.photoURL) el.innerHTML = `<img src="${currentUserData.photoURL}"><div class="edit-badge"><i class="fas fa-camera"></i></div><input type="file" id="avatarInput" accept="image/*">`;
  else el.innerHTML = `<i class="fas fa-user"></i><div class="edit-badge"><i class="fas fa-camera"></i></div><input type="file" id="avatarInput" accept="image/*">`;
  $('avatarInput').onchange = handleAvatarChange;
  $('profileModal').classList.add('active');
};
window.closeProfileModal = () => $('profileModal').classList.remove('active');

let pendingAvatarBase64 = null;
async function handleAvatarChange(e){
  const file = e.target.files[0];
  if(!file) return;
  const b64 = await fileToBase64(file);
  if(b64.length > 400000) return alert('الصورة كبيرة. اختر صورة أصغر من 300KB');
  pendingAvatarBase64 = b64;
  const el = $('profileAvatar');
  el.innerHTML = `<img src="${b64}"><div class="edit-badge"><i class="fas fa-camera"></i></div><input type="file" id="avatarInput" accept="image/*">`;
  $('avatarInput').onchange = handleAvatarChange;
}

$('saveProfileBtn').onclick = async () => {
  const name = $('profileName').value.trim();
  const phone = $('profilePhone').value.trim();
  if(name.length < 2) return alert('أدخل اسماً صحيحاً');
  const updates = { name, phone: phone||null };
  if(pendingAvatarBase64) {
    updates.photoURL = pendingAvatarBase64;
    updates.customPhoto = true;
  }
  await update(ref(db,'users/'+currentUser.uid), updates);
  if(currentUser) await updateProfile(currentUser, {displayName: name});
  await loadCurrentUser();
  await loadAllUsers();
  updateUI();
  pendingAvatarBase64 = null;
  alert('✅ تم حفظ التعديلات');
  closeProfileModal();
};

function fileToBase64(file){
  return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);});
}

/* ============ 3. بناء الأقسام ============ */
function buildSections(){
  const html = `
    <div class="section active" data-section="chats" id="chatsSection">
      <div class="search-box"><input type="text" id="chatsSearch" placeholder="ابحث في المستخدمين..."></div>
      <div class="chat-list" id="chatsList"></div>
    </div>
    <div class="section" data-section="stories">
      <div class="stories-grid" id="storiesGrid"></div>
    </div>
    <div class="section" data-section="calls">
      <div class="chat-list" id="callsList"></div>
    </div>
    <div class="section" data-section="news">
      <div class="news-container" id="newsContainer">
        <div class="news-compose">
          <textarea id="newsComposeText" placeholder="شارك شيئاً مع الجميع..."></textarea>
          <div class="actions">

/* ============ 4. التشفير ============ */
async function deriveKey(chatId){
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey('raw', enc.encode(chatId), {name:'PBKDF2'}, false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt: enc.encode('chat-salt-v1'), iterations: 100000, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function encryptText(text, chatId){
  try{
    const key = await deriveKey(chatId);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(text));
    const comb = new Uint8Array(iv.length + ct.byteLength);
    comb.set(iv); comb.set(new Uint8Array(ct), iv.length);
    let bin=''; for(let i=0;i<comb.length;i+=8192) bin+=String.fromCharCode.apply(null,comb.subarray(i,i+8192));
    return btoa(bin);
  }catch(e){ return text; }
}
async function decryptText(enc, chatId){
  try{
    const key = await deriveKey(chatId);
    const bin = atob(enc);
    const comb = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) comb[i]=bin.charCodeAt(i);
    const iv = comb.slice(0,12), ct = comb.slice(12);
    return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct));
  }catch(e){ return '[رسالة مشفرة]'; }
}
async function encryptBuffer(buffer, chatId){
  const key = await deriveKey(chatId);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, buffer);
  const comb = new Uint8Array(iv.length + ct.byteLength);
  comb.set(iv); comb.set(new Uint8Array(ct), iv.length);
  let bin=''; for(let i=0;i<comb.length;i+=8192) bin+=String.fromCharCode.apply(null,comb.subarray(i,i+8192));
  return btoa(bin);
}
async function decryptBuffer(b64, chatId){
  const key = await deriveKey(chatId);
  const bin = atob(b64);
  const comb = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) comb[i]=bin.charCodeAt(i);
  const iv = comb.slice(0,12), ct = comb.slice(12);
  return crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct);
}

async function renderAllUsers(online){
  const lists = document.querySelectorAll('#chatsList');
  if(!lists.length) return;
  const users = Object.values(allUsers).filter(u=>u.uid !== currentUser.uid);
  if(!users.length){
    lists.forEach(l=>l.innerHTML=`<div class="empty-state"><div class="big-icon"><i class="fas fa-users"></i></div><div>لا يوجد مستخدمون مسجلون بعد</div></div>`);

  }
  // جلب آخر رسالة + غير المقروء لكل مستخدم
  const results = await Promise.all(users.map(async u=>{
    const chatId = getChatId(currentUser.uid, u.uid);
    const msgSnap = await get(query(ref(db,'chats/'+chatId+'/messages'), limitToLast(1)));
    let lastMsg = msgSnap.exists() ? Object.values(msgSnap.val())[0] : null;
    const unreadSnap = await get(ref(db,'chats/'+chatId+'/unread/'+currentUser.uid));
    const unread = unreadSnap.exists() ? unreadSnap.val() : 0;
    return { u, lastMsg, unread, chatId, isOnline: !!online[u.uid] };
  }));
  results.sort((a,b)=>{
    if(a.isOnline !== b.isOnline) return b.isOnline - a.isOnline;
    return (b.lastMsg?.timestamp||0)-(a.lastMsg?.timestamp||0);
  });
  const html = await Promise.all(results.map(async ({u,lastMsg,unread,chatId,isOnline})=>{
    const name = u.name||'مستخدم';
    const initial = name.charAt(0).toUpperCase();
    const avatar = u.photoURL ? `<img src="${u.photoURL}">` : initial;
    const dot = isOnline ? '<div class="online-dot"></div>' : '';
    let lastText = u.phone ? `📱 ${u.phone}` : 'اضغط للمحادثة';
    if(lastMsg){
      if(lastMsg.type === 'audio') lastText = '🎤 رسالة صوتية';
      else if(lastMsg.text){ try{ lastText = await decryptText(lastMsg.text, chatId); }catch{ lastText = '[رسالة]'; } }
    }
    const time = lastMsg?formatTimeShort(new Date(lastMsg.timestamp)):'';
    const badge = unread>0?`<span class="badge">${unread}</span>`:'';
    return `<div class="chat-item" data-uid="${u.uid}" data-name="${escapeHtml(name)}" data-photo="${u.photoURL||''}" data-phone="${u.phone||''}">
      <div class="avatar">${avatar}${dot}</div>
      <div class="details"><div class="name">${escapeHtml(name)}</div><div class="last-msg">${escapeHtml(lastText).substring(0,50)}</div></div>
      <div class="meta"><div class="time">${time}</div>${badge}</div>
    </div>`;
  }));
  lists.forEach(l=>l.innerHTML=html.join(''));
  document.querySelectorAll('.chat-item').forEach(item=>{
    item.onclick = ()=>openChat(item.dataset.uid,item.dataset.name,item.dataset.photo);

function loadChatMessages(otherUid){
  if(unsubMessages) unsubMessages();
  const chatId = getChatId(currentUser.uid,otherUid);
  const area = $('messagesArea');
  area.innerHTML = '';
  unsubMessages = onChildAdded(ref(db,'chats/'+chatId+'/messages'), async snap=>{
    const data = snap.val(); if(!data) return;
    await renderMessage(snap.key, data, area, chatId);
    area.scrollTop = area.scrollHeight;
  });
}

async function renderMessage(key, data, area, chatId){
  const isMine = data.senderId===currentUser.uid;
  const msgDate = new Date(data.timestamp);
  const dateStr = formatDate(msgDate);
  const lastChild = area.lastElementChild;
  if(!lastChild || lastChild.textContent !== dateStr){
    const sep = document.createElement('div');
    sep.className='date-separator'; sep.textContent=dateStr;
    area.appendChild(sep);
  }
  const isRead = data.readBy && Object.keys(data.readBy).some(k=>k!==currentUser.uid);
  const check = isMine ? `<span class="check ${isRead?'read':''}"><i class="fas fa-check${isRead?'-double':''}"></i></span>` : '';
  const encBadge = data.encrypted ? '<span class="encrypted-badge"><i class="fas fa-lock"></i></span>' : '';
  const row = document.createElement('div');
  row.className = 'message-row '+(isMine?'mine':'other');
  const msg = document.createElement('div');
  msg.className = 'message '+(isMine?'mine':'other');
  if(data.type === 'audio' && data.audio){
    msg.innerHTML = `<div class="audio-message">
      <button class="audio-play-btn" data-audio="${data.audio}"><i class="fas fa-play"></i></button>
      <div class="audio-progress"><div class="fill"></div></div>
      <div class="duration">${formatDuration(data.duration||0)}</div>
    </div>
    <div class="msg-meta"><span>${formatTime(msgDate)}</span>${encBadge}${check}</div>`;
  } else {
    let text = data.text || '';
    if(data.encrypted && text) text = await decryptText(text, chatId);
    msg.innerHTML = `<span>${escapeHtml(text)}</span>
      <div class="msg-meta"><span>${formatTime(msgDate)}</span>${encBadge}${check}</div>`;
  }
  row.appendChild(msg);
  area.appendChild(row);
  if(!isMine && currentChatUser){
    update(ref(db,'chats/'+chatId+'/messages/'+key+'/readBy'),{[currentUser.uid]:true});
  }
}

let mediaRecorder=null, audioChunks=[], recordingStartTime=0, recordingTimer=null, isRecording=false;
$('micBtn').onclick = async () => { isRecording ? stopRecording() : await startRecording(); };
async function startRecording(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = []; recordingStartTime = Date.now(); isRecording = true;
    mediaRecorder.ondataavailable = e => { if(e.data.size>0) audioChunks.push(e.data); };
    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t=>t.stop());
      const blob = new Blob(audioChunks,{type:'audio/webm'});
      await sendAudioMessage(blob);
    };
    mediaRecorder.start();
    $('micBtn').classList.add('recording');
    $('micBtn').innerHTML = '<i class="fas fa-stop"></i>';
    $('recordingIndicator').classList.add('show');
    recordingTimer = setInterval(()=>{
      const secs = Math.floor((Date.now()-recordingStartTime)/1000);
      $('recordingTime').textContent = formatDuration(secs);
      if(secs>=60) stopRecording();
    },200);
  }catch(e){ alert('لا يمكن الوصول للميكروفون: '+e.message); }
}
function stopRecording(){
  if(mediaRecorder && isRecording){
    mediaRecorder.stop(); isRecording=false;
    clearInterval(recordingTimer);
    $('micBtn').classList.remove('recording');
    $('micBtn').innerHTML='<i class="fas fa-microphone"></i>';
    $('recordingIndicator').classList.remove('show');
  }
}
async function sendAudioMessage(blob){
  if(!currentChatUser) return;
  const chatId = getChatId(currentUser.uid,currentChatUser.uid);
  const duration = Math.round((Date.now()-recordingStartTime)/1000);
  const ab = await blob.arrayBuffer();
  const encAudio = await encryptBuffer(ab, chatId);
  if(encAudio.length > 700000){ alert('التسجيل طويل جداً'); return; }
  push(ref(db,'chats/'+chatId+'/messages'),{type:'audio',audio:encAudio,duration,encrypted:true,senderId:currentUser.uid,timestamp:Date.now(),readBy:{}});
  get(ref(db,'chats/'+chatId+'/unread/'+currentChatUser.uid)).then(s=>{
    set(ref(db,'chats/'+chatId+'/unread/'+currentChatUser.uid), (s.exists()?s.val():0)+1);
  });
}
document.addEventListener('click', async e => {
  const btn = e.target.closest('.audio-play-btn');
  if(!btn) return;
  const icon = btn.querySelector('i');
  if(icon.classList.contains('fa-pause')){
    if(window.currentAudio){ window.currentAudio.pause(); window.currentAudio=null; }
    document.querySelectorAll('.audio-play-btn i').forEach(i=>i.className='fas fa-play');
    return;
  }
  if(window.currentAudio) window.currentAudio.pause();
  document.querySelectorAll('.audio-play-btn i').forEach(i=>i.className='fas fa-play');
  const chatId = getChatId(currentUser.uid,currentChatUser.uid);
  try{
    const buf = await decryptBuffer(btn.dataset.audio, chatId);
    const url = URL.createObjectURL(new Blob([buf],{type:'audio/webm'}));
    const audio = new Audio(url);
    window.currentAudio = audio;
    icon.className='fas fa-pause';
    const pb = btn.parentElement.querySelector('.audio-progress .fill');
    audio.ontimeupdate = ()=>{ pb.style.width = ((audio.currentTime/audio.duration)*100)+'%'; };
    audio.onended = ()=>{ icon.className='fas fa-play'; pb.style.width='0%'; window.currentAudio=null; };
    audio.play();
  }catch(e){ alert('تعذّر التشغيل'); }
});

      <div class="comments" id="comments-${n.id}">
        <div id="comments-list-${n.id}">${commentsHtml}</div>
        <div class="comment-input">
          <input type="text" id="comment-input-${n.id}" placeholder="اكتب تعليقاً...">
          <button onclick="addComment('${n.id}')"><i class="fas fa-paper-plane"></i></button>
        </div>
      </div>
    </div>`;
  }).join('');
}

window.addComment = async (id) => {

};

/* ============ 11. WebRTC ============ */
const rtcConfig = {iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};
let pc=null, localStream=null, currentCallId=null, callType=null, callTimerInterval=null, callStartTime=0, isCaller=false, remoteAudio=null, unsubIncomingCalls=null;

$('startVoiceCall').onclick = ()=>startCall('voice');
$('startVideoCall').onclick = ()=>startCall('video');

async function startCall(type){
  if(!currentChatUser) return;
  isCaller = true; callType = type;
  try {
    localStream = await navigator.mediaDevices.getUserMedia({audio:true, video: type==='video'});
  } catch(e){ alert('لا يمكن الوصول للكاميرا/الميكروفون'); return; }
  currentCallId = currentUser.uid + '_' + currentChatUser.uid + '_' + Date.now();
  showCallScreen();
  $('callStatus').textContent = 'جاري الاتصال...';
  if(type === 'video'){ $('callScreen').classList.add('video-call'); $('localVideo').srcObject = localStream; $('videoCallName').textContent = currentChatUser.name; }
  createPeerConnection();
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await set(ref(db, `calls_signaling/${currentChatUser.uid}/incoming/${currentCallId}`), {
    from: currentUser.uid, fromName: currentUserData.name, fromPhoto: currentUserData.photoURL||null,
    type: callType, offer: {type:offer.type, sdp:offer.sdp}, timestamp: Date.now()
  });
  onValue(ref(db, `calls_signaling/${currentUser.uid}/active/${currentCallId}`), async snap=>{
    const data = snap.val();
    if(!data) return;
    if(data.answer && pc && pc.signalingState !== 'stable'){
      await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
      onCallConnected();
    }
    if(data.ended) endCallCleanup();
  });
  pc.onicecandidate = async e=>{
    if(e.candidate) await push(ref(db, `calls_signaling/${currentChatUser.uid}/active/${currentCallId}/callerCandidates`), e.candidate.toJSON());
  };
  onChildAdded(ref(db, `calls_signaling/${currentUser.uid}/active/${currentCallId}/receiverCandidates`), async snap=>{
    const c = snap.val();
    if(c && pc){ try{ await pc.addIceCandidate(new RTCIceCandidate(c)); }catch(e){} }
  });
  pc.ontrack = e=>{
    if(type==='video') $('remoteVideo').srcObject = e.streams[0];
    else { if(!remoteAudio){ remoteAudio = new Audio(); remoteAudio.autoplay = true; } remoteAudio.srcObject = e.streams[0]; }
    onCallConnected();
  };
}

function listenIncomingCalls(){
  if(unsubIncomingCalls) unsubIncomingCalls();
  unsubIncomingCalls = onChildAdded(ref(db, `calls_signaling/${currentUser.uid}/incoming`), snap=>{
    const data = snap.val();
    if(!data) return;
    if(Date.now() - data.timestamp > 30000){ remove(ref(db, `calls_signaling/${currentUser.uid}/incoming/${snap.key}`)); return; }
    if(window.currentIncomingCallId) return;
    window.currentIncomingCallId = snap.key;
    window.currentIncomingData = data;
    $('incomingCallerName').textContent = data.fromName;
    $('incomingCallType').textContent = data.type === 'video' ? 'مكالمة فيديو واردة' : 'مكالمة صوتية واردة';
    $('incomingCallModal').classList.add('active');
  });
}

$('acceptCallBtn').onclick = async ()=>{
  $('incomingCallModal').classList.remove('active');
  const callId = window.currentIncomingCallId, data = window.currentIncomingData;
  if(!callId || !data) return;
  isCaller = false; callType = data.type; currentCallId = callId;
  currentChatUser = {uid: data.from, name: data.fromName, photoURL: data.fromPhoto};
  try { localStream = await navigator.mediaDevices.getUserMedia({audio:true, video: callType==='video'}); }
  catch(e){ alert('لا يمكن الوصول للكاميرا'); return; }
  showCallScreen();
  $('callName').textContent = data.fromName;
  $('callStatus').textContent = 'جاري الاتصال...';
  if(callType === 'video'){ $('callScreen').classList.add('video-call'); $('localVideo').srcObject = localStream; $('videoCallName').textContent = data.fromName; }
  createPeerConnection();
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
  pc.ontrack = e=>{
    if(callType==='video') $('remoteVideo').srcObject = e.streams[0];
    else { if(!remoteAudio){ remoteAudio = new Audio(); remoteAudio.autoplay = true; } remoteAudio.srcObject = e.streams[0]; }
    onCallConnected();
  };
  pc.onicecandidate = async e=>{
    if(e.candidate) await push(ref(db, `calls_signaling/${data.from}/active/${callId}/receiverCandidates`), e.candidate.toJSON());
  };
  onChildAdded(ref(db, `calls_signaling/${currentUser.uid}/active/${callId}/callerCandidates`), async snap=>{
    const c = snap.val();
    if(c && pc){ try{ await pc.addIceCandidate(new RTCIceCandidate(c)); }catch(e){} }
  });
  await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  await update(ref(db, `calls_signaling/${data.from}/active/${callId}`), {answer:{type:answer.type,sdp:answer.sdp}, receiverId: currentUser.uid});
  await remove(ref(db, `calls_signaling/${currentUser.uid}/incoming/${callId}`));
  onValue(ref(db, `calls_signaling/${data.from}/active/${callId}/ended`), snap=>{ if(snap.exists()) endCallCleanup(); });
  window.currentIncomingCallId = null;
  window.currentIncomingData = null;
};

$('rejectCallBtn').onclick = async ()=>{
  const callId = window.currentIncomingCallId, data = window.currentIncomingData;
  if(callId && data){
    await update(ref(db, `calls_signaling/${data.from}/active/${callId}`), {ended:true});
    await remove(ref(db, `calls_signaling/${currentUser.uid}/incoming/${callId}`));
  }
  $('incomingCallModal').classList.remove('active');
  window.currentIncomingCallId = null; window.currentIncomingData = null;
};

function createPeerConnection(){
  pc = new RTCPeerConnection(rtcConfig);
  pc.onconnectionstatechange = ()=>{ if(pc.connectionState === 'disconnected' || pc.connectionState === 'failed') endCallCleanup(); };
}
function onCallConnected(){
  if(callTimerInterval) return;
  $('callStatus').textContent = 'متصل';
  callStartTime = Date.now();
  callTimerInterval = setInterval(()=>{
    const secs = Math.floor((Date.now()-callStartTime)/1000);
    const t = formatDuration(secs);
    $('callTimer').textContent = t; $('videoCallTimer').textContent = t;
  }, 1000);
}
function showCallScreen(){
  const initial = (currentChatUser.name||'U').charAt(0).toUpperCase();
  $('callAvatar').innerHTML = currentChatUser.photoURL ? `<img src="${currentChatUser.photoURL}">` : initial;
  $('callName').textContent = currentChatUser.name;
  $('callTimer').textContent = ''; $('videoCallTimer').textContent = '';
  $('callScreen').classList.add('active');
}
$('endCall').onclick = async ()=>{
  if(currentCallId) await update(ref(db, `calls_signaling/${currentChatUser.uid}/active/${currentCallId}`), {ended:true});
  endCallCleanup();
};
function endCallCleanup(){
  if(callTimerInterval){ clearInterval(callTimerInterval); callTimerInterval=null; }
  if(pc){ pc.close(); pc=null; }
  if(localStream){ localStream.getTracks().forEach(t=>t.stop()); localStream=null; }
  if(remoteAudio){ remoteAudio.pause(); remoteAudio=null; }
  if(currentCallId) remove(ref(db, `calls_signaling/${currentUser.uid}/active/${currentCallId}`));
  $('callScreen').classList.remove('active'); $('callScreen').classList.remove('video-call');
  $('localVideo').srcObject = null; $('remoteVideo').srcObject = null;
  if(currentChatUser && callStartTime && callType){
    const duration = Math.round((Date.now()-callStartTime)/1000);
    push(ref(db,'calls/'+currentUser.uid),{toUid:currentChatUser.uid,toName:currentChatUser.name,type:callType,direction:'out',duration,timestamp:Date.now()});
  }
  currentCallId=null; callType=null; isCaller=false; callStartTime=0;
  window.currentIncomingCallId=null; window.currentIncomingData=null;
}
$('muteCall').onclick = e=>{
  if(!localStream) return;
  const t = localStream.getAudioTracks()[0];
  if(t){ t.enabled = !t.enabled;
    e.currentTarget.classList.toggle('active', !t.enabled);
    e.currentTarget.innerHTML = t.enabled ? '<i class="fas fa-microphone"></i>' : '<i class="fas fa-microphone-slash"></i>';
  }
};

function loadCallHistory(){
  if(unsubCalls) unsubCalls();
  unsubCalls = onValue(ref(db,'calls/'+currentUser.uid), snap=>{
    const lists = document.querySelectorAll('#callsList');
    if(!lists.length) return;
    const list = Object.entries(snap.val()||{}).map(([id,c])=>({id,...c})).sort((a,b)=>b.timestamp-a.timestamp).slice(0,50);
    if(!list.length){ lists.forEach(l=>l.innerHTML=`<div class="empty-state"><div class="big-icon"><i class="fas fa-phone"></i></div><div>سجل المكالمات فارغ</div></div>`); return; }
    const html = list.map(c=>{
      const name = c.toName || 'مستخدم';
      const icon = c.type === 'video' ? 'fa-video' : 'fa-phone';
      const dirIcon = c.direction === 'out' ? 'fa-arrow-up out' : 'fa-arrow-down in';
      const dur = c.duration ? ` • ${formatDuration(c.duration)}` : '';
      return `<div class="call-item"><div class="avatar">${name.charAt(0).toUpperCase()}</div><div class="info"><div class="name">${escapeHtml(name)}</div><div class="meta"><i class="fas ${dirIcon}"></i><i class="fas ${icon}"></i><span>${formatTimeShort(new Date(c.timestamp))}${dur}</span></div></div></div>`;
    }).join('');
    lists.forEach(l=>l.innerHTML=html);
  });
}

/* ============ 12. أدوات ============ */
function formatTime(d){let h=d.getHours();const m=String(d.getMinutes()).padStart(2,'0');const p=h>=12?'م':'ص';h=h%12||12;return `${h}:${m} ${p}`;}
function formatTimeShort(d){const now=new Date();if(now.toDateString()===d.toDateString())return formatTime(d);return `${d.getDate()}/${d.getMonth()+1}`;}
function formatDate(d){const t=new Date(),y=new Date();y.setDate(t.getDate()-1);if(d.toDateString()===t.toDateString())return 'اليوم';if(d.toDateString()===y.toDateString())return 'أمس';return `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;}
function formatDuration(secs){const m=Math.floor(secs/60);const s=secs%60;return `${m}:${String(s).padStart(2,'0')}`;}
function escapeHtml(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML;}

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المتجر الإلكتروني المتكامل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
            <a href="#" class="text-2xl font-bold text-indigo-600 flex items-center gap-2">
                <i class="fa-solid fa-bag-shopping"></i> YM Pro Store
            </a>

            <div class="flex-1 max-w-md hidden md:block">
                <div class="relative">
                    <input type="text" id="searchInput" placeholder="ابحث عن منتج..." class="w-full bg-gray-100 border border-gray-300 rounded-full py-2 px-4 pr-10 text-sm focus:outline-none focus:border-indigo-500">
                    <i class="fa-solid fa-magnifying-glass absolute right-3 top-3 text-gray-400"></i>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <a href="admin.html" class="text-sm text-gray-600 hover:text-indigo-600"><i class="fa-solid fa-user-shield"></i> لوحة التحكم</a>
                <button id="cartBtn" class="relative p-2 text-gray-700 hover:text-indigo-600">
                    <i class="fa-solid fa-cart-shopping text-xl"></i>
                    <span id="cartCount" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">0</span>
                </button>
            </div>
        </div>
    </header>

    <section class="bg-indigo-900 text-white py-12 px-4 text-center">
        <h1 class="text-3xl md:text-5xl font-extrabold mb-4">أفضل العروض المتاحة الآن!</h1>
        <p class="text-indigo-200 mb-6">تسوق أحدث المنتجات بأسعار تنافسية وشحن سريع.</p>
        <a href="#products" class="bg-indigo-500 hover:bg-indigo-600 text-white px-6 py-3 rounded-lg font-semibold transition">تسوق الآن</a>
    </section>

    <main class="max-w-7xl mx-auto px-4 py-8 flex flex-col md:flex-row gap-8" id="products">
        <aside class="w-full md:w-1/4 bg-white p-4 rounded-lg shadow-sm h-fit">
            <h3 class="font-bold text-lg mb-4 border-b pb-2">الفلترة والترتيب</h3>
            <div class="mb-4">
                <label class="block text-sm font-medium mb-2">التصنيف</label>
                <select id="categoryFilter" class="w-full border rounded-md p-2 text-sm">
                    <option value="all">كل التصنيفات</option>
                    <option value="electronics">إلكترونيات</option>
                    <option value="clothes">ملابس</option>
                </select>
            </div>
        </aside>

        <section class="w-full md:w-3/4">
            <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <p class="col-span-full text-center text-gray-500">جاري تحميل المنتجات...</p>
            </div>
        </section>
    </main>

    <footer class="bg-gray-900 text-gray-300 py-8 mt-12 border-t border-gray-800">
        <div class="max-w-7xl mx-auto px-4 grid grid-cols-1 md:grid-cols-3 gap-8">
            <div>
                <h4 class="text-white font-bold mb-3">عن المتجر</h4>
                <p class="text-sm text-gray-400">متجرك الأول للتسوق الإلكتروني بسهولة وأمان.</p>
            </div>
            <div>
                <h4 class="text-white font-bold mb-3">روابط سريعة</h4>
                <ul class="text-sm space-y-2">
                    <li><a href="#" class="hover:underline">سياسة الخصوصية</a></li>
                    <li><a href="#" class="hover:underline">الشروط والأحكام</a></li>
                </ul>
            </div>
            <div>
                <h4 class="text-white font-bold mb-3">وسائل الدفع المقبولة</h4>
                <div class="flex gap-3 text-2xl">
                    <i class="fa-brands fa-cc-visa"></i>
                    <i class="fa-brands fa-cc-mastercard"></i>
                    <i class="fa-solid fa-money-bill-wave"></i>
                </div>
            </div>
        </div>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAN11agW-TWwAk3TvF7mRZRt6PHLcnl_aQ",
            authDomain: "ym-pro-max.firebaseapp.com",
            projectId: "ym-pro-max",
            storageBucket: "ym-pro-max.firebasestorage.app",
            messagingSenderId: "174657071953",
            appId: "1:174657071953:web:5e831fc337df46dbd18170"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // جلب المنتجات وعرضها
        async function loadProducts() {
            const querySnapshot = await getDocs(collection(db, "products"));
            const productsGrid = document.getElementById("productsGrid");
            productsGrid.innerHTML = "";

            if(querySnapshot.empty) {
                productsGrid.innerHTML = `<p class="col-span-full text-center text-gray-500">لا توجد منتجات مضافة حالياً. يرجى إضافتها من لوحة التحكم.</p>`;
                return;
            }

            querySnapshot.forEach((doc) => {
                const item = doc.data();
                productsGrid.innerHTML += `
                    <div class="bg-white rounded-lg shadow-sm overflow-hidden border">
                        <img src="${item.imageUrl || 'https://via.placeholder.com/300'}" class="w-full h-48 object-cover">
                        <div class="p-4">
                            <span class="text-xs text-indigo-600 bg-indigo-50 px-2 py-1 rounded">${item.category || 'عام'}</span>
                            <h3 class="font-bold text-lg mt-2">${item.title}</h3>
                            <p class="text-sm text-gray-500 mt-1">${item.description}</p>
                            <div class="flex justify-between items-center mt-4">
                                <span class="font-bold text-lg text-indigo-600">${item.price} $</span>
                                <button class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm px-3 py-2 rounded">إضافة للسلة</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        loadProducts();
    </script>
</body>
</html>

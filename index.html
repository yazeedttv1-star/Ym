<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a1014">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="غرفة يزيد">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="غرفة يزيد">
<meta name="description" content="غرفة دردشة يزيد - دردشة جماعية مباشرة">
<title>غرفة يزيد</title>
<link rel="manifest" id="appManifest">
<link rel="apple-touch-icon" id="appleIcon">
<link rel="icon" id="favIcon">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --green:#00a884;--green-dark:#008069;--green-deep:#005c4b;--green-light:#25d366;--green-pale:#d9fdd3;
  --bg-app:#f0f2f5;--bg-panel:#fff;--bg-chat:#efeae2;--bg-input:#fff;
  --text:#111b21;--text-muted:#667781;--border:#e9edef;--hover:#f5f6f6;--red:#ea0038;--blue:#027eb5;
  --shadow-sm:0 1px 2px rgba(11,20,26,.08);--shadow-md:0 4px 12px rgba(11,20,26,.12);--shadow-lg:0 8px 28px rgba(11,20,26,.18);
}
[data-theme="dark"]{
  --bg-app:#0a1014;--bg-panel:#111b21;--bg-chat:#0b141a;--bg-input:#202c33;
  --text:#e9edef;--text-muted:#8696a0;--border:#222d34;--hover:#182229;--green-pale:#005c4b;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{height:100%;overflow:hidden;font-family:'Cairo',sans-serif;background:var(--bg-app);color:var(--text);transition:background .3s,color .3s;overscroll-behavior:none}
body{display:flex;justify-content:center;align-items:center;height:100vh;height:100dvh}

button,a,[role="button"],.chat-item,.story-card,.user-search-item,.nav-btn,.dropdown-menu button,.context-menu button,.message{cursor:pointer;-webkit-user-select:none;-moz-user-select:none;user-select:none;touch-action:manipulation}
button:active,.chat-item:active,.nav-btn:active{opacity:.75;transition:opacity .1s}
input,textarea{touch-action:manipulation;-webkit-user-select:text;user-select:text}

/* المصادقة */
.auth-screen{position:fixed;inset:0;background:linear-gradient(135deg,#00a884,#008069,#005c4b);display:flex;justify-content:center;align-items:center;z-index:1000;padding:16px;overflow-y:auto;transition:opacity .3s,visibility .3s}
.auth-screen.hidden{opacity:0;visibility:hidden;pointer-events:none}
.auth-box{background:var(--bg-panel);padding:24px 20px;border-radius:18px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,.35);margin:auto;animation:slideUp .45s cubic-bezier(.2,.9,.3,1.1)}
@keyframes slideUp{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.auth-box .logo{width:70px;height:70px;background:linear-gradient(135deg,#25d366,#00a884);border-radius:20px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff;box-shadow:0 6px 16px rgba(0,168,132,.4)}
.auth-box h1{color:var(--text);margin-bottom:4px;font-size:22px;text-align:center;font-weight:700}
.auth-box p.subtitle{color:var(--text-muted);margin-bottom:18px;font-size:12.5px;text-align:center}
.auth-tabs{display:flex;background:var(--bg-app);border-radius:10px;padding:3px;margin-bottom:16px}
[data-theme="dark"] .auth-tabs{background:#202c33}
.auth-tab{flex:1;padding:9px;background:transparent;border:none;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--text-muted);transition:all .2s}
.auth-tab.active{background:var(--bg-panel);color:var(--green);box-shadow:var(--shadow-sm)}
.auth-box .input-group{position:relative;margin-bottom:10px}
.auth-box .input-group i{position:absolute;top:50%;right:14px;transform:translateY(-50%);color:var(--text-muted);font-size:13px;pointer-events:none}
.auth-box input{width:100%;padding:12px 40px 12px 14px;border:2px solid var(--border);background:var(--bg-panel);color:var(--text);border-radius:10px;font-size:14px;outline:none;text-align:right;font-family:inherit}
.auth-box input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(0,168,132,.1)}
.btn-primary{width:100%;padding:12px;background:linear-gradient(135deg,#25d366,#00a884);color:#fff;border:none;border-radius:10px;font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 3px 10px rgba(0,168,132,.3)}
.btn-primary:active{transform:scale(.98)}
.btn-primary:disabled{background:#b1b3b5;box-shadow:none;cursor:not-allowed}
.btn-google{width:100%;padding:11px;background:var(--bg-panel);color:var(--text);border:2px solid var(--border);border-radius:10px;font-size:13.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;font-family:inherit}
.btn-google svg{width:18px;height:18px}
.error-msg{background:rgba(234,0,56,.1);color:var(--red);padding:10px 12px;border-radius:9px;font-size:12.5px;margin-bottom:12px;display:none;text-align:right;border-right:3px solid var(--red);font-weight:500}
.error-msg.show{display:block}
.divider{display:flex;align-items:center;gap:10px;margin:14px 0;color:var(--text-muted);font-size:11.5px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}

/* التطبيق */
.app{width:100%;max-width:520px;height:100vh;height:100dvh;background:var(--bg-panel);display:none;flex-direction:column;overflow:hidden;position:relative;color:var(--text)}
.app.active{display:flex}
@media(min-width:700px){.app{max-width:800px;height:95vh;max-height:950px;border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.5)}}

.app-header{background:var(--green-dark);color:#fff;padding:10px 12px;display:flex;align-items:center;gap:8px;flex-shrink:0;position:relative;z-index:30;box-shadow:0 2px 6px rgba(0,0,0,.15)}
[data-theme="dark"] .app-header{background:#202c33}
.app-header .menu-btn{background:transparent;border:none;color:#fff;font-size:16px;cursor:pointer;padding:7px;border-radius:50%;flex-shrink:0}
.app-header .menu-btn:active{background:rgba(255,255,255,.2)}
.app-header .room-info{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.app-header .room-avatar{width:42px;height:42px;background:linear-gradient(135deg,#25d366,#00a884);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.2);font-weight:700}
.app-header .room-details{flex:1;min-width:0}
.app-header .room-details .name{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-header .room-details .status{font-size:11px;opacity:.9;display:flex;align-items:center;gap:5px}
.app-header .room-details .status::before{content:'';width:6px;height:6px;background:var(--green-light);border-radius:50%;box-shadow:0 0 6px var(--green-light)}
.app-header .icon-btn{background:transparent;border:none;color:#fff;font-size:16px;cursor:pointer;padding:8px;border-radius:50%;flex-shrink:0;position:relative}
.app-header .icon-btn:active{background:rgba(255,255,255,.2)}
.app-header .icon-btn .badge{position:absolute;top:4px;right:4px;background:var(--red);color:#fff;font-size:9px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;font-weight:700;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--green-dark)}

.dropdown-menu{position:absolute;top:58px;left:12px;background:var(--bg-panel);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px 0;min-width:210px;display:none;z-index:100;color:var(--text);border:1px solid var(--border)}
.dropdown-menu.show{display:block;animation:dropIn .2s cubic-bezier(.2,.9,.3,1.2)}
@keyframes dropIn{from{opacity:0;transform:translateY(-10px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.dropdown-menu button{display:flex;width:100%;padding:11px 15px;background:transparent;border:none;text-align:right;font-size:13px;cursor:pointer;font-family:inherit;color:var(--text);align-items:center;gap:10px}
.dropdown-menu button:active{background:var(--hover)}
.dropdown-menu button i{width:18px;text-align:center;color:var(--green);font-size:13px}
.dropdown-menu hr{border:none;border-top:1px solid var(--border);margin:5px 0}

.messages-area{flex:1;padding:14px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;touch-action:pan-y;background:var(--bg-chat)}
[data-theme="dark"] .messages-area{background:#0b141a}
.message-row{display:flex;width:100%;animation:msgIn .25s cubic-bezier(.2,.9,.3,1.1);position:relative;gap:8px}
@keyframes msgIn{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.message-row.mine{justify-content:flex-start}
.message-row.other{justify-content:flex-end}
.message-row .sender-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#25d366,#00a884);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;overflow:hidden;flex-shrink:0;align-self:flex-end;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.message-row .sender-avatar img{width:100%;height:100%;object-fit:cover}
.message{max-width:75%;padding:7px 11px 5px;border-radius:12px;font-size:13.5px;word-wrap:break-word;box-shadow:var(--shadow-sm);line-height:1.4;position:relative;cursor:pointer;user-select:none;transition:transform .15s,box-shadow .2s}
.message:active{transform:scale(.98)}
.message.mine{background:var(--green-pale);border-top-right-radius:3px}
[data-theme="dark"] .message.mine{background:#005c4b;color:#e9edef}
.message.other{background:var(--bg-panel);border-top-left-radius:3px}
[data-theme="dark"] .message.other{background:#202c33;color:#e9edef}
.message.selected{background:rgba(0,168,132,.35) !important;box-shadow:0 0 0 2px var(--green)}
.message .sender-name{font-size:12px;font-weight:700;color:var(--green);margin-bottom:3px;display:block}
[data-theme="dark"] .message .sender-name{color:var(--green-light)}
.message .msg-meta{font-size:10px;color:var(--text-muted);margin-top:3px;display:flex;justify-content:flex-start;align-items:center;gap:4px}
.message .check{font-size:11px;color:var(--green-light)}
.message .check.read{color:var(--blue)}
.message .edited-tag{font-size:9.5px;color:var(--text-muted);font-style:italic}
.message img.msg-image,.message video.msg-video{max-width:260px;width:100%;border-radius:8px;margin-bottom:4px;display:block}
.date-separator{align-self:center;background:var(--bg-panel);color:var(--text-muted);font-size:10.5px;padding:5px 11px;border-radius:9px;box-shadow:var(--shadow-sm);margin:6px 0;font-weight:500}

.audio-message{display:flex;align-items:center;gap:9px;min-width:180px}
.audio-message button{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#25d366,#00a884);color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px}
.audio-message .audio-progress{flex:1;height:3px;background:rgba(0,0,0,.12);border-radius:3px;position:relative;overflow:hidden}
[data-theme="dark"] .audio-message .audio-progress{background:rgba(255,255,255,.15)}
.audio-message .audio-progress .fill{position:absolute;top:0;right:0;height:100%;width:0%;background:var(--green)}
.audio-message .duration{font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums}

.input-area{display:flex;padding:8px 10px;background:var(--bg-panel);gap:5px;align-items:center;flex-shrink:0;border-top:1px solid var(--border);padding-bottom:max(8px,env(safe-area-inset-bottom))}
[data-theme="dark"] .input-area{background:#202c33}
.input-area .icon-btn-sm{width:40px;height:40px;border-radius:50%;background:transparent;color:var(--text-muted);border:none;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.input-area .icon-btn-sm:active{background:var(--hover);color:var(--green)}
.input-area input{flex:1;padding:11px 15px;border:none;border-radius:22px;outline:none;font-size:14px;background:var(--bg-app);color:var(--text);text-align:right;font-family:inherit;min-width:0}
[data-theme="dark"] .input-area input{background:#2a3942}
.input-area .mic-btn{background:linear-gradient(135deg,#25d366,#00a884);color:#fff}
.input-area .mic-btn.recording{background:var(--red);animation:pulse-rec .8s infinite}
.input-area .send-btn{background:linear-gradient(135deg,#25d366,#00a884);color:#fff;display:none}
.input-area .send-btn.show{display:flex}
.input-area .mic-btn.hide{display:none}
@keyframes pulse-rec{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

.recording-indicator{position:absolute;bottom:76px;right:14px;background:var(--red);color:#fff;padding:9px 14px;border-radius:20px;font-size:12.5px;display:none;align-items:center;gap:8px;z-index:5;box-shadow:0 4px 12px rgba(234,0,56,.4)}
.recording-indicator.show{display:flex}
.recording-indicator .dot{width:8px;height:8px;background:#fff;border-radius:50%;animation:pulse-rec .8s infinite}

.emoji-picker{position:absolute;bottom:64px;right:10px;background:var(--bg-panel);border-radius:14px;box-shadow:var(--shadow-lg);padding:10px;width:290px;max-height:320px;overflow-y:auto;display:none;z-index:60;grid-template-columns:repeat(7,1fr);gap:3px;border:1px solid var(--border);touch-action:pan-y}
.emoji-picker.show{display:grid}
.emoji-picker .emoji{font-size:22px;cursor:pointer;text-align:center;padding:5px;border-radius:6px}
.emoji-picker .emoji:active{background:var(--hover);transform:scale(1.15)}

.context-menu{position:fixed;background:var(--bg-panel);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px 0;min-width:190px;display:none;z-index:700;color:var(--text);border:1px solid var(--border);animation:popIn .15s}
.context-menu.show{display:block}
.context-menu button{display:flex;width:100%;padding:11px 15px;background:transparent;border:none;text-align:right;font-size:13.5px;cursor:pointer;font-family:inherit;color:var(--text);align-items:center;gap:12px}
.context-menu button:active{background:var(--hover)}
.context-menu button i{width:20px;text-align:center;font-size:14px;color:var(--text-muted)}
.context-menu button.danger{color:var(--red)}
.context-menu button.danger i{color:var(--red)}

/* الشريط السفلي */
.bottom-nav{display:flex;background:var(--bg-panel);flex-shrink:0;height:60px;border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
[data-theme="dark"] .bottom-nav{background:#202c33}
.bottom-nav .nav-btn{flex:1;background:transparent;border:none;color:var(--text-muted);font-size:10.5px;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative}
.bottom-nav .nav-btn.active{color:var(--green)}
.bottom-nav .nav-btn.active::before{content:'';position:absolute;top:0;left:30%;right:30%;height:3px;background:var(--green);border-radius:0 0 3px 3px}
.bottom-nav .nav-btn .icon{font-size:18px}

/* النوافذ */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;justify-content:center;align-items:center;z-index:500;padding:16px;backdrop-filter:blur(4px)}
.modal-overlay.active{display:flex;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.modal{background:var(--bg-panel);color:var(--text);border-radius:16px;padding:20px;width:100%;max-width:420px;max-height:88vh;overflow-y:auto;animation:popIn .3s cubic-bezier(.2,.9,.3,1.1);border:1px solid var(--border);touch-action:pan-y}
@keyframes popIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.modal h3{color:var(--text);font-size:17px;margin-bottom:16px;text-align:center;font-weight:700}
.modal .profile-avatar{width:100px;height:100px;border-radius:50%;background:linear-gradient(135deg,#25d366,#00a884);display:flex;align-items:center;justify-content:center;font-size:38px;color:#fff;font-weight:700;margin:0 auto 16px;overflow:hidden;position:relative;cursor:pointer;box-shadow:0 4px 16px rgba(0,168,132,.3)}
.modal .profile-avatar img{width:100%;height:100%;object-fit:cover}
.modal .profile-avatar .edit-badge{position:absolute;bottom:1px;left:1px;width:30px;height:30px;background:var(--green);border-radius:50%;display:flex;align-items:center;justify-content:center;border:2.5px solid var(--bg-panel);font-size:12px;color:#fff}
.modal .profile-avatar input{display:none}
.modal label{display:block;font-size:12.5px;color:var(--text-muted);margin-bottom:5px;margin-top:12px;font-weight:600}
.modal input[type=text],.modal input[type=tel],.modal input[type=email],.modal textarea{width:100%;padding:11px 13px;border:2px solid var(--border);background:var(--bg-panel);color:var(--text);border-radius:10px;font-size:13.5px;outline:none;text-align:right;font-family:inherit}
.modal input:focus,.modal textarea:focus{border-color:var(--green)}
.modal input:disabled{opacity:.6}
.modal .lang-options,.modal .theme-options{display:flex;gap:8px;margin-top:6px}
.modal .lang-option,.modal .theme-option{flex:1;padding:11px;background:var(--bg-app);border:2px solid transparent;border-radius:10px;font-size:13px;cursor:pointer;text-align:center;font-family:inherit;color:var(--text);font-weight:600}
[data-theme="dark"] .modal .lang-option,[data-theme="dark"] .modal .theme-option{background:#202c33}
.modal .lang-option.active,.modal .theme-option.active{border-color:var(--green);background:rgba(0,168,132,.1);color:var(--green)}
.modal .theme-option{display:flex;flex-direction:column;align-items:center;gap:5px}
.modal .theme-option i{font-size:18px}
.modal .btn-secondary{width:100%;padding:11px;background:var(--bg-app);color:var(--text);border:none;border-radius:10px;font-size:13.5px;cursor:pointer;font-family:inherit;margin-top:14px;font-weight:600}
[data-theme="dark"] .modal .btn-secondary{background:#202c33}
.modal .member-item{display:flex;align-items:center;gap:11px;padding:10px;border-radius:11px}
.modal .member-item .avatar{width:42px;height:42px;background:linear-gradient(135deg,#25d366,#00a884);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px;overflow:hidden;flex-shrink:0;position:relative}
.modal .member-item .avatar img{width:100%;height:100%;object-fit:cover}
.modal .member-item .avatar .online-dot{position:absolute;bottom:0;left:0;width:11px;height:11px;background:var(--green-light);border-radius:50%;border:2px solid var(--bg-panel)}
.modal .member-item .details{flex:1;min-width:0}
.modal .member-item .details .name{font-weight:600;font-size:13.5px}
.modal .member-item .details .status{font-size:11.5px;color:var(--text-muted);margin-top:2px}

.story-viewer{position:fixed;inset:0;background:#000;z-index:800;display:none;flex-direction:column}
.story-viewer.active{display:flex;animation:fadeIn .25s}
.story-viewer .progress-bar{position:absolute;top:12px;left:12px;right:12px;height:3px;background:rgba(255,255,255,.3);border-radius:3px;overflow:hidden;z-index:5}
.story-viewer .progress-bar .fill{height:100%;background:#fff;width:0%;animation:progress 5s linear forwards}
@keyframes progress{from{width:0%}to{width:100%}}
.story-viewer .story-header{position:absolute;top:24px;left:14px;right:14px;display:flex;align-items:center;gap:11px;color:#fff;z-index:5}
.story-viewer .story-header .avatar{width:38px;height:38px;border-radius:50%;background:var(--green-light);display:flex;align-items:center;justify-content:center;font-weight:700;overflow:hidden;border:2px solid #fff}
.story-viewer .story-header .avatar img{width:100%;height:100%;object-fit:cover}
.story-viewer .story-header .name{font-weight:600;font-size:14px}
.story-viewer .story-header .time{font-size:11.5px;opacity:.8}
.story-viewer .close-btn{position:absolute;top:24px;left:14px;background:rgba(0,0,0,.4);border:none;color:#fff;font-size:22px;cursor:pointer;z-index:10;padding:6px;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
.story-viewer .story-content{flex:1;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;padding:30px;text-align:center;word-break:break-word;background:linear-gradient(135deg,#00a884,#005c4b);font-weight:500}
.story-viewer img,.story-viewer video{max-width:100%;max-height:100%;object-fit:contain}

/* PWA Install Banner */
.install-banner{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--bg-panel);padding:12px 16px;border-radius:14px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:12px;z-index:400;transition:transform .4s cubic-bezier(.2,.9,.3,1.2);border:1px solid var(--border);max-width:calc(100% - 24px);width:380px}
.install-banner.show{transform:translateX(-50%) translateY(0)}
.install-banner .icon{width:44px;height:44px;background:linear-gradient(135deg,#25d366,#00a884);border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;flex-shrink:0}
.install-banner .text{flex:1;min-width:0}
.install-banner .text .title{font-weight:700;font-size:13.5px}

<body>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getDatabase, ref, push, onChildAdded, onValue, set, remove, query, get, limitToLast, update, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAN11agW-TWwAk3TvF7mRZRt6PHLcnl_aQ",
  authDomain: "ym-pro-max.firebaseapp.com",
  databaseURL: "https://ym-pro-max-default-rtdb.firebaseio.com",
  projectId: "ym-pro-max",
  storageBucket: "ym-pro-max.firebasestorage.app",
  messagingSenderId: "174657071953",
  appId: "1:174657071953:web:5e831fc337df46dbd18170"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const googleProvider = new GoogleAuthProvider();
const $ = id => document.getElementById(id);

/* ============ اسم الغرفة (ثابت) ============ */
const ROOM_ID = 'yezid';
const ROOM_NAME = 'غرفة يزيد';

/* ============ bindTap موحّد ============ */
function bindTap(el, handler){
  if(!el || el.dataset.tapBound) return;
  el.dataset.tapBound = '1';
  let lastTouch = 0;
  el.addEventListener('touchend', e => {
    lastTouch = Date.now();
    e.preventDefault();
    handler(e);
  }, {passive: false});
  el.addEventListener('click', e => {
    if(Date.now() - lastTouch < 600) return;
    handler(e);
  });
}

/* ============ الحالة ============ */
let isSignUp = false, currentUser = null, currentUserData = null;
let unsubMessages = null, unsubOnline = null, unsubStories = null, unsubTyping = null;
let appTheme = localStorage.getItem('app_theme') || 'dark';
let appLanguage = localStorage.getItem('app_lang') || 'ar';
let pendingAvatarBase64 = null;
let currentMessages = {};
let selectedMessages = new Set();
let isSelectionMode = false;
let currentContextMsgId = null;
let currentContextMsgData = null;
let onlineUsers = {};
let typingUsers = {};
let isPageVisible = true;
let unreadCount = 0;
let lastSeenTimestamp = localStorage.getItem('lastSeen_' + ROOM_ID) ? parseInt(localStorage.getItem('lastSeen_' + ROOM_ID)) : 0;

/* ============ الثيم ============ */
function applyTheme(){
  document.documentElement.setAttribute('data-theme', appTheme);
  document.querySelectorAll('.theme-option').forEach(el => el.classList.toggle('active', el.dataset.theme === appTheme));
  const txt = appTheme === 'dark' ? 'الوضع الفاتح' : 'الوضع الداكن';
  if($('themeBtnText')) $('themeBtnText').textContent = txt;
}
function toggleTheme(){
  appTheme = appTheme === 'dark' ? 'light' : 'dark';
  localStorage.setItem('app_theme', appTheme);
  applyTheme();
}

/* ============ المصادقة ============ */
bindTap($('tabLogin'), () => switchAuth(false));
bindTap($('tabSignup'), () => switchAuth(true));
function switchAuth(signup){
  isSignUp = signup;
  $('tabLogin').classList.toggle('active', !signup);
  $('tabSignup').classList.toggle('active', signup);
  $('authBtn').textContent = signup ? 'إنشاء حساب' : 'تسجيل الدخول';
  $('nameGroup').style.display = signup ? 'block' : 'none';
  $('errorMsg').classList.remove('show');
}
function showError(m){ $('errorMsg').textContent = m; $('errorMsg').classList.add('show'); }
function hideError(){ $('errorMsg').classList.remove('show'); }
function translateAuthError(code){
  const e = {
    'auth/email-already-in-use':'هذا البريد مسجّل مسبقاً','auth/invalid-email':'البريد غير صحيح',
    'auth/weak-password':'كلمة المرور ضعيفة (6+)','auth/user-not-found':'لا يوجد حساب',
    'auth/wrong-password':'كلمة المرور خاطئة','auth/invalid-credential':'البيانات خاطئة',
    'auth/too-many-requests':'محاولات كثيرة','auth/operation-not-allowed':'الطريقة غير مفعّلة',
    'auth/unauthorized-domain':'النطاق غير مصرّح','auth/popup-closed-by-user':'تم إغلاق النافذة'
  };
  return e[code] || 'حدث خطأ، حاول مرة أخرى';
}

bindTap($('authBtn'), async () => {
  hideError();
  const email = $('emailInput').value.trim();
  const password = $('passwordInput').value;
  const name = $('displayNameInput').value.trim();
  if(!email || !password) return showError('أدخل البريد وكلمة المرور');
  if(password.length < 6) return showError('كلمة المرور 6+ أحرف');
  if(isSignUp && name.length < 2) return showError('أدخل اسماً صحيحاً');
  $('authBtn').disabled = true;
  try {
    if(isSignUp){
      const r = await createUserWithEmailAndPassword(auth, email, password);
      await updateProfile(r.user, {displayName: name});
      await set(ref(db,'users/'+r.user.uid), {
        uid: r.user.uid, name, email, photoURL: null,
        customPhoto: false, language: appLanguage, createdAt: Date.now()
      });
    } else {
      await signInWithEmailAndPassword(auth, email, password);
      const snap = await get(ref(db,'users/'+auth.currentUser.uid));
      if(!snap.exists()){
        await set(ref(db,'users/'+auth.currentUser.uid), {
          uid: auth.currentUser.uid, name: auth.currentUser.displayName || email.split('@')[0],
          email, photoURL: auth.currentUser.photoURL || null, customPhoto: false,
          language: appLanguage, createdAt: Date.now()
        });
      }
    }
  } catch(e){ showError(translateAuthError(e.code)); }
  finally { $('authBtn').disabled = false; }
});

bindTap($('googleBtn'), async () => {
  hideError();
  $('googleBtn').disabled = true;
  try {
    const r = await signInWithPopup(auth, googleProvider);
    const snap = await get(ref(db,'users/'+r.user.uid));
    if(!snap.exists()){
      await set(ref(db,'users/'+r.user.uid), {
        uid: r.user.uid, name: r.user.displayName || r.user.email.split('@')[0],
        email: r.user.email, photoURL: r.user.photoURL || null,
        customPhoto: false, language: appLanguage, createdAt: Date.now()
      });
    }
  } catch(e){ showError(translateAuthError(e.code)); }
  finally { $('googleBtn').disabled = false; }
});

onAuthStateChanged(auth, async user => {
  if(user){
    currentUser = user;
    $('authScreen').classList.add('hidden');
    $('app').classList.add('active');
    await loadCurrentUser();
    enterRoom();
    set(ref(db,'onlineUsers/'+user.uid), {
      name: currentUserData?.name || user.email,
      photoURL: currentUserData?.photoURL || null,
      at: Date.now()
    });
    window.addEventListener('beforeunload', () => remove(ref(db,'onlineUsers/'+user.uid)));
    document.addEventListener('visibilitychange', () => {
      isPageVisible = !document.hidden;
      if(isPageVisible){
        set(ref(db,'onlineUsers/'+user.uid), {
          name: currentUserData?.name || user.email,
          photoURL: currentUserData?.photoURL || null,
          at: Date.now()
        });
        unreadCount = 0;
        updateUnreadBadge();
        markAllAsSeen();
      }
    });
    setInterval(() => {
      if(isPageVisible && currentUser){
        update(ref(db,'onlineUsers/'+user.uid), {at: Date.now()});
      }
    }, 60000);
    setTimeout(bindAllButtons, 200);
  } else {
    currentUser = null; currentUserData = null;
    $('app').classList.remove('active');
    $('authScreen').classList.remove('hidden');
    [unsubMessages, unsubOnline, unsubStories, unsubTyping].forEach(u => u && u());
  }
});

async function loadCurrentUser(){
  const snap = await get(ref(db,'users/'+currentUser.uid));
  if(snap.exists()){
    currentUserData = snap.val();
    if(currentUserData.language){ appLanguage = currentUserData.language; localStorage.setItem('app_lang', appLanguage); }
  } else {
    currentUserData = {
      uid: currentUser.uid, name: currentUser.displayName || currentUser.email.split('@')[0],
      email: currentUser.email, photoURL: currentUser.photoURL || null, customPhoto: false
    };
  }
}

/* ============ الدخول إلى الغرفة ============ */
function enterRoom(){
  const area = $('messagesArea');
  area.innerHTML = '';
  currentMessages = {};

  // الاستماع للرسائل
  unsubMessages = onChildAdded(ref(db,'rooms/'+ROOM_ID+'/messages'), snap => {
    const data = snap.val();
    if(!data) return;
    currentMessages[snap.key] = data;
    if(data.deletedFor && data.deletedFor[currentUser.uid]) return;
    renderMessage(snap.key, data, area);
    if(isPageVisible){
      area.scrollTop = area.scrollHeight;
      lastSeenTimestamp = data.timestamp;
      localStorage.setItem('lastSeen_' + ROOM_ID, lastSeenTimestamp);
    } else if(data.senderId !== currentUser.uid){
      unreadCount++;
      updateUnreadBadge();
    }
  });

  // الاستماع للأعضاء المتصلين
  unsubOnline = onValue(ref(db,'onlineUsers'), snap => {
    onlineUsers = snap.val() || {};
    const count = Object.keys(onlineUsers).length;
    $('onlineCount').textContent = `${count} متصل الآن`;
    $('membersBadge').textContent = count;
    $('membersBadge').style.display = 'flex';
  });

  // الاستماع لمن يكتب
  unsubTyping = onValue(ref(db,'rooms/'+ROOM_ID+'/typing'), snap => {
    typingUsers = snap.val() || {};
    updateTypingIndicator();
  });
}

function markAllAsSeen(){
  if(!currentMessages) return;
  const keys = Object.keys(currentMessages);
  if(!keys.length) return;
  const lastKey = keys[keys.length - 1];
  const lastMsg = currentMessages[lastKey];
  if(lastMsg){
    lastSeenTimestamp = lastMsg.timestamp;
    localStorage.setItem('lastSeen_' + ROOM_ID, lastSeenTimestamp);
  }
}

function updateUnreadBadge(){
  if(unreadCount > 0){
    document.title = `(${unreadCount}) ${ROOM_NAME}`;
  } else {
    document.title = ROOM_NAME;
  }
}

function updateTypingIndicator(){
  const now = Date.now();
  const active = Object.values(typingUsers).filter(t => t && (now - t.at) < 3000 && t.name !== currentUserData.name);
  const names = [...new Set(active.map(t => t.name))];
  if(names.length === 0){
    $('onlineCount').textContent = `${Object.keys(onlineUsers).length} متصل الآن`;
    return;
  }
  if(names.length === 1) $('onlineCount').textContent = `${names[0]} يكتب...`;
  else if(names.length === 2) $('onlineCount').textContent = `${names[0]} و${names[1]} يكتبان...`;
  else $('onlineCount').textContent = `${names.length} أشخاص يكتبون...`;
}

/* ============ عرض الرسائل ============ */
async function renderMessage(key, data, area){
  const existing = area.querySelector(`[data-msg-id="${key}"]`);
  if(existing) existing.remove();

  const isMine = data.senderId === currentUser.uid;
  const msgDate = new Date(data.timestamp);
  const dateStr = formatDate(msgDate);
  const lastChild = area.lastElementChild;
  if(!lastChild || !lastChild.classList.contains('date-separator') || lastChild.textContent !== dateStr){
    const sep = document.createElement('div');
    sep.className = 'date-separator';
    sep.textContent = dateStr;
    area.appendChild(sep);
  }

  const row = document.createElement('div');
  row.className = 'message-row ' + (isMine ? 'mine' : 'other');

  // أفاتار المرسل (فقط للرسائل الأخرى)
  if(!isMine){
    const senderAvatar = document.createElement('div');
    senderAvatar.className = 'sender-avatar';
    if(data.senderPhoto){
      senderAvatar.innerHTML = `<img src="${data.senderPhoto}">`;
    } else {
      senderAvatar.textContent = (data.senderName || 'U').charAt(0).toUpperCase();
    }
    row.appendChild(senderAvatar);
  }

  const msg = document.createElement('div');
  msg.className = 'message ' + (isMine ? 'mine' : 'other');
  msg.dataset.msgId = key;

  if(data.deletedForAll){
    msg.innerHTML = `<div style="font-style:italic;opacity:.6;"><i class="fas fa-ban"></i> تم حذف هذه الرسالة</div>
      <div class="msg-meta"><span>${formatTime(msgDate)}</span></div>`;
  } else {
    let senderNameHtml = '';
    if(!isMine){
      senderNameHtml = `<span class="sender-name">${escapeHtml(data.senderName)}</span>`;
    }
    const encBadge = data.encrypted ? '<span style="color:var(--green);font-size:9.5px;margin-left:5px;"><i class="fas fa-lock"></i></span>' : '';
    const editedTag = data.edited ? '<span class="edited-tag">(تم التعديل)</span>' : '';
    const check = isMine ? `<span class="check"><i class="fas fa-check"></i></span>` : '';

    if(data.type === 'audio' && data.audio){
      msg.innerHTML = senderNameHtml + `
        <div class="audio-message">
          <button class="audio-play-btn" data-audio="${data.audio}"><i class="fas fa-play"></i></button>
          <div class="audio-progress"><div class="fill"></div></div>
          <div class="duration">${formatDuration(data.duration||0)}</div>
        </div>
        <div class="msg-meta"><span>${formatTime(msgDate)}</span>${encBadge}${editedTag}${check}</div>`;
    } else if(data.type === 'image' && data.media){
      try {
        const buf = await decryptBuffer(data.media, ROOM_ID);
        const url = URL.createObjectURL(new Blob([buf], {type: data.mime || 'image/jpeg'}));
        msg.innerHTML = senderNameHtml + `<img class="msg-image" src="${url}">
          <div class="msg-meta"><span>${formatTime(msgDate)}</span>${encBadge}${check}</div>`;
      } catch(e){
        msg.innerHTML = senderNameHtml + `<div>[صورة]</div><div class="msg-meta"><span>${formatTime(msgDate)}</span>${check}</div>`;
      }
    } else if(data.type === 'video' && data.media){
      try {
        const buf = await decryptBuffer(data.media, ROOM_ID);
        const url = URL.createObjectURL(new Blob([buf], {type: data.mime || 'video/mp4'}));
        msg.innerHTML = senderNameHtml + `<video class="msg-video" src="${url}" controls></video>
          <div class="msg-meta"><span>${formatTime(msgDate)}</span>${encBadge}${check}</div>`;
      } catch(e){
        msg.innerHTML = senderNameHtml + `<div>[فيديو]</div><div class="msg-meta"><span>${formatTime(msgDate)}</span>${check}</div>`;
      }
    } else {
      let text = data.text || '';
      if(data.encrypted && text) text = await decryptText(text, ROOM_ID);
      msg.innerHTML = senderNameHtml + `<span>${escapeHtml(text)}</span>
        <div class="msg-meta"><span>${formatTime(msgDate)}</span>${encBadge}${editedTag}${check}</div>`;
    }
  }
  row.appendChild(msg);
  area.appendChild(row);
  attachLongPress(msg, key);
}

/* ============ الضغط الطويل ============ */
function attachLongPress(el, msgId){
  if(!el || el.dataset.lpBound) return;
  el.dataset.lpBound = '1';
  let startX = 0, startY = 0, moved = false, fired = false, timer = null;
  const cancel = () => { if(timer){ clearTimeout(timer); timer = null; } };
  const start = (x, y) => {
    startX = x; startY = y; moved = false; fired = false;
    cancel();
    timer = setTimeout(() => {
      fired = true; timer = null;
      if(isSelectionMode) toggleMessageSelection(msgId);
      else showContextMenu(msgId, x, y);
      if(navigator.vibrate) navigator.vibrate(30);
    }, 500);
  };
  const move = (x, y) => {
    if(Math.abs(x - startX) > 12 || Math.abs(y - startY) > 12){ moved = true; cancel(); }
  };
  const end = () => {
    cancel();
    if(fired || moved) return;
    if(isSelectionMode) toggleMessageSelection(msgId);
  };
  el.addEventListener('touchstart', e => { const t = e.touches[0]; start(t.clientX, t.clientY); }, {passive: true});
  el.addEventListener('touchmove', e => { const t = e.touches[0]; move(t.clientX, t.clientY); }, {passive: true});
  el.addEventListener('touchend', end);
  el.addEventListener('touchcancel', cancel);
  el.addEventListener('mousedown', e => start(e.clientX, e.clientY));
  el.addEventListener('mousemove', e => { if(timer) move(e.clientX, e.clientY); });
  el.addEventListener('mouseup', end);
  el.addEventListener('mouseleave', cancel);
  el.addEventListener('contextmenu', e => e.preventDefault());
}

/* ============ قائمة السياق ============ */
function showContextMenu(msgId, x, y){
  currentContextMsgId = msgId;
  const data = currentMessages[msgId];
  if(!data) return;
  currentContextMsgData = data;
  const isMine = data.senderId === currentUser.uid;
  const canEdit = isMine && data.text && !data.deletedForAll && (Date.now() - data.timestamp < 15 * 60 * 1000);
  const canDeleteAll = isMine && !data.deletedForAll;

  let html = '';
  html += `<button data-ctx="reply"><i class="fas fa-reply"></i> رد</button>`;
  if(data.text && !data.deletedForAll){
    html += `<button data-ctx="copy"><i class="fas fa-copy"></i> نسخ</button>`;
  }
  if(canEdit){
    html += `<button data-ctx="edit"><i class="fas fa-edit"></i> تعديل</button>`;
  }
  html += `<button data-ctx="select"><i class="fas fa-check-square"></i> تحديد</button>`;
  html += `<button data-ctx="deleteMe" class="danger"><i class="fas fa-trash"></i> حذف لدي</button>`;
  if(canDeleteAll){
    html += `<button data-ctx="deleteAll" class="danger"><i class="fas fa-trash-alt"></i> حذف للجميع</button>`;
  }

  const cm = $('contextMenu');
  cm.innerHTML = html;
  cm.style.visibility = 'hidden';
  cm.classList.add('show');
  const rect = cm.getBoundingClientRect();
  const vw = window.innerWidth, vh = window.innerHeight;
  let left = x, top = y;
  if(left + rect.width > vw - 10) left = vw - rect.width - 10;
  if(top + rect.height > vh - 10) top = vh - rect.height - 10;
  if(left < 10) left = 10;
  if(top < 10) top = 10;
  cm.style.left = left + 'px';
  cm.style.top = top + 'px';
  cm.style.visibility = '';

  cm.querySelectorAll('button').forEach(btn => {
    bindTap(btn, () => {
      cm.classList.remove('show');
      handleContextAction(btn.dataset.ctx);
    });
  });
}

async function handleContextAction(action){
  if(!currentContextMsgId || !currentContextMsgData) return;
  const msgId = currentContextMsgId;
  const data = currentContextMsgData;

  if(action === 'reply'){
    // الرد على الرسالة (سنضع علامة > قبل النص)
    const replyName = data.senderName || 'مستخدم';
    const replyText = data.text ? (data.encrypted ? await decryptText(data.text, ROOM_ID) : data.text) : '[مرفق]';
    $('messageInput').value = `> ${replyName}: ${replyText.substring(0, 40)}\n`;
    $('messageInput').focus();
    $('messageInput').dispatchEvent(new Event('input'));
  } else if(action === 'copy'){
    if(data.text){
      try {
        const text = data.encrypted ? await decryptText(data.text, ROOM_ID) : data.text;
        await navigator.clipboard.writeText(text);
        alert('✅ تم نسخ الرسالة');
      } catch(e){ alert('تعذّر النسخ'); }
    }
  } else if(action === 'edit'){
    $('editMsgInput') || createEditModal();
    $('editMsgInput').value = data.text ? await decryptText(data.text, ROOM_ID) : '';
    $('editMsgModal').classList.add('active');
    bindTap($('saveEditBtn'), async () => {
      const newText = $('editMsgInput').value.trim();
      if(!newText) return;
      const enc = await encryptText(newText, ROOM_ID);
      await update(ref(db,'rooms/'+ROOM_ID+'/messages/'+msgId), {
        text: enc, edited: true, editedAt: Date.now()
      });
      $('editMsgModal').classList.remove('active');
    });
  } else if(action === 'select'){
    enterSelectionMode();
    toggleMessageSelection(msgId);
  } else if(action === 'deleteMe'){
    await update(ref(db,'rooms/'+ROOM_ID+'/messages/'+msgId+'/deletedFor'), {[currentUser.uid]: true});
    const el = document.querySelector(`[data-msg-id="${msgId}"]`);
    if(el) el.remove();
  } else if(action === 'deleteAll'){
    await update(ref(db,'rooms/'+ROOM_ID+'/messages/'+msgId), {
      deletedForAll: true, text: null, media: null, audio: null
    });
  }
  currentContextMsgId = null;
  currentContextMsgData = null;
}

  selectedMessages.clear();

    const bar = document.createElement('div');
    bar.id = 'selectionBar';

function exitSelectionMode(){
  isSelectionMode = false;
  selectedMessages.clear();
  if($('selectionBar')) $('selectionBar').style.display = 'none';
  document.querySelectorAll('.message.selected').forEach(m => m.classList.remove('selected'));
}
function toggleMessageSelection(msgId){
  if(selectedMessages.has(msgId)) selectedMessages.delete(msgId);
  else selectedMessages.add(msgId);
  const el = document.querySelector(`.message[data-msg-id="${msgId}"]`);
  if(el) el.classList.toggle('selected', selectedMessages.has(msgId));
  updateSelectionUI();
}
function updateSelectionUI(){
  if(!$('selCount')) return;
  $('selCount').textContent = `${selectedMessages.size} محدد`;
  if(selectedMessages.size === 0) exitSelectionMode();
}
async function deleteSelected(){
  if(selectedMessages.size === 0) return;
  if(!confirm(`حذف ${selectedMessages.size} رسالة؟`)) return;
  const updates = {};
  for(const id of selectedMessages){
    const data = currentMessages[id];
    if(!data) continue;
    if(data.senderId === currentUser.uid){
      updates[`rooms/${ROOM_ID}/messages/${id}/deletedForAll`] = true;
      updates[`rooms/${ROOM_ID}/messages/${id}/text`] = null;
      updates[`rooms/${ROOM_ID}/messages/${id}/media`] = null;
      updates[`rooms/${ROOM_ID}/messages/${id}/audio`] = null;
    } else {
      updates[`rooms/${ROOM_ID}/messages/${id}/deletedFor/${currentUser.uid}`] = true;
    }
  }
  await update(ref(db), updates);
  // إعادة تحميل
  const area = $('messagesArea');
  area.innerHTML = '';
  const snap = await get(query(ref(db,'rooms/'+ROOM_ID+'/messages'), limitToLast(200)));
  if(snap.exists()){
    const msgs = snap.val();
    for(const key of Object.keys(msgs)){
      if(msgs[key].deletedFor && msgs[key].deletedFor[currentUser.uid]) continue;
      await renderMessage(key, msgs[key], area);
    }
    area.scrollTop = area.scrollHeight;
  }
  exitSelectionMode();
}
async function copySelected(){
  const texts = [];
  for(const id of selectedMessages){
    const data = currentMessages[id];
    if(data && data.text){
      try {
        const t = data.encrypted ? await decryptText(data.text, ROOM_ID) : data.text;
        texts.push(`${data.senderName}: ${t}`);
      } catch(e){}
    }
  }
  if(texts.length){
    try {
      await navigator.clipboard.writeText(texts.join('\n'));
      alert(`✅ تم نسخ ${texts.length} رسالة`);
    } catch(e){ alert('تعذّر النسخ'); }
  }
  exitSelectionMode();
}

async function sendMediaToRoom(file){
  if(!currentUser || !currentUserData) return;
  const isVideo = file.type.startsWith('video');
  const isImage = file.type.startsWith('image');
  if(!isVideo && !isImage) return alert('نوع الملف غير مدعوم');
  let processedFile = file;
  if(isImage && file.size > 500 * 1024){
    try { processedFile = await compressImage(file, 1600, 0.82); } catch(e){}
  }
  const maxSize = isVideo ? 8 * 1024 * 1024 : 6 * 1024 * 1024;
  if(processedFile.size > maxSize) return alert(`الملف كبير جداً. الحد الأقصى ${isVideo ? '8' : '6'} ميجابايت`);
  const ab = await processedFile.arrayBuffer();
  let encMedia;
  try { encMedia = await encryptBuffer(ab, ROOM_ID); }
  catch(e){ return alert('فشل معالجة الملف'); }
  if(encMedia.length > 900000) return alert('الملف كبير جداً بعد التشفير');
  await push(ref(db,'rooms/'+ROOM_ID+'/messages'), {
    type: isVideo ? 'video' : 'image',
    media: encMedia, mime: processedFile.type, encrypted: true,
    senderId: currentUser.uid,
    senderName: currentUserData.name,
    senderPhoto: currentUserData.photoURL || null,
    timestamp: Date.now()
  });
}

/* ============ التسجيل الصوتي ============ */
let mediaRecorder = null, audioChunks = [], recordingStartTime = 0, recordingTimer = null, isRecording = false;

async function startRecording(){
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio: true});
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = []; recordingStartTime = Date.now(); isRecording = true;
    mediaRecorder.ondataavailable = e => { if(e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(audioChunks, {type: 'audio/webm'});
      await sendAudioMessage(blob);
    };
    mediaRecorder.start();
    $('micBtn').classList.add('recording');
    $('micBtn').innerHTML = '<i class="fas fa-stop"></i>';
    $('recordingIndicator').classList.add('show');
    recordingTimer = setInterval(() => {
      const secs = Math.floor((Date.now() - recordingStartTime) / 1000);
      $('recordingTime').textContent = formatDuration(secs);
      if(secs >= 60) stopRecording();
    }, 200);
  } catch(e){ alert('لا يمكن الوصول إلى الميكروفون: ' + e.message); }
}
function stopRecording(){
  if(mediaRecorder && isRecording){
    mediaRecorder.stop(); isRecording = false;
    clearInterval(recordingTimer);
    $('micBtn').classList.remove('recording');
    $('micBtn').innerHTML = '<i class="fas fa-microphone"></i>';
    $('recordingIndicator').classList.remove('show');
  }
}
function toggleMic(){ isRecording ? stopRecording() : startRecording(); }

async function sendAudioMessage(blob){
  if(!currentUser || !currentUserData) return;
  const duration = Math.round((Date.now() - recordingStartTime) / 1000);
  const ab = await blob.arrayBuffer();
  const encAudio = await encryptBuffer(ab, ROOM_ID);
  if(encAudio.length > 700000){ alert('التسجيل طويل جداً'); return; }
  await push(ref(db,'rooms/'+ROOM_ID+'/messages'), {
    type: 'audio', audio: encAudio, duration, encrypted: true,
    senderId: currentUser.uid,
    senderName: currentUserData.name,
    senderPhoto: currentUserData.photoURL || null,
    timestamp: Date.now()
  });
}

/* ============ التشفير ============ */
async function deriveKey(roomId){
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey('raw', enc.encode('room-' + roomId), {name:'PBKDF2'}, false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt: enc.encode('room-salt-v1'), iterations: 100000, hash:'SHA-256'},
    km, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']
  );
}
async function encryptText(text, roomId){
  try {
    const key = await deriveKey(roomId);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(text));
    const comb = new Uint8Array(iv.length + ct.byteLength);
    comb.set(iv); comb.set(new Uint8Array(ct), iv.length);
    return b64Encode(comb);
  } catch(e){ return text; }
}
async function decryptText(enc, roomId){
  try {
    const key = await deriveKey(roomId);
    const comb = b64Decode(enc);
    const iv = comb.slice(0,12), ct = comb.slice(12);
    return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct));
  } catch(e){ return '[رسالة مشفرة]'; }
}
async function encryptBuffer(buffer, roomId){
  const key = await deriveKey(roomId);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, buffer);
  const comb = new Uint8Array(iv.length + ct.byteLength);
  comb.set(iv); comb.set(new Uint8Array(ct), iv.length);
  return b64Encode(comb);
}
async function decryptBuffer(b64, roomId){
  const key = await deriveKey(roomId);
  const comb = b64Decode(b64);
  const iv = comb.slice(0,12), ct = comb.slice(12);
  return crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct);
}
function b64Encode(uint8){
  let bin = '';
  const chunk = 16384;
  for(let i = 0; i < uint8.length; i += chunk){
    bin += String.fromCharCode.apply(null, uint8.subarray(i, i + chunk));
  }
  return btoa(bin);
}
function b64Decode(b64){
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}
async function compressImage(file, maxSize = 1600, quality = 0.85){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let w = img.width, h = img.height;
        if(w > maxSize || h > maxSize){
          if(w > h){ h = (h / w) * maxSize; w = maxSize; }
          else { w = (w / h) * maxSize; h = maxSize; }
        }
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        canvas.toBlob(blob => {
          if(blob) resolve(new File([blob], file.name.replace(/\.[^.]+$/, '.jpg'), {type:'image/jpeg'}));
          else reject(new Error('فشل ضغط الصورة'));
        }, 'image/jpeg', quality);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ============ الملف الشخصي ============ */
function openProfileModal(){
  if(!currentUserData) return;
  $('profileName').value = currentUserData.name || '';
  $('profileEmail').value = currentUserData.email || '';
  const el = $('profileAvatar');
  const inputHtml = `<input type="file" id="avatarInput" accept="image/*">`;
  if(currentUserData.photoURL){
    el.innerHTML = `<img src="${currentUserData.photoURL}"><div class="edit-badge"><i class="fas fa-camera"></i></div>${inputHtml}`;
  } else {
    el.innerHTML = `<i class="fas fa-user"></i><div class="edit-badge"><i class="fas fa-camera"></i></div>${inputHtml}`;
  }
  $('avatarInput').onchange = handleAvatarChange;
  $('profileModal').classList.add('active');
}
async function handleAvatarChange(e){
  const file = e.target.files[0];
  if(!file) return;
  if(file.size > 5 * 1024 * 1024) return alert('الصورة كبيرة جداً. اختر صورة أصغر من 5MB');
  const b64 = await fileToBase64(file);
  if(b64.length > 700000) return alert('الصورة كبيرة جداً بعد الترميز');
  pendingAvatarBase64 = b64;
  const el = $('profileAvatar');
  el.innerHTML = `<img src="${b64}"><div class="edit-badge"><i class="fas fa-camera"></i></div><input type="file" id="avatarInput" accept="image/*">`;
  $('avatarInput').onchange = handleAvatarChange;
}
async function saveProfile(){
  const name = $('profileName').value.trim();
  if(name.length < 2) return alert('أدخل اسماً صحيحاً');
  const updates = { name };
  if(pendingAvatarBase64){ updates.photoURL = pendingAvatarBase64; updates.customPhoto = true; }
  await update(ref(db,'users/'+currentUser.uid), updates);
  if(currentUser) await updateProfile(currentUser, {displayName: name});
  await loadCurrentUser();
  // تحديث الأعضاء
  await update(ref(db,'onlineUsers/'+currentUser.uid), {
    name: currentUserData.name,
    photoURL: currentUserData.photoURL || null
  });
  pendingAvatarBase64 = null;
  alert('✅ تم حفظ التعديلات');
  $('profileModal').classList.remove('active');
}
function fileToBase64(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

/* ============ الأعضاء ============ */
function openMembersModal(){
  const list = $('membersList');
  const now = Date.now();
  const users = Object.entries(onlineUsers)
    .filter(([uid, u]) => u && (now - u.at) < 120000)
    .sort((a, b) => b[1].at - a[1].at);
  if(!users.length){
    list.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-muted);">لا يوجد أعضاء متصلون</div>';
  } else {
    list.innerHTML = users.map(([uid, u]) => {
      const isMe = uid === currentUser.uid;
      const initial = (u.name || 'U').charAt(0).toUpperCase();
      const avatar = u.photoURL ? `<img src="${u.photoURL}">` : initial;
      return `<div class="member-item">
        <div class="avatar">${avatar}<div class="online-dot"></div></div>
        <div class="details">
          <div class="name">${escapeHtml(u.name)}${isMe ? ' (أنت)' : ''}</div>
          <div class="status">متصل الآن</div>
        </div>
      </div>`;
    }).join('');
  }
  $('membersModal').classList.add('active');
}

function formatTime(d){
  let h = d.getHours();
  const m = String(d.getMinutes()).padStart(2,'0');
  const p = h >= 12 ? 'م' : 'ص';
  h = h % 12 || 12;
  return `${h}:${m} ${p}`;
}
function formatDate(d){
  const t = new Date(), y = new Date(); y.setDate(t.getDate()-1);
  if(d.toDateString() === t.toDateString()) return 'اليوم';
  if(d.toDateString() === y.toDateString()) return 'أمس';
  return `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
}
function formatDuration(secs){
  const m = Math.floor(secs/60);
  const s = secs % 60;
  return `${m}:${String(s).padStart(2,'0')}`;
}
function escapeHtml(t){
  const d = document.createElement('div');
  d.textContent = t;
  return d.innerHTML;
}

let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  setTimeout(() => showInstallBanner(), 3000);
});
function showInstallBanner(){
  if(localStorage.getItem('install_dismissed') === 'true') return;
  if(window.matchMedia('(display-mode: standalone)').matches) return;
  $('installBanner').classList.add('show');
}
function hideInstallBanner(){
  $('installBanner').classList.remove('show');
  localStorage.setItem('install_dismissed', 'true');
}
async function installPWA(){
  hideInstallBanner();
  if(deferredPrompt){
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    console.log('Install outcome:', outcome);
    deferredPrompt = null;
  } else {
    alert('لتثبيت التطبيق:\n- على Android: افتح القائمة → "إضافة إلى الشاشة الرئيسية"\n- على iPhone: زر المشاركة → "إضافة إلى الشاشة الرئيسية"\n- على Chrome/Edge: أيقونة التثبيت في شريط العنوان');
  }
}

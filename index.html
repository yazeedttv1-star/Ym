<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>متجر يزيد</title>
<meta name="theme-color" content="#e91e63">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--p:#e91e63;--p2:#f06292;--a:#f59e0b;--bg:#fff7fa;--c:#fff;--t:#2a1a22;--m:#8a7480;--b:#f3dfe7;--sh:0 4px 18px rgba(233,30,99,.12)}
[data-theme=dark]{--bg:#150d11;--c:#21151b;--t:#fbeef3;--m:#b49aa5;--b:#38242d}
*{box-sizing:border-box;margin:0;font-family:Cairo,sans-serif}
body{background:var(--bg);color:var(--t);padding-bottom:calc(76px + env(safe-area-inset-bottom));padding-top:env(safe-area-inset-top)}
button{cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--b);border-radius:12px;background:var(--c);color:var(--t);margin:5px 0;font-size:15px}
.hd{position:sticky;top:env(safe-area-inset-top);z-index:20;display:flex;align-items:center;gap:8px;padding:10px 14px;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--b)}
.hd .br{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--p);font-size:18px;flex:1}
.hd .br img{width:34px;height:34px;border-radius:10px;object-fit:cover}
.sr{display:none;flex:1;max-width:380px}
.ib{position:relative;width:38px;height:38px;border-radius:50%;background:var(--c);box-shadow:var(--sh);display:grid;place-items:center}
.ib b{position:absolute;top:-4px;left:-4px;background:var(--a);color:#fff;border-radius:99px;font-size:11px;min-width:18px;height:18px;display:grid;place-items:center;animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.15)}}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{from{opacity:0;transform:scale(.9)}}
main{max-width:1200px;margin:auto;padding:14px;animation:up .4s}
.hero{border-radius:24px;padding:28px 20px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;display:flex;align-items:center;gap:16px;min-height:150px;overflow:hidden;position:relative}
.hero h1{font-size:24px;flex:1;line-height:1.5}
.hero img{width:120px;height:120px;border-radius:20px;object-fit:cover}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0}
.chip{padding:8px 16px;border-radius:99px;background:var(--c);border:1px solid var(--b);white-space:nowrap}
.chip.on{background:var(--p);color:#fff;border-color:var(--p)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}.hero h1{font-size:34px}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}.sr{display:block}}
@media(min-width:1200px){.grid{grid-template-columns:repeat(6,1fr)}}
.cd{background:var(--c);border-radius:18px;padding:10px;box-shadow:var(--sh);animation:pop .35s;display:flex;flex-direction:column;gap:6px}
.im{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--b);cursor:pointer}
.im img{width:100%;height:100%;object-fit:cover}
.bd{position:absolute;top:8px;right:8px;background:var(--a);color:#fff;font-size:12px;padding:2px 9px;border-radius:99px}
.bd.no{background:#777}
.hr{position:absolute;top:6px;left:6px;width:32px;height:32px;border-radius:50%;background:var(--c);color:var(--m)}
.hr.on{color:var(--p)}
.cd h3{font-size:14px;min-height:40px}
.pr{font-weight:800;color:var(--p)}
.pr s{color:var(--m);font-weight:400;font-size:12px;margin-right:6px}
.bt{background:var(--p);color:#fff;padding:10px 14px;border-radius:12px;font-weight:600;width:100%}
.bt:disabled{opacity:.45}
.bt.sc{background:var(--c);color:var(--p);border:1px solid var(--p)}
.bt.dn{background:#d32f2f}
.bt.sm{width:auto;padding:6px 12px;font-size:13px}
.bn{position:fixed;bottom:0;inset-inline:0;z-index:20;display:flex;justify-content:space-around;background:var(--c);border-top:1px solid var(--b);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.bn button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--m);flex:1;position:relative}
.bn button i{font-size:19px}
.bn button.on{color:var(--p)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:none}
.ov.on{display:flex}
.dr{margin-inline-end:auto;width:min(420px,100%);height:100%;background:var(--bg);padding:16px;overflow:auto;animation:up .25s}
.md{margin:auto;width:min(520px,94%);max-height:92%;overflow:auto;background:var(--bg);border-radius:22px;padding:18px;animation:pop .25s}
.row{display:flex;align-items:center;gap:10px;background:var(--c);border-radius:14px;padding:10px;margin:8px 0;box-shadow:var(--sh)}
.row img{width:54px;height:54px;border-radius:10px;object-fit:cover}
.row .f{flex:1;min-width:0}
.row small{color:var(--m);display:block}
.tt{display:flex;justify-content:space-between;align-items:center;margin:10px 0;font-weight:800;font-size:18px}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tabs button{flex:1;padding:9px;border-radius:12px;background:var(--c);border:1px solid var(--b)}
.tabs button.on{background:var(--p);color:#fff}
.tst{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--t);color:var(--bg);padding:10px 18px;border-radius:14px;z-index:99;max-width:92%;animation:pop .25s}
.mt{min-height:100vh;display:grid;place-content:center;text-align:center;gap:14px;padding:20px}
.mt i{font-size:64px;color:var(--p)}
.at{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;background:var(--c);position:sticky;top:env(safe-area-inset-top);z-index:20;border-bottom:1px solid var(--b)}
.at button{padding:8px 14px;border-radius:99px;white-space:nowrap;background:var(--bg);border:1px solid var(--b)}
.at button.on{background:var(--p);color:#fff}
.st{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.st{grid-template-columns:repeat(5,1fr)}}
.st div{background:var(--c);border-radius:16px;padding:14px;box-shadow:var(--sh);text-align:center}
.st b{display:block;font-size:22px;color:var(--p)}
.bars{display:flex;align-items:end;gap:8px;height:130px;background:var(--c);border-radius:16px;padding:12px;margin:12px 0}
.bars div{flex:1;background:linear-gradient(var(--p),var(--p2));border-radius:8px 8px 0 0;position:relative;min-height:4px}
.bars span{position:absolute;bottom:-20px;width:100%;text-align:center;font-size:11px;color:var(--m)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.em{text-align:center;color:var(--m);padding:40px 10px}
</style>
</head>
<body>
<div id="root"></div>
<div class="ov" id="dv" onclick="if(event.target===this)A.close()"><div class="dr" id="dr"></div></div>
<div class="ov" id="mv" onclick="if(event.target===this)A.close()"><div class="md" id="md"></div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signInWithPopup,GoogleAuthProvider,signOut}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import{getDatabase,ref,onValue,set,update,remove,push,get}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
const app=initializeApp({apiKey:"AIzaSyAN11agW-TWwAk3TvF7mRZRt6PHLcnl_aQ",authDomain:"ym-pro-max.firebaseapp.com",databaseURL:"https://ym-pro-max-default-rtdb.firebaseio.com",projectId:"ym-pro-max",storageBucket:"ym-pro-max.firebasestorage.app",messagingSenderId:"174657071953",appId:"1:174657071953:web:5e831fc337df46dbd18170"});
const auth=getAuth(app),DB=getDatabase(app),db=p=>ref(DB,p);
const $=s=>document.querySelector(s),H=document.documentElement,v=i=>$('#'+i)?.value||'';
const D={settings:{},nav:{},products:{},orders:{},users:{},coupons:{},notifications:{},messages:{},maintenance:{}};
const L=k=>{try{return JSON.parse(localStorage[k]||'[]')}catch{return[]}};
let me=null,role='customer',view='home',cat='all',q='',shop=false,adm='dash',dr='',coupon=null,reg=false,tab='user',cart=L('cart'),fav=L('fav'),rd=L('rd'),hid=L('hid'),first=true,seen=new Set,ip=null;
const ph='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 10"><rect width="10" height="10" fill="#f8bbd0"/></svg>');
const list=o=>Object.entries(o||{}).map(([id,x])=>({id,...x}));
const money=n=>(+n||0).toLocaleString('ar-EG')+' ج.م';
const price=p=>p.price*(1-(p.discount||0)/100);
const sv=()=>{localStorage.cart=JSON.stringify(cart);localStorage.fav=JSON.stringify(fav);localStorage.rd=JSON.stringify(rd);localStorage.hid=JSON.stringify(hid)};
const toast=m=>{const e=document.createElement('div');e.className='tst';e.textContent=m;document.body.append(e);setTimeout(()=>e.remove(),2800)};
const beep=()=>{try{const c=new AudioContext,o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.setValueAtTime(.2,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.4);o.start();o.stop(c.currentTime+.4)}catch{}};
const ring=n=>{beep();navigator.vibrate?.([200,100,200]);toast('🔔 '+n.title+' — '+n.body);try{if(Notification.permission==='granted')new Notification(n.title,{body:n.body,icon:'icon.svg'})}catch{}};
const mine=n=>n.target==='all'||(me&&n.targetUid===me.uid)||(role==='admin'&&n.target==='admin');
const myN=()=>list(D.notifications).filter(n=>mine(n)&&!hid.includes(n.id)).sort((a,b)=>b.createdAt-a.createdAt);
const comp=f=>new Promise(r=>{if(!f)return r('');const i=new Image;i.onload=()=>{const k=Math.min(1,700/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.72))};i.src=URL.createObjectURL(f)});
const notify=(o)=>push(db('notifications'),{type:'system',priority:'normal',target:'all',...o,createdAt:Date.now()});
const ST={pending:'قيد الانتظار',confirmed:'مؤكد',delivered:'تم التسليم',cancelled:'ملغي'};
const defNav=[{label:'الرئيسية',icon:'house',path:'home'},{label:'المفضلة',icon:'heart',path:'fav'},{label:'السلة',icon:'bag-shopping',path:'cart'},{label:'طلباتي',icon:'receipt',path:'orders'},{label:'تواصل',icon:'envelope',path:'contact'},{label:'حسابي',icon:'user',path:'profile'}];

Object.keys(D).forEach(p=>onValue(db(p),s=>{D[p]=s.val()||{};if(p==='notifications'){const ids=Object.keys(D[p]);if(!first)list(D[p]).filter(n=>!seen.has(n.id)&&mine(n)).forEach(ring);ids.forEach(i=>seen.add(i));first=false}render()},()=>{}));

onAuthStateChanged(auth,async u=>{me=u;role='customer';if(u){try{const d=(await get(db('users/'+u.uid))).val();role=d?.role||'customer';if(!d)await set(db('users/'+u.uid),{name:u.displayName||'عميل',email:u.email,phone:'',role:'customer',createdAt:Date.now()})}catch{}if(Notification.permission==='default')try{Notification.requestPermission()}catch{}}render()});

function render(){
const s=D.settings;
if(s.primary)H.style.setProperty('--p',s.primary);
if(s.primary2)H.style.setProperty('--p2',s.primary2);
if(s.accent)H.style.setProperty('--a',s.accent);
document.title=s.storeName||'متجر يزيد';
if(D.maintenance.enabled&&role!=='admin'){$('#root').innerHTML=`<div class=mt><i class="fa-solid fa-screwdriver-wrench"></i><h1>جاري تحديث ${s.storeName||'متجر يزيد'}</h1><p>سنعود قريباً</p><button class="bt sm" onclick="A.auth()">دخول الأدمن</button></div>`;return}
$('#root').innerHTML=role==='admin'&&!shop?admin():storefront();
if(dr)drawer();
}

function storefront(){
const un=myN().filter(n=>!rd.includes(n.id)).length,cc=cart.reduce((a,b)=>a+b.q,0),s=D.settings;
const nav=(list(D.nav).length?list(D.nav).filter(n=>n.enabled!==false):defNav).sort((a,b)=>(a.order||0)-(b.order||0));
return`<header class=hd><div class=br>${s.logo?`<img src="${s.logo}">`:'<i class="fa-solid fa-store"></i>'}<span>${s.storeName||'متجر يزيد'}</span></div>
<input class=sr placeholder="ابحث عن منتج..." value="${q}" oninput="A.search(this.value)">
<button class=ib onclick="A.open('n')"><i class="fa-regular fa-bell"></i>${un?`<b>${un}</b>`:''}</button>
<button class=ib onclick="A.go('fav')"><i class="fa-regular fa-heart"></i>${fav.length?`<b>${fav.length}</b>`:''}</button>
<button class=ib onclick="A.open('cart')"><i class="fa-solid fa-bag-shopping"></i>${cc?`<b>${cc}</b>`:''}</button>
<button class=ib onclick="A.theme()"><i class="fa-solid fa-circle-half-stroke"></i></button>
<button class=ib onclick="${me?"A.go('profile')":'A.auth()'}"><i class="fa-solid fa-user"></i></button></header>
<main>${views()}</main>
<nav class=bn>${nav.map(n=>`<button class="${n.path===view?'on':''}" onclick="A.go('${n.path}')"><i class="fa-solid fa-${n.icon}"></i>${n.label}</button>`).join('')}</nav>`}

function views(){
const s=D.settings;
if(view==='fav'){const a=list(D.products).filter(p=>fav.includes(p.id));return`<div class=tt>المفضلة</div>${a.length?`<div class=grid>${a.map(card).join('')}</div>`:'<div class=em>لا توجد منتجات في المفضلة</div>'}`}
if(view==='orders'){if(!me)return`<div class=em>سجّل الدخول لعرض طلباتك<br><br><button class="bt sm" onclick="A.auth()">تسجيل الدخول</button></div>`;const a=list(D.orders).filter(o=>o.uid===me.uid).sort((x,y)=>y.createdAt-x.createdAt);return`<div class=tt>طلباتي</div>${a.map(o=>`<div class=row><div class=f><b>طلب #${o.id.slice(-5)}</b><small>${new Date(o.createdAt).toLocaleString('ar-EG')}</small><small>${o.items.map(i=>i.name+' ×'+i.q).join('، ')}</small></div><div><b>${money(o.total)}</b><small>${ST[o.status]}</small></div></div>`).join('')||'<div class=em>لا توجد طلبات بعد</div>'}`}
if(view==='contact')return`<div class=tt>تواصل معنا</div><input id=cn placeholder="الاسم" value="${me?.displayName||''}"><input id=ce placeholder="البريد" value="${me?.email||''}"><input id=cp placeholder="الهاتف"><textarea id=cm rows=4 placeholder="رسالتك"></textarea><button class=bt onclick="A.msg()">إرسال</button>`;
if(view==='profile'){if(!me)return`<div class=em><button class="bt sm" onclick="A.auth()">تسجيل الدخول</button></div>`;return`<div class=tt>حسابي</div><div class=row><div class=f><b>${me.displayName||me.email}</b><small>${me.email}</small></div></div>${role==='admin'?'<button class="bt sc" onclick="A.shop(0)">لوحة التحكم</button><br><br>':''}${ip?'<button class="bt sc" onclick="A.install()">تثبيت التطبيق</button><br><br>':''}<button class="bt dn" onclick="A.out()">تسجيل الخروج</button>`}
const cats=['all',...new Set(list(D.products).map(p=>p.category).filter(Boolean))];
return`<div class=hero><h1>${s.heroTitle||'أجمل المنتجات بأفضل الأسعار'}</h1>${s.storeImage?`<img src="${s.storeImage}">`:''}</div>
<div class=chips>${cats.map(c=>`<button class="chip ${c===cat?'on':''}" onclick="A.cat('${c}')">${c==='all'?'الكل':c}</button>`).join('')}</div><div class=grid id=grid>${grid()}</div>`}

const grid=()=>{const a=list(D.products).filter(p=>p.visible!==false&&(cat==='all'||p.category===cat)&&p.name.includes(q));return a.map(card).join('')||'<div class=em style="grid-column:1/-1">لا توجد منتجات</div>'};
const card=p=>{const out=!(p.qty>0)||p.stock===false,f=fav.includes(p.id);return`<div class=cd><div class=im onclick="A.prod('${p.id}')"><img src="${p.image||ph}" loading=lazy><span class="bd ${out?'no':''}">${out?'نفذ':p.discount?`خصم ${p.discount}%`:'متوفر'}</span><button class="hr ${f?'on':''}" onclick="event.stopPropagation();A.fav('${p.id}')"><i class="fa-${f?'solid':'regular'} fa-heart"></i></button></div><h3>${p.name}</h3><div class=pr>${money(price(p))}${p.discount?`<s>${money(p.price)}</s>`:''}</div><button class=bt ${out?'disabled':''} onclick="A.add('${p.id}')">أضف للسلة</button></div>`};

function totals(){const sub=cart.reduce((a,i)=>{const p=D.products[i.id];return a+(p?price(p)*i.q:0)},0);let d=0;if(coupon&&sub>=(coupon.min||0))d=coupon.type==='percent'?sub*coupon.value/100:Math.min(coupon.value,sub);return{sub,d,total:Math.max(0,sub-d)}}

function drawer(){
const el=$('#dr');$('#dv').classList.add('on');
if(dr==='cart'){const t=totals();el.innerHTML=`<div class=tt>السلة <button onclick="A.close()"><i class="fa-solid fa-xmark"></i></button></div>${cart.map(i=>{const p=D.products[i.id];return p?`<div class=row><img src="${p.image||ph}"><div class=f><b>${p.name}</b><small>${money(price(p))}</small><div class=acts><button class="bt sm" onclick="A.qty('${i.id}',1)">+</button><b>${i.q}</b><button class="bt sm" onclick="A.qty('${i.id}',-1)">−</button></div></div><button onclick="A.qty('${i.id}',-99)"><i class="fa-solid fa-trash"></i></button></div>`:''}).join('')||'<div class=em>السلة فارغة</div>'}
${cart.length?`<div class=acts><input id=cc placeholder="كود الخصم" style="flex:1"><button class="bt sm" onclick="A.coupon()">تطبيق</button></div>
<div class=row style="display:block">المجموع: ${money(t.sub)}<br>الخصم: ${money(t.d)}<br><b>الإجمالي: ${money(t.total)}</b></div>
<input id=op placeholder="رقم الهاتف"><input id=oa placeholder="العنوان"><input id=on placeholder="ملاحظات"><button class=bt onclick="A.order()">إتمام الطلب</button>`:''}`}
else{const a=myN();el.innerHTML=`<div class=tt>الإشعارات <button onclick="A.close()"><i class="fa-solid fa-xmark"></i></button></div>${a.map(n=>`<div class=row style="${rd.includes(n.id)?'':'border-right:4px solid var(--p)'}" onclick="A.read('${n.id}')"><div class=f><b>${n.title}</b><small>${n.body}</small></div><button onclick="event.stopPropagation();A.hide('${n.id}')"><i class="fa-solid fa-trash"></i></button></div>`).join('')||'<div class=em>لا توجد إشعارات</div>'}`}}

function admin(){
const O=list(D.orders),P=list(D.products),U=list(D.users),sorted=[...O].sort((a,b)=>b.createdAt-a.createdAt);
const tabs=[['dash','الإحصائيات','chart-pie'],['rep','التقارير','chart-line'],['prod','المنتجات','box'],['ord','الطلبات','cart-shopping'],['usr','العملاء','users'],['msg','الرسائل','comments'],['cpn','الكوبونات','gift'],['ntf','إشعارات','bell'],['nav','الأزرار','sliders'],['set','الإعدادات','palette'],['mnt','إغلاق المتجر','screwdriver-wrench'],['rst','إعادة ضبط','trash']];
let h='';
if(adm==='dash'){const days=[...Array(7)].map((_,i)=>{const d=new Date(Date.now()-(6-i)*864e5);return{l:d.getDate(),n:O.filter(o=>new Date(o.createdAt).toDateString()===d.toDateString()).length}}),mx=Math.max(1,...days.map(d=>d.n));
h=`<div class=st><div><b>${O.length}</b>الطلبات</div><div><b>${O.filter(o=>o.status==='pending').length}</b>قيد الانتظار</div><div><b>${money(O.filter(o=>o.status!=='cancelled').reduce((a,o)=>a+o.total,0))}</b>الإيرادات</div><div><b>${P.length}</b>المنتجات</div><div><b>${U.filter(u=>u.role!=='admin').length}</b>العملاء</div></div>
<div class=bars>${days.map(d=>`<div style="height:${d.n/mx*100}%"><span>${d.l}</span></div>`).join('')}</div><div class=tt>آخر الطلبات</div>${sorted.slice(0,6).map(orow).join('')}`}
if(adm==='rep'){const dl=O.filter(o=>o.status==='delivered'),cn=O.filter(o=>o.status==='cancelled'),tp={};O.forEach(o=>o.items.forEach(i=>tp[i.name]=(tp[i.name]||0)+i.q));
h=`<div class=st><div><b>${dl.length}</b>مكتملة</div><div><b>${cn.length}</b>ملغية</div><div><b>${money(O.length?O.reduce((a,o)=>a+o.total,0)/O.length:0)}</b>متوسط الطلب</div><div><b>${O.length?Math.round(dl.length/O.length*100):0}%</b>نسبة النجاح</div></div><div class=tt>الأكثر مبيعاً</div>${Object.entries(tp).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([n,c])=>`<div class=row><div class=f>${n}</div><b>${c}</b></div>`).join('')}`}
if(adm==='prod')h=`<button class=bt onclick="A.pf()">+ منتج جديد</button><div class=grid style="margin-top:12px">${P.map(p=>`<div class=cd><div class=im><img src="${p.image||ph}"><span class=bd>${p.visible===false?'مخفي':p.stock===false?'موقوف':'نشط'}</span></div><h3>${p.name}</h3><div class=pr>${money(price(p))} · ${p.qty}</div><div class=acts><button class="bt sm" onclick="A.pf('${p.id}')"><i class="fa-solid fa-pen"></i></button><button class="bt sm sc" onclick="A.tg('${p.id}','stock')"><i class="fa-solid fa-power-off"></i></button><button class="bt sm sc" onclick="A.tg('${p.id}','visible')"><i class="fa-solid fa-eye"></i></button><button class="bt sm dn" onclick="A.del('products/${p.id}')"><i class="fa-solid fa-trash"></i></button></div></div>`).join('')}</div>`;
if(adm==='ord')h=`<div class=chips>${['all',...Object.keys(ST)].map(s=>`<button class="chip ${(window.of||'all')===s?'on':''}" onclick="window.of='${s}';A.re()">${s==='all'?'الكل':ST[s]}</button>`).join('')}</div>${sorted.filter(o=>(window.of||'all')==='all'||o.status===window.of).map(orow).join('')||'<div class=em>لا توجد طلبات</div>'}`;
if(adm==='usr')h=U.map(u=>`<div class=row><div class=f><b>${u.name||'-'}</b><small>${u.email||''} ${u.phone||''}</small></div><div><b>${O.filter(o=>o.uid===u.id).length}</b> طلب<small>${u.fcmToken?'إشعارات مفعّلة':'بدون إشعارات'}</small></div></div>`).join('')||'<div class=em>لا يوجد عملاء</div>';
if(adm==='msg')h=list(D.messages).sort((a,b)=>b.createdAt-a.createdAt).map(m=>`<div class=row style="${m.read?'':'border-right:4px solid var(--p)'}"><div class=f><b>${m.name}</b><small>${m.email||''} ${m.phone||''}</small><small>${m.message}</small></div><button onclick="A.del('messages/${m.id}')"><i class="fa-solid fa-trash"></i></button></div>`).join('')||'<div class=em>لا توجد رسائل</div>';
if(adm==='cpn')h=`<button class=bt onclick="A.cf()">+ كوبون جديد</button>${list(D.coupons).map(c=>`<div class=row><div class=f><b>${c.id}</b><small>${c.type==='percent'?c.value+'%':money(c.value)} · حد أدنى ${money(c.min)}</small></div><div class=acts><button class="bt sm ${c.active?'':'sc'}" onclick="A.upd('coupons/${c.id}',{active:${!c.active}})">${c.active?'مفعّل':'موقوف'}</button><button class="bt sm sc" onclick="A.cf('${c.id}')"><i class="fa-solid fa-pen"></i></button><button class="bt sm dn" onclick="A.del('coupons/${c.id}')"><i class="fa-solid fa-trash"></i></button></div></div>`).join('')}`;
if(adm==='ntf')h=`<input id=nt placeholder="العنوان"><textarea id=nb rows=3 placeholder="الرسالة"></textarea><select id=ny><option value=promo>عرض</option><option value=order>طلب</option><option value=system>نظام</option></select><select id=np><option value=normal>عادي</option><option value=high>مهم</option></select><select id=ng><option value=all>كل المستخدمين</option>${U.map(u=>`<option value="${u.id}">${u.name||u.email}</option>`).join('')}</select><div class=acts><button class=bt style="flex:1" onclick="A.send()">إرسال</button><button class="bt sc" style="flex:1" onclick="A.prev()">معاينة</button></div><div class=acts style="margin:10px 0"><button class="bt sm sc" onclick="A.perm()">تفعيل الإشعارات (${typeof Notification!=='undefined'?Notification.permission:'—'})</button><button class="bt sm sc" onclick="ring({title:'اختبار',body:'الإشعارات تعمل'})">اختبار</button><button class="bt sm dn" onclick="A.del('notifications')">حذف الكل</button></div>${list(D.notifications).sort((a,b)=>b.createdAt-a.createdAt).map(n=>`<div class=row><div class=f><b>${n.title}</b><small>${n.body}</small></div><button onclick="A.del('notifications/${n.id}')"><i class="fa-solid fa-trash"></i></button></div>`).join('')}`;
if(adm==='nav')h=`<button class=bt onclick="A.nf()">+ زر جديد</button>${list(D.nav).sort((a,b)=>a.order-b.order).map(n=>`<div class=row><i class="fa-solid fa-${n.icon}"></i><div class=f><b>${n.label}</b><small>${n.path} · ترتيب ${n.order}</small></div><div class=acts><button class="bt sm sc" onclick="A.nf('${n.id}')"><i class="fa-solid fa-pen"></i></button><button class="bt sm ${n.enabled===false?'sc':''}" onclick="A.upd('nav/${n.id}',{enabled:${n.enabled===false}})"><i class="fa-solid fa-power-off"></i></button><button class="bt sm dn" onclick="A.del('nav/${n.id}')"><i class="fa-solid fa-trash"></i></button></div></div>`).join('')||`<div class=em>لا توجد أزرار مخصصة، يتم استخدام الافتراضية<br><br><button class="bt sm" onclick="A.seedNav()">إنشاء الأزرار الافتراضية</button></div>`}`;
if(adm==='set'){const s=D.settings;h=`<input id=sn placeholder="اسم المتجر" value="${s.storeName||''}"><input id=sh placeholder="العنوان الرئيسي" value="${s.heroTitle||''}"><label>الأساسي</label><input id=s1 type=color value="${s.primary||'#e91e63'}"><label>الثانوي</label><input id=s2 type=color value="${s.primary2||'#f06292'}"><label>التمييز</label><input id=s3 type=color value="${s.accent||'#f59e0b'}"><input id=sm type=number placeholder="الحد الأقصى للعملاء" value="${s.maxUsers||''}"><label>الشعار</label><input id=sl type=file accept="image/*"><label>صورة Hero</label><input id=si type=file accept="image/*"><br><button class=bt onclick="A.saveSet()">حفظ</button>`}
if(adm==='mnt')h=`<div class=em><i class="fa-solid fa-screwdriver-wrench" style="font-size:50px;color:var(--p)"></i><h2>المتجر ${D.maintenance.enabled?'مغلق':'مفتوح'}</h2><br><button class=bt onclick="A.maint()">${D.maintenance.enabled?'فتح المتجر':'إغلاق المتجر'}</button></div>`;
if(adm==='rst')h=[['users','حذف جميع العملاء'],['products','حذف جميع المنتجات'],['orders','حذف جميع الطلبات'],['notifications','حذف جميع الإشعارات']].map(([k,l])=>`<button class="bt dn" style="margin:6px 0" onclick="A.del('${k}')">${l}</button>`).join('')+`<button class="bt dn" style="margin:6px 0" onclick="A.resetAll()">إعادة ضبط كاملة</button>`;
return`<div class=at>${tabs.map(t=>`<button class="${adm===t[0]?'on':''}" onclick="A.tab('${t[0]}')"><i class="fa-solid fa-${t[2]}"></i> ${t[1]}</button>`).join('')}<button onclick="A.shop(1)"><i class="fa-solid fa-store"></i> المتجر</button><button onclick="A.out()"><i class="fa-solid fa-right-from-bracket"></i> خروج</button></div><main>${h}</main>`}

const orow=o=>`<div class=row><div class=f><b>${o.userName||'-'} · #${o.id.slice(-5)}</b><small>${o.phone||''} ${o.address||''}</small><small>${o.items.map(i=>i.name+' ×'+i.q).join('، ')}</small><small>${new Date(o.createdAt).toLocaleString('ar-EG')}</small></div><div><b>${money(o.total)}</b><select onchange="A.status('${o.id}',this.value)">${Object.entries(ST).map(([k,l])=>`<option value=${k} ${o.status===k?'selected':''}>${l}</option>`).join('')}</select><button onclick="A.del('orders/${o.id}')"><i class="fa-solid fa-trash"></i></button></div></div>`;

const modal=h=>{$('#md').innerHTML=h;$('#mv').classList.add('on')};

const A={
re:render,
theme(){const d=H.dataset.theme==='dark';H.dataset.theme=d?'':'dark';localStorage.theme=d?'':'dark'},
go(p){if(p==='cart')return A.open('cart');view=p;render();scrollTo(0,0)},
open(x){dr=x;drawer()},
close(){dr='';$('#dv').classList.remove('on');$('#mv').classList.remove('on')},
search(x){q=x;if(view!=='home'){view='home';render()}else $('#grid').innerHTML=grid()},
cat(c){cat=c;render()},
fav(id){fav=fav.includes(id)?fav.filter(x=>x!==id):[...fav,id];sv();render()},
add(id){const p=D.products[id],i=cart.find(x=>x.id===id);if(i){if(i.q>=p.qty)return toast('الكمية المتاحة '+p.qty);i.q++}else cart.push({id,q:1});sv();toast('تمت الإضافة للسلة');render()},
qty(id,n){const i=cart.find(x=>x.id===id);i.q+=n;if(i.q<=0)cart=cart.filter(x=>x.id!==id);sv();render()},
prod(id){const p=D.products[id],out=!(p.qty>0);modal(`<div class=im style="cursor:default"><img src="${p.image||ph}"></div><div class=tt>${p.name}<button onclick="A.close()"><i class="fa-solid fa-xmark"></i></button></div><div class=pr style="font-size:20px">${money(price(p))}${p.discount?`<s>${money(p.price)}</s>`:''}</div><p style="margin:10px 0;color:var(--m)">${p.description||''}</p><div class=acts><button class=bt style="flex:1" ${out?'disabled':''} onclick="A.add('${id}');A.close()">أضف للسلة</button><button class="bt sc" style="width:auto" onclick="A.fav('${id}');A.close()"><i class="fa-solid fa-heart"></i></button></div>`)},
async coupon(){const c=D.coupons[v('cc').toUpperCase()];if(!c||!c.active)return toast('كود غير صالح');if(totals().sub<(c.min||0))return toast('الحد الأدنى '+money(c.min));coupon=c;toast('تم تطبيق الكوبون');drawer()},
async order(){if(!me)return A.auth();const t=totals();if(!v('op')||!v('oa'))return toast('أدخل الهاتف والعنوان');const items=cart.map(i=>({id:i.id,name:D.products[i.id].name,price:price(D.products[i.id]),q:i.q}));await push(db('orders'),{uid:me.uid,userName:me.displayName||me.email,userEmail:me.email,phone:v('op'),address:v('oa'),notes:v('on'),items,subtotal:t.sub,discount:t.d,total:t.total,status:'pending',createdAt:Date.now()});await notify({title:'طلب جديد',body:`${money(t.total)} من ${me.displayName||me.email}`,type:'order',target:'admin'});cart=[];coupon=null;sv();A.close();view='orders';render();toast('تم إرسال الطلب')},
async msg(){if(!v('cn')||!v('cm'))return toast('أكمل البيانات');await push(db('messages'),{name:v('cn'),email:v('ce'),phone:v('cp'),message:v('cm'),read:false,createdAt:Date.now()});await notify({title:'رسالة جديدة',body:v('cn'),target:'admin'});toast('تم الإرسال');view='home';render()},
read(id){if(!rd.includes(id))rd.push(id);sv();render()},
hide(id){hid.push(id);sv();render()},
auth(){modal(`<div class=tt>الدخول<button onclick="A.close()"><i class="fa-solid fa-xmark"></i></button></div><div class=tabs><button class="${tab==='user'?'on':''}" onclick="tab='user';A.auth()">مستخدم</button><button class="${tab==='admin'?'on':''}" onclick="tab='admin';A.auth()">أدمن</button></div>${tab==='admin'?`<input id=au placeholder="اسم المستخدم"><input id=ap type=password placeholder="كلمة المرور"><button class=bt onclick="A.adminIn()">دخول</button>`:`${reg?'<input id=rn placeholder="الاسم"><input id=rp placeholder="الهاتف">':''}<input id=ae type=email placeholder="البريد"><input id=ap type=password placeholder="كلمة المرور"><button class=bt onclick="A.userIn()">${reg?'إنشاء حساب':'دخول'}</button><br><br><button class="bt sc" onclick="reg=!reg;A.auth()">${reg?'لدي حساب':'حساب جديد'}</button><br><br><button class="bt sc" onclick="A.google()"><i class="fa-brands fa-google"></i> Google</button>`}`)},
async userIn(){const e=v('ae'),p=v('ap');if(!e||!p)return toast('أكمل البيانات');try{if(reg){const mx=+D.settings.maxUsers;if(mx&&list(D.users).filter(u=>u.role!=='admin').length>=mx)return toast('تم بلوغ الحد الأقصى للعملاء');const c=await createUserWithEmailAndPassword(auth,e,p);await set(db('users/'+c.user.uid),{name:v('rn'),email:e,phone:v('rp'),role:'customer',createdAt:Date.now()})}else await signInWithEmailAndPassword(auth,e,p);A.close()}catch(x){toast('فشل: '+x.code)}},
async google(){try{const c=await signInWithPopup(auth,new GoogleAuthProvider);const s=await get(db('users/'+c.user.uid));if(!s.exists()){const mx=+D.settings.maxUsers;if(mx&&list(D.users).filter(u=>u.role!=='admin').length>=mx){await signOut(auth);return toast('تم بلوغ الحد الأقصى للعملاء')}await set(db('users/'+c.user.uid),{name:c.user.displayName,email:c.user.email,phone:'',role:'customer',createdAt:Date.now()})}A.close()}catch(x){toast('فشل: '+x.code)}},
async adminIn(){const u=v('au'),p=v('ap'),e=u+'@yazeed.store';if(u!=='01147975962'||p!=='Aa01147975962y')return toast('بيانات غير صحيحة');try{try{await signInWithEmailAndPassword(auth,e,p)}catch{const c=await createUserWithEmailAndPassword(auth,e,p);await set(db('users/'+c.user.uid),{name:'الأدمن',email:e,phone:u,role:'admin',createdAt:Date.now()})}const uid=auth.currentUser.uid;await update(db('users/'+uid),{role:'admin'});role='admin';shop=false;A.close();render()}catch(x){toast('فشل: '+x.code)}},
async out(){await signOut(auth);shop=false;view='home';render()},
shop(x){shop=!!x;render()},
tab(t){adm=t;render()},
upd(p,d){return update(db(p),d)},
async del(p){if(confirm('هل أنت متأكد؟'))await remove(db(p))},
async tg(id,k){const p=D.products[id];await update(db('products/'+id),{[k]:p[k]===false})},
async status(id,s){await update(db('orders/'+id),{status:s});const o=D.orders[id];await notify({title:'تحديث الطلب',body:`حالة طلبك: ${ST[s]}`,type:'order',target:'specific',targetUid:o.uid})},
pf(id){const p=D.products[id]||{};modal(`<div class=tt>${id?'تعديل':'إضافة'} منتج<button onclick="A.close()"><i class="fa-solid fa-xmark"></i></button></div><input id=pn placeholder="الاسم" value="${p.name||''}"><input id=pp type=number placeholder="السعر" value="${p.price||''}"><input id=pd type=number placeholder="الخصم %" value="${p.discount||''}"><input id=pq type=number placeholder="الكمية" value="${p.qty??''}"><input id=pc placeholder="التصنيف" value="${p.category||''}"><textarea id=pdsc rows=3 placeholder="الوصف">${p.description||''}</textarea><input id=pi type=file accept="image/*"><br><button class=bt onclick="A.psave('${id||''}')">حفظ</button>`)},
async psave(id){const f=$('#pi').files[0],img=f?await comp(f):(D.products[id]?.image||''),old=D.products[id]||{},d={name:v('pn'),price:+v('pp'),discount:+v('pd')||0,qty:+v('pq')||0,category:v('pc')||'عام',description:v('pdsc'),image:img,stock:old.stock!==false,visible:old.visible!==false,updatedAt:Date.now()};if(!d.name||!d.price)return toast('أكمل البيانات');id?await update(db('products/'+id),d):await push(db('products'),{...d,createdAt:Date.now()});A.close();toast('تم الحفظ')},
cf(id){const c=D.coupons[id]||{};modal(`<div class=tt>كوبون<button onclick="A.close()"><i class="fa-solid fa-xmark"></i></button></div><input id=kc placeholder="الكود" value="${id||''}" ${id?'disabled':''}><select id=kt><option value=percent ${c.type==='percent'?'selected':''}>نسبة</option><option value=fixed ${c.type==='fixed'?'selected':''}>مبلغ ثابت</option></select><input id=kv type=number placeholder="القيمة" value="${c.value||''}"><input id=km type=number placeholder="الحد الأدنى" value="${c.min||''}"><button class=bt onclick="A.csave('${id||''}')">حفظ</button>`)},
async csave(id){const k=(id||v('kc')).toUpperCase().trim();if(!k||!v('kv'))return toast('أكمل البيانات');await set(db('coupons/'+k),{type:v('kt'),value:+v('kv'),min:+v('km')||0,active:D.coupons[k]?.active??true});A.close()},
nf(id){const n=D.nav[id]||{};modal(`<div class=tt>زر تنقل<button onclick="A.close()"><i class="fa-solid fa-xmark"></i></button></div><input id=nl placeholder="الاسم" value="${n.label||''}"><input id=ni placeholder="الأيقونة (مثل house)" value="${n.icon||''}"><input id=npth placeholder="الرابط: home / fav / orders / contact / profile / cart" value="${n.path||''}"><input id=no type=number placeholder="الترتيب" value="${n.order??''}"><button class=bt onclick="A.nsave('${id||''}')">حفظ</button>`)},
async nsave(id){const d={label:v('nl'),icon:v('ni')||'circle',path:v('npth')||'home',order:+v('no')||0,enabled:D.nav[id]?.enabled!==false};id?await update(db('nav/'+id),d):await push(db('nav'),d);A.close()},
async seedNav(){for(const[i,n]of defNav.entries())await push(db('nav'),{...n,order:i,enabled:true})},
async send(){if(!v('nt')||!v('nb'))return toast('أكمل البيانات');const g=v('ng');await notify({title:v('nt'),body:v('nb'),type:v('ny'),priority:v('np'),target:g==='all'?'all':'specific',targetUid:g==='all'?null:g});toast('تم الإرسال')},
prev(){modal(`<div class=tt>معاينة<button onclick="A.close()"><i class="fa-solid fa-xmark"></i></button></div><div class=row><div class=f><b>${v('nt')}</b><small>${v('nb')}</small></div></div>`)},
async perm(){try{await Notification.requestPermission()}catch{}render()},
async saveSet(){const d={storeName:v('sn'),heroTitle:v('sh'),primary:v('s1'),primary2:v('s2'),accent:v('s3'),maxUsers:+v('sm')||0};const l=await comp($('#sl').files[0]),i=await comp($('#si').files[0]);if(l)d.logo=l;if(i)d.storeImage=i;await update(db('settings'),d);toast('تم الحفظ')},
maint(){return set(db('maintenance'),{enabled:!D.maintenance.enabled,updatedAt:Date.now()})},
async resetAll(){if(!confirm('سيتم حذف كل البيانات، متابعة؟'))return;for(const k of['products','orders','notifications','messages','coupons'])await remove(db(k));for(const u of list(D.users))if(u.role!=='admin')await remove(db('users/'+u.id));toast('تمت إعادة الضبط')},
install(){ip?.prompt()}
};
for(const k in A){const f=A[k];A[k]=(...a)=>{try{const r=f(...a);if(r?.catch)r.catch(e=>toast('تعذر التنفيذ: '+(e.code||'')))}catch(e){toast('تعذر التنفيذ')}}}
Object.assign(window,{A,ring,tab:'user'});
Object.defineProperty(window,'tab',{get:()=>tab,set:x=>tab=x});
Object.defineProperty(window,'reg',{get:()=>reg,set:x=>reg=x});
if(localStorage.theme)H.dataset.theme='dark';
addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e;render()});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script>
</body>
</html>

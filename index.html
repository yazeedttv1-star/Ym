<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>منصة سيجما التعليمية</title>
<meta name="application-version" content="4.1.0">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" id="mf">
<link rel="apple-touch-icon" id="ai">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ============ Design Tokens ============ */
:root{
  --brand-50:#eff6ff; --brand-100:#dbeafe; --brand-200:#bfdbfe;
  --brand-500:#3b82f6; --brand-600:#2563eb; --brand-700:#1d4ed8;
  --accent:#8b5cf6; --accent-2:#ec4899;
  --ok:#10b981; --warn:#f59e0b; --er:#ef4444;
  --bg:#f6f8fc; --bg-2:#eef2f9;
  --surface:#ffffff; --surface-2:#f8fafc; --surface-3:#eef2f7;
  --tx:#0b1220; --tx-2:#334155; --mu:#94a3b8; --bd:#e5eaf2;
  --r-xs:8px; --r-sm:12px; --r-md:16px; --r-lg:22px; --r-xl:28px; --r-full:999px;
  --sh-sm:0 1px 2px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.04);
  --sh:0 4px 12px rgba(15,23,42,.06),0 2px 4px rgba(15,23,42,.04);
  --sh-lg:0 20px 40px -12px rgba(15,23,42,.18),0 8px 20px -8px rgba(15,23,42,.12);
  --sh-glow:0 8px 30px -8px rgba(37,99,235,.45);
  --grad-brand:linear-gradient(135deg,#2563eb 0%,#3b82f6 50%,#8b5cf6 100%);
  --grad-warm:linear-gradient(135deg,#f59e0b,#ef4444);
  --grad-cool:linear-gradient(135deg,#06b6d4,#3b82f6);
  --grad-purple:linear-gradient(135deg,#8b5cf6,#ec4899);
  --ease:cubic-bezier(.4,0,.2,1);
  /* Legacy aliases used by the app logic */
  --ac:#2563eb;--ac2:#1d4ed8;--ac-soft:#dbeafe;
  --surface2:#f1f5f9;--tx2:#475569;
  --r:16px;--r-sm-old:10px;
  --shadow:var(--sh);--shadow-lg:var(--sh-lg);
}
html.dark{
  --bg:#070b14; --bg-2:#0c1220;
  --surface:#0f172a; --surface-2:#111a2e; --surface-3:#1a2440;
  --tx:#f1f5f9; --tx-2:#cbd5e1; --mu:#64748b; --bd:#1e293b;
  --sh-lg:0 20px 40px -12px rgba(0,0,0,.6),0 8px 20px -8px rgba(0,0,0,.4);
  --sh-glow:0 8px 30px -8px rgba(59,130,246,.35);
  --ac:#60a5fa;--ac2:#3b82f6;--ac-soft:#1e3a8a;
  --surface2:#1a2440;--tx2:#cbd5e1;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 4px 12px rgba(0,0,0,.3);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{min-height:100%;height:auto;-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  font-family:Cairo,system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  background:
    radial-gradient(1200px 600px at 100% -10%, rgba(59,130,246,.10), transparent 60%),
    radial-gradient(800px 500px at -10% 110%, rgba(139,92,246,.08), transparent 60%),
    var(--bg);
  color:var(--tx);min-height:100vh;min-height:100dvh;
  padding-bottom:calc(120px + env(safe-area-inset-bottom));
  overflow-x:hidden;-webkit-user-select:none;user-select:none;
  transition:background .3s,color .3s;
}
html.dark body{
  background:
    radial-gradient(1200px 600px at 100% -10%, rgba(59,130,246,.12), transparent 60%),
    radial-gradient(800px 500px at -10% 110%, rgba(139,92,246,.10), transparent 60%),
    var(--bg);
}
input,select,textarea{-webkit-user-select:text;user-select:text}
h1,h2,h3{font-weight:800;line-height:1.3}
h2{font-size:20px;margin-bottom:16px;color:var(--tx);letter-spacing:-.3px}
#loading-overlay{position:fixed;inset:0;z-index:9999;background:rgba(246,248,252,.85);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .3s ease}
html.dark #loading-overlay{background:rgba(7,11,20,.85)}
#loading-overlay.hide{opacity:0;pointer-events:none}
.spinner{width:40px;height:40px;border:4px solid var(--brand-100);border-top-color:var(--brand-600);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}
.skeleton{background:linear-gradient(90deg,var(--surface-3) 25%,var(--bd) 50%,var(--surface-3) 75%);background-size:200% 100%;animation:sk 1.5s infinite;border-radius:8px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* Platform message */
.platform-message{position:fixed;top:0;left:0;right:0;z-index:5000;background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;padding:18px 50px 18px 20px;box-shadow:0 6px 30px rgba(124,58,237,.4);display:flex;align-items:center;gap:14px;animation:slideDown .4s ease;border-bottom-left-radius:20px;border-bottom-right-radius:20px}
@keyframes slideDown{from{transform:translateY(-100%);opacity:0}to{transform:translateY(0);opacity:1}}
.platform-message .pm-icon{font-size:32px;flex-shrink:0}
.platform-message .pm-content{flex:1}
.platform-message .pm-content b{display:block;font-size:14px;margin-bottom:4px;opacity:.9}
.platform-message .pm-content p{font-size:15px;line-height:1.6;white-space:pre-wrap;font-weight:600}
.platform-message .pm-close{position:absolute;top:10px;left:10px;background:rgba(255,255,255,.2);border:0;color:#fff;width:32px;height:32px;border-radius:50%;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.platform-message .pm-close:hover{background:rgba(255,255,255,.35);transform:none}

/* Top Bar — glassmorphism from new design */
.top-bar{
  background:var(--grad-brand);color:#fff;
  padding:22px 20px;border-bottom-left-radius:24px;border-bottom-right-radius:24px;
  margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-start;
  position:relative;box-shadow:var(--sh-glow);overflow:hidden;
}
.top-bar::before{content:"";position:absolute;top:-60px;left:-60px;width:200px;height:200px;background:radial-gradient(circle,rgba(255,255,255,.25),transparent 70%);border-radius:50%;pointer-events:none}
.top-bar::after{content:"";position:absolute;bottom:-80px;right:-40px;width:220px;height:220px;background:radial-gradient(circle,rgba(255,255,255,.15),transparent 70%);border-radius:50%;pointer-events:none}
.top-bar .welcome{position:relative;z-index:1}
.top-bar .welcome h1{font-size:22px;margin-bottom:4px;font-weight:900;letter-spacing:-.5px}
.top-bar .welcome p{font-size:13px;opacity:.9;margin-bottom:12px;font-weight:600}
.top-bar .user-area{position:relative;z-index:1;display:flex;align-items:center;gap:8px}
.top-bar .avatar-lg{width:56px;height:56px;border-radius:50%;border:3px solid rgba(255,255,255,.4);object-fit:cover;cursor:pointer;background:#fff;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.top-bar .actions{position:relative;z-index:1;display:flex;gap:8px;align-items:center}
.top-bar .action-btn{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.3);padding:6px 12px;border-radius:var(--r-full);font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s var(--ease);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.top-bar .action-btn:hover{background:rgba(255,255,255,.3);transform:translateY(-1px)}
.top-bar .action-btn.icon-only{width:42px;height:42px;padding:0;border-radius:50%;position:relative;flex:0 0 42px;background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.35);box-shadow:0 2px 8px rgba(0,0,0,.1);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.top-bar .action-btn.icon-only:hover{background:rgba(255,255,255,.3)}
.top-bar .action-btn.icon-only svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.top-bar .action-btn.icon-only .badge-dot{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;padding:0 5px;border-radius:var(--r-full);background:var(--er);color:#fff;border:2px solid #fff;align-items:center;justify-content:center;font-size:10px;font-weight:800;display:flex}

main{max-width:1100px;margin:0 auto;padding:0 18px 40px}

/* Hero (new) */
.hero{position:relative;overflow:hidden;background:var(--grad-brand);color:#fff;border-radius:var(--r-xl);padding:24px 22px;margin-bottom:22px;box-shadow:var(--sh-glow)}
.hero::before{content:"";position:absolute;top:-60px;left:-60px;width:200px;height:200px;background:radial-gradient(circle,rgba(255,255,255,.25),transparent 70%);border-radius:50%;pointer-events:none}
.hero::after{content:"";position:absolute;bottom:-80px;right:-40px;width:220px;height:220px;background:radial-gradient(circle,rgba(255,255,255,.15),transparent 70%);border-radius:50%;pointer-events:none}
.hero-content{position:relative;z-index:1}
.hero-eyebrow{font-size:12px;opacity:.85;font-weight:700;margin-bottom:6px}
.hero-title{font-size:24px;font-weight:900;line-height:1.25;margin-bottom:6px;letter-spacing:-.5px}
.hero-desc{font-size:14px;opacity:.9;line-height:1.6;margin-bottom:18px;max-width:420px}
.hero-cta{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.3);padding:10px 18px;border-radius:var(--r-full);font-weight:800;font-size:14px;cursor:pointer;transition:.2s var(--ease);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);font-family:inherit}
.hero-cta:hover{background:rgba(255,255,255,.28);transform:translateY(-1px)}
.hero-cta svg{width:18px;height:18px;fill:currentColor}
.hero-stats{display:flex;gap:18px;margin-top:18px;position:relative;z-index:1}
.hero-stat{display:flex;flex-direction:column}
.hero-stat b{font-size:20px;font-weight:900}
.hero-stat span{font-size:11px;opacity:.85;font-weight:600}

/* Section head (new) */
.section-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 16px}
.section-title{font-size:20px;font-weight:800;letter-spacing:-.3px;color:var(--tx)}
.section-sub{font-size:13px;color:var(--mu);font-weight:600;margin-top:2px}

/* Stat chips (new) */
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px}
.stat{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-lg);padding:16px;box-shadow:var(--sh-sm);transition:transform .2s var(--ease),box-shadow .2s;position:relative;overflow:hidden}
.stat:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.stat-icon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--brand-50);color:var(--brand-600);margin-bottom:10px}
html.dark .stat-icon{background:rgba(37,99,235,.2);color:#93c5fd}
.stat-icon.ok{background:#d1fae5;color:#059669}
html.dark .stat-icon.ok{background:rgba(16,185,129,.2);color:#6ee7b7}
.stat-icon.warn{background:#fef3c7;color:#d97706}
html.dark .stat-icon.warn{background:rgba(245,158,11,.2);color:#fcd34d}
.stat-icon svg{width:20px;height:20px;fill:currentColor}
.stat-num{font-size:24px;font-weight:900;letter-spacing:-.5px;line-height:1;color:var(--tx)}
.stat-label{font-size:12px;color:var(--mu);font-weight:700;margin-top:4px}

/* Grid / Cards (new style) */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-lg);overflow:hidden;cursor:pointer;text-align:center;transition:transform .25s var(--ease),box-shadow .25s,border-color .2s;box-shadow:var(--sh-sm);display:flex;flex-direction:column;position:relative}
.card:hover{transform:translateY(-4px);box-shadow:var(--sh-lg);border-color:var(--brand-200)}
.card:active{transform:scale(.98)}
.card .card-img-wrap{width:100%;height:160px;background:var(--grad-brand);position:relative;overflow:hidden}
.card .card-img-wrap img{width:100%;height:100%;object-fit:cover;display:block;background:var(--surface-3)}
.card .card-body{padding:12px 10px 14px;background:var(--surface);flex:1;display:flex;flex-direction:column;justify-content:center}
.card b{font-size:15px;display:block;color:var(--tx);font-weight:800;line-height:1.3}

/* Rows */
.row{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-md);padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:.2s var(--ease);flex-wrap:wrap;box-shadow:var(--sh-sm)}
.row:hover{border-color:var(--brand-200);box-shadow:var(--sh);transform:translateY(-1px)}
.row:active{transform:scale(.995)}
.row>div{flex:1;min-width:0}
.row b{font-size:15px;display:block;color:var(--tx);font-weight:800}
.row small{color:var(--mu);font-size:13px;display:block;margin-top:2px;font-weight:600}

/* Buttons */
button,.btn{font-family:inherit;font-weight:800;border:0;border-radius:var(--r-sm);padding:10px 18px;background:var(--grad-brand);color:#fff;cursor:pointer;transition:all .2s var(--ease);font-size:14px;touch-action:manipulation;box-shadow:var(--sh-glow);display:inline-flex;align-items:center;justify-content:center;gap:8px}
button:hover{transform:translateY(-1px);filter:brightness(1.05);box-shadow:var(--sh-glow)}
button:active{transform:translateY(0) scale(.97)}
button:disabled{opacity:.6;cursor:not-allowed;transform:none;box-shadow:none}
button.s{background:var(--surface-2);color:var(--tx);box-shadow:var(--sh-sm);border:1px solid var(--bd)}
button.s:hover{background:var(--surface-3);box-shadow:var(--sh);filter:none}
button.d{background:linear-gradient(135deg,#ef4444,#dc2626);box-shadow:0 8px 30px -8px rgba(239,68,68,.45)}
button.d:hover{background:linear-gradient(135deg,#dc2626,#b91c1c)}
button.g{background:linear-gradient(135deg,#10b981,#059669);box-shadow:0 8px 30px -8px rgba(16,185,129,.45)}
button.g:hover{background:linear-gradient(135deg,#059669,#047857)}

/* Forms */
label{font-size:13px;color:var(--tx-2);font-weight:800;display:block;margin-bottom:6px}
input,select,textarea{font-family:inherit;font-size:16px;width:100%;padding:12px 14px;border-radius:var(--r-sm);border:1px solid var(--bd);background:var(--surface);color:var(--tx);margin-bottom:14px;transition:.15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand-500);box-shadow:0 0 0 4px rgba(59,130,246,.15)}

/* Box / Card container */
.box{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-lg);padding:22px;margin-bottom:20px;box-shadow:var(--sh-sm)}

/* Tables */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px;text-align:right;border-bottom:1px solid var(--bd)}
th{background:var(--surface-2);font-weight:800;color:var(--tx-2);font-size:12px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r-md)}

/* Badges */
.b{padding:3px 10px;border-radius:var(--r-full);font-size:12px;font-weight:800;background:var(--surface-3);color:var(--tx-2);display:inline-block}
.b.g{background:#d1fae5;color:#065f46}
.b.r{background:#fee2e2;color:#991b1b}
.b.y{background:#fef3c7;color:#92400e}
.b.brand{background:var(--brand-50);color:var(--brand-700)}
html.dark .b.g{background:rgba(16,185,129,.2);color:#6ee7b7}
html.dark .b.r{background:rgba(239,68,68,.2);color:#fca5a5}
html.dark .b.y{background:rgba(245,158,11,.2);color:#fcd34d}
html.dark .b.brand{background:rgba(37,99,235,.2);color:#93c5fd}
.g{color:var(--ok)}.r{color:var(--er)}.y{color:var(--warn)}

.code{font-family:'Courier New',monospace;font-size:15px;letter-spacing:2px;direction:ltr;display:inline-block;background:var(--surface-3);padding:3px 10px;border-radius:6px;color:var(--brand-700);font-weight:800}
.mut{color:var(--mu);text-align:center;padding:40px 20px;font-weight:600}

.view-counter{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;color:var(--mu);background:var(--surface-3);padding:3px 8px;border-radius:var(--r-full)}
.view-counter svg{width:12px;height:12px;fill:currentColor}

/* Player */
.player-wrap{width:100%;margin-bottom:16px;background:transparent}
.pl{position:relative;background:#000;border-radius:var(--r-md);overflow:hidden;width:100%;height:0;padding-bottom:56.25%;margin:0 auto;box-shadow:var(--sh-lg)}
@supports (aspect-ratio:16/9){.pl{height:auto;padding-bottom:0;aspect-ratio:16/9}}
.pl iframe,.pl video{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#000;pointer-events:none;object-fit:contain}
.pl.is-embed iframe{pointer-events:auto}
.pl.is-yt iframe{pointer-events:none!important;transform:scale(1.01)!important}
.pl .video-blocker{position:absolute;inset:0;z-index:99;background:transparent;cursor:pointer;display:block;touch-action:none}
.pl .end-cover{position:absolute;inset:0;z-index:100;background:#000;display:none;align-items:center;justify-content:center}
.pl .end-cover button{background:var(--grad-brand);color:#fff;padding:12px 22px;font-size:15px}
.pl .big-play-overlay{position:absolute;inset:0;z-index:101;display:none;align-items:center;justify-content:center;background:transparent;pointer-events:none;transition:opacity .1s}
.pl .big-play-btn{width:80px;height:80px;border-radius:50%;background:rgba(15,15,15,.7);border:2px solid #fff;display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:auto;transition:transform .2s;padding:0}
.pl .big-play-btn:hover{transform:scale(1.1);background:rgba(15,15,15,.9)}
.pl .big-play-btn svg{width:40px;height:40px;fill:#fff;margin-left:4px}
.wm{position:absolute;pointer-events:none;z-index:22;display:flex;align-items:center;gap:6px;font-size:12px;opacity:.45;background:rgba(0,0,0,.6);padding:4px 10px;border-radius:var(--r-full);animation:mv 24s linear infinite alternate;direction:ltr;color:#fff;white-space:nowrap}
.wm img{width:22px;height:22px;border-radius:50%;object-fit:cover}
@keyframes mv{0%{top:20%;left:4%}25%{top:70%;left:55%}50%{top:35%;left:70%}75%{top:80%;left:8%}100%{top:20%;left:60%}}
.custom-player-ctrl{direction:ltr;background:#1e1e2f;padding:10px 14px;border-radius:6px;margin-top:8px;box-shadow:var(--sh);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px}
.custom-player-ctrl .ctrl-left,.custom-player-ctrl .ctrl-right{display:flex;align-items:center;flex-shrink:0}
.custom-player-ctrl .icon-btn{background:transparent;color:#fff;border:0;border-radius:0;padding:6px;margin:0 2px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:0;min-width:36px;min-height:36px;transition:transform .15s;touch-action:manipulation}
.custom-player-ctrl .icon-btn:hover{transform:scale(1.1);background:transparent;box-shadow:none;filter:none}
.custom-player-ctrl .icon-btn svg{width:22px;height:22px;fill:#fff}
.custom-player-ctrl .time{font-family:Cairo,sans-serif;font-size:12px;font-weight:600;color:#fff;direction:ltr;margin:0 4px;white-space:nowrap;min-width:36px;text-align:center}
.custom-player-ctrl .time-sep{color:#fff;margin:0 2px}
.custom-player-ctrl .slider-wrap{position:relative;flex:1;height:4px;background:rgba(255,255,255,.3);border-radius:var(--r-full);margin:0 10px;min-width:80px;order:0}
.custom-player-ctrl .slider-fill{position:absolute;top:0;left:0;height:100%;width:0;background:#ff0000;border-radius:var(--r-full);pointer-events:none}
.custom-player-ctrl .slider-wrap input[type=range]{position:absolute;left:0;top:-9px;width:100%;height:22px;margin:0;padding:0;border:0;border-radius:0;background:transparent;box-shadow:none;outline:none;-webkit-appearance:none;appearance:none;cursor:pointer;z-index:2;touch-action:none}
.custom-player-ctrl .slider-wrap input[type=range]:focus{box-shadow:none;outline:none}
.custom-player-ctrl .slider-wrap input[type=range]::-webkit-slider-runnable-track{height:22px;background:transparent;border:0}
.custom-player-ctrl .slider-wrap input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;background:#ff0000;border:0;margin-top:4px;cursor:pointer}
.custom-player-ctrl .slider-wrap input[type=range]::-moz-range-track{height:22px;background:transparent;border:0}
.custom-player-ctrl .slider-wrap input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#ff0000;border:0;cursor:pointer}
.player-wrap:fullscreen{background:#000;display:flex;flex-direction:column;justify-content:center;width:100%;height:100%;margin:0;padding:0}
.player-wrap:-webkit-full-screen{background:#000;display:flex;flex-direction:column;justify-content:center;width:100%;height:100%;margin:0;padding:0}
.player-wrap:fullscreen .pl,.player-wrap:-webkit-full-screen .pl{flex:1;min-height:0;height:auto;padding-bottom:0;aspect-ratio:auto;border-radius:0;box-shadow:none}
.player-wrap:fullscreen .custom-player-ctrl,.player-wrap:-webkit-full-screen .custom-player-ctrl{border-radius:0;margin-top:0}
@media (orientation:landscape) and (pointer:coarse){
body.is-watching .bottombar{display:none!important}
body.is-watching main{padding:0!important}
body.is-watching .player-wrap{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;z-index:99999!important;margin:0!important;padding:0!important;background:#000!important;display:flex!important;flex-direction:column!important}
body.is-watching .pl{flex:1!important;min-height:0!important;height:auto!important;width:100%!important;padding-bottom:0!important;aspect-ratio:auto!important;border-radius:0!important;box-shadow:none!important;margin:0!important}
body.is-watching .custom-player-ctrl{width:100%!important;border-radius:0!important;margin-top:0!important;padding-bottom:env(safe-area-inset-bottom)!important}
}

/* Bottom nav — glassmorphism from new design */
.bottombar{
  position:fixed;bottom:14px;left:50%;transform:translateX(-50%);
  z-index:60;width:calc(100% - 28px);max-width:600px;
  background:rgba(255,255,255,.85);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);
  border:1px solid var(--bd);border-radius:var(--r-xl);
  padding:8px;display:flex;justify-content:space-between;gap:2px;
  box-shadow:0 20px 50px -12px rgba(15,23,42,.25),0 4px 12px rgba(15,23,42,.06);
}
html.dark .bottombar{background:rgba(15,23,42,.85);box-shadow:0 20px 50px -12px rgba(0,0,0,.6)}
.bottombar button{
  flex:1;background:transparent;color:var(--mu);border:0;padding:8px 4px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  cursor:pointer;border-radius:var(--r-md);font-size:10px;font-weight:800;font-family:inherit;
  transition:.2s var(--ease);box-shadow:none;
}
.bottombar button svg{width:22px;height:22px;fill:currentColor;transition:transform .2s var(--ease)}
.bottombar button:hover{color:var(--tx-2);background:transparent;transform:none;box-shadow:none;filter:none}
.bottombar button.on{color:var(--brand-600);background:var(--brand-50)}
html.dark .bottombar button.on{background:rgba(37,99,235,.18);color:#93c5fd}
.bottombar button.on svg{transform:translateY(-1px) scale(1.08)}

#t{position:fixed;bottom:calc(100px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 22px;border-radius:var(--r-md);font-weight:800;display:none;z-index:300;box-shadow:var(--sh-lg);max-width:90vw;text-align:center;font-size:14px}
#t.show{display:block;animation:pop .25s}
@keyframes pop{0%{transform:translateX(-50%) scale(.8);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:1}}

/* Profile */
.profile-card{text-align:center;padding:30px 20px;position:relative;overflow:hidden;background:var(--grad-brand);color:#fff;border-radius:var(--r-xl);box-shadow:var(--sh-glow)}
.profile-card::before{content:"";position:absolute;top:-60px;right:-60px;width:200px;height:200px;background:radial-gradient(circle,rgba(255,255,255,.2),transparent 70%);border-radius:50%;pointer-events:none}
.profile-card img{width:100px;height:100px;border-radius:50%;border:4px solid rgba(255,255,255,.35);margin-bottom:16px;object-fit:cover;background:var(--surface-3);position:relative;z-index:1;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.profile-card h2{margin-bottom:8px;color:#fff;font-size:20px;position:relative;z-index:1}
.profile-card p{color:rgba(255,255,255,.85);font-size:13px;margin-bottom:24px;position:relative;z-index:1;font-weight:600}
.profile-card .b{position:relative;z-index:1}
.settings-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:20px;position:relative;z-index:1}
.settings-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);border-radius:var(--r-md);padding:16px 12px;text-align:center;cursor:pointer;transition:.2s var(--ease);display:flex;flex-direction:column;align-items:center;gap:8px;color:#fff;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.settings-btn:hover{border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.25);transform:translateY(-2px)}
.settings-btn svg{width:28px;height:28px;fill:#fff}
.settings-btn span{font-size:13px;font-weight:800;color:#fff}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(11,18,32,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:200;display:none;align-items:flex-end;justify-content:center;padding:0}
.modal.show{display:flex;animation:pop .2s}
.modal-content{background:var(--surface);border-radius:var(--r-xl) var(--r-xl) 0 0;width:100%;max-width:520px;max-height:85vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -20px 60px -10px rgba(0,0,0,.3);animation:slideUp .3s var(--ease)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-header{padding:18px 20px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.modal-header h3{font-size:16px;margin:0;font-weight:800}
.modal-body{padding:16px 20px 24px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}

/* Notifications */
.noti-item{display:flex;align-items:flex-start;gap:12px;padding:14px;margin-bottom:10px;background:var(--surface-2);border:1px solid var(--bd);border-radius:var(--r-md);transition:.2s;position:relative}
.noti-item:hover{border-color:var(--brand-200);box-shadow:var(--sh)}
.noti-item.unread{background:var(--brand-50);border-color:var(--brand-200)}
html.dark .noti-item.unread{background:rgba(37,99,235,.15);border-color:rgba(37,99,235,.4)}
.noti-icon{width:42px;height:42px;border-radius:50%;background:var(--grad-brand);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:var(--sh-glow)}
.noti-icon svg{width:22px;height:22px;fill:#fff}
.noti-content{flex:1;min-width:0}
.noti-text{font-size:14px;line-height:1.6;color:var(--tx);font-weight:700;margin-bottom:4px;word-break:break-word;white-space:pre-wrap}
.noti-date{font-size:11px;color:var(--mu);font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.noti-unread-dot{width:8px;height:8px;border-radius:50%;background:var(--er);display:inline-block;margin-right:4px}
.noti-actions{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap}
.noti-actions button{padding:6px 10px;font-size:11px;border-radius:8px;background:var(--surface);border:1px solid var(--bd);color:var(--tx-2);font-weight:800;box-shadow:none}
.noti-actions button:hover{background:var(--er);color:#fff;border-color:var(--er);transform:none;box-shadow:none}
.noti-actions button.edit-btn:hover{background:var(--brand-600);color:#fff;border-color:var(--brand-600)}
.noti-empty{text-align:center;padding:50px 20px;color:var(--mu)}
.noti-empty svg{width:60px;height:60px;fill:var(--bd);margin-bottom:14px}

/* Stats summary */
.stats-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:20px}
.stat-box{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-md);padding:16px;text-align:center;transition:.2s}
.stat-box:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.stat-box .stat-num{font-size:26px;font-weight:900;color:var(--brand-600);margin-bottom:4px}
.stat-box .stat-label{font-size:12px;color:var(--mu);font-weight:800}
.stat-box.ok .stat-num{color:var(--ok)}
.stat-box.warn .stat-num{color:var(--warn)}
.stats-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r-md);border:1px solid var(--bd)}
.stats-table{width:100%;border-collapse:collapse;font-size:13px;background:var(--surface)}
.stats-table th{background:var(--grad-brand);color:#fff;padding:12px 10px;font-size:12px;font-weight:800;text-align:right;white-space:nowrap}
.stats-table td{padding:12px 10px;border-bottom:1px solid var(--bd);vertical-align:middle}
.stats-table tr:last-child td{border-bottom:0}
.stats-table tr:hover td{background:var(--surface-2)}
.stats-table .grade-chip{display:inline-block;padding:3px 8px;border-radius:8px;background:var(--brand-50);color:var(--brand-700);font-size:11px;font-weight:800;white-space:nowrap}
html.dark .stats-table .grade-chip{background:rgba(37,99,235,.3);color:#93c5fd}
.stats-filter{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.stats-filter button{padding:8px 16px;font-size:12px;border-radius:var(--r-full);background:var(--surface-2);color:var(--tx-2);border:1px solid var(--bd);box-shadow:none}
.stats-filter button.on{background:var(--brand-600);color:#fff;border-color:var(--brand-600);box-shadow:var(--sh-glow)}

/* Auth */
.auth-container{max-width:400px;margin:0 auto;padding:40px 20px;text-align:center}
.auth-container h1{font-size:32px;color:var(--brand-600);margin-bottom:8px;font-weight:900;letter-spacing:-1px}
.auth-container p{color:var(--mu);margin-bottom:24px;font-size:15px;font-weight:600}
.auth-btn{width:100%;padding:14px;font-size:16px;border-radius:12px;margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:10px}
.auth-btn.phone{background:var(--grad-brand);color:#fff}
.auth-form{text-align:right}
.auth-form label{display:block;margin-bottom:6px;font-weight:800;font-size:13px;color:var(--tx-2)}
.auth-form input{margin-bottom:12px}
.auth-form .error{color:var(--er);font-size:13px;margin-bottom:10px;display:none;line-height:1.6;font-weight:700}
.link-btn{color:var(--brand-600);font-weight:800;text-decoration:none;cursor:pointer}

/* Admin tabs */
.admin-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;background:var(--surface);padding:6px;border-radius:var(--r-md);border:1px solid var(--bd);box-shadow:var(--sh-sm)}
.admin-tabs button{flex:1 1 calc(33.333% - 6px);padding:10px;font-size:12px;border-radius:var(--r-xs);background:var(--surface-2);color:var(--tx-2);border:1px solid var(--bd);box-shadow:none}
.admin-tabs button.on{background:var(--grad-brand);color:#fff;border-color:transparent;box-shadow:var(--sh-glow)}
@media(max-width:768px){.admin-tabs button{flex:1 1 calc(50% - 6px)}}

.code-input{font-size:26px;text-align:center;letter-spacing:8px;font-family:monospace}
.notice{background:var(--brand-50);border:1px solid var(--brand-200);border-radius:var(--r-md);padding:14px 16px;margin-bottom:16px;color:var(--tx);line-height:1.7;font-weight:600}
html.dark .notice{background:rgba(37,99,235,.15);border-color:rgba(37,99,235,.4)}

.ban-screen{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;overflow-y:auto}
.ban-screen .box-max{max-width:420px;background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-xl);padding:32px 24px;box-shadow:var(--sh-lg)}
.ban-screen h1{font-size:28px;color:var(--er);margin-bottom:14px;font-weight:900}
.ban-screen p{color:var(--tx-2);margin-bottom:24px;line-height:1.7;font-weight:600}

/* News */
.news-card{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-lg);padding:16px;margin-bottom:16px;box-shadow:var(--sh-sm);display:flex;flex-direction:column;gap:10px;transition:.2s}
.news-card:hover{box-shadow:var(--sh)}
.news-card img.news-thumb{display:block;width:100%;height:auto;max-height:none;object-fit:contain;border-radius:var(--r-sm);border:1px solid var(--bd);background:var(--surface-2);cursor:zoom-in;transition:.2s}
.news-card img.news-thumb:hover{opacity:.94}
.news-card .news-header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.news-card .news-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.embed-box{position:relative;width:100%;height:0;padding-bottom:56.25%;border-radius:10px;overflow:hidden;background:#000;margin-bottom:10px}
.embed-box iframe,.embed-box video{position:absolute;inset:0;width:100%;height:100%;border:0}
.news-text{font-size:15px;line-height:1.7;color:var(--tx);white-space:pre-wrap;font-weight:600}
.news-date{font-size:12px;color:var(--mu);font-weight:700;margin-top:4px}

/* Exams */
.exam-card{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-lg);padding:18px;margin-bottom:14px;transition:.2s;box-shadow:var(--sh-sm)}
.exam-card:hover{border-color:var(--brand-200);transform:translateY(-2px);box-shadow:var(--sh-lg)}
.exam-card h3{font-size:17px;margin-bottom:8px;color:var(--tx);font-weight:800}
.exam-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;font-size:12px}
.exam-meta .b{font-size:11px}
.exam-q{background:var(--surface-2);border:1px solid var(--bd);border-radius:var(--r-md);padding:16px;margin-bottom:14px}
.exam-q .q-text{font-size:15px;font-weight:800;margin-bottom:12px;line-height:1.7;color:var(--tx)}
.exam-q .q-num{display:inline-block;background:var(--grad-brand);color:#fff;width:26px;height:26px;border-radius:50%;text-align:center;line-height:26px;font-size:12px;font-weight:900;margin-left:8px}
.exam-opt{display:flex;align-items:center;gap:10px;padding:10px 14px;margin-bottom:8px;background:var(--surface);border:1.5px solid var(--bd);border-radius:10px;cursor:pointer;transition:.15s;font-weight:700}
.exam-opt:hover{border-color:var(--brand-500);background:var(--brand-50)}
html.dark .exam-opt:hover{background:rgba(37,99,235,.15)}
.exam-opt.selected{border-color:var(--brand-500);background:var(--brand-50);box-shadow:0 0 0 2px var(--brand-100)}
html.dark .exam-opt.selected{background:rgba(37,99,235,.25)}
.exam-opt input{margin:0;width:18px;height:18px;cursor:pointer}
.exam-opt span{font-size:14px;color:var(--tx);flex:1}
.exam-timer{position:sticky;top:12px;z-index:50;background:var(--grad-brand);color:#fff;padding:12px 18px;border-radius:var(--r-md);margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;font-weight:800;box-shadow:var(--sh-glow)}
.exam-timer.warn{background:var(--grad-warm);animation:pulse 1s infinite}
.exam-timer.danger{background:linear-gradient(135deg,#ef4444,#dc2626);animation:pulse .6s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
.exam-timer .time-big{font-size:22px;font-family:'Courier New',monospace;letter-spacing:2px}
.exam-result{text-align:center;padding:30px 20px}
.exam-result .score{font-size:60px;font-weight:900;margin:14px 0;background:var(--grad-brand);-webkit-background-clip:text;background-clip:text;color:transparent}
.exam-result .label{font-size:16px;color:var(--tx-2);margin-bottom:8px;font-weight:700}
.exam-result .detail{font-size:14px;color:var(--mu);margin-top:10px;font-weight:600}
.exam-vio{background:#fef3c7;color:#92400e;border:1px solid #fbbf24;padding:10px 14px;border-radius:10px;margin-bottom:12px;font-size:13px;font-weight:800}
html.dark .exam-vio{background:rgba(120,53,15,.4);color:#fcd34d;border-color:#b45309}
.exam-locked{text-align:center;padding:40px 20px;color:var(--mu)}
.exam-locked svg{width:70px;height:70px;fill:var(--bd);margin-bottom:16px}
@media print{body *{visibility:hidden!important}body::after{content:"الطباعة ولقطات الشاشة ممنوعة";visibility:visible;position:fixed;top:40%;right:0;left:0;text-align:center;font-size:24px;color:#ef4444;font-weight:900}}

.screenshot-shield{position:fixed;inset:0;z-index:99998;background:#0b1220;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;color:#fff;text-align:center;padding:20px}
.screenshot-shield.on{display:flex}
.screenshot-shield h2{color:#fff;font-size:22px}
.screenshot-shield p{opacity:.8;line-height:1.8;max-width:380px}

@media(max-width:720px){
  main{padding:0 14px 40px}
  h2{font-size:18px}
  .top-bar{padding:16px}
  .top-bar .welcome h1{font-size:18px}
  .bottombar button{font-size:10px;padding:6px 2px}
  .bottombar button svg{width:20px;height:20px}
  .exam-timer .time-big{font-size:18px}
  .exam-result .score{font-size:44px}
}
@media(max-width:520px){
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .card .card-img-wrap{height:130px}
  .card b{font-size:14px}
  .stats-table{font-size:11px}
  .stats-table th,.stats-table td{padding:8px 6px}
  .hero{padding:20px 18px;border-radius:var(--r-lg)}
  .hero-title{font-size:20px}
}

/* Games */
.game-wrap{max-width:900px;margin:0 auto}
.game-head{background:linear-gradient(135deg,#0891b2,#7c3aed);color:#fff;padding:20px;border-radius:var(--r-lg);margin-bottom:16px;box-shadow:var(--sh-lg)}
.game-head h2{color:#fff;margin:0 0 6px;font-size:22px;font-weight:900}
.game-head p{opacity:.92;font-size:13px;line-height:1.7}
.gh-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.gh-pts{background:rgba(255,255,255,.2);padding:6px 14px;border-radius:var(--r-full);font-weight:800;font-size:13px}
.gh-note{margin-top:8px;font-size:12px;opacity:.9}
.game-top{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.game-badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.game-sub{font-size:16px;margin:0 0 12px;color:var(--tx);font-weight:800}
.game-section{font-size:15px;font-weight:800;color:var(--tx-2);margin:18px 0 10px}
.game-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
button.game-card,.game-card{background:var(--surface);border:2px solid var(--bd);border-radius:var(--r-lg);padding:20px 16px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;transition:.2s;color:var(--tx);box-shadow:var(--sh-sm);font-family:inherit;transform:none}
.game-card:hover{background:var(--surface);border-color:var(--brand-500);transform:translateY(-3px);box-shadow:var(--sh-lg)}
.game-card .gc-icon{font-size:44px;line-height:1.2}
.game-card .gc-name{font-size:17px;font-weight:800}
.game-card .gc-desc{font-size:12px;color:var(--mu);line-height:1.6;font-weight:600}
.game-card .gc-bar{width:100%;height:6px;background:var(--surface-3);border-radius:var(--r-full);overflow:hidden;margin-top:6px}
.game-card .gc-bar span{display:block;height:100%;background:linear-gradient(90deg,#0891b2,var(--ok))}
.game-card .gc-meta{font-size:12px;font-weight:800;color:var(--brand-700)}
.game-card.special{background:linear-gradient(135deg,#ede9fe,#ddd6fe);border-color:#8b5cf6}
html.dark .game-card.special{background:rgba(76,29,149,.4);border-color:#a78bfa}
.game-card.disabled{opacity:.45;cursor:not-allowed;filter:grayscale(1)}
.game-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.game-done{text-align:center;padding:24px 16px}
.gd-icon{font-size:56px}
.gd-score{font-size:28px;font-weight:900;color:var(--brand-600);margin:10px 0}
.mut-inline{color:var(--mu);font-size:13px;font-weight:600}
.leader{list-style:none;padding:0;margin:0}
.leader li{display:flex;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--bd);font-weight:800}
.leader li b{color:var(--brand-700)}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:44px;padding:0 12px;border-radius:var(--r-full);color:#fff;font-weight:900;direction:ltr;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.lab-section-title{font-size:13px;font-weight:800;color:var(--tx-2);margin:12px 0 8px;text-align:center}
.res-ok{color:var(--ok);font-weight:800}
.free-plus{color:var(--mu);font-weight:900}
button.lab-el,button.lab-tool{font-family:inherit;transform:none;box-shadow:none}
.lab-tool{background:var(--surface);color:var(--tx);border:2px solid var(--bd);padding:10px 18px;border-radius:12px;font-size:14px;font-weight:800;cursor:pointer}
.lab-tool:hover{background:var(--brand-50);border-color:var(--brand-500);transform:none;box-shadow:none;filter:none}
.lab-tool.selected{border-color:var(--brand-500);background:var(--brand-50)}
.lab-el{border:0;padding:0;color:#fff;font-weight:900;font-size:20px;cursor:pointer;width:68px;height:68px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;transition:.15s}
.lab-el:hover{transform:translateY(-3px) scale(1.05)}

function img(f,maxSize=800){
  return new Promise((resolve,reject)=>{
    if(!f)return resolve(null);
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error('تعذر قراءة الصورة'));
    reader.onload=e=>{
      const im=new Image();
      im.onload=()=>{
        try{
          let w=im.width,h=im.height;
          if(w>maxSize||h>maxSize){const ratio=Math.min(maxSize/w,maxSize/h);w=Math.max(1,Math.round(w*ratio));h=Math.max(1,Math.round(h*ratio))}
          const c=document.createElement('canvas');c.width=w;c.height=h;
          c.getContext('2d').drawImage(im,0,0,w,h);
          let data;
          try{data=c.toDataURL('image/jpeg',0.8)}catch(err){data=c.toDataURL('image/png')}
          if(!data||data==='data:,')return reject(new Error('تعذر معالجة الصورة'));
          resolve(data);
        }catch(err){reject(err)}
      };
      im.onerror=()=>reject(new Error('صيغة الصورة غير مدعومة'));
      im.src=e.target.result;
    };
    reader.readAsDataURL(f);
  });
}

let toastTimer=null;
function toast(m){let t=$('#t');if(!t){t=document.createElement('div');t.id='t';t.setAttribute('role','status');t.setAttribute('aria-live','polite');document.body.appendChild(t)}t.textContent=m;t.classList.add('show');if(toastTimer)clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2600)}

function userSeed(){const s=U?.uid||'anon';let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h}
function userShuffle(arr,offset=0){const a=[...arr];let s=(userSeed()+offset)>>>0;for(let i=a.length-1;i>0;i--){s=(s*1664525+1013904223)>>>0;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}

    return{t:'yt',id:yt,s:`https://www.youtube-nocookie.com/embed/${yt}?${base}${origin}`};
  }

  if(dm)return{t:'drive',s:`https://drive.google.com/file/d/${dm[1]}/preview`,id:dm[1]};

function authMsg(e){
  const c=e?.code||'';
  if(c==='auth/network-request-failed')return 'تعذر الاتصال بالإنترنت';
  if(c==='auth/too-many-requests')return 'محاولات كثيرة جداً';
  if(c==='auth/weak-password')return 'كلمة المرور ضعيفة';
  if(c==='auth/email-already-in-use')return 'رقم الهاتف مسجل بالفعل';
  if(['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-login-credentials'].includes(c))return null;
  return 'حدث خطأ: '+(e?.message||c||'غير معروف');
}

function loginPhone(){return once('login',doLogin)}
async function doLogin(){
  const phone=normPhone($('#login-phone')?.value||'');
  const pass=$('#login-pass')?.value||'';
  const err=$('#login-error');if(err)err.style.display='none';
  if(!/^01[0-9]{9}$/.test(phone))return showErr('login-error','رقم الهاتف غير صحيح');
  if(!pass)return showErr('login-error','اكتب كلمة المرور');
  const failKey=`login_fails_${phone}`,lockKey=`login_lock_${phone}`;
  const lockTime=parseInt(store.get(lockKey)||'0',10);
  if(lockTime){const remaining=Math.ceil((lockTime-Date.now())/60000);if(remaining>0)return showErr('login-error',`تم قفل الحساب مؤقتاً. حاول بعد ${remaining} دقيقة.`);store.del(lockKey);store.del(failKey)}
  try{
    await signInWithEmailAndPassword(auth,`${phone}@sigma.user`,pass);
    store.del(failKey);toast('✅ تم تسجيل الدخول بنجاح');
  }catch(e){
    const m=authMsg(e);
    if(m!==null)return showErr('login-error',m);
    const fails=parseInt(store.get(failKey)||'0',10)+1;
    if(fails>=3){store.set(lockKey,String(Date.now()+15*60*1000));store.del(failKey);showErr('login-error','تم إدخال كلمة مرور خاطئة 3 مرات. الحساب مقفل لمدة 15 دقيقة.')}
    else{store.set(failKey,String(fails));showErr('login-error',`رقم الهاتف أو كلمة المرور غير صحيحة (المحاولة ${fails} من 3)`)}
  }
}

async function buildStudentStats(){
  const myVids=mineVideos||{};
  const mine={};
  for(const vid of Object.keys(myVids)){const rec=await G('logs/'+vid+'/'+U.uid);if(rec)mine[vid]=rec}
  const totalVideos=Object.keys(videos).length;
  const watchedCount=Object.keys(mine).length;
  const openedCount=Object.keys(myVids).length;
  const lockedCount=Math.max(0,totalVideos-openedCount);
  const rows=[];
  for(const [vid,v] of Object.entries(videos)){
    const teacher=teachers[v.teacherId];
    const log=mine[vid];
    const isOpen=A||IS_SUPERVISOR||v.free||!!myVids[vid];
    let status='';
    if(v.disabled&&!A&&!IS_SUPERVISOR)status='<span class="b r">موقوف</span>';
    else if(!isOpen)status='<span class="b y">يحتاج كود</span>';
    else if(log&&log.completed)status='<span class="b g">حضره كاملاً</span>';
    else if(log)status='<span class="b y">شاهد جزءاً</span>';
    else status='<span class="b g">مفتوح</span>';
    rows.push({vid,title:v.title||'-',teacher:teacher?.name||'-',grade:v.grade||'-',desc:v.desc||'',isOpen,status,log,watched:!!log,seconds:log?(log.seconds||0):0,disabled:!!v.disabled});
  }
  let filtered=rows;
  if(studentStatsFilter==='watched')filtered=rows.filter(r=>r.watched);
  else if(studentStatsFilter==='available')filtered=rows.filter(r=>r.isOpen&&!r.disabled);
  else if(studentStatsFilter==='locked')filtered=rows.filter(r=>!r.isOpen);
  const score=r=>r.watched?3:(r.isOpen?2:1);
  filtered.sort((a,b)=>{const d=score(b)-score(a);if(d)return d;return (b.log?.lastAt||0)-(a.log?.lastAt||0)});
  const summary=`<div class="stats-summary"><div class="stat-box"><div class="stat-num">${totalVideos}</div><div class="stat-label">إجمالي المحاضرات</div></div><div class="stat-box ok"><div class="stat-num">${openedCount}</div><div class="stat-label">مفتوحة لك</div></div><div class="stat-box warn"><div class="stat-num">${lockedCount}</div><div class="stat-label">تحتاج كود</div></div><div class="stat-box"><div class="stat-num">${watchedCount}</div><div class="stat-label">حضرتها</div></div></div>`;
  const filterBar=`<div class="stats-filter"><button class="${studentStatsFilter==='all'?'on':''}" onclick="setStatsFilter('all')">الكل</button><button class="${studentStatsFilter==='watched'?'on':''}" onclick="setStatsFilter('watched')">حضرتها (${watchedCount})</button><button class="${studentStatsFilter==='available'?'on':''}" onclick="setStatsFilter('available')">مفتوحة (${openedCount})</button><button class="${studentStatsFilter==='locked'?'on':''}" onclick="setStatsFilter('locked')">مقفلة (${lockedCount})</button></div>`;
  if(!filtered.length)return `<div class="box"><h2 style="color:var(--brand-700);margin-bottom:14px">📊 إحصائياتي</h2>${summary}${filterBar}<div class="mut" style="padding:30px">لا توجد محاضرات مطابقة.</div></div>`;
  const tableRows=filtered.map(r=>{
    const watchBtn=r.isOpen&&!r.disabled?`<button class="s" style="padding:5px 10px;font-size:11px;border-radius:8px" onclick="go('watch','${esc(r.vid)}')">مشاهدة</button>`:(!r.disabled?`<button style="padding:5px 10px;font-size:11px;border-radius:8px" onclick="go('code','${esc(r.vid)}')">فتح بكود</button>`:'-');
    const mins=Math.round(r.seconds/60);
    return `<tr><td><b>${esc(r.title)}</b>${r.desc?`<small style="display:block;color:var(--mu);font-size:11px;margin-top:2px">${esc(r.desc)}</small>`:''}</td><td>${esc(r.teacher)}</td><td><span class="grade-chip">${esc(r.grade)}</span></td><td>${r.status}</td><td>${r.watched?`<span style="font-size:12px;color:var(--tx2)">${mins} دقيقة</span>`:'-'}</td><td>${watchBtn}</td></tr>`;
  }).join('');
  return `<div class="box"><h2 style="color:var(--brand-700);margin-bottom:14px">📊 إحصائياتي</h2>${summary}<h3 style="margin:20px 0 10px;font-size:16px;color:var(--tx)">سجل المحاضرات</h3>${filterBar}<div class="stats-table-wrap"><table class="stats-table"><thead><tr><th>المحاضرة</th><th>المدرس</th><th>الصف</th><th>الحالة</th><th>المشاهدة</th><th>إجراء</th></tr></thead><tbody>${tableRows}</tbody></table></div></div>`;
}

async function changePassword(){
  const newPass=$('#new-pass')?.value||'';
  const confirmPass=$('#confirm-pass')?.value||'';
  if(newPass.length<6)return toast('كلمة المرور يجب أن تكون 6 أحرف على الأقل');
  if(newPass!==confirmPass)return toast('كلمتا المرور غير متطابقتين');
  const currentPass=$('#current-pass')?.value||'';
  if(!currentPass)return toast('اكتب كلمة المرور الحالية');
  try{
    const credential=EmailAuthProvider.credential(auth.currentUser.email,currentPass);
    await reauthenticateWithCredential(auth.currentUser,credential);
    await updatePassword(auth.currentUser,newPass);
    toast('✅ تم تغيير كلمة المرور');

function redeem(vid){return once('redeem_'+vid,()=>doRedeem(vid))}
async function doRedeem(vid){
  const v=videos[vid];if(!v||v.disabled)return toast('الفيديو موقوف');
  const cd=$('#cd');if(!cd)return;
  const c=normDigits(cd.value).replace(/\D/g,'');
  if(!/^\d{6}$/.test(c))return toast('الكود يجب أن يكون 6 أرقام');
  try{
    const r=await runTransaction(R('codes/'+c),cur=>{
      if(cur===null)return cur;
      if(cur.videoId!==vid)return cur;
      if(cur.used&&cur.usedBy!==U.uid)return cur;
      if(!cur.used){cur.used=true;cur.usedBy=U.uid;cur.usedByName=U.displayName||'';cur.usedByEmail=U.email||'';cur.usedAt=Date.now()}
      return cur;
    });
    const vv=r.snapshot.val();
    if(!vv||vv.usedBy!==U.uid||vv.videoId!==vid)return toast('الكود غير صحيح أو مستخدم من قبل');
    await set(R(`users/${U.uid}/videos/${vid}`),c);
    mineVideos={...mineVideos,[vid]:c};
    go('watch',vid);
  }catch(e){toast('حدث خطأ أثناء التحقق من الكود')}
}

  const overlays=[

}

async function doCreateExam(){
  if(!A&&!IS_SUPERVISOR)return toast('غير مصرح');
  const title=document.getElementById('exTitle')?.value.trim()||'';
  const grade=document.getElementById('exGrade')?.value||'';
  const duration=Math.min(180,Math.max(1,(+document.getElementById('exDuration')?.value)||30));
  if(!title)return toast('اكتب عنوان الامتحان');
  if(!ALL_GRADES.includes(grade))return toast('الصف غير صحيح');
  const items=document.querySelectorAll('.q-builder-item');
  if(!items.length)return toast('أضف سؤالاً واحداً على الأقل');
  if(items.length>100)return toast('الحد الأقصى 100 سؤال');
  const questions=[];
  for(const item of items){
    const type=item.querySelector('.q-type').value;
    const text=item.querySelector('.q-text').value.trim();
    const points=Math.max(1,Math.min(100,(+item.querySelector('.q-points').value)||1));
    if(!text)return toast('كل سؤال يحتاج نصاً');
    if(type==='mcq'){
      const opts=[...item.querySelectorAll('.q-opt')].map(i=>i.value.trim());
      if(opts.some(o=>!o))return toast('كل خيارات MCQ يجب أن تُملأ');
      const correct=item.querySelector('input[type=radio]:checked');
      if(!correct)return toast('حدد الإجابة الصحيحة');
      questions.push({type:'mcq',text,options:opts,correct:parseInt(correct.value,10),points});
    }else if(type==='tf'){
      questions.push({type:'tf',text,correct:item.querySelector('.q-tf-answer').value==='true',points});
    }else{
      questions.push({type:'short',text,correct:item.querySelector('.q-short-answer').value.trim(),points});
    }
  }
  try{
    const id='ex'+Date.now();
    await set(R('exams/'+id),{title,grade,duration,questions,created:Date.now(),createdBy:U.displayName||'',createdByUid:U.uid,disabled:false});
    toast('✅ تم إنشاء الامتحان');qBuildCounter=0;go('admin','','exams');
  }catch(e){toast('تعذر الحفظ: '+(e.code||e.message))}
}

    if(isCorrect)earned+=pts;

  });
  const score=totalPoints?Math.round(earned/totalPoints*100):0;
  const timeTaken=Math.round((Date.now()-st.startedAt)/1000);

}

async function gen(vid,n,video){
  const v=video||videos[vid];if(!v)throw new Error('الفيديو غير موجود');
  let ok=0,attempts=0;const maxAttempts=n*10;
  while(ok<n&&attempts<maxAttempts){
    const c=String(crypto.getRandomValues(new Uint32Array(1))[0]%900000+100000);
    try{const r=await runTransaction(R('codes/'+c),cur=>{if(cur!==null)return cur;return{videoId:vid,url:v.url,title:v.title||'',used:false,createdAt:Date.now()}});if(r.committed)ok++}catch(e){}
    attempts++;
  }
  return ok;
}

function gameHeader(title,sub){const pts=U?arcadePoints(U.uid):0;return `<div class="game-head"><div class="gh-row"><div><h2>${esc(title)}</h2><p>${esc(sub)}</p></div><span class="gh-pts">⭐ ${pts} نقطة</span></div>${canPlayNow()?'':'<p class="gh-note">وضع المشاهدة: النتائج لا تُحفظ</p>'}</div>`}

function arcadeBoard(){const ids=new Set([...Object.keys(arcadeData),...Object.keys(quizLeaderData||{})]);const rows=[...ids].map(uid=>({name:arcadeData[uid]?.name||quizLeaderData?.[uid]?.name||'طالب',points:arcadePoints(uid)})).filter(r=>r.points>0).sort((a,b)=>b.points-a.points).slice(0,10);if(!rows.length)return '';return `<div class="box"><h3 class="game-sub">🏆 لوحة المتصدرين</h3><ol class="leader">${rows.map(r=>`<li><span>${esc(r.name)}</span><b>${r.points}</b></li>`).join('')}</ol></div>`}
async function saveArcade(game,score){
  if(!U||!canPlayNow())return;
  const cur=arcadeData[U.uid]||{};const best={...(cur.best||{})};best[game]=Math.max(best[game]||0,score);
  const next={name:U.displayName||'طالب',best,points:Object.values(best).reduce((s,v)=>s+v,0),lastPlayed:Date.now()};
  arcadeData={...arcadeData,[U.uid]:next};
  try{await set(R('arcade/'+U.uid),next)}catch(e){toast('تعذر حفظ النتيجة')}
}
async function saveLabData(){
  if(!U||!canPlayNow())return;
  try{await set(R('labGame/'+U.uid),{name:U.displayName||'طالب',labs:labUserData.labs||{},discoveries:labUserData.discoveries||0,lastPlayed:Date.now()})}catch(e){}
}
async function saveQuizProgress(d){
  if(!U||!canPlayNow())return;
  const cur={...(quizLeaderData[U.uid]||{})};
  cur.points=(cur.points||0)+(d.points||0);cur.correct=(cur.correct||0)+(d.correct||0);cur.wrong=(cur.wrong||0)+(d.wrong||0);
  cur.levels={...(cur.levels||{})};if(d.level&&!cur.levels[d.level]){cur.levels[d.level]=true;cur.points+=50}
  cur.name=U.displayName||'طالب';cur.lastPlayed=Date.now();quizLeaderData={...quizLeaderData,[U.uid]:cur};
  try{await set(R('quizGame/'+U.uid),cur)}catch(e){}
}
function labPick(el){if(labShowingResult)return;if(labSelectedEls.length>=4)return toast('الحد الأقصى 4 عناصر');labSelectedEls.push(el);labLastResult=null;render()}
function labUndo(){if(labShowingResult)return;labSelectedEls.pop();labLastResult=null;render()}
function labClear(){if(labShowingResult)return;labSelectedEls=[];labSelectedTool=null;labLastResult=null;render()}
function labTool(t){if(labShowingResult)return;labSelectedTool=labSelectedTool===t?null:t;labLastResult=null;render()}
function labRun(){
  const exp=LAB_EXPERIMENTS[labActiveLab]?.[labCurrentExpIdx];
  if(!exp||labShowingResult)return;
  if(!labSelectedEls.length||!labSelectedTool)return toast('اختر العناصر والأداة أولاً');
  const ok=sameItems(exp.elements,labSelectedEls)&&labSelectedTool===exp.tool;
  if(ok){labShowingResult=true;labLastResult={correct:true,formula:exp.formula,result:exp.result,desc:exp.desc};if(canPlayNow()){labUserData.discoveries=(labUserData.discoveries||0)+1;labUserData.labs={...(labUserData.labs||{}),[labActiveLab]:Math.max(labDone(labActiveLab),labCurrentExpIdx+1)};saveLabData()}}
  else{labLastResult={correct:false,formula:'لا يحدث تفاعل متوقع',result:'العناصر أو الأداة غير مناسبة لهذه التجربة',desc:''}}
  render();
}
function labNext(){labCurrentExpIdx++;labSelectedEls=[];labSelectedTool=null;labShowingResult=false;labLastResult=null;render()}
function labBack(){labActiveLab=null;labCurrentExpIdx=0;labSelectedEls=[];labSelectedTool=null;labShowingResult=false;labLastResult=null;render()}
function freePick(el){const idx=freeLab.els.indexOf(el);if(idx>=0)freeLab.els.splice(idx,1);else if(freeLab.els.length<2)freeLab.els.push(el);freeLab.result=null;render()}
function freeTool(t){freeLab.tool=freeLab.tool===t?null:t;freeLab.result=null;render()}
function freeRun(){
  if(freeLab.els.length!==2)return toast('اختر عنصرين');
  const [a,b]=freeLab.els;
  const pairs=FREE_LAB_REACTIONS.filter(r=>(r.el1===a&&r.el2===b)||(r.el1===b&&r.el2===a));
  if(!pairs.length){freeLab.result={none:true,text:'هذان العنصران لا يتفاعلان معاً في الظروف العادية. جرّب عنصرين آخرين.'};render();return}
  const withTool=freeLab.tool?pairs.find(r=>r.tool===freeLab.tool):null;
  if(freeLab.tool&&!withTool){freeLab.result={none:true,text:'هذه الأداة لا تنتج تفاعلاً مع هذين العنصرين. جرّب أداة أخرى.'};render();return}
  const r=withTool||pairs[0];
  freeLab.result={formula:r.formula,explain:r.explain};
  render();
}
function freeReset(){freeLab={els:[],tool:null,result:null};render()}
function quizStart(level){
  if(!isLabOn('quiz'))return toast('اللعبة موقوفة حالياً');
  if(!QUIZ_QUESTIONS[level])return;
  window._quizOrder=userShuffle(QUIZ_QUESTIONS[level].map((_,i)=>i),level.length*10);
  quizActiveLevel=level;quizCurrentIndex=0;quizAnswered=false;render();
}
function quizExit(){if(quizTimer){clearTimeout(quizTimer);quizTimer=null}quizActiveLevel=null;quizCurrentIndex=0;quizAnswered=false;window._quizOrder=null;render()}
function quizAnswer(choice){
  if(quizAnswered||!quizActiveLevel)return;
  quizAnswered=true;
  const level=quizActiveLevel;
  const order=window._quizOrder||QUIZ_QUESTIONS[level].map((_,i)=>i);
  const origIdx=order[quizCurrentIndex];
  const q=QUIZ_QUESTIONS[level][origIdx];
  const optOrder=userShuffle(q.opts.map((_,i)=>i),origIdx+33);
  const displayCorrect=optOrder.indexOf(q.correct);
  const isCorrect=choice===displayCorrect;
  document.querySelectorAll('.quiz-opt').forEach((btn,i)=>{btn.disabled=true;if(i===displayCorrect)btn.classList.add('correct');else if(i===choice)btn.classList.add('wrong')});
  const fb=document.getElementById('quizFeedback');
  if(fb)fb.innerHTML=`<div class="quiz-feedback ${isCorrect?'ok':'no'}">${isCorrect?'✅ إجابة صحيحة! +10 نقاط':'❌ إجابة خاطئة — الإجابة الصحيحة: '+esc(q.opts[q.correct])}</div>`;
  saveQuizProgress({points:isCorrect?10:0,correct:isCorrect?1:0,wrong:isCorrect?0:1});
  quizTimer=setTimeout(()=>{
    quizTimer=null;quizCurrentIndex++;
    if(quizCurrentIndex>=(window._quizOrder||[]).length){saveQuizProgress({level});quizActiveLevel=null;quizCurrentIndex=0}
    quizAnswered=false;render();
  },1500);
}
function memStart(){if(!isLabOn('memory'))return;const cards=userShuffle(MEM_PAIRS.flatMap((p,i)=>[{pid:i,t:p.s},{pid:i,t:p.n}]),1);memState={cards,open:[],matched:[],moves:0,busy:false,done:false,score:0}}
function memFlip(i){
  const st=memState;if(!st||st.busy||st.done||st.open.includes(i)||st.matched.includes(i))return;
  st.open.push(i);
  if(st.open.length<2){render();return}
  st.moves++;st.busy=true;render();
  const [a,b]=st.open;
  setTimeout(()=>{if(memState!==st)return;if(st.cards[a].pid===st.cards[b].pid)st.matched.push(a,b);st.open=[];st.busy=false;if(st.matched.length===st.cards.length){st.done=true;st.score=Math.max(20,160-st.moves*4);saveArcade('memory',st.score)}render()},800);
}
function vMemory(){
  const st=memState;if(!st)return '<div class="mut">اللعبة موقوفة حالياً</div>';
  if(st.done)return resultCard('مطابقة الرموز',st.score,'memory');
  const cells=st.cards.map((c,i)=>{const up=st.open.includes(i)||st.matched.includes(i);return `<button class="mem-card ${up?'show':''} ${st.matched.includes(i)?'matched':''}" ${st.busy?'disabled':''} onclick="memFlip(${i})">${up?esc(c.t):'?'}</button>`}).join('');
  return `<div class="game-wrap">${gameTop('gameBack()','الألعاب',`<span class="b">المحاولات: ${st.moves}</span><span class="b g">${st.matched.length/2}/${MEM_PAIRS.length}</span>`)}<p class="game-sub" style="text-align:center">اربط الرمز الكيميائي باسم العنصر</p><div class="mem-grid">${cells}</div></div>`;
}
function huntStart(){if(!isLabOn('hunt'))return;const picks=userShuffle(ELEMENTS_DATA,1).slice(0,8);huntState={rounds:picks.map((t,idx)=>({target:t,opts:userShuffle([t,...userShuffle(ELEMENTS_DATA.filter(e=>e.s!==t.s),idx+10).slice(0,3)],idx+20)})),i:0,score:0,picked:null,done:false}}
function huntAnswer(sym){const st=huntState;if(!st||st.done||st.picked!==null)return;const r=st.rounds[st.i];st.picked=sym;if(sym===r.target.s)st.score+=10;render();setTimeout(()=>{if(huntState!==st)return;st.i++;st.picked=null;if(st.i>=st.rounds.length){st.done=true;saveArcade('hunt',st.score)}render()},900)}
function vHunt(){

  return `<div class="game-wrap">${gameTop('gameBack()','الألعاب',`<span class="b g">النقاط: ${st.score}</span><span class="b y">${st.i+1}/${st.rounds.length}</span>`)}<div class="quiz-arena"><div class="quiz-question" style="direction:rtl">ما رمز عنصر <b>${esc(r.target.n)}</b>؟</div><div class="quiz-options">${opts}</div></div></div>`;

function orderStart(){if(!isLabOn('order'))return;const rounds=[0,1,2].map(r=>userShuffle(ELEMENTS_DATA,r+100).slice(0,5));orderState={rounds,r:0,picked:[],mistakes:0,wrong:null,roundDone:false,score:0,done:false}}
function orderPick(sym){
  const st=orderState;if(!st||st.done||st.wrong||st.roundDone||st.picked.includes(sym))return;
  const items=st.rounds[st.r];const sorted=[...items].sort((a,b)=>a.z-b.z);const el=items.find(e=>e.s===sym);
  if(el.z===sorted[st.picked.length].z){st.picked.push(sym);if(st.picked.length===items.length){st.roundDone=true;st.score+=Math.max(5,30-st.mistakes*5)}}
  else{st.mistakes++;st.wrong=sym;setTimeout(()=>{if(orderState===st){st.wrong=null;render()}},600)}
  render();
}
function orderNext(){const st=orderState;if(!st||!st.roundDone)return;st.r++;st.picked=[];st.mistakes=0;st.roundDone=false;if(st.r>=st.rounds.length){st.done=true;saveArcade('order',st.score)}render()}
function vOrder(){
  const st=orderState;if(!st)return '<div class="mut">اللعبة موقوفة حالياً</div>';
  if(st.done)return resultCard('رتّب العناصر',st.score,'order');
  const items=st.rounds[st.r];
  const chain=st.picked.map(s=>{const e=items.find(x=>x.s===s);return `<span class="chip" style="background:#0891b2">${esc(e.s)}${st.roundDone?` (${e.z})`:''}</span>`}).join('');
  const btns=items.map(e=>{const p=st.picked.includes(e.s);const cls=p?'picked':st.wrong===e.s?'bad':'';return `<button class="order-btn ${cls}" ${p||st.roundDone||st.wrong?'disabled':''} onclick="orderPick('${e.s}')"><b>${esc(e.s)}</b><small>${esc(e.n)}</small></button>`}).join('');
  return `<div class="game-wrap">${gameTop('gameBack()','الألعاب',`<span class="b g">النقاط: ${st.score}</span><span class="b y">الجولة ${st.r+1}/${st.rounds.length}</span>`)}<p class="game-sub" style="text-align:center">رتّب العناصر من الأصغر إلى الأكبر في العدد الذري</p><div class="order-chain">${chain||'<span class="mut-inline">ابدأ بالعنصر الأصغر</span>'}</div><div class="order-grid">${btns}</div>${st.roundDone?`<div class="game-actions"><button onclick="orderNext()">${st.r+1>=st.rounds.length?'إنهاء اللعبة':'الجولة التالية'}</button></div>`:''}</div>`;
}
function balCoefsFor(idx){const eq=BAL_EQUATIONS[idx];return Array(eq.left.length+eq.right.length).fill(1)}
function balStart(){if(!isLabOn('balance'))return;balState={idx:0,coefs:balCoefsFor(0),wrong:0,score:0,msg:'',done:false}}
function balStep(k,d){const st=balState;if(!st||st.done)return;st.coefs[k]=clamp(st.coefs[k]+d,1,6);st.msg='';render()}
function atomTotals(items,coefs,offset){const t={};items.forEach((it,k)=>Object.entries(it.a).forEach(([el,n])=>{t[el]=(t[el]||0)+coefs[offset+k]*n}));return t}
function isBalanced(eq,coefs){const L=atomTotals(eq.left,coefs,0),R=atomTotals(eq.right,coefs,eq.left.length);const keys=new Set([...Object.keys(L),...Object.keys(R)]);return [...keys].every(k=>(L[k]||0)===(R[k]||0))}
function balCheck(){
  const st=balState;if(!st||st.done)return;
  const eq=BAL_EQUATIONS[st.idx];
  if(isBalanced(eq,st.coefs)){st.score+=Math.max(2,10-st.wrong*2);st.idx++;st.wrong=0;st.msg='ok';if(st.idx>=BAL_EQUATIONS.length){st.done=true;saveArcade('balance',st.score)}else st.coefs=balCoefsFor(st.idx)}
  else{st.wrong++;st.msg='bad'}
  render();
}
function vBalance(){
  const st=balState;if(!st)return '<div class="mut">اللعبة موقوفة حالياً</div>';
  if(st.done)return resultCard('موازنة المعادلات',st.score,'balance');
  const eq=BAL_EQUATIONS[st.idx];const off=eq.left.length;
  const item=(it,k)=>`<div class="bal-item"><div class="bal-ctrl"><button class="bal-step" onclick="balStep(${k},-1)">−</button><span class="bal-n">${st.coefs[k]}</span><button class="bal-step" onclick="balStep(${k},1)">+</button></div><span class="bal-f">${esc(it.f)}</span></div>`;
  const side=(items,base)=>items.map((it,k)=>item(it,base+k)).join('<span class="bal-op">+</span>');
  const msg=st.msg==='ok'?'<div class="bal-msg ok">أحسنت! المعادلة متوازنة</div>':st.msg==='bad'?'<div class="bal-msg bad">المعادلة غير متوازنة بعد، عدّل المعاملات</div>':'';
  return `<div class="game-wrap">${gameTop('gameBack()','الألعاب',`<span class="b g">النقاط: ${st.score}</span><span class="b y">${st.idx+1}/${BAL_EQUATIONS.length}</span>`)}<p class="game-sub" style="text-align:center">عدّل المعاملات حتى تتساوى الذرات في الطرفين</p>${msg}<div class="bal-row">${side(eq.left,0)}<span class="bal-op">→</span>${side(eq.right,off)}</div><div class="game-actions"><button onclick="balCheck()">تحقق</button></div></div>`;
}

  if(!exp)return `<div class="game-wrap">${gameTop('labBack()','المختبرات')}<div class="box game-done"><div class="gd-icon">🏆</div><h2>أنهيت ${esc(info.name)}</h2><p>أكملت كل التجارب بنجاح</p><div class="game-actions"><button onclick="labBack()">العودة للمختبرات</button></div></div></div>`;
  const pool=[...new Set(exps.flatMap(e=>e.elements))];
  const tube=labSelectedEls.length?labSelectedEls.map(el=>`<span class="tube-el" style="${elStyle(el)}">${esc(LAB_ELEMENT_LABELS[el]||el)}</span>`).join('<span class="tube-plus">+</span>'):'<div class="tube-hint">اختر العناصر من الأسفل</div>';
  const res=labLastResult;
  const resultHTML=res?`<div class="lab-result ${res.correct?'':'fail'}"><div class="res-formula">${esc(res.formula)}</div><div class="res-desc">${esc(res.result)}</div>${res.correct?`<div class="res-desc res-ok">${esc(res.desc)}</div>`:''}</div>`:'';
  const controls=labShowingResult?`<div class="lab-actions"><button onclick="labNext()">${labCurrentExpIdx+1>=exps.length?'إنهاء المختبر':'التجربة التالية'}</button></div>`:`<div class="lab-section-title">العناصر</div><div class="lab-elements">${pool.map(el=>`<button class="lab-el ${labSelectedEls.includes(el)?'selected':''}" style="${elStyle(el)}" onclick="labPick('${el}')">${esc(LAB_ELEMENT_LABELS[el]||el)}</button>`).join('')}</div><div class="lab-section-title">الأداة</div><div class="lab-tools">${Object.entries(LAB_TOOLS).map(([k,t])=>`<button class="lab-tool ${labSelectedTool===k?'selected':''}" onclick="labTool('${k}')">${t.icon} ${t.label}</button>`).join('')}</div><div class="lab-actions"><button class="s" onclick="labUndo()">تراجع</button><button class="s" onclick="labClear()">مسح</button><button onclick="labRun()">▶ تنفيذ</button></div>`;
  return `<div class="game-wrap">${gameTop('labBack()','المختبرات',`<span class="b g">${esc(info.name)}</span><span class="b y">${labCurrentExpIdx+1}/${exps.length}</span>`)}<div class="lab-progress"><div class="lab-progress-fill" style="width:${labCurrentExpIdx/exps.length*100}%"></div></div><div class="lab-arena"><div class="lab-scenario"><div class="sc-icon">🎯</div><div class="sc-text">${esc(exp.scenario)}</div></div><div class="lab-tube has-liquid">${tube}</div>${resultHTML}${controls}</div></div>`;
}
function vFreeLab(){
  const r=freeLab.result;
  const chosen=freeLab.els.length?freeLab.els.map(e=>`<span class="chip" style="${elStyle(e)}">${esc(LAB_ELEMENT_LABELS[e])}</span>`).join('<span class="free-plus">+</span>'):'<span class="mut-inline">اختر عنصرين من الأسفل</span>';
  const res=r?(r.none?`<div class="lab-result fail"><div class="res-desc">${esc(r.text)}</div></div>`:`<div class="lab-result"><div class="res-formula">${esc(r.formula)}</div><div class="res-desc">${esc(r.explain)}</div></div>`):'';
  return `<div class="game-wrap">${gameTop('gameBack()','الألعاب',`<span class="b g">🧑‍🔬 طلع الكيميائي اللي جواك</span>`)}<div class="box"><div class="lab-tube has-liquid">${chosen}</div>${res}</div><div class="box"><div class="lab-section-title">اختر عنصرين</div><div class="lab-elements">${FREE_LAB_ELEMENTS.map(el=>`<button class="lab-el ${freeLab.els.includes(el)?'selected':''}" style="${elStyle(el)}" onclick="freePick('${el}')">${esc(LAB_ELEMENT_LABELS[el])}</button>`).join('')}</div><div class="lab-section-title">الأداة (اختياري)</div><div class="lab-tools">${Object.entries(LAB_TOOLS).map(([k,t])=>`<button class="lab-tool ${freeLab.tool===k?'selected':''}" onclick="freeTool('${k}')">${t.icon} ${t.label}</button>`).join('')}</div><div class="lab-actions"><button onclick="freeRun()">▶ نفذ التفاعل</button><button class="s" onclick="freeReset()">مسح</button></div></div></div>`;
}
function vQuizHome(){
  const p=quizLeaderData[U.uid]||{};
  const levels=[['easy','🥉','المستوى السهل','تفاعلات أساسية — إعدادي'],['medium','🥈','المستوى المتوسط','إحلال وترسيب'],['hard','🥇','المستوى الصعب','أكسدة واختزال']];
  const cards=levels.map(([k,ic,n,d])=>`<button class="game-card ${!isLabOn('quiz')?'disabled':''}" onclick="quizStart('${k}')"><span class="gc-icon">${ic}</span><span class="gc-name">${n}${p.levels?.[k]?' ✓':''}</span><span class="gc-desc">${d}${!isLabOn('quiz')?' — موقوف':''}</span></button>`).join('');
  return `<div class="game-wrap">${gameTop('gameBack()','الألعاب',`<span class="b">${canPlayNow()?'نقاطك: '+(p.points||0):'وضع المشاهدة'}</span>`)}<h2 class="game-sub">اختر الناتج</h2><div class="game-grid">${cards}</div></div>`;
}
function vQuizScreen(){
  const level=quizActiveLevel;
  const order=window._quizOrder||QUIZ_QUESTIONS[level].map((_,i)=>i);
  const origIdx=order[quizCurrentIndex];
  const q=QUIZ_QUESTIONS[level][origIdx];
  const optOrder=userShuffle(q.opts.map((_,i)=>i),origIdx+33);
  const name={easy:'السهل',medium:'المتوسط',hard:'الصعب'}[level];
  return `<div class="game-wrap">${gameTop('quizExit()','المستويات',`<span class="b g">${name}</span><span class="b y">${quizCurrentIndex+1}/${order.length}</span>`)}<div class="quiz-progress"><div class="quiz-progress-fill" style="width:${quizCurrentIndex/order.length*100}%"></div></div><div class="quiz-arena"><div class="quiz-question">${esc(q.q)}</div><div class="quiz-options">${optOrder.map((origOptIdx,displayIdx)=>`<button class="quiz-opt" onclick="quizAnswer(${displayIdx})">${esc(q.opts[origOptIdx])}</button>`).join('')}</div><div id="quizFeedback"></div></div></div>`;
}
function vGamesHub(){
  const labsProg=Object.keys(LAB_INFO).reduce((s,k)=>s+labDone(k),0);
  const total=Object.values(LAB_EXPERIMENTS).reduce((s,a)=>s+a.length,0);
  const labCard=`<button class="game-card ${!isLabOn('lab')?'disabled':''}" onclick="openLabHub()"><span class="gc-icon">🔬</span><span class="gc-name">المختبر الافتراضي</span><span class="gc-desc">3 مختبرات بتجارب تفاعلية${!isLabOn('lab')?' — موقوف':''}</span><span class="gc-meta">${labsProg}/${total} تجربة</span></button>`;
  const freeCard=`<button class="game-card special ${!isLabOn('free')?'disabled':''}" onclick="openFree()"><span class="gc-icon">🧑‍🔬</span><span class="gc-name">طلع الكيميائي اللي جواك</span><span class="gc-desc">اختر أي عنصرين وشوف التفاعل الناتج${!isLabOn('free')?' — موقوف':''}</span></button>`;
  const games=GAME_CARDS.map(g=>`<button class="game-card ${!isLabOn(g.k)?'disabled':''}" onclick="openGame('${g.k}')"><span class="gc-icon">${g.i}</span><span class="gc-name">${g.n}</span><span class="gc-desc">${g.d}${!isLabOn(g.k)?' — موقوف':''}</span></button>`).join('');
  return `<div class="game-wrap">${gameHeader('مختبر سيجما','اختر لعبة وابدأ التحدي')}<div class="game-section">المختبر</div><div class="game-grid">${labCard}${freeCard}</div><div class="game-section">الألعاب</div><div class="game-grid">${games}</div>${arcadeBoard()}</div>`;
}
function vGames(){
  const t=S.tab||'hub';
  if(t==='lab')return labActiveLab?vLabScreen():vLabHub();
  if(t==='free')return vFreeLab();
  if(t==='quiz')return quizActiveLevel?vQuizScreen():vQuizHome();
  if(t==='memory'){if(!memState)memStart();return vMemory()}
  if(t==='hunt'){if(!huntState)huntStart();return vHunt()}
  if(t==='order'){if(!orderState)orderStart();return vOrder()}
  if(t==='balance'){if(!balState)balStart();return vBalance()}
  if(t==='who'){if(!whoState)whoStart();return vWho()}
  if(t==='tf'){if(!tfState)tfStart();return vTF()}
  if(t==='speed'){if(!speedState)speedStart();return vSpeed()}
  return vGamesHub();
}

window.__bootAfterUnban=async function(){
  try{
    showingBan=false;
    if(U){
      if(!A&&!IS_SUPERVISOR){
        const phoneKey=normPhone(myPhone||'');
        const pb=phoneKey?await G('bansByPhone/'+phoneKey):null;
        const b=await G('bans/'+U.uid);
        if(pb){renderBanned(pb);return}
        if(b){renderBanned(b);return}
      }
      render();
    }else{render()}
    hideOverlay();
  }catch(e){try{render()}catch(_){}}
};

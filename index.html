<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Clone - دردشة Firebase</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    }

    body {
      background: #0b141a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    /* شاشة تسجيل الدخول */
    .login-screen {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #075e54 0%, #128c7e 50%, #25d366 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      transition: opacity 0.4s;
    }
    .login-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .login-box {
      background: #fff;
      padding: 35px 30px;
      border-radius: 15px;
      width: 90%;
      max-width: 380px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
      text-align: center;
    }
    .login-box .logo {
      width: 80px;
      height: 80px;
      background: #25d366;
      border-radius: 50%;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      color: white;
    }
    .login-box h1 {
      color: #075e54;
      margin-bottom: 8px;
      font-size: 24px;
    }
    .login-box p {
      color: #667781;
      margin-bottom: 25px;
      font-size: 14px;
    }
    .login-box input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e9edef;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      transition: border 0.2s;
      text-align: right;
    }
    .login-box input:focus {
      border-color: #25d366;
    }
    .login-box button {
      width: 100%;
      padding: 14px;
      background: #25d366;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      margin-top: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .login-box button:hover {
      background: #1ebe5b;
    }

    /* حاوية الدردشة */
    .chat-container {
      width: 100%;
      max-width: 450px;
      height: 100vh;
      max-height: 800px;
      background: #efeae2;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 40px rgba(0,0,0,0.5);
    }

    @media (min-width: 500px) {
      .chat-container {
        border-radius: 12px;
      }
    }

    /* الهيدر */
    .chat-header {
      background: #075e54;
      color: white;
      padding: 12px 15px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
      z-index: 10;
    }
    .chat-header .avatar {
      width: 42px;
      height: 42px;
      background: #25d366;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
      color: white;
      flex-shrink: 0;
    }
    .chat-header .info {
      flex: 1;
    }
    .chat-header .info h2 {
      font-size: 16px;
      font-weight: 600;
    }
    .chat-header .info .status {
      font-size: 12px;
      opacity: 0.85;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .chat-header .info .status::before {
      content: '';
      width: 7px;
      height: 7px;
      background: #25d366;
      border-radius: 50%;
      box-shadow: 0 0 5px #25d366;
    }
    .chat-header .logout-btn {
      background: transparent;
      border: none;
      color: white;
      font-size: 20px;
      cursor: pointer;
      padding: 5px;
      border-radius: 50%;
      transition: background 0.2s;
    }
    .chat-header .logout-btn:hover {
      background: rgba(255,255,255,0.15);
    }

    /* منطقة الرسائل */
    .chat-messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(255,255,255,0.4) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(255,255,255,0.3) 0%, transparent 40%);
    }
    .chat-messages::-webkit-scrollbar {
      width: 6px;
    }
    .chat-messages::-webkit-scrollbar-thumb {
      background: #b1b3b5;
      border-radius: 3px;
    }

    /* فقاعة الرسالة */
    .message-row {
      display: flex;
      width: 100%;
      animation: fadeIn 0.25s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .message-row.mine {
      justify-content: flex-start;
    }
    .message-row.other {
      justify-content: flex-end;
    }

    .message {
      max-width: 75%;
      padding: 8px 12px 6px;
      border-radius: 10px;
      font-size: 14.5px;
      word-wrap: break-word;
      position: relative;
      box-shadow: 0 1px 1px rgba(0,0,0,0.1);
      line-height: 1.4;
    }
    .message.mine {
      background: #d9fdd3;
      color: #111b21;
      border-top-right-radius: 3px;
    }
    .message.other {
      background: #fff;
      color: #111b21;
      border-top-left-radius: 3px;
    }

    .message .sender-name {
      font-size: 12.5px;
      font-weight: bold;
      color: #25d366;
      margin-bottom: 3px;
      display: block;
    }
    .message.mine .sender-name {
      color: #075e54;
    }

    .message .msg-text {
      display: inline;
    }

    .message .msg-meta {
      font-size: 11px;
      color: #667781;
      margin-top: 3px;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 4px;
    }
    .message .check {
      font-size: 12px;
      color: #53bdeb;
    }

    /* حقل الإدخال */
    .chat-input {
      display: flex;
      padding: 8px 10px;
      background: #f0f2f5;
      gap: 8px;
      align-items: center;
      border-top: 1px solid #e0e0e0;
    }
    .chat-input input {
      flex: 1;
      padding: 11px 15px;
      border: none;
      border-radius: 25px;
      outline: none;
      font-size: 15px;
      background: #fff;
      text-align: right;
    }
    .chat-input button {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #25d366;
      color: white;
      border: none;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s, background 0.2s;
      flex-shrink: 0;
    }
    .chat-input button:hover {
      background: #1ebe5b;
      transform: scale(1.05);
    }
    .chat-input button:active {
      transform: scale(0.95);
    }

    /* فاصل التاريخ */
    .date-separator {
      align-self: center;
      background: #fff;
      color: #667781;
      font-size: 11.5px;
      padding: 5px 12px;
      border-radius: 8px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
      margin: 5px 0;
      font-weight: 500;
    }

    /* مؤشر الكتابة */
    .typing-indicator {
      position: absolute;
      bottom: 65px;
      right: 15px;
      background: #fff;
      padding: 8px 14px;
      border-radius: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      font-size: 12px;
      color: #667781;
      display: none;
      align-items: center;
      gap: 6px;
    }
    .typing-indicator.show {
      display: flex;
    }
    .typing-dots span {
      display: inline-block;
      width: 5px;
      height: 5px;
      background: #25d366;
      border-radius: 50%;
      margin: 0 1px;
      animation: typing 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-5px); }
    }
  </style>
</head>
<body>

  <!-- شاشة تسجيل الدخول -->
  <div class="login-screen" id="loginScreen">
    <div class="login-box">
      <div class="logo">💬</div>
      <h1>واتساب ويب</h1>
      <p>أدخل اسمك للانضمام إلى المحادثة</p>
      <input type="text" id="nameInput" placeholder="اسمك..." maxlength="20">
      <button id="joinBtn">دخول الدردشة</button>
    </div>
  </div>

  <!-- واجهة الدردشة -->
  <div class="chat-container">
    <div class="chat-header">
      <div class="avatar" id="userAvatar">؟</div>
      <div class="info">
        <h2>غرفة الدردشة العامة</h2>
        <div class="status">متصل الآن</div>
      </div>
      <button class="logout-btn" id="logoutBtn" title="خروج">🚪</button>
    </div>

    <div class="chat-messages" id="messages"></div>

    <div class="typing-indicator" id="typingIndicator">
      <span id="typingName"></span>
      <div class="typing-dots"><span></span><span></span><span></span></div>
    </div>

    <div class="chat-input">
      <input type="text" id="messageInput" placeholder="اكتب رسالة..." autocomplete="off">
      <button id="sendBtn" title="إرسال">➤</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getDatabase, ref, push, onChildAdded, onValue, 
      set, remove, serverTimestamp, query, limitToLast, off 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // إعدادات Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyAN11agW-TWwAk3TvF7mRZRt6PHLcnl_aQ",
      authDomain: "ym-pro-max.firebaseapp.com",
      databaseURL: "https://ym-pro-max-default-rtdb.firebaseio.com",
      projectId: "ym-pro-max",
      storageBucket: "ym-pro-max.firebasestorage.app",
      messagingSenderId: "174657071953",
      appId: "1:174657071953:web:5e831fc337df46dbd18170"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // العناصر
    const loginScreen = document.getElementById('loginScreen');
    const nameInput = document.getElementById('nameInput');
    const joinBtn = document.getElementById('joinBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const messagesContainer = document.getElementById('messages');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const userAvatar = document.getElementById('userAvatar');
    const typingIndicator = document.getElementById('typingIndicator');
    const typingName = document.getElementById('typingName');

    // متغيرات الحالة
    let username = '';
    let userId = '';
    let lastMessageDate = '';
    let typingTimeout = null;
    let unsubscribeMessages = null;
    let unsubscribeTyping = null;
    let unsubscribeUsers = null;

    // ====== تسجيل الدخول ======
    joinBtn.addEventListener('click', joinChat);
    nameInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') joinChat();
    });

    function joinChat() {
      const name = nameInput.value.trim();
      if (name.length < 2) {
        nameInput.style.borderColor = '#ff4444';
        nameInput.focus();
        return;
      }
      username = name;
      userId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
      
      sessionStorage.setItem('chat_username', username);
      sessionStorage.setItem('chat_userId', userId);
      
      startChat();
    }

    function startChat() {
      // إخفاء شاشة الدخول
      loginScreen.classList.add('hidden');
      
      // تحديث الأفاتار
      userAvatar.textContent = username.charAt(0).toUpperCase();
      
      // تسجيل المستخدم كمتصل
      const userRef = ref(db, 'onlineUsers/' + userId);
      set(userRef, { name: username, joinedAt: Date.now() });

      // إزالة المستخدم عند الخروج
      window.addEventListener('beforeunload', () => {
        remove(userRef);
        set(ref(db, 'typing/' + userId), null);
      });

      // تحميل الرسائل
      loadMessages();

      // الاستماع لمؤشر الكتابة
      listenTyping();
    }

    // ====== إرسال الرسائل ======
    function sendMessage() {
      const text = messageInput.value.trim();
      if (text === '') return;

      const messagesRef = ref(db, 'messages');
      push(messagesRef, {
        text: text,
        sender: username,
        senderId: userId,
        timestamp: Date.now()
      });

      messageInput.value = '';
      messageInput.focus();
      
      // إلغاء مؤشر الكتابة
      set(ref(db, 'typing/' + userId), null);
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    // مؤشر الكتابة
    messageInput.addEventListener('input', () => {
      if (!userId) return;
      set(ref(db, 'typing/' + userId), { name: username, at: Date.now() });
      
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => {
        set(ref(db, 'typing/' + userId), null);
      }, 2000);
    });

    // ====== تحميل الرسائل ======
    function loadMessages() {
      const messagesRef = query(ref(db, 'messages'), limitToLast(100));
      
      unsubscribeMessages = onChildAdded(messagesRef, (snapshot) => {
        const data = snapshot.val();
        if (!data) return;
        renderMessage(data);
      });
    }

    function renderMessage(data) {
      const isMine = data.senderId === userId;
      const msgDate = new Date(data.timestamp);
      const dateStr = formatDate(msgDate);

      // فاصل التاريخ
      if (dateStr !== lastMessageDate) {
        lastMessageDate = dateStr;
        const separator = document.createElement('div');
        separator.className = 'date-separator';
        separator.textContent = dateStr;
        messagesContainer.appendChild(separator);
      }

      // فقاعة الرسالة
      const row = document.createElement('div');
      row.className = 'message-row ' + (isMine ? 'mine' : 'other');

      const msg = document.createElement('div');
      msg.className = 'message ' + (isMine ? 'mine' : 'other');

      let html = '';
      if (!isMine) {
        html += `<span class="sender-name">${escapeHtml(data.sender)}</span>`;
      }
      html += `<span class="msg-text">${escapeHtml(data.text)}</span>`;
      html += `<div class="msg-meta">
        <span>${formatTime(msgDate)}</span>
        ${isMine ? '<span class="check">✓✓</span>' : ''}
      </div>`;

      msg.innerHTML = html;
      row.appendChild(msg);
      messagesContainer.appendChild(row);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // ====== مؤشر الكتابة ======
    function listenTyping() {
      const typingRef = ref(db, 'typing');
      unsubscribeTyping = onValue(typingRef, (snapshot) => {
        const data = snapshot.val();
        if (!data) {
          typingIndicator.classList.remove('show');
          return;
        }
        
        const now = Date.now();
        const others = Object.values(data).filter(
          t => t && t.name !== username && (now - t.at) < 3000
        );
        
        if (others.length > 0) {
          typingName.textContent = others[0].name + ' يكتب';
          typingIndicator.classList.add('show');
        } else {
          typingIndicator.classList.remove('show');
        }
      });
    }

    // ====== أدوات مساعدة ======
    function formatTime(date) {
      let h = date.getHours();
      const m = String(date.getMinutes()).padStart(2, '0');
      const period = h >= 12 ? 'م' : 'ص';
      h = h % 12 || 12;
      return `${h}:${m} ${period}`;
    }

    function formatDate(date) {
      const today = new Date();
      const yesterday = new Date();
      yesterday.setDate(today.getDate() - 1);
      
      const isSameDay = (d1, d2) => 
        d1.getDate() === d2.getDate() &&
        d1.getMonth() === d2.getMonth() &&
        d1.getFullYear() === d2.getFullYear();
      
      if (isSameDay(date, today)) return 'اليوم';
      if (isSameDay(date, yesterday)) return 'أمس';
      
      const months = ['يناير','فبراير','مارس','أبريل','مايو','يونيو',
                      'يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
      return `${date.getDate()} ${months[date.getMonth()]} ${date.getFullYear()}`;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ====== تسجيل الخروج ======
    logoutBtn.addEventListener('click', () => {
      if (!confirm('هل تريد الخروج من الدردشة؟')) return;
      
      remove(ref(db, 'onlineUsers/' + userId));
      set(ref(db, 'typing/' + userId), null);
      
      if (unsubscribeMessages) off(ref(db, 'messages'));
      if (unsubscribeTyping) off(ref(db, 'typing'));
      
      sessionStorage.clear();
      location.reload();
    });

    // استئناف الجلسة السابقة
    window.addEventListener('load', () => {
      const savedName = sessionStorage.getItem('chat_username');
      const savedId = sessionStorage.getItem('chat_userId');
      if (savedName && savedId) {
        username = savedName;
        userId = savedId;
        startChat();
      }
    });
  </script>

</body>
</html>

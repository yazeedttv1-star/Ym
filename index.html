<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e91e63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23e91e63'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='white'%3Eي%3C/text%3E%3C/svg%3E">

<script>
try {
  var t = JSON.parse(localStorage.getItem('yz_theme') || 'null') || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = t;
} catch(e) { document.documentElement.dataset.theme = 'light'; }
</script>
<style>
:root{--p:#e91e63;--p2:#f06292;--ac:#f59e0b;--bg:#fff5f8;--card:#fff;--tx:#2a1620;--mt:#8a6b78;--bd:#f6d9e3;--sh:0 6px 22px rgba(233,30,99,.10);--ok:#16a34a;--er:#dc2626;--r:18px;--hh:64px;--nh:68px}
[data-theme=dark]{--bg:#150c11;--card:#22141c;--tx:#fbeaf1;--mt:#b793a3;--bd:#3b2331;--sh:0 6px 22px rgba(0,0,0,.45)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:Cairo,Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;line-height:1.6;transition:background .3s,color .3s;overflow-x:hidden}
body.lock{overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:15px;color:inherit}
button{cursor:pointer;border:0;background:none}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none;cursor:pointer}
.hide{display:none!important}
:focus-visible{outline:2px solid var(--p);outline-offset:2px}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes badgePulse{0%{transform:scale(1)}40%{transform:scale(1.55)}100%{transform:scale(1)}}
@keyframes sh{to{background-position:-200% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes heartBeat{0%,100%{transform:scale(1)}15%{transform:scale(1.4)}30%{transform:scale(1)}45%{transform:scale(1.3)}}
@keyframes emptyFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes removeCart{to{opacity:0;transform:translateX(40px);height:0;padding:0;margin:0;overflow:hidden}}
@keyframes imgBlur{from{filter:blur(8px);opacity:.7}to{filter:blur(0);opacity:1}}
.hd{position:sticky;top:0;z-index:50;padding-top:env(safe-area-inset-top);background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--bd)}
.hdi{max-width:1280px;margin:auto;display:flex;align-items:center;gap:10px;padding:10px 12px;min-height:var(--hh)}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--p);min-width:0}
.brand img{width:36px;height:36px;border-radius:10px;object-fit:cover;flex:none}
.brand span{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:96px}
.hs{display:none;flex:1;max-width:480px;margin-inline:auto;position:relative}
.hs i,.sm i{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:var(--mt)}
.hs input,.sm input{width:100%;padding:10px 14px;padding-inline-start:40px;border-radius:99px;border:1.5px solid var(--bd);background:var(--card);outline:0;transition:.2s}
.hs input:focus,.sm input:focus{border-color:var(--p);box-shadow:0 0 0 3px color-mix(in srgb,var(--p) 15%,transparent)}
.hact{display:flex;gap:5px;align-items:center;margin-inline-start:auto}
#uArea{display:flex;gap:5px;align-items:center}
.ib{position:relative;width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;background:var(--card);border:1px solid var(--bd);color:var(--tx);transition:.2s;flex:none}
.ib:hover{color:var(--p);border-color:var(--p)}
.ib:active{transform:scale(.93)}
.ib.av{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-weight:800;border:0}
.bg{position:absolute;top:-4px;inset-inline-end:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--p);color:#fff;font:700 11px/18px Cairo,sans-serif;text-align:center;font-style:normal}
.bg.pulse{animation:badgePulse .6s}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:14px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-weight:700;box-shadow:0 6px 16px color-mix(in srgb,var(--p) 32%,transparent);transition:.2s;text-align:center}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn.sm{padding:7px 14px;font-size:13px;border-radius:11px}
.btn.gh{background:var(--card);color:var(--p);border:1px solid var(--bd);box-shadow:none}
.btn.gh:hover{border-color:var(--p)}
.btn.dg{background:var(--er);box-shadow:0 6px 16px rgba(220,38,38,.3)}
.btn.ok{background:var(--ok);box-shadow:0 6px 16px rgba(22,163,74,.3)}
.btn[disabled]{opacity:.5;pointer-events:none;filter:grayscale(.6)}
#main{max-width:1280px;margin:auto;padding:14px 12px calc(var(--nh) + 34px + env(safe-area-inset-bottom))}
.ph2{font-size:20px;font-weight:800;margin:6px 0 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ph2 .count-badge{background:var(--p);color:#fff;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:700}
.hero{display:grid;gap:16px;align-items:center;background:linear-gradient(135deg,var(--p),var(--p2) 62%,var(--ac));border-radius:26px;padding:24px;color:#fff;overflow:hidden;animation:fadeUp .6s both;margin-bottom:16px;position:relative}
.hero h1{font-size:clamp(22px,4vw,38px);font-weight:800;line-height:1.4;margin-bottom:8px;position:relative}
.hero p{opacity:.92;margin-bottom:16px;position:relative}
.hero img,.hph{width:100%;aspect-ratio:16/10;max-height:280px;object-fit:cover;border-radius:20px;position:relative}
.hph{display:grid;place-items:center;font-size:64px;background:rgba(255,255,255,.18)}
.hero .btn{background:#fff;color:var(--p);box-shadow:0 6px 16px rgba(0,0,0,.18);position:relative}
.sm{position:relative;margin-bottom:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:8px 16px;border-radius:99px;background:var(--card);border:1px solid var(--bd);white-space:nowrap;font-weight:600;transition:.2s}
.chip:hover{border-color:var(--p);color:var(--p)}
.chip.on{background:var(--p);color:#fff;border-color:var(--p)}
.sort-w{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.sort-w label{font-size:13px;color:var(--mt);font-weight:600;flex:none}
.sort-w select{flex:1;min-width:140px;padding:9px 12px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card);font-size:13px;font-weight:600;cursor:pointer;outline:0}
.sort-w select:focus{border-color:var(--p)}
.prd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px;background:var(--card);border:1px solid var(--bd);border-radius:14px;margin-bottom:12px}
.prd label{font-size:12px;font-weight:700;color:var(--mt)}
.prd input[type=number]{width:90px;padding:8px 10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);font-size:13px;text-align:center;outline:0}
.prd input[type=number]:focus{border-color:var(--p)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:var(--card);border-radius:var(--r);overflow:hidden;border:1px solid var(--bd);box-shadow:var(--sh);cursor:pointer;display:flex;flex-direction:column;animation:popIn .4s both;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--p) 40%,var(--bd))}
.im{position:relative;aspect-ratio:1;background:linear-gradient(135deg,color-mix(in srgb,var(--p) 14%,var(--card)),var(--card));display:grid;place-items:center;font-size:40px;color:var(--p2);overflow:hidden}
.im>img{width:100%;height:100%;object-fit:cover;transition:transform .4s,filter .3s}
.im>img.loading{filter:blur(8px);opacity:.7}
.im>img.loaded{filter:blur(0);opacity:1;animation:imgBlur .3s}
.card:hover .im>img{transform:scale(1.06)}
.bds{position:absolute;top:8px;inset-inline-start:8px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;font-size:14px}
.bd{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;color:#fff;background:var(--ok);box-shadow:0 2px 8px rgba(0,0,0,.15)}
.bd.out{background:var(--er)}
.bd.ds{background:linear-gradient(135deg,#ef4444,#f59e0b)}
.bd.new{background:var(--er)}
.hrt{position:absolute;top:8px;inset-inline-end:8px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.95);color:#aaa;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.15);transition:.2s;font-size:15px}
.hrt:hover{transform:scale(1.1)}
.hrt.on{color:var(--p)}
.hrt.on i{animation:heartBeat .5s}
.hrt:active{transform:scale(1.2)}
.inf{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.inf h3{font-size:14px;font-weight:700;line-height:1.4;min-height:39px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pr b{color:var(--p);font-size:16px;font-weight:800}
.pr s{color:var(--mt);font-size:12px}
.inf .btn{margin-top:auto;width:100%}
.sk{background:linear-gradient(90deg,var(--card),var(--bd),var(--card));background-size:200% 100%;animation:sh 1.2s infinite;border-radius:var(--r);aspect-ratio:3/4}
.skl{background:linear-gradient(90deg,var(--card) 25%,var(--bd) 50%,var(--card) 75%);background-size:200% 100%;animation:sh 1.5s infinite;border-radius:12px}
.skl-txt{height:14px;margin-bottom:8px;border-radius:8px}
.skl-txt.w60{width:60%}
.skl-txt.w80{width:80%}
.skl-list{display:flex;gap:10px;padding:12px;background:var(--card);border-radius:14px;border:1px solid var(--bd);margin-bottom:10px}
.skl-av{width:42px;height:42px;border-radius:50%;flex:none}
.skl-info{flex:1;display:flex;flex-direction:column;gap:6px}
.empty{grid-column:1/-1;text-align:center;padding:48px 16px;color:var(--mt);background:var(--card);border-radius:var(--r);border:1px dashed var(--bd)}
.empty i{font-size:48px;color:var(--p2);margin-bottom:10px;display:block;animation:emptyFloat 3s ease-in-out infinite}
.empty .btn{margin-top:14px}
.empty h3{color:var(--tx);margin-bottom:6px;font-size:16px}
.bnav{position:fixed;inset-inline:0;bottom:0;z-index:60;display:flex;justify-content:center;padding:0 10px calc(10px + env(safe-area-inset-bottom));pointer-events:none}
.bni{pointer-events:auto;display:flex;width:100%;max-width:520px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding:6px;gap:2px}
.nb{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px;border-radius:18px;color:var(--mt);font-size:11px;font-weight:600;transition:.2s;position:relative}
.nb span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb i{font-size:18px;transition:transform .2s}
.nb:active{transform:scale(.95)}
.nb.on{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}
.nb.on i{transform:translateY(-2px)}
.nb .nbd{position:absolute;top:2px;inset-inline-end:calc(50% - 22px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--er);color:#fff;font:700 10px/16px Cairo;text-align:center}
#toasts{position:fixed;top:calc(12px + env(safe-area-inset-top));inset-inline:0;z-index:400;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:fadeUp .3s both;max-width:90vw;pointer-events:auto;display:flex;align-items:center;gap:8px}
.toast button{margin-inline-start:4px;opacity:.7;font-size:14px;padding:4px;color:inherit}
.toast button:hover{opacity:1}
.toast.ok{background:var(--ok);color:#fff}
.toast.err{background:var(--er);color:#fff}
.toast.warn{background:var(--ac);color:#fff}
.ov{position:fixed;inset:0;z-index:200;background:rgba(20,5,12,.55);backdrop-filter:blur(4px);opacity:0;transition:opacity .25s;display:flex;align-items:center;justify-content:center;padding:14px}
.ov.on{opacity:1}
.ovd{justify-content:flex-start;padding:0}
.dr{width:min(440px,100vw);height:100%;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);padding-top:env(safe-area-inset-top);box-shadow:-8px 0 40px rgba(0,0,0,.2)}
.on .dr{transform:none}
.md{width:min(560px,100%);max-height:92vh;overflow:auto;background:var(--card);border-radius:24px;padding:22px;transform:scale(.94);transition:.25s;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.md.w{width:min(820px,100%)}
.on .md{transform:none}
.md .mt{margin-bottom:14px;font-size:19px;font-weight:800}
.dh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--bd);font-weight:800;font-size:17px;flex-shrink:0}
.db{flex:1;overflow:auto;padding:14px 16px}
.df{padding:14px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--bd);background:var(--card);flex-shrink:0}
.x{position:absolute;top:12px;inset-inline-start:12px;width:36px;height:36px;border-radius:50%;background:var(--bg);display:grid;place-items:center;z-index:2;transition:.2s}
.x:hover{background:var(--er);color:#fff;transform:rotate(90deg)}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}
.fld>label{font-size:13px;font-weight:700;color:var(--mt)}
.fld input,.fld select,.fld textarea,.in{width:100%;padding:11px 14px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card);outline:0;transition:.2s}
.fld input:focus,.fld select:focus,.fld textarea:focus,.in:focus{border-color:var(--p);box-shadow:0 0 0 3px color-mix(in srgb,var(--p) 15%,transparent)}
.fld textarea{min-height:90px;resize:vertical}
.fld input[type=color]{padding:3px;height:44px;cursor:pointer}
.fld input:disabled{opacity:.6}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:8px;font-weight:600;padding:8px 0;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--p);cursor:pointer}
.ci{display:flex;gap:10px;padding:10px;background:var(--card);border-radius:14px;border:1px solid var(--bd);margin-bottom:10px;align-items:center;position:relative;transition:.2s}
.ci:hover{border-color:var(--p)}
.ci.removing{animation:removeCart .3s forwards}
.ci .ph{width:64px;height:64px;border-radius:12px;overflow:hidden;flex:none;background:var(--bg);display:grid;place-items:center;color:var(--p2)}
.ci .ph img{width:100%;height:100%;object-fit:cover}
.qty{display:inline-flex;align-items:center;gap:10px;background:var(--bg);border-radius:99px;padding:2px;margin-top:4px}
.qty button{width:28px;height:28px;border-radius:50%;background:var(--card);border:1px solid var(--bd);font-weight:800;transition:.2s}
.qty button:hover{background:var(--p);color:#fff;border-color:var(--p)}
.qty span{min-width:18px;text-align:center;font-weight:700;font-size:14px}
.cpn{display:flex;gap:8px;margin:12px 0}
.cpn .in{flex:1}
.ctag{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-radius:12px;background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok);font-weight:700;margin:12px 0;gap:8px}
.sum div{display:flex;justify-content:space-between;padding:3px 0;font-size:14px}
.sum .t{font-weight:800;font-size:18px;color:var(--p);border-top:1px dashed var(--bd);margin-top:6px;padding-top:8px}
.oc{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--sh);transition:.2s}
.oc:hover{border-color:color-mix(in srgb,var(--p) 40%,var(--bd))}
.oh,.of{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.oh b{font-family:ui-monospace,monospace;letter-spacing:.5px}
.ob{padding:8px 0;color:var(--mt);font-size:14px}
.ob p{margin:2px 0}
.ob i{color:var(--p2);width:16px}
.of{border-top:1px dashed var(--bd);padding-top:10px}
.of select{padding:8px 10px;border-radius:10px;border:1.5px solid var(--bd);background:var(--card);cursor:pointer;outline:0}
.of select:focus{border-color:var(--p)}
.tot{color:var(--p);font-size:17px}
.st{display:inline-flex;gap:6px;align-items:center;padding:3px 12px;border-radius:99px;font-size:12px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.timeline{display:flex;flex-direction:column;gap:0;margin:14px 0}
.tl-it{display:flex;gap:12px;position:relative;padding-bottom:22px}
.tl-it:last-child{padding-bottom:0}
.tl-it::before{content:'';position:absolute;inset-inline-start:13px;top:28px;bottom:0;width:2px;background:var(--bd)}
.tl-it:last-child::before{display:none}
.tl-it.done::before{background:var(--p)}
.tl-dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--bg);border:2px solid var(--bd);color:var(--mt);font-size:12px;position:relative;z-index:1;transition:.3s}
.tl-it.done .tl-dot{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-color:var(--p)}
.tl-it.current .tl-dot{background:var(--p);color:#fff;border-color:var(--p);animation:badgePulse 1.5s infinite}
.tl-body{flex:1;padding-top:3px}
.tl-body b{display:block;font-size:14px}
.tl-body small{color:var(--mt);font-size:11px}
.pn{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.pn h3{margin-bottom:12px;font-size:16px}
.pl{display:flex;flex-direction:column;gap:10px}
.pav{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;display:grid;place-items:center;font-size:30px;font-weight:800;margin:0 auto 14px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 8px;text-align:start;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mt);font-size:12px;font-weight:700}
tr:last-child td{border-bottom:0}
.pm{display:grid;gap:16px}
.pm .im{border-radius:18px}
.pi h2{font-size:20px;margin:4px 0 8px}
.pi .cat{color:var(--p);font-weight:700;font-size:13px;display:inline-block;padding:3px 10px;background:color-mix(in srgb,var(--p) 12%,transparent);border-radius:99px;margin-bottom:8px}
.pi .ds{color:var(--mt);white-space:pre-line;margin:10px 0;line-height:1.8}
.pr.big b{font-size:24px}
.pa{display:flex;gap:10px;margin-top:14px}
.pa .btn{flex:1}
.pa .ib{width:48px;height:48px;font-size:18px}
.pa .ib.on{color:var(--p);border-color:var(--p)}
.stars{display:inline-flex;gap:2px;color:#f59e0b;font-size:14px}
.stars i.far{color:var(--bd)}
.stars.interactive i{cursor:pointer;font-size:26px;transition:transform .15s}
.stars.interactive i:hover{transform:scale(1.15)}

function toast(m,t=''){
  const e=document.createElement('div');
  e.className='toast '+t;
  e.innerHTML=`<span style="flex:1">${esc(m)}</span><button aria-label="إغلاق" onclick="this.parentElement.remove()"><i class="fa-solid fa-xmark"></i></button>`;
  $('#toasts').appendChild(e);
  setTimeout(()=>e.remove(),3500)
}

function confirmBox({title,message,okText='تأكيد',cancelText='إلغاء',danger=false,icon='fa-question'}){
  return new Promise(resolve=>{
    const el=document.createElement('div');
    el.className='cf';
    el.innerHTML=`<div class="cf-b"><div class="cf-i ${danger?'dg':''}"><i class="fa-solid ${icon}"></i></div><h3>${esc(title)}</h3><p>${esc(message)}</p><div class="cf-btns"><button class="no">${esc(cancelText)}</button><button class="ok ${danger?'dg':''}">${esc(okText)}</button></div></div>`;
    document.body.appendChild(el);
    requestAnimationFrame(()=>el.classList.add('on'));
    const close=v=>{el.classList.remove('on');setTimeout(()=>el.remove(),250);resolve(v)};
    el.querySelector('.no').onclick=()=>close(false);
    el.querySelector('.ok').onclick=()=>close(true);
    el.onclick=e=>{if(e.target===el)close(false)};
  });
}

function copyText(text){
  return navigator.clipboard.writeText(text).then(()=>true).catch(()=>{
    try{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();return true}catch{return false}
  });
}

async function shareUrl(url,title){
  if(navigator.share){try{await navigator.share({title,url});return true}catch{return false}}
  return false;
}

function compress(file,max=800,q=.72,type='image/jpeg'){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        const k=Math.min(1,max/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k);
        const c=document.createElement('canvas');
        c.width=w;c.height=h;
        const x=c.getContext('2d');
        if(type==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,w,h)}
        x.drawImage(im,0,0,w,h);
        res(c.toDataURL(type,q))
      };
      im.onerror=rej;
      im.src=r.result
    };
    r.onerror=rej;
    r.readAsDataURL(file)
  });
}

function drawGrid(){
  const chips=$('#chips'),grid=$('#grid');if(!chips||!grid)return;
  if(!S.ld.products){grid.innerHTML=Array(8).fill('<div class="sk"></div>').join('');return}
  const all=arr(S.products).filter(p=>p.visible!==false),cats=[...new Set(all.map(p=>p.category).filter(Boolean))];
  if(S.cat!=='all'&&!cats.includes(S.cat))S.cat='all';
  chips.innerHTML=['all',...cats].map(c=>`<button class="chip ${S.cat===c?'on':''}" data-a="cat" data-c="${esc(c)}">${c==='all'?'الكل':esc(c)}</button>`).join('');
  const q=S.q.trim().toLowerCase();
  let l=all.filter(p=>(S.cat==='all'||p.category===S.cat)&&(!q||(p.name+' '+(p.description||'')+' '+(p.category||'')).toLowerCase().includes(q)));
  if(S.minPrice>0)l=l.filter(p=>fin(p)>=S.minPrice);
  if(S.maxPrice>0)l=l.filter(p=>fin(p)<=S.maxPrice);
  switch(S.sort){
    case 'price-asc':l.sort((a,b)=>fin(a)-fin(b));break;
    case 'price-desc':l.sort((a,b)=>fin(b)-fin(a));break;
    case 'discount':l.sort((a,b)=>(b.discount||0)-(a.discount||0));break;
    case 'name':l.sort((a,b)=>(a.name||'').localeCompare(b.name||'','ar'));break;
    default:l.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))
  }
  grid.innerHTML=l.length?l.map(card).join(''):EMPTY('لا توجد منتجات مطابقة','fa-face-frown-open','جرّب تغيير الفلاتر أو كلمة البحث');
}

    ${S.user&&!myReview?`<div class="rform"><div><label style="font-weight:700;font-size:13px;margin-bottom:6px;display:block">قيّم المنتج:</label><div class="stars interactive" id="rateInput">${[1,2,3,4,5].map(i=>`<i class="fa-regular fa-star" data-r="${i}"></i>`).join('')}</div></div><div class="fld"><textarea id="reviewText" placeholder="اكتب تجربتك مع المنتج..." maxlength="500"></textarea></div><button class="btn" data-a="submitReview" data-id="${id}"><i class="fa-solid fa-paper-plane"></i> إرسال التقييم</button></div>`:''}
    ${!S.user?`<p style="text-align:center;color:var(--mt);margin-top:12px">سجّل الدخول لتقييم المنتج</p>`:''}
  </div>`;
  if($('#ov_product'))setOv('product',h);
  else openOv('product',h,'mw');
}

function cartItems(){return Object.entries(cart).map(([id,q])=>{const p=S.products[id];return p?{...p,id,q:Math.max(1,Math.floor(Number(q)||1))}:null}).filter(Boolean)}
function totals(){const it=cartItems().filter(avail);const sub=it.reduce((a,p)=>a+fin(p)*Math.min(p.q,p.qty),0);const c=S.coupon;let d=0;if(c&&sub>=(c.min||0))d=c.type==='percent'?sub*c.value/100:Math.min(c.value,sub);d=Math.round(d*100)/100;return{it,sub:Math.round(sub*100)/100,d,total:Math.max(0,Math.round((sub-d)*100)/100)}}

checkout:async()=>{if(!S.user){toast('سجّل الدخول لإتمام الطلب','err');return H.auth({})}const t=totals();if(!t.it.length)return toast('السلة فارغة','err');const c=S.co,p=S.profile||{},name=clean(c.name??p.name,60),phone=clean(c.phone??p.phone,20),address=clean(c.address??p.address,300);if(!name||!/^[0-9+\s-]{8,20}$/.test(phone)||address.length<5)return toast('أكمل الاسم والهاتف والعنوان بشكل صحيح','err');const b=$('[data-a=checkout]');if(b)b.disabled=true;const o={uid:S.user.uid,userName:name,userEmail:S.user.email||'',phone,address,notes:clean(c.notes,200),items:t.it.map(i=>({id:i.id,name:clean(i.name,100),price:fin(i),qty:Math.min(i.q,num(i.qty))})),subtotal:t.sub,discount:t.d,total:t.total,coupon:S.coupon?S.coupon.code:null,status:'pending',createdAt:Date.now()};try{await set(push(ref(db,'orders')),o);await logActivity('fa-cart-shopping',`طلب جديد من ${name}`,shortId(o.createdAt)+' - '+money(o.total));if(S.coupon){const cr=ref(db,'coupons/'+S.coupon.id+'/uses');await runTransaction(cr,v=>(v||0)+1)}cart={};saveCart();S.co={};S.coupon=null;closeOv('cart');updateBadges();toast('تم إرسال طلبك بنجاح','ok');go('orders')}catch{toast('تعذر إرسال الطلب','err');if(b)b.disabled=false}},

forgot:async()=>{const email=clean(prompt('أدخل بريدك الإلكتروني:')||'',100);if(!email)return;try{await sendPasswordResetEmail(auth,email)}catch{}toast('إذا كان البريد مسجلاً سيصلك رابط الاستعادة','ok')},

pEdit:d=>{const p=d.id?S.products[d.id]:null,cats=[...new Set(arr(S.products).map(x=>x.category).filter(Boolean))],im=img(p?.image);S.up={};S.eid=d.id||'';openOv('pm',`<button class="x" data-a="close" data-id="pm" aria-label="إغلاق"><i class="fa-solid fa-xmark"></i></button><h2 style="margin:24px 0 12px">${p?'تعديل منتج':'إضافة منتج'}</h2><form data-f="product"><div class="fld"><label>الاسم</label><input name="name" required maxlength="100" value="${esc(p?.name||'')}"></div><div class="row"><div class="fld"><label>السعر</label><input name="price" type="number" min="0" step="any" required value="${p?.price??''}"></div><div class="fld"><label>الخصم %</label><input name="discount" type="number" min="0" max="100" value="${p?.discount??0}"></div></div><div class="row"><div class="fld"><label>الكمية</label><input name="qty" type="number" min="0" required value="${p?.qty??''}"></div><div class="fld"><label>التصنيف</label><input name="category" list="catl" maxlength="40" value="${esc(p?.category||'')}"><datalist id="catl">${cats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div></div><div class="fld"><label>الوصف</label><textarea name="description" maxlength="3000">${esc(p?.description||'')}</textarea></div><div class="fld"><label>الصورة</label><div class="upl"><div class="im upv" id="pv_pimg">${im?`<img src="${im}" alt="">`:'<i class="fa-solid fa-image"></i>'}</div><label class="btn sm gh"><i class="fa-solid fa-images"></i> رفع<input type="file" accept="image/png,image/jpeg,image/webp" hidden data-up="pimg"></label><button type="button" class="btn sm gh" data-a="upClr">إزالة</button></div></div><div class="row"><label class="chk"><input type="checkbox" name="stock" ${p?.stock===false?'':'checked'}> متاح للبيع</label><label class="chk"><input type="checkbox" name="visible" ${p?.visible===false?'':'checked'}> ظاهر</label></div><button class="btn" type="submit" style="width:100%;margin-top:12px">حفظ المنتج</button></form>`)},

applyCoupon:async()=>{const code=clean($('#couponIn')?.value||'',30);if(!code)return toast('أدخل كود الخصم','err');const t=totals();if(t.sub<=0)return toast('السلة فارغة','err');const found=arr(S.coupons).find(c=>String(c.code||'').toUpperCase()===code.toUpperCase());if(!found)return toast('كود غير صحيح','err');if(!found.active)return toast('هذا الكوبون غير نشط','err');if(found.maxUses&&(found.uses||0)>=found.maxUses)return toast('انتهت صلاحية الكوبون','err');if(t.sub<(found.min||0))return toast('الحد الأدنى للطلب '+money(found.min),'err');S.coupon=found;fillCart();toast('تم تطبيق الخصم','ok')},

cEdit:d=>{const c=d.id?S.coupons[d.id]:null;S.ceid=d.id||'';openOv('cm',`<button class="x" data-a="close" data-id="cm" aria-label="إغلاق"><i class="fa-solid fa-xmark"></i></button><h2 style="margin:24px 0 12px">${c?'تعديل كوبون':'إضافة كوبون'}</h2><form data-f="coupon"><div class="fld"><label>الكود</label><input name="code" required maxlength="20" value="${esc(c?.code||'')}"></div><div class="row"><div class="fld"><label>النوع</label><select name="type"><option value="percent" ${c?.type==='percent'?'selected':''}>نسبة %</option><option value="fixed" ${c?.type==='fixed'?'selected':''}>مبلغ ثابت</option></select></div><div class="fld"><label>القيمة</label><input name="value" type="number" min="1" step="any" required value="${c?.value??''}"></div></div><div class="row"><div class="fld"><label>الحد الأدنى</label><input name="min" type="number" min="0" step="any" value="${c?.min??0}"></div><div class="fld"><label>الحد الأقصى للاستخدام</label><input name="maxUses" type="number" min="0" value="${c?.maxUses??0}"></div></div><label class="chk"><input type="checkbox" name="active" ${c?.active!==false?'checked':''}> نشط</label><button class="btn" type="submit" style="width:100%;margin-top:12px">حفظ</button></form>`)},

shareProduct:async d=>{const p=S.products[d.id];if(!p)return;const url=location.origin+location.pathname+'?product='+d.id;const ok=await shareUrl(url,p.name);if(!ok)await copyText(url).then(()=>toast('تم نسخ الرابط','ok'))},
qrProduct:d=>{const p=S.products[d.id];if(!p)return;const url=location.origin+location.pathname+'?product='+d.id;const size=280;const c=document.createElement('canvas');c.width=size;c.height=size;const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,size,size);const qr=new QRCode(0,'M');qr.addData(url);qr.make();const n=qr.getModuleCount();const cell=Math.floor(size/(n+2));const off=Math.floor((size-cell*n)/2);ctx.fillStyle='#000';for(let r=0;r<n;r++)for(let cc=0;cc<n;cc++)if(qr.isDark(r,cc))ctx.fillRect(off+cc*cell,off+r*cell,cell,cell);openOv('qr',`<div class="dh"><span>رمز QR للمنتج</span><button class="ib" data-a="close" data-id="qr"><i class="fa-solid fa-xmark"></i></button></div><div class="db"><div class="qr-wrap">${c.outerHTML}<p class="qr-url">${esc(url)}</p><p style="color:var(--mt);font-size:13px">${esc(p.name)}</p></div></div>`)},
prApply:()=>{S.minPrice=num($('#prMin')?.value,0);S.maxPrice=num($('#prMax')?.value,0);drawGrid()},
prClear:()=>{S.minPrice=0;S.maxPrice=0;const a=$('#prMin'),b=$('#prMax');if(a)a.value='';if(b)b.value='';drawGrid()},
submitReview:async d=>{if(!S.user)return;const rating=S.rating;if(!rating)return toast('اختر تقييماً أولاً','err');const text=clean($('#reviewText')?.value,500);const pid=d.id;try{await set(push(ref(db,'reviews')),{pid,uid:S.user.uid,uname:clean(S.profile?.name||'عميل',60),rating,text,createdAt:Date.now()});toast('تم إرسال تقييمك','ok');productModal(pid)}catch{toast('تعذر إرسال التقييم','err')}}
};

const F={
login:async f=>{if(!canTry())return toast('محاولات كثيرة، انتظر 15 دقيقة','err');const fd=new FormData(f),b=$('[type=submit]',f);b.disabled=true;try{await signInWithEmailAndPassword(auth,clean(fd.get('email'),100),String(fd.get('password')));ls.set('yz_att',{n:0,t:0})}catch(e){failTry();toast(authErr(e.code),'err')}b.disabled=false},
register:async f=>{const fd=new FormData(f),b=$('[type=submit]',f),email=clean(fd.get('email'),100).toLowerCase(),pw=String(fd.get('password'));if(email===ADMIN_EMAIL)return toast('هذا البريد غير متاح','err');if(pw.length<8)return toast('كلمة المرور 8 أحرف على الأقل','err');b.disabled=true;S.pending={name:clean(fd.get('name'),60),phone:clean(fd.get('phone'),20)};try{await createUserWithEmailAndPassword(auth,email,pw)}catch(e){S.pending=null;toast(authErr(e.code),'err')}b.disabled=false},
admin:async f=>{if(!canTry())return toast('محاولات كثيرة، انتظر 15 دقيقة','err');const fd=new FormData(f),b=$('[type=submit]',f);if(clean(fd.get('username'),30)!==ADMIN_USER){failTry();return toast('بيانات الأدمن غير صحيحة','err')}b.disabled=true;try{await signInWithEmailAndPassword(auth,ADMIN_EMAIL,String(fd.get('password')));ls.set('yz_att',{n:0,t:0})}catch(e){failTry();toast('بيانات الأدمن غير صحيحة','err')}b.disabled=false},
contact:async f=>{const fd=new FormData(f),b=$('[type=submit]',f),last=ls.get('yz_msg',0);if(Date.now()-last<3e4)return toast('انتظر قليلاً قبل إرسال رسالة أخرى','err');b.disabled=true;try{await set(push(ref(db,'messages')),{name:clean(fd.get('name'),60),email:clean(fd.get('email'),100),phone:clean(fd.get('phone'),20),message:clean(fd.get('message'),1000),uid:S.user?.uid||'',createdAt:Date.now()});ls.set('yz_msg',Date.now());f.reset();toast('تم إرسال رسالتك','ok')}catch{toast('تعذر الإرسال','err')}b.disabled=false},
profile:async f=>{const fd=new FormData(f),d={name:clean(fd.get('name'),60),phone:clean(fd.get('phone'),20),address:clean(fd.get('address'),300)};if(!d.name)return toast('الاسم مطلوب','err');try{await update(ref(db,'users/'+S.user.uid),d);S.profile={...S.profile,...d};drawHeader();toast('تم الحفظ','ok')}catch{toast('تعذر الحفظ','err')}},
product:async f=>{const fd=new FormData(f),name=clean(fd.get('name'),100),price=num(fd.get('price')),qty=Math.floor(num(fd.get('qty')));if(!name)return toast('تحقق من البيانات','err');const old=S.eid?S.products[S.eid]:null,image=S.up.pimg!==undefined?S.up.pimg:(old?.image||'');const data={name,price,discount:num(fd.get('discount'),0,100),qty,category:clean(fd.get('category'),40),description:clean(fd.get('description'),3000),image:img(image)?image:'',stock:fd.has('stock'),visible:fd.has('visible'),updatedAt:Date.now(),createdAt:old?.createdAt||Date.now()};await set(S.eid?ref(db,'products/'+S.eid):push(ref(db,'products')),data);closeOv('pm');toast('تم حفظ المنتج','ok')},
coupon:async f=>{const fd=new FormData(f),code=clean(fd.get('code'),20).toUpperCase();if(!code)return toast('أدخل الكود','err');const data={code,type:fd.get('type'),value:num(fd.get('value')),min:num(fd.get('min')),maxUses:Math.floor(num(fd.get('maxUses'))),active:fd.has('active'),createdAt:Date.now()};if(S.ceid)await update(ref(db,'coupons/'+S.ceid),data);else await set(push(ref(db,'coupons')),data);closeOv('cm');toast('تم حفظ الكوبون','ok')},
notif:async f=>{const fd=new FormData(f);const data={title:clean(fd.get('title'),60),body:clean(fd.get('body'),200),type:fd.get('type'),visible:true,createdAt:Date.now()};await set(push(ref(db,'notifications')),data);closeOv('nm');toast('تم إرسال الإشعار','ok')},
settings:async f=>{const fd=new FormData(f),ok=c=>/^#[0-9a-f]{6}$/i.test(c),d={storeName:clean(fd.get('storeName'),40),heroTitle:clean(fd.get('heroTitle'),100),heroSubtitle:clean(fd.get('heroSubtitle'),150),primary:ok(fd.get('primary'))?fd.get('primary'):DEF_SET.primary,primary2:ok(fd.get('primary2'))?fd.get('primary2'):DEF_SET.primary2,phone:clean(fd.get('phone'),20),currency:clean(fd.get('currency'),10)||'ج.م'};if(S.up.logo!==undefined)d.logo=S.up.logo;await update(ref(db,'settings'),d);S.up={};toast('تم حفظ الإعدادات','ok')}
};

async function setStatus(id,st){const o=S.orders[id];if(!o||o.status===st||!ST[st])return;const was=['confirmed','shipped','delivered'].includes(o.status),now=['confirmed','shipped','delivered'].includes(st);await update(ref(db,'orders/'+id),{status:st});const adj=dir=>Promise.all(Object.values(o.items||{}).map(i=>runTransaction(ref(db,'products/'+i.id+'/qty'),v=>v==null?v:Math.max(0,Number(v)+dir*Number(i.qty))).catch(()=>{})));if(!was&&now)await adj(-1);if(was&&!now)await adj(1);await logActivity('fa-truck-fast',`تحديث حالة الطلب ${shortId(id)}`,ST[st][0]);toast('تم تحديث الحالة','ok')}

async function logActivity(icon,text,details){try{await push(ref(db,'activity'),{icon,text,details,createdAt:Date.now()})}catch{}}

async function setupMessaging(force){
  if(!('Notification'in window)){if(force)toast('الإشعارات غير مدعومة في هذا المتصفح','err');return}
  try{
    if(!await isSupported()){if(force)toast('الإشعارات غير مدعومة','err');return}
    if(!messaging)messaging=getMessaging(app);
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){if(force)toast('تم رفض الإذن','err');return}
    const reg=await navigator.serviceWorker.register('firebase-messaging-sw.js');
    if(VAPID_KEY){try{const token=await getToken(messaging,{vapidKey:VAPID_KEY,serviceWorkerRegistration:reg});if(token&&S.user){await update(ref(db,'users/'+S.user.uid),{fcmToken:token})}}catch{}}
    if(!msgListenerSet){msgListenerSet=true;onMessage(messaging,payload=>{const n=payload.notification||{};try{new Notification(n.title||'إشعار',{body:n.body||'',icon:n.icon||S.settings.logo||''})}catch{}toast(n.title||'إشعار جديد','ok')})}
    if(force)toast('تم تفعيل الإشعارات','ok');
  }catch(e){if(force)toast('تعذر تفعيل الإشعارات','err')}
}

const run=r=>{if(r&&r.catch)r.catch(e=>{console.error(e);toast('حدث خطأ، حاول مرة أخرى','err')})};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;if(t.classList.contains('hrt')||t.closest('.hrt')){e.stopPropagation()}const f=H[t.dataset.a];if(f){if(t.dataset.a==='open'&&e.target.closest('[data-a=wish],[data-a=add]'))return;run(f(t.dataset,t,e))}});
document.addEventListener('submit',e=>{const n=e.target.dataset.f;if(n&&F[n]){e.preventDefault();run(F[n](e.target))}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.co!==undefined)S.co[t.dataset.co]=t.value;if(t.id==='qm'){S.q=t.value.slice(0,60);drawGrid()}if(t.id==='hq'){S.q=t.value.slice(0,60)}});
document.addEventListener('change',async e=>{const t=e.target;if(t.dataset.os)return run(setStatus(t.dataset.os,t.value));if(t.dataset.up&&t.files&&t.files[0]){const k=t.dataset.up;try{S.up[k]=await compress(t.files[0],k==='logo'?256:760);const pv=$('#pv_'+k);if(pv)pv.innerHTML=`<img src="${S.up[k]}" alt="">`}catch{toast('صورة غير صالحة','err')}t.value='';return}if(t.dataset.sort){S.sort=t.value;drawGrid()}});
document.addEventListener('click',e=>{const r=e.target.closest('#rateInput i');if(r){S.rating=Number(r.dataset.r);$$('#rateInput i').forEach((i,idx)=>{i.className='fa-'+(idx<S.rating?'solid':'regular')+' fa-star'})}});
addEventListener('online',()=>toast('تمت استعادة الاتصال','ok'));
addEventListener('offline',()=>toast('لا يوجد اتصال بالإنترنت','err'));
addEventListener('scroll',()=>{const b=$('#btop');if(b)b.classList.toggle('on',scrollY>400)});
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;$('#instBtn').classList.remove('hide')});

onAuthStateChanged(auth,async u=>{userSubs.splice(0).forEach(f=>f());S.orders={};S.users={};S.messages={};S.coupons={};S.reviews={};S.activity={};delete S.ld.orders;if(!u){S.user=null;S.profile=null;S.isAdmin=false;S.adminMode=false;closeAllOv();render();return}S.user=u;S.isAdmin=u.email===ADMIN_EMAIL;if(!await ensureProfile(u))return;subscribeUser();S.adminMode=S.isAdmin;closeAllOv();render();bump();if(Notification.permission==='granted')setupMessaging(false)});

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>منصة سيجما التعليمية</title>
<meta name="application-version" content="7.0.0">
<meta name="theme-color" content="#5b5bd6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" id="mf">
<link rel="apple-touch-icon" id="ai">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f1115;--ink-2:#3a3f4a;--ink-3:#8a92a6;--line:#e9ecf2;--paper:#fbfcfe;--paper-2:#f3f5fa;--card:#ffffff;--brand:#5b5bd6;--brand-2:#7c6cf6;--brand-soft:#eef0ff;--mint:#10b981;--mint-soft:#e6f9f0;--amber:#f59e0b;--amber-soft:#fff5e1;--rose:#ef4444;--rose-soft:#ffe9e9;--sky:#0ea5e9;--sky-soft:#e4f6fe;--r-sm:14px;--r-md:20px;--r-lg:28px;--r-xl:36px;--sh-1:0 1px 2px rgba(15,17,21,.04),0 4px 14px -6px rgba(15,17,21,.06);--sh-2:0 10px 30px -14px rgba(15,17,21,.18);--sh-3:0 24px 60px -24px rgba(91,91,214,.35);--grad-brand:linear-gradient(135deg,#5b5bd6 0%,#7c6cf6 60%,#a78bfa 100%);--grad-warm:linear-gradient(135deg,#f59e0b,#ef4444);--grad-green:linear-gradient(135deg,#10b981,#059669);--ease:cubic-bezier(.22,1,.36,1)}
html.dark{--ink:#f1f3f8;--ink-2:#c7ccd8;--ink-3:#7b8398;--line:#232838;--paper:#0a0c12;--paper-2:#10131c;--card:#141824;--brand-soft:#1e1f3f;--mint-soft:#0d2a22;--amber-soft:#2b2110;--rose-soft:#2b1414;--sky-soft:#0b2431;--sh-1:0 1px 2px rgba(0,0,0,.4),0 4px 14px -6px rgba(0,0,0,.5);--sh-2:0 10px 30px -14px rgba(0,0,0,.6);--sh-3:0 24px 60px -24px rgba(91,91,214,.45)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:Cairo,system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:radial-gradient(900px 500px at 110% -10%,rgba(124,108,246,.10),transparent 60%),radial-gradient(700px 500px at -10% 110%,rgba(16,185,129,.07),transparent 60%),var(--paper);color:var(--ink);min-height:100vh;min-height:100dvh;padding-bottom:calc(110px + env(safe-area-inset-bottom));overflow-x:hidden;-webkit-user-select:none;user-select:none;transition:background .3s,color .3s}
html.dark body{background:radial-gradient(900px 500px at 110% -10%,rgba(124,108,246,.14),transparent 60%),radial-gradient(700px 500px at -10% 110%,rgba(16,185,129,.08),transparent 60%),var(--paper)}
input,select,textarea{-webkit-user-select:text;user-select:text}
h1,h2,h3,h4{font-weight:800;line-height:1.3;letter-spacing:-.2px}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;font-weight:700}
img{display:block}
.shell{max-width:1180px;margin:0 auto;padding:0 20px}
.page{animation:pageIn .35s var(--ease)}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.topbar{position:sticky;top:0;z-index:100;backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);background:color-mix(in srgb,var(--paper) 80%,transparent);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:14px 20px}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand-mark{width:38px;height:38px;border-radius:12px;background:var(--grad-brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;box-shadow:var(--sh-3)}
.brand-name{font-size:17px;font-weight:900}
.brand-name small{display:block;font-size:10px;font-weight:700;color:var(--ink-3);letter-spacing:.5px}
.search{flex:1;display:flex;align-items:center;gap:10px;background:var(--paper-2);border:1px solid var(--line);border-radius:999px;padding:9px 16px;max-width:460px;transition:.2s var(--ease)}
.search:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.search svg{width:17px;height:17px;stroke:var(--ink-3);flex-shrink:0}
.search input{flex:1;border:0;background:none;outline:none;font-family:inherit;font-size:14px;color:var(--ink);font-weight:600}
.search input::placeholder{color:var(--ink-3);font-weight:600}
.top-actions{display:flex;align-items:center;gap:8px;margin-right:auto}
.icon-round{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--paper-2);border:1px solid var(--line);color:var(--ink-2);position:relative;transition:.2s var(--ease)}
.icon-round:hover{background:var(--brand-soft);color:var(--brand);border-color:transparent}
.icon-round svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-round .dot{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--rose);border:2px solid var(--paper)}
.avatar-pill{display:flex;align-items:center;gap:8px;background:var(--paper-2);border:1px solid var(--line);border-radius:999px;padding:4px 4px 4px 12px;transition:.2s var(--ease)}
.avatar-pill:hover{border-color:var(--brand);background:var(--brand-soft)}
.avatar-pill img{width:32px;height:32px;border-radius:50%;object-fit:cover}
.avatar-pill span{font-size:13px;font-weight:800;color:var(--ink-2)}
@media(max-width:720px){.search{display:none}.brand-name small{display:none}}
.hero-strip{margin:22px 0 8px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.hero-strip h1{font-size:26px;font-weight:900}
.hero-strip h1 span{color:var(--brand)}
.hero-strip p{font-size:13px;color:var(--ink-3);font-weight:600;margin-top:2px}
.grade-chip{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);padding:9px 16px;border-radius:999px;font-size:13px;font-weight:800;color:var(--ink-2);box-shadow:var(--sh-1);cursor:pointer}
.grade-chip b{color:var(--brand)}
.grade-chip .dot{width:8px;height:8px;border-radius:50%;background:var(--mint)}
.bento{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:20px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;box-shadow:var(--sh-1);position:relative;overflow:hidden;transition:.3s var(--ease)}
.tile:hover{transform:translateY(-3px);box-shadow:var(--sh-2)}
.tile.span-2{grid-column:span 2}.tile.span-3{grid-column:span 3}.tile.span-4{grid-column:span 4}
.tile.tall{grid-row:span 2}
.tile.grad{color:#fff;border:0;background:var(--grad-brand);box-shadow:var(--sh-3)}
.tile.grad::before{content:"";position:absolute;top:-70px;right:-40px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.25),transparent 70%)}
.tile.grad::after{content:"";position:absolute;bottom:-90px;left:-40px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.15),transparent 70%)}
.tile.grad *{position:relative;z-index:1}
.tile.mint{background:var(--mint-soft);border-color:transparent}
.tile.amber{background:var(--amber-soft);border-color:transparent}
.tile.rose{background:var(--rose-soft);border-color:transparent}
.tile.sky{background:var(--sky-soft);border-color:transparent}
.tile.brand-soft{background:var(--brand-soft);border-color:transparent}
.tile .tile-eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.5px;color:var(--ink-3);text-transform:uppercase;margin-bottom:10px}
.tile.grad .tile-eyebrow{color:rgba(255,255,255,.8)}
.tile h3{font-size:18px;margin-bottom:6px}
.tile p{font-size:13px;color:var(--ink-2);line-height:1.7;font-weight:600}
.tile.grad p{color:rgba(255,255,255,.9)}
.stat-row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:14px}
.stat-num{font-size:32px;font-weight:900;line-height:1;letter-spacing:-1px}
.stat-num small{font-size:14px;font-weight:800;color:var(--ink-3);margin-right:2px}
.stat-label{font-size:12px;font-weight:800;color:var(--ink-3)}
.tile.grad .stat-num small,.tile.grad .stat-label{color:rgba(255,255,255,.8)}
.tile-icon{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--paper-2);margin-bottom:14px}
.tile.grad .tile-icon{background:rgba(255,255,255,.2)}
.tile.mint .tile-icon{background:rgba(16,185,129,.15)}
.tile.amber .tile-icon{background:rgba(245,158,11,.15)}
.tile.rose .tile-icon{background:rgba(239,68,68,.15)}
.tile.sky .tile-icon{background:rgba(14,165,233,.15)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:999px;font-size:13px;font-weight:800;transition:.2s var(--ease)}
.btn-primary{background:var(--grad-brand);color:#fff;box-shadow:var(--sh-3)}
.btn-primary:hover{transform:translateY(-1px);filter:brightness(1.05)}
.btn-light{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.35)}
.btn-light:hover{background:rgba(255,255,255,.3)}
.btn-ghost{background:var(--paper-2);border:1px solid var(--line);color:var(--ink-2)}
.btn-ghost:hover{background:var(--brand-soft);color:var(--brand);border-color:transparent}
.btn-block{width:100%;justify-content:center}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.bar{height:8px;border-radius:999px;background:color-mix(in srgb,var(--ink-3) 20%,transparent);overflow:hidden;margin-top:12px}
.bar span{display:block;height:100%;border-radius:999px;background:var(--grad-brand);transition:width .5s var(--ease)}
.tile.grad .bar{background:rgba(255,255,255,.25)}
.tile.grad .bar span{background:#fff}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:30px 0 14px}
.section-head h2{font-size:20px;font-weight:900}
.section-head a{font-size:13px;font-weight:800;color:var(--brand);cursor:pointer}
.section-head a:hover{text-decoration:underline}
.lesson-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.lesson-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;box-shadow:var(--sh-1);cursor:pointer;transition:.3s var(--ease)}
.lesson-card:hover{transform:translateY(-4px);box-shadow:var(--sh-2);border-color:transparent}
.lesson-cover{height:120px;display:flex;align-items:center;justify-content:center;font-size:44px;position:relative;background:var(--paper-2)}
.lesson-cover .play{position:absolute;bottom:10px;right:10px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center}
.lesson-cover .play svg{width:16px;height:16px;fill:var(--brand);margin-right:2px}
.lesson-body{padding:14px 16px}
.lesson-body b{display:block;font-size:14px;font-weight:800;margin-bottom:4px}
.lesson-body small{font-size:12px;color:var(--ink-3);font-weight:700}
.lesson-meta{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:11px;font-weight:800;color:var(--ink-3)}
.lesson-meta .tag{padding:3px 9px;border-radius:999px;background:var(--brand-soft);color:var(--brand)}
.game-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.game-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:20px 16px;text-align:center;cursor:pointer;box-shadow:var(--sh-1);transition:.3s var(--ease)}
.game-card:hover{transform:translateY(-4px);box-shadow:var(--sh-2);border-color:transparent}
.game-card .gicon{font-size:40px;margin-bottom:10px}
.game-card b{display:block;font-size:14px;font-weight:800;margin-bottom:4px}
.game-card small{font-size:11px;color:var(--ink-3);font-weight:700;line-height:1.6;display:block}
.game-card.disabled{opacity:.45;cursor:not-allowed}
.game-card.disabled:hover{transform:none;box-shadow:var(--sh-1)}
.exam-list{display:flex;flex-direction:column;gap:12px}
.exam-item{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:16px 18px;display:flex;align-items:center;gap:14px;box-shadow:var(--sh-1);cursor:pointer;transition:.2s var(--ease)}
.exam-item:hover{border-color:var(--brand);transform:translateX(-3px)}
.exam-item .eicon{width:48px;height:48px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--brand-soft)}
.exam-item .einfo{flex:1;min-width:0}
.exam-item .einfo b{display:block;font-size:14px;font-weight:800}
.exam-item .einfo small{font-size:12px;color:var(--ink-3);font-weight:700;margin-top:2px;display:block}
.exam-item .ebadge{padding:5px 12px;border-radius:999px;font-size:11px;font-weight:800;background:var(--mint-soft);color:var(--mint);white-space:nowrap}
.exam-item .ebadge.soon{background:var(--amber-soft);color:var(--amber)}
.exam-item .ebadge.done{background:var(--paper-2);color:var(--ink-3)}
.profile-hero{background:var(--grad-brand);border-radius:var(--r-xl);padding:32px 28px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--sh-3);display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.profile-hero::before{content:"";position:absolute;top:-60px;left:-40px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%)}
.profile-hero::after{content:"";position:absolute;bottom:-90px;right:-40px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.15),transparent 70%)}
.profile-hero>*{position:relative;z-index:1}
.profile-avatar{width:96px;height:96px;border-radius:28px;object-fit:cover;border:4px solid rgba(255,255,255,.4);background:#fff;box-shadow:0 12px 30px rgba(0,0,0,.2);flex-shrink:0}
.profile-info{flex:1;min-width:200px}
.profile-info h2{font-size:24px;margin-bottom:4px}
.profile-info p{font-size:13px;color:rgba(255,255,255,.85);font-weight:700}
.profile-info .pill{display:inline-block;margin-top:10px;padding:5px 14px;border-radius:999px;background:rgba(255,255,255,.2);font-size:12px;font-weight:800;border:1px solid rgba(255,255,255,.3)}
.profile-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}
.pstat{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;text-align:center;box-shadow:var(--sh-1)}
.pstat b{display:block;font-size:24px;font-weight:900;color:var(--brand)}
.pstat small{font-size:12px;font-weight:800;color:var(--ink-3)}
.menu-list{display:flex;flex-direction:column;gap:10px}
.menu-item{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:16px 18px;display:flex;align-items:center;gap:14px;box-shadow:var(--sh-1);cursor:pointer;transition:.2s var(--ease)}
.menu-item:hover{border-color:var(--brand);background:var(--brand-soft)}
.menu-item .mico{width:40px;height:40px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--paper-2)}
.menu-item .mtext{flex:1}
.menu-item .mtext b{display:block;font-size:14px;font-weight:800}
.menu-item .mtext small{font-size:11px;color:var(--ink-3);font-weight:700}
.menu-item .arrow{color:var(--ink-3);font-size:16px}
.dock{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:100;display:flex;align-items:center;gap:4px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border:1px solid var(--line);padding:6px;border-radius:999px;box-shadow:0 20px 50px -18px rgba(15,17,21,.35),var(--sh-1)}
html.dark .dock{box-shadow:0 20px 50px -18px rgba(0,0,0,.7),var(--sh-1)}
.dock button{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;color:var(--ink-3);font-size:13px;font-weight:800;transition:.25s var(--ease);white-space:nowrap}
.dock button svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dock button:hover{color:var(--ink-2);background:var(--paper-2)}
.dock button.on{background:var(--grad-brand);color:#fff;box-shadow:var(--sh-3)}
.dock button span{display:none}
.dock button.on span{display:inline}
@media(max-width:720px){.dock{left:14px;right:14px;transform:none;width:auto;justify-content:space-between;bottom:calc(14px + env(safe-area-inset-bottom))}.dock button{padding:12px;flex-direction:column;gap:3px;font-size:10px;flex:1}.dock button span{display:inline!important;font-size:10px}}
.sheet{position:fixed;inset:0;z-index:200;display:none;align-items:flex-end;justify-content:center;background:rgba(10,12,18,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sheet.show{display:flex;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet-card{width:100%;max-width:560px;max-height:85vh;overflow:hidden;background:var(--card);border-radius:var(--r-xl) var(--r-xl) 0 0;display:flex;flex-direction:column;animation:sheetUp .32s var(--ease);box-shadow:0 -20px 60px -20px rgba(0,0,0,.35)}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
.sheet-head{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.sheet-head h3{font-size:16px}
.sheet-body{padding:16px 22px 26px;overflow-y:auto}
#toast{position:fixed;bottom:calc(100px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:12px 22px;border-radius:999px;font-size:13px;font-weight:800;z-index:500;opacity:0;pointer-events:none;transition:.3s var(--ease);box-shadow:var(--sh-2);max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.gate{position:fixed;inset:0;z-index:10000;background:rgba(7,11,20,.92);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:20px}
.gate-card{width:min(440px,100%);background:var(--card);border:1px solid var(--line);border-radius:var(--r-xl);padding:30px 24px;box-shadow:var(--sh-2);text-align:center}
.gate-card h2{color:var(--brand);font-size:22px;margin-bottom:10px}
.gate-card p{color:var(--ink-2);font-size:14px;line-height:1.8;margin-bottom:20px;font-weight:600}
.gate-card select{font-size:16px;padding:13px;border-radius:14px;border:2px solid var(--line);width:100%;margin-bottom:16px;font-family:inherit;background:var(--card);color:var(--ink)}
.gate-card select:focus{border-color:var(--brand);outline:none}
.gate-card button{width:100%;padding:14px;font-size:16px;border-radius:14px}
.ban-screen{position:fixed;inset:0;z-index:1000;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;overflow-y:auto}
.ban-box{max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-xl);padding:32px 24px;box-shadow:var(--sh-2)}
.ban-box h1{font-size:28px;color:var(--rose);margin-bottom:14px;font-weight:900}
.ban-box p{color:var(--ink-2);margin-bottom:24px;line-height:1.7;font-weight:600}
.platform-message{position:fixed;top:0;left:0;right:0;z-index:5000;background:linear-gradient(135deg,#7c3aed,#5b5bd6);color:#fff;padding:18px 50px 18px 20px;box-shadow:0 6px 30px rgba(124,58,237,.4);display:flex;align-items:center;gap:14px;animation:slideDown .4s ease;border-bottom-left-radius:20px;border-bottom-right-radius:20px}
@keyframes slideDown{from{transform:translateY(-100%);opacity:0}to{transform:none;opacity:1}}
.platform-message .pm-icon{font-size:32px}
.platform-message .pm-content b{display:block;font-size:14px;margin-bottom:4px;opacity:.9}
.platform-message .pm-content p{font-size:15px;line-height:1.6;white-space:pre-wrap;font-weight:600}
.platform-message .pm-close{position:absolute;top:10px;left:10px;background:rgba(255,255,255,.2);border:0;color:#fff;width:32px;height:32px;border-radius:50%;font-size:20px;line-height:1}
.news-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;margin-bottom:14px;box-shadow:var(--sh-1);display:flex;flex-direction:column;gap:10px}
.news-card .news-header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.news-text{font-size:14px;line-height:1.7;color:var(--ink-2);white-space:pre-wrap;font-weight:600}

window.startGame=function(k){if(!isLabOn(k)){toast('هذه اللعبة معطلة حاليًا');return}const v=document.getElementById('view');if(k==='rush'){rushScore=0;rushIdx=0;rushPool=shuffle(REACTIONS_RUSH).slice(0,5);renderRush(v)}else if(k==='builder'){builderState={target:MOLECULES[Math.floor(Math.random()*MOLECULES.length)],placed:[]};renderBuilder(v)}else if(k==='breaker'){breakerState={target:COMPOUNDS[Math.floor(Math.random()*COMPOUNDS.length)],picked:[]};renderBreaker(v)}else if(k==='scale'){scaleState={eq:SCALE_EQ[Math.floor(Math.random()*SCALE_EQ.length)],inputs:[1,1,1]};renderScale(v)}else if(k==='react'){reactState={pool:shuffle(REACT_PAIRS).slice(0,5),idx:0,score:0};renderReact(v)}else if(k==='race'){raceState={pool:shuffle(RACE_QUESTIONS),idx:0,you:0,bot:0,answered:false};renderRace(v)}else if(k==='crossword'){crosswordState={idx:0,score:0};renderCrossword(v)}else if(k==='wheel'){wheelState={q:WHEEL_QUESTIONS[Math.floor(Math.random()*WHEEL_QUESTIONS.length)],spinning:false};renderWheel(v)}else if(k==='guess'){guessState={item:GUESS_IMAGES[Math.floor(Math.random()*GUESS_IMAGES.length)],revealed:0,attempts:[]};renderGuess(v)}else if(k==='sniper'){sniperState={q:SNIPER_QUESTIONS[Math.floor(Math.random()*SNIPER_QUESTIONS.length)],pos:0,dir:1,running:true};renderSniper(v)}else if(k==='balance'){balanceState={eq:BALANCE_EQUATIONS[Math.floor(Math.random()*BALANCE_EQUATIONS.length)],inputs:[],time:60};renderBalance(v)}else{go('games')}};

function renderRush(v){if(rushIdx>=rushPool.length){clearInterval(rushTimer);v.innerHTML=`<div class="page"><div class="game-done" style="text-align:center"><div style="font-size:56px">🏆</div><div style="font-size:28px;font-weight:900;color:var(--brand);margin:10px 0">${rushScore}/${rushPool.length}</div><p style="color:var(--ink-3);font-weight:700">نتيجتك</p><div style="margin-top:20px;display:flex;gap:10px;justify-content:center"><button class="btn btn-primary" onclick="startGame('rush')">إعادة</button><button class="btn btn-ghost" onclick="go('games')">رجوع</button></div></div></div>`;addPoints(rushScore*10);return}rushQ=rushPool[rushIdx];let t=5;v.innerHTML=`<div class="page"><button class="btn btn-ghost" onclick="clearInterval(rushTimer);go('games')">← رجوع</button><div class="quiz-arena"><div class="quiz-progress"><div class="quiz-progress-fill" id="rushBar" style="width:100%"></div></div><div class="quiz-question">${rushQ.q} → ؟</div><div class="quiz-options">${rushQ.opts.map((o,i)=>`<button class="quiz-opt" onclick="answerRush(${i})">${o}</button>`).join('')}</div><div style="text-align:center;margin-top:14px;font-weight:800;color:var(--brand)" id="rushTimerEl">⏱️ ${t}</div></div></div>`;clearInterval(rushTimer);rushTimer=setInterval(()=>{t--;const te=document.getElementById('rushTimerEl');const bar=document.getElementById('rushBar');if(te)te.textContent=`⏱️ ${t}`;if(bar)bar.style.width=(t/5*100)+'%';if(t<=0){clearInterval(rushTimer);answerRush(-1)}},1000)}
window.answerRush=function(i){clearInterval(rushTimer);if(i===rushQ.c)rushScore++;rushIdx++;setTimeout(()=>renderRush(document.getElementById('view')),500)};
function renderBuilder(v){const b=builderState;const atoms=['H','O','C','N','Na','Cl','Mg','S'];v.innerHTML=`<div class="page"><button class="btn btn-ghost" onclick="go('games')">← رجوع</button><div class="quiz-arena"><div class="quiz-question">ركّب: ${b.target.name} (${b.target.formula})</div><div class="lab-elements">${atoms.map(a=>`<button class="lab-el" style="background:${GAME_COLORS[a.toLowerCase()]||'#64748b'}" onclick="builderPick('${a}')">${a}</button>`).join('')}</div><div class="lab-tube" style="border-radius:16px">${b.placed.length?b.placed.map(a=>`<span class="lab-el" style="background:${GAME_COLORS[a.toLowerCase()]||'#64748b'};width:44px;height:44px;font-size:16px">${a}</span>`).join(''):'<span style="color:var(--ink-3)">اختر الذرات</span>'}</div><div style="display:flex;gap:10px;justify-content:center;margin-top:14px"><button class="btn btn-ghost" onclick="builderState.placed=[];renderBuilder(document.getElementById('view'))">مسح</button><button class="btn btn-primary" onclick="builderCheck()">تحقق</button></div></div></div>`}
window.builderPick=function(a){if(!builderState)return;builderState.placed.push(a);renderBuilder(document.getElementById('view'))};
window.builderCheck=function(){const b=builderState;const counts={};b.placed.forEach(a=>counts[a]=(counts[a]||0)+1);let ok=true;for(const k in b.target.need){if((counts[k]||0)!==b.target.need[k])ok=false}if(Object.keys(counts).length!==Object.keys(b.target.need).length)ok=false;if(ok){toast('✅ صحيح!');addPoints(20);go('games')}else{toast('❌ حاول مرة أخرى');builderState.placed=[];renderBuilder(document.getElementById('view'))}};
function renderBreaker(v){const b=breakerState;v.innerHTML=`<div class="page"><button class="btn btn-ghost" onclick="go('games')">← رجوع</button><div class="quiz-arena"><div class="quiz-question">فكّك: ${b.target.f}</div><div class="lab-elements">${shuffle([...b.target.parts,...['X','Y','Z']].slice(0,8)).map((p,i)=>`<button class="lab-el" style="background:${GAME_COLORS[p.toLowerCase()]||'#64748b'};width:54px;height:54px;font-size:16px" onclick="breakerPick('${p}',this)">${p}</button>`).join('')}</div><div style="text-align:center;margin-top:14px;font-weight:800">المختار: ${b.picked.join(' + ')||'—'}</div><div style="display:flex;gap:10px;justify-content:center;margin-top:14px"><button class="btn btn-ghost" onclick="breakerState.picked=[];renderBreaker(document.getElementById('view'))">مسح</button><button class="btn btn-primary" onclick="breakerCheck()">تحقق</button></div></div></div>`}
window.breakerPick=function(p){breakerState.picked.push(p);renderBreaker(document.getElementById('view'))};
window.breakerCheck=function(){if(sameItems(breakerState.picked,breakerState.target.parts)){toast('✅ صحيح!');addPoints(20);go('games')}else{toast('❌ حاول مرة أخرى');breakerState.picked=[];renderBreaker(document.getElementById('view'))}};
function renderScale(v){const s=scaleState;v.innerHTML=`<div class="page"><button class="btn btn-ghost" onclick="go('games')">← رجوع</button><div class="quiz-arena"><div class="quiz-question">وازن المعادلة</div><div style="text-align:center;font-size:20px;direction:ltr;margin:20px 0;font-weight:900">${s.eq.l.map((x,i)=>`<span style="display:inline-block;margin:0 6px"><input type="number" min="1" max="9" value="${s.inputs[i]||1}" style="width:50px;padding:8px;text-align:center;border-radius:8px;border:2px solid var(--line);font-size:18px;font-weight:900" onchange="scaleState.inputs[${i}]=+this.value">${x.f}</span>`).join(' + ')} → ${s.eq.r.map((x,i)=>`<span style="display:inline-block;margin:0 6px"><input type="number" min="1" max="9" value="${s.inputs[s.eq.l.length+i]||1}" style="width:50px;padding:8px;text-align:center;border-radius:8px;border:2px solid var(--line);font-size:18px;font-weight:900" onchange="scaleState.inputs[${s.eq.l.length+i}]=+this.value">${x.f}</span>`).join(' + ')}</div><div style="display:flex;gap:10px;justify-content:center"><button class="btn btn-primary" onclick="scaleCheck()">تحقق</button></div></div></div>`}
window.scaleCheck=function(){const s=scaleState;const got=[...s.inputs];if(got.length!==s.eq.ans.length){toast('أكمل كل المعاملات');return}if(got.every((x,i)=>x===s.eq.ans[i])){toast('✅ موزونة!');addPoints(30);go('games')}else toast('❌ غير موزونة')};
function renderReact(v){const r=reactState;if(r.idx>=r.pool.length){v.innerHTML=`<div class="page"><div class="game-done" style="text-align:center"><div style="font-size:56px">🏆</div><div style="font-size:28px;font-weight:900;color:var(--brand);margin:10px 0">${r.score}/${r.pool.length}</div><div style="margin-top:20px;display:flex;gap:10px;justify-content:center"><button class="btn btn-primary" onclick="startGame('react')">إعادة</button><button class="btn btn-ghost" onclick="go('games')">رجوع</button></div></div></div>`;addPoints(r.score*15);return}const p=r.pool[r.idx];v.innerHTML=`<div class="page"><button class="btn btn-ghost" onclick="go('games')">← رجوع</button><div class="quiz-arena"><div class="quiz-question">هل يتفاعل ${p.a} + ${p.b}؟</div><div style="display:flex;gap:10px;justify-content:center"><button class="btn btn-primary" onclick="reactAnswer(true)">✅ يتفاعل</button><button class="btn btn-ghost" onclick="reactAnswer(false)">❌ لا يتفاعل</button></div><div style="text-align:center;margin-top:14px;color:var(--ink-3);font-weight:700">السؤال ${r.idx+1}/${r.pool.length}</div></div></div>`}
window.reactAnswer=function(ans){const p=reactState.pool[reactState.idx];if(ans===p.reacts){reactState.score++;toast('✅ '+p.p)}else toast('❌ '+p.p);reactState.idx++;setTimeout(()=>renderReact(document.getElementById('view')),600)};
function renderRace(v){const r=raceState;if(r.idx>=r.pool.length){const won=r.you>r.bot;v.innerHTML=`<div class="page"><div class="game-done" style="text-align:center"><div style="font-size:56px">${won?'🏆':'😢'}</div><div style="font-size:24px;font-weight:900;margin:10px 0">أنت: ${r.you} — البوت: ${r.bot}</div><div style="margin-top:20px;display:flex;gap:10px;justify-content:center"><button class="btn btn-primary" onclick="startGame('race')">إعادة</button><button class="btn btn-ghost" onclick="go('games')">رجوع</button></div></div></div>`;addPoints(r.you*10);return}const q=r.pool[r.idx];const opts=shuffle([q.a,...q.w]);v.innerHTML=`<div class="page"><button class="btn btn-ghost" onclick="go('games')">← رجوع</button><div class="quiz-arena"><div style="display:flex;justify-content:space-between;font-weight:800;margin-bottom:14px"><span>أنت: ${r.you}</span><span>البوت: ${r.bot}</span></div><div class="quiz-question">${q.q}</div><div class="quiz-options">${opts.map(o=>`<button class="quiz-opt" onclick="raceAnswer('${o}')">${o}</button>`).join('')}</div></div></div>`}
window.raceAnswer=function(ans){if(raceState.answered)return;raceState.answered=true;if(ans===raceState.pool[raceState.idx].a)raceState.you++;else raceState.bot++;raceState.idx++;setTimeout(()=>{raceState.answered=false;renderRace(document.getElementById('view'))},500)};
function renderCrossword(v){const c=crosswordState;if(c.idx>=CROSSWORD_DATA.length){v.innerHTML=`<div class="page"><div class="game-done" style="text-align:center"><div style="font-size:56px">🏆</div><div style="margin:20px 0;font-weight:800">أكملت الكلمات المتقاطعة</div><div style="display:flex;gap:10px;justify-content:center"><button class="btn btn-primary" onclick="startGame('crossword')">إعادة</button><button class="btn btn-ghost" onclick="go('games')">رجوع</button></div></div></div>`;addPoints(20);return}const q=CROSSWORD_DATA[c.idx];v.innerHTML=`<div class="page"><button class="btn btn-ghost" onclick="go('games')">← رجوع</button><div class="quiz-arena"><div class="quiz-question">الرمز: ${q.hint}</div><div style="text-align:center"><input id="cwInput" placeholder="اكتب الكلمة" style="font-family:inherit;font-size:18px;padding:12px;border-radius:12px;border:2px solid var(--line);text-align:center;width:200px;margin-bottom:14px"><button class="btn btn-primary" onclick="cwCheck()">تحقق</button></div><div style="text-align:center;margin-top:14px;color:var(--ink-3)">${c.idx+1}/${CROSSWORD_DATA.length}</div></div></div>`}
window.cwCheck=function(){const v=document.getElementById('cwInput').value.trim();if(v===crosswordState.idx>=CROSSWORD_DATA.length?'':''){}const correct=CROSSWORD_DATA[crosswordState.idx].word;if(v===correct){crosswordState.idx++;crosswordState.score++;toast('✅');renderCrossword(document.getElementById('view'))}else toast('❌')};
function renderWheel(v){const w=wheelState;v.innerHTML=`<div class="page"><button class="btn btn-ghost" onclick="go('games')">← رجوع</button><div class="quiz-arena"><div style="text-align:center;font-size:80px;margin:20px 0">🎲</div><div class="quiz-question">${w.q.q}</div><div class="quiz-options">${w.q.opts.map((o,i)=>`<button class="quiz-opt" onclick="wheelAnswer(${i})">${o}</button>`).join('')}</div></div></div>`}
window.wheelAnswer=function(i){if(i===wheelState.q.c){toast('✅');addPoints(10)}else toast('❌');wheelState.q=WHEEL_QUESTIONS[Math.floor(Math.random()*WHEEL_QUESTIONS.length)];setTimeout(()=>renderWheel(document.getElementById('view')),500)};
function renderGuess(v){const g=guessState;v.innerHTML=`<div class="page"><button class="btn btn-ghost" onclick="go('games')">← رجوع</button><div class="quiz-arena"><div style="text-align:center;font-size:80px;margin:20px 0">${g.revealed>=3?g.item.emoji:'❓'}</div><div class="quiz-question">${g.item.hints.slice(0,g.revealed+1).join(' · ')}</div><div style="text-align:center"><input id="guessInput" placeholder="تخمينك" style="font-family:inherit;font-size:18px;padding:12px;border-radius:12px;border:2px solid var(--line);text-align:center;width:200px;margin-bottom:14px"><button class="btn btn-primary" onclick="guessCheck()">تحقق</button><button class="btn btn-ghost" style="margin-right:8px" onclick="guessReveal()">تلميح</button></div></div></div>`}
window.guessCheck=function(){const v=document.getElementById('guessInput').value.trim();if(v===guessState.item.ans){toast('✅');addPoints(20);guessState={item:GUESS_IMAGES[Math.floor(Math.random()*GUESS_IMAGES.length)],revealed:0};renderGuess(document.getElementById('view'))}else toast('❌')};
window.guessReveal=function(){guessState.revealed=Math.min(guessState.revealed+1,guessState.item.hints.length-1);renderGuess(document.getElementById('view'))};
function renderSniper(v){const s=sniperState;v.innerHTML=`<div class="page"><button class="btn btn-ghost" onclick="sniperState.running=false;go('games')">← رجوع</button><div class="quiz-arena"><div class="quiz-question">${s.q.q}</div><div style="position:relative;height:60px;background:var(--paper-2);border-radius:14px;margin:20px 0;overflow:hidden"><div id="sniperArrow" style="position:absolute;top:50%;transform:translateY(-50%);left:${s.pos}%;font-size:36px;transition:left .05s linear">🎯</div></div><div class="quiz-options">${s.q.opts.map((o,i)=>`<button class="quiz-opt" onclick="sniperHit(${i})">${o}</button>`).join('')}</div></div></div>`;const target=s.q.opts[s.q.c];let pos=s.pos,dir=1;const iv=setInterval(()=>{if(!sniperState.running){clearInterval(iv);return}pos+=dir*2;if(pos>95){pos=95;dir=-1}if(pos<5){pos=5;dir=1}s.pos=pos;const a=document.getElementById('sniperArrow');if(a)a.style.left=pos+'%'},40)}
window.sniperHit=function(i){sniperState.running=false;if(i===sniperState.q.c){toast('✅');addPoints(15)}else toast('❌');sniperState={q:SNIPER_QUESTIONS[Math.floor(Math.random()*SNIPER_QUESTIONS.length)],pos:0,dir:1,running:true};setTimeout(()=>renderSniper(document.getElementById('view')),500)};
function renderBalance(v){const b=balanceState;v.innerHTML=`<div class="page"><button class="btn btn-ghost" onclick="clearInterval(balanceState.timer);go('games')">← رجوع</button><div class="quiz-arena"><div style="text-align:center;font-size:18px;font-weight:900;color:var(--brand);margin-bottom:14px">⏱️ ${b.time}s</div><div class="quiz-question" style="direction:ltr">${b.eq.left.map(x=>`${x.n}${x.f}`).join(' + ')} → ${b.eq.right.map(x=>`${x.n}${x.f}`).join(' + ')}</div><div style="text-align:center"><input id="balInput" placeholder="2,1,2" style="font-family:inherit;font-size:18px;padding:12px;border-radius:12px;border:2px solid var(--line);text-align:center;width:220px;margin-bottom:14px"><button class="btn btn-primary" onclick="balanceCheck()">تحقق</button></div></div></div>`;clearInterval(b.timer);b.timer=setInterval(()=>{b.time--;const el=document.querySelector('.quiz-arena div');if(el&&b.time>=0)el.textContent='⏱️ '+b.time+'s';if(b.time<=0){clearInterval(b.timer);toast('⏰ انتهى الوقت');go('games')}},1000)}
window.balanceCheck=function(){const v=document.getElementById('balInput').value.split(',').map(x=>+x.trim());if(v.length===balanceState.eq.sol.length&&v.every((x,i)=>x===balanceState.eq.sol[i])){toast('✅ موزونة!');addPoints(40);clearInterval(balanceState.timer);go('games')}else toast('❌')};
let adminTab='users';

shNews()">📰 نشر</button></div>`;if(adminTab==='message')return`<div class="menu-list"><textarea id="msgText" placeholder="رسالة لكل المستخدمين" style="font-family:inherit;font-size:15px;width:100%;padding:12px;border-radius:14px;border:1px solid var(--line);margin-bottom:10px;min-height:80px"></textarea><button class="btn btn-primary" onclick="sendPlatformMessage()">📢 إرسال</button></div>`;return''}

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>منصة سيجما التعليمية</title>
<meta name="theme-color" content="#050a1f">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #050a1f;
  --bg-card: #0d1738;
  --bg-input: #0a122e;
  --tx: #ffffff;
  --tx2: #94a3b8;
  --tx3: #64748b;
  --ac: #2563eb;
  --ac-soft: rgba(37, 99, 235, 0.15);
  --grad: linear-gradient(135deg, #4f46e5, #2563eb);
  --grad-gold: linear-gradient(135deg, #f59e0b, #d97706);
  --grad-red: linear-gradient(135deg, #ef4444, #b91c1c);
  --ok: #10b981;
  --er: #ef4444;
  --bd: rgba(255, 255, 255, 0.08);
  --r: 16px;
  --r-lg: 24px;
  --shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--tx); min-height: 100vh; padding-bottom: 100px; }
h1, h2, h3 { font-weight: 800; }
main { max-width: 800px; margin: 0 auto; padding: 20px; }

/* Loading */
#loading-overlay { position: fixed; inset: 0; z-index: 9999; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.3s; }
#loading-overlay.hide { opacity: 0; pointer-events: none; }
.spinner { width: 40px; height: 40px; border: 4px solid var(--ac-soft); border-top-color: var(--ac); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Top Bar */
.top-bar { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; }
.top-bar .user-info { display: flex; align-items: center; gap: 12px; }
.top-bar .user-info img { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--ac); object-fit: cover; }
.top-bar .user-info .name { font-size: 16px; font-weight: 800; }
.top-bar .user-info .welcome { font-size: 12px; color: var(--tx2); }
.top-bar .action-btn { background: var(--bg-card); border: 1px solid var(--bd); color: var(--tx); width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.top-bar .action-btn svg { width: 22px; height: 22px; fill: var(--tx); }

/* Banner */
.banner { background: linear-gradient(135deg, #1e3a8a, #3b82f6); border-radius: var(--r-lg); padding: 24px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow); }
.banner h2 { font-size: 22px; margin-bottom: 8px; }
.banner p { font-size: 14px; color: rgba(255,255,255,0.8); margin-bottom: 16px; }
.banner button { background: #fff; color: var(--ac); padding: 10px 20px; border-radius: 50px; border: none; font-weight: 800; cursor: pointer; font-size: 14px; }
.banner img { width: 90px; }

/* Menu Grid */
.grid-menu { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 30px; }
.menu-card { background: var(--bg-card); border: 1px solid var(--bd); border-radius: var(--r); padding: 16px 10px; display: flex; flex-direction: column; align-items: center; gap: 10px; cursor: pointer; }
.menu-card:active { transform: scale(0.96); }
.menu-card .icon { width: 46px; height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center; }
.menu-card .icon svg { width: 24px; height: 24px; fill: #fff; }
.menu-card span { font-size: 13px; font-weight: 700; text-align: center; }
.icon.blue { background: var(--grad); }
.icon.purple { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
.icon.gold { background: var(--grad-gold); }
.icon.green { background: linear-gradient(135deg, #10b981, #059669); }

/* Cards */
.teacher-card { background: var(--bg-card); border: 1px solid var(--bd); border-radius: var(--r-lg); padding: 20px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 16px; }
.teacher-header { display: flex; align-items: center; gap: 14px; }
.teacher-header img { width: 70px; height: 70px; border-radius: 50%; border: 3px solid var(--ac-soft); object-fit: cover; }
.teacher-header .info h3 { font-size: 18px; margin-bottom: 4px; }
.teacher-header .info p { font-size: 13px; color: var(--tx2); }
.teacher-about { background: var(--bg-input); border-radius: 12px; padding: 14px; font-size: 13px; color: var(--tx2); line-height: 1.7; }
.teacher-actions { display: flex; gap: 10px; }
.teacher-actions button { flex: 1; padding: 12px; border-radius: 12px; border: none; font-weight: 800; font-size: 14px; cursor: pointer; }
.btn-primary { background: var(--ac); color: #fff; }
.btn-secondary { background: var(--bg-input); color: var(--tx); border: 1px solid var(--bd); }

/* Profile */
.profile-card { background: var(--bg-card); border: 1px solid var(--bd); border-radius: var(--r-lg); padding: 24px; text-align: center; margin-bottom: 20px; }
.profile-card img { width: 90px; height: 90px; border-radius: 50%; border: 4px solid var(--ac); margin-bottom: 16px; object-fit: cover; }
.profile-card h2 { margin-bottom: 4px; }
.profile-card p { color: var(--tx2); font-size: 14px; }
.premium-badge { background: var(--grad-gold); color: #fff; padding: 8px 16px; border-radius: 50px; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 800; margin-top: 16px; }

/* Settings List */
.settings-list { display: flex; flex-direction: column; gap: 10px; }
.settings-item { background: var(--bg-card); border: 1px solid var(--bd); border-radius: 12px; padding: 16px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
.settings-item .left { display: flex; align-items: center; gap: 14px; }
.settings-item .left .icon { width: 40px; height: 40px; border-radius: 12px; background: var(--bg-input); display: flex; align-items: center; justify-content: center; }
.settings-item .left .icon svg { width: 20px; height: 20px; fill: var(--tx); }
.settings-item .left span { font-size: 15px; font-weight: 700; }
.settings-item.logout { background: var(--bg-input); }
.settings-item.logout .left .icon { background: var(--grad-red); }
.settings-item.logout .left span { color: var(--er); }

/* Bottom Nav */
.bottombar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 100; background: var(--bg-card); border-top: 1px solid var(--bd); display: flex; justify-content: space-around; padding: 10px 10px calc(10px + env(safe-area-inset-bottom)); }
.bottombar button { background: transparent; border: none; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--tx3); cursor: pointer; flex: 1; }
.bottombar button svg { width: 24px; height: 24px; fill: currentColor; }
.bottombar button span { font-size: 10px; font-weight: 700; }
.bottombar button.active { color: var(--ac); }

/* Auth */
.auth-container { max-width: 400px; margin: 0 auto; padding: 40px 20px; text-align: center; }
.auth-box { background: var(--bg-card); border-radius: 20px; padding: 24px; text-align: right; border: 1px solid var(--bd); }
input { width: 100%; padding: 14px; background: var(--bg-input); border: 1px solid var(--bd); border-radius: 10px; color: var(--tx); margin-bottom: 14px; font-family: inherit; font-size: 15px; }
input:focus { outline: none; border-color: var(--ac); }
label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 700; color: var(--tx2); }
.mut { text-align: center; padding: 40px; color: var(--tx3); }
</style>
</head>
<body>
<div id="loading-overlay"><div class="spinner"></div><p style="font-family:Cairo,sans-serif;font-weight:700;color:var(--ac)">جارٍ التحميل...</p></div>
<div id="app"></div>
<div id="t" style="position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--bg-card);color:var(--tx);padding:12px 24px;border-radius:10px;font-weight:700;display:none;z-index:300;border:1px solid var(--bd);"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, get, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = initializeApp({
  apiKey: "AIzaSyCoHGEyhlsjmB_diUNm-R8SXB0Gm0kXw0A",
  authDomain: "sigma-6f162.firebaseapp.com",
  databaseURL: "https://sigma-6f162-default-rtdb.firebaseio.com",
  projectId: "sigma-6f162",
  storageBucket: "sigma-6f162.firebasestorage.app",
  messagingSenderId: "420365348074",
  appId: "1:420365348074:web:0aaecb71ec613bb32abb93"
});

const auth = getAuth(app);
const db = getDatabase(app);
const ADMIN_PHONES = ["01147975962", "01123543649", "01147758295"];

let U = null, A = false, S = { v: 'home' };
let teachers = {}, myPhoto = '';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const avatarOf = name => 'https://ui-avatars.com/api/?name=' + encodeURIComponent(name || 'U') + '&background=2563eb&color=fff&size=200';

function hideOverlay() { setTimeout(() => { const ov = $('#loading-overlay'); if (ov) ov.classList.add('hide'); }, 500); }
function toast(msg) { const t = $('#t'); t.textContent = msg; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 3000); }

// --- UI RENDERERS ---
function render() {
  const app = $('#app');
  if (!U) { app.innerHTML = vAuth(); return; }
  
  const views = { home: vHome, settings: vSettings };
  const fn = views[S.v] || vHome;
  
  app.innerHTML = `
    ${topBarHTML()}
    <main>${fn()}</main>
    ${bottomBar()}
  `;
}

function topBarHTML() {
  if (!U) return '';
  return `
    <div class="top-bar">
      <div class="user-info">
        <img src="${esc(myPhoto || avatarOf(U.displayName))}" alt="">
        <div>
          <div class="welcome">أهلاً بك،</div>
          <div class="name">${esc(U.displayName?.split(' ')[0] || 'طالب')}</div>
        </div>
      </div>
      <div style="display:flex;gap:10px;">
        <button class="action-btn" onclick="toast('الإشعارات قريباً')">
          <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
        </button>
      </div>
    </div>
  `;
}

function bottomBar() {
  const on = k => S.v === k;
  return `
    <nav class="bottombar">
      <button class="${on('home')?'active':''}" onclick="go('home')">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>الرئيسية</span>
      </button>
      <button onclick="toast('قريباً')">
        <svg viewBox="0 0 24 24"><path d="M20 3H4v10c0 2.21 1.79 4 4 4h6c2.21 0 4-1.79 4-4v-3h2c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 5h-2V5h2v3zM4 19h16v2H4z"/></svg><span>الأخبار</span>
      </button>
      <button onclick="toast('قريباً')">
        <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9H9V9h10v2zm-4 4H9v-2h6v2zm4-8H9V5h10v2z"/></svg><span>المكتبة</span>
      </button>
      <button onclick="toast('قريباً')">
        <svg viewBox="0 0 24 24"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg><span>الامتحانات</span>
      </button>
      <button class="${on('settings')?'active':''}" onclick="go('settings')">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg><span>حسابي</span>
      </button>
    </nav>
  `;
}

function vHome() {
  return `
    <div class="banner">
      <div>
        <h2>معاً نحو مستقبل أفضل</h2>
        <p>تعليم .. ذكاء .. مستقبل أفضل</p>
        <button>إبدأ الآن</button>
      </div>
      <img src="https://cdn-icons-png.flaticon.com/512/3135/3135810.png">
    </div>

    <h2 style="margin-bottom:16px;">أقسام المنصة</h2>
    <div class="grid-menu">
      <div class="menu-card" onclick="toast('قريباً')"><div class="icon blue">📝</div><span>الاختبارات</span></div>
      <div class="menu-card" onclick="toast('قريباً')"><div class="icon purple">🎥</div><span>المحاضرات</span></div>
      <div class="menu-card" onclick="toast('قريباً')"><div class="icon blue">▶️</div><span>الفيديوهات</span></div>
      <div class="menu-card" onclick="toast('قريباً')"><div class="icon gold">🏆</div><span>المسابقات</span></div>
      <div class="menu-card" onclick="toast('قريباً')"><div class="icon gold">🎓</div><span>الشهادات</span></div>
      <div class="menu-card" onclick="toast('قريباً')"><div class="icon green">⭐</div><span>المميزون</span></div>
    </div>

    <h2 style="margin-bottom:16px;">المدرسون</h2>
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;">
      ${Object.entries(teachers).length ? Object.entries(teachers).map(([id, x]) => `
        <div style="background:var(--bg-card);border:1px solid var(--bd);border-radius:16px;overflow:hidden;text-align:center;">
          <img src="${esc(x.photo || avatarOf(x.name))}" style="width:100%;height:120px;object-fit:cover;">
          <div style="padding:12px;"><b style="font-size:14px;">${esc(x.name)}</b></div>
        </div>
      `).join('') : '<div class="mut">لا يوجد مدرسون حالياً</div>'}
    </div>
  `;
}

function vSettings() {
  return `
    <div class="profile-card">
      <img src="${esc(myPhoto || avatarOf(U.displayName))}">
      <h2>${esc(U.displayName)}</h2>
      <p>${esc(U.email?.split('@')[0] || '')}</p>
      <div class="premium-badge">👑 عضوية مميزة</div>
    </div>
    
    <div class="settings-list">
      <div class="settings-item" onclick="toast('قريباً')"><div class="left"><div class="icon">📝</div><span>الاختبارات</span></div></div>
      <div class="settings-item" onclick="toast('قريباً')"><div class="left"><div class="icon">📚</div><span>المحفوظات</span></div></div>
      <div class="settings-item" onclick="toast('قريباً')"><div class="left"><div class="icon">🎓</div><span>الشهادات</span></div></div>
      <div class="settings-item" onclick="toast('قريباً')"><div class="left"><div class="icon">⚙️</div><span>الإعدادات</span></div></div>
      <div class="settings-item" onclick="toast('قريباً')"><div class="left"><div class="icon">🎧</div><span>الدعم الفني</span></div></div>
      <div class="settings-item" onclick="toast('قريباً')"><div class="left"><div class="icon">❓</div><span>المساعدة</span></div></div>
      <div class="settings-item logout" onclick="out()"><div class="left"><div class="icon">🚪</div><span>تسجيل الخروج</span></div></div>
    </div>
  `;
}

function vAuth() {
  return `
    <div class="auth-container">
      <img src="https://cdn-icons-png.flaticon.com/512/3135/3135810.png" style="width:100px;margin-bottom:20px;">
      <h1 style="margin-bottom:8px;">منصة سيجما</h1>
      <p style="color:var(--tx2);margin-bottom:30px;">تعليم .. ذكاء .. مستقبل أفضل</p>
      
      <div class="auth-box" id="auth-box">
        <div id="register-form">
          <label>الاسم الرباعي</label>
          <input id="reg-name" placeholder="مثال: محمد أحمد علي">
          <label>رقم الهاتف</label>
          <input id="reg-phone" type="tel" placeholder="01xxxxxxxxx" dir="ltr">
          <label>كلمة المرور</label>
          <input id="reg-pass" type="password" placeholder="••••••••">
          <button class="btn-primary" style="width:100%;margin-bottom:10px;" onclick="registerPhone()">إنشاء حساب جديد</button>
          <button class="btn-secondary" style="width:100%;" onclick="toggleAuth('login')">لديك حساب؟ تسجيل الدخول</button>
        </div>
        
        <div id="login-form" style="display:none;">
          <label>رقم الهاتف</label>
          <input id="login-phone" type="tel" placeholder="01xxxxxxxxx" dir="ltr">
          <label>كلمة المرور</label>
          <input id="login-pass" type="password" placeholder="••••••••">
          <button class="btn-primary" style="width:100%;margin-bottom:10px;" onclick="loginPhone()">تسجيل الدخول</button>
          <button class="btn-secondary" style="width:100%;" onclick="toggleAuth('register')">ليس لديك حساب؟ إنشاء حساب</button>
        </div>
      </div>
    </div>
  `;
}

// --- LOGIC & ACTIONS ---
const go = (v) => { S.v = v; render(); };
const out = () => { if (confirm('تسجيل الخروج؟')) signOut(auth); };
const toggleAuth = (mode) => {
  $('#register-form').style.display = mode === 'register' ? 'block' : 'none';
  $('#login-form').style.display = mode === 'login' ? 'block' : 'none';
};

async function registerPhone() {
  const name = $('#reg-name').value.trim();
  const phone = $('#reg-phone').value.trim();
  const pass = $('#reg-pass').value;

  if (name.split(' ').length < 4) return toast('اكتب الاسم الرباعي كاملاً');
  if (!/^01[0-9]{9}$/.test(phone)) return toast('رقم الهاتف غير صحيح');

  try {
    const fakeEmail = `${phone}@sigma.user`;
    const cred = await createUserWithEmailAndPassword(auth, fakeEmail, pass);
    await updateProfile(cred.user, { displayName: name });
    await set(ref(db, 'users/' + cred.user.uid), {
      name, phone, email: fakeEmail, createdAt: Date.now()
    });
    toast('✅ تم إنشاء الحساب بنجاح');
  } catch (e) {
    toast('خطأ: ' + (e.message || 'تعذر إنشاء الحساب'));
  }
}

async function loginPhone() {
  const phone = $('#login-phone').value.trim();
  const pass = $('#login-pass').value;

  try {
    await signInWithEmailAndPassword(auth, `${phone}@sigma.user`, pass);
    toast('✅ تم تسجيل الدخول');
  } catch (e) {
    toast('خطأ: رقم الهاتف أو كلمة المرور غير صحيحة');
  }
}

// --- INIT ---
onAuthStateChanged(auth, async (user) => {
  U = user;
  if (user) {
    const snap = await get(ref(db, 'users/' + user.uid));
    const data = snap.val();
    myPhoto = data?.photo || '';
    A = ADMIN_PHONES.includes(data?.phone || '');
  }
  
  // Load teachers live
  onValue(ref(db, 'teachers'), (snap) => {
    teachers = snap.val() || {};
    if (U) render();
  });

  render();
  hideOverlay();
});

Object.assign(window, { go, out, toast, registerPhone, loginPhone, toggleAuth });
</script>
</body>
</html>

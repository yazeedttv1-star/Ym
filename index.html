* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { min-height: 100%; scroll-behavior: smooth; }

#loading-overlay { position: fixed; inset: 0; z-index: 9999; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.4s ease; }

.spinner { width: 44px; height: 44px; border: 4px solid var(--ac-soft); border-top-color: var(--ac); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
@keyframes spin { to { transform: rotate(360deg); } }

.top-bar { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; background: transparent; margin-bottom: 10px; }

.top-bar .user-info img { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--ac); object-fit: cover; }

.section-title h2 { margin: 0; font-size: 18px; }

</style>

function img(f,maxSize=800){
  return new Promise((resolve,reject)=>{
    if(!f)return resolve(null);
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error('تعذر قراءة الصورة'));
    reader.onload=e=>{
      const im=new Image();
      im.onload=()=>{
        try{
          let w=im.width,h=im.height;
          if(w>maxSize||h>maxSize){const ratio=Math.min(maxSize/w,maxSize/h);w=Math.max(1,Math.round(w*ratio));h=Math.max(1,Math.round(h*ratio))}
          const c=document.createElement('canvas');c.width=w;c.height=h;
          c.getContext('2d').drawImage(im,0,0,w,h);
          let data;
          try{data=c.toDataURL('image/jpeg',0.8)}catch(err){data=c.toDataURL('image/png')}
          if(!data||data==='data:,')return reject(new Error('تعذر معالجة الصورة'));
          resolve(data);
        }catch(err){reject(err)}
      };
      im.onerror=()=>reject(new Error('صيغة الصورة غير مدعومة'));
      im.src=e.target.result;
    };
    reader.readAsDataURL(f);
  });
}

function deviceLabel(){const ua=navigator.userAgent;if(/android/i.test(ua))return'Android';if(/iPhone|iPad|iPod/i.test(ua))return'iOS';if(/Windows/i.test(ua))return'Windows';if(/Mac/i.test(ua))return'Mac';if(/Linux/i.test(ua))return'Linux';return'جهاز'}

let toastTimer=null;
function toast(m){let t=$('#t');if(!t){t=document.createElement('div');t.id='t';document.body.appendChild(t)}t.textContent=m;t.style.display='block';if(toastTimer)clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.display='none',2600)}

function userSeed(){const s=U?.uid||'anon';let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h}
function userShuffle(arr,offset=0){const a=[...arr];let s=(userSeed()+offset)>>>0;for(let i=a.length-1;i>0;i--){s=(s*1664525+1013904223)>>>0;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
const shuffle=arr=>{const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const sameItems=(a,b)=>a.length===b.length&&[...a].sort().join('|')===[...b].sort().join('|');
const labDone=lab=>{const v=labUserData?.labs?.[lab];const total=LAB_EXPERIMENTS[lab].length;if(v===true)return total;return typeof v==='number'?Math.min(v,total):0};
const arcadePoints=uid=>(arcadeData?.[uid]?.points||0)+(quizLeaderData?.[uid]?.points||0);
function eyeIcon(count){return `<span class="view-counter"><svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>${count||0}</span>`}

onAuthStateChanged(auth, async u => {
  U=u;
  if(!u){render();hideOverlay();return;}
  try {
    const userData=await GS('users/'+u.uid);
    A=isAdminPhone(userData?.phone||'');
    myPhoto=userData?.photo||'';
    myPhone=userData?.phone||'';
    render();hideOverlay();
  } catch(e) { render(); hideOverlay(); }
});

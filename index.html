<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>منصة سيجما التعليمية</title>
<meta name="theme-color" content="#2563eb">
<link rel="manifest" id="mf">
<link rel="apple-touch-icon" id="ai">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ============ Design Tokens ============ */
:root{
  --brand-50:#eff6ff; --brand-100:#dbeafe; --brand-200:#bfdbfe;
  --brand-500:#3b82f6; --brand-600:#2563eb; --brand-700:#1d4ed8;
  --accent:#8b5cf6; --accent-2:#ec4899;
  --ok:#10b981; --warn:#f59e0b; --er:#ef4444;
  --bg:#f6f8fc; --bg-2:#eef2f9;
  --surface:#ffffff; --surface-2:#f8fafc; --surface-3:#eef2f7;
  --tx:#0b1220; --tx-2:#334155; --mu:#94a3b8; --bd:#e5eaf2;
  --r-xs:8px; --r-sm:12px; --r-md:16px; --r-lg:22px; --r-xl:28px; --r-full:999px;
  --sh-sm:0 1px 2px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.04);
  --sh:0 4px 12px rgba(15,23,42,.06),0 2px 4px rgba(15,23,42,.04);
  --sh-lg:0 20px 40px -12px rgba(15,23,42,.18),0 8px 20px -8px rgba(15,23,42,.12);
  --sh-glow:0 8px 30px -8px rgba(37,99,235,.45);
  --grad-brand:linear-gradient(135deg,#2563eb 0%,#3b82f6 50%,#8b5cf6 100%);
  --grad-warm:linear-gradient(135deg,#f59e0b,#ef4444);
  --grad-cool:linear-gradient(135deg,#06b6d4,#3b82f6);
  --ease:cubic-bezier(.4,0,.2,1);
}
html.dark{
  --bg:#070b14; --bg-2:#0c1220;
  --surface:#0f172a; --surface-2:#111a2e; --surface-3:#1a2440;
  --tx:#f1f5f9; --tx-2:#cbd5e1; --mu:#64748b; --bd:#1e293b;
  --sh-lg:0 20px 40px -12px rgba(0,0,0,.6),0 8px 20px -8px rgba(0,0,0,.4);
  --sh-glow:0 8px 30px -8px rgba(59,130,246,.35);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:auto;-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  font-family:Cairo,system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  background:
    radial-gradient(1200px 600px at 100% -10%, rgba(59,130,246,.10), transparent 60%),
    radial-gradient(800px 500px at -10% 110%, rgba(139,92,246,.08), transparent 60%),
    var(--bg);
  color:var(--tx);
  min-height:100vh;min-height:100dvh;
  padding-bottom:calc(120px + env(safe-area-inset-bottom));
  overflow-x:hidden;
  -webkit-user-select:none;user-select:none;
  transition:background .3s,color .3s;
}
html.dark body{
  background:
    radial-gradient(1200px 600px at 100% -10%, rgba(59,130,246,.12), transparent 60%),
    radial-gradient(800px 500px at -10% 110%, rgba(139,92,246,.10), transparent 60%),
    var(--bg);
}
input,select,textarea{-webkit-user-select:text;user-select:text}

/* ============ Top Bar ============ */
.topbar{
  position:sticky;top:0;z-index:50;
  padding:14px 18px calc(14px + env(safe-area-inset-top));
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:rgba(255,255,255,.82);
  -webkit-backdrop-filter:saturate(180%) blur(18px);
  backdrop-filter:saturate(180%) blur(18px);
  border-bottom:1px solid var(--bd);
}
html.dark .topbar{background:rgba(15,23,42,.75)}
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{
  width:44px;height:44px;border-radius:12px;flex:0 0 44px;
  background:transparent;display:grid;place-items:center;
  box-shadow:var(--sh-sm);overflow:hidden;
}
.brand-logo img{width:100%;height:100%;object-fit:contain;}
.brand-name{font-weight:800;font-size:16px;line-height:1.1}
.brand-sub{font-size:11px;color:var(--mu);font-weight:600}
.topbar-actions{display:flex;align-items:center;gap:8px}
.icon-btn{
  width:42px;height:42px;border-radius:var(--r-full);border:1px solid var(--bd);
  background:var(--surface);color:var(--tx);cursor:pointer;
  display:grid;place-items:center;position:relative;
  transition:transform .15s var(--ease),box-shadow .2s,background .2s;
  box-shadow:var(--sh-sm);
}
.icon-btn:hover{transform:translateY(-1px);box-shadow:var(--sh);background:var(--surface-2)}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn .dot{
  position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;padding:0 5px;
  background:var(--er);color:#fff;border-radius:var(--r-full);
  border:2px solid var(--surface);font-size:10px;font-weight:800;
  display:grid;place-items:center;
}
.avatar-btn{
  width:42px;height:42px;border-radius:var(--r-full);padding:0;overflow:hidden;
  border:2px solid var(--surface);box-shadow:var(--sh-glow);cursor:pointer;
  background:var(--grad-brand);
}
.avatar-btn img{width:100%;height:100%;object-fit:cover;display:block}

/* ============ Layout ============ */
main{max-width:1100px;margin:0 auto;padding:20px 18px 40px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 16px;}
.section-title{font-size:20px;font-weight:800;letter-spacing:-.3px}
.section-sub{font-size:13px;color:var(--mu);font-weight:600;margin-top:2px}
.section-link{font-size:13px;font-weight:700;color:var(--brand-600);cursor:pointer;background:none;border:0;padding:6px 10px;border-radius:var(--r-full);}
.section-link:hover{background:var(--brand-50)}
html.dark .section-link:hover{background:rgba(37,99,235,.15)}

/* Hero */
.hero{
  position:relative;overflow:hidden;
  background:var(--grad-brand);color:#fff;
  border-radius:var(--r-xl);padding:24px 22px;
  margin-bottom:22px;box-shadow:var(--sh-glow);
}
.hero::before{content:"";position:absolute;top:-60px;left:-60px;width:200px;height:200px;background:radial-gradient(circle,rgba(255,255,255,.25),transparent 70%);border-radius:50%;}
.hero::after{content:"";position:absolute;bottom:-80px;right:-40px;width:220px;height:220px;background:radial-gradient(circle,rgba(255,255,255,.15),transparent 70%);border-radius:50%;}
.hero-content{position:relative;z-index:1}
.hero-eyebrow{font-size:12px;opacity:.85;font-weight:700;margin-bottom:6px}
.hero-title{font-size:24px;font-weight:900;line-height:1.25;margin-bottom:6px;letter-spacing:-.5px}
.hero-desc{font-size:14px;opacity:.9;line-height:1.6;margin-bottom:18px;max-width:420px}
.hero-cta{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.3);padding:10px 18px;border-radius:var(--r-full);font-weight:800;font-size:14px;cursor:pointer;transition:.2s var(--ease);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);}
.hero-cta:hover{background:rgba(255,255,255,.28);transform:translateY(-1px)}
.hero-cta svg{width:18px;height:18px;fill:currentColor}
.hero-stats{display:flex;gap:18px;margin-top:18px;position:relative;z-index:1}
.hero-stat{display:flex;flex-direction:column}
.hero-stat b{font-size:20px;font-weight:900}
.hero-stat span{font-size:11px;opacity:.85;font-weight:600}

/* Stat chips */
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px;}
.stat{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-lg);padding:16px;box-shadow:var(--sh-sm);transition:transform .2s var(--ease),box-shadow .2s;position:relative;overflow:hidden;}
.stat:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.stat-icon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--brand-50);color:var(--brand-600);margin-bottom:10px;}
html.dark .stat-icon{background:rgba(37,99,235,.2);color:#93c5fd}
.stat-icon.ok{background:#d1fae5;color:#059669}
html.dark .stat-icon.ok{background:rgba(16,185,129,.2);color:#6ee7b7}
.stat-icon.warn{background:#fef3c7;color:#d97706}
html.dark .stat-icon.warn{background:rgba(245,158,11,.2);color:#fcd34d}
.stat-icon svg{width:20px;height:20px;fill:currentColor}
.stat-num{font-size:24px;font-weight:900;letter-spacing:-.5px;line-height:1}
.stat-label{font-size:12px;color:var(--mu);font-weight:700;margin-top:4px}

/* Teacher grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.teacher-card{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-lg);overflow:hidden;cursor:pointer;text-align:center;transition:transform .25s var(--ease),box-shadow .25s,border-color .2s;box-shadow:var(--sh-sm);}
.teacher-card:hover{transform:translateY(-4px);box-shadow:var(--sh-lg);border-color:var(--brand-200)}
.teacher-card:active{transform:scale(.98)}
.teacher-photo{aspect-ratio:1;background:var(--grad-brand);position:relative;overflow:hidden;}
.teacher-photo img{width:100%;height:100%;object-fit:cover;display:block}
.teacher-body{padding:12px 10px 14px}
.teacher-name{font-weight:800;font-size:14px;color:var(--tx);line-height:1.3}
.teacher-meta{font-size:11px;color:var(--mu);font-weight:600;margin-top:3px}

/* Video list */
.list{display:flex;flex-direction:column;gap:10px}
.video-row{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-md);padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:.2s var(--ease);box-shadow:var(--sh-sm);}
.video-row:hover{border-color:var(--brand-200);box-shadow:var(--sh);transform:translateY(-1px)}
.video-thumb{width:56px;height:56px;border-radius:12px;flex:0 0 56px;background:var(--grad-brand);display:grid;place-items:center;color:#fff;font-size:22px;}
.video-body{flex:1;min-width:0}
.video-title{font-weight:800;font-size:14px;line-height:1.3;color:var(--tx);margin-bottom:3px}
.video-meta{font-size:12px;color:var(--mu);font-weight:600;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.video-progress{height:5px;background:var(--surface-3);border-radius:var(--r-full);overflow:hidden;margin-top:8px;}
.video-progress span{display:block;height:100%;background:var(--grad-brand);border-radius:inherit}
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:var(--r-full);font-size:11px;font-weight:800;white-space:nowrap;background:var(--surface-3);color:var(--tx-2);}
.badge.ok{background:#d1fae5;color:#065f46}
.badge.warn{background:#fef3c7;color:#92400e}
.badge.er{background:#fee2e2;color:#991b1b}
.badge.brand{background:var(--brand-50);color:var(--brand-700)}
html.dark .badge.ok{background:rgba(16,185,129,.2);color:#6ee7b7}
html.dark .badge.warn{background:rgba(245,158,11,.2);color:#fcd34d}
html.dark .badge.er{background:rgba(239,68,68,.2);color:#fca5a5}
html.dark .badge.brand{background:rgba(37,99,235,.2);color:#93c5fd}

/* Bottom Bar */
.bottombar{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:60;width:calc(100% - 28px);max-width:520px;background:rgba(255,255,255,.85);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border:1px solid var(--bd);border-radius:var(--r-xl);padding:8px;display:flex;justify-content:space-between;gap:2px;box-shadow:0 20px 50px -12px rgba(15,23,42,.25),0 4px 12px rgba(15,23,42,.06);}
html.dark .bottombar{background:rgba(15,23,42,.85);box-shadow:0 20px 50px -12px rgba(0,0,0,.6)}
.nav-item{flex:1;background:transparent;border:0;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mu);cursor:pointer;border-radius:var(--r-md);font-size:10px;font-weight:800;font-family:inherit;transition:.2s var(--ease);}
.nav-item svg{width:22px;height:22px;fill:currentColor;transition:transform .2s var(--ease)}
.nav-item:hover{color:var(--tx-2)}
.nav-item.on{color:var(--brand-600);background:var(--brand-50)}
html.dark .nav-item.on{background:rgba(37,99,235,.18);color:#93c5fd}
.nav-item.on svg{transform:translateY(-1px) scale(1.08)}

/* Player */
.player-shell{background:#000;border-radius:var(--r-lg);overflow:hidden;aspect-ratio:16/9;position:relative;box-shadow:var(--sh-lg);margin-bottom:16px;}
.player-shell .poster{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,#1e293b,#000);display:grid;place-items:center;}
.play-fab{width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.15);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:2px solid rgba(255,255,255,.35);display:grid;place-items:center;cursor:pointer;transition:.2s var(--ease);}
.play-fab:hover{transform:scale(1.06);background:rgba(255,255,255,.25)}
.play-fab svg{width:32px;height:32px;fill:#fff;margin-left:4px}
.player-controls{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-md);padding:12px 14px;margin-top:10px;display:flex;align-items:center;gap:10px;box-shadow:var(--sh-sm);}
.player-controls .time{font-size:12px;font-weight:800;color:var(--mu);min-width:42px;text-align:center}
.player-controls .seek{flex:1;height:6px;background:var(--surface-3);border-radius:var(--r-full);position:relative;overflow:hidden;}
.player-controls .seek span{display:block;height:100%;width:0%;background:var(--grad-brand);border-radius:inherit;transition:width .3s;}
.player-controls .ctrl-btn{background:transparent;border:0;color:var(--tx-2);cursor:pointer;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;}
.player-controls .ctrl-btn:hover{background:var(--surface-3);color:var(--tx)}
.player-controls .ctrl-btn svg{width:20px;height:20px;fill:currentColor}

/* Exam */
.exam-timer{position:sticky;top:80px;z-index:20;background:var(--grad-brand);color:#fff;border-radius:var(--r-md);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--sh-glow);margin-bottom:18px;font-weight:800;}
.exam-timer .time-big{font-family:"Courier New",monospace;font-size:22px;letter-spacing:2px}
.exam-timer.warn{background:var(--grad-warm)}
.exam-timer.danger{background:linear-gradient(135deg,#ef4444,#dc2626);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 8px 30px -8px rgba(239,68,68,.5)}50%{box-shadow:0 8px 40px -4px rgba(239,68,68,.85)}}
.question-card{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-lg);padding:20px;margin-bottom:14px;box-shadow:var(--sh-sm);}
.q-num{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--grad-brand);color:#fff;font-weight:900;font-size:13px;margin-left:8px;vertical-align:middle;}
.q-text{font-size:15px;font-weight:800;line-height:1.7;color:var(--tx);margin-bottom:14px}
.opt{display:flex;align-items:center;gap:12px;padding:14px 16px;margin-bottom:8px;background:var(--surface-2);border:2px solid transparent;border-radius:var(--r-md);cursor:pointer;transition:.15s var(--ease);font-weight:700;font-size:14px;}
.opt:hover{background:var(--brand-50);border-color:var(--brand-200)}
html.dark .opt:hover{background:rgba(37,99,235,.15)}
.opt.selected{background:var(--brand-50);border-color:var(--brand-500);color:var(--brand-700)}
html.dark .opt.selected{background:rgba(37,99,235,.25);color:#93c5fd}
.opt .radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--bd);flex:0 0 20px;display:grid;place-items:center;background:var(--surface);}
.opt.selected .radio{border-color:var(--brand-500);background:var(--brand-500)}
.opt.selected .radio::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff;}

/* Result */
.result-card{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-xl);padding:32px 20px;text-align:center;box-shadow:var(--sh);margin-bottom:20px;position:relative;overflow:hidden;}
.result-card::before{content:"";position:absolute;top:-40%;left:50%;transform:translateX(-50%);width:120%;height:200%;background:radial-gradient(circle,rgba(59,130,246,.08),transparent 60%);pointer-events:none;}
.score-ring{width:160px;height:160px;margin:0 auto 20px;border-radius:50%;background:conic-gradient(var(--brand-500) 0turn 0.85turn, var(--surface-3) 0.85turn 1turn);display:grid;place-items:center;position:relative;box-shadow:var(--sh-glow);}
.score-ring::before{content:"";position:absolute;inset:12px;background:var(--surface);border-radius:50%;}
.score-val{position:relative;font-size:44px;font-weight:900;letter-spacing:-2px;background:var(--grad-brand);-webkit-background-clip:text;background-clip:text;color:transparent}
.result-title{font-size:20px;font-weight:900;margin-bottom:6px}
.result-sub{font-size:14px;color:var(--mu);font-weight:600}

/* Library / News cards */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.lib-card,.news-card{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh-sm);transition:.2s var(--ease);cursor:pointer;}
.lib-card:hover,.news-card:hover{transform:translateY(-3px);box-shadow:var(--sh-lg)}
.lib-cover{aspect-ratio:4/5;background:var(--grad-cool);display:grid;place-items:center;color:#fff;font-size:44px;position:relative;overflow:hidden;}
.lib-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 50%,rgba(0,0,0,.3))}
.lib-body,.news-body{padding:12px 14px}
.lib-title,.news-title{font-weight:800;font-size:14px;line-height:1.4;color:var(--tx)}
.lib-meta,.news-meta{font-size:11px;color:var(--mu);font-weight:600;margin-top:4px}
.news-card{padding:16px}
.news-card .news-title{font-size:16px;margin-bottom:8px}
.news-card .news-text{font-size:14px;line-height:1.7;color:var(--tx-2);white-space:pre-wrap}
.news-card .news-footer{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12px;color:var(--mu);font-weight:700}

/* Games grid */
.games-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.game-tile{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-lg);padding:20px 16px;text-align:center;cursor:pointer;transition:.2s var(--ease);display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:var(--sh-sm);}
.game-tile:hover{transform:translateY(-4px);border-color:var(--brand-200);box-shadow:var(--sh-lg)}
.game-icon{width:60px;height:60px;border-radius:20px;background:var(--grad-brand);display:grid;place-items:center;font-size:28px;margin-bottom:6px;box-shadow:var(--sh-glow);}
.game-icon.purple{background:linear-gradient(135deg,#8b5cf6,#ec4899)}
.game-icon.cyan{background:var(--grad-cool)}
.game-icon.warm{background:var(--grad-warm)}
.game-name{font-weight:800;font-size:15px;color:var(--tx)}
.game-desc{font-size:12px;color:var(--mu);font-weight:600;line-height:1.5}

/* Settings */
.settings-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.setting-tile{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r-md);padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:.2s var(--ease);text-align:center;}
.setting-tile:hover{border-color:var(--brand-200);transform:translateY(-2px);box-shadow:var(--sh)}
.setting-icon{width:44px;height:44px;border-radius:14px;background:var(--brand-50);color:var(--brand-600);display:grid;place-items:center;}
html.dark .setting-icon{background:rgba(37,99,235,.2);color:#93c5fd}
.setting-icon svg{width:22px;height:22px;fill:currentColor}
.setting-tile span{font-weight:800;font-size:13px;color:var(--tx)}

/* Profile header */
.profile-header{background:var(--grad-brand);color:#fff;border-radius:var(--r-xl);padding:30px 24px;text-align:center;position:relative;overflow:hidden;box-shadow:var(--sh-glow);margin-bottom:18px;}
.profile-header::before{content:"";position:absolute;top:-60px;right:-60px;width:200px;height:200px;background:radial-gradient(circle,rgba(255,255,255,.2),transparent 70%);border-radius:50%;}
.profile-avatar{width:100px;height:100px;border-radius:50%;border:4px solid rgba(255,255,255,.35);margin:0 auto 14px;display:block;position:relative;z-index:1;box-shadow:0 8px 20px rgba(0,0,0,.2);object-fit:cover;}
.profile-name{font-size:20px;font-weight:900;margin-bottom:4px;position:relative;z-index:1}
.profile-phone{font-size:13px;opacity:.85;direction:ltr;font-weight:600;position:relative;z-index:1}
.profile-role{display:inline-block;margin-top:12px;background:rgba(255,255,255,.2);padding:5px 14px;border-radius:var(--r-full);font-size:12px;font-weight:800;position:relative;z-index:1;border:1px solid rgba(255,255,255,.25);}

/* Admin tabs */

function img(f,maxSize=800){
  return new Promise((resolve,reject)=>{
    if(!f)return resolve(null);
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error('تعذر قراءة الصورة'));
    reader.onload=e=>{
      const im=new Image();
      im.onload=()=>{
        try{
          let w=im.width,h=im.height;
          if(w>maxSize||h>maxSize){const ratio=Math.min(maxSize/w,maxSize/h);w=Math.max(1,Math.round(w*ratio));h=Math.max(1,Math.round(h*ratio))}
          const c=document.createElement('canvas');c.width=w;c.height=h;
          c.getContext('2d').drawImage(im,0,0,w,h);
          let data;try{data=c.toDataURL('image/jpeg',0.8)}catch(err){data=c.toDataURL('image/png')}
          if(!data||data==='data:,')return reject(new Error('تعذر معالجة الصورة'));
          resolve(data);
        }catch(err){reject(err)}
      };
      im.onerror=()=>reject(new Error('صيغة الصورة غير مدعومة'));
      im.src=e.target.result;
    };
    reader.readAsDataURL(f);
  });
}

function userSeed(){const s=U?.uid||'anon';let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h}
function userShuffle(arr,offset=0){const a=[...arr];let s=(userSeed()+offset)>>>0;for(let i=a.length-1;i>0;i--){s=(s*1664525+1013904223)>>>0;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
const shuffle=arr=>{const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function ytId(u){try{const url=new URL(u);const host=url.hostname.replace(/^(www\.|m\.)/,'');let id='';if(host==='youtu.be')id=url.pathname.slice(1).split('/')[0];else if(host==='youtube.com'||host==='youtube-nocookie.com'||host==='music.youtube.com'){if(url.pathname==='/watch')id=url.searchParams.get('v')||'';else{const m=url.pathname.match(/^\/(embed|shorts|live|v)\/([\w-]+)/);if(m)id=m[2]}}return /^[\w-]{11}$/.test(id)?id:''}catch(e){return ''}}
function embed(u,full){
  u=String(u||'').trim();
  if(!/^https?:\/\//i.test(u))return{t:'f',s:''};
  const yt=ytId(u);
  if(yt){
    const origin=location.origin&&location.origin.startsWith('http')?'&origin='+encodeURIComponent(location.origin):'';
    const base=full?'rel=0&playsinline=1&modestbranding=1&enablejsapi=1&cc_load_policy=0':'rel=0&playsinline=1&modestbranding=1&enablejsapi=1&controls=0&showinfo=0&iv_load_policy=3&fs=0&disablekb=1&cc_load_policy=0';
    return{t:'yt',id:yt,s:`https://www.youtube-nocookie.com/embed/${yt}?${base}${origin}`};
  }
  const dm=u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:.*&)?id=)([\w-]+)/);
  if(dm)return{t:'drive',s:`https://drive.google.com/file/d/${dm[1]}/preview`,id:dm[1]};
  if(/\.(mp4|webm|ogg|m4v)(\?|#|$)/i.test(u))return{t:'v',s:u};
  return{t:'f',s:u};
}

async function enforceSingleDevice(){
  if(A||IS_SUPERVISOR||!U)return true;
  const uid=U.uid,devId=getDeviceId(),now=Date.now();
  try{
    const userData=await G('users/'+uid);
    const phone=normPhone(userData?.phone||myPhone||'');
    const sessionRef=R('sessions/'+uid);
    const claim=await runTransaction(sessionRef,current=>{
      const cur=current||{};
      const active=!!cur.deviceId&&Number(cur.updatedAt||0)>0&&now-Number(cur.updatedAt||0)<24*60*60*1000;
      if(active&&cur.deviceId!==devId)return;
      return {deviceId:devId,deviceLabel:deviceLabel(),updatedAt:now,name:userData?.name||U.displayName||'',email:userData?.email||U.email||'',phone};
    },{applyLocally:false});
    if(claim.committed)return true;
    const cur=claim.snapshot?.val()||{};
    if(!cur.deviceId||cur.deviceId===devId)return true;
    const rec={uid,name:userData?.name||U.displayName||'',email:userData?.email||U.email||'',photo:userData?.photo||myPhoto||'',phone,oldDevice:cur.deviceId,oldDeviceLabel:cur.deviceLabel||'',newDevice:devId,newDeviceLabel:deviceLabel(),bannedAt:now,reason:'تسجيل دخول من جهاز آخر — حظر تلقائي',auto:true};
    const incidentId='a'+now.toString(36)+Math.random().toString(36).slice(2,8);
    try{
      await set(R('bans/'+uid),rec);

async function doRedeem(vid){

function vTakeExam(){
  const e=exams[S.id];if(!e)return vExams();
  const att=examAttempts[S.id];if(att)return vExamResult();
  cleanupExam();
  armScreenshotGuard();
  activeExamState={id:S.id,startedAt:Date.now(),violations:0,answers:{},submitted:false};
  const questions=e.questions||[];
  const preventCopy=ev=>{ev.preventDefault();return false};
  const onVis=()=>{if(document.hidden&&activeExamState&&!activeExamState.submitted){activeExamState.violations++;toast('⚠️ تم تسجيل خروجك من التبويب');submitExam(true,'visibility')}};
  const onBlur=()=>{if(activeExamState&&!activeExamState.submitted){activeExamState.violations++;toast('⚠️ فقدت التركيز');submitExam(true,'blur')}};
  const onUnload=()=>{if(activeExamState&&!activeExamState.submitted){activeExamState.violations++;try{submitExam(true,'unload')}catch(err){}}};
  const onScreenshotKey=ev=>{const k=(ev.key||'').toLowerCase();if(k==='printscreen'){ev.preventDefault();if(activeExamState&&!activeExamState.submitted){activeExamState.violations++;toast('⚠️ محاولة لقطة شاشة');submitExam(true,'screenshot')}}};
  document.addEventListener('copy',preventCopy);document.addEventListener('cut',preventCopy);document.addEventListener('paste',preventCopy);document.addEventListener('contextmenu',preventCopy);
  document.addEventListener('visibilitychange',onVis);window.addEventListener('blur',onBlur);window.addEventListener('pagehide',onUnload);window.addEventListener('keydown',onScreenshotKey,true);
  examGuardCleanup=()=>{document.removeEventListener('copy',preventCopy);document.removeEventListener('cut',preventCopy);document.removeEventListener('paste',preventCopy);document.removeEventListener('contextmenu',preventCopy);document.removeEventListener('visibilitychange',onVis);window.removeEventListener('blur',onBlur);window.removeEventListener('pagehide',onUnload);window.removeEventListener('keydown',onScreenshotKey,true);disarmScreenshotGuard()};
  const startMs=Date.now();const totalMs=e.duration*60*1000;
  activeExamTimer=setInterval(()=>{
    if(!activeExamState||activeExamState.submitted){clearInterval(activeExamTimer);return}
    const left=totalMs-(Date.now()-startMs);
    const timerEl=document.getElementById('examTimer');
    if(timerEl){const big=timerEl.querySelector('.time-big');if(big)big.textContent=fmtClock(Math.max(0,left/1000));timerEl.classList.remove('warn','danger');if(left<=30000)timerEl.classList.add('danger');else if(left<=120000)timerEl.classList.add('warn')}
    if(left<=0){clearInterval(activeExamTimer);toast('انتهى وقت الامتحان');submitExam(true,'timeout')}
  },250);
  const seedStr=`${U.uid}_${S.id}`;let seed=0;for(let i=0;i<seedStr.length;i++)seed=(seed*31+seedStr.charCodeAt(i))>>>0;
  const questionOrder=userShuffle(questions.map((_,i)=>i),seed);
  const displayQuestions=questionOrder.map((origIdx,di)=>{const q=questions[origIdx];if(q.type==='mcq'){const optOrder=userShuffle(q.options.map((_,j)=>j),seed+origIdx);return {origIdx,q,optOrder}}return {origIdx,q}});
  const qHTML=displayQuestions.map(({origIdx,q,optOrder},di)=>{
    const num=di+1;const ptsBadge=`<span class="badge brand">${q.points||1} نقطة</span>`;
    if(q.type==='mcq')return `<div class="question-card"><div class="q-text"><span class="q-num">${num}</span> ${esc(q.text)} ${ptsBadge}</div>${optOrder.map(origOptIdx=>`<label class="opt"><input type="radio" name="q_${origIdx}" value="${origOptIdx}" onchange="recordAnswer(${origIdx},${origOptIdx})" style="display:none"><div class="radio"></div><span>${esc(q.options[origOptIdx])}</span></label>`).join('')}</div>`;
    if(q.type==='tf')return `<div class="question-card"><div class="q-text"><span class="q-num">${num}</span> ${esc(q.text)} ${ptsBadge}</div><label class="opt"><input type="radio" name="q_${origIdx}" value="true" onchange="recordAnswer(${origIdx},true)" style="display:none"><div class="radio"></div><span>صح</span></label><label class="opt"><input type="radio" name="q_${origIdx}" value="false" onchange="recordAnswer(${origIdx},false)" style="display:none"><div class="radio"></div><span>خطأ</span></label></div>`;
    return `<div class="question-card"><div class="q-text"><span class="q-num">${num}</span> ${esc(q.text)} ${ptsBadge}</div><textarea placeholder="اكتب إجابتك هنا..." oninput="recordAnswer(${origIdx},this.value)" rows="3" style="width:100%;padding:12px;border:1px solid var(--bd);border-radius:var(--r-md);font-family:inherit"></textarea></div>`;
  }).join('');
  return `<div class="section-head"><button class="section-link" onclick="confirmExitExam()">← خروج</button></div><h2 style="font-size:18px;margin-bottom:16px">${esc(e.title)}</h2><div class="exam-timer" id="examTimer"><span>الوقت المتبقي</span><span class="time-big">${fmtClock(e.duration*60)}</span></div>${qHTML}<button class="btn block" onclick="submitExam(false)" style="margin-top:16px">تسليم الامتحان</button>`;
}
function recordAnswer(i,val){
  if(!activeExamState)return;
  activeExamState.answers[i]=val;
  document.querySelectorAll(`input[name="q_${i}"]`).forEach(inp=>{const opt=inp.closest('.opt');if(opt)opt.classList.toggle('selected',inp.checked)});
}
function confirmExitExam(){if(!activeExamState)return go('exams');if(!confirm('هل تريد الخروج من الامتحان؟ سيتم تسليم محاولتك تلقائياً.'))return;submitExam(true,'exit')}
function cleanupExam(){if(activeExamTimer){clearInterval(activeExamTimer);activeExamTimer=null}if(examGuardCleanup){try{examGuardCleanup()}catch(e){}examGuardCleanup=null}if(activeExamState){activeExamState=null}}
let submitLock=false;
async function submitExam(force,reason){
  const st=activeExamState;if(!st||st.submitted||submitLock)return;
  if(!force&&!confirm('هل أنت متأكد من تسليم الامتحان؟'))return;
  submitLock=true;st.submitted=true;
  const e=exams[st.id];if(!e){cleanupExam();submitLock=false;return}
  const questions=e.questions||[];let earned=0,totalPoints=0;const answers=[];
  questions.forEach((q,i)=>{const pts=+q.points||1;totalPoints+=pts;const ans=st.answers[i];let isCorrect=false;if(q.type==='mcq')isCorrect=(ans===q.correct);else if(q.type==='tf')isCorrect=(ans===q.correct);else isCorrect=(String(ans||'').trim().toLowerCase()===String(q.correct||'').trim().toLowerCase()&&!!q.correct);if(isCorrect)earned+=pts;answers.push({q:i,ans:ans??null,correct:isCorrect,points:pts,earned:isCorrect?pts:0})});
  const score=totalPoints?Math.round(earned/totalPoints*100):0;
  const timeTaken=Math.round((Date.now()-st.startedAt)/1000);
  const attempt={studentUid:U.uid,studentName:U.displayName||'',score,earned,totalPoints,answers,timeTaken,violations:st.violations,submittedAt:Date.now(),autoSubmit:!!force,reason:reason||''};
  const examId=st.id;
  try{await set(R('examAttempts/'+U.uid+'/'+examId),attempt)}catch(err){st.submitted=false;submitLock=false;toast('تعذر حفظ الإجابة');return}
  cleanupExam();submitLock=false;examAttempts[examId]=attempt;go('examResult',examId);
}

async function vAdminStudents(){
  if(!A)return '<div class="muted">غير مصرح.</div>';
  if(!studentsLiveUnsub){
    studentsState={users:studentsCache||{},bans:{},bansByPhone:{},usersLoaded:false,bansLoaded:false,phonesLoaded:false,error:null};
    const paint=()=>{studentsCache=studentsState.users||{};adminUsersList=studentsCache;const box=document.getElementById('studentsLiveBox');if(box&&S.v==='admin'&&S.tab==='students'){if(studentsState.usersLoaded){box.innerHTML=buildStudentsHTML(studentsState.users,studentsState.bans,studentsState.bansByPhone)}}};
    const subscribe=(path,key,loadedKey)=>{const unsub=onValue(R(path),snap=>{studentsState[key]=snap.val()||{};studentsState[loadedKey]=true;if(key==='users'){studentsCache=studentsState.users;adminUsersList=studentsCache}studentsState.error=null;paint()},err=>{studentsState.error=err?.message||'error';paint()});studentsLiveUnsubs.push(unsub)};
    subscribe('users','users','usersLoaded');subscribe('bans','bans','bansLoaded');subscribe('bansByPhone','bansByPhone','phonesLoaded');
    studentsLiveUnsub=()=>{studentsLiveUnsubs.forEach(fn=>{try{fn()}catch(e){}});studentsLiveUnsubs=[];studentsLiveUnsub=null};
  }
  if(!studentsState.usersLoaded){const first=await GTry('users');if(!first.ok)return `<div class="muted">تعذر التحميل: ${esc(first.error)}</div>`;studentsState.users=first.val||{};studentsState.usersLoaded=true;studentsCache=studentsState.users;adminUsersList=studentsCache}
  return `<div id="studentsLiveBox">${buildStudentsHTML(studentsState.users,studentsState.bans,studentsState.bansByPhone)}</div>`;
}
function buildStudentsHTML(users,bans,bansByPhone){
  bans=bans||{};bansByPhone=bansByPhone||{};
  const arr=Object.entries(users||{}).filter(([id,u])=>!!u&&typeof u==='object').map(([id,u])=>({id,...u})).sort((a,b)=>(Number(b.createdAt)||0)-(Number(a.createdAt)||0));
  if(!arr.length)return `<div class="muted">لا يوجد طلاب مسجلون بعد.</div>`;
  let html=`<div class="stat-row" style="margin-bottom:16px"><div class="stat"><div class="stat-num">${arr.length}</div><div class="stat-label">إجمالي الطلاب</div></div></div><div class="field"><input id="searchStudent" placeholder="بحث: الاسم / الهاتف..." oninput="filterStudents(this.value)"></div><div class="list">`;
  for(const u of arr){
    const isAdmin=isAdminPhone(u.phone||'');
    const isBanned=!!(bans[u.id]||(u.phone&&bansByPhone[normPhone(u.phone)]));
    const searchStr=normDigits([u.name,u.phone,u.email].filter(Boolean).join(' ')).toLowerCase();
    html+=`<div class="video-row student-row" data-search="${esc(searchStr)}"><div class="video-thumb" style="background:${u.photo?'transparent':'var(--grad-brand)'}">${u.photo?`<img src="${esc(u.photo)}" style="width:100%;height:100%;object-fit:cover;border-radius:12px">`:'👤'}</div><div class="video-body"><div class="video-title">${esc(u.name||'-')}</div><div class="video-meta" dir="ltr">${esc(u.phone||'-')} ${isAdmin?'<span class="badge er">أدمن</span>':isBanned?'<span class="badge er">محظور</span>':'<span class="badge">طالب</span>'}</div></div></div>`;
  }
  return html+`</div>`;
}
function filterStudents(q){const query=String(q||'').toLowerCase().trim();document.querySelectorAll('.student-row').forEach(row=>{const match=(row.getAttribute('data-search')||'').includes(query);row.style.display=match?'':'none'})}

/* Games Helpers */
function resetGames(){
  if(quizTimer){clearTimeout(quizTimer);quizTimer=null}
  quizActiveLevel=null;quizCurrentIndex=0;quizAnswered=false;window._quizOrder=null;
  labActiveLab=null;labCurrentExpIdx=0;labSelectedEls=[];labSelectedTool=null;labShowingResult=false;labLastResult=null;
  freeLab={els:[],tool:null,result:null};
  memState=null;huntState=null;orderState=null;balState=null;
  whoState=null;tfState=null;speedState=null;
}
function openGame(key){if(!isLabOn(key))return toast('هذه اللعبة موقوفة حالياً');resetGames();if(key==='memory')memStart();else if(key==='hunt')huntStart();else if(key==='order')orderStart();else if(key==='balance')balStart();else if(key==='who')whoStart();else if(key==='tf')tfStart();else if(key==='speed')speedStart();go('games','',key)}
function gameBack(){resetGames();go('games','','hub')}
function openLabHub(){if(!isLabOn('lab'))return toast('المختبر موقوف حالياً');resetGames();go('games','','lab')}
function openLab(lab){if(!LAB_EXPERIMENTS[lab])return;if(!isLabOn('lab'))return toast('المختبر موقوف حالياً');resetGames();const d=labDone(lab);labActiveLab=lab;labCurrentExpIdx=d>=LAB_EXPERIMENTS[lab].length?0:d;go('games','','lab')}
function openFree(){if(!isLabOn('free'))return toast('هذه اللعبة موقوفة حالياً');resetGames();go('games','','free')}
function gameTop(action,label,badges=''){return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><button class="section-link" onclick="${action}">← ${label}</button><div style="display:flex;gap:6px">${badges}</div></div>`}
function gameHeader(title,sub){const pts=U?arcadePoints(U.uid):0;return `<div class="hero"><div class="hero-content"><div class="hero-eyebrow">🧪 مختبر سيجما</div><div class="hero-title">${esc(title)}</div><div class="hero-desc">${esc(sub)}</div><div class="hero-stats"><div class="hero-stat"><b>${pts}</b><span>نقاطك</span></div></div></div></div>`}
function resultCard(title,score,again){return `<div class="result-card"><div style="font-size:56px;margin-bottom:10px">🎉</div><h2 style="font-size:22px;margin-bottom:10px">${esc(title)}</h2><div style="font-size:28px;font-weight:900;color:var(--brand-600);margin:10px 0">النتيجة: ${score}</div><div style="display:flex;gap:8px;justify-content:center;margin-top:20px"><button class="btn" onclick="openGame('${again}')">العب مرة أخرى</button><button class="btn ghost" onclick="gameBack()">الألعاب</button></div></div>`}
function arcadeBoard(){const ids=new Set([...Object.keys(arcadeData),...Object.keys(quizLeaderData||{})]);const rows=[...ids].map(uid=>({name:arcadeData[uid]?.name||quizLeaderData?.[uid]?.name||'طالب',points:arcadePoints(uid)})).filter(r=>r.points>0).sort((a,b)=>b.points-a.points).slice(0,10);if(!rows.length)return '';return `<div class="question-card" style="margin-top:20px"><h3 style="font-size:16px;margin-bottom:14px">🏆 لوحة المتصدرين</h3><div class="list">${rows.map((r,i)=>`<div class="row-between" style="padding:10px 12px;border-bottom:1px solid var(--bd)"><span>${i+1}. ${esc(r.name)}</span><b style="color:var(--brand-600)">${r.points}</b></div>`).join('')}</div></div>`}
async function saveArcade(game,score){if(!U||!canPlayNow())return;const cur=arcadeData[U.uid]||{};const best={...(cur.best||{})};best[game]=Math.max(best[game]||0,score);const next={name:U.displayName||'طالب',best,points:Object.values(best).reduce((s,v)=>s+v,0),lastPlayed:Date.now()};arcadeData={...arcadeData,[U.uid]:next};try{await set(R('arcade/'+U.uid),next)}catch(e){}}
async function saveLabData(){if(!U||!canPlayNow())return;try{await set(R('labGame/'+U.uid),{name:U.displayName||'طالب',labs:labUserData.labs||{},discoveries:labUserData.discoveries||0,lastPlayed:Date.now()})}catch(e){}}
async function saveQuizProgress(d){if(!U||!canPlayNow())return;const cur={...(quizLeaderData[U.uid]||{})};cur.points=(cur.points||0)+(d.points||0);cur.correct=(cur.correct||0)+(d.correct||0);cur.wrong=(cur.wrong||0)+(d.wrong||0);cur.levels={...(cur.levels||{})};if(d.level&&!cur.levels[d.level]){cur.levels[d.level]=true;cur.points+=50}cur.name=U.displayName||'طالب';cur.lastPlayed=Date.now();quizLeaderData={...quizLeaderData,[U.uid]:cur};try{await set(R('quizGame/'+U.uid),cur)}catch(e){}}

function labPick(el){if(labShowingResult)return;if(labSelectedEls.length>=4)return toast('الحد الأقصى 4 عناصر');labSelectedEls.push(el);labLastResult=null;render()}
function labUndo(){if(labShowingResult)return;labSelectedEls.pop();labLastResult=null;render()}
function labClear(){if(labShowingResult)return;labSelectedEls=[];labSelectedTool=null;labLastResult=null;render()}
function labTool(t){if(labShowingResult)return;labSelectedTool=labSelectedTool===t?null:t;labLastResult=null;render()}
function labRun(){const exp=LAB_EXPERIMENTS[labActiveLab]?.[labCurrentExpIdx];if(!exp||labShowingResult)return;if(!labSelectedEls.length||!labSelectedTool)return toast('اختر العناصر والأداة أولاً');const ok=sameItems(exp.elements,labSelectedEls)&&labSelectedTool===exp.tool;if(ok){labShowingResult=true;labLastResult={correct:true,formula:exp.formula,result:exp.result,desc:exp.desc};if(canPlayNow()){labUserData.discoveries=(labUserData.discoveries||0)+1;labUserData.labs={...(labUserData.labs||{}),[labActiveLab]:Math.max(labDone(labActiveLab),labCurrentExpIdx+1)};saveLabData()}}else{labLastResult={correct:false,formula:'لا يحدث تفاعل متوقع',result:'العناصر أو الأداة غير مناسبة لهذه التجربة',desc:''}}render()}
function labNext(){labCurrentExpIdx++;labSelectedEls=[];labSelectedTool=null;labShowingResult=false;labLastResult=null;render()}
function labBack(){labActiveLab=null;labCurrentExpIdx=0;labSelectedEls=[];labSelectedTool=null;labShowingResult=false;labLastResult=null;render()}
function freePick(el){const idx=freeLab.els.indexOf(el);if(idx>=0)freeLab.els.splice(idx,1);else if(freeLab.els.length<2)freeLab.els.push(el);freeLab.result=null;render()}
function freeTool(t){freeLab.tool=freeLab.tool===t?null:t;freeLab.result=null;render()}
function freeRun(){if(freeLab.els.length!==2)return toast('اختر عنصرين');const [a,b]=freeLab.els;const pairs=FREE_LAB_REACTIONS.filter(r=>(r.el1===a&&r.el2===b)||(r.el1===b&&r.el2===a));if(!pairs.length){freeLab.result={none:true,text:'هذان العنصران لا يتفاعلان معاً في الظروف العادية.'};render();return}const withTool=freeLab.tool?pairs.find(r=>r.tool===freeLab.tool):null;if(freeLab.tool&&!withTool){freeLab.result={none:true,text:'هذه الأداة لا تنتج تفاعلاً مع هذين العنصرين.'};render();return}const r=withTool||pairs[0];freeLab.result={formula:r.formula,explain:r.explain};render()}
function freeReset(){freeLab={els:[],tool:null,result:null};render()}

function quizStart(level){if(!isLabOn('quiz'))return toast('اللعبة موقوفة حالياً');if(!QUIZ_QUESTIONS[level])return;window._quizOrder=userShuffle(QUIZ_QUESTIONS[level].map((_,i)=>i),level.length*10);quizActiveLevel=level;quizCurrentIndex=0;quizAnswered=false;render()}
function quizExit(){if(quizTimer){clearTimeout(quizTimer);quizTimer=null}quizActiveLevel=null;quizCurrentIndex=0;quizAnswered=false;window._quizOrder=null;render()}
function quizAnswer(choice){if(quizAnswered||!quizActiveLevel)return;quizAnswered=true;const level=quizActiveLevel;const order=window._quizOrder||QUIZ_QUESTIONS[level].map((_,i)=>i);const origIdx=order[quizCurrentIndex];const q=QUIZ_QUESTIONS[level][origIdx];const optOrder=userShuffle(q.opts.map((_,i)=>i),origIdx+33);const displayCorrect=optOrder.indexOf(q.correct);const isCorrect=choice===displayCorrect;document.querySelectorAll('.quiz-opt').forEach((btn,i)=>{btn.disabled=true;if(i===displayCorrect)btn.classList.add('correct');else if(i===choice)btn.classList.add('wrong')});saveQuizProgress({points:isCorrect?10:0,correct:isCorrect?1:0,wrong:isCorrect?0:1});quizTimer=setTimeout(()=>{quizTimer=null;quizCurrentIndex++;if(quizCurrentIndex>=(window._quizOrder||[]).length){saveQuizProgress({level});quizActiveLevel=null;quizCurrentIndex=0}quizAnswered=false;render()},1500)}

function memStart(){if(!isLabOn('memory'))return;const cards=userShuffle(MEM_PAIRS.flatMap((p,i)=>[{pid:i,t:p.s},{pid:i,t:p.n}]),1);memState={cards,open:[],matched:[],moves:0,busy:false,done:false,score:0}}
function memFlip(i){const st=memState;if(!st||st.busy||st.done||st.open.includes(i)||st.matched.includes(i))return;st.open.push(i);if(st.open.length<2){render();return}st.moves++;st.busy=true;render();const [a,b]=st.open;setTimeout(()=>{if(memState!==st)return;if(st.cards[a].pid===st.cards[b].pid)st.matched.push(a,b);st.open=[];st.busy=false;if(st.matched.length===st.cards.length){st.done=true;st.score=Math.max(20,160-st.moves*4);saveArcade('memory',st.score)}render()},800)}
function huntStart(){if(!isLabOn('hunt'))return;const picks=userShuffle(ELEMENTS_DATA,1).slice(0,8);huntState={rounds:picks.map((t,idx)=>({target:t,opts:userShuffle([t,...userShuffle(ELEMENTS_DATA.filter(e=>e.s!==t.s),idx+10).slice(0,3)],idx+20)})),i:0,score:0,picked:null,done:false}}
function huntAnswer(sym){const st=huntState;if(!st||st.done||st.picked!==null)return;const r=st.rounds[st.i];st.picked=sym;if(sym===r.target.s)st.score+=10;render();setTimeout(()=>{if(huntState!==st)return;st.i++;st.picked=null;if(st.i>=st.rounds.length){st.done=true;saveArcade('hunt',st.score)}render()},900)}
function orderStart(){if(!isLabOn('order'))return;const rounds=[0,1,2].map(r=>userShuffle(ELEMENTS_DATA,r+100).slice(0,5));orderState={rounds,r:0,picked:[],mistakes:0,wrong:null,roundDone:false,score:0,done:false}}
function orderPick(sym){const st=orderState;if(!st||st.done||st.wrong||st.roundDone||st.picked.includes(sym))return;const items=st.rounds[st.r];const sorted=[...items].sort((a,b)=>a.z-b.z);const el=items.find(e=>e.s===sym);if(el.z===sorted[st.picked.length].z){st.picked.push(sym);if(st.picked.length===items.length){st.roundDone=true;st.score+=Math.max(5,30-st.mistakes*5)}}else{st.mistakes++;st.wrong=sym;setTimeout(()=>{if(orderState===st){st.wrong=null;render()}},600)}render()}
function orderNext(){const st=orderState;if(!st||!st.roundDone)return;st.r++;st.picked=[];st.mistakes=0;st.roundDone=false;if(st.r>=st.rounds.length){st.done=true;saveArcade('order',st.score)}render()}
function balCoefsFor(idx){const eq=BAL_EQUATIONS[idx];return Array(eq.left.length+eq.right.length).fill(1)}
function balStart(){if(!isLabOn('balance'))return;balState={idx:0,coefs:balCoefsFor(0),wrong:0,score:0,msg:'',done:false}}
function balStep(k,d){const st=balState;if(!st||st.done)return;st.coefs[k]=clamp(st.coefs[k]+d,1,6);st.msg='';render()}
function atomTotals(items,coefs,offset){const t={};items.forEach((it,k)=>Object.entries(it.a).forEach(([el,n])=>{t[el]=(t[el]||0)+coefs[offset+k]*n}));return t}
function isBalanced(eq,coefs){const L=atomTotals(eq.left,coefs,0),R=atomTotals(eq.right,coefs,eq.left.length);const keys=new Set([...Object.keys(L),...Object.keys(R)]);return [...keys].every(k=>(L[k]||0)===(R[k]||0))}
function balCheck(){const st=balState;if(!st||st.done)return;const eq=BAL_EQUATIONS[st.idx];if(isBalanced(eq,st.coefs)){st.score+=Math.max(2,10-st.wrong*2);st.idx++;st.wrong=0;st.msg='ok';if(st.idx>=BAL_EQUATIONS.length){st.done=true;saveArcade('balance',st.score)}else st.coefs=balCoefsFor(st.idx)}else{st.wrong++;st.msg='bad'}render()}
function whoStart(){if(!isLabOn('who'))return;whoState={rounds:userShuffle(WHO_AM_I,200).slice(0,5),i:0,score:0,picked:null,done:false}}
function whoAnswer(ans){const st=whoState;if(!st||st.done||st.picked!==null)return;st.picked=ans;if(ans===st.rounds[st.i].answer)st.score+=15;render();setTimeout(()=>{if(whoState!==st)return;st.i++;st.picked=null;if(st.i>=st.rounds.length){st.done=true;saveArcade('who',st.score)}render()},1000)}
function tfStart(){if(!isLabOn('tf'))return;tfState={rounds:userShuffle(TRUE_FALSE,300).slice(0,8),i:0,score:0,picked:null,done:false}}
function tfAnswer(val){const st=tfState;if(!st||st.done||st.picked!==null)return;st.picked=val;if(val===st.rounds[st.i].a)st.score+=10;render();setTimeout(()=>{if(tfState!==st)return;st.i++;st.picked=null;if(st.i>=st.rounds.length){st.done=true;saveArcade('tf',st.score)}render()},800)}
function speedStart(){if(!isLabOn('speed'))return;speedState={rounds:userShuffle(SPEED_QUIZ,400).slice(0,10),i:0,score:0,timeLeft:30,picked:null,done:false,timer:null};speedTick()}
function speedTick(){const st=speedState;if(!st||st.done)return;if(st.timer){clearInterval(st.timer);st.timer=null}st.timer=setInterval(()=>{if(speedState!==st||st.done){clearInterval(st.timer);st.timer=null;return}st.timeLeft--;if(st.timeLeft<=0){clearInterval(st.timer);st.timer=null;st.done=true;saveArcade('speed',st.score);render();return}if(S.v==='games'&&S.tab==='speed')render()},1000)}
function speedAnswer(ans){const st=speedState;if(!st||st.done||st.picked!==null)return;st.picked=ans;if(ans===st.rounds[st.i].a)st.score+=12;render();setTimeout(()=>{if(speedState!==st)return;st.i++;st.picked=null;if(st.i>=st.rounds.length){if(st.timer){clearInterval(st.timer);st.timer=null}st.done=true;saveArcade('speed',st.score)}render()},700)}

  return `${gameTop('labBack()','المختبرات',`<span class="badge brand">${esc(info.name)}</span><span class="badge warn">${labCurrentExpIdx+1}/${exps.length}</span>`)}<div class="question-card" style="text-align:center"><div style="font-size:32px;margin-bottom:10px">🎯</div><div style="font-size:15px;font-weight:800;color:var(--warn);margin-bottom:16px">${esc(exp.scenario)}</div><div style="background:var(--brand-50);border:2px dashed var(--brand-200);border-radius:16px;min-height:150px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;padding:20px;gap:12px;margin-bottom:14px">${tube}</div>${resultHTML}${controls}</div>`;

function vMemory(){
  const st=memState;if(!st)return '<div class="muted">اللعبة موقوفة</div>';
  if(st.done)return resultCard('مطابقة الرموز',st.score,'memory');
  const cells=st.cards.map((c,i)=>{const up=st.open.includes(i)||st.matched.includes(i);return `<button class="chip" style="width:100%;aspect-ratio:1;border-radius:14px;font-size:15px;background:${up?(st.matched.includes(i)?'#d1fae5':'var(--surface)'):'var(--grad-brand)'};color:${up?(st.matched.includes(i)?'#065f46':'var(--tx)'):'#fff'};border:2px solid ${up?'var(--brand-500)':'transparent'};display:flex;align-items:center;justify-content:center;text-align:center;padding:4px" onclick="memFlip(${i})">${up?esc(c.t):'?'}</button>`}).join('');
  return `${gameTop('gameBack()','الألعاب',`<span class="badge">المحاولات: ${st.moves}</span><span class="badge ok">${st.matched.length/2}/${MEM_PAIRS.length}</span>`)}<div class="question-card"><p style="text-align:center;font-weight:800;margin-bottom:16px;color:var(--tx-2)">اربط الرمز الكيميائي باسم العنصر</p><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:480px;margin:0 auto">${cells}</div></div>`;
}
function vHunt(){
  const st=huntState;if(!st)return '<div class="muted">اللعبة موقوفة</div>';
  if(st.done)return resultCard('صيد الرموز',st.score,'hunt');
  const r=st.rounds[st.i];
  return `${gameTop('gameBack()','الألعاب',`<span class="badge ok">النقاط: ${st.score}</span><span class="badge warn">${st.i+1}/${st.rounds.length}</span>`)}<div class="question-card"><div class="q-text" style="text-align:center;font-size:20px;margin-bottom:20px">ما رمز عنصر <b>${esc(r.target.n)}</b>؟</div><div style="display:flex;flex-direction:column;gap:10px">${r.opts.map(e=>{const cls=st.picked===null?'':e.s===r.target.s?'ok':e.s===st.picked?'er':'';return `<button class="opt ${cls?'selected':''}" style="justify-content:center;font-size:18px" ${st.picked!==null?'disabled':''} onclick="huntAnswer('${e.s}')">${esc(e.s)}</button>`}).join('')}</div></div>`;

function vOrder(){
  const st=orderState;if(!st)return '<div class="muted">اللعبة موقوفة</div>';
  if(st.done)return resultCard('رتّب العناصر',st.score,'order');
  const items=st.rounds[st.r];const chain=st.picked.map(s=>{const e=items.find(x=>x.s===s);return `<span class="chip" style="background:#0891b2">${esc(e.s)}${st.roundDone?` (${e.z})`:''}</span>`}).join('');
  return `${gameTop('gameBack()','الألعاب',`<span class="badge ok">النقاط: ${st.score}</span><span class="badge warn">الجولة ${st.r+1}/${st.rounds.length}</span>`)}<div class="question-card"><p style="text-align:center;font-weight:800;margin-bottom:14px">رتّب العناصر من الأصغر إلى الأكبر في العدد الذري</p><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:44px;margin-bottom:14px">${chain||'<span style="color:var(--mu)">ابدأ بالعنصر الأصغر</span>'}</div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px">${items.map(e=>{const p=st.picked.includes(e.s);return `<button class="btn ${p?'ok':'ghost'}" style="${st.wrong===e.s?'background:var(--er);color:#fff':''}" ${p||st.roundDone||st.wrong?'disabled':''} onclick="orderPick('${e.s}')"><b style="font-size:18px">${esc(e.s)}</b><small style="font-size:11px">${esc(e.n)}</small></button>`}).join('')}</div>${st.roundDone?`<div style="text-align:center;margin-top:14px"><button class="btn" onclick="orderNext()">${st.r+1>=st.rounds.length?'إنهاء اللعبة':'الجولة التالية'}</button></div>`:''}</div>`;

function vBalance(){
  const st=balState;if(!st)return '<div class="muted">اللعبة موقوفة</div>';
  if(st.done)return resultCard('موازنة المعادلات',st.score,'balance');
  const eq=BAL_EQUATIONS[st.idx];const off=eq.left.length;
  const item=(it,k)=>`<div style="display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--bd);border-radius:14px;padding:10px 12px"><div style="display:flex;gap:6px;align-items:center"><button class="chip" style="background:var(--brand-500);width:28px;height:28px" onclick="balStep(${k},-1)">−</button><span style="font-size:18px;font-weight:900;color:var(--brand-600)">${st.coefs[k]}</span><button class="chip" style="background:var(--brand-500);width:28px;height:28px" onclick="balStep(${k},1)">+</button></div><span style="direction:ltr;font-size:16px">${esc(it.f)}</span></div>`;
  const msg=st.msg==='ok'?'<div style="background:#d1fae5;color:#065f46;padding:10px;border-radius:12px;text-align:center;font-weight:800;margin-bottom:10px">أحسنت! المعادلة متوازنة</div>':st.msg==='bad'?'<div style="background:#fee2e2;color:#991b1b;padding:10px;border-radius:12px;text-align:center;font-weight:800;margin-bottom:10px">المعادلة غير متوازنة بعد</div>':'';
  return `${gameTop('gameBack()','الألعاب',`<span class="badge ok">النقاط: ${st.score}</span><span class="badge warn">${st.idx+1}/${BAL_EQUATIONS.length}</span>`)}<div class="question-card"><p style="text-align:center;font-weight:800;margin-bottom:14px">عدّل المعاملات حتى تتساوى الذرات</p>${msg}<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:18px 0">${eq.left.map((it,k)=>item(it,k)).join('<span style="font-size:22px;color:var(--mu)">+</span>')}<span style="font-size:22px;color:var(--mu)">→</span>${eq.right.map((it,k)=>item(it,off+k)).join('<span style="font-size:22px;color:var(--mu)">+</span>')}</div><div style="text-align:center"><button class="btn" onclick="balCheck()">تحقق</button></div></div>`;
}
function vWho(){
  const st=whoState;if(!st)return '<div class="muted">اللعبة موقوفة</div>';
  if(st.done)return resultCard('من أنا؟',st.score,'who');
  const r=st.rounds[st.i];const opts=userShuffle([r.answer,...userShuffle(WHO_AM_I.map(x=>x.answer).filter(a=>a!==r.answer),st.i+50).slice(0,3)],st.i+60);
  return `${gameTop('gameBack()','الألعاب',`<span class="badge ok">النقاط: ${st.score}</span><span class="badge warn">${st.i+1}/${st.rounds.length}</span>`)}<div class="question-card"><div style="background:#fef3c7;border:2px solid var(--warn);border-radius:14px;padding:16px;margin-bottom:16px">${r.clues.map(c=>`<div style="font-size:14px;font-weight:800;color:#92400e;margin-bottom:6px">• ${esc(c)}</div>`).join('')}</div><div style="display:flex;flex-direction:column;gap:10px">${opts.map(o=>{const cls=st.picked===null?'':o===r.answer?'ok':o===st.picked?'er':'';return `<button class="opt ${cls?'selected':''}" style="justify-content:center" ${st.picked!==null?'disabled':''} onclick="whoAnswer('${esc(o)}')">${esc(o)}</button>`}).join('')}</div></div>`;
}
function vTF(){
  const st=tfState;if(!st)return '<div class="muted">اللعبة موقوفة</div>';
  if(st.done)return resultCard('صح أم خطأ',st.score,'tf');
  const r=st.rounds[st.i];
  const mk=(val,label)=>{let cls='';if(st.picked!==null){if(val===r.a)cls='ok';else if(val===st.picked)cls='er'}return `<button class="opt ${cls?'selected':''}" style="justify-content:center" ${st.picked!==null?'disabled':''} onclick="tfAnswer(${val})">${label}</button>`};
  return `${gameTop('gameBack()','الألعاب',`<span class="badge ok">النقاط: ${st.score}</span><span class="badge warn">${st.i+1}/${st.rounds.length}</span>`)}<div class="question-card"><div class="q-text" style="text-align:center;font-size:20px;margin-bottom:20px">${esc(r.q)}</div><div style="display:flex;flex-direction:column;gap:10px">${mk(true,'✓ صح')}${mk(false,'✗ خطأ')}</div></div>`;
}
function vSpeed(){
  const st=speedState;if(!st)return '<div class="muted">اللعبة موقوفة</div>';

}

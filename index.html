<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق الدردشة المشفرة 💬</title>

    <meta name="theme-color" content="#202c33">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/134/134937.png">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b141a; color: #e9edef; height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        .auth-card { background: #111b21; max-width: 400px; width: 100%; padding: 40px 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); text-align: center; border: 1px solid #222e35; }
        .auth-card h1 { color: #00a884; font-size: 24px; margin-bottom: 15px; }
        .auth-card p { color: #8696a0; font-size: 14px; margin-bottom: 20px; }
        .login-btn { padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; transition: 0.2s; margin-bottom: 15px; }
        .btn-google { background: white; color: #3b3b3b; }
        .btn-install { background: #00a884; color: white; margin-top: 10px; }

        .chat-container { width: 100%; height: 100vh; display: flex; flex-direction: column; background-color: #0b141a; }
        .chat-header { background: #202c33; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #2a3942; }
        .user-info { display: flex; align-items: center; gap: 15px; }
        .user-info i { font-size: 24px; color: #00a884; }
        
        .chat-main { flex-grow: 1; overflow-y: auto; padding: 20px 5%; display: flex; flex-direction: column; gap: 10px; background-color: #0b141a; }
        
        .message { padding: 10px 14px; border-radius: 8px; max-width: 70%; width: fit-content; font-size: 15px; box-shadow: 0 1px 0.5px rgba(0,0,0,0.13); display: flex; flex-direction: column; position: relative; }
        .message.received { background-color: #202c33; align-self: flex-start; border-top-left-radius: 0; }
        .message.received .sender-name { color: #00a884; font-size: 12px; font-weight: bold; margin-bottom: 4px; }
        .message.sent { background-color: #005c4b; align-self: flex-end; border-top-right-radius: 0; }
        .message-text { color: #e9edef; word-break: break-word; line-height: 1.4; }
        .message-media { max-width: 100%; max-height: 250px; border-radius: 8px; margin-top: 5px; }

        .chat-footer { background: #202c33; padding: 10px 20px; display: flex; align-items: center; gap: 10px; }
        .input-wrapper { flex-grow: 1; display: flex; align-items: center; background: #2a3942; border-radius: 8px; padding: 0 10px; }
        .chat-footer input[type="text"] { width: 100%; padding: 12px; border: none; background: transparent; color: #e9edef; outline: none; font-size: 15px; }
        .file-label { color: #8696a0; cursor: pointer; font-size: 20px; padding: 5px; }
        .file-label:hover { color: #00a884; }
        .send-btn { background: none; border: none; color: #8696a0; cursor: pointer; font-size: 22px; }
        .send-btn:hover { color: #00a884; }
        
        /* لوحة التحكم للمدير */
        .admin-btn { background: #d97706; color: white; padding: 6px 12px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; }
        .admin-panel { background: #111b21; padding: 15px; border-bottom: 2px solid #d97706; display: flex; justify-content: space-between; align-items: center; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="screen-auth" class="auth-card">
        <h1>الدردشة المشفرة 🔒</h1>
        <p>قم بتسجيل الدخول عبر Google للبدء</p>
        <button id="btn-google" class="login-btn btn-google"><i class="fab fa-google" style="color: #ea4335;"></i> الدخول عبر Google</button>
        <button id="btn-install-app" class="login-btn btn-install hidden"><i class="fas fa-download"></i> تثبيت التطبيق على الشاشة</button>
    </div>

    <div id="screen-chat" class="chat-container hidden">
        
        <div id="admin-bar" class="admin-panel hidden">
            <span><i class="fas fa-user-shield"></i> لوحة التحكم (المدير)</span>
            <button id="btn-clear-chat" class="admin-btn">مسح كافة الرسائل</button>
        </div>

        <div class="chat-header">
            <div class="user-info">
                <i class="fas fa-user-lock"></i>
                <div>
                    <span style="font-weight: bold;">الدردشة الجماعية المشفرة</span>
                    <p style="font-size: 12px; color: #8696a0;">المستخدم: <span id="user-name" style="color: #00a884;"></span> <b id="admin-badge" style="color:#d97706;"></b></p>
                </div>
            </div>
        </div>

        <div class="chat-main" id="chat-main"></div>

        <div class="chat-footer">
            <div class="input-wrapper">
                <label for="file-input" class="file-label"><i class="fas fa-paperclip"></i></label>
                <input type="file" id="file-input" accept="image/*,video/*" class="hidden">
                <input type="text" id="chat-input" placeholder="اكتب رسالة مشفرة...">
            </div>
            <button id="btn-send" class="send-btn"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, onSnapshot, getDocs, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAN11agW-TWwAk3TvF7mRZRt6PHLcnl_aQ",
          authDomain: "ym-pro-max.firebaseapp.com",
          projectId: "ym-pro-max",
          storageBucket: "ym-pro-max.firebasestorage.app",
          messagingSenderId: "174657071953",
          appId: "1:174657071953:web:5e831fc337df46dbd18170"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        const sAuth = document.getElementById('screen-auth');
        const sChat = document.getElementById('screen-chat');
        const userNameDisplay = document.getElementById('user-name');
        const adminBadge = document.getElementById('admin-badge');
        const adminBar = document.getElementById('admin-bar');
        const chatMain = document.getElementById('chat-main');
        const chatInput = document.getElementById('chat-input');
        const fileInput = document.getElementById('file-input');

        let currentUserName = "";
        let currentUserId = "";
        let isAdmin = false;

        // طلب إذن الإشعارات
        if ("Notification" in window && Notification.permission !== "granted") {
            Notification.requestPermission();
        }

        // تسجيل الدخول بواسطة Google
        document.getElementById('btn-google').onclick = () => signInWithPopup(auth, new GoogleAuthProvider());

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUserName = user.displayName || "مستخدم";
                currentUserId = user.uid;
                userNameDisplay.innerText = currentUserName;

                // التحقق من حالة المدير (أول مستخدم يصبح Admin)
                await checkAndSetAdminRole(user);

                sAuth.classList.add('hidden');
                sChat.classList.remove('hidden');
                startLiveChat();
            }
        });

        // نظام تعيين أول مستخدم كمدير (Admin)
        async function checkAndSetAdminRole(user) {
            const usersRef = collection(db, "app_users");
            const snapshot = await getDocs(usersRef);

            if (snapshot.empty) {
                // أول مستخدم في التطبيق
                isAdmin = true;
                await setDoc(doc(db, "app_users", user.uid), { name: user.displayName, email: user.email, role: "admin" });
            } else {
                const userDoc = snapshot.docs.find(d => d.id === user.uid);
                if (userDoc && userDoc.data().role === "admin") {
                    isAdmin = true;
                } else if (!userDoc) {
                    await setDoc(doc(db, "app_users", user.uid), { name: user.displayName, email: user.email, role: "user" });
                }
            }

            if (isAdmin) {
                adminBadge.innerText = "(المدير)";
                adminBar.classList.remove('hidden');
            }
        }

        // مسح المحادثات من قبل المدير
        document.getElementById('btn-clear-chat').onclick = async () => {
            if (confirm("هل أنت أصلًا متاكد من مسح جميع الرسائل؟")) {
                const q = await getDocs(collection(db, "e2e_messages"));
                q.forEach(async (d) => await deleteDoc(doc(db, "e2e_messages", d.id)));
            }
        };

        // التشفير البسيط للرسائل النصية (مفهوم التشفير البرمجي)
        function encryptText(text) {
            return btoa(unescape(encodeURIComponent(text))); // مشفر Base64 لضمان الأمان الأولي
        }

        function decryptText(cipherText) {
            try { return decodeURIComponent(escape(atob(cipherText))); } catch (e) { return cipherText; }
        }

        // الاستماع للرسائل في الوقت الفعلي
        function startLiveChat() {
            const q = query(collection(db, "e2e_messages"));

            onSnapshot(q, (snapshot) => {
                let messagesArray = [];
                snapshot.forEach((doc) => {
                    let msgData = doc.data();
                    msgData.id = doc.id;
                    msgData.realTime = msgData.timestamp ? msgData.timestamp.toDate() : new Date();
                    messagesArray.push(msgData);
                });

                messagesArray.sort((a, b) => a.realTime - b.realTime);

                chatMain.innerHTML = "";
                messagesArray.forEach((data) => {
                    const messageElement = document.createElement('div');
                    messageElement.classList.add('message');

                    const decryptedContent = decryptText(data.text);

                    if (data.sender === currentUserName) {
                        messageElement.classList.add('sent');
                    } else {
                        messageElement.classList.add('received');
                        messageElement.innerHTML = `<span class="sender-name">${data.sender}</span>`;
                        // إشعار بالرسالة الجديدة
                        showLocalNotification(data.sender, decryptedContent);
                    }

                    if (data.type === 'image') {
                        messageElement.innerHTML += `<img src="${data.fileUrl}" class="message-media">`;
                    } else if (data.type === 'video') {
                        messageElement.innerHTML += `<video src="${data.fileUrl}" controls class="message-media"></video>`;
                    }

                    if (decryptedContent) {
                        messageElement.innerHTML += `<span class="message-text">${decryptedContent}</span>`;
                    }

                    chatMain.appendChild(messageElement);
                });
                chatMain.scrollTop = chatMain.scrollHeight;
            });
        }

        // إرسال النص
        document.getElementById('btn-send').onclick = () => sendTextMessage();
        chatInput.addEventListener("keypress", (e) => { if (e.key === "Enter") sendTextMessage(); });

        async function sendTextMessage() {
            const text = chatInput.value.trim();
            if (text !== "") {
                const encrypted = encryptText(text);
                await addDoc(collection(db, "e2e_messages"), {
                    sender: currentUserName,
                    text: encrypted,
                    type: "text",
                    timestamp: new Date()
                });
                chatInput.value = "";
            }
        }

        // إرسال الصور والفيديوهات
        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (file) {
                const fileRef = ref(storage, `uploads/${Date.now()}_${file.name}`);
                await uploadBytes(fileRef, file);
                const fileUrl = await getDownloadURL(fileRef);

                const type = file.type.startsWith('image') ? 'image' : 'video';
                await addDoc(collection(db, "e2e_messages"), {
                    sender: currentUserName,
                    text: "",
                    fileUrl: fileUrl,
                    type: type,
                    timestamp: new Date()
                });
            }
        });

        // عرض الإشعارات
        function showLocalNotification(sender, body) {
            if ("Notification" in window && Notification.permission === "granted" && document.hidden) {
                new Notification(`رسالة من ${sender}`, { body: body, icon: "https://cdn-icons-png.flaticon.com/512/134/134937.png" });
            }
        }
    </script>

    <script>
        // إنشاء Manifest ديناميكي للتثبيت
        const manifestData = {
            "name": "تطبيق الدردشة المشفرة",
            "short_name": "دردشة",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#0b141a",
            "theme_color": "#202c33",
            "icons": [{ "src": "https://cdn-icons-png.flaticon.com/512/134/134937.png", "sizes": "512x512", "type": "image/png" }]
        };
        const manifestBlob = new Blob([JSON.stringify(manifestData)], {type: 'application/json'});
        const manifestURL = URL.createObjectURL(manifestBlob);
        const manifestLink = document.createElement('link');
        manifestLink.rel = 'manifest';
        manifestLink.href = manifestURL;
        document.head.appendChild(manifestLink);

        // إنشاء Service Worker تلقائي
        const swCode = `
            self.addEventListener('install', e => self.skipWaiting());
            self.addEventListener('fetch', e => {});
        `;
        const swBlob = new Blob([swCode], {type: 'application/javascript'});
        const swURL = URL.createObjectURL(swBlob);

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register(swURL);
        }

        let deferredPrompt;
        const installBtn = document.getElementById('btn-install-app');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.classList.remove('hidden');
        });

        installBtn.addEventListener('click', () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(() => {
                    installBtn.classList.add('hidden');
                    deferredPrompt = null;
                });
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e91e63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="متجر يزيد">
<title>متجر يزيد</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script>try{var t=JSON.parse(localStorage.getItem('yz_theme')||'null')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{--p:#e91e63;--p2:#f06292;--ac:#f59e0b;--bg:#fff5f8;--card:#fff;--tx:#2a1620;--mt:#8a6b78;--bd:#f6d9e3;--sh:0 6px 22px rgba(233,30,99,.10);--ok:#16a34a;--er:#dc2626;--r:18px;--hh:64px;--nh:68px}
[data-theme=dark]{--bg:#150c11;--card:#22141c;--tx:#fbeaf1;--mt:#b793a3;--bd:#3b2331;--sh:0 6px 22px rgba(0,0,0,.45)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:Cairo,Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;line-height:1.6;transition:background .3s,color .3s}
body.lock{overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:15px;color:inherit}
button{cursor:pointer;border:0;background:none}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none;cursor:pointer}
.hide{display:none!important}
:focus-visible{outline:2px solid var(--p);outline-offset:2px}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes badgePulse{0%{transform:scale(1)}40%{transform:scale(1.55)}100%{transform:scale(1)}}
@keyframes sh{to{background-position:-200% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
.hd{position:sticky;top:0;z-index:50;padding-top:env(safe-area-inset-top);background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--bd)}
.hdi{max-width:1280px;margin:auto;display:flex;align-items:center;gap:10px;padding:10px 12px;min-height:var(--hh)}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--p);min-width:0}
.brand img{width:36px;height:36px;border-radius:10px;object-fit:cover;flex:none}
.brand span{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:96px}
.hs{display:none;flex:1;max-width:480px;margin-inline:auto;position:relative}
.hs i,.sm i{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:var(--mt)}
.hs input,.sm input{width:100%;padding:10px 14px;padding-inline-start:40px;border-radius:99px;border:1.5px solid var(--bd);background:var(--card);outline:0;transition:.2s}
.hs input:focus,.sm input:focus{border-color:var(--p)}
.hact{display:flex;gap:5px;align-items:center;margin-inline-start:auto}
#uArea{display:flex;gap:5px;align-items:center}
.ib{position:relative;width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;background:var(--card);border:1px solid var(--bd);color:var(--tx);transition:.2s;flex:none}
.ib:hover{color:var(--p);border-color:var(--p)}
.ib.av{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-weight:800;border:0}
.bg{position:absolute;top:-4px;inset-inline-end:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--p);color:#fff;font:700 11px/18px Cairo,sans-serif;text-align:center;font-style:normal}
.bg.pulse{animation:badgePulse .6s}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:14px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-weight:700;box-shadow:0 6px 16px color-mix(in srgb,var(--p) 32%,transparent);transition:.2s;text-align:center}
.btn:active{transform:scale(.97)}
.btn.sm{padding:7px 14px;font-size:13px;border-radius:11px}
.btn.gh{background:var(--card);color:var(--p);border:1px solid var(--bd);box-shadow:none}
.btn.dg{background:var(--er);box-shadow:none}
.btn[disabled]{opacity:.5;pointer-events:none;filter:grayscale(.6)}
#main{max-width:1280px;margin:auto;padding:14px 12px calc(var(--nh) + 34px + env(safe-area-inset-bottom))}
.ph2{font-size:20px;font-weight:800;margin:6px 0 14px}
.hero{display:grid;gap:16px;align-items:center;background:linear-gradient(135deg,var(--p),var(--p2) 62%,var(--ac));border-radius:26px;padding:24px;color:#fff;overflow:hidden;animation:fadeUp .6s both;margin-bottom:16px}
.hero h1{font-size:clamp(22px,4vw,38px);font-weight:800;line-height:1.4;margin-bottom:8px}
.hero p{opacity:.92;margin-bottom:16px}
.hero img,.hph{width:100%;aspect-ratio:16/10;max-height:280px;object-fit:cover;border-radius:20px}
.hph{display:grid;place-items:center;font-size:64px;background:rgba(255,255,255,.18)}
.hero .btn{background:#fff;color:var(--p);box-shadow:0 6px 16px rgba(0,0,0,.18)}
.sm{position:relative;margin-bottom:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.chip{padding:8px 16px;border-radius:99px;background:var(--card);border:1px solid var(--bd);white-space:nowrap;font-weight:600;transition:.2s}
.chip.on{background:var(--p);color:#fff;border-color:var(--p)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:var(--card);border-radius:var(--r);overflow:hidden;border:1px solid var(--bd);box-shadow:var(--sh);cursor:pointer;display:flex;flex-direction:column;animation:popIn .4s both;transition:transform .2s}
.card:hover{transform:translateY(-3px)}
.im{position:relative;aspect-ratio:1;background:linear-gradient(135deg,color-mix(in srgb,var(--p) 14%,var(--card)),var(--card));display:grid;place-items:center;font-size:40px;color:var(--p2);overflow:hidden}
.im>img{width:100%;height:100%;object-fit:cover}
.bds{position:absolute;top:8px;inset-inline-start:8px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;font-size:14px}
.bd{display:inline-block;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:700;color:#fff;background:var(--ok)}
.bd.out{background:var(--er)}
.bd.ds{background:var(--ac)}
.hrt{position:absolute;top:8px;inset-inline-end:8px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.93);color:#aaa;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.15);transition:.2s;font-size:15px}
.hrt.on{color:var(--p)}
.hrt:active{transform:scale(1.25)}
.inf{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.inf h3{font-size:14px;font-weight:700;line-height:1.4;min-height:39px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pr b{color:var(--p);font-size:16px;font-weight:800}
.pr s{color:var(--mt);font-size:12px}
.inf .btn{margin-top:auto;width:100%}
.sk{background:linear-gradient(90deg,var(--card),var(--bd),var(--card));background-size:200% 100%;animation:sh 1.2s infinite;border-radius:var(--r);aspect-ratio:3/4}
.empty{grid-column:1/-1;text-align:center;padding:48px 16px;color:var(--mt)}
.empty i{font-size:48px;color:var(--p2);margin-bottom:10px;display:block}
.empty .btn{margin-top:14px}
.bnav{position:fixed;inset-inline:0;bottom:0;z-index:60;display:flex;justify-content:center;padding:0 10px calc(10px + env(safe-area-inset-bottom));pointer-events:none}
.bni{pointer-events:auto;display:flex;width:100%;max-width:520px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding:6px;gap:2px}
.nb{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px;border-radius:18px;color:var(--mt);font-size:11px;font-weight:600;transition:.2s}
.nb span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb i{font-size:18px}
.nb.on{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}
#toasts{position:fixed;top:calc(12px + env(safe-area-inset-top));inset-inline:0;z-index:400;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:fadeUp .3s both;max-width:90vw}
.toast.ok{background:var(--ok);color:#fff}
.toast.err{background:var(--er);color:#fff}
.npop{pointer-events:auto;width:min(420px,92vw);background:var(--card);border:1.5px solid var(--p);border-radius:16px;padding:12px 14px;box-shadow:var(--sh);display:flex;gap:10px;cursor:pointer;animation:popIn .35s both}
.npop p{color:var(--mt);font-size:13px}
.ov{position:fixed;inset:0;z-index:200;background:rgba(20,5,12,.5);backdrop-filter:blur(3px);opacity:0;transition:opacity .25s;display:flex;align-items:center;justify-content:center;padding:14px}
.ov.on{opacity:1}
.ovd{justify-content:flex-start;padding:0}
.dr{width:min(440px,100vw);height:100%;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s;padding-top:env(safe-area-inset-top)}
.on .dr{transform:none}
.md{width:min(560px,100%);max-height:92vh;overflow:auto;background:var(--card);border-radius:24px;padding:22px;transform:scale(.94);transition:.25s;position:relative}
.md.w{width:min(820px,100%)}
.on .md{transform:none}
.md .mt{margin-bottom:14px;font-size:19px}
.dh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--bd);font-weight:800;font-size:17px}
.db{flex:1;overflow:auto;padding:14px 16px}
.df{padding:14px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--bd);background:var(--card)}
.x{position:absolute;top:12px;inset-inline-start:12px;width:36px;height:36px;border-radius:50%;background:var(--bg);display:grid;place-items:center;z-index:2}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}
.fld>label{font-size:13px;font-weight:700;color:var(--mt)}
.fld input,.fld select,.fld textarea,.in{width:100%;padding:11px 14px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card);outline:0;transition:.2s}
.fld input:focus,.fld select:focus,.fld textarea:focus,.in:focus{border-color:var(--p)}
.fld textarea{min-height:90px;resize:vertical}
.fld input[type=color]{padding:3px;height:44px;cursor:pointer}
.fld input:disabled{opacity:.6}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.chk{display:flex;align-items:center;gap:8px;font-weight:600}
.chk input{width:18px;height:18px;accent-color:var(--p)}
.ci{display:flex;gap:10px;padding:10px;background:var(--card);border-radius:14px;border:1px solid var(--bd);margin-bottom:10px;align-items:center}
.ci .ph{width:64px;height:64px;border-radius:12px;overflow:hidden;flex:none;background:var(--bg);display:grid;place-items:center;color:var(--p2)}
.ci .ph img{width:100%;height:100%;object-fit:cover}
.qty{display:inline-flex;align-items:center;gap:10px;background:var(--bg);border-radius:99px;padding:2px;margin-top:4px}
.qty button{width:28px;height:28px;border-radius:50%;background:var(--card);border:1px solid var(--bd);font-weight:800}
.qty span{min-width:18px;text-align:center;font-weight:700}
.cpn{display:flex;gap:8px;margin:12px 0}
.cpn .in{flex:1}
.ctag{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-radius:12px;background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok);font-weight:700;margin:12px 0}
.sum div{display:flex;justify-content:space-between;padding:3px 0}
.sum .t{font-weight:800;font-size:18px;color:var(--p);border-top:1px dashed var(--bd);margin-top:6px;padding-top:8px}
.oc{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.oh,.of{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ob{padding:8px 0;color:var(--mt);font-size:14px}
.ob p{margin:2px 0}
.ob i{color:var(--p2);width:16px}
.of{border-top:1px dashed var(--bd);padding-top:10px}
.of select{padding:8px 10px;border-radius:10px;border:1.5px solid var(--bd);background:var(--card)}
.tot{color:var(--p);font-size:17px}
.st{display:inline-flex;gap:6px;align-items:center;padding:3px 12px;border-radius:99px;font-size:12px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.pn{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.pn h3{margin-bottom:12px;font-size:16px}
.pl{display:flex;flex-direction:column;gap:10px}
.pav{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;display:grid;place-items:center;font-size:30px;font-weight:800;margin:0 auto 14px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 8px;text-align:start;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mt);font-size:12px}
.pm{display:grid;gap:16px}
.pm .im{border-radius:18px}
.pi h2{font-size:20px;margin:4px 0 8px}
.pi .cat{color:var(--p);font-weight:700;font-size:13px}
.pi .ds{color:var(--mt);white-space:pre-line;margin:10px 0}
.pr.big b{font-size:24px}
.pa{display:flex;gap:10px;margin-top:14px}
.pa .btn{flex:1}
.pa .ib{width:48px;height:48px;font-size:18px}
.pa .ib.on{color:var(--p);border-color:var(--p)}
.ni{display:flex;gap:10px;padding:12px;background:var(--card);border:1px solid var(--bd);border-radius:14px;margin-bottom:10px;cursor:pointer;align-items:flex-start}
.ni.un{border-inline-start:4px solid var(--p);background:color-mix(in srgb,var(--p) 6%,var(--card))}
.ni p{color:var(--mt);font-size:13px;margin:2px 0}
.ni small{color:var(--mt);font-size:11px}
.nt{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;color:#fff;background:var(--mt)}
.nt.promo{background:var(--ac)}
.nt.order{background:var(--p)}
.nt.system{background:#2563eb}
.tabs{display:flex;background:var(--bg);border-radius:14px;padding:4px;margin:12px 0}
.tabs button{flex:1;padding:9px;border-radius:11px;font-weight:700;color:var(--mt)}
.tabs .on{background:var(--card);color:var(--p);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.ah{text-align:center;padding-top:6px}
.ah img{width:60px;height:60px;border-radius:16px;margin:0 auto 8px;object-fit:cover}
.or{display:flex;align-items:center;gap:10px;color:var(--mt);margin:14px 0;font-size:13px}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--bd)}
.sw{text-align:center;margin-top:14px;color:var(--mt);font-size:14px}
.sw a{color:var(--p);font-weight:700}
.maint{position:fixed;inset:0;z-index:500;display:grid;place-items:center;text-align:center;padding:24px;background:linear-gradient(135deg,var(--p),var(--p2) 60%,var(--ac));color:#fff}
.maint i.g{font-size:64px;animation:spin 3s linear infinite;margin-bottom:18px}
.maint h1{font-size:28px;margin-bottom:8px}
.maint .btn{margin-top:22px;background:rgba(255,255,255,.2);box-shadow:none}
.adm{min-height:100vh;display:flex;flex-direction:column}
.as{background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:40;padding-top:env(safe-area-inset-top)}
.ab{display:none;align-items:center;gap:10px;padding:16px;font-weight:800;color:var(--p)}
.ab img{width:36px;height:36px;border-radius:10px;object-fit:cover}
.an{display:flex;overflow-x:auto;gap:6px;padding:8px 10px;scrollbar-width:none}
.an button{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:12px;white-space:nowrap;font-weight:600;color:var(--mt);text-align:start;transition:.2s}
.an button i{width:18px;text-align:center}
.an button.on{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}
.an .nbd{background:var(--ac);color:#fff;border-radius:99px;font-size:11px;padding:0 7px;margin-inline-start:auto}
.am{padding:14px 12px 40px;min-width:0}
.at{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.at h2{font-size:20px}
.stg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.sc{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;display:flex;gap:12px;align-items:center;box-shadow:var(--sh)}
.sc>i{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--p) 14%,transparent);color:var(--p);font-size:18px;flex:none}
.sc b{display:block;font-size:19px;line-height:1.3}
.sc small{color:var(--mt)}
.chart{display:flex;align-items:stretch;gap:8px;height:190px}
.cb2{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.cb2 .bar{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
.cb2 .bar i{width:100%;max-width:38px;border-radius:8px 8px 0 0;background:linear-gradient(var(--p),var(--p2));min-height:4px;transition:height .6s}
.cb2 span{font-weight:700;font-size:12px}
.cb2 small{font-size:11px;color:var(--mt)}
.ph{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.ac{background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column}
.ac .im{aspect-ratio:4/3}
.ac .inf h3{min-height:0}
.acb{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px;margin-top:auto}
.acb.c3{grid-template-columns:repeat(3,1fr)}
.acb button{height:34px;border-radius:10px;background:var(--bg);color:var(--mt);transition:.2s}
.acb button:hover{background:var(--p);color:#fff}
.ncb{padding:14px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.ncb>i{font-size:22px;color:var(--p)}
.ncb small{color:var(--mt)}
.ml{display:flex;gap:10px;align-items:center;padding:12px;background:var(--card);border:1px solid var(--bd);border-radius:14px;margin-bottom:10px;cursor:pointer}
.ml.un{border-inline-start:4px solid var(--p)}
.ml .cl{color:var(--mt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mav{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.cc{padding:14px;display:flex;flex-direction:column;gap:6px}
.cc code{font-size:17px;font-weight:800;color:var(--p);letter-spacing:1px}
.tb{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tb button{padding:7px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--bd);font-size:13px;font-weight:600}
textarea.code{font-family:ui-monospace,Consolas,monospace;direction:ltr;text-align:left;min-height:220px;font-size:13px;width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card);outline:0}
.cb{margin-bottom:14px}
.ban{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-radius:20px;padding:22px;margin:10px 0;text-align:center}
.eli{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--bd);border-radius:12px;margin-bottom:8px}

<script type="module">

import{getMessaging,getToken,onMessage,isSupported}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging.js";

const FB={apiKey:"AIzaSyAN11agW-TWwAk3TvF7mRZRt6PHLcnl_aQ",authDomain:"ym-pro-max.firebaseapp.com",databaseURL:"https://ym-pro-max-default-rtdb.firebaseio.com",projectId:"ym-pro-max",storageBucket:"ym-pro-max.firebasestorage.app",messagingSenderId:"174657071953",appId:"1:174657071953:web:5e831fc337df46dbd18170"};
const ADMIN_USER="01147975962",ADMIN_EMAIL=ADMIN_USER+"@yazid.store",VAPID_KEY="";
const app=initializeApp(FB),auth=getAuth(app),db=getDatabase(app);
let messaging=null,dip=null,AC=null;

const DEF_SET={storeName:'متجر يزيد',heroTitle:'تسوّق بأناقة واستمتع بأفضل العروض',primary:'#e91e63',primary2:'#f06292',accent:'#f59e0b',maxUsers:0,logo:'',storeImage:''};
const ST={pending:['قيد الانتظار','fa-clock','#f59e0b'],confirmed:['مؤكد','fa-circle-check','#2563eb'],delivered:['تم التسليم','fa-truck','#16a34a'],cancelled:['ملغي','fa-ban','#dc2626']};
const NI={promo:'fa-tag',order:'fa-bag-shopping',system:'fa-circle-info'};
const NT={promo:'عرض',order:'طلب',system:'نظام'};
const TONES={promo:[[880,.12],[1175,.12],[1568,.22]],order:[[660,.14],[880,.14],[660,.14],[990,.26]],system:[[523,.2],[392,.28]]};
const TPL={hero:'<div class="ban"><h2 style="margin-bottom:8px">أهلاً بك في متجرنا</h2><p>اكتشف أحدث المنتجات وأفضل الأسعار</p></div>',features:'<div class="stg"><div class="sc"><i class="fa-solid fa-truck-fast"></i><div><b>توصيل سريع</b><small>لكل المحافظات</small></div></div><div class="sc"><i class="fa-solid fa-shield-halved"></i><div><b>ضمان الجودة</b><small>منتجات أصلية</small></div></div><div class="sc"><i class="fa-solid fa-headset"></i><div><b>دعم متواصل</b><small>نرد على استفساراتك</small></div></div></div>',offer:'<div class="ban" style="background:linear-gradient(135deg,#f59e0b,#e91e63)"><h2 style="margin-bottom:6px">عرض خاص</h2><p>خصومات لفترة محدودة على منتجات مختارة</p></div>',contact:'<div class="pn" style="text-align:center"><h3>هل تحتاج مساعدة؟</h3><p style="color:var(--mt);margin-bottom:12px">تواصل معنا في أي وقت</p><a class="btn" href="tel:01147975962"><i class="fa-solid fa-phone"></i> اتصل بنا</a></div>'};
const SNIP={h:'<h2 style="margin:12px 0">عنوان رئيسي</h2>',p:'<p style="margin:8px 0;line-height:1.9">اكتب النص هنا</p>',btn:null,img:null,banner:'<div class="ban"><h2>عنوان البانر</h2><p>وصف قصير</p></div>',card:'<div class="pn"><h3>عنوان البطاقة</h3><p style="color:var(--mt)">محتوى البطاقة</p></div>',hr:'<hr style="border:0;border-top:1px solid var(--bd);margin:16px 0">'};
const ADM=[['stats','الإحصائيات','fa-chart-pie'],['analytics','التقارير','fa-chart-line'],['products','المنتجات','fa-box'],['orders','الطلبات','fa-cart-shopping'],['users','العملاء','fa-users'],['messages','الرسائل','fa-comments'],['coupons','الكوبونات','fa-ticket'],['notify','الإشعارات','fa-bell'],['navbar','إدارة الأزرار','fa-bars'],['editor','محرر الصفحات','fa-pen-ruler'],['settings','الإعدادات','fa-palette'],['maint','إغلاق المتجر','fa-lock'],['reset','إعادة ضبط','fa-trash-can']];

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const ls={get:(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch{return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n||0).toLocaleString('ar-EG',{maximumFractionDigits:2})+' ج.م';
const arr=o=>Object.entries(o||{}).map(([id,v])=>(v&&typeof v==='object'?{id,...v}:{id,value:v}));
const dt=t=>t?new Date(t).toLocaleString('ar-EG',{dateStyle:'medium',timeStyle:'short'}):'';
const shortId=id=>'#'+String(id).slice(-6).toUpperCase();
const fin=p=>Math.round(Number(p.price||0)*(1-Number(p.discount||0)/100)*100)/100;
const avail=p=>p.stock!==false&&p.visible!==false&&Number(p.qty)>0;
const stb=s=>{const x=ST[s]||ST.pending;return`<span class="st" style="--c:${x[2]}"><i class="fa-solid ${x[1]}"></i> ${x[0]}</span>`};
const EMPTY=(t,i='fa-box-open')=>`<div class="empty"><i class="fa-solid ${i}"></i><p>${t}</p></div>`;
const LP=`<div class="empty"><i class="fa-regular fa-user"></i><p>سجّل الدخول للمتابعة</p><button class="btn" data-a="auth">تسجيل الدخول</button></div>`;
function ago(t){const s=Math.floor((Date.now()-t)/1000);if(s<60)return'الآن';if(s<3600)return'منذ '+Math.floor(s/60)+' دقيقة';if(s<86400)return'منذ '+Math.floor(s/3600)+' ساعة';if(s<604800)return'منذ '+Math.floor(s/86400)+' يوم';return new Date(t).toLocaleDateString('ar-EG')}

const S={user:null,profile:null,isAdmin:false,adminMode:false,adminTab:'stats',page:'home',cat:'all',q:'',settings:{},nav:{},pages:{},products:{},orders:{},users:{},coupons:{},notifs:{},messages:{},maint:{},ld:{},open:null,coupon:null,co:{},seen:null,auth:{tab:'user',mode:'login'},up:{},pending:null,of:'all',ep:'home',eid:'',mid:''};
let cart=ls.get('yz_cart',{}),wish=ls.get('yz_wish',[]);
const saveCart=()=>ls.set('yz_cart',cart);
const pubSubs=[],userSubs=[];

function toast(m,t=''){const e=document.createElement('div');e.className='toast '+t;e.textContent=m;$('#toasts').appendChild(e);setTimeout(()=>e.remove(),3200)}
function openOv(id,inner,cls='md'){closeOv(id);const o=document.createElement('div');o.className='ov'+(cls==='dr'?' ovd':'');o.id='ov_'+id;o.innerHTML=`<div class="${cls==='dr'?'dr':cls==='mw'?'md w':'md'}" role="dialog" aria-modal="true">${inner}</div>`;o.addEventListener('mousedown',e=>{if(e.target===o)closeOv(id)});$('#layer').appendChild(o);document.body.classList.add('lock');requestAnimationFrame(()=>o.classList.add('on'))}
function setOv(id,inner){const p=$('#ov_'+id+'>div');if(p)p.innerHTML=inner}
function closeOv(id){const o=$('#ov_'+id);if(o)o.remove();if(!$('#layer .ov'))document.body.classList.remove('lock');if(S.open===id)S.open=null}
function closeAllOv(){$$('#layer .ov').forEach(o=>o.remove());document.body.classList.remove('lock');S.open=null}

function compress(file,max=800,q=.72,type='image/jpeg'){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');if(type==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,w,h)}x.drawImage(im,0,0,w,h);res(c.toDataURL(type,q))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

function setTheme(t){document.documentElement.dataset.theme=t;ls.set('yz_theme',t);$$('.thI').forEach(i=>i.className='fa-solid thI '+(t==='dark'?'fa-sun':'fa-moon'))}
function applyTheme(){const s={...DEF_SET,...S.settings},r=document.documentElement.style;r.setProperty('--p',s.primary);r.setProperty('--p2',s.primary2);r.setProperty('--ac',s.accent);document.title=s.storeName;const m=$('meta[name=theme-color]');if(m)m.content=s.primary}

function sub(r,k,own){const u=onValue(r,s=>{S[k]=s.val()||{};S.ld[k]=true;onData(k)},()=>{S.ld[k]=true;onData(k)});(own?userSubs:pubSubs).push(u)}
function subscribeUser(){const uid=S.user.uid;S.seen=null;if(S.isAdmin){sub(ref(db,'orders'),'orders',1);sub(ref(db,'users'),'users',1);sub(ref(db,'coupons'),'coupons',1);sub(ref(db,'messages'),'messages',1)}else sub(query(ref(db,'orders'),orderByChild('uid'),equalTo(uid)),'orders',1);sub(ref(db,'notifications'),'notifs',1)}

function navAll(){return arr(Object.keys(S.nav).length?S.nav:DEF_NAV).sort((a,b)=>(a.order||0)-(b.order||0))}
const navList=()=>navAll().filter(n=>n.enabled!==false);
function customBlock(k){const pg=S.pages[k]||{};return(pg.customCode||'')+arr(pg.elements).sort((a,b)=>a.createdAt-b.createdAt).map(e=>e.code).join('')}

function render(){
const m=S.maint?.enabled===true&&!S.isAdmin;
$('#maint').classList.toggle('hide',!m);
const adm=S.isAdmin&&S.adminMode;
$('#store').classList.toggle('hide',m||adm);
$('#admin').classList.toggle('hide',m||!adm);
applyTheme();
if(m){const s=S.settings;$('#maint').innerHTML=`<div><i class="fa-solid fa-gear g"></i><h1>جاري تحديث ${esc(s.storeName||'متجر يزيد')}</h1><p>نعمل على تحسين تجربتك، سنعود قريباً</p><button class="btn sm" data-a="auth" data-tab="admin"><i class="fa-solid fa-lock"></i> دخول الإدارة</button></div>`;return}
if(adm){drawAdmin();return}
drawHeader();drawNav();drawPage();updateBadges()
}
function drawHeader(){const s=S.settings,u=S.user;$('#hLogo').src=s.logo||'icon.svg';$('#hName').textContent=s.storeName||'متجر يزيد';$('#uArea').innerHTML=u?`${S.isAdmin?'<button class="ib" data-a="toAdmin" title="لوحة التحكم"><i class="fa-solid fa-gauge-high"></i></button>':''}<button class="ib av" data-a="go" data-p="profile">${esc((S.profile?.name||u.email||'؟')[0])}</button>`:`<button class="btn sm" data-a="auth">دخول</button>`;if(dip)$('#instBtn').classList.remove('hide');setTheme(document.documentElement.dataset.theme||'light')}
function drawNav(){$('#bnav').innerHTML=`<div class="bni">${navList().map(n=>`<button class="nb ${S.page===n.path?'on':''}" data-a="go" data-p="${esc(n.path)}"><i class="fa-solid ${esc(n.icon)}"></i><span>${esc(n.label)}</span></button>`).join('')}</div>`}
function go(p){if(!p)return;if(/^https?:/.test(p)){window.open(p,'_blank','noopener');return}S.page=p;closeAllOv();drawNav();drawPage();scrollTo({top:0})}

function setBg(id,n){const e=$('#'+id);if(!e)return;const o=Number(e.textContent)||0;e.textContent=n>99?'99+':n;e.classList.toggle('hide',!n);if(n>o){e.classList.remove('pulse');void e.offsetWidth;e.classList.add('pulse')}}
function updateBadges(){setBg('bC',cartItems().reduce((a,p)=>a+p.q,0));setBg('bW',wish.filter(id=>S.products[id]).length);setBg('bN',S.user?visibleNotifs().filter(n=>!readSet().has(n.id)).length:0)}

function drawPage(){
const p=S.page,cb=customBlock(p),top=cb?`<div class="cb">${cb}</div>`:'';
if(p==='home')return drawHome(top);
if(p==='wishlist')return drawWish(top);
if(p==='orders')return drawOrders(top);
if(p==='contact')return drawContact(top);
if(p==='profile')return drawProfile(top);
$('#main').innerHTML=`<div class="wrap">${top||EMPTY('هذه الصفحة فارغة حالياً','fa-file')}</div>`
}
function drawHome(top){const s={...DEF_SET,...S.settings};$('#main').innerHTML=`<div class="wrap">${top}<section class="hero"><div><h1>${esc(s.heroTitle)}</h1><p>منتجات مختارة بعناية وتوصيل لباب بيتك</p><button class="btn" data-a="shop">تسوق الآن <i class="fa-solid fa-arrow-left"></i></button></div>${s.storeImage?`<img src="${esc(s.storeImage)}" alt="">`:'<div class="hph"><i class="fa-solid fa-bag-shopping"></i></div>'}</section><div class="sm"><i class="fa-solid fa-magnifying-glass"></i><input id="qm" type="search" placeholder="ابحث عن المنتجات..." value="${esc(S.q)}" autocomplete="off"></div><div id="chips" class="chips"></div><div id="grid" class="grid"></div></div>`;drawGrid()}
function card(p){const f=fin(p),a=avail(p),w=wish.includes(p.id),d=Number(p.discount)>0;return`<article class="card" data-a="open" data-id="${p.id}"><div class="im">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy">`:'<i class="fa-solid fa-image"></i>'}<div class="bds"><span class="bd ${a?'':'out'}">${a?'متوفر':'نفذ'}</span>${d&&a?`<span class="bd ds">خصم ${Number(p.discount)}%</span>`:''}</div><button class="hrt ${w?'on':''}" data-a="wish" data-id="${p.id}" aria-label="المفضلة"><i class="fa-${w?'solid':'regular'} fa-heart"></i></button></div><div class="inf"><h3>${esc(p.name)}</h3><div class="pr"><b>${money(f)}</b>${d?`<s>${money(p.price)}</s>`:''}</div><button class="btn sm" data-a="add" data-id="${p.id}" ${a?'':'disabled'}><i class="fa-solid fa-cart-plus"></i> أضف للسلة</button></div></article>`}
function drawGrid(){
const chips=$('#chips'),grid=$('#grid');if(!chips||!grid)return;
if(!S.ld.products){grid.innerHTML=Array(8).fill('<div class="sk"></div>').join('');return}
const all=arr(S.products).filter(p=>p.visible!==false),cats=[...new Set(all.map(p=>p.category).filter(Boolean))];
if(S.cat!=='all'&&!cats.includes(S.cat))S.cat='all';
chips.innerHTML=['all',...cats].map(c=>`<button class="chip ${S.cat===c?'on':''}" data-a="cat" data-c="${esc(c)}">${c==='all'?'الكل':esc(c)}</button>`).join('');
const q=S.q.trim().toLowerCase(),l=all.filter(p=>(S.cat==='all'||p.category===S.cat)&&(!q||(p.name+' '+(p.description||'')+' '+(p.category||'')).toLowerCase().includes(q))).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
grid.innerHTML=l.length?l.map(card).join(''):EMPTY('لا توجد منتجات مطابقة','fa-face-frown-open')
}
function setQ(v){S.q=v;['hq','qm'].forEach(i=>{const e=$('#'+i);if(e&&e.value!==v)e.value=v});if(S.page!=='home'){go('home');return}drawGrid()}
function drawWish(top){const l=wish.map(id=>S.products[id]&&{...S.products[id],id}).filter(p=>p&&p.visible!==false);$('#main').innerHTML=`<div class="wrap">${top}<h2 class="ph2">المفضلة</h2><div class="grid">${l.length?l.map(card).join(''):EMPTY('قائمة المفضلة فارغة','fa-heart')}</div></div>`}
function userOrder(o){const its=Object.values(o.items||{});return`<div class="oc"><div class="oh"><b>${shortId(o.id)}</b><small>${dt(o.createdAt)}</small>${stb(o.status)}</div><div class="ob">${its.map(i=>`<p>${esc(i.name)} × ${i.qty} — ${money(i.price*i.qty)}</p>`).join('')}${o.discount>0?`<p>الخصم: ${money(o.discount)}</p>`:''}</div><div class="of"><span>الإجمالي</span><b class="tot">${money(o.total)}</b></div></div>`}

function playTone(type,pri){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();let t=AC.currentTime;(TONES[type]||TONES.system).forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(pri==='high'?.4:.22,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.03);t+=d})}catch{}}
async function sysNotif(n){if(!('Notification'in window)||Notification.permission!=='granted')return;const o={body:n.body||'',icon:'icon.svg',badge:'icon.svg',dir:'rtl',lang:'ar',tag:n.id||'t'+Date.now(),vibrate:n.priority==='high'?[200,100,200,100,300]:[150]};try{const r=await navigator.serviceWorker?.getRegistration();if(r){await r.showNotification(n.title,o);return}}catch{}try{new Notification(n.title,o)}catch{}}
function alertLocal(n,noSys){playTone(n.type,n.priority);try{navigator.vibrate?.(n.priority==='high'?[200,100,200,100,300]:[150])}catch{}const e=document.createElement('div');e.className='npop';e.innerHTML=`<span class="nt ${esc(n.type)}"><i class="fa-solid ${NI[n.type]||NI.system}"></i></span><div style="flex:1;min-width:0"><b>${esc(n.title)}</b><p>${esc(n.body)}</p></div>`;e.onclick=()=>{e.remove();H.notifs()};$('#toasts').appendChild(e);setTimeout(()=>e.remove(),6500);if(!noSys)sysNotif(n)}

if(k==='notifs')checkNotifs();

else if(k==='nav')drawNav();
else if(k==='pages'){if(!['contact','profile'].includes(S.page))drawPage()}
else if(k==='products'){if(S.page==='home')drawGrid();else if(S.page==='wishlist')drawPage();updateBadges();if(S.open==='cart')fillCart()}

}

contact:async f=>{const fd=new FormData(f),b=$('[type=submit]',f);b.disabled=true;try{const name=fd.get('name').trim();await set(push(ref(db,'messages')),{name,email:fd.get('email').trim(),phone:fd.get('phone').trim(),message:fd.get('message').trim(),read:false,uid:S.user?.uid||'',createdAt:Date.now()});notifyAdmin('رسالة جديدة','رسالة جديدة من '+name,'system');f.reset();toast('تم إرسال رسالتك بنجاح','ok')}catch{toast('تعذر إرسال الرسالة','err')}b.disabled=false},

product:async f=>{const fd=new FormData(f),price=Number(fd.get('price')),qty=Number(fd.get('qty')),name=fd.get('name').trim();if(!name||!(price>=0)||!(qty>=0))return toast('تحقق من البيانات المدخلة','err');const old=S.eid?S.products[S.eid]:null,data={name,price,discount:Math.min(100,Math.max(0,Number(fd.get('discount'))||0)),qty,category:fd.get('category').trim(),description:fd.get('description').trim(),image:S.up.pimg!==undefined?S.up.pimg:(old?.image||''),stock:fd.has('stock'),visible:fd.has('visible'),updatedAt:Date.now(),createdAt:old?.createdAt||Date.now()};await set(S.eid?ref(db,'products/'+S.eid):push(ref(db,'products')),data);closeOv('pm');toast('تم حفظ المنتج','ok')},

async function setStatus(id,st){const o=S.orders[id];if(!o||o.status===st)return;const was=['confirmed','delivered'].includes(o.status),now=['confirmed','delivered'].includes(st);await update(ref(db,'orders/'+id),{status:st});const adj=dir=>Promise.all(Object.values(o.items||{}).map(i=>runTransaction(ref(db,'products/'+i.id+'/qty'),v=>v==null?v:Math.max(0,Number(v)+dir*Number(i.qty))).catch(()=>{})));if(!was&&now)await adj(-1);if(was&&!now)await adj(1);set(push(ref(db,'notifications')),{title:'تحديث حالة الطلب',body:'أصبحت حالة طلبك: '+ST[st][0],type:'order',priority:'high',target:'specific',targetUid:o.uid,by:S.user.uid,createdAt:Date.now()}).catch(()=>{});toast('تم تحديث حالة الطلب','ok')}

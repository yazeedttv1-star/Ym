<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a1014">
<title>Chat Pro</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --green:#00a884;--green-dark:#008069;--green-deep:#005c4b;--green-light:#25d366;--green-pale:#d9fdd3;
  --bg-app:#f0f2f5;--bg-panel:#fff;--bg-chat:#efeae2;--bg-input:#fff;
  --text:#111b21;--text-muted:#667781;--border:#e9edef;--hover:#f5f6f6;--red:#ea0038;--blue:#027eb5;
  --shadow-sm:0 1px 2px rgba(11,20,26,.08);--shadow-md:0 4px 12px rgba(11,20,26,.12);--shadow-lg:0 8px 28px rgba(11,20,26,.18);
}
[data-theme="dark"]{
  --bg-app:#0a1014;--bg-panel:#111b21;--bg-chat:#0b141a;--bg-input:#202c33;
  --text:#e9edef;--text-muted:#8696a0;--border:#222d34;--hover:#182229;--green-pale:#005c4b;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{height:100%;overflow:hidden;font-family:'Cairo',sans-serif;background:var(--bg-app);color:var(--text);transition:background .3s,color .3s;overscroll-behavior:none}
body{display:flex;justify-content:center;align-items:center;height:100vh;height:100dvh}

button,a,[role="button"],.chat-item,.story-card,.user-search-item,.nav-btn,.dropdown-menu button,.context-menu button,.message,.call-item{cursor:pointer;-webkit-user-select:none;-moz-user-select:none;user-select:none;touch-action:manipulation}
button:active,.chat-item:active,.nav-btn:active,.story-card:active{opacity:.75;transition:opacity .1s}
input,textarea{touch-action:manipulation;-webkit-user-select:text;user-select:text}

/* المصادقة */
.auth-screen{position:fixed;inset:0;background:linear-gradient(135deg,#00a884,#008069,#005c4b);display:flex;justify-content:center;align-items:center;z-index:1000;padding:12px;overflow-y:auto;transition:opacity .3s,visibility .3s}
.auth-screen.hidden{opacity:0;visibility:hidden;pointer-events:none}
.auth-box{background:var(--bg-panel);padding:20px 18px;border-radius:16px;width:100%;max-width:360px;box-shadow:0 20px 50px rgba(0,0,0,.35);margin:auto;animation:slideUp .45s cubic-bezier(.2,.9,.3,1.1)}
@keyframes slideUp{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.auth-box .logo{width:56px;height:56px;background:linear-gradient(135deg,#25d366,#00a884);border-radius:16px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;box-shadow:0 6px 16px rgba(0,168,132,.4)}
.auth-box h1{color:var(--text);margin-bottom:3px;font-size:18px;text-align:center;font-weight:700}
.auth-box p.subtitle{color:var(--text-muted);margin-bottom:14px;font-size:11.5px;text-align:center}
.auth-tabs{display:flex;background:var(--bg-app);border-radius:10px;padding:3px;margin-bottom:14px}
[data-theme="dark"] .auth-tabs{background:#202c33}
.auth-tab{flex:1;padding:8px;background:transparent;border:none;border-radius:7px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--text-muted);transition:all .2s}
.auth-tab.active{background:var(--bg-panel);color:var(--green);box-shadow:var(--shadow-sm)}
.auth-box .input-group{position:relative;margin-bottom:8px}
.auth-box .input-group i{position:absolute;top:50%;right:12px;transform:translateY(-50%);color:var(--text-muted);font-size:12px;pointer-events:none}
.auth-box input{width:100%;padding:10px 34px 10px 12px;border:2px solid var(--border);background:var(--bg-panel);color:var(--text);border-radius:9px;font-size:13px;outline:none;text-align:right;font-family:inherit}
.auth-box input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(0,168,132,.1)}

/* صورة البروفايل الإجبارية */
.required-avatar{width:80px;height:80px;border-radius:50%;background:var(--bg-app);border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;cursor:pointer;overflow:hidden;position:relative;transition:border-color .2s}
.required-avatar:hover{border-color:var(--green)}
.required-avatar.filled{border-style:solid;border-color:var(--green)}
.required-avatar img{width:100%;height:100%;object-fit:cover}
.required-avatar i{font-size:28px;color:var(--text-muted)}
.required-avatar .overlay{position:absolute;inset:0;background:rgba(0,168,132,.7);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s}
.required-avatar:hover .overlay{opacity:1}
.required-avatar .overlay i{color:#fff;font-size:22px}
.required-avatar input{display:none}
.avatar-hint{font-size:10.5px;color:var(--text-muted);text-align:center;margin-bottom:12px}

.btn-primary{width:100%;padding:11px;background:linear-gradient(135deg,#25d366,#00a884);color:#fff;border:none;border-radius:9px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 3px 10px rgba(0,168,132,.3)}
.btn-primary:active{transform:scale(.98)}
.btn-primary:disabled{background:#b1b3b5;box-shadow:none;cursor:not-allowed}
.error-msg{background:rgba(234,0,56,.1);color:var(--red);padding:8px 10px;border-radius:8px;font-size:11.5px;margin-bottom:10px;display:none;text-align:right;border-right:3px solid var(--red);font-weight:500}
.error-msg.show{display:block}

/* التطبيق */
.app{width:100%;max-width:400px;height:100vh;height:100dvh;background:var(--bg-panel);display:none;flex-direction:column;overflow:hidden;position:relative;color:var(--text)}
.app.active{display:flex}
@media(min-width:900px){.app{max-width:1100px;height:92vh;max-height:850px;border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.5)}}

.app-header{background:var(--green-dark);color:#fff;padding:8px 10px;display:flex;align-items:center;gap:6px;flex-shrink:0;position:relative;z-index:30;box-shadow:0 2px 6px rgba(0,0,0,.15)}
[data-theme="dark"] .app-header{background:#202c33}
.app-header .menu-btn,.app-header .camera-btn{background:transparent;border:none;color:#fff;font-size:15px;cursor:pointer;padding:6px;border-radius:50%;flex-shrink:0}
.app-header .menu-btn:active,.app-header .camera-btn:active{background:rgba(255,255,255,.2)}
.app-header .logo-title{flex:1;font-size:14px;font-weight:700;color:#fff;text-align:right;display:flex;align-items:center;gap:6px;justify-content:flex-end}
.app-header .logo-title .logo-icon{width:26px;height:26px;background:linear-gradient(135deg,#25d366,#00a884);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px}

.dropdown-menu{position:absolute;top:46px;left:10px;background:var(--bg-panel);border-radius:11px;box-shadow:var(--shadow-lg);padding:5px 0;min-width:190px;display:none;z-index:100;color:var(--text);border:1px solid var(--border)}
.dropdown-menu.show{display:block;animation:dropIn .2s cubic-bezier(.2,.9,.3,1.2)}
@keyframes dropIn{from{opacity:0;transform:translateY(-10px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.dropdown-menu button{display:flex;width:100%;padding:9px 14px;background:transparent;border:none;text-align:right;font-size:12.5px;cursor:pointer;font-family:inherit;color:var(--text);align-items:center;gap:9px}
.dropdown-menu button:active{background:var(--hover)}
.dropdown-menu button i{width:16px;text-align:center;color:var(--green);font-size:12px}
.dropdown-menu hr{border:none;border-top:1px solid var(--border);margin:4px 0}

.search-box{padding:6px 10px;background:var(--bg-panel);border-bottom:1px solid var(--border);flex-shrink:0}
.search-box .wrap{position:relative}
.search-box .wrap i{position:absolute;top:50%;right:10px;transform:translateY(-50%);color:var(--text-muted);font-size:12px;pointer-events:none}
.search-box input{width:100%;padding:7px 30px 7px 10px;border:none;background:var(--bg-app);color:var(--text);border-radius:9px;font-size:12.5px;outline:none;text-align:right;font-family:inherit}
[data-theme="dark"] .search-box input{background:#202c33}

.sections{flex:1;position:relative;overflow:hidden;background:var(--bg-panel)}
.section{position:absolute;inset:0;overflow-y:auto;display:none;flex-direction:column}
.section.active{display:flex;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.chat-list{flex:1;overflow-y:auto}
.chat-item{display:flex;align-items:center;gap:9px;padding:9px 11px;cursor:pointer;position:relative;transition:background .15s}
.chat-item:active{background:var(--hover)}
.chat-item .avatar{width:42px;height:42px;background:linear-gradient(135deg,#25d366,#00a884);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;flex-shrink:0;overflow:hidden;position:relative}
.chat-item .avatar img{width:100%;height:100%;object-fit:cover}
.chat-item .avatar .online-dot{position:absolute;bottom:1px;left:1px;width:10px;height:10px;background:var(--green-light);border-radius:50%;border:2px solid var(--bg-panel)}
.chat-item .avatar.group-avatar{background:linear-gradient(135deg,#128c7e,#075e54);font-size:18px}
.chat-item .details{flex:1;min-width:0}
.chat-item .details .name-row{display:flex;justify-content:space-between;align-items:center;gap:5px;margin-bottom:1px}
.chat-item .details .name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-item .details .time{font-size:10px;color:var(--text-muted);flex-shrink:0}
.chat-item .details .last-msg{font-size:11.5px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.chat-item .details .last-msg .check{color:var(--green-light);font-size:10px}
.chat-item .details .last-msg .check.read{color:var(--blue)}
.chat-item .meta{display:flex;flex-direction:column;align-items:flex-start;gap:4px;flex-shrink:0}
.chat-item .meta .badge{background:var(--green-light);color:#fff;font-size:10px;min-width:17px;height:17px;padding:0 5px;border-radius:9px;font-weight:700;display:flex;align-items:center;justify-content:center}
.chat-item .meta .mute-icon{font-size:10px;color:var(--text-muted)}
.chat-item.group-chat{background:rgba(0,168,132,.06)}
[data-theme="dark"] .chat-item.group-chat{background:rgba(0,168,132,.08)}
.empty-state{padding:30px 16px;text-align:center;color:var(--text-muted);font-size:12px}
.empty-state .big-icon{font-size:38px;opacity:.3;margin-bottom:10px}

.fab{position:absolute;bottom:70px;left:14px;width:46px;height:46px;background:linear-gradient(135deg,#25d366,#00a884);border-radius:14px;border:none;color:#fff;font-size:17px;cursor:pointer;box-shadow:0 6px 18px rgba(0,168,132,.45);display:flex;align-items:center;justify-content:center;z-index:25;transition:transform .2s;transform:rotate(-5deg)}
.fab:active{transform:rotate(0) scale(.95)}
@media(min-width:900px){.fab{bottom:18px}}

.stories-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;padding:12px}
.story-card{aspect-ratio:9/15;border-radius:12px;overflow:hidden;position:relative;cursor:pointer;background:linear-gradient(135deg,#00a884,#005c4b);color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;box-shadow:var(--shadow-md);background-size:cover;background-position:center}
.story-card:active{transform:scale(.97)}
.story-card.add{background:linear-gradient(135deg,rgba(0,168,132,.15),rgba(37,211,102,.15));color:var(--green);justify-content:center;align-items:center;border:2px dashed rgba(0,168,132,.4)}
.story-card.add .plus{font-size:26px;margin-bottom:3px}
.story-card .story-avatar{width:26px;height:26px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;overflow:hidden;margin-bottom:5px;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.story-card .story-avatar img{width:100%;height:100%;object-fit:cover}
.story-card .story-name{font-size:10.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.story-card .delete-story{position:absolute;top:5px;left:5px;width:22px;height:22px;background:rgba(0,0,0,.55);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;z-index:3;cursor:pointer;backdrop-filter:blur(6px)}
.story-card .my-story-badge{position:absolute;top:5px;right:5px;background:var(--green-light);color:#fff;font-size:8.5px;padding:2px 6px;border-radius:7px;font-weight:700;z-index:3}

.call-section-title{padding:10px 12px 5px;font-size:10.5px;font-weight:700;color:var(--text-muted);letter-spacing:.5px}
.call-item{display:flex;align-items:center;gap:9px;padding:9px 11px;border-bottom:1px solid var(--border);cursor:pointer}
.call-item:active{background:var(--hover)}
.call-item .avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#25d366,#00a884);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;overflow:hidden}
.call-item .avatar img{width:100%;height:100%;object-fit:cover}
.call-item .info{flex:1;min-width:0}
.call-item .info .name{font-weight:600;font-size:12.5px}
.call-item .info .meta{font-size:10.5px;color:var(--text-muted);margin-top:2px;display:flex;align-items:center;gap:4px}
.call-item .info .meta .in{color:var(--green-light)}
.call-item .info .meta .out{color:var(--blue)}
.call-item .info .meta .missed{color:var(--red)}
.call-item .call-back-btn{background:transparent;border:none;color:var(--green);font-size:14px;cursor:pointer;padding:6px;border-radius:50%}

.chat-view{position:absolute;inset:0;background:var(--bg-chat);display:none;flex-direction:column;z-index:40;animation:slideIn .25s cubic-bezier(.2,.9,.3,1.1)}
.chat-view.active{display:flex}
@keyframes slideIn{from{transform:translateX(-100%)}to{transform:translateX(0)}}
[data-theme="dark"] .chat-view{background:#0b141a}
.chat-view .header{background:var(--green-dark);color:#fff;padding:7px 9px;display:flex;align-items:center;gap:7px;flex-shrink:0;position:relative;box-shadow:0 2px 6px rgba(0,0,0,.15)}
[data-theme="dark"] .chat-view .header{background:#202c33}
.chat-view .header .back-btn{background:transparent;border:none;color:#fff;font-size:16px;cursor:pointer;padding:5px;border-radius:50%}
.chat-view .header .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#25d366,#00a884);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px;overflow:hidden;flex-shrink:0;cursor:pointer}
.chat-view .header .avatar img{width:100%;height:100%;object-fit:cover}
.chat-view .header .avatar.group-avatar{background:linear-gradient(135deg,#128c7e,#075e54);font-size:14px}
.chat-view .header .info{flex:1;min-width:0;cursor:pointer}
.chat-view .header .info .name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-view .header .info .status{font-size:9.5px;opacity:.85;display:flex;align-items:center;gap:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-view .header .info .status.online::before{content:'';width:5px;height:5px;background:var(--green-light);border-radius:50%;flex-shrink:0}
.chat-view .header .icon-btn{background:transparent;border:none;color:#fff;font-size:14px;cursor:pointer;padding:6px;border-radius:50%;flex-shrink:0}
.chat-view .header .icon-btn:active{background:rgba(255,255,255,.15)}

.selection-bar{position:absolute;top:0;left:0;right:0;background:var(--green-dark);color:#fff;padding:8px 10px;display:none;align-items:center;gap:10px;z-index:60;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.selection-bar.show{display:flex}
.selection-bar .close-sel{background:transparent;border:none;color:#fff;font-size:16px;cursor:pointer;padding:4px}
.selection-bar .count{flex:1;font-weight:600;font-size:13px}
.selection-bar .action{background:transparent;border:none;color:#fff;font-size:14px;cursor:pointer;padding:7px;border-radius:50%}

.chat-dropdown{position:absolute;top:42px;left:9px;background:var(--bg-panel);border-radius:11px;box-shadow:var(--shadow-lg);padding:5px 0;min-width:180px;display:none;z-index:50;color:var(--text);border:1px solid var(--border)}
.chat-dropdown.show{display:block;animation:dropIn .2s}
.chat-dropdown button{display:flex;width:100%;padding:9px 14px;background:transparent;border:none;text-align:right;font-size:12.5px;cursor:pointer;font-family:inherit;color:var(--text);align-items:center;gap:9px}
.chat-dropdown button i{width:16px;text-align:center;color:var(--green);font-size:12px}

.messages-area{flex:1;padding:12px 10px;overflow-y:auto;display:flex;flex-direction:column;gap:5px;touch-action:pan-y}
.message-row{display:flex;width:100%;animation:msgIn .25s cubic-bezier(.2,.9,.3,1.1);position:relative}
@keyframes msgIn{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.message-row.mine{justify-content:flex-start}
.message-row.other{justify-content:flex-end}
.message-row.group .sender-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#25d366,#00a884);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:11px;overflow:hidden;flex-shrink:0;align-self:flex-end;box-shadow:0 1px 3px rgba(0,0,0,.15);margin-left:3px}
.message-row.group .sender-avatar img{width:100%;height:100%;object-fit:cover}
.message{max-width:82%;padding:6px 9px 4px;border-radius:11px;font-size:12.5px;word-wrap:break-word;box-shadow:var(--shadow-sm);line-height:1.35;position:relative;cursor:pointer;user-select:none;transition:transform .15s,background .2s,box-shadow .2s}
.message:active{transform:scale(.97)}
.message.mine{background:var(--green-pale);border-top-right-radius:3px}
[data-theme="dark"] .message.mine{background:#005c4b;color:#e9edef}
.message.other{background:var(--bg-panel);border-top-left-radius:3px}
[data-theme="dark"] .message.other{background:#202c33;color:#e9edef}
.message.selected{background:rgba(0,168,132,.35) !important;box-shadow:0 0 0 2px var(--green)}
.message .sender-name{font-size:11px;font-weight:700;color:var(--green);margin-bottom:2px;display:block}
[data-theme="dark"] .message .sender-name{color:var(--green-light)}
.message .msg-meta{font-size:9.5px;color:var(--text-muted);margin-top:2px;display:flex;justify-content:flex-start;align-items:center;gap:3px}
.message .check{font-size:10px;color:var(--green-light)}
.message .check.read{color:var(--blue)}
.message .encrypted-badge{font-size:9px;color:var(--green);margin-left:4px}
.message .edited-tag{font-size:9px;color:var(--text-muted);font-style:italic}
.message .reply-preview{background:rgba(0,0,0,.08);border-right:3px solid var(--green);padding:4px 7px;border-radius:6px;margin-bottom:4px;font-size:10.5px;color:var(--text-muted);cursor:pointer}
[data-theme="dark"] .message .reply-preview{background:rgba(255,255,255,.08)}
.message .reply-preview .reply-name{font-weight:600;color:var(--green);font-size:10px;margin-bottom:2px}
.message img.msg-image,.message video.msg-video{max-width:240px;width:100%;border-radius:7px;margin-bottom:3px;display:block}
.date-separator{align-self:center;background:var(--bg-panel);color:var(--text-muted);font-size:10px;padding:4px 10px;border-radius:8px;box-shadow:var(--shadow-sm);margin:5px 0;font-weight:500}

.audio-message{display:flex;align-items:center;gap:8px;min-width:170px}
.audio-message button{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#25d366,#00a884);color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px}
.audio-message .audio-progress{flex:1;height:3px;background:rgba(0,0,0,.12);border-radius:3px;position:relative;overflow:hidden}
[data-theme="dark"] .audio-message .audio-progress{background:rgba(255,255,255,.15)}
.audio-message .audio-progress .fill{position:absolute;top:0;right:0;height:100%;width:0%;background:var(--green)}
.audio-message .duration{font-size:10px;color:var(--text-muted);font-variant-numeric:tabular-nums}

.chat-view .input-area{display:flex;padding:6px 8px;background:var(--bg-panel);gap:4px;align-items:center;flex-shrink:0;border-top:1px solid var(--border);padding-bottom:max(6px,env(safe-area-inset-bottom))}
[data-theme="dark"] .chat-view .input-area{background:#202c33}
.chat-view .input-area .icon-btn-sm{width:34px;height:34px;border-radius:50%;background:transparent;color:var(--text-muted);border:none;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chat-view .input-area .icon-btn-sm:active{background:var(--hover);color:var(--green)}
.chat-view .input-area input{flex:1;padding:8px 12px;border:none;border-radius:20px;outline:none;font-size:12.5px;background:var(--bg-app);color:var(--text);text-align:right;font-family:inherit;min-width:0}
[data-theme="dark"] .chat-view .input-area input{background:#2a3942}
.chat-view .input-area .mic-btn{background:linear-gradient(135deg,#25d366,#00a884);color:#fff}
.chat-view .input-area .mic-btn.recording{background:var(--red);animation:pulse-rec .8s infinite}
.chat-view .input-area .send-btn{background:linear-gradient(135deg,#25d366,#00a884);color:#fff;display:none}
.chat-view .input-area .send-btn.show{display:flex}
.chat-view .input-area .mic-btn.hide{display:none}
@keyframes pulse-rec{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.recording-indicator{position:absolute;bottom:60px;right:12px;background:var(--red);color:#fff;padding:7px 12px;border-radius:18px;font-size:11.5px;display:none;align-items:center;gap:7px;z-index:5;box-shadow:0 4px 12px rgba(234,0,56,.4)}
.recording-indicator.show{display:flex}
.recording-indicator .dot{width:7px;height:7px;background:#fff;border-radius:50%;animation:pulse-rec .8s infinite}

.reply-bar{display:none;background:var(--bg-panel);border-top:1px solid var(--border);padding:6px 10px;align-items:center;gap:8px;flex-shrink:0}
.reply-bar.show{display:flex}
.reply-bar .content{flex:1;border-right:3px solid var(--green);padding:3px 7px;min-width:0}
.reply-bar .content .reply-name{font-size:10.5px;font-weight:600;color:var(--green);margin-bottom:1px}
.reply-bar .content .reply-text{font-size:11.5px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reply-bar .close-reply{background:transparent;border:none;color:var(--text-muted);font-size:16px;cursor:pointer;padding:5px}

/* منتقي الإيموجي كـ لوحة مفاتيح مصغرة */
.emoji-keyboard{position:absolute;bottom:0;left:0;right:0;background:var(--bg-panel);border-top:1px solid var(--border);display:none;flex-direction:column;z-index:65;max-height:240px;box-shadow:0 -2px 10px rgba(0,0,0,.1)}
.emoji-keyboard.show{display:flex;animation:slideUpKb .25s cubic-bezier(.2,.9,.3,1.1)}
@keyframes slideUpKb{from{transform:translateY(100%)}to{transform:translateY(0)}}
.emoji-keyboard .kb-header{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--border);background:var(--bg-app)}
[data-theme="dark"] .emoji-keyboard .kb-header{background:#202c33}
.emoji-keyboard .kb-header button{background:transparent;border:none;color:var(--text-muted);font-size:15px;cursor:pointer;padding:5px 8px;border-radius:50%}
.emoji-keyboard .kb-header button.active{color:var(--green);background:rgba(0,168,132,.1)}
.emoji-keyboard .kb-body{flex:1;overflow-y:auto;padding:8px;display:grid;grid-template-columns:repeat(8,1fr);gap:3px;touch-action:pan-y}
.emoji-keyboard .emoji{font-size:22px;cursor:pointer;text-align:center;padding:4px;border-radius:6px;user-select:none;transition:transform .1s}
.emoji-keyboard .emoji:active{background:var(--hover);transform:scale(1.2)}
.emoji-keyboard .kb-footer{padding:6px 8px;border-top:1px solid var(--border);display:flex;gap:6px;align-items:center;background:var(--bg-panel)}
[data-theme="dark"] .emoji-keyboard .kb-footer{background:#202c33}
.emoji-keyboard .kb-footer input{flex:1;padding:7px 12px;border:none;border-radius:18px;outline:none;font-size:12.5px;background:var(--bg-app);color:var(--text);text-align:right;font-family:inherit}
[data-theme="dark"] .emoji-keyboard .kb-footer input{background:#2a3942}
.emoji-keyboard .kb-footer .send-kb{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#25d366,#00a884);color:#fff;border:none;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}

.context-menu{position:fixed;background:var(--bg-panel);border-radius:11px;box-shadow:var(--shadow-lg);padding:5px 0;min-width:180px;display:none;z-index:700;color:var(--text);border:1px solid var(--border);animation:popIn .15s}
.context-menu.show{display:block}
@keyframes popIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.context-menu button{display:flex;width:100%;padding:9px 14px;background:transparent;border:none;text-align:right;font-size:12.5px;cursor:pointer;font-family:inherit;color:var(--text);align-items:center;gap:10px}
.context-menu button:active{background:var(--hover)}
.context-menu button i{width:18px;text-align:center;font-size:13px;color:var(--text-muted)}
.context-menu button.danger{color:var(--red)}
.context-menu button.danger i{color:var(--red)}

.bottom-nav{display:flex;background:var(--bg-panel);flex-shrink:0;height:54px;border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
[data-theme="dark"] .bottom-nav{background:#202c33}
.bottom-nav .nav-btn{flex:1;background:transparent;border:none;color:var(--text-muted);font-size:10px;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
.bottom-nav .nav-btn.active{color:var(--green)}
.bottom-nav .nav-btn.active::before{content:'';position:absolute;top:0;left:30%;right:30%;height:3px;background:var(--green);border-radius:0 0 3px 3px}
.bottom-nav .nav-btn .icon{font-size:16px}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;justify-content:center;align-items:center;z-index:500;padding:14px;backdrop-filter:blur(4px)}
.modal-overlay.active{display:flex;animation:fadeIn .2s}
.modal{background:var(--bg-panel);color:var(--text);border-radius:15px;padding:18px;width:100%;max-width:380px;max-height:88vh;overflow-y:auto;animation:popIn .3s cubic-bezier(.2,.9,.3,1.1);border:1px solid var(--border);touch-action:pan-y}
.modal h3{color:var(--text);font-size:15px;margin-bottom:14px;text-align:center;font-weight:700}
.modal .profile-avatar{width:88px;height:88px;border-radius:50%;background:linear-gradient(135deg,#25d366,#00a884);display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff;font-weight:700;margin:0 auto 14px;overflow:hidden;position:relative;cursor:pointer;box-shadow:0 4px 16px rgba(0,168,132,.3)}
.modal .profile-avatar img{width:100%;height:100%;object-fit:cover}
.modal .profile-avatar .edit-badge{position:absolute;bottom:1px;left:1px;width:26px;height:26px;background:var(--green);border-radius:50%;display:flex;align-items:center;justify-content:center;border:2.5px solid var(--bg-panel);font-size:10px;color:#fff}
.modal .profile-avatar input{display:none}
.modal label{display:block;font-size:11.5px;color:var(--text-muted);margin-bottom:4px;margin-top:10px;font-weight:600}
.modal input[type=text],.modal input[type=tel],.modal input[type=email],.modal textarea{width:100%;padding:9px 12px;border:2px solid var(--border);background:var(--bg-panel);color:var(--text);border-radius:9px;font-size:12.5px;outline:none;text-align:right;font-family:inherit}
.modal input:focus,.modal textarea:focus{border-color:var(--green)}
.modal input:disabled{opacity:.6}
.modal .lang-options,.modal .theme-options{display:flex;gap:6px;margin-top:5px}
.modal .lang-option,.modal .theme-option{flex:1;padding:9px;background:var(--bg-app);border:2px solid transparent;border-radius:9px;font-size:12px;cursor:pointer;text-align:center;font-family:inherit;color:var(--text);font-weight:600}
[data-theme="dark"] .modal .lang-option,[data-theme="dark"] .modal .theme-option{background:#202c33}
.modal .lang-option.active,.modal .theme-option.active{border-color:var(--green);background:rgba(0,168,132,.1);color:var(--green)}
.modal .theme-option{display:flex;flex-direction:column;align-items:center;gap:4px}
.modal .theme-option i{font-size:16px}
.modal .btn-secondary{width:100%;padding:9px;background:var(--bg-app);color:var(--text);border:none;border-radius:9px;font-size:12.5px;cursor:pointer;font-family:inherit;margin-top:12px;font-weight:600}
[data-theme="dark"] .modal .btn-secondary{background:#202c33}
.modal .user-search-item{display:flex;align-items:center;gap:9px;padding:9px;border-radius:10px;cursor:pointer}
.modal .user-search-item:active{background:var(--hover)}
.modal .user-search-item .avatar{width:40px;height:40px;background:linear-gradient(135deg,#25d366,#00a884);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;overflow:hidden;flex-shrink:0}
.modal .user-search-item .avatar img{width:100%;height:100%;object-fit:cover}
.modal .user-search-item .details{flex:1;min-width:0}
.modal .user-search-item .details .name{font-weight:600;font-size:12.5px}
.modal .user-search-item .details .phone{font-size:11px;color:var(--text-muted);margin-top:1px}

.story-viewer{position:fixed;inset:0;background:#000;z-index:800;display:none;flex-direction:column}
.story-viewer.active{display:flex;animation:fadeIn .25s}
.story-viewer .progress-bar{position:absolute;top:10px;left:10px;right:10px;height:3px;background:rgba(255,255,255,.3);border-radius:3px;overflow:hidden;z-index:5}
.story-viewer .progress-bar .fill{height:100%;background:#fff;width:0%;animation:progress 5s linear forwards}
@keyframes progress{from{width:0%}to{width:100%}}
.story-viewer .story-header{position:absolute;top:20px;left:12px;right:12px;display:flex;align-items:center;gap:9px;color:#fff;z-index:5;cursor:pointer}
.story-viewer .story-header .avatar{width:34px;height:34px;border-radius:50%;background:var(--green-light);display:flex;align-items:center;justify-content:center;font-weight:700;overflow:hidden;border:2px solid #fff}
.story-viewer .story-header .avatar img{width:100%;height:100%;object-fit:cover}
.story-viewer .story-header .name{font-weight:600;font-size:13px}
.story-viewer .story-header .time{font-size:10.5px;opacity:.8}
.story-viewer .story-header .tap-hint{font-size:9.5px;opacity:.7;margin-top:1px}
.story-viewer .close-btn{position:absolute;top:20px;left:12px;background:rgba(0,0,0,.4);border:none;color:#fff;font-size:20px;cursor:pointer;z-index:10;padding:5px;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
.story-viewer .story-content{flex:1;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;padding:24px;text-align:center;word-break:break-word;background:linear-gradient(135deg,#00a884,#005c4b);font-weight:500}
.story-viewer img,.story-viewer video{max-width:100%;max-height:100%;object-fit:contain}

.call-screen{position:fixed;inset:0;background:linear-gradient(135deg,#005c4b,#0a1014);z-index:900;display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;padding:18px}
.call-screen.active{display:flex}
.call-screen .call-avatar{width:110px;height:110px;border-radius:50%;background:linear-gradient(135deg,#25d366,#00a884);display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700;margin-bottom:18px;animation:pulse 2s infinite;overflow:hidden;border:3px solid rgba(255,255,255,.15)}
.call-screen .call-avatar img{width:100%;height:100%;object-fit:cover}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(37,211,102,.6)}70%{box-shadow:0 0 0 30px rgba(37,211,102,0)}100%{box-shadow:0 0 0 0 rgba(37,211,102,0)}}
.call-screen .call-name{font-size:20px;font-weight:700;margin-bottom:6px;text-align:center}
.call-screen .call-status{font-size:13px;opacity:.85;margin-bottom:8px;text-align:center}
.call-screen .call-timer{font-size:13px;opacity:.7;margin-bottom:30px;font-variant-numeric:tabular-nums}
.call-screen .call-actions{display:flex;gap:22px}
.call-screen .call-actions button{width:56px;height:56px;border-radius:50%;border:none;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.call-screen .end-call{background:linear-gradient(135deg,#ea0038,#c1002e);color:#fff;box-shadow:0 6px 20px rgba(234,0,56,.4)}
.call-screen .mute-call{background:rgba(255,255,255,.18);color:#fff;backdrop-filter:blur(10px);border:2px solid rgba(255,255,255,.2)}
.call-screen .mute-call.active{background:#fff;color:var(--green-deep)}
.call-screen .video-container{position:absolute;inset:0;display:none}
.call-screen.video-call .video-container{display:block}
.call-screen.video-call .call-avatar,.call-screen.video-call .call-name,.call-screen.video-call .call-status,.call-screen.video-call .call-timer{display:none}
.call-screen .remote-video{width:100%;height:100%;object-fit:cover;background:#000}
.call-screen .local-video{position:absolute;top:16px;left:16px;width:80px;height:108px;object-fit:cover;border-radius:10px;border:2px solid rgba(255,255,255,.3);background:#000;z-index:2}
.call-screen .video-overlay{position:absolute;bottom:110px;left:0;right:0;text-align:center;z-index:3}
.call-screen .video-overlay .call-name{display:block;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.8);font-size:16px}
.call-screen .video-overlay .call-timer{display:block;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.8);font-size:11.5px;margin-top:4px}

::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:rgba(134,150,160,.4);border-radius:3px}
::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>

<!-- المصادقة -->
<div class="auth-screen" id="authScreen">
  <div class="auth-box">
    <div class="logo"><i class="fas fa-comments"></i></div>
    <h1>Chat Pro</h1>
    <p class="subtitle" id="formSubtitle">سجّل دخولك للانضمام</p>
    <div class="error-msg" id="errorMsg"></div>
    <div class="auth-tabs">
      <button class="auth-tab active" id="tabLogin">دخول</button>
      <button class="auth-tab" id="tabSignup">حساب جديد</button>
    </div>

    <!-- صورة البروفايل (تظهر في التسجيل فقط) -->
    <div id="signupAvatarGroup" style="display:none;">
      <div class="required-avatar" id="requiredAvatar" onclick="document.getElementById('signupAvatarInput').click()">
        <i class="fas fa-user"></i>
        <div class="overlay"><i class="fas fa-camera"></i></div>
        <input type="file" id="signupAvatarInput" accept="image/*">
      </div>
      <div class="avatar-hint">اضغط لاختيار صورة <span style="color:var(--red);">*</span></div>
    </div>

    <div class="input-group"><input type="email" id="emailInput" placeholder="البريد الإلكتروني"><i class="fas fa-envelope"></i></div>
    <div class="input-group"><input type="password" id="passwordInput" placeholder="كلمة المرور" minlength="6"><i class="fas fa-lock"></i></div>
    <div class="input-group" id="nameGroup" style="display:none;"><input type="text" id="displayNameInput" placeholder="الاسم الظاهر" maxlength="30"><i class="fas fa-user"></i></div>
    <div class="input-group" id="phoneGroup" style="display:none;"><input type="tel" id="phoneInput" placeholder="رقم الهاتف (إجباري)" maxlength="20"><i class="fas fa-phone"></i></div>

    <button class="btn-primary" id="authBtn">تسجيل الدخول</button>
  </div>
</div>

<!-- التطبيق -->
<div class="app" id="app">
  <div class="app-header" id="appHeader">
    <button class="menu-btn" id="menuBtn"><i class="fas fa-ellipsis-vertical"></i></button>
    <div class="logo-title"><div class="logo-icon">💬</div> Chat Pro</div>
    <button class="camera-btn" id="cameraBtn"><i class="fas fa-camera"></i></button>
    <div class="dropdown-menu" id="mainMenu">
      <button data-action="profile"><i class="fas fa-user-circle"></i> الملف الشخصي</button>
      <button data-action="readall"><i class="fas fa-check-double"></i> قراءة الكل</button>
      <button data-action="settings"><i class="fas fa-cog"></i> الإعدادات</button>
      <hr>
      <button data-action="theme"><i class="fas fa-moon"></i> <span id="themeBtnText">الوضع الفاتح</span></button>
      <button data-action="logout"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</button>
    </div>
  </div>

  <div class="search-box" id="searchBox">
    <div class="wrap"><i class="fas fa-search"></i><input type="text" id="searchInput" placeholder="ابحث في الدردشات..."></div>
  </div>

  <div class="sections" id="sections"></div>

  <div class="bottom-nav" id="bottomNav">
    <button class="nav-btn active" data-tab="chats"><span class="icon"><i class="fas fa-comment-dots"></i></span><span>الدردشات</span></button>
    <button class="nav-btn" data-tab="stories"><span class="icon"><i class="fas fa-circle-notch"></i></span><span>الاستوري</span></button>
    <button class="nav-btn" data-tab="calls"><span class="icon"><i class="fas fa-phone"></i></span><span>المكالمات</span></button>
  </div>

  <button class="fab" id="newChatFab"><i class="fas fa-pen"></i></button>

  <div class="chat-view" id="chatView">
    <div class="selection-bar" id="selectionBar">
      <button class="close-sel" id="closeSel"><i class="fas fa-times"></i></button>
      <span class="count" id="selCount">0 محدد</span>
      <button class="action" id="copySel" title="نسخ"><i class="fas fa-copy"></i></button>
      <button class="action" id="forwardSel" title="إعادة توجيه"><i class="fas fa-share"></i></button>
      <button class="action" id="deleteSel" title="حذف"><i class="fas fa-trash"></i></button>
    </div>

    <div class="header">
      <button class="back-btn" id="chatBack"><i class="fas fa-arrow-right"></i></button>
      <div class="avatar" id="chatAvatar"><i class="fas fa-user"></i></div>
      <div class="info" id="chatInfo">
        <div class="name" id="chatName">...</div>
        <div class="status" id="chatStatus">غير متصل</div>
      </div>
      <button class="icon-btn" id="startVoiceCall"><i class="fas fa-phone"></i></button>
      <button class="icon-btn" id="startVideoCall"><i class="fas fa-video"></i></button>
      <button class="icon-btn" id="chatMenuBtn"><i class="fas fa-ellipsis-vertical"></i></button>
      <div class="chat-dropdown" id="chatMenu">
        <button data-action="mute"><i class="fas fa-bell-slash"></i> <span id="muteChatText">كتم الإشعارات</span></button>
        <button data-action="clear"><i class="fas fa-trash"></i> مسح المحادثة</button>
      </div>
    </div>

    <div class="messages-area" id="messagesArea"></div>

    <div class="recording-indicator" id="recordingIndicator">
      <span class="dot"></span><span id="recordingTime">0:00</span><span>جاري التسجيل...</span>
    </div>

    <div class="reply-bar" id="replyBar">
      <div class="content">
        <div class="reply-name" id="replyName"></div>
        <div class="reply-text" id="replyText"></div>
      </div>
      <button class="close-reply" id="closeReply"><i class="fas fa-times"></i></button>
    </div>

    <div class="input-area">
      <button class="icon-btn-sm" id="emojiBtn"><i class="fas fa-face-smile"></i></button>
      <button class="icon-btn-sm" id="cameraChatBtn"><i class="fas fa-camera"></i></button>
      <input type="text" id="messageInput" placeholder="اكتب رسالة..." autocomplete="off">
      <button class="icon-btn-sm mic-btn" id="micBtn"><i class="fas fa-microphone"></i></button>
      <button class="icon-btn-sm send-btn" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
      <input type="file" id="chatMediaInput" accept="image/*,video/*" style="display:none;">
    </div>

    <!-- لوحة الإيموجي (تحل مكان لوحة المفاتيح) -->
    <div class="emoji-keyboard" id="emojiKeyboard">
      <div class="kb-header">
        <button id="kbClose"><i class="fas fa-keyboard"></i></button>
        <div style="flex:1;text-align:center;font-size:12px;color:var(--text-muted);font-weight:600;">الإيموجي</div>
      </div>
      <div class="kb-body" id="kbBody"></div>
      <div class="kb-footer">
        <input type="text" id="kbInput" placeholder="اكتب رسالة...">
        <button class="send-kb" id="kbSend"><i class="fas fa-paper-plane"></i></button>
      </div>
    </div>
  </div>
</div>

<!-- قائمة السياق -->
<div class="context-menu" id="contextMenu"></div>

<!-- نافذة الملف الشخصي -->
<div class="modal-overlay" id="profileModal">
  <div class="modal">
    <h3>الملف الشخصي</h3>
    <div class="profile-avatar" id="profileAvatar" onclick="document.getElementById('avatarInput').click()">
      <i class="fas fa-user"></i>
      <div class="edit-badge"><i class="fas fa-camera"></i></div>
      <input type="file" id="avatarInput" accept="image/*">
    </div>
    <label>الاسم</label>
    <input type="text" id="profileName" maxlength="30">
    <label>رقم الهاتف</label>
    <input type="tel" id="profilePhone" maxlength="20">
    <label>البريد الإلكتروني</label>
    <input type="email" id="profileEmail" disabled>
    <button class="btn-primary" id="saveProfileBtn" style="margin-top:14px;">حفظ التعديلات</button>
    <button class="btn-secondary" id="closeProfileBtn">إلغاء</button>
  </div>
</div>

<!-- نافذة الإعدادات -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h3>الإعدادات</h3>
    <label>لغة التطبيق</label>
    <div class="lang-options">
      <button class="lang-option active" data-lang="ar">🇸🇦 العربية</button>
      <button class="lang-option" data-lang="en">🇬🇧 English</button>
    </div>
    <label>المظهر</label>
    <div class="theme-options">
      <button class="theme-option" data-theme="light"><i class="fas fa-sun"></i> فاتح</button>
      <button class="theme-option active" data-theme="dark"><i class="fas fa-moon"></i> داكن</button>
    </div>
    <button class="btn-secondary" id="closeSettingsBtn" style="margin-top:14px;">إغلاق</button>
  </div>
</div>

<!-- نافذة دردشة جديدة (بحث بالرقم فقط) -->
<div class="modal-overlay" id="newChatModal">

/* ============ ضغط الصور بقوة ============ */
async function compressImage(file, maxSize = 1000, quality = 0.75){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let w = img.width, h = img.height;
        if(w > maxSize || h > maxSize){
          if(w > h){ h = (h / w) * maxSize; w = maxSize; }
          else { w = (w / h) * maxSize; h = maxSize; }
        }
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        canvas.toBlob(blob => {
          if(blob) resolve(new File([blob], 'compressed.jpg', {type:'image/jpeg'}));
          else reject(new Error('فشل ضغط الصورة'));
        }, 'image/jpeg', quality);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ضغط صورة البروفايل - حجم صغير جداً */
async function compressAvatar(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const size = 150; // حجم صغير
        const ratio = Math.min(size / img.width, size / img.height);
        canvas.width = img.width * ratio;
        canvas.height = img.height * ratio;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(blob => {
          if(blob) resolve(new File([blob], 'avatar.jpg', {type:'image/jpeg'}));
          else reject(new Error('فشل ضغط الصورة'));
        }, 'image/jpeg', 0.7);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ============ التشفير ============ */
async function deriveKey(chatId){
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey('raw', enc.encode(chatId), {name:'PBKDF2'}, false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt: enc.encode('chat-salt-v1'), iterations: 100000, hash:'SHA-256'},
    km, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']
  );
}
async function encryptText(text, chatId){
  try {
    const key = await deriveKey(chatId);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(text));
    const comb = new Uint8Array(iv.length + ct.byteLength);
    comb.set(iv); comb.set(new Uint8Array(ct), iv.length);
    return b64Encode(comb);
  } catch(e){ return text; }
}
async function decryptText(enc, chatId){
  try {
    const key = await deriveKey(chatId);
    const comb = b64Decode(enc);
    const iv = comb.slice(0,12), ct = comb.slice(12);
    return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct));
  } catch(e){ return '[رسالة مشفرة]'; }
}
async function encryptBuffer(buffer, chatId){
  const key = await deriveKey(chatId);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, buffer);
  const comb = new Uint8Array(iv.length + ct.byteLength);
  comb.set(iv); comb.set(new Uint8Array(ct), iv.length);
  return b64Encode(comb);
}
async function decryptBuffer(b64, chatId){
  const key = await deriveKey(chatId);
  const comb = b64Decode(b64);
  const iv = comb.slice(0,12), ct = comb.slice(12);
  return crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct);
}
function b64Encode(uint8){
  let bin = '';
  const chunk = 16384;
  for(let i = 0; i < uint8.length; i += chunk){
    bin += String.fromCharCode.apply(null, uint8.subarray(i, i + chunk));
  }
  return btoa(bin);
}
function b64Decode(b64){
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}

async function renderRoomMessage(key, data, area){
  const existing = area.querySelector(`[data-msg-id="${key}"]`);
  if(existing) existing.remove();
  const isMine = data.senderId === currentUser.uid;
  const msgDate = new Date(data.timestamp);
  const dateStr = formatDate(msgDate);
  const lastChild = area.lastElementChild;
  if(!lastChild || !lastChild.classList.contains('date-separator') || lastChild.textContent !== dateStr){
    const sep = document.createElement('div');
    sep.className = 'date-separator';
    sep.textContent = dateStr;
    area.appendChild(sep);
  }
  const row = document.createElement('div');
  row.className = 'message-row group ' + (isMine ? 'mine' : 'other');
  if(!isMine){
    const senderAvatar = document.createElement('div');
    senderAvatar.className = 'sender-avatar';
    if(data.senderPhoto){ senderAvatar.innerHTML = `<img src="${data.senderPhoto}">`; }
    else { senderAvatar.textContent = (data.senderName || 'U').charAt(0).toUpperCase(); }
    row.appendChild(senderAvatar);
  }
  const msg = document.createElement('div');
  msg.className = 'message ' + (isMine ? 'mine' : 'other');
  msg.dataset.msgId = key;
  if(data.deletedForAll){
    msg.innerHTML = `<div style="font-style:italic;opacity:.6;"><i class="fas fa-ban"></i> تم حذف هذه الرسالة</div>
      <div class="msg-meta"><span>${formatTime(msgDate)}</span></div>`;
  } else {
    let senderNameHtml = '';
    if(!isMine){ senderNameHtml = `<span class="sender-name">${escapeHtml(data.senderName || 'مستخدم')}</span>`; }
    const encBadge = data.encrypted ? '<span class="encrypted-badge"><i class="fas fa-lock"></i></span>' : '';
    const editedTag = data.edited ? '<span class="edited-tag">(تم التعديل)</span>' : '';
    const check = isMine ? `<span class="check"><i class="fas fa-check"></i></span>` : '';
    if(data.type === 'audio' && data.audio){
      msg.innerHTML = senderNameHtml + `<div class="audio-message"><button class="audio-play-btn" data-audio="${data.audio}"><i class="fas fa-play"></i></button><div class="audio-progress"><div class="fill"></div></div><div class="duration">${formatDuration(data.duration||0)}</div></div><div class="msg-meta"><span>${formatTime(msgDate)}</span>${encBadge}${editedTag}${check}</div>`;
    } else if(data.type === 'image' && data.media){
      try {
        const buf = await decryptBuffer(data.media, ROOM_ID);
        const url = URL.createObjectURL(new Blob([buf], {type: data.mime || 'image/jpeg'}));
        msg.innerHTML = senderNameHtml + `<img class="msg-image" src="${url}"><div class="msg-meta"><span>${formatTime(msgDate)}</span>${encBadge}${check}</div>`;
      } catch(e){ msg.innerHTML = senderNameHtml + `<div>[صورة]</div><div class="msg-meta"><span>${formatTime(msgDate)}</span>${check}</div>`; }
    } else if(data.type === 'video' && data.media){
      try {
        const buf = await decryptBuffer(data.media, ROOM_ID);
        const url = URL.createObjectURL(new Blob([buf], {type: data.mime || 'video/mp4'}));
        msg.innerHTML = senderNameHtml + `<video class="msg-video" src="${url}" controls></video><div class="msg-meta"><span>${formatTime(msgDate)}</span>${encBadge}${check}</div>`;
      } catch(e){ msg.innerHTML = senderNameHtml + `<div>[فيديو]</div><div class="msg-meta"><span>${formatTime(msgDate)}</span>${check}</div>`; }
    } else {
      let text = data.text || '';
      if(data.encrypted && text) text = await decryptText(text, ROOM_ID);
      msg.innerHTML = senderNameHtml + `<span>${escapeHtml(text)}</span><div class="msg-meta"><span>${formatTime(msgDate)}</span>${encBadge}${editedTag}${check}</div>`;
    }
  }
  row.appendChild(msg);
  area.appendChild(row);
  attachLongPress(msg, key, 'room');
}

async function renderChats(chats){
  const container = $('privateChatsContainer');
  if(!container) return;

  if(!ids.length){ container.innerHTML = ''; return; }
  const onlineSnap = await get(ref(db,'onlineUsers'));
  const online = onlineSnap.val() || {};
  const results = await Promise.all(ids.map(async otherId => {
    const otherUser = allUsers[otherId] || {name:'مستخدم', uid: otherId};
    const chatId = getChatId(currentUser.uid, otherId);
    const msgSnap = await get(query(ref(db,'chats/'+chatId+'/messages'), limitToLast(1)));
    let lastMsg = null;
    if(msgSnap.exists()){
      const vals = Object.values(msgSnap.val());
      lastMsg = vals[vals.length - 1];
    }
    const unreadSnap = await get(ref(db,'chats/'+chatId+'/unread/'+currentUser.uid));
    const unread = unreadSnap.exists() ? unreadSnap.val() : 0;
    return {otherUser, lastMsg, unread, chatId, isOnline: !!online[otherId]};
  }));
  results.sort((a,b) => (b.lastMsg?.timestamp||0) - (a.lastMsg?.timestamp||0));
  const html = await Promise.all(results.map(async ({otherUser, lastMsg, unread, chatId, isOnline}) => {
    const name = otherUser.name || 'مستخدم';
    const initial = name.charAt(0).toUpperCase();
    const avatarHtml = otherUser.photoURL ? `<img src="${otherUser.photoURL}">` : initial;
    const dot = isOnline ? '<div class="online-dot"></div>' : '';
    let lastText = 'اضغط للمحادثة';
    let checkIcon = '';
    if(lastMsg){
      if(lastMsg.deletedForAll) lastText = '🚫 رسالة محذوفة';
      else if(lastMsg.type === 'audio') lastText = '🎤 رسالة صوتية';
      else if(lastMsg.type === 'image') lastText = '📷 صورة';
      else if(lastMsg.type === 'video') lastText = '🎥 فيديو';
      else if(lastMsg.text){
        try { lastText = await decryptText(lastMsg.text, chatId); }
        catch { lastText = '[رسالة]'; }
      }
      if(lastMsg.senderId === currentUser.uid){
        const isRead = lastMsg.readBy && Object.keys(lastMsg.readBy).some(k => k !== currentUser.uid);
        checkIcon = `<i class="fas fa-check${isRead?'-double':''} check ${isRead?'read':''}"></i>`;
      }
    }
    const time = lastMsg ? formatTimeShort(new Date(lastMsg.timestamp)) : '';
    const badge = unread > 0 ? `<span class="badge">${unread}</span>` : '';
    const isMuted = mutedChats[otherUser.uid];
    const muteIcon = isMuted ? '<i class="fas fa-bell-slash mute-icon"></i>' : '';
    return `<div class="chat-item" data-uid="${otherUser.uid}" data-name="${escapeHtml(name)}" data-photo="${otherUser.photoURL||''}" data-phone="${otherUser.phone||''}">
      <div class="avatar">${avatarHtml}${dot}</div>
      <div class="details">
        <div class="name-row"><span class="name">${escapeHtml(name)}</span><span class="time">${time}</span></div>
        <div class="last-msg">${checkIcon}${escapeHtml(lastText).substring(0,50)}</div>
      </div>
      <div class="meta">${muteIcon}${badge}</div>
    </div>`;
  }));
  container.innerHTML = html.join('');
  document.querySelectorAll('#privateChatsContainer .chat-item').forEach(item => {
    bindTap(item, () => openChat(item.dataset.uid, item.dataset.name, item.dataset.photo));
  });
}

function attachLongPress(el, msgId, mode){
  if(!el || el.dataset.lpBound) return;
  el.dataset.lpBound = '1';
  let startX = 0, startY = 0, moved = false, fired = false, timer = null;
  const cancel = () => { if(timer){ clearTimeout(timer); timer = null; } };
  const start = (x, y) => {
    startX = x; startY = y; moved = false; fired = false;
    cancel();
    timer = setTimeout(() => {
      fired = true; timer = null;
      if(isSelectionMode) toggleMessageSelection(msgId, mode);
      else showContextMenu(msgId, x, y, mode);
      if(navigator.vibrate) navigator.vibrate(30);
    }, 500);
  };
  const move = (x, y) => { if(Math.abs(x - startX) > 12 || Math.abs(y - startY) > 12){ moved = true; cancel(); } };
  const end = () => { cancel(); if(fired || moved) return; if(isSelectionMode) toggleMessageSelection(msgId, mode); };
  el.addEventListener('touchstart', e => { const t = e.touches[0]; start(t.clientX, t.clientY); }, {passive: true});
  el.addEventListener('touchmove', e => { const t = e.touches[0]; move(t.clientX, t.clientY); }, {passive: true});
  el.addEventListener('touchend', end);
  el.addEventListener('touchcancel', cancel);
  el.addEventListener('mousedown', e => start(e.clientX, e.clientY));
  el.addEventListener('mousemove', e => { if(timer) move(e.clientX, e.clientY); });
  el.addEventListener('mouseup', end);
  el.addEventListener('mouseleave', cancel);
  el.addEventListener('contextmenu', e => e.preventDefault());
}

/* ============ قائمة السياق ============ */
function showContextMenu(msgId, x, y, mode){
  currentContextMsgId = msgId;
  const data = mode === 'room' ? roomMessages[msgId] : currentMessages[msgId];
  if(!data) return;
  currentContextMsgData = data;
  currentContextMsgData._mode = mode;
  const isMine = data.senderId === currentUser.uid;
  const canEdit = isMine && data.text && !data.deletedForAll && (Date.now() - data.timestamp < 15 * 60 * 1000);
  const canDeleteAll = isMine && !data.deletedForAll;
  let html = '';
  html += `<button data-ctx="reply"><i class="fas fa-reply"></i> رد</button>`;
  if(data.text && !data.deletedForAll) html += `<button data-ctx="copy"><i class="fas fa-copy"></i> نسخ</button>`;
  if(canEdit) html += `<button data-ctx="edit"><i class="fas fa-edit"></i> تعديل</button>`;
  html += `<button data-ctx="select"><i class="fas fa-check-square"></i> تحديد</button>`;
  html += `<button data-ctx="deleteMe" class="danger"><i class="fas fa-trash"></i> حذف لدي</button>`;
  if(canDeleteAll) html += `<button data-ctx="deleteAll" class="danger"><i class="fas fa-trash-alt"></i> حذف للجميع</button>`;
  const cm = $('contextMenu');
  cm.innerHTML = html;
  cm.style.visibility = 'hidden';
  cm.classList.add('show');
  const rect = cm.getBoundingClientRect();
  const vw = window.innerWidth, vh = window.innerHeight;
  let left = x, top = y;
  if(left + rect.width > vw - 10) left = vw - rect.width - 10;
  if(top + rect.height > vh - 10) top = vh - rect.height - 10;
  if(left < 10) left = 10;
  if(top < 10) top = 10;
  cm.style.left = left + 'px';
  cm.style.top = top + 'px';
  cm.style.visibility = '';
  cm.querySelectorAll('button').forEach(btn => {
    bindTap(btn, () => { cm.classList.remove('show'); handleContextAction(btn.dataset.ctx); });
  });
}

async function handleContextAction(action){
  if(!currentContextMsgId || !currentContextMsgData) return;
  const msgId = currentContextMsgId;
  const data = currentContextMsgData;
  const mode = data._mode || 'private';
  const chatId = mode === 'room' ? ROOM_ID : getChatId(currentUser.uid, currentChatUser.uid);
  const messagesPath = mode === 'room' ? `rooms/${ROOM_ID}/messages` : `chats/${chatId}/messages`;

  if(action === 'reply'){
    replyingTo = { id: msgId, senderId: data.senderId, text: data.text || '', encrypted: data.encrypted, type: data.type, mode };
    $('replyBar').classList.add('show');
    $('replyName').textContent = data.senderId === currentUser.uid ? 'أنت' : (mode === 'room' ? (data.senderName || 'مستخدم') : currentChatUser.name);
    let preview = '📎 مرفق';
    if(data.type === 'audio') preview = '🎤 رسالة صوتية';
    else if(data.type === 'image') preview = '📷 صورة';
    else if(data.type === 'video') preview = '🎥 فيديو';
    else if(data.text){ try { preview = await decryptText(data.text, chatId); } catch(e){} }
    $('replyText').textContent = preview.substring(0, 80);
    $('messageInput').focus();
  } else if(action === 'copy'){
    if(data.text){
      try {
        const text = data.encrypted ? await decryptText(data.text, chatId) : data.text;
        await navigator.clipboard.writeText(text);
        alert('✅ تم نسخ الرسالة');
      } catch(e){ alert('تعذّر النسخ'); }
    }
  } else if(action === 'edit'){
    $('editMsgInput').value = data.text ? await decryptText(data.text, chatId) : '';
    $('editMsgModal').classList.add('active');
    bindTap($('saveEditBtn'), async () => {
      const newText = $('editMsgInput').value.trim();
      if(!newText) return;
      const enc = await encryptText(newText, chatId);
      await update(ref(db, messagesPath+'/'+msgId), { text: enc, edited: true, editedAt: Date.now() });
      $('editMsgModal').classList.remove('active');
    });
  } else if(action === 'select'){
    enterSelectionMode();
    toggleMessageSelection(msgId, mode);
  } else if(action === 'deleteMe'){
    await update(ref(db, messagesPath+'/'+msgId+'/deletedFor'), {[currentUser.uid]: true});
    const el = document.querySelector(`[data-msg-id="${msgId}"]`);
    if(el) el.remove();
  } else if(action === 'deleteAll'){
    await update(ref(db, messagesPath+'/'+msgId), { deletedForAll: true, text: null, media: null, audio: null });
  }
  currentContextMsgId = null;
  currentContextMsgData = null;
}

function enterSelectionMode(){
  isSelectionMode = true;
  selectedMessages.clear();
  roomSelectedMessages.clear();
  $('selectionBar').classList.add('show');
  updateSelectionUI();
}
function exitSelectionMode(){
  isSelectionMode = false;
  selectedMessages.clear();
  roomSelectedMessages.clear();
  $('selectionBar').classList.remove('show');
  document.querySelectorAll('.message.selected').forEach(m => m.classList.remove('selected'));
}
function toggleMessageSelection(msgId, mode){
  const set = mode === 'room' ? roomSelectedMessages : selectedMessages;
  if(set.has(msgId)) set.delete(msgId); else set.add(msgId);
  const el = document.querySelector(`.message[data-msg-id="${msgId}"]`);
  if(el) el.classList.toggle('selected', set.has(msgId));
  updateSelectionUI();
}
function updateSelectionUI(){
  const total = selectedMessages.size + roomSelectedMessages.size;
  $('selCount').textContent = `${total} محدد`;
  if(total === 0) exitSelectionMode();
}
async function deleteSelected(){
  const total = selectedMessages.size + roomSelectedMessages.size;
  if(total === 0) return;
  if(!confirm(`حذف ${total} رسالة للجميع؟`)) return;
  const updates = {};
  if(selectedMessages.size && currentChatUser){
    const chatId = getChatId(currentUser.uid, currentChatUser.uid);
    for(const id of selectedMessages){
      const data = currentMessages[id];
      if(!data) continue;
      if(data.senderId === currentUser.uid){
        updates[`chats/${chatId}/messages/${id}/deletedForAll`] = true;
        updates[`chats/${chatId}/messages/${id}/text`] = null;
        updates[`chats/${chatId}/messages/${id}/media`] = null;
        updates[`chats/${chatId}/messages/${id}/audio`] = null;
      } else {
        updates[`chats/${chatId}/messages/${id}/deletedFor/${currentUser.uid}`] = true;
      }
    }
  }
  if(roomSelectedMessages.size){
    for(const id of roomSelectedMessages){
      const data = roomMessages[id];
      if(!data) continue;
      if(data.senderId === currentUser.uid){
        updates[`rooms/${ROOM_ID}/messages/${id}/deletedForAll`] = true;
        updates[`rooms/${ROOM_ID}/messages/${id}/text`] = null;
        updates[`rooms/${ROOM_ID}/messages/${id}/media`] = null;
        updates[`rooms/${ROOM_ID}/messages/${id}/audio`] = null;
      } else {
        updates[`rooms/${ROOM_ID}/messages/${id}/deletedFor/${currentUser.uid}`] = true;
      }
    }
  }
  await update(ref(db), updates);
  if(currentChatMode === 'room') loadRoomMessages();
  else if(currentChatUser) loadChatMessages(currentChatUser.uid);
}
async function copySelected(){
  const texts = [];
  for(const id of selectedMessages){
    const data = currentMessages[id];
    if(data && data.text){
      try {
        const chatId = getChatId(currentUser.uid, currentChatUser.uid);
        const t = data.encrypted ? await decryptText(data.text, chatId) : data.text;
        texts.push(t);
      } catch(e){}
    }
  }
  for(const id of roomSelectedMessages){
    const data = roomMessages[id];
    if(data && data.text){
      try {
        const t = data.encrypted ? await decryptText(data.text, ROOM_ID) : data.text;
        texts.push(`${data.senderName}: ${t}`);
      } catch(e){}
    }
  }
  if(texts.length){
    try {
      await navigator.clipboard.writeText(texts.join('\n'));
      alert(`✅ تم نسخ ${texts.length} رسالة`);
    } catch(e){ alert('تعذّر النسخ'); }
  }
  exitSelectionMode();
}

async function sendMessage(){
  if(!currentUser || !currentUserData) return;
  const text = $('messageInput').value.trim();
  if(!text || text.length > 1000) return;

  if(currentChatMode === 'room'){
    const encrypted = await encryptText(text, ROOM_ID);
    await push(ref(db,'rooms/'+ROOM_ID+'/messages'), {
      text: encrypted, encrypted: true,
      senderId: currentUser.uid,
      senderName: currentUserData.name,
      senderPhoto: currentUserData.photoURL || null,
      timestamp: Date.now()
    });
  } else {
    if(!currentChatUser) return;

    const payload = {
      text: encrypted, encrypted: true, senderId: currentUser.uid,
      timestamp: Date.now(), readBy: {}
    };

      payload.replyTo = {
        id: replyingTo.id, senderId: replyingTo.senderId,

    await push(ref(db,'chats/'+chatId+'/messages'), payload);

    await set(ref(db,'chats/'+chatId+'/unread/'+currentChatUser.uid), (unreadSnap.exists() ? unreadSnap.val() : 0) + 1);

async function sendMediaToChat(file){
  if(!currentChatUser && currentChatMode !== 'room') return alert('افتح محادثة أولاً');
  const isVideo = file.type.startsWith('video');
  const isImage = file.type.startsWith('image');
  if(!isVideo && !isImage) return alert('نوع الملف غير مدعوم');
  let processedFile = file;
  if(isImage){
    try { processedFile = await compressImage(file, 900, 0.7); } catch(e){}
  }
  const maxSize = isVideo ? 4 * 1024 * 1024 : 2 * 1024 * 1024;
  if(processedFile.size > maxSize) return alert(`الملف كبير جداً. الحد الأقصى ${isVideo ? '4' : '2'} ميجابايت`);
  const chatId = currentChatMode === 'room' ? ROOM_ID : getChatId(currentUser.uid, currentChatUser.uid);
  const ab = await processedFile.arrayBuffer();
  let encMedia;
  try { encMedia = await encryptBuffer(ab, chatId); }
  catch(e){ return alert('فشل معالجة الملف'); }
  if(encMedia.length > 600000) return alert('الملف كبير جداً بعد التشفير. جرب ملفاً أصغر');
  if(currentChatMode === 'room'){
    await push(ref(db,'rooms/'+ROOM_ID+'/messages'), {
      type: isVideo ? 'video' : 'image',
      media: encMedia, mime: processedFile.type, encrypted: true,
      senderId: currentUser.uid,
      senderName: currentUserData.name,
      senderPhoto: currentUserData.photoURL || null,
      timestamp: Date.now()
    });
  } else {
    await push(ref(db,'chats/'+chatId+'/messages'), {
      type: isVideo ? 'video' : 'image',
      media: encMedia, mime: processedFile.type, encrypted: true,
      senderId: currentUser.uid, timestamp: Date.now(), readBy: {}
    });
    await set(ref(db,'userChats/'+currentUser.uid+'/'+currentChatUser.uid), true);
    await set(ref(db,'userChats/'+currentChatUser.uid+'/'+currentUser.uid), true);
    const unreadSnap = await get(ref(db,'chats/'+chatId+'/unread/'+currentChatUser.uid));
    await set(ref(db,'chats/'+chatId+'/unread/'+currentChatUser.uid), (unreadSnap.exists() ? unreadSnap.val() : 0) + 1);
  }
}

/* ============ الصوت ============ */
let mediaRecorder = null, audioChunks = [], recordingStartTime = 0, recordingTimer = null, isRecording = false;
async function startRecording(){
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio: true});
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = []; recordingStartTime = Date.now(); isRecording = true;
    mediaRecorder.ondataavailable = e => { if(e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(audioChunks, {type: 'audio/webm'});
      await sendAudioMessage(blob);
    };
    mediaRecorder.start();
    $('micBtn').classList.add('recording');
    $('micBtn').innerHTML = '<i class="fas fa-stop"></i>';
    $('recordingIndicator').classList.add('show');
    recordingTimer = setInterval(() => {
      const secs = Math.floor((Date.now() - recordingStartTime) / 1000);
      $('recordingTime').textContent = formatDuration(secs);
      if(secs >= 60) stopRecording();
    }, 200);
  } catch(e){ alert('لا يمكن الوصول إلى الميكروفون: ' + e.message); }
}
function stopRecording(){
  if(mediaRecorder && isRecording){
    mediaRecorder.stop(); isRecording = false;
    clearInterval(recordingTimer);
    $('micBtn').classList.remove('recording');
    $('micBtn').innerHTML = '<i class="fas fa-microphone"></i>';
    $('recordingIndicator').classList.remove('show');
  }
}
function toggleMic(){ isRecording ? stopRecording() : startRecording(); }
async function sendAudioMessage(blob){
  if(!currentChatUser && currentChatMode !== 'room') return;
  const chatId = currentChatMode === 'room' ? ROOM_ID : getChatId(currentUser.uid, currentChatUser.uid);
  const duration = Math.round((Date.now() - recordingStartTime) / 1000);
  const ab = await blob.arrayBuffer();
  const encAudio = await encryptBuffer(ab, chatId);
  if(encAudio.length > 700000){ alert('التسجيل طويل جداً'); return; }
  if(currentChatMode === 'room'){
    await push(ref(db,'rooms/'+ROOM_ID+'/messages'), {
      type: 'audio', audio: encAudio, duration, encrypted: true,
      senderId: currentUser.uid,
      senderName: currentUserData.name,
      senderPhoto: currentUserData.photoURL || null,
      timestamp: Date.now()
    });
  } else {
    await push(ref(db,'chats/'+chatId+'/messages'), {
      type: 'audio', audio: encAudio, duration, encrypted: true,
      senderId: currentUser.uid, timestamp: Date.now(), readBy: {}
    });
    await set(ref(db,'userChats/'+currentUser.uid+'/'+currentChatUser.uid), true);
    await set(ref(db,'userChats/'+currentChatUser.uid+'/'+currentUser.uid), true);
    const unreadSnap = await get(ref(db,'chats/'+chatId+'/unread/'+currentChatUser.uid));
    await set(ref(db,'chats/'+chatId+'/unread/'+currentChatUser.uid), (unreadSnap.exists() ? unreadSnap.val() : 0) + 1);
  }
}

  const chatId = currentChatMode === 'room' ? ROOM_ID : getChatId(currentUser.uid, currentChatUser.uid);
  try {
    const buf = await decryptBuffer(btn.dataset.audio, chatId);
    const url = URL.createObjectURL(new Blob([buf], {type: 'audio/webm'}));
    const audio = new Audio(url);
    window.currentAudio = audio;
    icon.className = 'fas fa-pause';
    const pb = btn.parentElement.querySelector('.audio-progress .fill');

function renderStories(stories){
  const grid = $('storiesGrid');
  if(!grid) return;
  const now = Date.now(), DAY = 86400000;
  const list = Object.entries(stories).map(([id, s]) => ({id, ...s}))
    .filter(s => now - s.timestamp < DAY)
    .sort((a,b) => b.timestamp - a.timestamp);
  const html = list.map(s => {
    const initial = (s.name || 'U').charAt(0).toUpperCase();
    const avatar = s.photoURL ? `<img src="${s.photoURL}">` : initial;
    const bg = s.media && s.mediaType === 'image' ? `background-image:url('${s.media}');` : '';
    const isMine = s.uid === currentUser.uid;
    const del = isMine ? `<div class="delete-story" data-del="${s.id}"><i class="fas fa-trash"></i></div>` : '';
    const badge = isMine ? '<div class="my-story-badge">أنا</div>' : '';
    return `<div class="story-card" data-story-id="${s.id}" style="${bg}">${del}${badge}<div class="story-avatar">${avatar}</div><div class="story-name">${escapeHtml(s.name)}</div></div>`;
  }).join('');
  grid.innerHTML = `<div class="story-card add" id="addStoryBtn"><div class="plus">＋</div><div style="font-size:10.5px;margin-top:3px;">إضافة</div></div>${html}`;

  grid.querySelectorAll('.story-card[data-story-id]').forEach(card => {
    bindTap(card, () => viewStory(card.dataset.storyId, stories));

      e.stopPropagation();
      if(!confirm('حذف هذا الاستوري؟')) return;

    });
  });
}
async function publishStory(){

  const file = $('storyMediaInput').files[0];

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>لا يوجد اتصال</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:linear-gradient(135deg,#6d28d9,#8b5cf6);color:#fff;min-height:100vh;display:grid;place-items:center;padding:20px;text-align:center}
.box{max-width:400px}
.icon{font-size:100px;margin-bottom:20px;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
h1{font-size:28px;font-weight:900;margin-bottom:12px}
p{font-size:16px;line-height:1.7;opacity:.9;margin-bottom:24px}
button{background:#fff;color:#6d28d9;border:none;padding:14px 28px;border-radius:12px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit}
button:active{transform:scale(.95)}
</style>
</head>
<body>
<div class="box">
  <div class="icon">📡</div>
  <h1>لا يوجد اتصال بالإنترنت</h1>
  <p>يبدو أن هناك مشكلة في اتصالك بالشبكة. تحقق من الإنترنت وحاول مرة أخرى.</p>
  <button onclick="location.reload()">🔄 إعادة المحاولة</button>
</div>
</body>
</html>
